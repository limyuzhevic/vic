# NLM Configuration File Template
# Comprehensive configuration for NLM neural simulation framework
# 
# This file contains default configuration values for NLM Phase 6: Final Integration
# All values can be overridden by command-line arguments or environment variables

# Basic Simulation Parameters
[simulation]
random_seed = 42
neuron_count = 1000
region_count = 2
connection_probability = 0.15
simulation_timestep = 0.001
max_steps = 10000
output_frequency = 100

# Neural Dynamics Parameters
[neurons]
# LIF neuron parameters
resting_potential = -70.0
threshold = -55.0
reset_potential = -70.0
leak_conductance = 10.0
refractory_period = 5
adaptation_strength = 0.5

# Synaptic Properties
synapse_delay = 1
min_weight = -1.0
max_weight = 1.0
initial_excitatory_weight = 0.2
initial_inhibitory_weight = -0.2

# Plasticity Rules
[plasticity]
# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian parameters
hebbian_learning_rate = 0.01
hebbian_window = 50.0

# Structural plasticity
enable_synaptogenesis = true
synaptogenesis_rate = 0.0001
enable_pruning = true
pruning_rate = 0.00001

# Memory Systems
[memory]
working_memory_capacity = 100
working_memory_decay = 0.95
episodic_max_episodes = 1000
episodic_decay_rate = 0.9
associative_pattern_threshold = 0.7

# Neuromodulation
[neuromodulation]
# Dopamine system
dopamine_max_level = 1.0
dopamine_decay_rate = 0.99
dopamine_sensitivity = 0.5

# Curiosity system
curiosity_sensitivity = 0.3
curiosity_decay_rate = 0.95
novelty_threshold = 0.5

# Prediction Error
prediction_error_sensitivity = 0.4
prediction_error_decay = 0.98

# Cognition Systems
[cognition]
# Planning
planning_depth = 5
planning_horizon = 100
planning_stochasticity = 0.1

# Concept formation
concept_threshold = 0.6
concept_decay_rate = 0.9
concept_similarity_threshold = 0.7

# Attention
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_decay_rate = 0.95

# Development
[development]
initial_stage = "Initial"
critical_period_duration = 100.0
maturation_rate = 0.3
adult_plasticity_factor = 0.2
aging_factor = 0.01

# World Environment
[world]
world_width = 20
world_height = 20
vision_width = 8
vision_height = 8
max_energy = 100.0
energy_decay_rate = 0.99

# Agent Properties
[agent]
initial_x = 10
initial_y = 10
initial_orientation = 0.0
max_velocity = 5.0
angular_velocity = 1.0
health = 100.0
energy = 100.0

# Experiment Parameters
[experiments]
# Phase 6 integration
replay_interval = 100
consolidation_interval = 1000
memory_replay_episodes = 5

# Performance
[performance]
checkpoint_interval = 1000
checkpoint_compression = "balanced"
memory_pool_size = 10000
event_queue_size = 10000
enable_profiling = false
profile_duration = 30

# Output and Logging
[output]
log_level = "INFO"
log_file = "nlm.log"
output_directory = "./output"
create_visualizations = true
export_format = "json"

# Advanced Features
[advanced]
# Experimental features
enable_dev_debug_mode = false
enable_performance_optimizations = true
debug_breakpoints = false
enable_saving_intermediate_results = true

# Multi-region connectivity
enable_inter_region_connections = true
inter_region_delay = 2
inter_region_weight = 0.1

# Experimental variations
experimental_variant = "none"
experimental_parameter1 = 1.0
experimental_parameter2 = 1.0
experimental_parameter3 = 1.0

# Environment Variables
[environment]
default_vision_range = 8
resource_spawn_rate = 0.1
hazard_spawn_rate = 0.05
agent_energy_decay_per_step = 0.01

# Recommendations
# ================
# For performance: reduce neuron_count or increase timestep
# For detailed analysis: enable profiling and reduce output_frequency
# For debugging: enable dev_debug_mode and set log_level to "DEBUG"
# For research: try experimental_variant = "research" or "production"
