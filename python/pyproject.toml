# Python Package Configuration

This file contains the configuration for the enhanced NLM Python bindings package.

## Package Information

- **Name**: nlm-enhanced-bindings
- **Version**: 0.1.0
- **Description**: Enhanced Python bindings for NLM (Neural Learning Machine)
- **Author**: NLM Research Team
- **License**: MIT
- **Python Version**: 3.7+

## Dependencies

### Required Dependencies
```toml
[tool.poetry.dependencies]
python = "^3.7"
numpy = "^1.19.0"
pybind11 = "^2.10"
```

### Optional Dependencies
```toml
[tool.poetry.dependencies]
matplotlib = "^3.3.0"
pandas = "^1.2.0"
scikit-learn = "^0.24.0"
torch = "^1.9.0"
tensorflow = "^2.5.0"
```

## Build System

```toml
[tool.poetry.build]
# Build system configuration
```

## Linting and Formatting

```toml
[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.flake8]
max-line-length = 88
extend-ignore = E203, W503
max-complexity = 18
select = B,C,E,F,W,T4
```

## Testing

```toml
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "examples"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
```

## Coverage

```toml
[tool.coverage.run]
source = ["enhanced_bindings"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if __name__ in ('__main__', '__builtin__'):",
]
```

## Development

```toml
[tool.poetry.dev-dependencies]
black = "^20.0"
flake8 = "^3.9"
isort = "^5.0"
pytest = "^6.0"
coverage = "^5.0"
mypy = "^0.910"
pre-commit = "^2.15"
```

## Scripts

### Installation
```bash
poetry install
```

### Development Setup
```bash
poetry install --with dev
```

### Running Tests
```bash
pytest
pytest tests/
pytest examples/
```

### Linting
```bash
black enhanced_bindings examples tests
isort enhanced_bindings examples tests
flake8 enhanced_bindings examples tests
```

### Type Checking
```bash
mypy enhanced_bindings
```

### Formatting
```bash
black enhanced_bindings examples tests --check
```

### Pre-commit
```bash
pre-commit install
pre-commit run --all-files
```

