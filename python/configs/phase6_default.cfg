# Phase 6 Configuration File
# This is the default configuration for NLM Phase 6 integration tests

# Neural Network Configuration
neuron_count = 500
region_count = 1
connection_probability = 0.1

# Plasticity Configuration
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Structural Plasticity Configuration
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development Configuration
enable_development = true
development_rate = 0.001
maturation_rate = 0.0005

# Neuromodulation Configuration
dopamine_learning_rate = 0.01
curiosity_threshold = 0.5
novelty_sensitivity = 0.1

# Memory Configuration
working_memory_capacity = 100
episodic_memory_capacity = 1000

# Simulation Configuration
simulation_timestep = 0.001
max_steps = 2000
enable_checkpointing = true
enable_replay = true

# Experiment Configuration
enable_plasticity_experiment = true
enable_stdp_verification = true
enable_development_experiment = true

# Logging Configuration
log_level = info
log_file = nlm_phase6.log
enable_profiling = false

# Output Configuration
output_directory = ./output
checkpoint_path = ./checkpoint_test.bin
result_file = phase6_results.json

# Visualization Configuration
enable_visualization = false
visualization_output = phase6_viz.html

# Monitoring Configuration
enable_monitoring = true
monitoring_interval = 1.0

# Environment Configuration
world_size_x = 16
world_size_y = 16
world_boundary_type = reflecting

# Agent Configuration
agent_brain_enabled = true
agent_reward_modulation = true
agent_curiosity_enabled = true
agent_structural_plasticity = true

# Analysis Configuration
collect_metrics = true
compute_statistical_significance = true
sample_rate = 10

# Performance Configuration
optimize_for_performance = false
memory_efficient_mode = false
parallel_processing = false
