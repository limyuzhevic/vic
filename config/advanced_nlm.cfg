// Configuration template for advanced NLM users
// This file provides optimized settings for different use cases

# NLM Advanced Configuration Options
# Format: key = value  (value can be int, float, string, bool, or list)

# Performance Settings
performance {
    # Parallel processing settings
    enable_parallel_processing = true
    max_threads = 8
    
    # SIMD optimization level (0 = none, 1 = basic, 2 = advanced, 3 = full)
    simd_level = 2
    
    # Memory management
    memory_pool_size = 1024
    enable_memory_optimization = true
    
    # Network optimization
    enable_batch_processing = true
    batch_size = 32
    enable_caching = true
    cache_size_mb = 512
}

# Neural Network Settings
network {
    # Architecture settings
    default_neuron_count = 256
    default_population_size = 32
    default_region_count = 4
    
    # Learning parameters
    base_learning_rate = 0.1
    stdp_stdp_ltp = 0.01
    stdp_stdp_ltd = 0.012
    hebbian_learning_strength = 0.05
    
    # Development parameters
    development_rate = 0.1
    maturation_threshold = 1000.0
    critical_period_end = 500.0
}

# Memory System Settings
memory {
    working_memory {
        capacity = 100
        decay_rate = 0.95
        enable_attention = true
        competition_enabled = true
    }
    
    episodic_memory {
        max_episodes = 1000
        consolidation_threshold = 0.7
        replay_enabled = true
        replay_frequency = 0.1
    }
    
    semantic_memory {
        max_facts = 1000
        learning_rate = 0.1
        consolidation_threshold = 0.7
        enable_categories = true
    }
    
    procedural_memory {
        max_skills = 50
        learning_rate = 0.2
        consolidation_threshold = 0.6
        decay_rate = 0.98
        enable_planning = true
    }
    
    associative_memory {
        max_associations = 10000
        learning_rate = 0.05
        decay_rate = 0.98
        inhibition_strength = 0.3
        enable_spreading = true
        max_spread_steps = 5
    }
}

# Neuromodulation Settings
neuromodulation {
    dopamine {
        baseline_level = 0.1
        learning_signal_strength = 1.0
        plasticity_modifier = 1.0
    }
    
    novelty {
        sensitivity = 0.5
        decay_rate = 0.9
        threshold = 0.01
    }
    
    curiosity {
        exploration_rate = 0.1
        reward_prediction_error_weight = 0.5
        novelty_weight = 0.5
    }
    
    prediction_error {
        prediction_weight = 1.0
        learning_rate = 0.1
        reset_interval = 100
    }
}

# Agent Settings
agent {
    # Sensory processing
    vision_width = 8
    vision_height = 8
    touch_sensors = 8
    internal_sensors = 4
    proprioception_sensors = 6
    
    # Motor output
    motor_actions = 8
    action_selection_method = "competition"
    exploration_rate = 0.1
    
    # Cognitive features
    enable_reward_modulation = true
    enable_structural_plasticity = true
    enable_development = true
    enable_curiosity = true
    enable_planning = true
    
    # Behavior parameters
    action_repetition_threshold = 20
    novelty_seeking_threshold = 0.5
    reward_threshold = 0.1
}

# World Settings
world {
    width = 20
    height = 20
    gravity = 9.8
    timestep = 0.1
    physics_enabled = true
    
    # Environmental factors
    resource_density = 0.1
    hazard_density = 0.05
    wall_thickness = 1
    temperature_variance = 0.1
    
    # Simulation settings
    enable_time_of_day = false
    enable_weather = false
    enable_dynamic_obstacles = true
}

# Development Settings
development {
    # Synaptogenesis
    synaptogenesis_rate = 0.001
    initial_synaptic_connections = 10
    
    # Pruning
    pruning_rate = 0.0001
    minimum_connection_strength = 0.01
    developmental_pruning_enabled = true
    
    # Maturation
    maturation_rate = 0.05
    adult_property_threshold = 1000.0
    plasticity_decay_rate = 0.1
}

# Prediction Settings
prediction {
    enable_action_consequence = true
    prediction_horizon = 5
    temporal_memory_size = 100
    prediction_accuracy_threshold = 0.8
    
    # Learning parameters
    sequence_learning_rate = 0.1
    reward_prediction_weight = 0.7
    outcome_prediction_weight = 0.3
}

# Visualization Settings
visualization {
    enable_visualization = true
    render_mode = "terminal"  # terminal, file, network
    update_rate = 10  # Hz
    output_directory = "visual_output"
    
    # Display settings
    show_neurons = true
    show_synapses = true
    show_activities = true
    show_memory_content = true
    
    # Colors and styles
    neuron_color_scheme = "gradient"
    background_color = "black"
    neuron_size = 1.0
}

# Logging Settings
logging {
    level = "info"  # debug, info, warn, error
    file {
        enable_file_logging = true
        directory = "logs"
        filename = "nlm_simulation.log"
        max_file_size_mb = 100
        max_files = 10
    }
    
    # Console output
    enable_console = true
    console_colors = true
    
    # Network logging
    enable_network_logging = true
    log_all_connections = true
}

# Experiment Settings
experiment {
    # Experiment configuration
    name = "default_experiment"
    description = "Default NLM experiment configuration"
    author = "NLM Team"
    
    # Performance targets
    target_stability = 0.9
    target_learning_rate = 0.5
    target_accuracy = 0.8
    
    # Metrics to track
    track_neural_activity = true
    track_memory_usage = true
    track_learning_progress = true
    track_behavioral_patterns = true
}

# Security and Privacy Settings
security {
    # Data protection
    enable_data_encryption = false
    anonymize_agent_data = true
    
    # Access control
    require_authentication = false
    max_connections = 1
    
    # Monitoring
    enable_activity_logging = true
    log_security_events = true
}

# Network Configuration
network {
    # Connection settings
    connection_timeout = 30
    retry_attempts = 3
    
    # Protocol settings
    use_secure_protocol = false
    compression_enabled = true
    
    # Bandwidth settings
    max_bandwidth_mb = 100
    chunk_size = 1024
}

# Resource Management
resources {
    # CPU limits
    cpu_limit_percentage = 80
    enable_cpu_throttling = true
    
    # Memory limits
    memory_limit_mb = 1024
    enable_memory_monitoring = true
    gc_frequency = 100
    
    # Storage limits
    storage_limit_mb = 500
    enable_backup = true
    backup_interval = 1000
}

# Legal and Compliance
legal {
    # License information
    license_type = "research"
    allow_commercial_use = false
    require_attribution = true
    
    # Compliance
    gdpr_compliant = true
    privacy_policy_url = "https://nlm.ai/privacy"
    terms_of_service_url = "https://nlm.ai/terms"
}

# Extensions and Plugins
plugins {
    # Available plugins
    enable_plugin_system = true
    
    # Plugin configurations
    custom_plugins = []
    plugin_directory = "plugins"
    auto_load_plugins = false
}
