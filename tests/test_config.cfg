# Test Configuration
# ============
#
# This file configures the test suite for the NLM project.
# 
# To run tests:
#   mkdir build
#   cd build
#   cmake ..
#   make
#   ./nlm_tests
#

# Test categories
TEST_CATEGORY_UNIT=1
TEST_CATEGORY_INTEGRATION=2
TEST_CATEGORY_PERFORMANCE=3
TEST_CATEGORY_STRESS=4

# Test output format
TEST_OUTPUT_FORMAT=text

# Test timeout (in seconds)
TEST_TIMEOUT=300

# Test verbosity level (0=quiet, 1=normal, 2=verbose)
TEST_VERBOSITY=1

# Enable/disable specific test suites
TEST_UNIT_ENABLED=true
TEST_INTEGRATION_ENABLED=true
TEST_PERFORMANCE_ENABLED=false
TEST_STRESS_ENABLED=false

# Test directories
TEST_DIR_UNIT=tests/unit
TEST_DIR_INTEGRATION=tests/integration
TEST_DIR_PERFORMANCE=tests/performance
TEST_DIR_STRESS=tests/stress

# Log file for test results
TEST_LOG_FILE=tests/test_results.log

# Performance test iterations
PERFORMANCE_TEST_ITERATIONS=100

# Stress test duration (in seconds)
STRESS_TEST_DURATION=60

# Memory limit for stress tests (in MB)
MEMORY_LIMIT_MB=1024
