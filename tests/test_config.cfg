# Test Configuration
# This file provides configuration options for running the NLM test suite

# Test execution modes
mode = all_tests  # all_tests, single_test, benchmark

# Test filtering
filter_categories =  # Comma-separated list of categories to run
filter_patterns =    # Comma-separated list of test patterns to match

# Performance settings
max_execution_time = 10000  # Maximum execution time in milliseconds
benchmark_mode = false     # Enable benchmark mode
verbose_output = true      # Enable verbose output

# Result settings
output_results = true      # Output test results to file
results_file = test_results.json

# Parallel execution
parallel_execution = false
num_workers = 4

# Debug settings
debug_mode = false
print_memory_usage = false
print_timing_details = true

# Test configuration
test_config {
    # Core test configuration
    neuron_tests {
        neuron_creation = true
        neuron_type_tests = true
        membrane_potential_tests = true
        firing_state_tests = true
        current_injection_tests = true
        synaptic_input_tests = true
        spike_history_tests = true
        random_initialization_tests = true
        reset_tests = true
    }
    
    synapse_tests {
        synapse_creation_tests = true
        synapse_weight_tests = true
        synapse_weight_bounds_tests = true
        synapse_type_tests = true
        synapse_delay_tests = true
        synapse_spike_history_tests = true
        synapse_eligibility_trace_tests = true
        synapse_efficacy_tests = true
        synapse_random_initialization_tests = true
        synapse_reset_tests = true
        synapse_plasticity_flags_tests = true
    }
    
    brain_tests {
        brain_initialization_tests = true
        connectivity_tests = true
        plasticity_tests = true
        stability_tests = true
    }
}
