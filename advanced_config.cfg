# Advanced NLM Configuration
# This file provides advanced configuration options for NLM users

# Network Topology Configuration
[network]
# Number of neurons to create
neuron_count = 1000

# Number of brain regions for modular organization
region_count = 4

# Connection probability (0.0 to 1.0) - higher values create denser networks
connection_probability = 0.15

# Maximum connections per neuron
max_connections_per_neuron = 50

# Network topology type: "random", "small_world", "scale_free"
topology_type = "random"

# Network size scaling factors (for scale-free networks)
scale_free_alpha = 2.0
scale_free_beta = 1.0

# Neuron Type Distribution
[neuron_types]
# Percentage of sensory neurons (0-100)
sensory_percentage = 20.0

# Percentage of motor neurons (0-100)
motor_percentage = 10.0

# Percentage of interneurons (0-100)
interneuron_percentage = 50.0

# Percentage of output neurons (0-100)
output_percentage = 20.0

# LIF Neuron Parameters
[neuron]
# Membrane potential parameters
resting_potential = -70.0
threshold = -55.0
reset_potential = -70.0

# Time constants (ms)
membrane_time_constant = 20.0
refractory_period = 5.0
adaptation_time_constant = 100.0

# Conductances (nS)
leak_conductance = 10.0
max_synaptic_conductance = 1.0

# Input parameters
inject_excitatory_current = 50.0
inject_inhibitory_current = -20.0

# Synaptic Properties
[synapses]
# Default synapse weight
initial_weight = 0.5

# Weight limits
max_weight = 2.0
min_weight = -2.0

# Synaptic delay (ms)
default_delay = 1.0
max_delay = 10.0

# Short-term plasticity
tau_facilitation = 100.0
tau_depression = 200.0
U_max = 1.0

# Plasticity Configuration
[plasticity]
# Enable/disable plasticity rules
enable_hebbian = true
enable_stdp = true
enable_reward_modulated = true
enable_structural = true

# Hebbian parameters
hebbian_learning_rate = 0.01
hebbian_max_weight = 2.0
hebbian_min_weight = -2.0

# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_max_weight = 2.0
stdp_min_weight = -2.0

# Reward-modulated STDP
reward_stdp_gain = 0.5
reward_eligibility_trace_tau = 100.0

# Structural plasticity
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
min_weight_for_pruning = 0.1
max_synapses_per_neuron = 100

# Development Configuration
[development]
# Enable developmental stages
enable_development = true

# Developmental stages
stage_count = 5

# Stage properties (expressed as percentages of initial values)
[development.stage_1]
plasticity_rate = 1.0
excitability = 1.0
defense = 0.5
learning_rate = 1.0

[development.stage_2]
plasticity_rate = 0.8
excitability = 1.0
