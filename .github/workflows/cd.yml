name: CD

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up C++ environment
        uses: actions/setup-cpp@v1
        with:
          cpp-compiler: g++
          ninja-version: '1.11.1'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11 pytest numpy
          pip install -e .[dev]
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DNLM_BUILD_PYTHON_BINDINGS=ON
      
      - name: Build
        run: |
          cd build
          make -j4
      
      - name: Run Tests
        run: |
          cd build
          ./nlm_test_suite 2>&1 | tee test_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "C++ tests failed"
            exit 1
          fi
          
          pytest tests/ 2>&1 | tee pytest_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Python tests failed"
            exit 1
          fi
      
      - name: Test Python Bindings
        run: |
          python -c "import pynlm; print('Python bindings imported successfully')"
      
      - name: Create Release Artifact
        run: |
          cd build
          # Create a comprehensive artifact with all build outputs
          mkdir -p artifacts
          cp nlm nlm_phase6_demo nlm_benchmark *.so artifacts/ 2>/dev/null || true
          cp test_output.log pytest_output.log artifacts/ 2>/dev/null || true
          echo "${{ github.sha }}" > artifacts/commit.txt
          echo "${{ github.ref_name }}" > artifacts/branch.txt
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlm-build-${{ matrix.build_type }}
          path: build/artifacts/
          retention-days: 30
  
  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nlm-build-Release
          path: artifacts
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          twine check artifacts/pynlm/dist/*
          twine upload artifacts/pynlm/dist/*
  
  deploy:
    name: Deploy Documentation
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build Documentation
        run: |
          python -m pip install -e .[dev]
          # Build API documentation if available
          if [ -f docs/conf.py ]; then
            cd docs
            sphinx-build -b html . _build/html
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
      
      - name: Update API Documentation
        run: |
          echo "Documentation deployed to GitHub Pages"
          echo "Visit: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"