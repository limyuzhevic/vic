name: NLM Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'  # Run at 4 AM UTC daily
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependency check tools
        run: |
          pip install safety \
            pip-audit \
            pipdeptree \
            vulnerablecode-client

      - name: Check Python dependencies
        run: |
          # Safety check for Python dependencies
          safety check --json --output safety-report.json

          # pip-audit for Python packages
          pip-audit --json --output audit-report.json

      - name: Check C/C++ dependencies
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y checksec
          echo "Checking compiled binaries..."
          find . -name "*.so" -o -name "*.a" -o -name "*.exe" | head -5 | xargs -I {} sh -c 'echo "Checking {}:" && checksec {}'

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            safety-report.json
            audit-report.json
          retention-days: 7

  code-scanning:
    runs-on: ubuntu-latest
    name: Code Scanning and Analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            git \
            libclang-dev \
            lcov

      - name: Configure and build with instrumentation
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --config Debug --parallel 4

      - name: Run Clang Static Analyzer
        run: |
          cd build
          scan-build -o scan-build-results make

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          language: 'cpp'
          source-directory: 'build'

      - name: Run Bandit for Python
        uses: reviewdog/action-bandit@v1
        with:
          src: 'python'

      - name: Upload code scanning results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: code-scanning-results
          path: |
            scan-build-results/
          retention-days: 30

  container-security:
    runs-on: ubuntu-latest
    name: Container Security Analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          mkdir -p ~/.docker
          echo '{"experimental": true}' > ~/.docker/config.json

      - name: Build development container
        run: |
          docker build -t nlm-dev -f Dockerfile.dev .

      - name: Run Trivy vulnerability scanner
        run: |
          pip install trivy
          trivy image nlm-dev --format json --output trivy-results.json

      - name: Check for vulnerabilities
        run: |
          if python3 -c "
          import json
          with open('trivy-results.json') as f:
              results = json.load(f)
          vulnerabilities = sum(1 for result in results.get('Results', []) for vuln in result.get('Vulnerabilities', []))
          print(f'Total vulnerabilities: {vulnerabilities}')
          if vulnerabilities > 0:
              raise SystemExit('Vulnerabilities found')
          " 2>/dev/null; then
            echo "No critical vulnerabilities found"
          else
            echo "Vulnerabilities detected - review trivy-results.json"
            exit 1
          fi

      - name: Upload container scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: container-scan-results
          path: trivy-results.json
          retention-days: 30

  secrets-detection:
    runs-on: ubuntu-latest
    name: Secrets and Sensitive Data Detection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install secrets detection tools
        run: |
          pip install detect-secrets \
            git-secrets \
            gitleaks

      - name: Run Detect Secrets
        run: |
          detect-secrets --scan $(git ls-files) > secrets-detection.txt

      - name: Run GitLeaks
        run: |
          gitleaks detect --source . --report-path gitleaks-report.json

      - name: Run Git Secrets
        run: |
          git secrets --register-aws --global
          git secrets --register-github --global
          git secrets --install
          git secrets --run

      - name: Check for API keys and tokens
        run: |
          grep -r "api_key\|api_token\|password\|secret" --include="*.py" --include="*.cpp" --include="*.h" --include="*.md" . | grep -v ".git" | head -10

      - name: Upload secrets detection results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: secrets-detection-results
          path: |
            secrets-detection.txt
            gitleaks-report.json
          retention-days: 7

  license-compliance:
    runs-on: ubuntu-latest
    name: License Compliance Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install license check tools
        run: |
          pip install licensee \
            scancode-toolkit

      - name: Check licenses with licensee
        run: |
          licensee --json --exclude "testdata" > license-report.json

      - name: Check licenses with ScanCode
        run: |
          scancode --json --unknown --exclude "testdata" > scancode-results.json .

      - name: Validate MIT license compliance
        run: |
          python3 -c "
          import json
          with open('license-report.json') as f:
              report = json.load(f)
          
          # Check for non-MIT licenses
          mit_compliant = True
          for file_info in report:
              license = file_info.get('license', '')
              if license and license.lower() != 'mit' and license.lower() != 'mit license':
                  mit_compliant = False
                  print(f'Non-MIT license found: {license} in {file_info[\"filename\"]}')
          
          if not mit_compliant:
              raise SystemExit('License compliance check failed')
          else:
              print('All licenses are MIT compatible')
          "

      - name: Upload license reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: license-reports
          path: |
            license-report.json
            scancode-results.json
          retention-days: 30

  compliance-report:
    runs-on: ubuntu-latest
    name: Generate Compliance Report
    needs: [dependency-check, code-scanning, container-security, secrets-detection, license-compliance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all security artifacts
        uses: actions/download-artifact@v3
        with:
          path: security-artifacts

      - name: Generate security compliance report
        run: |
          cat > SECURITY_COMPLIANCE.md << EOF
          # NLM Security Compliance Report
          
          ## Generated: $(date)
          
          ## Dependency Security
          - Python package security: $(if [ -f "security-artifacts/dependency-check/safety-report.json" ]; then echo "✅ PASSED"; else echo "❌ FAILED"; fi)
          - Python audit results: $(if [ -f "security-artifacts/dependency-check/audit-report.json" ]; then echo "✅ COMPLETED"; else echo "❌ MISSING"; fi)
          - C/C++ dependency security: $(if [ -f "security-artifacts/dependency-check/security-reports.json" ]; then echo "✅ COMPLETED"; else echo "❌ MISSING"; fi)
          
          ## Code Scanning
          - Clang Static Analyzer: $(if [ -d "security-artifacts/code-scanning/scan-build-results" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          - CodeQL Analysis: $(if [ -f "security-artifacts/code-scanning/codeql-results.sarif" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          - Bandit Python Analysis: $(if [ -f "security-artifacts/code-scanning/bandit-results.json" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          
          ## Container Security
          - Docker vulnerability scan: $(if [ -f "security-artifacts/container-security/trivy-results.json" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          
          ## Secrets Detection
          - Detect Secrets scan: $(if [ -f "security-artifacts/secrets-detection/secrets-detection.txt" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          - GitLeaks scan: $(if [ -f "security-artifacts/secrets-detection/gitleaks-report.json" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          - Git Secrets scan: $(if [ -f "security-artifacts/secrets-detection/git-secrets-results.txt" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          
          ## License Compliance
          - License verification: $(if [ -f "security-artifacts/license-compliance/license-report.json" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          - ScanCode analysis: $(if [ -f "security-artifacts/license-compliance/scancode-results.json" ]; then echo "✅ COMPLETED"; else echo "❌ FAILED"; fi)
          
          ## Overall Status
          - Total checks passed: $(find security-artifacts -name "*.json" -type f | wc -l)
          - Total checks failed: $(find security-artifacts -name "*FAILED*" -type f | wc -l)
          
          ## Recommendations
          1. Address any failed security checks above
          2. Update dependencies with known vulnerabilities
          3. Implement secrets management for production environments
          4. Regular security scanning schedule
          
          ## Security Contact
          For security issues, please contact: security@nlm-project.org
          
          EOF

      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        with:
          name: security-compliance-report
          path: SECURITY_COMPLIANCE.md
          retention-days: 30

      - name: Deploy compliance report
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          commit_message: "Update security compliance report"

  notification:
    runs-on: ubuntu-latest
    name: Security Notification
    needs: compliance-report
    if: failure()
    steps:
      - name: Notify security failure
        run: |
          echo "Security pipeline failed!"
          echo "Security compliance issues detected."
          echo "Please review the security compliance report."
