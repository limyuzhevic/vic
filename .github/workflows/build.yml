name: NLM Build Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CXXFLAGS: "-O2 -march=native -flto"
  CMAKE_BUILD_TYPE: Release
  SKIP_TESTING: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release, RelWithDebInfo]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
        exclude:
          - os: windows-latest
            build_type: RelWithDebInfo
    name: Build (${{ matrix.os }} - ${{ matrix.build_type }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              cmake \
              git \
              pkg-config \
              python3-dev \
              python3-pip \
              libopenblas-dev \
              liblapack-dev \
              doxygen \
              graphviz
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install cmake git python3 doxygen graphviz
          fi

      - name: Set up dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install python git

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: x64

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_TESTING=OFF

      - name: Build with CMake
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Build Python bindings with scikit-build
        if: runner.os != 'Windows'
        run: |
          pip install scikit-build-core pybind11
          python -m pip install --no-build-isolation scikit-build-core pybind11
          cd python
          python -m pip install --no-build-isolation -e .

      - name: Build with scikit-build (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install scikit-build-core pybind11
          cd python
          python -m pip install --no-build-isolation -e .

      - name: Create build artifacts
        run: |
          mkdir -p artifacts/${{ matrix.os }}/${{ matrix.build_type }}
          cp -r build/*.so artifacts/${{ matrix.os }}/${{ matrix.build_type }}/ 2>/dev/null || true
          cp -r build/*.dll artifacts/${{ matrix.os }}/${{ matrix.build_type }}/ 2>/dev/null || true
          cp -r build/*.exe artifacts/${{ matrix.os }}/${{ matrix.build_type }}/ 2>/dev/null || true
          cp -r build/*.lib artifacts/${{ matrix.os }}/${{ matrix.build_type }}/ 2>/dev/null || true
          cp -r build/*.a artifacts/${{ matrix.os }}/${{ matrix.build_type }}/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: artifacts/
          retention-days: 7

  cross-compilation:
    runs-on: ubuntu-latest
    name: Cross-compilation Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            g++-x86_64-linux-gnu \
            cmake

      - name: Configure CMake for cross-compilation
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64

      - name: Build with cross-compilation
        run: |
          cmake --build build --parallel 4

  package-analysis:
    runs-on: ubuntu-latest
    name: Package Analysis
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Analyze packages
        run: |
          find artifacts -name "*.so" -o -name "*.dll" -o -name "*.exe" -o -name "*.lib" -o -name "*.a" | head -20

  bundle-analysis:
    runs-on: ubuntu-latest
    name: Bundle Analysis
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3

      - name: Check bundle sizes
        run: |
          total_size=0
          for os_artifact in build-*; do
            for build_artifact in $os_artifact/*; do
              if [ -d "$build_artifact" ]; then
                for file in "$build_artifact"/*; do
                  size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo 0)
                  total_size=$((total_size + size))
                done
              fi
            done
          done
          echo "Total bundle size: $(($total_size / 1024 / 1024)) MB"
