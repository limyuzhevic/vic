# GitHub Actions workflow for NLM CI/CD
name: NLM CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'
  CMAKE_BUILD_TYPE: Release

jobs:
  # Build and test on multiple platforms
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cpp_compiler: g++
            python_implementation: CPython
          - os: macos-latest
            cpp_compiler: clang++
            python_implementation: CPython
          - os: windows-latest
            cpp_compiler: cl
            python_implementation: CPython

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: x64

    - name: Set up C++ compiler
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          echo "CXX=g++" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "CXX=cl" >> $GITHUB_ENV
          echo "CC=clang-cl" >> $GITHUB_ENV
        fi

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          libpython3-dev \
          python3-dev \
          libopenmpi-dev \
          liblapack-dev \
          libatlas-base-dev \
          pkg-config \
          valgrind \
          gprof \
          clang-tidy-12 \
          clang-format-12

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake git python3 openmpi lapack

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake git python openmpi lapack

    - name: Set up Docker Buildx (for container builds)
      if: matrix.os == 'ubuntu-latest'
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
      id: docker-build
      uses: docker/build-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DENABLE_TESTS=ON \
          -DENABLE_VALIDATION=ON \
          -DBUILD_EXAMPLES=ON \
          -DNLM_PYTHON_BINDINGS=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build NLM
      run: |
        cd build
        cmake --build . --parallel $(nproc) --config ${{ env.CMAKE_BUILD_TYPE }}

    - name: Run C++ tests
      run: |
        cd build
        if [[ -f "CTestTestfile.cmake" ]]; then
          ctest --output-on-failure --timeout 300
        fi

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install scikit-build-core pybind11 numpy pytest pytest-cov pytest-html

    - name: Build Python bindings
      run: |
        pip install -e .[dev]

    - name: Run Python tests
      run: |
        pytest tests/ \
          --cov=pynlm \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-config=.coveragerc

    - name: Run benchmarks
      run: |
        if [[ -f "build/benchmark" ]]; then
          ./build/benchmark --benchmark_out=benchmark_results.json \
                          --benchmark_out_format=json
        fi

    - name: Run performance tests
      run: |
        if [[ -f "build/performance_tests" ]]; then
          ./build/performance_tests --output performance_metrics.json
        fi

    - name: Code style checks
      run: |
        if command -v clang-format >/dev/null 2>&1; then
          find src -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format --dry-run --Werror
        fi

        if command -v cppcheck >/dev/null 2>&1; then
          cppcheck --enable=all --insecure --warnings-as-errors src/
        fi

    - name: Static analysis
      run: |
        if command -v clang-tidy >/dev/null 2>&1; then
          find src -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-tidy -p build/
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: |
          build/ctest-*.xml
          test_results/
          htmlcov/
          benchmark_results.json
          performance_metrics.json
        retention-days: 7

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-artifacts-${{ matrix.os }}
        path: |
          build/
          dist/
          *.egg-info/
        retention-days: 30

    - name: Generate test report
      if: always()
      run: |
        python scripts/generate_test_report.py
      shell: python

  # Quality assurance and security scanning
  quality:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download test results
      uses: actions/download-artifact@v3
      with:
        name: test-results-ubuntu-latest
        path: test_results/

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts-ubuntu-latest
        path: build/

    - name: Code linting
      run: |
        # Install linting tools
        pip install flake8 black isort mypy

        # Run flake8
        flake8 src/ python/ tests/

        # Run black
        black --check src/ python/ tests/

        # Run isort
        isort --check-only src/ python/ tests/

        # Run mypy
        mypy src/ python/

    - name: Code coverage analysis
      run: |
        # Generate coverage report
        coverage report --fail-under=80
        coverage html
        coverage xml

    - name: Security scanning
      run: |
        # Install security scanners
        pip install safety bandit semgrep

        # Run safety audit
        safety check

        # Run bandit
        bandit -r src/ -f json -o bandit-report.json

        # Run semgrep
        semgrep --config=auto src/

    - name: License check
      run: |
        # Check for license headers
        find src/ python/ -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.py" | xargs grep -L "MIT License" || true

    - name: Dependency check
      run: |
        # Check for vulnerable dependencies
        pip install pipdeptree
        pipdeptree -d --warn silence > dependency_tree.txt

    - name: Create quality report
      run: |
        python scripts/generate_quality_report.py
      shell: python

    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports
        path: |
          quality_report.html
          quality_report.json
          bandit-report.json
          dependency_tree.txt
        retention-days: 30

  # Documentation generation
  docs:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts-ubuntu-latest
        path: build/

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        pip install sphinx sphinx-rtd-theme breathe myst-parser

    - name: Generate API documentation
      run: |
        cd docs
        sphinx-build -b html . _build/html
        sphinx-build -b latex . _build/latex
        sphinx-build -b man . _build/man

    - name: Generate C++ documentation
      run: |
        if [[ -f "build/compile_commands.json" ]]; then
          doxygen Doxyfile
        fi

    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html

  # Release management
  release:
    runs-on: ubuntu-latest
    needs: [build, quality, docs]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts-ubuntu-latest
        path: build/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/nlm
          build/nlm_*.demo
          build/lib*.a
          build/*.so
          build/*.dylib
          build/*.dll
          dist/*
          LICENSE
          README.md
        generate_release_notes: true
        draft: false
        prerelease: false

    - name: Create Docker image release
      if: needs.build.result == 'success'
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Homebrew formula (macOS)
      run: |
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          # Update Homebrew formula if exists
          if [[ -f "./homebrew-tap/nlm.rb" ]]; then
            git clone https://github.com/$(github.repository_owner)/homebrew-tap.git homebrew-tap
            cp ./homebrew-tap/nlm.rb homebrew-tap/Formula/
            # Update version and checksum
            sed -i "s/version = .*/version = '${{ github.ref_name }}'/" homebrew-tap/Formula/nlm.rb
            # Calculate checksum and update
            cd homebrew-tap
            brew update
            brew audit Formula/nlm.rb
            brew bump-formula-pr Formula/nlm.rb
          fi
        fi

    - name: Update Conda recipe
      run: |
        if [[ -f "./conda-recipe/nlm/meta.yaml" ]]; then
          conda update -n base -c conda-forge conda-build
          conda build conda-recipe/nlm --output-folder conda-packages
          anaconda upload conda-packages/linux-64/nlm-*.tar.bz2
        fi

  # Nightly builds
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Build nightly version
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DNIGHTLY_BUILD=ON
        cmake --build . --parallel $(nproc)
        ctest --output-on-failure

    - name: Create nightly artifacts
      run: |
        mkdir -p nightly
        cp build/nlm nightly/nlm-nightly
        cp -r build/*.so nightly/ 2>/dev/null || true
        cp -r build/*.dylib nightly/ 2>/dev/null || true
        cp -r build/*.dll nightly/ 2>/dev/null || true

    - name: Upload nightly artifacts
      uses: actions/upload-artifact@v3
      with:
        name: nightly-build
        path: nightly/
        retention-days: 7

    - name: Notify on failure
      if: failure()
      run: |
        curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"NLM Nightly build failed"}' \
          ${{ secrets.SLACK_WEBHOOK }}