name: NLM CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Customize based on your project requirements
  CXX_STANDARD: 20
  BUILD_TYPE: Release
  NLM_TEST_TIMEOUT: 300

jobs:
  # Linux builds
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug, RelWithDebInfo]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          ninja-build \
          python3 \
          python3-pip \
          python3-dev \
          libpython3-dev
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DNLM_BUILD_PYTHON_BINDINGS=OFF \
          ..
    
    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel 4
    
    - name: Run Tests
      run: |
        cd build
        if [ -f ./nlm_test ]; then
          timeout ${{ env.NLM_TEST_TIMEOUT }} ./nlm_test || echo "Tests completed with warnings"
        else
          echo "No test executable found, skipping tests"
        fi
    
    - name: Run Demos
      run: |
        cd build
        # Run different demos based on build type
        if [ -f ./nlm_phase6_demo ]; then
          timeout 60 ./nlm_phase6_demo || echo "Phase 6 demo completed with warnings"
        fi
        if [ -f ./nlm_benchmark ]; then
          timeout 120 ./nlm_benchmark || echo "Benchmark completed with warnings"
        fi
    
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-${{ matrix.build_type }}
        path: |
          build/
        retention-days: 7

  # Python bindings build
  build-python:
    name: Build Python Bindings
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: 'x64'
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install setuptools wheel ninja scikit-build-core pybind11
    
    - name: Build Python module
      run: |
        mkdir -p build-python
        cd build-python
        cmake \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DNLM_BUILD_PYTHON_BINDINGS=ON \
          ..
        cmake --build . --config Release --parallel 4
    
    - name: Test Python module
      run: |
        cd build-python
        python3 -c "import sys; sys.path.insert(0, '.'); from pynlm import *; print('Python module import successful')"
    
    - name: Upload Python artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-bindings
        path: |
          build-python/
        retention-days: 7

  # Performance benchmarks
  benchmarks:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-build-Release
        path: build
    
    - name: Run performance benchmarks
      run: |
        cd build
        echo "Running comprehensive performance benchmarks..."
        
        # Run benchmark executable if available
        if [ -f ./nlm_benchmark ]; then
          echo "Running benchmark suite..."
          timeout 300 ./nlm_benchmark || echo "Benchmark completed"
        fi
        
        # Run integration tests
        if [ -f ./nlm_phase6_demo ]; then
          echo "Running integration test..."
          timeout 180 ./nlm_phase6_demo || echo "Integration test completed"
        fi
    
    - name: Generate benchmark report
      run: |
        cd build
        if [ -f benchmark_results.txt ]; then
          echo "Benchmark report available:"
          cat benchmark_results.txt
        fi

  # Cross-platform testing
  test-cross-platform:
    name: Cross-platform Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ ninja-build
    
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake
    
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
    
    - name: Configure CMake
      run: |
        mkdir build-test
        cd build-test
        cmake \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Debug \
          ..
    
    - name: Build
      run: |
        cd build-test
        cmake --build . --config Debug --parallel 2
    
    - name: Run unit tests
      run: |
        cd build-test
        if [ -f ./nlm_test ]; then
          ./nlm_test
        fi

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install code quality tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-format \
          clang-tidy \
          cppcheck \
          astyle
    
    - name: Check C++ code formatting
      run: |
        # Find all C++ source files
        find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | head -20 > files.txt
        
        # Check formatting with clang-format
        clang-format -Werror --dry-run --Werror --comma-style=none --access-modifier-order=public,protected,private,protected-static,private-static $(cat files.txt)
    
    - name: Run clang-tidy analysis
      run: |
        mkdir -p build-quality
        cd build-quality
        cmake \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Debug \
          ..
        cmake --build . --config Debug --parallel 4
        
        # Run clang-tidy if available
        if command -v clang-tidy; then
          clang-tidy-14 src/brain/Neuron.cpp src/brain/Synapse.cpp -- -I./src
        fi
    
    - name: Check for common code issues with cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability,information,unused --suppress=missingIncludeSystem src/ 2>/dev/null || true

  # Documentation build
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install documentation dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz python3-sphinx
    
    - name: Generate Doxygen documentation
      run: |
        mkdir -p docs-api
        doxygen Doxyfile 2>&1 || true
        cp -r html/* docs-api/
    
    - name: Build Sphinx documentation
      run: |
        pip install sphinx sphinx-rtd-theme
        cd docs
        make html 2>&1 || true
        cp -r _build/html ../docs-html/
    
    - name: Upload documentation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs-api/
          docs-html/
        retention-days: 30

  # Release management
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-python, benchmarks]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release archive
      run: |
        cd artifacts
        zip -r ../nlm-release.zip .
        ls -la ../nlm-release.zip
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: nlm-release.zip
        draft: false
        prerelease: false
        generate_release_notes: true

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run safety audit
      run: |
        # Check for known vulnerable dependencies
        if command -v safety; then
          safety check
        fi
        
        # Check for potential security issues in code
        grep -r "password\|secret\|key\|token" --include="*.cpp" --include="*.hpp" --include="*.py" --include="*.md" . 2>/dev/null || true
    
    - name: Check for hardcoded credentials
      run: |
        find . -name "*.cpp" -o -name "*.hpp" -o -name "*.py" -o -name "*.sh" | 
          xargs grep -l "password\|secret\|key\|token" 2>/dev/null | 
          grep -v ".git" | 
          head -10

permissions:
  contents: write
  checks: write
  actions: write
  security-events: write