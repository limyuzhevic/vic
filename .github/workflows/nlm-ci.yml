# NLM CI/CD Pipeline Configuration
# Automated testing and deployment for the Neural Learning Machine project

name: NLM CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly tests to catch regressions
    - cron: '0 2 * * 1'  # Every Monday at 2 AM

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: "Test Configuration 1"
            python-version: "3.8"
            build-type: "Release"
            test-suite: "all"
          - name: "Test Configuration 2" 
            python-version: "3.11"
            build-type: "Debug"
            test-suite: "unit"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Python ${{ matrix.config.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.config.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-build-core>=0.5.0 pybind11>=2.11.0
        pip install -e .[dev]
    
    - name: Configure build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.config.build-type }} \
                 -DCMAKE_CXX_STANDARD=20 \
                 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                 -DPYTHON_EXECUTABLE=$(which python) \
                 -DNLM_BUILD_PYTHON_BINDINGS=ON
    
    - name: Build project
      run: |
        cd build
        cmake --build . --config ${{ matrix.config.build-type }} --parallel 4
    
    - name: Run unit tests
      run: |
        cd build
        if [ "${{ matrix.config.test-suite }}" = "all" ]; then
          ./test_main
        else
          # Run specific test suites
          ./test_neuron
          ./test_synapse  
          ./test_config
        fi
    
    - name: Run Python integration tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Run benchmark tests
      run: |
        cd build
        if [ -f ./nlm_benchmark ]; then
          ./nlm_benchmark
        fi
    
    - name: Run Phase 6 integration demo
      run: |
        cd build
        if [ -f ./nlm_phase6_demo ]; then
          ./nlm_phase6_demo
        fi
    
    - name: Install and test Python module
      run: |
        cd build
        pip install pynlm
        python -c "import pynlm; print('Python module imported successfully')"
        python -c "from pynlm import Brain, Config, SimpleWorld; print('Python API working correctly')"
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-artifacts-${{ matrix.config.name }}
        path: |
          build/
        retention-days: 7

  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linters
      run: |
        pip install flake8 black isort mypy
        sudo apt-get update && sudo apt-get install -y clang-format
    
    - name: Check Python code formatting
      run: |
        black --check python/ tests/ src/
        isort --check-only python/ tests/ src/
        flake8 python/ tests/ src/
    
    - name: Check C++ code formatting
      run: |
        find src/ -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
    
    - name: Run type checking
      run: |
        mypy python/ --ignore-missing-imports
    
    - name: Static analysis
      run: |
        cppcheck src/ --enable=warning --inconclusive --std=c++20

  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install scikit-build-core>=0.5.0 pybind11>=2.11.0
        pip install numpy>=1.20
    
    - name: Configure optimized build
      run: |
        mkdir build_perf
        cd build_perf
        cmake .. -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_CXX_FLAGS="-O3 -march=native" \
                 -DNLM_BUILD_PYTHON_BINDINGS=ON \
                 -DENABLE_PERFORMANCE_TESTS=ON
    
    - name: Build performance test binary
      run: |
        cd build_perf
        cmake --build . --config Release --parallel 4
    
    - name: Run benchmark suite
      run: |
        cd build_perf
        if [ -f ./nlm_benchmark ]; then
          ./nlm_benchmark --output performance_metrics.json
        fi
    
    - name: Analyze performance results
      run: |
        if [ -f build_perf/performance_metrics.json ]; then
          python -c "
          import json
          import sys
          
          with open('build_perf/performance_metrics.json') as f:
              data = json.load(f)
          
          print('Performance Metrics Summary:')
          for test_name, metrics in data.items():
              print(f'{test_name}:')
              if isinstance(metrics, dict):
                  for metric, value in metrics.items():
                      print(f'  {metric}: {value}')
          "
        fi

  deployment:
    name: Deploy to Production
    needs: [test, quality-check, performance-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Build and install package
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DNLM_BUILD_PYTHON_BINDINGS=ON
        cmake --build . --config Release
        pip install -e .
    
    - name: Run final verification
      run: |
        python -c "
        import pynlm
        from pynlm import Brain, Config, SimpleWorld
        
        print('Testing basic Python API...')
        config = Config()
        brain = Brain(config)
        brain.initialize()
        
        print('Running integration test...')
        # Additional verification tests
        print('All verification checks passed!')
        "
    
    - name: Create release artifacts
      run: |
        cd build
        cp -r ../python/pynlm python_bindings/
        cp -r src docs/
        tar -czf nlm-release.tar.gz python_bindings docs
        ls -la *.tar.gz
    
    - name: Deploy to package repository
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        repository_url: https://upload.pypi.org/legacy/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Bandit (Python security scan)
      run: |
        pip install bandit
        bandit -r python/ -f json -o bandit-report.json
    
    - name: Run Semgrep (static analysis)
      run: |
        pip install semgrep
        semgrep --config=auto python/ src/ --sarif --output=semgrep-report.sarif
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          semgrep-report.sarif
        retention-days: 30

  documentation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install documentation tools
      run: |
        pip install sphinx sphinx-rtd-theme m2r
    
    - name: Build documentation
      run: |
        cd docs
        sphinx-build -b html . _build/html
        sphinx-build -b latex . _build/latex
    
    - name: Validate Python API documentation
      run: |
        python -c "
        import pynlm
        print('Python module API documentation validation:')
        
        # Test that all major classes are available
        required_classes = ['Config', 'SimpleWorld', 'SensoryInput', 'Action', 'Brain']
        for cls in required_classes:
            if hasattr(pynlm, cls):
                print(f'  ✓ {cls} available')
            else:
                print(f'  ✗ {cls} missing')
                raise ImportError(f'Missing class: {cls}')
        
        print('All API documentation validation checks passed!')
        "
    
    - name: Upload documentation artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          docs/_build/
        retention-days: 30

workflow_call:
  description: Reusable workflow for CI/CD
  inputs:
    build-type:
      description: Build type (Release/Debug)
      required: false
      default: 'Release'
    python-version:
      description: Python version
      required: false
      default: '3.10'
  runs:
    using: composite
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install scikit-build-core>=0.5.0 pybind11>=2.11.0
        pip install -e .[dev]
