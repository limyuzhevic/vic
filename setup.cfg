# Python compatibility
python_requires = '>=3.8'

# Keywords for package discovery
keywords = [
    'neural', 'simulation', 'spiking', 'brain', 'learning',
    'AI', 'artificial intelligence', 'neuroscience', 'computational neuroscience',
]

# License
license = 'MIT'

# Description
long_description = """
NLM Python Bindings - Neural Learning Machine

An Experimental Artificial Developmental Brain with Python Interface

This package provides Python bindings to the NLM (Neural Learning Machine) C++ 
neural simulation framework, making it accessible to Python users while 
maintaining the performance of C++.

Key Features:
- Complete brain simulation framework
- Type-safe Python interfaces
- High-level convenience functions
- Comprehensive error handling
- Easy integration with Python ecosystem
- Full documentation and examples
- Comprehensive test suite

The bindings wrap the existing pybind11 C++ extension and provide a
more Pythonic, documented, and type-safe interface.

For documentation and examples, see the examples directory.
"""

