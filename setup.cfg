[metadata]
name = pynlm
version = 0.1.0
author = NLM Authors
description = Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework
readme = README.md
license = MIT
long-description = file: README.md
long-description-content-type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: C++
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
install_requires =
    pybind11>=2.11.0
python_requires = >=3.8
include_package_data = True
zip_safe = False

[options.packages.find]
where = python
exclude =
    tests.*
    tests

[options.extras_require]
dev =
    pytest>=7.0
    numpy>=1.20
    sphinx>=4.0
    sphinx-rtd-theme>=1.0
    matplotlib>=3.0
    ipython>=7.0

[options.entry_points]
console_scripts =
    pynlm-example = python -m pynlm.examples.basic_examples:main
    pynlm-test = python -m pynlm.test_bindings:main
    pynlm-demo = python -m pynlm.examples.advanced_examples:main

[tool:pytest]
testpaths = python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[tool:black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool:isort]
profile = black
line_length = 88
multi_line_output = 3
