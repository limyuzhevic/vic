[metadata]
name = nlm
version = attr: pyproject.toml:project.version
description = Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework with enhanced Pythonic API
readme = README.md
license = MIT
author = NLM Authors
author_email = contact@nlm-project.org
url = https://github.com/nlm-project/nlm
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: C++
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules
    Framework :: Pytest

[options]
package_dir =
    = src
    nlm = nlm
    tests = tests
packages = find:
python_requires = >=3.8
install_requires =
    pybind11>=2.11.0

[options.extras_require]
dev =
    pytest>=7.0,<8.0
    pytest-asyncio>=0.19,<1.0
    pytest-cov>=3.0,<5.0
    black>=22.0,<24.0
    isort>=5.10,<6.0
    mypy>=0.991,<1.4
    flake8>=5.0,<7.0
    pylint>=2.15,<3.0
    pre-commit>=3.0,<4.0
visualization =
    numpy>=1.20,<2.0
    matplotlib>=3.5,<4.0
    pillow>=9.0,<11.0
scientific =
    numpy>=1.20,<2.0
    pandas>=1.3,<2.0
    scipy>=1.7,<2.0
ml =
    torch>=1.13,<3.0; platform_system != 'Windows'
    tensorflow>=2.10,<3.0; platform_system != 'Windows'
jupyter =
    jupyter>=1.0,<2.0
    ipykernel>=6.0,<7.0
    ipywidgets>=7.0,<9.0

[options.entry_points]
console_scripts =
    nlm = nlm.cli:main
    nlm-demo = nlm.examples:main

[bdist_wheel]
universal = 0

[sdist]
formats = gztar

[build_ext]
command_options =
    build_ext --force-cython = true
    build_ext --inplace = true

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
