version = 0.1.0
name = pynlm
author = NLM Authors
author_email = authors@nlm-project.org
description = Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
keywords = neural simulation spiking brain learning
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: C++
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
install_requires =
    # No dependencies for core functionality
    # Users can install optional dependencies as needed

[options.extras_require]
dev =
    pytest>=7.0
    numpy>=1.20
    scikit-build-core>=0.5.0
    pybind11>=2.11.0
    pytest-cov
    black
    isort
    flake8

test = dev

[options.package_data]
pynlm = *.so

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    *.pyc,
    *.pyo,
    .pytest_cache,
    _build,
    mkdocs,
    *.egg-info,
    .eggs,
    env,
    venv,
    environment,
    dist,
    build,
    pip-wheel-metadata
ignore =
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    F401,  # imported but unused
    F403,  # 'from module import *' used; unable to detect undefined names
    F405,  # name imported from 'module' but unresolved

[pytest.ini_options]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning

[tool:pytest]
minversion = 6.0
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[tool:black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = 'src/**/*.py'
exclude =
    .git
    __pycache__
    build
    dist
    .eggs
    *.egg

[tool:isort]
profile = black
multi_line_output = 5
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.coverage.run]
source = pynlm

[tool.coverage.report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: