[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Advanced dependencies for extended functionality
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3.0",  # For data analysis and export
    "matplotlib>=3.5.0",  # For visualization
    "scipy>=1.8.0",  # For scientific computing
    "networkx>=2.8.0",  # For graph analysis
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
]
advanced = [
    "jupyter>=1.0.0",  # Interactive notebooks
    "ipywidgets>=7.7.0",  # Interactive widgets
    "plotly>=5.0.0",  # Advanced plotting
    "seaborn>=0.12.0",  # Statistical visualization
]
perf = [
    "numba>=0.55.0",  # Just-in-time compilation
    "cupy-cuda12x>=12.0.0",  # GPU acceleration
    "cudf>=22.3.0",  # CUDA dataframes
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Additional pyproject.toml sections for enhanced functionality
tool.kilo.description = "Advanced neural learning machine with Python bindings"
tool.kilo.version = "0.1.0"
tool.kilo.authors = ["NLM Authors"]
tool.kilo.keywords = ["neural", "ai", "simulation", "brain", "learning"]
tool.kilo.license = "MIT"
tool.kilo.requirements = [
    ">=3.8",
    "numpy>=1.20",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0",
    "networkx>=2.8.0"
]
tool.kilo.optional-dependencies = {
    "dev" = ["pytest>=7.0"],
    "advanced" = ["jupyter>=1.0.0", "ipywidgets>=7.7.0", "plotly>=5.0.0", "seaborn>=0.12.0"],
    "perf" = ["numba>=0.55.0", "cupy-cuda12x>=12.0.0", "cudf>=22.3.0"]
}
tool.kilo.experimental-features = ["gpu_acceleration", "distributed_computing", "real_time_visualization"]
tool.kilo.compatibility = ["python>=3.8", "linux", "macos", "windows"]
