[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "cmake>=3.16"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) - Complete artificial brain simulation with 60+ integrated systems"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NLM Authors", email = "contact@nlm-project.org"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "ai", "artificial intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Computational Neuroscience",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0; extra == 'visualization'",
    "jupyter>=1.0.0; extra == 'jupyter'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.991",
    "cmake-format>=0.6.13",
]

visualization = [
    "matplotlib>=3.5.0",
    "numpy>=1.20",
]

jupyter = [
    "jupyter>=1.0.0",
    "ipython>=7.30.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20",
]

test = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Source Code" = "https://github.com/nlm-project/nlm"
"Documentation" = "https://nlm.readthedocs.io"
"Demo Gallery" = "https://github.com/nlm-project/nlm/tree/main/gallery"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_PYTHON_BINDINGS = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = |
    /(
        \.eggs
        | \.git
        | \.hg
        | \.mypy_cache
        | \.tox
        | \.venv
        | _build
        | buck-out
        | build
        | dist
        | tests/
    )/

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_third_party = ["numpy", "scipy", "matplotlib", "jupyter", "ipython"]
known_local = ["nlm", "pynlm"]
sections = ["FUTURE", "STDLIB", "THIRD_PARTY", "FIRST_PARTY", "LOCAL_FOLDER"]
no_sections = false
force_sort_within_sections = true
ignore_comments = false
force_alphabetical_sort_inside_sections = true

[build.wheel]
packages = ["nlm", "pynlm"]
