[build-system]
requires = ["scikit-build-core", "pybind11", "setuptools"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "1.0.0"
description = "Neural Learning Machine Python Bindings - Experimental artificial developmental brain simulator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "NLM Research Team", email = "research@nlm.org"}
]
maintainers = [
    {name = "NLM Research Team", email = "research@nlm.org"}
]
keywords = ["neural-networks", "brain", "neuroscience", "ai", "developmental", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "scikit-build-core",
    "pybind11",
]
examples = [
    "numpy",
    "matplotlib",
]

[project.urls]
homepage = "https://github.com/nlm-research/pynlm"
repository = "https://github.com/nlm-research/pynlm"
bug-tracker = "https://github.com/nlm-research/pynlm/issues"
documentation = "https://nlm.readthedocs.io"

[tool.scikit-build-core]
build-type = "Release"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.scikit-build-core.cmake]
minimum-version = "3.16"
