[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlm"
version = "2.0.0"
description = "Neural Learning Machine - Enhanced Python API for AI Simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NLM Development Team", email = "dev@nlm.ai"}
]
maintainers = [
    {name = "NLM Development Team", email = "dev@nlm.ai"}
]
keywords = ["neural-networks", "ai", "simulation", "machine-learning", "cognitive-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Life"
]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.20.0",
    "psutil>=5.8.0",
    "matplotlib>=3.3.0",
    "PyYAML>=5.3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
    "black>=20.8b0",
    "isort>=5.0.0",
    "flake8>=3.8.0",
    "mypy>=0.800"
]
docs = [
    "sphinx>=3.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "sphinx-autodoc-typehints>=1.11.0"
]
examples = [
    "jupyter>=1.0.0"
]

[project.urls]
homepage = "https://github.com/neural-learning-machine/nlm"
documentation = "https://docs.nlm.ai"
"Source" = "https://github.com/neural-learning-machine/nlm"
"Bug Reports" = "https://github.com/neural-learning-machine/nlm/issues"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["nlm"]
include-package-data = true

[tool.setuptools.package-data]
nlm = ["*.py", "*.md", "*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--verbose",
    "--cov=nlm",
    "--cov-report=term-missing",
    "--cov-report=xml"
]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
title_comment = "NLM Python API Configuration"

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["nlm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

[tool.coverage.html]
directory = "coverage_html"

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "D",  # pydocstyle
]
ignore = [
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
]
per-file-ignores = {}
line-length = 88
target-version = "py37"

[tool.ruff.pydocstyle]
convention = "google"

[tool.jupyter]
notebook_dir = "python/examples/notebooks"

[tool.nlm]
version = "2.0.0"
description = "Neural Learning Machine - Enhanced Python API"
simulation_framework = true
experiment_management = true
memory_systems = true
performance_monitoring = true
configuration_management = true

[tool.nlm.simulation]
default_world_size = 100
default_timestep = 0.01
default_neuron_count = 1000
default_region_count = 1

[tool.nlm.memory]
working_memory_capacity_default = 1000
episodic_memory_max_episodes = 1000
consolidation_interval_default = 1000
replay_interval_default = 100

[tool.nlm.experiments]
parameter_sweep_default = true
multi_environment_support = true
custom_agent_support = true
checkpoint_interval_default = 100

[tool.nlm.performance]
sampling_interval_default = 0.1
profiling_enabled = true
memory_monitoring_enabled = true
cpu_monitoring_enabled = true
