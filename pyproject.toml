[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Pybind11 module configuration
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
]

# Package metadata for scikit-build-core
[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",  # Enable position-independent code for shared libraries
]

# Extension module configuration
[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
PYTHON_MODULE_NAME = "pynlm"

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "-v",
    "-x",
]

# Build optimization
[tool.scikit-build.options]
build-type = "Release"
sharelib = true

# Python package metadata
[build-system.pyproject]
packages = ["pynlm"]

# Installation requirements
install_requires = [
    "numpy>=1.20",
]

# Entry points for command-line tools
[project.scripts]
nlm-demo = "pynlm:main"
nlm-phase6-demo = "pynlm:phase6_demo"

# Documentation configuration
[tool.pydocstyle]
ignore = "D100,D101,D102,D103,D104,D105,D106,D107,D203,D204,D213,W503,W504"

# Type checking configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Code quality configuration
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
extend-exclude = [
    "*/.*",
    "*/__pycache__/*",
    "build/*",
    "dist/*",
    "*.egg-info/*",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
known_first_party = ["pynlm"]
known_third_party = ["pybind11", "numpy"]
sections = ["FUTURE", "STDLIB", "THIRD_PARTY", "FIRST_PARTY", "LOCALFOLDER"]
