[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0-enhanced"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework with high-level APIs and improved user experience"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Framework :: Pybind11",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "scikit-build-core>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"

[project.scripts]
# Command-line tools for NLM
nlm-sim = "nlm.cli:main"
nlm-explore = "nlm.cli:explore_demo"
nlm-learn = "nlm.cli:learning_demo"
nlm-checkpoint = "nlm.cli:checkpoint_tool"

[project.gui-scripts]
# Visualization and monitoring tools
nlm-visualizer = "nlm.gui:launch_visualizer"

[tool.scikit-build]
# scikit-build-core >= 0.8 renamed minimum-version to version.
cmake.version = ">=3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    # Phase 5: without this the root build produces no pynlm module
    # at all (the option is OFF by default for plain C++ builds).
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

