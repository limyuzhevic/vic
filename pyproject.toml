# Updated pyproject.toml with type hints and improved configuration

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "ai", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]

# Core dependencies - empty for now, but extensible for future needs
dependencies = []

# Type hints and static checking
type-hints = [
    "typing>=3.7",
    "typing-extensions>=3.7.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=2..index",
    "numpy>=1.20",
    "numba>=0.55.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "black>=21.12b0",
    "mypy>=0.910",
    "ruff>=0.1.0",
    "pre-commit>=2.15.0",
]

[project.scripts]
pynlm-demo = "pynlm.examples:main"
pynlm-benchmark = "pynlm.benchmark:main"

[project.gui-scripts]
pynlm-explorer = "pynlm.gui:main"

[project.entry-points.nlm]
examples = "pynlm.examples"
benchmark = "pynlm.benchmark"
gui = "pynlm.gui"

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Discussions" = "https://github.com/nlm-project/nlm/discussions"

[tool.scikit-build]
# scikit-build-core >= 0.8 renamed minimum-version to version.
cmake.version = ">=3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
    "-DNLM_ENABLE_EXAMPLES=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--cov=nlm",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    'examples/',
    'benchmark/',
    'gui/',
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    ".hg",
    ".ruff_cache",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "examples/",
    "benchmark/",
    "gui/",
]

[tool.ruff.isort]
known-first-party = ["nlm"]

[tool.ruff.per-file-ignores]
"examples/*.py" = ["T201"]  # allow print statements in examples
"benchmark/*.py" = ["T201"]  # allow print statements in benchmark
"gui/*.py" = ["T201"]  # allow print statements in gui

[tool.coverage.run]
source = ["nlm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__:",
]

# Development and documentation
[project.documentation]
name = "NLM Python API"
description = "Documentation for NLM Python bindings"

[tool.mkdocs]
site_name = "NLM Python API"
docs_dir = "docs"
site_dir = "site"
theme = {name = "material", static_templates = ["404.html"]}
extensions = ["toc.gen"]

# GitHub Actions workflow configuration (if available)
[tool.github-workflows]
enable = true