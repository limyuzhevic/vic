[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuro-inspired"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Neural Networks",
    "Topic :: Scientific/Computing :: Neural Networks",
]

# Core dependencies
dependencies = [
    "numpy>=1.20; python_version>='3.8'",
    "pybind11>=2.11.0; python_version>='3.8'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "coverage>=5.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.990",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "pydocstyle>=6.0",
]
build = [
    "scikit-build-core>=0.5.0",
    "cmake>=3.16",
]

development = [
    "pre-commit>=2.20",
    "commitizen>=2.30",
    "git-changelog>=3.0",
    "toml>=0.10",
]

tests = [
    "pytest>=7.0",
    "pytest-asyncio>=0.18",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=3.4",
    "pytest-timeout>=2.0",
    "coverage>=5.0",
    "coverage-badge>=1.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Reports" = "https://github.com/nlm-project/nlm/issues"
"Feature Requests" = "https://github.com/nlm-project/nlm/issues"
"Slack Community" = "https://nlm-community.slack.com"
"Discord Community" = "https://discord.gg/NLM"

[project.scripts]
pynlm-demo = "pynlm.scripts.demo:main"
pynlm-validate = "pynlm.scripts.validate:main"
pynlm-benchmark = "pynlm.scripts.benchmark:main"
pynlm-examples = "pynlm.scripts.examples:main"
pynlm-explore = "pynlm.scripts.explore:main"

[project.gui-scripts]
pynlm-viewer = "pynlm.gui:main"

[project.entry-points]
nlm = "pynlm.plugins:entry_point_group"
console_scripts = [
    "nlm-demo = pynlm.scripts.demo:main",
    "nlm-validate = pynlm.scripts.validate:main",
    "nlm-benchmark = pynlm.scripts.benchmark:main",
    "nlm-examples = pynlm.scripts.examples:main",
    "nlm-explore = pynlm.scripts.explore:main",
]

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.install-dir = "{INSTALL_ROOT}"
build-type = "Release"
components = ["nlm_core", "nlm_agent", "nlm_world", "nlm_demo"]

# Enhanced CMake arguments
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DCMAKE_CXX_EXTENSIONS=OFF",
    "-DPYTHON_EXECUTABLE={python}",
    "-DPYTHON_MODULE_NAME=pynlm",
    "-DINSTALL_INCDIR=include/nlm",
    "-DINSTALL_LIBDIR=lib",
    "-DINSTALL_BINDIR=bin",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DNLM_ENABLE_TESTS=ON",
    "-DNLM_ENABLE_EXAMPLES=ON",
    "-DNLM_ENABLE_PYTHON=ON",
    "-DNLM_ENABLE_DOCS=ON",
    "-DNLM_ENABLE_BENCHMARKS=ON",
    "-DNLM_ENABLE_GUI=ON",
]

# Custom CMake definitions for advanced configuration
tool.scikit-build.cmake.define.NLM_SOURCE_DIR = "src"
tool.scikit-build.cmake.define.NLM_BUILD_TYPE = "Release"
tool.scikit-build.cmake.define.NLM_ENABLE_JSON = "ON"
tool.scikit-build.cmake.define.NLM_ENABLE_VALIDATION = "ON"
tool.scikit-build.cmake.define.NLM_ENABLE_ADVANCED_LOGGING = "ON"
tool.scikit-build.cmake.define.NLM_ENABLE_EXPERIMENTS = "ON"
tool.scikit-build.cmake.define.NLM_ENABLE_GUI = "ON"
tool.scikit-build.cmake.define.NLM_PYTHON_VERSION = "{python_version}"

# Python-specific configurations
tool.scikit-build.cmake.define.PYTHON_MODULE = "pynlm"
tool.scikit-build.cmake.define.PYTHON_PACKAGE_NAME = "pynlm"
tool.scikit-build.cmake.define.PYTHON_PACKAGE_VERSION = "{version}"

# Installation configurations
tool.scikit-build.cmake.define.INSTALL_DOCS = "ON"
tool.scikit-build.cmake.define.INSTALL_EXAMPLES = "ON"
tool.scikit-build.cmake.define.INSTALL_PYTHON_BINDING = "ON"
tool.scikit-build.cmake.define.INSTALL_TESTS = "ON"

[tool.scikit-build.cmake.define.NLM_CONFIG]
config_file = "configs/nlm_config.json"
enable_json = true
enable_validation = true
enable_advanced_logging = true
enable_experiments = true

# Development configurations
[tool.pytest.ini_options]
testpaths = ["tests", "examples", "scripts"]
python_files = ["test_*.py", "*_test.py", "example_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --benchmark-skip"
markers = [
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
  | examples
  | notebooks
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = '''
^(examples|scripts|tests)/.*\.py$
'''

[tool.pydocstyle]
convention = "numpy"
exclude = "^tests|^examples|^scripts"

# Package metadata
[tool.pipenv]
allow_global = false

[tool.conda]
package_manager = "conda"

# Documentation
tool.sphinx.main_doc = "README"
sphinx-apidoc.args = ["--separate", "--module-first", "--ext-autodoc", "--ext-viewcode"]

# Version management
[tool.poetry.version]
current_version = "0.1.0"

# Build metadata
tool.build.number = 0
tool.build.date = "2025-01-01"
tool.build.revision = "dev"

# Performance
tool.performance.check_memory = true
tool.performance.check_time = true
