[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "2.0.0-enhanced"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework with complete Phase 6 integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "artificial", "intelligence", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Framework :: Pybind11",
]

dependencies = [
    "numpy>=1.20",  # For array operations and numerical computing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=2.12.0",
    "numpy>=1.20",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",  # For visualization
]

[project.optional-dependencies]
extra = [
    "numpy>=1.20",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "jupyter>=1.0.0",  # For interactive notebooks
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
# scikit-build-core >= 0.8 renamed minimum-version to version.
cmake.version = ">=3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    # Phase 5: without this the root build produces no pynlm module
    # at all (the option is OFF by default for plain C++ builds).
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
