[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
]

test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=6.0",
    "numpy>=1.20",
]

doc = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.0",
    "myst-parser>=0.13",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_SIMD = true
NLM_ENABLE_OPENMP = true
NLM_ENABLE_CUDA = false
NLM_ENABLE_MPI = false
NLM_ENABLE_PROFILING = false
NLM_ENABLE_COVERAGE = false
NLM_ENABLE_SANITIZERS = false
NLM_ENABLE_ASAN = false
NLM_ENABLE_UBSAN = false

[tool.scikit-build.cmake.define.custom]
BUILD_TESTS = true
BUILD_DOCS = false
BUILD_EXAMPLES = true

# Build optimization settings
[tool.scikit-build]
parallel = true
build-dir = "build"

# Python binding configuration
[tool.pybind11]
include-pybind11 = true
package-name = "pynlm"
module-name = "nlm"
include-path = ["python/include"]
bind-pytest = true

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Development tool configuration
[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    'tests/',
    'build/',
]

# Documentation generation configuration
[tool.sphinx]
source_suffix = [".rst", ".md"]
master_doc = "index"
extensions = [
    "sphinx.ext.autodoc",
    "sphinx.ext.viewcode",
    "sphinx.ext.napoleon",
    "sphinx.ext.intersphinx",
    "myst_parser",
]
pygments_style = "sphinx"
templates_path = ["_templates"]
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
html_theme = "sphinx_rtd_theme"
html_static_path = ["_static"]
html_theme_options = {
    "collapse_navigation" = false,
    "sticky_navigation" = true,
    "navigation_depth" = 4,
}

# Cross-platform settings
[tool.scikit-build.cmake.define.platform]
# Set platform-specific options based on detected system
if (sys.platform == "linux"):
    CMAKE_POSITION_INDEPENDENT_CODE = true
elif (sys.platform == "win32"):
    CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS = true
else:
    pass

# Advanced build configuration
[tool.scikit-build]
strip = false
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DPYTHON_MODULE_EXTENSION=.so",
]

# Package metadata
[tool.scikit-build.package]
name = "pynlm"
version = "0.1.0"
author = "NLM Authors"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
long_description = file: "README.md"
long_description_content_type = "text/markdown"
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

# Custom configuration options
[tool.scikit-build.cmake.define.custom]
NLM_BUILD_TYPE = "Release"
NLM_ENABLE_TESTS = true
NLM_ENABLE_EXAMPLES = true
NLM_ENABLE_DOCS = false
NLM_BUILD_OPTIMIZATION = "2"
NLM_BUILD_WARNINGS_AS_ERRORS = false
NLM_BUILD_VERBOSE_LOGGING = false
NLM_ENABLE_SIMD = true
NLM_ENABLE_OPENMP = true
NLM_ENABLE_CUDA = false
NLM_ENABLE_MPI = false
NLM_ENABLE_PROFILING = false
NLM_ENABLE_COVERAGE = false
NLM_ENABLE_SANITIZERS = false
NLM_ENABLE_ASAN = false
NLM_ENABLE_UBSAN = false
