[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework - A sophisticated artificial brain simulation system with integrated memory, prediction, and learning systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"},
    {name = "Kilo Engineering", email = "contact@kilo.ai"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "ai", "cognitive", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Topic :: Software Development :: Libraries",
    "Framework :: Pytest",
]

dependencies = [
    "numpy>=1.20; python_version>='3.8'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "matplotlib>=3.3",
    "jupyter>=1.0",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=0.5",
    "myst-parser>=0.15",
    "black>=21.0",
    "flake8>=3.8",
    "isort>=5.0",
    "mypy>=0.800",
]

examples = [
    "jupyter>=1.0",
    "matplotlib>=3.3",
    "pandas>=1.3",
]

[project.scripts]
nlm = "nlm_cli:main"
nlm-create = "nlm_cli:create_brain_command"
nlm-run = "nlm_cli:run_simulation_command"
nlm-explore = "nlm_cli:explore_brain_command"
nlm-experiment = "nlm_cli:experiment_command"

[project.entry-points]
pynlm = [
    "advanced_api = pynlm_advanced",
    "examples = nlm_examples",
]

[project.gui-scripts]
nlm-gui = "nlm_cli:main"

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Issues" = "https://github.com/nlm-project/nlm/issues"
"Discussions" = "https://github.com/nlm-project/nlm/discussions"
"Changelog" = "https://github.com/nlm-project/nlm/blob/main/CHANGELOG.md"
"Download (GitHub)" = "https://github.com/nlm-project/nlm/releases"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DCMAKE_BUILD_TYPE=Release",
]
build-dir = "build"

distribution = "wheel"

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.scikit-build.cmake.options]
BUILD_TESTING = false

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "error::UserWarning",
]

[tool.setuptools]
zip-safe = false
include-package-data = true
packages = find:

[tool.setuptools.package-data]
pynlm = [
    "*.py",
    "*.so",
    "*.cpp",
]

[tool.setuptools.exclude-package-data]
pynlm = [
    "*test*",
    "*example*",
    "__pycache__/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pynlm", "nlm_cli", "nlm_examples", "pynlm_advanced"]
exclude = [
    "tests.*",
    "tests",
    "docs.*",
    "docs",
    "build.*",
    "build",
    ".*",
    "*test*",
    "*example*",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | examples
  | docs
)/
'''

[tool.isort]
skip_gitignore = true
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "build/",
    "docs/",
    ".git/",
]

[tool.pylint.main]
load-plugins = "pylint.extensions.docparams"
master_list = ["examples", "tests"]
ignored-modules = ["pynlm"]

[tool.coverage.run]
source = ["pynlm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.cibuildwheel]
build = "cdt-nodist-manylinux2014_x86_64"
test = ["pytest"]

[tool.cibuildwheel.macos]
build = "macosx_10_9_universal2"

[tool.cibuildwheel.windows]
build = "win_amd64"

[tool.conda-build]
package = {name = "pynlm", version = "0.1.0"}
requirements = {host = [], run = []}
build = {skip = true}

[tool.github-actions]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

tool = "pytest"

[tool.coverage]
include = ["src/*", "examples/*"]
exclude = [
    "*/tests/*",
    "*/docs/*",
    "*/build/*",
]
