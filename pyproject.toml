NLM_SOURCE_DIR = "src"

[# Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework
# Provides high-performance Python interface to the NLM brain architecture

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies - only standard library for performance
# Scientific computing with NumPy can be added as optional dependencies

dependencies = []

[project.optional-dependencies]
# Essential for scientific computing with NLM
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]

# Advanced usage for data analysis and visualization
analysis = [
    "scipy>=1.7.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"
Discussions = "https://github.com/nlm-project/nlm/discussions"

[project.scripts]
# Command-line tools for NLM
nlm-run = "pynlm.tools:main_run"
nlm-explore = "pynlm.tools:main_explore"
nlm-benchmark = "pynlm.tools:main_benchmark"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

# Compiler optimization flags
[tool.scikit-build.cmake.args]
CMAKE_BUILD_TYPE = "Release"
CMAKE_CXX_FLAGS = "-O3 -march=native -ffast-math"
CMAKE_POSITION_INDEPENDENT_CODE = ON
CMAKE_POLICY_DEFAULT_CMP0077 = NEW

# Install location for Python modules
[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
PYNLm_INSTALL_LIBDIR = "{CMAKE_INSTALL_LIBDIR}/python3.12/site-packages"

# Python package configuration
tool.scikit-build.package.name = "pynlm"
tool.scikit-build.package.include = ["src/*"]
tool.scikit-build.package.data = []

# Test configuration
tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "cpu_intensive: marks tests as CPU intensive",
    "gpu_intensive: marks tests as GPU intensive",
]

# Compiler configuration for different platforms
[tool.scikit-build.cmake.platform]
# Optimize for different architectures
CMAKE_CXX_FLAGS_RELEASE = "-O3 -DNDEBUG -march=native"
CMAKE_CXX_FLAGS_RELWITHDEBINFO = "-O2 -g -DNDEBUG -march=native"
CMAKE_CXX_FLAGS_DEBUG = "-O0 -g -DDEBUG"

# Warning flags for different compilers
[tool.scikit-build.cmake.platform.msvc]
CMAKE_CXX_FLAGS = "/W4 /WX /arch:AVX2"

[tool.scikit-build.cmake.platform.unix]
CMAKE_CXX_FLAGS = "-Wall -Wextra -Wpedantic -Werror -march=native -ffast-math"

# Documentation generation
[tool.sphinx]
source_suffix = ".rst"
master_doc = "index"
extensions = [
    "sphinx.ext.autodoc",
    "sphinx.ext.viewcode",
    "sphinx.ext.napoleon",
    "sphinx.ext.intersphinx",
]
html_theme = "sphinx_rtd_theme"
html_static_path = ["_static"]
html_css_files = ["css/custom.css"]

# Code quality checks
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = "\.py$"
exclude = """
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Package metadata for PyPI
tool.poetry]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
authors = ["NLM Authors <authors@nlm-project.org>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nlm-project/nlm"
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Module structure for easier navigation
[tool.scikit-build.module]
name = "pynlm"
submodules = [
    "core",
    "brain", 
    "sensory",
    "motor",
    "environment",
    "agent",
    "world",
    "experiments",
    "visualization",
]

# Performance monitoring
[tool.gprof2dot]
format = "png"
output = "performance_analysis.png"

