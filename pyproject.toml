[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "1.0.0-enhanced"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) neural simulation framework with Pythonic API and advanced features"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bioinformatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib>=3.0",
    "networkx>=2.5",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=0.5",
]
experimental = [
    "torch>=1.9",
    "tensorflow>=2.8",
]
simulation = [
    "pygame>=2.0",
    "pyglet>=1.5",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Discussions" = "https://github.com/nlm-project/nlm/discussions"

[project.scripts]
pynlm-demo = "pynlm.demo:main"
pynlm-benchmark = "pynlm.benchmark:main"
pynlm-explore = "pynlm.explore:main"

[project.gui-scripts]
pynlm-visualizer = "pynlm.visualizer:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.scikit-build.cmake.feature]
python = {project = "pybind11"}

[tool.scikit-build.cmake.toolchain]
customize = "true"

[tool.pytest.ini_options]
testpaths = ["tests", "python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["python/pynlm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
per-file-ignores = {}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.doc8]
max-line-length = 88

[option.package_data]
pynlm = ["*.pyi", "*.json", "*.md", "*.txt"]

[option.package_dir]
pynlm = "python/pynlm"

[option.data_files]
"share/pynlm/examples" = ["python/examples/*.py"]
"share/pynlm/docs" = ["python/pynlm/api_guide.md", "python/pynlm/README.md"]

[flake8]
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    ".venv",
    "env",
    ".env",
    "venv",
    ".pytest_cache",
    ".coverage",
]
ignore = [
    "E501",  # line too long
    "W503",  # line break before binary operator
    "E203",  # whitespace before ':'
    "E231",  # missing whitespace after ','
    "F401",  # imported but unused
]

[bandit]
skip = ["B101", "B102", "B106", "B404"]
exclude = ["tests/*", "build/*"]

[tool.nbqa.black]
line-length = 88

[tool.nbqa.ruff]
line-length = 88

[tool.uv]
python-sources = ["python", "src"]

# Custom NLM configuration
options.nlm.package = "pynlm"
options.nlm.include_tests = true
options.nlm.include_examples = true
options.nlm.include_documentation = true

# Performance optimizations
options.nlm.optimized_build = true
options.nlm.parallel_build = true
options.nlm.use_cpp_standard = "20"
