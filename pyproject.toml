[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "setuptools>=45.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "psutil>=5.8",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
]

[project.optional-dependencies]
full = [
    "matplotlib>=3.5",
    "scipy>=1.8",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
# Enable more verbose output for debugging
build-type = "Release"
# Enable parallel builds
parallel = true

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_TESTING = true
NLM_ENABLE_PYTHON_BINDINGS = true
NLM_ENABLE_PERFORMANCE_OPTIMIZATIONS = true

# Configuration options
[tool.scikit-build.cmake.options]
CMAKE_CXX_STANDARD = 20
CMAKE_CXX_STANDARD_REQUIRED = true
CMAKE_CXX_EXTENSIONS = false
PYTHON_EXECUTABLE = "{python}"
BUILD_SHARED_LIBS = false
NLM_BUILD_TESTS = true
NLM_BUILD_EXPERIMENTS = true
NLM_ENABLE_ASSERTIONS = false

# Python-specific configuration
[tool.scikit-build.cmake.define.python]
PYTHON_EXECUTABLE = "{python}"
PYTHON_INCLUDE_DIRS = "{pybind11_include}"

[tool.pytest.ini_options]
testpaths = ["tests", "python_tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "debug: marks tests as debugging tests",
]

# Build type configurations
[tool.scikit-build.cmake.build_type]
debug = "Debug"
release = "Release"
relwithdebinfo = "RelWithDebInfo"
minsizerel = "MinSizeRel"

# Additional build options
[tool.scikit-build.cmake.vars]
CMAKE_EXPORT_COMPILE_COMMANDS = true
CMAKE_POSITION_INDEPENDENT_CODE = true

# Installation configuration
[build-system.options]
install_dir = "lib"
headers_dir = "include"

# Development tools configuration
[tool.devenv]
python = ">=3.8"
cmake = ">=3.16"
compilers = ["gcc", "clang"]

# Code quality tools
[tool.black]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
know_base_lib = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    ".*\.egg",
    ".*venv",
    ".*build",
    ".*dist",
    "tests/",
]
