[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "cmake>=3.16"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "artificial intelligence", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "numpy>=1.20",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
    "black>=23.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "types-setuptools>=69.0.0",
    "docopt>=0.6.3",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.scripts]
nlm = "nlm.__main__:main"
nlm-cli = "nlm.cli:main"
run-nlm = "nlm.demo:main"
create-nlm = "nlm.create_brain:main"

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Issue Tracker" = "https://github.com/nlm-project/nlm/issues"
"Discussions" = "https://github.com/nlm-project/nlm/discussions"
"Twitter" = "https://twitter.com/nlm_project"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DBUILD_SHARED_LIBS=OFF",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_TESTS = ON
NLM_ENABLE_PYTHON_BINDINGS = ON

[tool.scikit-build.cmake.args]
"-DNLM_ENABLE_DEMO_APPS=ON"
"-DNLM_ENABLE_EXPERIMENTS=ON"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=nlm",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=50",
]
markers = [
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmarks",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/$
'''

[tool.isort]
profile = "black"
line_length = 100
target_version = ["py38", "py39", "py310", "py311", "py312"]
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["nlm", "nlm.*"]

[tool.setuptools.package-dir]
nlm = "python/nlm"

[tool.setuptools.package-data]
nlm = ["*.so", "*.pyd", "*.dll", "*.dylib"]

[tool.coverage.run]
source = ["nlm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "if __debug__:",
    "if False:",
    "if not __debug__:",
    "class .*\(",
    "def __call__",
]

[tool.distutils]
packages = find:

[tool.distutils.setup_keywords]
zip_safe = True
