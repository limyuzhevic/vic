# NLM Python Package Configuration
# Modern Python packaging with scikit-build-core for C++ extensions

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "setuptools>=42", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) - experimental artificial developmental brain simulation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "NLM Authors"}
]
keywords = [
    "neural", "simulation", "spiking", "brain", "learning",
    "neurosimulation", "artificial intelligence", "neural network",
    "computational neuroscience", "brain simulation", "neural dynamics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "sphinx",
    "sphinx-rtd-theme",
]
examples = [
    "matplotlib",
    "pandas",
    "jupyter",
]

[project.urls]
homepage = "https://github.com/nlm-project/nlm"
documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"
Discussions = "https://github.com/nlm-project/nlm/discussions"

[project.scripts]
nlm-python = "pynlm.cli:main"
nlm-benchmark = "pynlm.benchmark:main"
examples-run = "pynlm.examples:main"

[tool.scikit-build]
cmake.version = ">=3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.setuptools]
package-dir = {"" = "python"}
packages = [
    "pynlm",
    "pynlm.brain",
    "pynlm.config",
    "pynlm.examples",
    "pynlm.benchmark",
]

[tool.setuptools.package-data]
pynlm = [
    "*.py",
    "*.json",
    "*.yaml",
    "*.yml",
    "*.txt",
    "*.md",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_sort_within_sections = true
known_first_party = ["pynlm"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = '''
\.eggs
\.git
\.hg
\.mypy_cache
\.tox
\.venv
_build
buck-out
build
_dist
node_modules
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-option-values",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.coverage.run]
source = ["pynlm"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__",
    "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# NLM-specific build configuration
[tool.nlm]
package_name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine)"
main_module = "pynlm"
include_benchmarks = true
include_examples = true
include_cli = true

[tool.nlm.build]
enable_cython = false
use_scikit_build = true
generate_docs = true
build_tests = true
build_examples = true

[tool.nlm.test]
enable_unit_tests = true
enable_integration_tests = true
enable_benchmark_tests = true
enable_performance_tests = true

[tool.nlm.examples]
directory = "examples"
include_tutorials = true
include_advanced = true
include_benchmarks = true
include_research = true
