# Add these lines to pyproject.toml after the project section

# Additional visualization and monitoring subpackage
[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
    "plotly>=5.10.0",
    "dash>=2.6.0",
    "flask>=2.0.0",
    "websockets>=10.0.0",
    "jinja2>=3.0.0",
]

performance = [
    "psutil>=5.8.0",
    "memory-profiler>=0.5.0",
    "cProfile-VProf>=1.0.0",
    "pyinstrument>=4.0.0",
    "py-spy>=0.3.14",
]


# Export comprehensive list of visualization and monitoring features
[project.scripts]
pynlm = "pynlm.cli:main"
pynlm-benchmark = "pynlm.benchmark:main"

# New visualization and monitoring scripts
pynlm-viz = "pynlm_viz.cli:main"
pynlm-monitor = "pynlm_viz.monitor:main"
pynlm-dashboard = "pynlm_viz.dashboard:main"
pynlm-export = "pynlm_viz.export:main"
