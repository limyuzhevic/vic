[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.11.0", "scikit-build-core>=0.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) - A computational brain simulation framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors", email = "contact@nlm.org"}
]
license = {text = "MIT"}
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Framework :: Pytest",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy>=1.20",
    "matplotlib>=3.0",
    "plotly>=5.0",
    "psutil>=5.0",
    "pandas>=1.5",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"

[project.scripts]
nlm = "python.nlm_cli:main"

[tool.setuptools]
packages = ["python"]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
python = [
    "*.py",
    "*.md",
    "*.txt",
    "*.json",
    "*.html",
]

[tool.pytest.ini_options]
testpaths = ["python", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["python"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__:",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]
