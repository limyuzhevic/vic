[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework - Complete artificial brain integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors", email = "contact@nlm-project.org"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience", "artificial intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neural Networks",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education",
    "Framework :: Pytest",
]

# Core dependencies - empty for now as NLM is self-contained
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.19",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=1.0",
]

# Advanced user features
demo = [
    "matplotlib>=3.0",
    "jupyter>=1.0",
    "notebook>=6.0",
]

# Research and analysis
research = [
    "scipy>=1.5",
    "networkx>=2.5",
    "pandas>=1.3",
    "plotly>=5.0",
    "seaborn>=0.11",
]

# Development and testing
devel = [
    "pytest-cov>=2.12",
    "coverage>=5.0",
    "tox>=4.0",
    "setuptools_scm>=7.0",
    "cibuildwheel>=2.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Funding" = "https://github.com/sponsors/nlm-project"
"Twitter" = "https://twitter.com/nlm_project"

[project.scripts]
# Command-line interface for advanced users
nlm = "nlm:main.cli"
nlm-config = "nlm:config.cli"
nlm-demo = "nlm:demos.cli"
nlm-checkpoint = "nlm:checkpoint.cli"

[project.gui-scripts]
"nlm-explorer" = "nlm:gui.explorer"

[project.entry-points.nlm]
"brain-integration" = "nlm.integration:main"
"memory-systems" = "nlm.memory:main"
"prediction-engine" = "nlm.prediction:main"
"cognition" = "nlm.cognition:main"
"neuromodulation" = "nlm.neuromod:main"
"development" = "nlm.development:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_BUILD_EXAMPLES=ON",
    "-DNLM_BUILD_TESTS=ON",
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
]

# Additional scikit-build options
toolchain_file = "cmake/toolchain.cmake"
clean = ["build", "dist", "*.egg-info"]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_BUILD_EXAMPLES = true
NLM_BUILD_TESTS = true
NLM_BUILD_PYTHON_BINDINGS = true
NLM_ENABLE_VISUALIZATION = true
NLM_ENABLE_PYTHON_INTERACTIVE = true
NLM_PYTHON_PACKAGE_NAME = "pynlm"

[tool.scikit-build.cmake.configs]
Debug = {
    CMAKE_BUILD_TYPE = "Debug",
    NLM_ENABLE_ASSERTS = true,
    NLM_ENABLE_PROFILING = true,
}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--timeout=300",
    "--cov=pynlm",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["pynlm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
top_level_methods = ["__all__", "get_all_types"]
skip_glob = ["docs/**/*.md"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools_scm]
write_to = "src/pynlm/_version.py"
write_to_template = "__version__ = {version!r}"

[tool.cibuildwheel]
build = ["cp38-*", "cp39-*", "cp310-*", "cp311-*", "cp312-*"]
archs = ["auto"]
enable = ["*-*linux", "*macosx_*", "*win32", "*win64"]
disable = ["*i686*"]

[tool.cibuildwheel.linux]
actions = [
    "pip wheel {wheeldir} -w {destdir} --no-deps ."
]

[tool.cibuildwheel.macos]
actions = [
    "pip wheel {wheeldir} -w {destdir} --no-deps ."
]

[tool.cibuildwheel.windows]
actions = [
    "pip wheel {wheeldir} -w {destdir} --no-deps ."
]

# NLM-specific configuration
[tool.nlm]
# Development configuration
enable_experimental_features = false
enable_performance_optimizations = true
enable_visualization = true
enable_debug_logging = true

# Simulation parameters
max_neuron_count = 100000
max_synapse_count = 1000000
max_region_count = 100

# Memory limits
memory_limit_gb = 16.0
checkpoint_size_limit_mb = 1024.0

# Performance settings
timestep_default = 0.001
neuron_count_default = 1000
region_count_default = 1
connection_probability_default = 0.1

# Integration settings
enable_memory_integration = true
enable_prediction_integration = true
enable_cognition_integration = true
enable_neuromodulation_integration = true
enable_development_integration = true

# Example configurations
[tools.nlm.configs.default]
neuron_count = 1000
region_count = 1
connection_probability = 0.1
enable_plasticity = true
enable_memory = true
enable_prediction = true
enable_development = true

[tools.nlm.configs.research]
neuron_count = 10000
region_count = 10
connection_probability = 0.05
enable_plasticity = true
enable_memory = true
enable_prediction = true
enable_development = true
enable_advanced_cognition = true

[tools.nlm.configs.demo]
neuron_count = 500
region_count = 1
connection_probability = 0.15
enable_plasticity = true
enable_memory = false
enable_prediction = false
enable_development = true
enable_visualization = true

