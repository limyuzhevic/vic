[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# More useful dependencies for users
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.18.0",
    "numpy>=1.20",
    "scipy>=1.6.0",
    "matplotlib>=3.3.0",  # For visualization
    "jupyter>=1.0.0",     # For interactive examples
    "myst-parser>=0.13.0", # For documentation
    "sphinx>=4.0.0",       # For documentation
]
test = [
    "pytest>=7.0",
    "pytest-cov>=3.0.0",
    "numpy>=1.20",
    "scipy>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Discussion Forum" = "https://github.com/orgs/nlm-project/discussions"

[project.scripts]
nlm-phase6-demo = "pynlm.__main__:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DBUILD_TESTS=ON",  # Enable tests by default
    "-DBUILD_DOCS=ON",   # Enable documentation builds
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Configure pytest plugins
[tool.pytest.ini_options.plugins]
pytest_cov = true

[tool.coverage.run]
source = ["pynlm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]

# Configure scikit-build for development
[tool.scikit-build.build]
build-dir = "build"

# Allow building in development mode
develop = true
