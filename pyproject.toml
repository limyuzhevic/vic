[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Topic :: Software Development :: Libraries",
]

# Dependencies
# Core runtime dependencies (none currently required)
# All functionality is provided by C++ core library

dependencies = []

# Development and testing dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "numpy>=1.20",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0",
]

# Documentation dependencies
[project.optional-dependencies]
docs = [
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.15",
    "nbsphinx>=0.9",
]

# Performance and profiling dependencies
[project.optional-dependencies]
perf = [
    "memory-profiler>=0.61",
    "line-profiler>=4.1",
    "cProfilev>=1.0",
]

# Research and experimental dependencies
[project.optional-dependencies]
research = [
    "jupyter>=1.0",
    "ipython>=8.0",
    "pandas>=1.5",
    "seaborn>=0.12",
]

# All extras combined
[project.optional-dependencies]
all = [
    "pynlm[dev]",
    "pynlm[docs]",
    "pynlm[perf]",
    "pynlm[research]",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
IssueTracker = "https://github.com/nlm-project/nlm/issues"
"Examples" = "https://github.com/nlm-project/nlm/tree/main/examples"
"Documentation" = "https://nlm.readthedocs.io"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

# Additional CMake options for different build types
toolchain_file = ""
optimization-level = "3"
build-type = "Release"

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
# Build options
ENABLE_TESTING = true
ENABLE_PYTHON_BINDINGS = true
ENABLE_PERFORMANCE_FEATURES = true

# Python module configuration
tool.scikit-build.cmake.define.PYTHON_MODULE_NAME = "pynlm"
tool.scikit-build.cmake.define.PYTHON_MODULE_VERSION = "0.1.0"

[tool.scikit-build.cmake.define]
PYTHON_EXECUTABLE = "{python}"
PYTHON_MODULE_INSTALL_DIR = "{site-packages}"

[tool.scikit-build.cmake.define]
INSTALL_PYTHON_MODULE = true
INSTALL_EXAMPLES = true
INSTALL_DOCS = true

# Package metadata
[tool.scikit-build.metadata]
author = "NLM Research Team"
author_email = "research@nlm-project.org"
maintainer = "NLM Development Team"
license = "MIT"
description = "Neural Learning Machine - Python Bindings"
long_description = "NLM (Neural Learning Machine) is an experimental computational brain project implementing spiking neural networks with advanced learning mechanisms, neuromodulation, and developmental processes."

# Installation configuration
[build-system.options]
install_manifest = "install_manifest.txt"
build_temp_dir = "build_temp"
install_temp_dir = "install_temp"

# Testing configuration
tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --disable-warnings"

# Type checking configuration
[mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Code formatting
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

# Coverage configuration
[tool.coverage.run]
source = ["pynlm"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

# Build backend specific configuration
tool.scikit-build-backend.cmake.cmake-variables = "CMAKE_BUILD_TYPE=Release"
