# This file was generated by NLM project improvements
# NLM - Neural Learning Machine (熙然)

[project]
name = "nlm"
version = "0.1.0"
description = "An experimental artificial developmental brain - Neural Learning Machine (熙然, 'serene flow')"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "NLM Research Team", email = "research@nlm.org"}
]
keywords = ["neuroscience", "neural-networks", "artificial-intelligence", "brain", "simulation", "LIF", "spiking-neural-networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Neuroscience",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "docs/"
Repository = "https://github.com/nlm-project/nlm"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"

[tool.pytest.ini_options]
testpaths = ["tests/", "python/tests/"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]

[build-system]
requires = ["setuptools", "wheel", "pybind11>=2.10.0", "pybind11-stubgen>=0.10.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python/"}
packages = ["nlm_py", "nlm_py.bindings"]

[tool.setuptools.package-data]
nlm_py = ["*.py", "*.pyi", "py.typed"]

[tool.setuptools.command.build_ext]
python-requirements = ["pybind11>=2.10.0"]

[tools.nlm]
# Internal NLM-specific configuration
python_bindings = true
performance_optimizations = true
parallel_processing = true
enable_cuda = false
simd_instructions = "avx2"

[tools.nlm.test]
performance_benchmarks = true
integration_tests = true
stress_tests = true

[[tool.nlm.experimental_features]]
name = "checkpoint_compression"
experimental = true
description = "Compressed checkpoint storage"

[[tool.nlm.experimental_features]]
name = "distributed_computing"
experimental = true
description = "Distributed simulation across multiple machines"

[[tool.nlm.experimental_features]]
name = "online_learning"
experimental = true
description = "Continuous learning without stopping simulation"