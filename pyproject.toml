# Modern Python project configuration for NLM Python bindings
# Uses scikit-build-core for C++ extension building

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-build-core>=0.5.0",
    "pybind11>=2.11.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_PYTHON_BINDINGS=ON",  # Enable Python bindings
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
PYTHON_PACKAGE_DIR = "python"  # Directory containing Python bindings

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Additional build options for better development experience
[tool.scikit-build.options]
build-type = "Release"
install-dir = "python"  # Install Python bindings to python/ directory

# Documentation build configuration
[tool.sphinx]
srcdir = "docs"
confdir = "docs"
outdir = "_build/html"
exclude_patterns = ['_build', 'Thumbs.db', '.DS_Store']

# Code quality tools configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["pynlm", "numpy"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true