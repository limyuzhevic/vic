[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors", email = "info@nlm-project.org"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Framework :: Pybind11",
]
dependencies = [
    "numpy>=1.20",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "build",
    "twine",
]

# Enhanced scikit-build configuration
[tool.scikit-build]
cmake.minimum-version = "3.20"
cmake.build-type = "Release"

[tool.scikit-build.cmake]
# Standard CMake options
args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DCMAKE_CXX_EXTENSIONS=OFF",
    "-DPYTHON_EXECUTABLE={python}",
    "-DCMAKE_BUILD_TYPE=Release",
]

# CMake definitions for NLM
[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_TESTS = true
NLM_ENABLE_PYTHON_BINDINGS = true
NLM_ENABLE_DOCS = false

# Enhanced pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--capture=no",
    "-x",  # Stop on first failure
]
markers = [
    "slow: marks tests as slow (deselect by default)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
