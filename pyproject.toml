[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "setuptools>=42"]
build-backend = "scikit_build_core.build"
 
[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "ai", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.20,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "numpy>=1.20,<2.0",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "jupyter>=1.0",
    "ipython>=7.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.991",
    "types-setuptools>=65.5.0",
    "build>=0.10",
]

research = [
    "matplotlib>=3.5",
    "scipy>=1.8",
    "jupyter>=1.0",
    "pandas>=1.5",
    "seaborn>=0.12",
    "plotly>=5.0",
]

docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.17",
    "myst-parser>=0.19",
    "sphinx-argparse>=0.3",
]

all-dev = [
    "pynlm[dev]",
    "pynlm[research]",
    "pynlm[docs]",
]
 
[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Issues" = "https://github.com/nlm-project/nlm/issues"
"Discussion" = "https://github.com/nlm-project/nlm/discussions"
Changelog = "https://github.com/nlm-project/nlm/releases"
"Contact" = "mailto:research@nlm.org"
 
[project.scripts]
nlm-cli = "nlm_cli:main"
nlm-research = "research_utils:main"
create-brain = "scripts.brain_cli:create_brain_command"
run-simulation = "scripts.brain_cli:run_simulation_command"

[project.gui-scripts]
nlm-explorer = "gui.nlm_viewer:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DCMAKE_BUILD_TYPE=Release",
]

# Build options
build-type = "both"
build-static = true
build-shared = true

skip-component = [
    "nlm_test",
]
 
[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_BUILD_TESTS = false
NLM_BUILD_PYTHON_BINDINGS = true
NLM_BUILD_PHASE6_EXPERIMENTS = true
NLM_BUILD_EXAMPLES = true
NLM_ENABLE_PYTHON_CLI = true
 
# Python-specific build options
[tool.scikit-build.cmake]
options = {
    "NLM_BUILD_PYTHON_BINDINGS" = true,
    "NLM_ENABLE_PYTHON_CLI" = true,
}
 
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=pynlm",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
cov_source = ["pynlm"]
cov_report_file = "coverage.xml"

# Black formatting
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Flake8 linting
[tool.flake8]
max-line-length = 88
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "eggs",
    ".tox",
    "venv",
    ".venv",
    "env",
    ".env",
    "htmlcov",
    ".coverage",
    ".flake8",
    "*.egg-info",
]
ignore = [
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
    "E203",  # whitespace before ':' (conflicts with black)
    "E226",  # missing whitespace around arithmetic operator
    "E302",  # expected 2 blank lines
    "E305",  # expected 2 blank lines after class/function
]

# Mypy type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
allow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# scikit-build specific configuration
[tool.scikit-build.cmake]
build-type = "Release"
install = true
install-dir = "{prefix}/lib/python3.8/site-packages"
 
# Custom commands
[tool.scikit-build.commands]
build = "scikit_build_core.build:build"
install = "scikit_build_core.build:install"
test = "scikit_build_core.build:test"

# Documentation configuration
[tool.sphinx]
project = "NLM Python Bindings"
author = "NLM Authors"
version = "0.1.0"
extensions = [
    "sphinx.ext.autodoc",
    "sphinx.ext.napoleon",
    "sphinx.ext.viewcode",
    "sphinx.ext.autosectionlabel",
    "sphinx.ext.intersphinx",
    "sphinx.ext.mathjax",
    "sphinx.ext.githubpages",
]
html_theme = "sphinx_rtd_theme"
html_static_path = ["_static"]
html_css_files = ["custom.css"]
htmljs_path = "_static"
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
add_module_names = false

# GitHub Pages configuration
[tool.github.pages]
domain = "github.io"
project_name = "nlm"
branch = "gh-pages"

# Project metadata
[tool.project.metadata]
url = "https://github.com/nlm-project/nlm"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
long_description = """
NLM (Neural Learning Machine) Python Bindings

An experimental artificial developmental brain simulator that implements
spiking neural networks with multiple integrated memory systems,
neuromodulation, prediction, and cognition.

## Installation

```bash
pip install pynlm
```

## Quick Start

```python
import pynlm

# Create a brain
brain = pynlm.create_brain()
brain.initialize()

# Run simulation
for step in range(100):
    brain.step(step)
```

## Documentation

For comprehensive documentation, visit: https://nlm.readthedocs.io

## Research Features

The NLM Python bindings include advanced research utilities for simulation,
analysis, and visualization of neural networks.
"""
