pynlm
0.1.0
Python bindings for NLM (Neural Learning Machine) with enhanced visualization and debugging tools
MIT
NLM Authors <authors@nlm.org>
Requires-Python = ">=3.8"
Keywords = ["neural", "simulation", "spiking", "brain", "learning", "visualization", "debugging"]
Classifiers =
    "Development Status :: 3 - Alpha"
    "Intended Audience :: Science/Research"
    "License :: OSI Approved :: MIT License"
    "Programming Language :: Python :: 3"
    "Programming Language :: Python :: 3.8"
    "Programming Language :: Python :: 3.9"
    "Programming Language :: Python :: 3.10"
    "Programming Language :: Python :: 3.11"
    "Programming Language :: Python :: 3.12"
    "Topic :: Scientific/Engineering :: Artificial Intelligence"

Dependencies =
    # Core dependencies - NLM provides C++ library
    
[project.optional-dependencies]
dev =
    pytest>=7.0
    numpy>=1.20
    matplotlib>=3.5
    jupyter>=1.0
    ipykernel>=6.0
    
visualization =
    matplotlib>=3.5
    numpy>=1.20
    pillow>=9.0
    
web_interface =
    flask>=2.0
    websocket-client>=1.0
    
visualization = [
    matplotlib>=3.5
    numpy>=1.20
    pillow>=9.0
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[build-system.cmake.options]
CMAKE_BUILD_TYPE = "Release"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_ENABLE_PYTHON_BINDINGS=ON",
    "-DNLM_ENABLE_VISUALIZATION=ON",
    "-DNLM_ENABLE_DEBUGGING=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_PYTHON_BINDINGS = true
NLM_ENABLE_VISUALIZATION = true
NLM_ENABLE_DEBUGGING = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
extend-exclude = '''
/(\.eggs|
  \.git|
  \.hg|
  \.mypy_cache|
  \.tox|
  \.venv|
  env|
  build|
  dist|
  venv
  |\.git
  |\.hg
  |\.mypy_cache
  |\.tox
  |\.venv
  |\.eggs
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "\.eggs/",
    "\.git/",
    "\.hg/",
    "\.mypy_cache/",
    "\.tox/",
    "\.venv/",
    "build/",
    "dist/",
]

[tool.coverage.run]
source = ["nlm_visualization_tools"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]
