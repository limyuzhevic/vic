[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) - An experimental artificial developmental brain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors", email = "nlm-research@example.com"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "ai", "artificial", "developmental", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Topic :: Software Development :: Libraries",
    "Framework :: Pytest",
]
dependencies = [
    "numpy>=1.20",  # For array operations and numerical computations
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=2.12.0",  # Coverage reporting
    "numpy>=1.20",
    "black>=22.0",  # Code formatting
    "isort>=5.0",   # Import sorting
    "mypy>=0.991",  # Type checking
    "ruff>=0.1.0",  # Linting
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.scikit-build.cmake.args]
CMAKE_BUILD_PARALLEL_LEVEL = 4

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py", "example_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--cov=pynlm",
    "--cov-report=term-missing",
    "-v"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "./.git",
    "./.tox",
    "./.venv",
    "venv/",
    "build/",
    "dist/",
    "__pycache__/",
    "*.pyc"
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
extend-generative = true
include = "\.pyi?$"
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "N",   # pep8-naming
]
ignore = [
    "E501",  # Line too long (handled by black)
    "W503",  # Line break before binary operator
    "W504",  # Line break after binary operator
    "C901",  # McCabe complexity (too strict for experimental code)
]
exclude = [
    "./.git",
    "./.tox",
    "./.venv",
    "venv/",
    "build/",
    "dist/",
    "__pycache__/",
    "*.pyc"
]

[tool.ruff.isort]
knowledge_base = "datasettex"
skip = ["tests"]

[tool.coverage.run]
source = ["pynlm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "if __name__ == '__main__'.",
    "def main()",
    "if __debug__:",
]
