[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Python dependencies for development and advanced functionality
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5; extra == 'plotting'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "scikit-learn>=1.0; extra == 'advanced'",
    "torch>=1.9; extra == 'advanced'",
    "scipy>=1.8; extra == 'advanced'",
]
plotting = [
    "matplotlib>=3.5",
]
advanced = [
    "scikit-learn>=1.0",
    "torch>=1.9",
    "scipy>=1.8",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
# scikit-build-core >= 0.8 renamed minimum-version to version.
cmake.version = ">=3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_BUILD_PYTHON_BINDINGS=ON",
    "-DNLM_BUILD_PYTHON_BINDINGS_ADVANCED=ON",  # Enable advanced Python features
    "-DNLM_PYTHON_MODULE_VERSION=0.1.0",
]

# Additional CMake definitions for Python bindings
[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_PYTHON_BINDINGS_ADVANCED = true
NLM_PYTHON_MODULE_VERSION = "0.1.0"

[tool.scikit-build.cmake.define]
name = "Python Bindings Configuration"
description = "Configuration options for NLM Python bindings"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Advanced Python bindings configuration
[tool.scikit-build.cmake.define]
PYBIND11_PYTHON_VERSION = "3.8"
PYBIND11_PLATFORM_TAGS = true
PYBIND11_SIMD_OPTIMIZATIONS = true
PYBIND11_PYTHON_EXTENSIONS = true
PYBIND11_PYTHON_DEBUG = false
PYBIND11_PYTHON_MODULE_INSTALL = true

# Documentation configuration
[tool.pydocstyle]
convention = "numpy"
ignore = [
    "test_*.py",
    "**/tests/**",
    "python/bindings*.py",
]

# Code quality and linting
[tool.ruff]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D203", "D213", "D417"]
line-length = 88
indent-width = 4
target-version = "py38"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"**/tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
