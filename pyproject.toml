[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "2.0.0"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Team"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Framework :: Pytest",
]
dependencies = [
    "numpy>=1.20",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "numpy>=1.20",
    "pybind11>=2.11.0",
    "scikit-build-core>=0.5.0",
    "cmake>=3.16",
]
extended = [
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"Documentation" = "https://nlm.readthedocs.io"

[project.scripts]
pynlm-benchmark = "pynlm.benchmark:main"
pynlm-explore = "pynlm.explorer:main"
pynlm-demo = "pynlm.demo:main"
pynlm-train = "pynlm.trainer:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DBUILD_TESTING=ON",
    "-DENABLE_PERFORMANCE_PROFILING=ON",
    "-DENABLE_ADVANCED_FEATURES=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
ENABLE_PERFORMANCE_PROFILING = "ON"
ENABLE_ADVANCED_FEATURES = "ON"
ENABLE_EXAMPLES = "ON"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | "_venv"
  | "__pycache__"
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = "3"
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_third_party = ["numpy", "pybind11", "scikit-build-core"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/examples/*",
    "*/demo/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system.overrides]
[[build-system.overrides."pygments.*"]]
requires = ["pygments"]
[[build-system.overrides."matplotlib.*"]]
requires = ["matplotlib"]

# Package data
include-package-data = true

[tool.setuptools.package-data]
pynlm = ["*.pyx", "*.pxd", "*.hpp", "*.cpp", "*.h", "*.md", "*.rst"]
pynlm.* = ["*.py", "*.pxd", "*.hpp", "*.cpp", "*.h"]

# Custom commands
[project.scripts]
# Basic commands
pynlm-info = "pynlm.__main__:main"
pynlm-run = "pynlm.runner:main"

# Development commands
pynlm-dev = "pynlm.developer:main"
pynlm-build = "pynlm.builder:main"
pynlm-test = "pynlm.tester:main"

# Analysis commands
pynlm-analyze = "pynlm.analyzer:main"
pynlm-profile = "pynlm.profiler:main"
pynlm-benchmark = "pynlm.benchmark:main"

# Training commands
pynlm-train = "pynlm.trainer:main"
pynlm-evolve = "pynlm.evolver:main"
pynlm-optimize = "pynlm.optimizer:main"