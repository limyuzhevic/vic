[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "black>=22.0",
    "ruff>=0.0.1",
    "mypy>=0.991",
]

build-backend = "scikit_build_core.build"

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
"Bug Tracker" = "https://github.com/nlm-project/nlm/issues"
"CI/CD" = "https://github.com/nlm-project/nlm/actions"

[project.scripts]
nlm = "nlm.cli:main"
nlm_demo = "nlm.cli:phase6_demo"
create_brain = "nlm.cli:create_brain"
plot_network = "nlm.cli:plot_network"
save_checkpoint = "nlm.cli:save_checkpoint"
load_checkpoint = "nlm.cli:load_checkpoint"
enable_feature = "nlm.cli:enable_feature"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DCMAKE_BUILD_TYPE=Release",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
ENABLE_TESTS = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = |
    /(
        \.eggs
        | \.git
        | \.hg
        | \.mypy_cache
        | \.tox
        | \.venv
        | _build
        | buck-out
        | build
        | dist
    )/
    /venv/
    /env/

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = []
per-file-ignores = {}

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING",
    "raise AssertionError",
    "raise NotImplementedError",
]
show_missing = true

[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "setuptools"]
build-backend = "setuptools.build_meta"

[project.build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0", "setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
nlm = "nlm.cli:main"
nlm_demo = "nlm.cli:phase6_demo"
