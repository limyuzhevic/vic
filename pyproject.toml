[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core dependencies - now minimal for flexibility
    # Users can install optional dependencies:
    # pip install pynlm[dev]
    # pip install pynlm[performance]
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "scipy>=1.5",
    "matplotlib>=3.3",
    "pandas>=1.0",
    "jupyter>=1.0",
]

performance = [
    "numba>=0.50",
    "cupy-cuda12x; platform_system == 'Linux'",
    "torch; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_ADVANCED_BINDINGS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_PERFORMANCE = "ON"
NLM_ENABLE_EXPERIMENTS = "ON"

[tool.pytest.ini_options]
testpaths = ["tests", "advanced_tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Advanced build configuration
[tool.nlm]
advanced_bindings = true
performance_optimizations = true
experiment_suite = true

# Development tools configuration
[tool.nlm.development]
profile_memory = true
profile_performance = true
enable_logging = true
checkpoint_frequency = 1000

# Experiment configuration
[tool.nlm.experiments]
scaling_benchmarks = true
ablation_studies = true
performance_tests = true
phase6_integration = true
