[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.2.0"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework with advanced features, Pythonic API, and comprehensive utilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Development Team"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "AI", "neuroscience", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "numpy>=1.20; python_version>='3.8'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "sphinx>=4.0",
    "matplotlib>=3.0",
]

test = [
    "pytest>=7.0",
    "numpy>=1.20",
    "coverage>=6.0",
]

[project.urls]
Homepage = "https://github.com/neural-learning-machine/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/neural-learning-machine/nlm.git"
"Bug Tracker" = "https://github.com/neural-learning-machine/nlm/issues"
Discussions = "https://github.com/neural-learning-machine/nlm/discussions"

[project.scripts]
nlm = "nlm:main"
pynlm = "pynlm:main"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DBUILD_TESTS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
ENABLE_PYTHON_BINDINGS = true
ENABLE_PYTHON_DOCUMENTATION = true
ENABLE_PYTHON_EXAMPLES = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "return NotImplemented",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
known_third_party = ["pybind11", "numpy"]
