[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm"
version = "0.1.0"
description = "Python bindings for NLM (Neural Learning Machine) C++ neural simulation framework with enhanced visualization and analysis capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "visualization", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "sphinx>=4.0",
    "numpydoc>=1.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Additional dependencies for enhanced visualization and analysis
[project.optional-dependencies.analysis]
plotly = ["plotly>=5.0.0"]
"graphviz" = ["graphviz>=0.20"]
"networkx" = ["networkx>=3.0"]

[project.optional-dependencies.realtime]
websocket = ["websockets>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies.export]
"export-all" = ["scipy>=1.7.0", "pandas>=1.3.0", "pillow>=9.0.0"]

[tool.scikit-build.cmake.define]
WITH_VISUALIZATION = true
WITH_ANALYSIS = true
WITH_PYTHON_BINDINGS = true
WITH_WEBSOCKET_SUPPORT = true
WITH_MULTI_FORMAT_EXPORT = true

[tool.scikit-build.cmake.args]
-DVISUALIZATION_BACKEND = "opengl"
-DANALYSIS_BACKEND = "numpy"
-DEXPORT_FORMATS = "png,json,csv,html"
