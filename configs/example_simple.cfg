# NLM Example Configuration File 1: Simple Simulation
# Basic settings for a small-scale neural simulation

simulation_timestep = 0.001
neuron_count = 500
region_count = 2
random_seed = 42
connection_probability = 0.1

# Plasticity settings (enabled by default)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.0
curiosity_enabled = true
novelty_enabled = true
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20
vision_width = 16
vision_height = 16

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Development settings
enable_development = true
development_stage = CriticalPeriod

# Performance settings
enable_checkpointing = false
checkpoint_interval = 1000
enable_replay = false

# Visualization
visualization_enabled = false
visualization_update_rate = 30.0

# Agent settings
agent_start_x = 10.0
agent_start_y = 10.0
agent_max_energy = 100.0
agent_energy_decay = 0.01
