# NLM Configuration File - Simple Key/Value Format
# This example shows the traditional key=value format used by NLM
# This format is still supported for backward compatibility

# Basic simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.15

# Plasticity parameters
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation parameters
dopamine_baseline = 0.0
curiosity_baseline = 0.1

# Reward parameters
reward_discount_factor = 0.99

# Environment parameters
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging parameters
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation parameters
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization parameters
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 2 specific parameters
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
enable_reward_modulation = true

# Experimental settings
experiment_name = "Phase2_Demo"
experiment_description = "Phase 2 demonstration experiment with all features enabled"
