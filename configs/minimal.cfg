# NLM Minimal Configuration
# Ultra-lightweight for basic testing and quick experiments

# Random seed for basic testing
random_seed = 42

# Simulation timestep in seconds (fast for testing)
simulation_timestep = 0.001

# Number of neurons in the brain (minimal)
neuron_count = 50

# Number of brain regions (single region)
region_count = 1

# Connection probability for random connectivity (very sparse)
connection_probability = 0.02

# Plasticity settings (minimal)
stdp_ltp_weight = 0.005
stdp_ltd_weight = 0.006
stdp_tau = 10.0
plasticity_learning_rate = 0.005

# Structural plasticity settings (minimal)
synaptogenesis_rate = 0.0
pruning_rate = 0.0

# Neuromodulation settings (minimal)
dopamine_baseline = 0.0
dopa_shift = 0.1
dopa_weight = 0.5

# Reward settings (basic)
reward_discount_factor = 0.9
reward_window = 1.0

# Environment settings (small)
environment_name = GridWorld
environment_width = 3
environment_height = 3

# Logging settings (minimal)
log_level = WARN
log_to_file = false
log_filename = nlm.log
log_detailed = false

# Simulation settings (short for quick tests)
max_simulation_steps = 100
simulation_time_limit = 0.0
enable_checkpoints = false
checkpoint_interval = 1000

# Visualization settings (disabled)
visualization_enabled = false
visualization_update_rate = 30.0
enable_progress_logging = false
progress_log_interval = 100

# Neural dynamics settings (basic)
neuron_threshold = -50.0
neuron_rest_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Memory system settings (minimal)
working_memory_capacity = 10
episodic_memory_capacity = 50
associative_memory_strength = 0.3

# Prediction system settings (minimal)
prediction_horizon = 2
prediction_confidence_threshold = 0.6

# Neuromodulation settings (minimal)
curiosity_scaling = 0.1
novelty_threshold = 0.2
prediction_error_decay = 0.05

# Development stages (basic)
development_start_time = 0.0
development_end_time = 5.0
development_stage_duration = 5.0

# Purpose: quick testing and validation
# Usage: nlm --mode phase2 --config minimal.cfg
# Estimated time: ~2-3 minutes for full execution