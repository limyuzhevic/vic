# NLM Configuration Preset - Sleep/Rest Cycle Demo
# Configuration designed to showcase the sleep/rest cycle with memory consolidation

random_seed = 999
simulation_timestep = 0.001
neuron_count = 800
region_count = 2
connection_probability = 0.08
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Developmental settings with sleep/rest integration
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Sleep/rest cycle configuration (NEW PARAMETERS)
sleep_threshold = 150      # Enter rest after 150 steps of activity
consolidation_factor_rest = 0.8  # Enhanced consolidation during rest
development_frequency_rest = 50  # More frequent development updates during rest

# Neuromodulation with sleep integration
dopamine_baseline = 0.0
reward_discount_factor = 0.99

# Environment with rest periods
environment_name = GridWorld
environment_width = 12
environment_height = 12

# Simulation settings with rest cycle
max_simulation_steps = 20000
simulation_time_limit = 0.0

# Logging with sleep cycle tracking
log_level = INFO
log_to_file = true
log_filename = nlm_sleep_demo.log

# Visualization for sleep cycle analysis
visualization_enabled = true
visualization_update_rate = 5.0