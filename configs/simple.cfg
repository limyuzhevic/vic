# Simple Neural Network Configuration - Plain Text Format
# This is a simple key=value format for basic configuration

# Network Parameters
neuron_count = 100
region_count = 1
connection_probability = 0.1
simulation_timestep = 0.001

# Plasticity Parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
hebbian_learning_rate = 0.01

# Neuromodulation Parameters
baseline_dopamine = 0.1
prediction_gain = 2.0
exploration_rate = 0.05
novelty_threshold = 0.8

# Memory Parameters
working_memory_capacity = 50
working_memory_decay = 0.9
episodic_memory_max_episodes = 500
episodic_memory_compression = true

# Environment Parameters
environment_type = simulated
environment_width = 50
environment_height = 50
environment_depth = 5
environment_obstacles = false
environment_step_penalty = -0.01
environment_goal_reward = 100.0

# Experiment Parameters
experiment_type = learning_experiment
experiment_duration = 100
evaluation_metric = learning_rate
metrics = spike_count,weight_change,firing_rate
