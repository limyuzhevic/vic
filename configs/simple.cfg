# NLM Simple Example Configuration
# Minimal setup for demonstration and testing

version: "6.0"
description: "NLM Simple Example Configuration"

simulation:
  timestep: 0.001
  steps: 100
  neuron_count: 100
  region_count: 1
  random_seed: 42

connectivity:
  connection_probability: 0.2
  delay:
    min: 1
    max: 3

plasticity:
  stdp:
    ltp_weight: 0.02
    ltd_weight: 0.015
    tau: 20.0
  hebbian:
    learning_rate: 0.01
    max_weight: 1.0
  structural:
    synaptogenesis_rate: 0.0001
    pruning_rate: 0.00001

memory:
  working_memory:
    capacity: 50

neuromodulation:
  dopamine:
    initial_level: 0.1
    learning_modulation: 1.0

performance:
  checkpoint_dir: "./checkpoints"
  max_checkpoints: 5

# This configuration is designed for:
# - Quick testing and demonstration
# - Basic learning experiments
# - Performance benchmarking
# - Educational purposes
