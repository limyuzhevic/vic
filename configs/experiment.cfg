# Comprehensive configuration for scientific experiments
# Designed for reproducibility and scientific analysis

brain.neuron_count = 3000
brain.region_count = 5
brain.connection_probability = 0.08
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1

# Neuron parameters
brain.neurons.v_thresh = -50.0
brain.neurons.v_rest = -70.0
brain.neurons.v_reset = -75.0
brain.neurons.tau_mem = 20.0
brain.neurons.tau_ref = 2.0

# STDP plasticity
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian plasticity
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.00005
plasticity.structural.pruning_rate = 0.00005

# Neuromodulation
neuromodulation.dopamine.scale = 1.0
neuromodulation.curiosity.enable = true
neuromodulation.novelty.enable = true

# Simulation
simulation.timestep = 0.001

# Logging
logging.level = "info"
logging.file = "nlm_experiment.log"
logging.max_file_size = 104857600  # 100MB
logging.append = true

# Experiment
experiment.random_seed = 42          # Fixed for reproducibility
experiment.log_detailed = true
experiment.save_intermediate = true
experiment.intermediate_file = "nlm_experiment_intermediate.bin"