# NLM Configuration Presets
# Pre-configured settings for different experimental scenarios

# ============================================================================
# Development and Testing Environment
# ============================================================================

[development]
name = "Development and Testing"
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500  # Smaller for faster development
region_count = 1
connection_probability = 0.15
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
dopamine_baseline = 0.1
dopamine_decay_rate = 0.1
dopamine_release_rate = 1.0
dopamine_peak_level = 1.0
log_level = INFO
log_to_file = false
log_filename = nlm_dev.log
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_dir = ./checkpoints
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 50
episodic_memory_episodes = 1000
environment_name = GridWorld
environment_width = 10
environment_height = 10
visualization_enabled = false
visualization_update_rate = 30.0

# ============================================================================
# Production and Research Environment
# ============================================================================

[production]
name = "Production and Research"
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000  # Full-scale simulation
region_count = 2
connection_probability = 0.1
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.001
pruning_rate = 0.0001
dopamine_baseline = 0.0
dopamine_decay_rate = 0.05
dopamine_release_rate = 2.0
dopamine_peak_level = 1.5
log_level = INFO
log_to_file = true
log_filename = nlm_production.log
max_simulation_steps = 100000
simulation_time_limit = 0.0
checkpoint_dir = ./checkpoints
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 100
episodic_memory_episodes = 5000
environment_name = GridWorld
environment_width = 20
environment_height = 20
visualization_enabled = false
visualization_update_rate = 10.0

# ============================================================================
# High-Performance Computing Environment
# ============================================================================

[hpc]
name = "High-Performance Computing"
random_seed = 12345
simulation_timestep = 0.0005
neuron_count = 2000  # Large-scale simulation
region_count = 3
connection_probability = 0.05
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.014
stdp_tau = 25.0
synaptogenesis_rate = 0.0005
pruning_rate = 0.00005
dopamine_baseline = 0.05
dopamine_decay_rate = 0.02
dopamine_release_rate = 1.5
dopamine_peak_level = 1.2
log_level = WARNING
log_to_file = true
log_filename = nlm_hpc.log
max_simulation_steps = 50000
simulation_time_limit = 0.0
checkpoint_dir = ./checkpoints_hpc
replay_interval = 200
consolidation_interval = 2000
working_memory_capacity = 200
episodic_memory_episodes = 10000
environment_name = GridWorld
environment_width = 30
environment_height = 30
visualization_enabled = false
visualization_update_rate = 5.0
performance_mode = true
simd_enabled = true
parallel_enabled = true

# ============================================================================
# Real-Time Interactive Environment
# ============================================================================

[realtime]
name = "Real-Time Interactive"
random_seed = 999
simulation_timestep = 0.01
neuron_count = 200  # Small for responsive interaction
region_count = 1
connection_probability = 0.2
stdp_ltp_weight = 0.025
stdp_ltd_weight = 0.02
stdp_tau = 15.0
synaptogenesis_rate = 0.002
pruning_rate = 0.0002
dopamine_baseline = 0.2
dopamine_decay_rate = 0.5
dopamine_release_rate = 0.8
dopamine_peak_level = 2.0
log_level = INFO
log_to_file = true
log_filename = nlm_realtime.log
max_simulation_steps = 5000
simulation_time_limit = 3600.0  # 1 hour
checkpoint_dir = ./checkpoints_realtime
replay_interval = 50
consolidation_interval = 500
working_memory_capacity = 20
episodic_memory_episodes = 500
environment_name = GridWorld
environment_width = 5
environment_height = 5
visualization_enabled = true
visualization_update_rate = 30.0
interactive_mode = true
input_delay = 0.001
output_delay = 0.001

# ============================================================================
# Stress Testing Environment
# ============================================================================

[stress]
name = "Stress Testing"
random_seed = 777
simulation_timestep = 0.001
neuron_count = 3000  # Very large scale
region_count = 4
connection_probability = 0.03
stdp_ltp_weight = 0.008
stdp_ltd_weight = 0.008
stdp_tau = 30.0
synaptogenesis_rate = 0.003
pruning_rate = 0.0003
dopamine_baseline = 0.0
dopamine_decay_rate = 0.01
dopamine_release_rate = 3.0
dopamine_peak_level = 2.5
log_level = WARNING
log_to_file = true
log_filename = nlm_stress.log
max_simulation_steps = 20000
simulation_time_limit = 0.0
checkpoint_dir = ./checkpoints_stress
replay_interval = 10
consolidation_interval = 100
working_memory_capacity = 300
episodic_memory_episodes = 20000
environment_name = GridWorld
environment_width = 50
environment_height = 50
visualization_enabled = false
visualization_update_rate = 1.0
memory_limit_mb = 2048
test_mode = true
verbose_errors = true

# ============================================================================
# Advanced Configuration Options
# ============================================================================

[advanced]
# Advanced plasticity settings
hebbian_learning_rate = 0.01
hebbian_decay_rate = 0.001
structural_plasticity_enabled = true
plasticity_modulation_enabled = true
neuromodulation_enabled = true

# Memory system settings
working_memory_enabled = true
episodic_memory_enabled = true
associative_memory_enabled = true
replay_enabled = true
consolidation_enabled = true

# Prediction and cognition settings
prediction_system_enabled = true
concept_formation_enabled = true
attention_system_enabled = true
planning_enabled = true

# Development and maturation settings
development_system_enabled = true
maturation_enabled = true
synaptogenesis_enabled = true
pruning_enabled = true
critical_period_enabled = true

# Neuromodulation settings
dopamine_enabled = true
acetycholine_enabled = true
norepinephrine_enabled = true
serotonin_enabled = true
novelty_enabled = true
curiosity_enabled = true
prediction_error_enabled = true

# Environment and sensory settings
sensory_processing_enabled = true
motor_control_enabled = true
action_selection_enabled = true
reward_system_enabled = true
