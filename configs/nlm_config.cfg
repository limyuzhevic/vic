# NLM Configuration File Format
# Key=value pairs for configuration

# Basic simulation parameters
brain.neuron_count = 1000
brain.synapse_density = 0.1
brain.connection_probability = 0.05
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# Plasticity configuration
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.structural.enable = true

# Neuromodulation configuration
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true
neuromod.prediction.error.scale = 1.0

# Development and learning
development.enable = true
development.stage.initial = 0.0
development.stage.critical_period = 100.0
development.stage.maturation = 500.0
development.stage.adult = 1000.0

# Memory system
memory.working.capacity = 100
memory.episodic.max_episodes = 1000
memory.associative.max_associations = 5000

# Prediction system
prediction.sequence.length = 50
prediction.action.max_steps = 10

# Cognitive systems
attention.inhibition_strength = 0.5
attention.excitation_strength = 1.5
planning.depth = 5
planning.horizon = 10

# Performance and logging
logging.level = INFO
simulation.timestep = 0.001
simulation.max_steps = 1000
performance.checkpoint.enabled = false
performance.checkpoint.interval = 1000
performance.checkpoint.max_files = 10
performance.checkpoint.compression = BALANCED

# Experimental parameters
experiment.reward.scale = 1.0
experiment.reward.discount = 0.99
experiment.exploration.curiosity = 0.1
experiment.exploration.novelty = 0.5
