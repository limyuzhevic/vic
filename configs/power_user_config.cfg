# NLM Configuration File
# Full Configuration Reference

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (smaller = more accurate, slower)
simulation_timestep = 0.001

# Number of neurons in the brain (larger = more complex, slower)
neuron_count = 1000

# Number of brain regions (larger = more modular, better separation)
region_count = 2

# Connection probability for random connectivity (0.0 = sparse, 1.0 = dense)
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Sensory settings (for Phase 3+)
vision_width = 16
vision_height = 16
vision_fov = 3.0
vision_sensitivity = 0.8

# Motor settings (for Phase 3+)
motor_max_speed = 2.0
motor_max_rotation = 0.2
motor_action_interval = 0.1

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced Power User Settings

# Performance tuning
optimization_level = 2  # 0=minimal, 1=balanced, 2=maximum performance
enable_vectorization = true
enable_parallel_processing = true
thread_count = 4

# Memory management
working_memory_size = 1024
episodic_memory_capacity = 100
associative_memory_size = 500

# Advanced neuromodulation
enable_complex_neuromodulation = true
novelty_threshold = 0.5
curiosity_sensitivity = 0.3
prediction_error_weight = 0.5

# Advanced plasticity
enable_reward_modulated_plasticity = true
eligibility_trace_decay = 0.9
weight_normalization = true

# Advanced development
enable_structural_development = true
developmental_stage_duration = 1000
maturation_threshold = 5000

# Advanced cognition
enable_neural_planning = true
planning_horizon = 10
enable_concept_formation = true
concept_formation_threshold = 0.7

# Advanced memory systems
enable_replay_system = true
replay_frequency = 0.1
consolidation_threshold = 0.8

# Advanced debugging and profiling
enable_detailed_profiling = true
profile_frequency = 1000
debug_level = 2  # Optional command-line: --enable-debug

# Checkpoints and persistence
checkpoint_interval = 100
checkpoint_compression = true
checkpoint_encryption = false

# Power user commands (run-time only)
# --enable-debug
# --enable-profiling
# --enable-vectorization
# --checkpoint-interval=500
# --log-level=DEBUG
# --random-seed=12345
# --neuron-count=2000
