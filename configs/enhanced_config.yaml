# YAML configuration file
experiment: phase6_integration
description: "Phase 6 integration experiment with enhanced neuromodulation"

brain:
  neuron_count: 500
  region_count: 1
  connection_probability: 0.15
  random_seed: 42

simulation:
  timestep: 0.001
  max_steps: 2000
  duration_seconds: 2.0

memory:
  working_memory_capacity: 100
  episodic_memory_max_episodes: 1000
  episodic_memory_max_entries_per_episode: 200
  associative_memory_size: 500
  replay_interval: 100
  consolidation_interval: 1000

neuromodulation:
  enable_dopamine: true
  dopamine_baseline: 0.1
  dopamine_peak: 1.0
  dopamine_decay_rate: 0.05
  dopamine_release_rate: 1.0
  time_constant: 10.0

  enable_curiosity: true
  curiosity_novelty_weight: 0.5
  curiosity_prediction_error_weight: 0.5
  curiosity_decay_rate: 0.05

  enable_novelty: true
  novelty_threshold: 0.3
  novelty_decay_rate: 0.1

  enable_acetylcholine: false
  enable_norepinephrine: false
  enable_serotonin: false

plasticity:
  stdp_enabled: true
  hebbian_enabled: true
  reward_modulated_enabled: true
  stdp_ltp_weight: 0.02
  stdp_ltd_weight: 0.015
  stdp_time_constant: 20.0
  hebbian_strength: 0.01

  structural_enabled: true
  synaptogenesis_rate: 0.0001
  pruning_rate: 0.00001
  structural_interval: 100

development:
  enable: true
  stage: critical
  initial_plasticity: 1.0
  critical_plasticity: 0.8
  maturation_plasticity: 0.5
  adult_plasticity: 0.2
  developmental_interval: 1000

prediction:
  enabled: true
  prediction_error_weight: 0.5
  confidence_threshold: 0.7
  prediction_update_interval: 50

cognition:
  enable_planner: true
  planning_depth: 5
  planning_window: 10
  enable_concept_formation: true
  concept_update_threshold: 0.5
  concept_decay_rate: 0.05

  enable_attentional_selection: true
  inhibition_strength: 0.5
  excitation_strength: 2.0

motor:
  enable_action_selection: true
  action_threshold: 0.5
  action_selection_mode: exploration

environment:
  observation_mode: full
  observation_decay: 0.5
  reward_function: temporal
  reward_threshold: 0.1

checkpointing:
  enabled: true
  interval: 1000
  max_checkpoints: 10
  compression: balanced
  directory: ./checkpoints

experimental:
  enable_burst_stimulation: false
  burst_stimulation_frequency: 100
  enable_synaptic_scaling: true
  scaling_cap: 3.0
  noise_level: 0.01
  enable_temperature_control: false
  temperature: 1.0

analysis:
  enable_neural_activity_export: true
  enable_synaptic_matrix_export: true
  enable_memory_export: true
  enable_neuromodulator_export: true
  analysis_interval: 100
  export_format: json
