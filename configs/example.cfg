# NLM Custom Configuration Example
# Users can create custom configuration files

# Basic neural network configuration
random_seed = 999
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.1

# Learning parameters
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.01
stdp_time_constant = 15.0

# Development settings
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005

# Neuromodulation
dopamine_baseline = 0.05

# Reward processing
reward_discount_factor = 0.98

# Environment setup
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging
log_level = INFO
log_to_file = false
log_filename = my_simulation.log

# Runtime settings
max_simulation_steps = 2000
simulation_time_limit = 0.0

# Visualization
visualization_enabled = false
visualization_update_rate = 15.0
