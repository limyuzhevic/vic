# Example: NLM configuration file for custom experiments
# This shows different ways to specify configuration values

# Basic configuration
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2

# Neuron parameters with different formatting styles
threshold = 15.0  # Firing threshold in mV
membrane_capacitance = "1.0"  # Can be quoted

# Plasticity parameters with comments
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation
reward_gain = 1.0
curiosity_gain = 0.5
novelty_threshold = 0.5

# Memory configuration
working_memory_capacity = 200
episodic_memory_capacity = 2000

# Cognitive parameters
planning_horizon = 20
learning_rate = 0.15

# Motor settings
action_selection_temperature = 0.05

# Development
development_rate = 0.02

# Experimental settings
replay_interval = 50
consolidation_interval = 500

# Logging
log_level = "DEBUG"
log_to_file = true
log_file = "nlm_experiment.log"

# Performance
enable_profiling = true

# Safety limits
max_neurons = 5000
max_synapses = 500000

# Experimental modes
test_mode = false
benchmark_mode = true

# Command line args that could override these values:
# --simulation_timestep=0.002 --neuron_count=2000 --region_count=3 --log_level=WARNING
