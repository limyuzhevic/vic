namespace nlm {

/**
 * Example configuration file for NLM Phase 2
 * Demonstrates the advanced configuration system with multiple formats
 */
class ExampleConfiguration {
public:
    static std::string getINIExample() {
        return R"([nlm_config]
# Basic simulation settings
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15

# Neuron parameters
neuron_type = internal
leak_conductance = 10.0
threshold = -55.0
resting_potential = -70.0
refractory_period = 5

# Synapse parameters
weight = 0.5
delay = 2

# Plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015

# Development parameters
enable_synaptogenesis = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory parameters
working_memory_size = 100
episodic_memory_capacity = 1000

# Neuromodulation parameters
dopamine_release_rate = 0.1
curiosity_rate = 0.05

# Experiment parameters
experiment_type = plasticity
steps = 1000
input_current = 30.0
enable_plotting = false
";
    }
    
    static std::string getJSONExample() {
        return R"({
    "nlm_config": {
        "random_seed": 42,
        "simulation_timestep": 0.001,
        "neuron_count": 500,
        "region_count": 1,
        "connection_probability": 0.15,
        
        "neuron": {
            "type": "internal",
            "leak_conductance": 10.0,
            "threshold": -55.0,
            "resting_potential": -70.0,
            "refractory_period": 5
        },
        
        "synapse": {
            "weight": 0.5,
            "delay": 2
        },
        
        "plasticity": {
            "stdp_ltp_weight": 0.02,
            "stdp_ltd_weight": 0.015,
            "hebbian_rate": 0.01
        },
        
        "development": {
            "enable_synaptogenesis": true,
            "synaptogenesis_rate": 0.0001,
            "pruning_rate": 0.00001
        },
        
        "memory": {
            "working_memory_size": 100,
            "episodic_memory_capacity": 1000
        },
        
        "neuromodulation": {
            "dopamine_release_rate": 0.1,
            "curiosity_rate": 0.05
        },
        
        "experiment": {
            "type": "plasticity",
            "steps": 1000,
            "input_current": 30.0
        }
    }
}
";
    }
    
    static std::string getYAMLEExample() {
        return R"(nlm_config:
  random_seed: 42
  simulation_timestep: 0.001
  neuron_count: 500
  region_count: 1
  connection_probability: 0.15
  
  neuron:
    type: internal
    leak_conductance: 10.0
    threshold: -55.0
    resting_potential: -70.0
    refractory_period: 5
  
  synapse:
    weight: 0.5
    delay: 2
  
  plasticity:
    stdp_ltp_weight: 0.02
    stdp_ltd_weight: 0.015
    hebbian_rate: 0.01
  
  development:
    enable_synaptogenesis: true
    synaptogenesis_rate: 0.0001
    pruning_rate: 0.00001
  
  memory:
    working_memory_size: 100
    episodic_memory_capacity: 1000
  
  neuromodulation:
    dopamine_release_rate: 0.1
    curiosity_rate: 0.05
  
  experiment:
    type: plasticity
    steps: 1000
    input_current: 30.0
";
    }
};

} // namespace nlm
