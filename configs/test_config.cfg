# NLM Test Configuration File
# This file contains configuration options for the NLM test framework

# Test configuration
test_config:
  parameters:
    output_directory: "./test_results"
    output_format: "plaintext"
    log_level: "info"
    log_file: ""
    verbose: false
    quiet: false
    progress_interval: 100
    enable_progress: true
    quiet_progress: false
    timestep: 0.001
    steps_per_test: 100
    max_steps: 1000
    reset_brain_between_tests: true
    save_brain_state: false
    brain_save_path: ""
    restore_brain_state: false
    brain_load_path: ""
    scenario_file: ""
    scenario_name: ""
    run_scenarios: false
    max_parallel_tests: 1
    timeout_seconds: 0
    memory_limit_mb: 0
    enable_benchmarking: false
    validate_config: true
    skip_validation_errors: false
    enable_plugins: false

# Brain configuration
brain_config:
  neuron_count: 500
  region_count: 1
  connection_probability: 0.15
  simulation_timestep: 0.001
  random_seed: 42
  stdp_ltp_weight: 0.02
  stdp_ltd_weight: 0.015
  stdp_tau: 20.0
  synaptogenesis_rate: 0.0001
  pruning_rate: 0.00001
  replay_interval: 100
  consolidation_interval: 1000

# Plugin configuration
plugin_config:
  enabled_plugins: []
  disabled_plugins: []
  plugin_options:
    default:
      timeout: 30
      retries: 3

# Scenario configuration
scenario_config:
  scenarios: []
  default_scenario: ""
  probability_threshold: 0.8

# Logging configuration
logging_config:
  level: "info"
  file: ""
  console: true
  colors: true
  max_file_size: 10485760  # 10MB
  max_files: 5

# Performance configuration
performance_config:
  parallel_tests: 1
  use_memory_pools: true
  use_event_queues: true
  enable_simd: true
  cache_size: 1024

# Validation configuration
validation_config:
  strict_mode: false
  skip_warnings: false
  report_format: "detailed"

# Output configuration
output_config:
  directory: "./test_results"
  formats: ["plaintext", "json", "xml", "csv"]
  compression: false
  include_metrics: true
  include_timing: true
  include_scenarios: true

# Advanced configuration
advanced_config:
  enable_dynamic_loading: true
  plugin_search_paths: ["./plugins", "../plugins"]
  scenario_file_format: "json"
  default_timeout: 300
  max_memory_usage: 4096  # MB
  enable_profiling: false
