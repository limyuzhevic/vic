# NLM Advanced Configuration File
# This extends the default configuration with research-oriented features

# ===================== ADVANCED PLASTICITY PARAMETERS =====================

# STDP (Spike-Timing Dependent Plasticity) advanced parameters
stdp_advanced_enabled = true
stdp_neuromodulated = true
stdp_neuromodulation_strength = 1.0
stdp_adaptation_rate = 0.95
stdp_trace_decay = 20.0

# Hebbian learning advanced parameters
hebbian_advanced_enabled = true
hebbian_global_modulation = false
hebbian_cooperative_learning = true
hebbian_saturation_threshold = 0.8
hebbian_memory_dependency = 0.5

# Structural plasticity advanced parameters
structural_advanced_enabled = true
structural_development_dependent = true
structural_activity_threshold = 0.1
structural_min_weight = 0.001
structural_max_weight = 1.0
structural_growth_rate = 0.0001
structural_pruning_rate = 0.00001
structural_connection_formation = true

# Neuromodulation advanced parameters
dopamine_advanced_enabled = true
dopamine_learning_curve = exponential
curiosity_advanced_enabled = true
curiosity_decay_rate = 0.99
curiosity_exploration_bonus = 0.5
prediction_error_advanced_enabled = true
prediction_error_modulation = true
novelty_detection_advanced_enabled = true
novelty_threshold_adaptive = true

# ===================== ADVANCED CONNECTIVITY PATTERNS =====================

# Connectivity pattern: random, small_world, scale_free, community, modularity, hexagonal, ring, geometric, adaptive, none
connectivity_pattern = small_world
connectivity_strength = 1.0
connectivity_modularity = 2.0
connectivity_clustering = 0.3
connectivity_avg_degree = 4
connectivity_heterogeneous = true
connectivity_activity_dependent = true

# ===================== ADVANCED DEVELOPMENT PARAMETERS =====================

# Developmental stages and their parameters
embryonic_plasticity = 1.0
larval_plasticity = 0.8
juvenile_plasticity = 0.6
adolescent_plasticity = 0.3
adult_plasticity = 0.1

critical_period_start = 0.2
critical_period_end = 0.8
critical_period_active = true
maturational_pruning = true
activity_dependent_development = true
memory_capacity_adult = 10000
memory_capacity_initial = 100

# ===================== ADVANCED SIMULATION PARAMETERS =====================

# Multi-agent simulation
multi_agent_enabled = true
multi_agent_communication = true
multi_agent_cooperation = true
multi_agent_competition = true
agent_communication_strength = 0.1
agent_types = {"explorer", "forager", "predator", "prey"}

# Heterogeneous neural populations
heterogeneous_populations = true
population_neuron_types = {"sensory", "internal", "motor"}
population_stochasticity = 0.1
population_activity_dynamics = true

# Custom world models
custom_world_models = true
world_model_complexity = "medium"
world_dynamic_parameters = true
world_rendering_quality = "high"

# Advanced sensory processing
advanced_sensory_processing = true
sensory_adaptation = true
sensory_tuning = true
sensory_integration = true

# Performance optimization
vectorization_enabled = true
gpu_acceleration = false
parallel_processing = true
simulation_threads = 4
simulation_speed_factor = 1.0
hierarchical_time = false
fast_forward_threshold = 1000.0

# ===================== ADVANCED ANALYSIS TOOLS =====================

# Network analysis and graph theory metrics
network_analysis_enabled = true
graph_theory_metrics_enabled = true
clustering_coefficient = true
path_length = true
degree_distribution = true
small_worldness = true
betweenness_centrality = true
eigenvector_centrality = true
modularity = true
assortativity = true
efficiency = true

# Statistical analysis of neural activity
statistical_analysis_enabled = true
firing_rate_statistics = true
synchrony_measures = true
information_flow = true
entropy_measures = true
burst_analysis = true
adaptation_analysis = true

# Visualization and data export
visualization_tools_enabled = true
data_export_enabled = true
export_to_matlab = true
export_to_python = true
export_to_csv = true
export_to_json = true
export_to_hdf5 = false
visualization_quality = "high"
animation_enabled = true

# Performance profiling
performance_profiling_enabled = true
cpu_usage_monitoring = true
memory_usage_monitoring = true
network_bandwidth_monitoring = false
simulation_speed_profiling = true
memory_leak_detection = true

# ===================== RESEARCH FEATURES =====================

# Experiment parameter sweeps
parameter_sweeps_enabled = true
sweep_method = "genetic_algorithm"
sweep_population_size = 100
sweep_generations = 50
tolerance = 0.01
parallel_sweeps = true
parameter_ranges = {"plasticity_learning_rate": [0.001, 0.1], "neuron_count": [100, 10000]}

# Machine learning integration
machine_learning_enabled = true
ml_model_type = "neural_network"
ml_training_data = "simulation_data"
ml_online_learning = true
ml_feature_extraction = true
ml_model_update_rate = 100.0

# Data logging and recording
data_logging_enabled = true
real_time_logging = true
raw_spikes_logging = true
network_state_logging = true
memory_traces_logging = true
plasticity_events_logging = true
log_file_rotation = true
log_retention_days = 30

# Statistical validation
tatistical_validation_enabled = true
p_value_threshold = 0.05
confidence_interval = 0.95
power_analysis_enabled = true
effect_size_calculation = true
multiple_comparison_correction = true

# ===================== ADVANCED APIS =====================

# Batch operations for large simulations
batch_operations_enabled = true
batch_size = 10
simultaneous_simulations = true
batch_queue_management = true
batch_result_aggregation = true

# Streaming APIs for real-time processing
streaming_apis_enabled = true
spike_streaming_enabled = true
state_streaming_enabled = true
metric_streaming_enabled = true
plot_streaming_enabled = true
stream_buffer_size = 10000
stream_compression = true

# High-level abstract APIs
high_level_apis_enabled = true
scenario_apis_enabled = true
research_apis_enabled = true
monitoring_apis_enabled = true
api_abstraction_level = "high"

# Low-level performance APIs
low_level_apis_enabled = false
memory_access_direct = true
performance_optimization_hints = true
custom_neuron_operations = true
synaptic_operations_low_level = true

# ===================== BACKWARD COMPATIBILITY =====================

# Ensure existing configurations continue to work
backward_compatibility = true
legacy_parameter_mapping = true
deprecation_warnings = true
support_old_file_formats = true

# ===================== ADVANCED ERROR HANDLING =====================

# Enhanced error handling for research features
error_validation = true
parameter_range_validation = true
constraint_validation = true
consistency_validation = true
error_recovery_strategies = "aggressive"
log_error_details = true
error_reporting = "comprehensive"