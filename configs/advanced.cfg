# NLM Advanced Configuration File
# Phase 6 Integration Configuration for Advanced Neural Networks

# Random seed for reproducible experiments
random_seed = 12345

# Simulation timestep in seconds (fine-grained for accurate dynamics)
simulation_timestep = 0.001

# Number of neurons for complex tasks
neuron_count = 2000

# Number of brain regions for specialized processing
region_count = 4

# Connection probability for balanced network connectivity
connection_probability = 0.12

# Advanced Plasticity Settings
# STDP (Spike-Timing-Dependent Plasticity)
plasticity_learning_rate = 0.015
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.018
stdp_time_constant = 20.0
stdp_tau_plus = 20.0
stdp_tau_minus = 20.0

# Hebbian Learning
hebbian_association_strength = 0.08
hebbian_stability = 0.95
hebbian_decay_rate = 0.99

# Structural Plasticity
structural_synaptogenesis_rate = 0.0008
development_pruning_rate = 0.00005
structural_min_weight = 0.01
structural_max_weight = 2.0
structural_formation_threshold = 0.5

# Development Settings (Phase 6)
development_critical_period = 1000
development_maturation_age = 5000
development_plasticity_modifier = 1.0

# Neuromodulation Settings (Phase 6 Enhanced)
dopamine_baseline = 0.1
dopamine_scale = 1.5
dopamine_response_time = 0.1

curiosity_baseline = 0.2
curiosity_exploration_bonus = 0.3
curiosity_decay_rate = 0.95

novelty_baseline = 0.05
novelty_sensitivity = 0.8
novelty_decay_rate = 0.98

# Reward and Prediction Systems
reward_discount_factor = 0.99
reward_learning_rate = 0.01
prediction_error_weight = 0.5
prediction_learning_rate = 0.02

# Memory Systems Configuration
working_memory_capacity = 500
working_memory_decay_rate = 0.9
working_memory_reinforcement_strength = 0.7

episodic_memory_max_episodes = 2000
episodic_memory_decay_rate = 0.995
episodic_memory_consolidation_interval = 100
episodic_memory_replay_probability = 0.3

# Cognitive Systems
concept_formation_threshold = 0.6
concept_min_stability = 0.8
concept_max_stability = 0.99

planning_horizon = 20
planning_confidence_threshold = 0.7
planning_action_noise = 0.05

self_model_update_rate = 0.1
self_model_confidence_decay = 0.98
self_model_assessment_interval = 50

# Social Learning (Phase 6)
social_learning_observational_window = 100
social_learning_imitation_probability = 0.3
social_learning_contribution_decay = 0.9

# Environment Configuration (Advanced)
environment_name = AdvancedGridWorld
environment_width = 50
environment_height = 50
environment_vision_range = 8
environment_vision_angle = 180.0
environment_energy_decay_rate = 0.02
environment_max_energy = 200.0
environment_resource_spawn_rate = 0.05
hazard_spawn_rate = 0.02

# Agent Configuration
agent_reward_modulation = true
agent_structural_plasticity = true
agent_development = true
agent_curiosity = true
agent_novelty_detection = true
agent_prediction_learning = true
agent_social_learning = true

# Simulation Settings
max_simulation_steps = 50000
simulation_time_limit = 0.0
checkpoint_interval = 1000
enable_checkpointing = true
checkpoint_compression = "balanced"

# Visualization (if available)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1920
visualization_window_height = 1080

# Performance Settings
performance_enable_multithreading = true
performance_thread_count = 4
performance_enable_vectorization = true
performance_enable_memory_pools = true
performance_enable_event_queues = true
performance_spike_queue_size = 10000

# Logging Configuration (Enhanced)
log_level = INFO
log_to_file = true
log_filename = nlm_simulation.log
log_file_size_limit = 100.0  # MB
log_rotation_count = 5
log_timestamp_format = "[%Y-%m-%d %H:%M:%S]"
log_include_stack_traces = false

# Advanced Neuron Configuration
neuron_lif_membrane_capacitance = 1.0
neuron_lif_time_constant = 20.0
neuron_lif_threshold = -50.0
neuron_lif_resting_potential = -70.0
neuron_lif_reset_potential = -75.0
neuron_lif_refractory_period = 9
neuron_lif_max_firing_rate = 1000.0
neuron_lif_voltage_clamp = true
neuron_adaptation_enabled = true
neuron_adaptation_time_constant = 100.0

# Advanced Synapse Configuration
synapse_excitatory_weight_range = [0.1, 2.0]
synapse_inhibitory_weight_range = [-2.0, -0.1]
synapse_delay_distribution = "gamma"
synapse_delay_mean = 1.0
synapse_delay_std = 0.2
synapse_plasticity_eligibility_window = 50.0

# Monitoring and Metrics
enable_performance_monitoring = true
enable_memory_monitoring = true
enable_neural_activity_monitoring = true
activity_monitoring_interval = 100.0
spike_rate_monitoring_enabled = true
memory_usage_monitoring_enabled = true
cpu_usage_monitoring_enabled = true

# Custom Neural Network Architecture
synapse_matrix_optimization = "csr"
neuron_interconnection_pattern = "small_world"
population_organization = "modular"
region_connectivity_type = "dense"

# Development Schedule
development_stage_1_initial = 0
development_stage_2_critical_period = 1000
development_stage_3_maturation = 5000
development_stage_4_adult = 10000
development_stage_5_aging = 15000

# Learning Schedules
learning_schedule_type = "curriculum"
learning_phase_1_exploration_intensity = 0.8
learning_phase_2_exploitation_intensity = 0.6
learning_phase_3_transfer_learning = true

# Safety and Stability
enable_safety_checks = true
max_voltage_deviation = 50.0
min_synaptic_weight = 0.001
max_synaptic_weight = 10.0
enable_weight_clipping = true
enable_refractory_protection = true