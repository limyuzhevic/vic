# Advanced NLM Configuration File
# This configuration demonstrates advanced features and optimizations

# Random seed for reproducible experiments
random_seed = 12345

# Simulation timestep in seconds (smaller for higher accuracy)
simulation_timestep = 0.0005

# Number of neurons in the brain (larger for complex behaviors)
neuron_count = 2000

# Number of brain regions (more regions for specialization)
region_count = 3

# Connection probability for random connectivity (adjust for network properties)
connection_probability = 0.05

# Plasticity settings
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.018
stdp_time_constant = 25.0

# Enhanced development settings
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005
development_maturation_rate = 0.001

# Neuromodulation settings with multiple baseline values
dopamine_baseline = 0.2
dopamine_peak = 0.5
dopamine_decay = 0.8

# Serotonin baseline
serotonin_baseline = 0.1

# Reward settings
reward_discount_factor = 0.95
reward_scaling_factor = 1.0
reward_exploration_bonus = 0.1

# Novelty detection settings
novelty_threshold = 0.7
novelty_decay = 0.9

# Curiosity settings
curiosity_exploration_rate = 0.3
curiosity_termination_threshold = 0.8

# Environment settings with custom world type
environment_name = "GridWorldAdvanced"
environment_width = 20
environment_height = 20
environment_obstacle_density = 0.2
environment_reward_function = "sparse"

# Logging settings with file output and structured logging
log_level = "DEBUG"
log_to_file = true
log_filename = "nlm_advanced.log"
log_file_rotation = true
log_file_max_size = 100 MB
log_file_backup_count = 5
log_structured = true
log_timestamp_format = "ISO8601"
log_include_source = true

# Advanced simulation settings
max_simulation_steps = 50000
simulation_time_limit = 1000.0
warmup_steps = 1000
simulation_adaptive_timestep = true
simulation_max_timestep = 0.001
simulation_min_timestep = 0.0001

# Memory management
working_memory_capacity = 100
episodic_memory_capacity = 1000
semantic_memory_capacity = 500
procedural_memory_capacity = 200

# Prediction system
prediction_horizon = 10
prediction_confidence_threshold = 0.7
prediction_update_rate = 0.3

# Cognitive system
attention_focus_count = 5
planning_horizon = 20
concept_formation_threshold = 0.6

# Development stages with age-based parameters
development_stage_1_start = 0.0
development_stage_1_end = 100.0
development_stage_2_start = 100.0
development_stage_2_end = 500.0
development_stage_3_start = 500.0
development_stage_3_end = 1000.0

# Structural plasticity
structural_plasticity_enabled = true
structural_plasticity_rate = 0.0001
axon_elongation_rate = 0.001
branching_probability = 0.05

# Visualization settings
visualization_enabled = true
visualization_type = "3D"
visualization_update_rate = 60.0
visualization_render_mode = "raytraced"
visualization_quality = "high"
visualization_max_frames = 1000

# Performance optimization
performance_thread_count = 4
performance_numa_binding = true
performance_vectorization = true
performance_gpu_acceleration = false
performance_cache_size = 256 MB

# Experiment-specific configurations
[experiment.advanced_learning]
enabled = true
max_steps = 10000
reward_decay = 0.995
exploration_rate = 0.2

[experiment.memory_consolidation]
enabled = true
consolidation_interval = 1000
replay_frequency = 0.1
replay_duration = 100

[experiment.development_simulation]
enabled = true
stage_transition_rate = 0.1
plasticity_decay_rate = 0.95
developmental_noise = 0.05

[experiment.social_learning]
enabled = false
social_network_size = 10
imitation_probability = 0.3
transfer_learning_rate = 0.2

# Security and access control
security_enabled = true
security_api_key_required = true
security_rate_limit = 100  # requests per second
security_auth_timeout = 300  # seconds

# Monitoring and metrics
metrics_enabled = true
metrics_collection_interval = 1.0
metrics_retention_days = 30
metrics_alert_threshold = 0.95
metrics_export_format = "prometheus"

# Backup and recovery
backup_enabled = true
backup_interval = 300  # seconds
backup_retention_days = 7
backup_compression = "gzip"
backup_encryption = true
backup_path = "/backups/nlm/"

# Advanced debugging
debug_enabled = true
debug_level = "DETAILED"
debug_profiling = true
debug_memory_tracking = true
debug_performance_monitoring = true

debug_breakpoints = [
    "plasticity_update",
    "memory_consolidation",
    "development_stage_transition",
    "prediction_error_calculation"
]

debug_profiling_snapshots = 10
debug_memory_threshold_mb = 512
debug_performance_threshold_ms = 100

# Custom neural properties
neuron_resting_potential = -65.0
neuron_reset_potential = -55.0
neuron_adaptation_current = 10.0
neuron_threshold_variability = 0.1
neuron_refractory_period = 2.0  # ms

# Synaptic properties
synapse_weight_range = [0.0, 1.0]
synapse_delay_range = [1, 10]
synapse_decay_rate = 0.99
synapse_stability = 0.95

# Network topology
network_topology = "small_world"
network_clustering_coefficient = 0.3
network_path_length = 4.0

# Advanced learning parameters
learning_rate_adaptation = true
learning_rate_initial = 0.01
learning_rate_min = 0.0001
learning_rate_max = 0.1
learning_rate_decay = 0.995

# Exploration-exploitation balance
exploration_strategy = "epsilon_greedy"
exploration_epsilon = 0.1
exploration_epsilon_decay = 0.9999
exploration_bonus = "intrinsic"

# Multi-objective optimization
objectives = ["reward", "novelty", "curiosity", "efficiency"]
objective_weights = [0.4, 0.2, 0.2, 0.2]
constraint_violation_penalty = 1000.0

# Parallel processing
parallel_processing_enabled = true
parallel_threads = 8
parallel_numa_domains = 2
parallel_work_queue_size = 1000

# Data streaming
stream_processing_enabled = true
stream_buffer_size = 1024
stream_processing_rate = 1000  # Hz
stream_window_size = 100

# Model persistence
model_save_interval = 5000
model_save_format = "binary"
model_compression = "lz4"
model_archive_enabled = true

# Custom actions and behaviors
[action.explore]
probability = 0.3
direction_noise = 0.1
energy_cost = 1.0
reward_multiplier = 1.5

[action.exploit]
probability = 0.5
target_selection = "greedy"
memory_usage = "high"
exploration_bonus = 2.0

[action.interact]
probability = 0.2
target_range = 5.0
interaction_strength = 0.7
memory_update_rate = 0.8

[action.wait]
probability = 0.1
patience_level = 10
energy_recovery_rate = 0.5
learning_opportunity = false