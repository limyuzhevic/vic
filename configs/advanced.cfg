# Advanced Configuration File for NLM
# This configuration provides advanced options for power users and researchers

# ===== CORE BRAIN CONFIGURATION =====

# Number of neurons and regions
brain.neuron_count = 2000
brain.region_count = 3
brain.connection_probability = 0.05
brain.synapse_density = 0.1

# Neural parameters
brain.v_thresh = -45.0          # Higher threshold for stability
brain.v_rest = -65.0           # Resting potential
brain.v_reset = -70.0          # Reset potential after spike
brain.tau_mem = 15.0           # Longer membrane time constant
brain.tau_ref = 3.0            # Longer refractory period

# ===== PLASTICITY CONFIGURATION =====

# STDP (Spike-Timing-Dependent Plasticity)
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.002
plasticity.stdp.tau_plus = 25.0
plasticity.stdp.tau_minus = 25.0
plasticity.stdp.ltp_weight = 0.015
plasticity.stdp.ltd_weight = 0.018

# Hebbian learning
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0002
plasticity.structural.pruning_rate = 0.00002
plasticity.structural.max_synapses = 50000

# ===== NEUROMODULATION CONFIGURATION =====

# Dopamine system
neuromod.dopamine.baseline = 0.2
neuromod.dopamine.scale = 1.5
neuromod.dopamine.decay_rate = 0.9
neuromod.dopamine.reuptake_rate = 0.3

# Curiosity system
neuromod.curiosity.enable = true
neuromod.curiosity.exploration_rate = 0.15
neuromod.curiosity.sensitivity = 0.8
neuromod.curiosity.decay = 0.95

# Novelty detection
neuromod.novelty.enable = true
neuromod.novelty.threshold = 0.3
neuromod.novelty.window_size = 1000
neuromod.novelty.response_strength = 2.0

# Prediction error
neuromod.prediction_error.baseline = 0.1
neuromod.prediction_error.scale = 1.2
neuromod.prediction_error.response_time = 10.0

# ===== DEVELOPMENT CONFIGURATION =====

# Developmental stages
brain.development.enabled = true
brain.development.initial_plasticity = 1.0
brain.development.critical_period_start = 1000
brain.development.critical_period_end = 5000
brain.development.maturation_rate = 0.001
brain.development.pruning_strength = 0.5

# ===== MEMORY SYSTEMS =====

# Working memory
memory.working_memory.capacity = 500
memory.working_memory.decay_rate = 0.01
memory.working_memory.consolidation_threshold = 0.7
memory.working_memory.competition_strength = 1.0

# Episodic memory
memory.episodic_memory.max_episodes = 5000
memory.episodic_memory.consolidation_interval = 100
memory.episodic_memory.replay_strength = 0.8
memory.episodic_memory.encoding_precision = 0.9

# Associative memory
memory.associative_memory.pattern_capacity = 1000
memory.associative_memory.association_strength = 0.7
memory.associative_memory.forgetting_rate = 0.001
memory.associative_memory.sparse_encoding = true

# ===== PREDICTION SYSTEM =====

prediction.enabled = true
prediction.time_horizon = 50.0
prediction.error_threshold = 0.2
prediction.confidence_threshold = 0.6
prediction.update_rate = 0.9
prediction.buffer_size = 1000

# ===== COGNITION CONFIGURATION =====

# Attention system
cognition.attention.inhibition_strength = 0.6
cognition.attention.excitation_strength = 1.2
cognition.attention.focus_decay = 0.95
cognition.attention.shift_speed = 20.0

# Planning system
cognition.planning.planning_depth = 8
cognition.planning.rollout_depth = 3
cognition.planning.exploration_factor = 0.3
cognition.planning.epsilon = 0.1

# Concept formation
cognition.concept_formation.learning_rate = 0.05
cognition.concept_formation.similarity_threshold = 0.8
cognition.concept_formation.cluster_size = 50
cognition.concept_formation.principle_components = 3

# ===== SIMULATION CONFIGURATION =====

# Time and steps
simulation.timestep = 0.001
simulation.max_steps = 10000
simulation.time_limit = 100.0
simulation.save_interval = 500
simulation.replay_interval = 200

# Environment
environment.type = "grid"
environment.width = 50
environment.height = 50
environment.obstacle_density = 0.1
environment.reward_scale = 1.0
environment.noise_level = 0.05

# ===== LOGGING AND OUTPUT =====

logging.level = "INFO"
logging.to_file = true
logging.filename = "nlm_simulation.log"
logging.max_file_size = 100000
logging.compress_logs = true
logging.include_timestamps = true
logging.include_memory_usage = true

# ===== CHECKPOINTING =====

checkpoint.enabled = true
checkpoint.path = "./checkpoints/advanced/"
checkpoint.version = 2
checkpoint.compression = "gzip"
checkpoint.frequency = 1000
checkpoint.backup_count = 5
checkpoint.verify_on_load = true

# ===== PERFORMANCE =====

performance.mpi_enabled = false
performance.openmp_threads = 8
performance.simd_level = "AVX2"
performance.optimization_level = 3
performance.numa_nodes = 1
performance.memory_pool_size = 1073741824  # 1GB

# ===== ADVANCED NEUROMODULATION =====

# Multi-dimensional neuromodulation
neuromod.multidimensional.enabled = true
neuromod.multidimensional.dimensions = 5
neuromod.multidimensional.synchronization = true

# Homeostatic regulation
neuromod.homeostatic.enabled = true
neuromod.homeostatic.target_firing_rate = 8.0
neuromod.homeostatic.adjustment_rate = 0.01
neuromod.homeostatic.baseline = 1.0

# ===== EXPERIMENTAL SETTINGS =====

# Experimental conditions
experimental.condition = "learning"
experimental.random_seed = 12345
experimental.reproducible = true

# Behavioral constraints
behavior.max_actions_per_step = 3
behavior.action_selection_method = "softmax"
behavior.exploration_rate = 0.15
behavior.exploitation_rate = 0.85

# ===== ANALYSIS SETTINGS =====

analysis.output_format = "json"
analysis.include_brain_state = true
analysis.include_memory_traces = true
analysis.include_plasticity_history = true
analysis.include_neuromodulation_data = true
analysis.performance_thresholds = true
analysis.correlation_analysis = true

# ===== CUSTOMIZABLE COMPONENTS =====

# Custom synaptic models
custom_synapse.model = "pair_based"
custom_synapse.long_term_plasticity = true
custom_synapse.short_term_plasticity = false

# Custom neuron models
custom_neuron.model = "adaptive_exp"
custom_neuron.threshold_adaptation = true
custom_neuron.refractory_adaptation = false

# ===== DEBUGGING AND TESTING =====

debug.enabled = false
debug.verbose_output = true
debug.log_file = "nlm_debug.log"
debug.memory_leak_detection = true
debug.performance_benchmarking = true
debug.simulation_validation = true

# ===== BATCH PROCESSING =====

batch.enabled = false
batch.input_directory = "batch_inputs/"
batch.output_directory = "batch_outputs/"
batch.parameter_sweep = true
batch.cross_validation_folds = 5
batch.repeats = 3

# ===== INTERFACE SPECIFIC SETTINGS =====

# Command-line interface
cli.max_arguments = 50
cli.auto_complete = true
cli.color_output = true
cli.progress_bar = true

# Python API
python.api_version = 2
python.optimization_level = "high"
python.thread_safe = true

# Web interface (if available)
web.interface.enabled = false
web.interface.port = 8080
web.interface.host = "localhost"

# ===== VALIDATION =====

validation.enabled = true
validation.check_brain_integrity = true
validation.verify_memory_systems = true
validation.validate_plasticity_rules = true
validation.check_neuromodulation_integrity = true
validation.test_prediction_accuracy = true
validation.performance_regression = true

# ===== END OF ADVANCED CONFIGURATION =====

# Note: This configuration can be loaded by applications using:
# config = Config.createFromFile("advanced.cfg")
# or by setting --config advanced.cfg in command line
