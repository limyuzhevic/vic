# NLM Advanced Configuration File

# Advanced Configuration for NLM Phase 6
# This file demonstrates advanced configuration options for the NLM brain simulation

# ==============================================================================
# NEURAL PARAMETERS
# ==============================================================================

# Neural network configuration
neuron_count: 5000                           # Total number of neurons in the brain
region_count: 2                              # Number of neural regions (default: 1)
connection_probability: 0.15f                # Probability of creating connections between neurons
connection_delay: 2                          # Default synaptic delay (in timesteps)

# Neuron type distribution
neuron_type_sensory: 0.25f                   # Fraction of sensory neurons (25%)
neuron_type_internal: 0.50f                  # Fraction of internal neurons (50%)
neuron_type_motor: 0.25f                     # Fraction of motor neurons (25%)

# ==============================================================================
# PLASTICITY PARAMETERS
# ==============================================================================

# Spike-Timing-Dependent Plasticity (STDP)
stdp_ltp_weight: 0.025f                      # STDP Long-Term Potentiation weight
stdp_ltd_weight: 0.018f                      # STDP Long-Term Depression weight  
stdp_tau: 25.0f                              # STDP time constant (in timesteps)
stdp_trace_decay: 0.95f                     # STDP trace decay rate

# Hebbian learning
hebbian_strength: 0.1f                      # Hebbian learning strength
hebbian_time_window: 50.0f                  # Hebbian time window (in timesteps)

# Structural plasticity
structural_plasticity_enabled: true         # Enable structural plasticity (synaptogenesis/pruning)
synaptogenesis_rate: 0.00005f                # Rate of new synapse formation
synaptogenesis_threshold: 0.1f              # Threshold for synaptogenesis
pruning_rate: 0.000005f                      # Rate of synapse removal
pruning_threshold: 0.05f                     # Threshold for pruning
pruning_interval: 100                        # Pruning interval (in steps)

# ==============================================================================
# DEVELOPMENT PARAMETERS
# ==============================================================================

development_enabled: true                    # Enable developmental processes
development_interval: 500                    # Development update interval (in steps)
initial_plasticity: 1.0f                    # Initial plasticity level (1.0 = high)
maturation_plasticity: 0.5f                  # Plasticity level during maturation
adult_plasticity: 0.2f                       # Plasticity level in adulthood

# Developmental stages
initial_stage_duration: 1000                 # Duration of Initial stage
critical_period_duration: 2000               # Duration of Critical Period stage
maturation_stage_duration: 3000              # Duration of Maturation stage
adult_stage_duration: 10000                  # Duration of Adult stage

# ==============================================================================
# NEUROMODULATION PARAMETERS
# ==============================================================================

# Dopamine system
dopamine_enabled: true                       # Enable dopamine system
dopamine_baseline: 0.5f                      # Baseline dopamine level (0-1)
dopamine_release_rate: 1.0f                  # Rate of dopamine release on reward
dopamine_decay_rate: 0.1f                    # Rate of dopamine decay

# Acetylcholine system
acetylcholine_enabled: true                   # Enable acetylcholine system
ach_baseline: 0.3f                            # Baseline acetylcholine level
ach_attention_boost: 1.5f                     # Acetylcholine effect on attention
ach_memory_boost: 1.2f                        # Acetylcholine effect on memory

# Norepinephrine system
norepinephrine_enabled: true                  # Enable norepinephrine system
ne_baseline: 0.4f                             # Baseline norepinephrine level
ne_arousal_boost: 1.0f                       # Norepinephrine effect on arousal
ne_vigilance_boost: 1.3f                      # Norepinephrine effect on vigilance

# Serotonin system
serotonin_enabled: true                      # Enable serotonin system
5ht_baseline: 0.3f                            # Baseline serotonin level
serotonin_inhibition: 0.6f                   # Serotonin inhibition level

# Novelty detection
novelty_enabled: true                        # Enable novelty detection
novelty_threshold: 0.2f                       # Novelty detection threshold
novelty_sensitivity: 0.8f                     # Novelty sensitivity

# Curiosity system
curiosity_enabled: true                      # Enable curiosity system
curiosity_baseline: 0.3f                      # Baseline curiosity level
curiosity_decay_rate: 0.05f                   # Rate of curiosity decay

# Prediction error system
prediction_error_enabled: true                # Enable prediction error system
prediction_error_sensitivity: 0.7f            # Prediction error sensitivity

# ==============================================================================
# MEMORY PARAMETERS
# ==============================================================================

# Working memory
working_memory_enabled: true                  # Enable working memory
working_memory_capacity: 500                 # Working memory capacity (number of items)
working_memory_decay_rate: 0.01f              # Working memory decay rate
working_memory_reinforcement: 0.8f            # Working memory reinforcement strength

# Episodic memory
episodic_memory_enabled: true                 # Enable episodic memory
episodic_memory_max_episodes: 5000            # Maximum number of stored episodes
episodic_memory_episode_size: 100             # Size of each episode (number of neurons)
replay_interval: 100                         # Replay interval (in steps)
consolidation_interval: 2000                 # Consolidation interval (in steps)
consolidation_strength: 0.3f                   # Memory consolidation strength

# Semantic memory
semantic_memory_enabled: true                 # Enable semantic memory
semantic_memory_capacity: 1000               # Semantic memory capacity
semantic_memory_learning_rate: 0.01f           # Semantic memory learning rate
semantic_memory_similarity_threshold: 0.7f     # Semantic memory similarity threshold

# Procedural memory
procedural_memory_enabled: true                # Enable procedural memory
procedural_memory_capacity: 500               # Procedural memory capacity
procedural_memory_learning_rate: 0.02f          # Procedural memory learning rate
procedural_memory_forgetting_rate: 0.001f      # Procedural memory forgetting rate

# ==============================================================================
# PREDICTION AND COGNITION PARAMETERS
# ==============================================================================

# Prediction system
prediction_enabled: true                      # Enable prediction system
prediction_depth: 5                          # Prediction depth (number of steps ahead)
prediction_error_threshold: 0.1f               # Prediction error threshold
prediction_confidence_threshold: 0.8f           # Prediction confidence threshold

# Neural planning
planning_enabled: true                       # Enable neural planning
planning_depth: 5                            # Planning depth (number of steps ahead)
planning_confidence_threshold: 0.7f            # Planning confidence threshold

# Concept formation
concept_formation_enabled: true               # Enable concept formation
concept_formation_learning_rate: 0.01f          # Concept formation learning rate
concept_formation_similarity_threshold: 0.6f   # Concept formation similarity threshold

# Self-model
self_model_enabled: true                      # Enable self-model
self_model_confidence_threshold: 0.8f           # Self-model confidence threshold

# Social learning
social_learning_enabled: true                 # Enable social learning
social_learning_imitation_threshold: 0.7f      # Social learning imitation threshold

# ==============================================================================
# ENVIRONMENT AND SIMULATION PARAMETERS
# ==============================================================================

# Simulation parameters
simulation_timestep: 0.001                   # Simulation timestep (in seconds)
simulation_max_steps: 10000                  # Maximum number of simulation steps
random_seed: 42                               # Random seed for reproducible experiments
enable_reproducible_results: true              # Enable reproducible results

# Environment parameters
environment_type: "simple"                    # Environment type ("simple", "complex", "stochastic")
environment_width: 20                         # Environment width
environment_height: 20                        # Environment height
vision_width: 8                               # Sensory vision width
vision_height: 8                              # Sensory vision height
vision_fov: 90.0f                              # Vision field of view (degrees)

# ==============================================================================
# PERFORMANCE AND MONITORING PARAMETERS
# ==============================================================================

# Performance monitoring
performance_monitoring_enabled: true           # Enable performance monitoring
performance_monitoring_interval: 100          # Performance monitoring interval (in steps)
monitor_memory_usage: true                    # Monitor memory usage
monitor_cpu_usage: true                       # Monitor CPU usage
monitor_wall_clock: true                      # Monitor wall clock time

# Checkpointing
checkpointing_enabled: true                   # Enable checkpointing
checkpoint_path: "./checkpoints/"             # Checkpoint directory path
checkpoint_interval: 1000                     # Checkpoint interval (in steps)
checkpoint_compression: "balanced"            # Checkpoint compression level ("none", "fast", "balanced")

# Benchmarking
benchmarking_enabled: true                    # Enable benchmarking
benchmark_file: "./benchmark_results.csv"     # Benchmark results file
benchmark_interval: 500                       # Benchmark interval (in steps)

# ==============================================================================
# DEBUGGING AND LOGGING PARAMETERS
# ==============================================================================

# Logging
logging_enabled: true                         # Enable logging
log_level: "info"                             # Log level ("debug", "info", "warning", "error")
log_file: "./logs/nlm.log"                     # Log file path
log_file_size: 10485760                        # Log file size limit (10MB)
log_file_rotation: "daily"                     # Log file rotation ("daily", "weekly", "monthly")

# Debug output
debug_enabled: true                            # Enable debug output
debug_level: "info"                            # Debug level ("debug", "info", "warning", "error")
debug_output_to_console: true                  # Output debug to console
debug_output_to_file: true                     # Output debug to file

# ==============================================================================
# ADVANCED BEHAVIORAL PARAMETERS
# ==============================================================================

# Learning behavior
learning_rate: 0.01f                          # General learning rate
exploration_rate: 0.2f                         # Exploration rate (0-1)
exploitation_rate: 0.8f                        # Exploitation rate (0-1)

# Decision making
action_selection_strategy: "epsilon_greedy"   # Action selection strategy
epsilon_greedy_epsilon: 0.1f                  # Epsilon for epsilon-greedy action selection
temperature_parameter: 1.0f                   # Temperature parameter for softmax action selection

# Reward processing
reward_function_type: "weighted_sum"           # Reward function type
reward_discount_factor: 0.95f                  # Reward discount factor
reward_history_size: 100                       # Reward history size

# ==============================================================================
# SPECIALIZED EXPERIMENTS CONFIGURATION
# ==============================================================================

# Experiment 1: Memory consolidation
memory_consolidation_enabled: true
memory_consolidation_strength: 0.3f
memory_consolidation_interval: 2000

# Experiment 2: Skill learning
skill_learning_enabled: true
skill_learning_rate: 0.02f
skill_forgetting_rate: 0.001f

# Experiment 3: Social learning
social_learning_enabled: true
social_observation_rate: 0.3f
social_imitation_threshold: 0.7f

# Experiment 4: Development
developmental_plasticity_enabled: true
developmental_plasticity_rate: 0.01f

# ==============================================================================
# OUTPUT AND VISUALIZATION PARAMETERS
# ==============================================================================

# Output format
output_format: "csv"                          # Output format ("csv", "json", "text")
output_directory: "./results/"               # Output directory path
output_file_prefix: "nlm_"                    # Output file prefix

# Visualization
visualization_enabled: true                  # Enable visualization
visualization_type: "console"                 # Visualization type ("console", "file", "network")
visualization_interval: 100                   # Visualization interval (in steps)

# ==============================================================================
# SAFETY AND CONSTRAINTS
# ==============================================================================

# Safety constraints
max_memory_usage: 1073741824                 # Maximum memory usage (1GB)
max_cpu_usage: 0.9                             # Maximum CPU usage (90%)
max_wall_clock_time: 3600                     # Maximum wall clock time (1 hour)

# Resource constraints
min_free_disk_space: 104857600                 # Minimum free disk space (100MB)
max_file_handles: 1024                         # Maximum file handles

# ==============================================================================
# COMMENTS AND EXPLANATIONS
# ==============================================================================

