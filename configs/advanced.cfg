# Advanced NLM Configuration
# This file provides advanced configuration options for expert users
# These settings are designed for fine-tuned control of the NLM brain simulation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (high precision)
simulation_timestep = 0.0005

# Number of neurons in the brain (large scale)
neuron_count = 5000

# Number of brain regions (multiple regions)
region_count = 4

# Connection probability for random connectivity (sparse connectivity)
connection_probability = 0.05

# Plasticity settings (expert level)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.025
stdp_ltd_weight = 0.02
stdp_time_constant = 30.0
stdp_eligibility_trace_decay = 0.95

# Development settings (advanced)
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0005
development_plasticity_factor = 2.0
development_critical_period = 1000

# Neuromodulation settings (expert level)
dopamine_baseline = 0.15
dopamine_sensitivity = 0.8
 curiosity_sensitivity = 0.6
novelty_threshold = 0.7

# Reward settings (advanced)
reward_discount_factor = 0.95
reward_scale_factor = 10.0
reward_adaptation_rate = 0.3

# Environment settings (complex world)
environment_name = ComplexGridWorld
environment_width = 20
environment_height = 20
environmental_complexity = 0.8

# Logging settings (expert level)
log_level = DEBUG
log_to_file = true
log_filename = nlm_advanced.log
log_rotation_size = 10485760  # 10MB
log_retention_days = 30

# Simulation settings (expert level)
max_simulation_steps = 50000
simulation_time_limit = 250.0
checkpoint_interval = 1000
replay_interval = 500
consolidation_interval = 2000

# Visualization settings (advanced)
visualization_enabled = true
visualization_update_rate = 60.0
visualization_quality = 0.8
visualization_smooth_frames = 5

# Performance settings (expert level)
use_simd = true
parallel_processing = true
thread_count = 8
gpu_acceleration = false
memory_pool_size = 256  # MB

# Advanced plasticity rules (expert level)
enable_hb_synapses = true
enable_stdp_spike_timing = true
enable_structural_plasticity = true
plasticity_stochasticity = 0.1
plasticity_noise_level = 0.05

# Memory system settings (advanced)
working_memory_capacity = 500
episodic_memory_max_episodes = 5000
episodic_memory_decay_rate = 0.001
associative_memory_patterns = 1000

# Prediction system settings (advanced)
prediction_horizon = 10
prediction_uncertainty = 0.2
prediction_learning_rate = 0.15

# Cognition system settings (advanced)
planning_depth = 10
attention_window_size = 50
concept_formation_threshold = 0.8

# Development system settings (advanced)
developmental_stage_duration = 100
neural_maturation_rate = 0.8
 synaptogenesis_peak = 100
pruning_efficiency = 0.7

# Checkpoint system settings (advanced)
checkpoint_compression = true
checkpoint_compression_level = 6
checkpoint_validation = true
checkpoint_version = 1

# Replay system settings (advanced)
replay_frequency = 0.1
replay_consolidation = true
replay_strength = 0.9
replay_timing = 2000  # steps

# Debugging and analysis settings (advanced)
enable_debug_mode = true
debug_logging_interval = 100
debug_output_file = "nlm_debug.log"
analyze_spike_patterns = true
analyze_memory_usage = true
analyze_performance_metrics = true

# External interfaces (advanced)
enable_external_api = false
api_endpoint = "http://localhost:8080"
api_key = "your_api_key_here"

# Experimental settings (advanced)
experimental_mode = true
experimental_parameters = "parameter_set_1"
randomize_parameters = true

# Safety and limits (expert level)
max_memory_usage = 1024  # MB
max_cpu_usage = 90  # %
simulation_timeout = 3600  # seconds
checkpoint_backup = true
backup_directory = "./backups"

# Advanced logging filters (expert level)
log_filter_info = true
log_filter_warning = true
log_filter_error = true
log_filter_debug = true
log_filter_trace = false
log_component_filter = "all"  # or specific components

# Performance monitoring (advanced)
monitor_cpu = true
monitor_memory = true
monitor_network = false
monitor_disk = true
performance_report_interval = 300  # seconds
performance_alert_threshold = 0.9

# Security and access control (advanced)
require_authentication = false
authentication_method = "api_key"
authorized_users = "user1,user2,user3"

# Experimental protocols (advanced)
enable_learning_protocol = true
learning_protocol_name = "reinforcement_learning"
learning_protocol_parameters = "lr=0.01,gamma=0.99"

# Advanced neural properties (expert level)
neuron_type_distribution = "balanced"
neuron_excitability = 1.0
neuron_refractory_period = 5.0
neuron_membrane_capacitance = 1.0
neuron_leak_conductance = 0.1

# Synapse properties (advanced)
synapse_type_distribution = "excitatory_inhibitory"
synapse_delay_distribution = "normal"
synapse_weight_range = [0.01, 10.0]
synapse_plasticity_frequency = 0.05

# Regional connectivity (advanced)
inter_region_connection_probability = 0.1
region_specific_parameters = "enabled"
hierarchical_connectivity = true

# Behavioral output (advanced)
behavioral_output_format = "structured"
behavioral_encoding = "one_hot"
behavioral_memory = "working_memory"

# Environmental rewards (advanced)
environment_reward_function = "dense"
environment_reward_shaping = "potential_based"
environmental_adaptive_rewards = true

# Cognitive architecture (advanced)
cognitive_architecture = "integrated"
attention_mechanism = "competitive"
memory_architecture = "multi_store"
learning_architecture = "meta_learning"

# Development trajectory (advanced)
development_trajectory = "s-shaped"
plasticity_trajectory = "exponential"
maturation_trajectory = "logistic"

# Biological plausibility (advanced)
biological_plausibility_level = 0.8
neural_dynamics_model = "lif"
synaptic_dynamics_model = "simple"

# Advanced monitoring (expert level)
real_time_monitoring = true
monitoring_dashboard_url = "http://localhost:8081"
metrics_collection_interval = 1.0
performance_alerting = true

# External dependencies (advanced)
python_interface = true
python_module_path = "/opt/nlm/python"
r_interface = false
julia_interface = false

# Model persistence (advanced)
model_export_format = "onnx"
model_export_path = "./models"
model_version = "1.0.0"
model_signature = "sha256"

# Advanced validation (expert level)
validate_input_data = true
validate_network_connectivity = true
validate_simulation_parameters = true
validate_output_consistency = true

# Research features (advanced)
enable_research_mode = true
research_protocol = "cognitive_architectures"
research_data_collection = "enabled"
research_anonymization = "enabled"

# Advanced features summary:
# - High-precision simulation with smaller timesteps
# - Large-scale neural networks (5000 neurons)
# - Advanced plasticity rules with stochasticity
# - Complex environment with adaptive rewards
# - Comprehensive monitoring and performance optimization
# - Multiple interface options (Python, R, Julia)
# - Advanced checkpointing with compression
# - Replay and consolidation systems
# - Experimental protocols and data collection
# - Safety limits and monitoring