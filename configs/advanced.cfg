# NLM Advanced Configuration
# Phase 2: Real Neural Computation
# This file contains advanced configuration options for NLM

# Environment Settings
# -----------------
# Set this to "production" for normal operation
# Set this to "development" for debug mode
# Set this to "testing" for unit test mode
environment = development

# Performance Settings
# ------------------
# Simulation mode: real-time, batch, or interactive
# real-time: synchronized with wall-clock time
# batch: maximum speed for offline processing  
# interactive: responsive to user input
mode = interactive

# Output Settings
# --------------
# Log level: debug, info, warning, error, critical
log_level = info

# Enable or disable performance metrics collection
enable_performance_metrics = true

# Enable or disable structured logging (JSON format)
structured_logging = false

# Logging Configuration
# -------------------
# Log file path (leave empty to use console only)
log_file = "nlm.log"

# Maximum log file size in MB before rotation
max_log_file_size = 10

# Number of log files to keep after rotation
log_file_rotation_count = 5

# Console Output
# -------------
# Enable colored console output
colored_output = true

# Enable log timestamps in console
console_timestamps = true

# Performance Profiling
# --------------------
# Enable or disable performance profiling
enable_profiling = false

# Profile output file
profile_file = "nlm_profile.json"

# Performance sampling interval (in simulation steps)
profile_interval = 1000

# Advanced Neural Configuration
# ---------------------------
# Neural network architecture
network_arch = "standard"

# Learning rate for plasticity rules
learning_rate = 0.01

# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian learning parameters
hebbian_learning_rate = 0.01
hebbian_threshold = 0.5

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
max_synapses_per_neuron = 100

# Memory System Configuration
# ------------------------
# Working memory size (in neurons)
working_memory_size = 1000

# Episodic memory capacity (in episodes)
episodic_memory_capacity = 10000

# Enable memory compression for large simulations
enable_memory_compression = true

# Neuromodulation Configuration
# ----------------------------
# Enable or disable neuromodulation systems
dopamine_enabled = true
curiosity_enabled = true
novelty_enabled = true
prediction_error_enabled = true

# Neuromodulation parameters
dopamine_scale = 1.0
curiosity_weight = 0.5
novelty_threshold = 0.3

# Development Configuration
# -----------------------
# Enable or disable developmental stages
development_enabled = true

# Developmental stage durations (in simulation steps)
initial_stage_duration = 60
critical_period_duration = 300
maturation_stage_duration = 600

# Simulation Control
# -----------------
# Maximum simulation steps (0 for unlimited)
max_simulation_steps = 0

# Simulation timestep (in seconds)
simulation_timestep = 0.001

# Save checkpoint every N steps (0 to disable)
checkpoint_interval = 100

# Checkpoint file path
checkpoint_file = "nlm_checkpoint.bin"

# Export Configuration
# ------------------
# Enable or disable state export
enable_export = true

# Export file format: binary or json
export_format = "binary"

# Export path
export_path = "nlm_export/"

# Visualization Configuration
# ---------------------------
# Enable or disable visualization
enable_visualization = true

# Visualization backend: terminal, matplotlib, or none
visualization_backend = "terminal"

# Visualization update interval (in simulation steps)
visualization_interval = 100

# Advanced Features
# ----------------
# Enable or disable experimental features
enable_experimental = false

# Experimental feature flags
enable_reinforcement_learning = false
enable_hierarchical_cognition = false
enable_social_learning = false

# Debugging Configuration
# --------------------
# Enable or disable debug mode
debug_mode = false

# Debug level: 0 (none), 1 (basic), 2 (detailed), 3 (extensive)
debug_level = 1

# Break on first error
break_on_error = false

# Stack trace on crash
generate_stack_trace = true

# Security Configuration
# ---------------------
# Enable or disable security features
enable_security = true

# Authentication token (for distributed simulations)
auth_token = ""

# Encryption for saved states
encrypt_states = false

# Encryption key (16, 24, or 32 bytes for AES-128, AES-192, or AES-256)
encryption_key = ""