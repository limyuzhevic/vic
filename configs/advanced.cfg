# NLM Advanced Configuration File
# Expert-level configuration for large-scale simulations and research

# Random seed for reproducible experiments
random_seed = 42

# Core simulation settings
simulation_timestep = 0.001
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Neural architecture - larger scale for research
neuron_count = 3000
region_count = 3
connection_probability = 0.1

# Enhanced plasticity rules
stdp_ltp_weight = 0.03
stdp_ltd_weight = 0.03
stdp_time_constant = 15.0
plasticity_learning_rate = 0.05

# Advanced structural plasticity (Phase 6)
synaptogenesis_rate = 0.001
pruning_rate = 0.0002

# Neuromodulation system
# Dopamine - reward and reinforcement
dopamine_baseline = 0.2
dopamine_sensitivity = 0.5

# Curiosity - exploration motivation
curiosity_threshold = 0.5
curiosity_decay_rate = 0.05

# Novelty detection
novelty_sensitivity = 0.8
novelty_decay = 0.1

# Reward prediction error
prediction_error_weight = 0.7

# Reward system
reward_discount_factor = 0.99
exploration_bonus = 0.1

# Memory systems
working_memory_capacity = 300  # Working memory traces
episodic_memory_max_episodes = 5000
associative_memory_pattern_threshold = 0.7
memory_replay_interval = 200
memory_consolidation_rate = 0.3

# Development system
enable_development = true
developmental_stage = "maturation"
plasticity_decay_rate = 0.05
neural_excitability_decay = 0.02
structural_plasticity_factor = 1.2

# Environment configuration
environment_name = GridWorld
environment_width = 16
environment_height = 16
environment_depth = 16

# Advanced logging
log_level = "INFO"
log_to_file = true
log_filename = "nlm_advanced.log"
log_rotation_size = 10485760

# Visualization
defense = true
visualization_update_rate = 30.0
plot_neural_dynamics = true
plot_memory_traces = true
plot_plasticity_history = true

# Checkpointing
enable_checkpointing = true
checkpoint_dir = "./advanced_checkpoints"
checkpoint_interval = 5000
compression_level = "balanced"
max_checkpoints = 10

# Progress monitoring
enable_progress_reporting = true
progress_report_interval = 500
metrics_collection = true
performance_profiling = true

# Research features
enable_replay = true
replay_strength = 1.5
replay_interval = 100
enable_prediction = true
prediction_depth = 3
enable_cognition = true
planning_depth = 5
concept_update_rate = 0.1

# Advanced simulation controls
enable_curiosity = true
curiosity_sensitivity = 0.8
novelty_threshold = 0.6

# Performance optimization
use_simd = true
parallel_processing = true
cpu_affinity = "all"
memory_pool_size = 1024

# Validation flags
validate_connectivity = true
validate_memory_integrity = true
validate_plasticity_bounds = true
validate_developmental_consistency = true
