# NLM Advanced Configuration File
# This configuration supports multiple experiment types and advanced settings

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_excitation = 0.5
dopamine_plasticity_mod = 1.0
curiosity_baseline = 0.1
curiosity_threshold = 0.5
novelty_threshold = 0.3

# Reward settings
reward_discount_factor = 0.99
reward_scaling = 1.0

# Memory settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_pattern_capacity = 500

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# Development stages
development_stage_duration = 1000
development_plasticity_decay_rate = 0.95

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Experiment configuration
experiment_type = "demo"
experiment_duration_multiplier = 1.0
enable_stdp = true
enable_hebbian = true
enable_structural_plasticity = true
enable_prediction = true
enable_cognition = true
enable_working_memory = true
enable_episodic_memory = true
enable_associative_memory = true

# Output settings
output_frequency = 100
record_weight_changes = true
record_spike_activity = true
record_memory_activity = true