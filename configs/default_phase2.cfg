# NLM Phase 2 Enhanced Configuration File
# Phase 2: Real Neural Computation Configuration
# This configuration file supports both simple key=value format and will be enhanced with JSON/YAML support

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (recommended: 500-5000 for Phase 2)
neuron_count = 500

# Number of brain regions (recommended: 1-4 for Phase 2)
region_count = 1

# Connection probability for random connectivity (recommended: 0.1-0.3)
connection_probability = 0.15

# Plasticity settings
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity settings (Phase 2)
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development settings (Phase 2)
plasticity_learning_rate = 0.01

# Neuromodulation settings (Phase 2)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
use_colors = true

# Simulation settings
max_simulation_steps = 2000
simulation_time_limit = 0.0

# Experimental settings (Phase 2 specific)
experimental_type = Phase2RealNeuralComputation
enable_advanced_metrics = true
benchmark_mode = false

# Visualization settings (Phase 2)
visualization_enabled = false
visualization_update_rate = 30.0

# Output settings
output_results = true
generate_detailed_report = true
quiet_mode = false
verbose_logging = true
