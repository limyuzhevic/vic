# NLM Configuration Template - Robotics Application
# Robotics application configuration with real-time constraints
# 
# Basic performance settings
random_seed = 42
simulation_timestep = 0.0005

# Memory settings (moderate capacity)
memory.workingMemoryCapacity = 150.0
memory.episodicConsolidationRate = 0.15
memory.associativeStrengthDecay = 0.98
memory.episodicDecayRate = 0.995

# Neuromodulation settings (stable for robotics)
neuromodulation.dopamineBaseline = 0.6
neuromodulation.dopamineNoise = 0.1
neuromodulation.noveltyThreshold = 0.5
neuromodulation.curiosityLevel = 0.6
neuromodulation.explorationRate = 0.4

# Cognitive settings (practical planning depth)
cognitive.planningDepth = 3
cognitive.conceptFormationThreshold = 0.6
cognitive.attentionDecayRate = 0.99
cognitive.workingMemoryDecayRate = 0.99
cognitive.activationThreshold = 0.05

# Prediction settings (high confidence for safety)
prediction.confidenceThreshold = 0.9
prediction.learningRate = 0.03
prediction.decayRate = 0.99
prediction.noise = 0.02

# Development settings (mature system)
development.plasticityRate = 0.3
development.stage = 1.0
development.explorationPhaseDuration = 100.0
development.learningPhaseDuration = 2000.0
development.enablePhaseTransitions = true

# Integration settings (strong coupling for coordination)
integration.corticalCorticalCoupling = 0.85
integration.corticalSubcorticalCoupling = 0.8
integration.feedbackStrength = 0.8
integration.predictionErrorGain = 1.0
integration.learningRate = 0.03

# Debug settings (minimal for real-time)
debug.enabled = false
debug.level = "warning"

# Performance settings (real-time constraints)
performance.optimizationLevel = 2
performance.maxMemoryUsage = 512
performance.maxSimulationSteps = 20000
performance.realtimeConstraint = true
performance.maxLatency = 20.0
