# Default configuration for NLM
# Copy this file to configs/custom.cfg and modify as needed

[simulation]
neuron_count = 1000
region_count = 1
connection_probability = 0.1

[plasticity]
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

[development]
enable_development = true
development_stage = "adult"

[memory]
working_memory_capacity = 100
max_episodes = 1000

[neuromodulation]
enable_curiosity = true
enable_novelty = true
reward_scaling = 1.0

[visualization]
enable_viz = false
viz_update_rate = 0.1

[checkpoint]
enable_checkpointing = true
checkpoint_interval = 1000
checkpoint_dir = "./checkpoints"
max_checkpoints = 10

[logging]
log_level = "info"
log_file = "nlm.log"
console_output = true
