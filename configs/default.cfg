# NLM Default Configuration File
# This file contains default settings for the Neural Learning Machine Phase 6

# Random seed
random_seed = 42

# Simulation settings
simulation_timestep = 0.001
neuron_count = 1000
region_count = 1
connection_probability = 0.1

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Logging
log_level = info
log_file = nlm.log

# Performance monitoring
enable_performance_monitoring = true
performance_sampling_interval = 100
max_memory_usage_mb = 1024
cpu_threshold = 0.90

# Output
quiet_mode = false
verbose_mode = false

# Visualization
enable_visualization = false

# Export
enable_export = false
export_path = ./nlm_results.csv

# Development settings
enable_development = true
