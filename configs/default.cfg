# NLM Configuration File
# This is the default configuration for Phase 6 integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 5000

# Number of brain regions
region_count = 5

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.012
stdp_time_constant = 25.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_maturation_rate = 0.0005

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_peak = 1.0  # Maximum dopamine for reward modulation
novelty_threshold = 0.3
curiosity_drive = 0.2
prediction_error_weight = 0.5

# Reward settings
reward_discount_factor = 0.95
reward_integration_rate = 0.3
reward_history_length = 1000

# Phase 6 integration settings
phase6_enabled = true
working_memory_capacity = 50
episodic_memory_capacity = 1000
concept_formation_threshold = 0.7
planning_horizon = 5
attention_window_size = 10
replay_frequency = 0.1

# Environment settings
environment_name = SimpleWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_history_length = 10000

# Simulation settings
max_simulation_steps = 50000
simulation_time_limit = 3600.0  # 1 hour
checkpoint_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Performance settings
use_memory_pools = true
event_queue_size = 10000
use_simd = true
