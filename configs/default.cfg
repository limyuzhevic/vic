# NLM Configuration File
# This is the default configuration for Phase 6 - Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_modulation_strength = 1.0

# Serotonin neuromodulation
serotonin_baseline = 0.1
serotonin_modulation_strength = 0.5

# Noradrenaline neuromodulation
noradrenaline_baseline = 0.1
noradrenaline_modulation_strength = 0.5

# Acetylcholine neuromodulation
acetylcholine_baseline = 0.1
acetylcholine_modulation_strength = 0.5

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error = 0.0

# Memory system settings
working_memory_capacity = 1000
working_memory_decay_rate = 0.01
episodic_memory_capacity = 10000
consolidation_interval = 1000
sleep_consolidation_enabled = true
replay_interval = 100

# Prediction system settings
prediction_window = 50
prediction_error_threshold = 0.1

# Cognitive system settings
attention_strength = 1.0
planning_horizon = 10
concept_formation_threshold = 0.5
self_model_learning_rate = 0.01
social_learning_rate = 0.01
spatial_representation_resolution = 10

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
