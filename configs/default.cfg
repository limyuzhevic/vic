# NLM Configuration File
# This is the Phase 6 configuration for the neural simulation framework
# 
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_maturation_rate = 0.0005

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_modulation_strength = 0.5
curiosity_baseline = 0.05
novelty_sensitivity = 0.3

# Reward settings
reward_discount_factor = 0.99
reward_scale = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
world_boundary_penalty = -1.0

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_update_frequency = 100

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output_file = nlm_visualization.png

# Memory system settings
working_memory_capacity = 50
working_memory_decay_rate = 0.01
episodic_memory_capacity = 1000
episodic_memory_decay_rate = 0.001

# Prediction system settings
prediction_horizon = 10
prediction_confidence_threshold = 0.7

# Cognition system settings
attention_focus_duration = 100
concept_formation_threshold = 0.5

# Agent system settings
agent_sensing_frequency = 10
agent_action_frequency = 1
agent_exploration_rate = 0.2
