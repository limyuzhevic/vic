# NLM Configuration File
# Default configuration for NLM (Neural Learning Machine)
# 
# This configuration uses the new flat key system for better readability and maintenance.
# The system also supports legacy keys with dot notation for backward compatibility.

# ===== BRAIN CONFIGURATION =====
neuron_count = 1000
connection_probability = 0.05
initial_weight_mean = 0.5
initial_weight_std = 0.1

# ===== PLASTICITY CONFIGURATION =====
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.structural.enable = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.000001

# ===== NEUROMODULATION CONFIGURATION =====
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true

# ===== MEMORY CONFIGURATION =====
memory.working_capacity = 100
memory.episodic.max_episodes = 1000
memory.associative.pheromone_decay = 0.1

# ===== DEVELOPMENT CONFIGURATION =====
development.stage = 4
development.initial_plasticity = 1.0
development.critical_period_start = 100
development.critical_period_end = 500

# ===== WORLD CONFIGURATION =====
world.width = 20
world.height = 20
world.vision_width = 8
world.vision_height = 8
world.max_energy = 100.0

# ===== SIMULATION CONFIGURATION =====
simulation.timestep = 0.001
simulation.max_steps = 10000
simulation.replay_interval = 100
simulation.consolidation_interval = 1000

# ===== LEGACY KEYS (FOR BACKWARD COMPATIBILITY) =====
# These keys are still supported but flat keys are preferred
brain.neuron_count = 1000
brain.synapse_density = 0.1
brain.connection_probability = 0.05
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# ===== BASIC USAGE =====
# With this configuration, you can run NLM using flat keys:
# nlm --config=configs/default.cfg

# Or using legacy keys (for testing legacy systems):
# nlm --config=configs/default.cfg --neuron_count=2000

# ===== EXAMPLE COMMAND LINE USAGES =====
# 
# Basic run with default configuration:
#   nlm
#
# Run with custom configuration:
#   nlm --config=configs/default.cfg
#
# Run with specific test:
#   nlm --config=configs/default.cfg --test=1
#
# Run with custom brain size:
#   nlm --config=configs/default.cfg --neuron_count=2000
#
# Run with development configuration:
#   nlm --config=configs/development.cfg
#
# Run with performance configuration:
#   nlm --config=configs/performance.cfg
#
# Save brain state:
#   nlm --config=configs/default.cfg --save=checkpoint.bin
#
# Load brain state:
#   nlm --config=configs/default.cfg --load=checkpoint.bin
#
# Get help:
#   nlm --help
#
# Show version:
#   nlm --version
#
# Show current configuration:
#   nlm --config=configs/default.cfg --config-output
#
# Run with performance profiling:
#   nlm --config=configs/default.cfg --profile
#
# Verbose logging:
#   nlm --config=configs/default.cfg --verbose
#
# Quiet logging:
#   nlm --config=configs/default.cfg --quiet
#
# Run all tests (default):
#   nlm --config=configs/default.cfg
#
# Run only test 1 (basic connectivity):
#   nlm --config=configs/default.cfg --test=1
#
# Run only test 2 (plasticity learning):
#   nlm --config=configs/default.cfg --test=2
#
# Run only test 3 (STDP verification):
#   nlm --config=configs/default.cfg --test=3
#
# Run all tests with profiling:
#   nlm --config=configs/default.cfg --test=all --profile
#
# Configuration file: configs/default.cfg
# Format: flat keys (recommended) or legacy keys (backward compatible)
# This configuration is optimized for balanced performance and learning
# Generated: 2026-11-19

# ===== END OF CONFIGURATION =====

