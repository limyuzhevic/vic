# Configuration file for NLM Phase 6: Integrated Artificial Brain Simulation
# All configuration values are documented in the main documentation

# ===== BASIC SETTINGS =====
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.1

# ===== PLASTICITY SYSTEMS =====
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# ===== NEUROMODULATION =====
dopamine_baseline = 0.1
curiosity_sensitivity = 0.5
novelty_sensitivity = 0.5

# ===== REWARD & LEARNING =====
reward_discount_factor = 0.99
reward_scale = 10.0

# ===== MEMORY SYSTEMS =====
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_patterns = 50

# ===== DEVELOPMENT =====
initial_plasticity_modifier = 1.0
critical_period_age = 300.0
maturation_age = 900.0
adult_plasticity_modifier = 0.2

# ===== WORLD CONFIGURATION =====
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 8
vision_height = 8
agent_start_x = 5.0
agent_start_y = 5.0
max_energy = 100.0
energy_decay_rate = 0.01
resource_energy_gain = 30.0

# ===== CHECKPOINTING =====
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_save_iterations = 1
checkpoint_load_iterations = 1

# ===== LOGGING =====
log_level = INFO
log_to_file = true
log_filename = nlm.log
max_log_file_size = 10485760  # 10MB

# ===== SIMULATION =====
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# ===== VISUALIZATION =====
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output_path = ./visualizations

# ===== DEBUGGING =====
debug_mode = false
debug_level = INFO
enable_neuron_debug_logging = false
enable_synapse_debug_logging = false
