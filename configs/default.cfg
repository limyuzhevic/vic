# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6: Advanced Configuration
# Text/thought system
text_encoder_max_tokens = 100
text_embedding_dimension = 16

# Social learning
social_observation_capacity = 100
social_forgetting_rate = 0.01

# Concept formation
concept_min_instances = 5
concept_similarity_threshold = 0.8

# Working memory
working_memory_capacity = 50
working_memory_decay_rate = 0.95

# Episodic memory
episodic_memory_capacity = 200
episodic_memory_decay_rate = 0.99

# Prediction system
prediction_horizon = 20
prediction_accuracy_threshold = 0.7

# Curiosity and exploration
curiosity_exploration_bonus = 0.5
curiosity_decay_rate = 0.99

# Novelty detection
novelty_threshold = 0.3
novelty_weighting = 1.0

# Developmental system
development_plasticity_decay_rate = 0.9
development_critical_period_duration = 300.0
development_maturation_threshold = 600.0

# Social learning integration
social_observation_window = 50
social_influence_decay = 0.8

# Phase 6 text and thought processing
thought_trace_capacity = 100
thought_trace_decay = 0.9
internal_firing_rate_smoothing = 0.1

# Checkpointing and persistence
checkpoint_interval = 1000
checkpoint_history_size = 5
