# NLM Configuration File
# Phase 2: Advanced Neural Computation with Comprehensive Settings

# Basic simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.1
max_simulation_steps = 10000

# Neuron dynamics parameters
brain_v_thresh = -50.0
brain_v_rest = -70.0
brain_v_reset = -75.0
brain_tau_mem = 20.0
brain_tau_ref = 2
brain_leak_conductance = 10.0
brain_adaptation_strength = 0.01

# Synaptic parameters
brain_initial_weight_mean = 0.5
brain_initial_weight_std = 0.1
brain_synaptogenesis_rate = 0.001
brain_pruning_rate = 0.0001

# Plasticity system configuration
plasticity_stdp_enable = true
plasticity_stdp_learning_rate = 0.001
plasticity_stdp_tau_plus = 20.0
plasticity_stdp_tau_minus = 20.0
plasticity_stdp_tau_rec = 100.0
plasticity_hebbian_enable = true
plasticity_hebbian_learning_rate = 0.01
plasticity_structural_enable = true
plasticity_structural_growth_rate = 0.0001
plasticity_structural_pruning_rate = 0.00001

# Neuromodulation system
neuromod_dopamine_scale = 1.0
neuromod_dopamine_baseline = 0.0
neuromod_curiosity_enable = true
neuromod_curiosity_scale = 1.0
neuromod_curiosity_threshold = 0.5
neuromod_novelty_enable = true
neuromod_novelty_sensitivity = 0.5
neuromod_reward_decay = 0.99
neuromod_error_sensitivity = 0.1

# Memory systems
memory_working_memory_capacity = 100
memory_working_memory_decay_rate = 0.95
memory_episodic_capacity = 1000
memory_episodic_duration = 3600
memory_associative_similarity_threshold = 0.7
memory_procedural_learning_rate = 0.001

# Prediction and cognition
system_prediction_enabled = true
system_prediction_learning_rate = 0.01
system_prediction_error_threshold = 0.5
system_planning_enabled = true
system_planning_time_horizon = 10
system_concept_formation_enabled = true
system_attention_enabled = true

# Development system
development_stage_duration = 1000
development_critical_period_enabled = true
development_maturation_rate = 0.01
development_pruning_strength = 0.5

# World and environment
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_vision_width = 8
environment_vision_height = 8
environment_vision_angle = 90.0
environment_vision_range = 5.0

# Agent configuration
agent_max_energy = 100.0
agent_energy_decay_rate = 0.01
agent_health_start = 100.0
agent_health_decay_rate = 0.001
agent_age_rate = 0.001

# Logging and output
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_size = 10485760
log_rotation_count = 5

# Visualization
visualization_enabled = false
visualization_update_rate = 30.0
visualization_resolution_width = 1920
visualization_resolution_height = 1080
visualization_window_title = "NLM Brain Simulation"
visualization_show_neurons = true
visualization_show_synapses = true
visualization_show_regions = true
visualization_show_memory = true

# Performance and optimization
performance_thread_count = 4
performance_use_simd = true
performance_use_openmp = true
performance_memory_pool_size = 1048576
performance_event_queue_size = 65536

# Simulation controls
simulation_save_checkpoints = true
checkpoint_interval = 1000
checkpoint_path = ./checkpoints/
simulation_replay_enabled = true
replay_decay_rate = 0.9

# Reward and reinforcement
reward_function_type = "linear"
reward_max_value = 10.0
reward_min_value = -10.0
reward_discount_factor = 0.99
reward_prediction_error_weight = 0.5

# Experimental parameters
experiment_random_seed = 12345
experiment_num_trials = 100
experiment_trial_duration = 500
experiment_statistical_samples = 10
experiment_confidence_level = 0.95

# Advanced debugging
debug_mode = false
debug_log_level = DEBUG
debug_break_on_error = false
debug_profile_performance = true
debug_visualize_internal_state = false

# Security and permissions
security_validate_input = true
security_max_synapses = 10000
security_max_neurons = 10000
security_rate_limit = 1000
security_session_timeout = 3600

# Export and import
export_format = "binary"
export_compression = "gzip"
export_encryption = "none"
import_path = ./imports/
backup_enabled = true
backup_interval = 3600
