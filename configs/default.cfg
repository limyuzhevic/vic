# NLM Configuration File
# This is the default configuration for Phase 1 skeleton
# Format: key = value (comments start with #)
# File version: 1.0

# Random seed for reproducible experiments
# Provides deterministic initialization of neural networks and random processes
random_seed = 42

# Simulation timestep in seconds
# Time step for neural simulation, smaller values increase accuracy
# but require more computation (default: 1ms)
simulation_timestep = 0.001

# Number of neurons in the brain
# Total count of Leaky Integrate-and-Fire neurons in the simulation
# Range: 1 to 1,000,000 (default: 1000)
neuron_count = 1000

# Number of brain regions
# Number of anatomically distinct regions in the brain model
# Range: 1 to 100 (default: 2)
region_count = 2

# Connection probability for random connectivity
# Probability of synapse formation between neuron pairs in random connectivity
# Range: 0.0 to 1.0 (default: 0.1)
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
# Discount factor for future rewards in reinforcement learning
# Values closer to 1.0 give more weight to future rewards (default: 0.99)
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
# Width of the grid world in simulation steps
# Range: 1 to 1000 (default: 10)
environment_width = 10

# Height of the grid world in simulation steps
# Range: 1 to 1000 (default: 10)
environment_height = 10

# Logging settings
log_level = INFO
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL (default: INFO)
log_to_file = false
# Whether to write logs to file in addition to stdout (default: false)
log_filename = nlm.log
# Filename for log file when log_to_file is true (default: "nlm.log")

# Simulation settings
# Maximum number of simulation steps before automatic termination
# 0 means unlimited steps (default: 10000)
max_simulation_steps = 10000
# Simulation time limit in seconds
# 0 means unlimited time (default: 0.0)
simulation_time_limit = 0.0

# Visualization settings
# Whether to enable visualization output (default: false)
visualization_enabled = false
# Update rate for visualization in Hz (frames per second)
# Range: 1 to 1000 (default: 30.0)
visualization_update_rate = 30.0

# Configuration validation schema version
# Internal use for config file format validation
_config_schema_version = 1.0
