# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Checkpointing settings
checkpoint_dir = ./checkpoints
checkpoint_save_interval = 10000
max_checkpoints = 10
checkpoint_compress = true

# Replay settings
replay_interval = 100
consolidation_interval = 1000

# Development settings (phase-specific)
development_stage = Initial
development_plasticity_modulation = true

# Enhanced neural dynamics settings for selective learning and stability
enable_global_inhibition = true
firing_rate_threshold = 0.10  # 10% firing rate threshold for global inhibition
inhibition_strength_scale = 5.0  # Scale factor for inhibition strength
enable_homeostatic_scaling = true
homeostatic_scaling_interval = 100  # Steps between homeostatic scaling
homeostatic_target_excitatory_weight = 3.0  # Cap for total incoming excitatory weight
enable_neuromodulation_learning = true
learning_rate_modulation = 1.5  # Neuromodulation scaling factor
enable_replay_for_learning = true
replay_learning_boost = 0.3  # Boost for replay-based learning
enable_concept_formation = true
concept_formation_threshold = 0.7  # Threshold for concept detection
enable_attention_dynamics = true
attention_inhibition_strength = 0.5  # Strength of attentional inhibition
attention_excitation_strength = 1.5  # Strength of attentional excitation
