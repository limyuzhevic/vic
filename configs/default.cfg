# NLM Configuration File
# Enhanced default configuration for advanced usage

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Advanced plasticity configuration
plasticity_stdp_enable = true
plasticity_stdp_learning_rate = 0.01
plasticity_stdp_tau_plus = 20.0
plasticity_stdp_tau_minus = 20.0
plasticity_hebbian_enable = true
plasticity_structural_enable = true
plasticity_structural_max_synapses = 10000
plasticity_structural_min_synapses = 100

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_critical_period_duration = 100.0
development_maturation_rate = 0.001

# Advanced neuromodulation configuration
neuromod_dopamine_baseline = 0.1
neuromod_dopamine_scale = 1.0
neuromod_curiosity_enable = true
neuromod_curiosity_rate = 0.01
neuromod_curiosity_threshold = 0.1
neuromod_novelty_enable = true
neuromod_novelty_sensitivity = 0.5
neuromod_reward_scale = 1.0

# Advanced reward settings
reward_discount_factor = 0.99
reward_prediction_error_weight = 0.5
reward_associative_strength = 0.1
reward_punishment_weight = 0.5

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 8
vision_height = 8
vision_channels = 3
audio_sample_rate = 44100
audio_sample_duration = 0.1
max_energy = 100.0
energy_decay_rate = 0.001

# Advanced brain configuration
brain_v_thresh = -50.0
brain_v_rest = -70.0
brain_v_reset = -75.0
brain_tau_mem = 20.0
brain_tau_ref = 2.0
brain_leak_conductance = 0.1
brain_threshold_tonic = 0.0
brain_excitatory_inhibitory_ratio = 4.0
brain_spike_max_frequency = 200.0  # Hz
brain_spike_refractory_period = 2.0  # ms

# Advanced memory configuration
memory_working_memory_size = 50
memory_working_memory_decay_rate = 0.01
memory_episodic_capacity = 1000
memory_episodic_decay_rate = 0.001
memory_semantic_similarity_threshold = 0.7
memory_procedural_min_repetitions = 5
memory_associative_growth_rate = 0.1

# Advanced cognition configuration
attention_selectivity_threshold = 0.7
distraction_resistance_threshold = 0.5
planning_horizon = 10
planning_confidence_threshold = 0.5
self_model_update_rate = 0.01
body_awareness_threshold = 0.8

# Advanced prediction configuration
prediction_time_horizon = 100
prediction_accuracy_threshold = 0.7
prediction_confidence_decay = 0.95
neural_prediction_weight = 0.5

# Advanced logging configuration
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_max_file_size = 100.0  # MB
log_backup_count = 5
log_format = "[%(timestamp)s] [%(level)s] [%(module)s] %(message)s"
log_structured = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
autopause_on_goal = true
pause_on_error = true
enable_debug_output = false

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_size = 1024
visualization_window_height = 768
visualization_render_mode = "software"

# Performance settings
performance_enable_checkpointing = true
performance_checkpoint_interval = 1000
performance_enable_replay = true
performance_replay_speed = 1.0
performance_parallel_processing = true
performance_thread_count = 4
performance_enable_simd = true
performance_memory_pool_size = 10000

# Development and debugging
enable_developer_mode = false
debug_log_level = DEBUG
debug_break_on_error = false
enable_memory_profiling = false
enable_performance_profiling = false

# Security and access control
enable_access_control = false
access_control_file = "access_control.cfg"
simulation_timeout = 300.0  # seconds
max_memory_usage = 8192.0  # MB

# Advanced CLI options
cli_show_help = true
cli_version_info = true
cli_verbose_output = false
cli_debug_mode = false
cli_config_validation = true
cli_auto_complete = true
cli_history_enabled = true
cli_history_size = 1000

# Experimental features
experimental_enable_advanced_plasticity = false
experimental_enable_complex_memory = false
experimental_enable_advanced_cognition = false
experimental_enable_neural_generative = false
experimental_stochasticity_level = 0.1

# Output and export
export_enable_json = true
export_enable_csv = true
export_enable_matlab = false
export_output_directory = "exports"
export_file_prefix = "nlm_"
export_timestamp = true

# Quality assurance
qa_enable_validation = true
qa_validation_strictness = "medium"
qa_validation_report = "validation_report.json"
qa_performance_threshold = 0.8
qa_memory_threshold = 0.9
qa_cpu_threshold = 0.8

# Documentation and examples
example_config_file = "configs/example.cfg"
documentation_path = "docs"
api_reference_file = "docs/API_REFERENCE.md"
examples_directory = "examples"
tutorials_directory = "tutorials"