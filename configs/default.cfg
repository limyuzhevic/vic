# NLM Configuration File
# This is the default configuration for Phase 6 integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced neuromodulation settings
dopamine_curiosity_weight = 0.3
dopamine_reward_weight = 0.7
novelty_threshold = 0.5
curiosity_decay_rate = 0.95

# Prediction and memory settings
prediction_confidence_threshold = 0.7
prediction_horizon = 10
working_memory_capacity = 100
episodic_memory_capacity = 50

# Development settings
plasticity_rate_decay = 0.99
development_plasticity_boost = 2.0
maturation_speed = 0.1

# Environment and interaction settings
exploration_bonus = 0.5
exploitation_bonus = 1.0
action_selection_temperature = 1.0

# Performance and checkpoint settings
checkpoint_interval = 100
checkpoint_compression = true
replay_sample_size = 20
replay_distance_weight = 0.5

# Visualization and debugging
visualization_enabled = true
visualization_update_rate = 30.0
debug_output = false
