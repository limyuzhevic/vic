# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Advanced neuromodulation settings
dopamine_plasticity_scale = 1.0
curiosity_decay_rate = 0.95
novelty_threshold = 0.05
prediction_error_decay = 0.9

# Advanced memory settings
working_memory_capacity = 1000
episodic_memory_max_episodes = 5000
associative_memory_strength = 0.8

# Advanced plasticity settings
stdp_enable = true
stdp_learning_rate = 0.001
stdp_tau_plus = 20.0
stdp_tau_minus = 20.0

hebbian_enable = true
hebbian_learning_rate = 0.01

structural_plasticity_enable = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Advanced development settings
development_stage_transition_rate = 0.1
plasticity_decay_rate = 0.95

# Advanced cognition settings
attention_strength = 0.5
planner_depth = 5
concept_formation_threshold = 0.01

# Advanced world settings
world_timestep = 0.1
world_max_objects = 1000
world_object_decay_rate = 0.99

# Advanced logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_max_size = 10485760  # 10MB
log_backup_count = 5

# Advanced simulation settings
max_simulation_steps = 100000
simulation_time_limit = 1000.0  # seconds
checkpoint_interval = 100  # steps
