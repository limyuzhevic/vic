# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_decay_rate = 0.01
dopamine_peak_level = 1.0
curiosity_baseline = 0.05
curiosity_gain = 0.1
novelty_threshold = 0.3
prediction_error_weight = 0.5

# Reward settings
reward_discount_factor = 0.99
reward_noise_level = 0.1
reward_modulation_factor = 1.0

# Advanced memory settings
working_memory_capacity = 100
working_memory_decay_rate = 0.01
episodic_memory_capacity = 1000
episodic_memory_decay_rate = 0.001
associative_memory_strength = 0.8

# Neural dynamics settings
membrane_time_constant = 20.0
membrane_resistance = 10.0
initial_membrane_potential = -65.0
resting_potential = -70.0
threshold_potential = -55.0
reset_potential = -65.0
spike_frequency_adaptation = true
adaptation_tau = 100.0

# Synaptic dynamics settings
short_term_facilitation = true
facilitation_tau = 100.0
short_term_depression = true
depression_tau = 200.0
synaptic_efficacy_modulation = true
efficacy_decay_rate = 0.001

# Structural plasticity settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
connection_signaling_threshold = 0.5
minimum_connection_strength = 0.01

# Development system settings
initial_plasticity_rate = 1.0
critical_period_threshold = 0.8
development_maturation_rate = 0.1
replay_interval = 100
consolidation_interval = 1000

# Advanced plasticity settings
stdp_learning_rate = 0.01
stdp_tau = 20.0
hebbian_coherence_threshold = 0.7
reward_modulated_plasticity = true
eligibility_trace_decay = 0.001

# Learning and prediction settings
prediction_horizon = 10
prediction_error_threshold = 0.5
concept_update_rate = 0.05
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_plasticity = true
reward_shaping = true

# Performance and optimization settings
parallel_processing = true
max_threads = 4
neuron_cache_size = 1000
synapse_cache_size = 10000
gpu_acceleration = false
vectorization_level = 2

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_backend = "OpenGL"
neuron_visual_size = 5.0
synapse_visual_length = 20.0
background_color = "black"
neuron_color_scheme = "gradient"

# Logging and monitoring settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_size = 10485760
log_max_files = 5
performance_monitoring = true
memory_monitoring = true
checkpoint_interval = 1000
checkpoint_compression = "lz4"

# Advanced simulation settings
enable_replay = true
replay_strength = 0.8
enable_consolidation = true
consolidation_threshold = 0.3
stable_state_detection = true
stability_threshold = 0.95
max_stable_steps = 1000

# Security and access control
checkpoint_encryption = true
encryption_key_file = ""
allow_remote_connections = false
connection_port = 8080

# Custom parameters (user-defined)
# Add custom parameters here using key=value format
# Example: custom_parameter_1 = 42
# Example: custom_parameter_2 = "string_value"
# Example: custom_parameter_3 = true
