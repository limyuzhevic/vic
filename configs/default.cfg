# NLM Configuration File
# Phase 6 - Improved Configuration with Advanced Options

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings (Phase 6)
dopamine_baseline = 0.0
dopamine_baseline = 0.1
serotonin_baseline = 0.05
norepinephrine_baseline = 0.05
curiosity_threshold = 0.3
novelty_decay_rate = 0.95

# Neuromodulator parameters
acetylcholine_plasticity_factor = 0.8
norepinephrine_arousal_factor = 0.7
serotonin_control_factor = 0.6

# Memory system parameters
working_memory_capacity = 100
working_memory_decay_rate = 0.95
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_threshold = 0.3

# Cognitive system parameters
planner_planning_depth = 5
concept_formation_threshold = 0.5
attentional_inhibition_strength = 0.5
attentional_excitation_strength = 1.5

# Development settings
development_initial_plasticity = 1.0
development_critical_plasticity = 0.8
development_maturation_plasticity = 0.5
development_adult_plasticity = 0.2

# Reward and prediction
reward_discount_factor = 0.99
prediction_error_smoothing = 0.1

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Checkpoint settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compress = true
checkpoint_size_limit = 1000000

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_timestamp = true
log_detailed = false

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_data_file = nlm_viz.dat

# Experimental settings
experimental_mode = false
experimental_interactions = 0
experimental_reproduction = false
experimental_data_dir = ./experiments