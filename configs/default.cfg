# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_shaping_enabled = false
intrinsic_reward_scaling = 0.1
extrinsic_reward_scaling = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
observation_noise_std = 0.05
reward_noise_std = 0.01

# Phase 6 Integration Settings
# Memory systems
working_memory_capacity = 1000
episodic_memory_capacity = 10000
associative_memory_capacity = 5000
replay_interval = 100
consolidation_interval = 1000

# Prediction system
prediction_horizon = 10
prediction_learning_rate = 0.05
prediction_error_threshold = 0.1

# Cognition systems
planning_horizon = 20
concept_learning_rate = 0.01
attention_span = 5.0

# Development system
initial_plasticity = 1.0
critical_period_start = 60.0
critical_period_end = 300.0
adult_plasticity = 0.2

# Sparse connectivity
enable_sparse_connectivity = true
connection_sparsity = 0.15
reconnection_rate = 0.001

# Performance settings
max_simulation_steps = 100000
simulation_time_limit = 1000.0
optimization_level = 2  # 0=basic, 1=advanced, 2=optimized

# Logging and visualization
log_level = INFO
log_to_file = false
log_filename = nlm.log
visualization_enabled = true
visualization_update_rate = 30.0
enable_metrics_collection = true
metrics_output_interval = 1000

