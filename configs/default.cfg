# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced performance settings (Phase 5+ features)
# Event system configuration
events_enabled = true
events_max_queue_size = 10000
events_processing_interval = 0.001

# Memory system configuration
memory_enabled = true
working_memory_capacity = 100
working_memory_trace_decay_rate = 0.99
episodic_memory_max_episodes = 1000
episodic_memory_episode_retention = 0.95

# Neuromodulation configuration
neuromodulation_enabled = true
dopamine_sensitivity = 0.8
curiosity_threshold = 0.3
novelty_sensitivity = 0.6

# Prediction system configuration
prediction_enabled = true
prediction_horizon = 10
prediction_error_threshold = 0.5

# Development system configuration
development_enabled = true
development_rate = 0.01
critical_period_duration = 1000
maturation_rate = 0.005

# Structural plasticity configuration
structural_plasticity_enabled = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
synaptogenesis_threshold = 0.1
pruning_threshold = 0.05

# Experimental controls
experimental_mode = false
experimental_phase = 6
experimental_tracking_enabled = true
experimental_data_directory = ./experimental_data
