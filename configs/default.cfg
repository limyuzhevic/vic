# NLM Configuration File
# This is the Phase 6 configuration for the Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds - finer timestep for better temporal resolution
simulation_timestep = 0.0001

# Number of neurons in the brain - increased for Phase 6 capabilities
neuron_count = 5000

# Number of brain regions - increased to allow for functional specialization
region_count = 4

# Connection probability for random connectivity - optimized for integration
connection_probability = 0.15

# Plasticity settings - enhanced for Phase 6 learning
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.018
stdp_time_constant = 20.0

# Development settings - Phase 6 developmental stages enabled
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002

# Neuromodulation settings - Phase 6 neuromodulation systems enabled
dopamine_baseline = 0.1
neuron_excitability_boost = 0.5
curiosity_threshold = 0.3
novelty_sensitivity = 0.8

# Reward settings - Phase 6 reward prediction and temporal difference learning
reward_discount_factor = 0.995
reward_prediction_error_decay = 0.9

# Environment settings - Phase 6 integrated environment simulation
environment_name = IntegratedEnvironment
environment_width = 20
environment_height = 20
max_objects = 50

# Memory system settings - Phase 6 memory integration
working_memory_capacity = 500
episodic_memory_max_episodes = 5000
associative_memory_strength_decay = 0.99
memory_consolidation_interval = 1000

# Prediction system settings - Phase 6 predictive coding
prediction_model_enabled = true
prediction_history_size = 1000
prediction_update_interval = 10
prediction_error_threshold = 0.1

# Cognition system settings - Phase 6 cognitive integration
neural_planner_enabled = true
neural_planner_depth = 8
concept_formation_enabled = true
attention_system_enabled = true

# Development system settings - Phase 6 developmental stages
developmental_stage_interval = 5000
development_plasticity_modulation = 0.5

# Checkpoint system settings - Phase 6 brain persistence
checkpoint_dir = ./checkpoints_phase6
checkpoint_interval = 5000
checkpoint_compression = Balanced
checkpoint_history = 10

# Logging settings - enhanced for Phase 6 debugging
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log
log_rotation_size = 10485760  # 10MB
log_level_memory = DEBUG
log_level_prediction = DEBUG
log_level_cognition = DEBUG

# Simulation settings - Phase 6 advanced simulation
max_simulation_steps = 100000
simulation_time_limit = 3600.0  # 1 hour
enable_replay = true
replay_interval = 100
replay_episodes = 5

# Performance settings - Phase 6 performance optimization
enable_performance_monitoring = true
performance_sampling_rate = 100
enable_event_queue = true
memory_pool_size = 100000

# Visualization settings - Phase 6 visualization enabled
visualization_enabled = true
visualization_update_rate = 60
visualization_output_file = brain_viz.mp4
enable_network_visualization = true
enable_spike_raster = true
enable_weight_matrix_viz = true

# Exploration settings - Phase 6 exploration/exploitation balance
exploration_rate = 0.1
exploitation_rate = 0.9
intrinsic_motivation = true
curiosity_factor = 0.7
