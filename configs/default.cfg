# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced plasticity settings (Phase 5/6)
stdp_tau = 20.0  # STDP time constant in ms
stdp_ltp_weight = 0.01f
stdp_ltd_weight = 0.012f
hebbian_learning_rate = 0.005f
eligibility_trace_decay = 0.95f
reward_modulation_strength = 0.5f

# Working memory settings
working_memory_capacity = 100
working_memory_decay_rate = 0.01f
working_memory_reinforcement_strength = 0.5f

# Episodic memory settings
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_strength = 0.3f

# Neuromodulation advanced settings
dopamine_baseline = 0.1f
dopamine_response_gain = 1.0f
curiosity_threshold = 0.5f
curiosity_decay = 0.98f
novelty_sensitivity = 1.0f

# Development system settings
developmental_stage_transition_step = 1000
plasticity_modulation_strength = 1.0f
synaptogenesis_rate = 0.0001f
pruning_rate = 0.00001f

# Cognitive system settings
planning_depth = 5
concept_formation_threshold = 0.1f
self_model_confidence_threshold = 0.8f

# Advanced world settings
world_width = 20.0f
world_height = 20.0f
world_vision_width = 16
world_vision_height = 16
agent_max_energy = 100.0f
agent_energy_decay_rate = 0.01f
agent_resource_gain = 30.0f
agent_hazard_damage = 0.2f

# Checkpoint and replay settings
checkpoint_dir = "./checkpoints"
checkpoint_save_interval = 10000
checkpoint_max_files = 5
checkpoint_compress = true
enable_replay = true
replay_max_episodes = 3

# Performance settings
parallel_processing = true
simd_vectorization = true
memory_pool_size = 1024
event_queue_size = 512

# Logging and debugging
debug_mode = false
verbose_logging = false
log_level = "INFO"
log_performance_metrics = true
log_memory_usage = true
log_plasticity_updates = true

# Advanced sensory settings
vision_range = 8.0f
touch_range = 1.5f
proprioception_noise = 0.0f
audio_enabled = false
audio_sample_rate = 44100

# Advanced motor settings
motor_speed = 3.0f
motor_turn_speed = 2.0f
motor_action_cost = 0.01f
motor_interaction_range = 1.0f

# Advanced neural dynamics
lif_resting_potential = -70.0f
lif_threshold = -55.0f
lif_reset_potential = -70.0f
lif_leak_conductance = 1.0f
max_incoming_excitatory_weight = 3.0f