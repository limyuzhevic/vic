# NLM Configuration File
# Phase 6: Final Integration Configuration
# This configuration is designed for the complete artificial brain integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 scale)
neuron_count = 5000

# Number of brain regions (Phase 6: multiple regions for integration)
region_count = 4

# Connection probability for random connectivity
connection_probability = 0.08

# Plasticity settings (Phase 6 optimized)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
plasticity_learning_rate = 0.01

# Development settings (Phase 6: enabled by default)
synaptogenesis_rate = 0.0001f
development_pruning_rate = 0.00001f
development_critical_period_start = 0.5

# Neuromodulation settings (Phase 6: fully integrated)
dopamine_baseline = 0.05
dopamine_modulation_strength = 0.3
curiosity_strength = 0.2
novelty_sensitivity = 0.15

# Reward settings
reward_discount_factor = 0.95
reward_prediction_error_decay = 0.9

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20
world_boundary_enabled = true

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_timestamp = true

# Simulation settings
max_simulation_steps = 100000
simulation_time_limit = 0.0
checkpoint_interval = 1000
replay_interval = 100
consolidation_interval = 10000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Memory system settings (Phase 6)
working_memory_capacity = 500
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 10000
episodic_memory_replay_count = 3
episodic_memory_consolidation_threshold = 0.7

# Cognitive system settings (Phase 6)
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_formation_threshold = 0.6

# Development system settings
developmental_stage_duration = 1000.0
plasticity_modulation_factor = 0.8

# Advanced features
enable_structural_plasticity = true
enable_development = true
enable_checkpointing = true
checkpoint_compression = "balanced"
checkpoint_path = "./checkpoints"

# Performance settings
performance_monitoring = true
memory_pool_enabled = true
event_queue_enabled = true
simd_vectorization = true
parallel_processing = false  # Set to true if using multiple CPU cores

# Phase 6 Integration settings
integration_test_neuron_count = 100
integration_test_max_steps = 1000
integration_test_enable_all_systems = true
