# NLM Configuration File
# This is the default configuration for Phase 6 - Final Integration

# ============================================================================
# BASIC SIMULATION SETTINGS
# ============================================================================

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (smaller = more accurate)
simulation_timestep = 0.001

# Maximum number of simulation steps (0 = unlimited)
max_simulation_steps = 100000

# Maximum simulation time in seconds (0.0 = unlimited)
simulation_time_limit = 1000.0

# ============================================================================
# BRAIN ARCHITECTURE SETTINGS
# ============================================================================

# Total number of neurons in the brain
neuron_count = 2000

# Number of brain regions (higher = more distributed computation)
region_count = 4

# Connection probability for random connectivity (0.0-1.0)
connection_probability = 0.08

# ============================================================================
# NEURAL DYNAMICS SETTINGS
# ============================================================================

# Neuron threshold potential (mV)
v_thresh = -50.0

# Neuron resting potential (mV)
v_rest = -70.0

# Neuron reset potential after spike (mV)
v_reset = -75.0

# Membrane time constant (ms)
tau_mem = 20.0

# Refractory period (steps)
tau_ref = 5

# ============================================================================
# PLASTICITY SETTINGS
# ============================================================================

# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
stdp_enable = true

# Hebbian learning parameters
hebbian_enable = true
hebbian_strength = 0.001

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
structural_enable = true

# ============================================================================
# DEVELOPMENT SETTINGS
# ============================================================================

# Developmental stage modulation
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
enable_development = true

# ============================================================================
# NEUROMODULATION SETTINGS
# ============================================================================

# Dopamine system
dopamine_baseline = 0.1
dopamine_scale = 1.0

# Curiosity system
enable_curiosity = true
curiosity_scale = 1.0

# Novelty detection
enable_novelty = true
novelty_threshold = 0.5

# ============================================================================
# MEMORY SYSTEMS SETTINGS
# ============================================================================

# Working memory capacity
working_memory_capacity = 200

# Episodic memory
enable_episodic_memory = true
max_episodes = 1000

# Associative memory
enable_associative_memory = true
association_strength = 0.5

# ============================================================================
# PREDICTION SYSTEM SETTINGS
# ============================================================================

# Prediction error parameters
prediction_error_threshold = 0.1
prediction_decay_rate = 0.95

# ============================================================================
# COGNITION SETTINGS
# ============================================================================

# Neural planning
enable_planning = true
planning_depth = 5

# Concept formation
enable_concept_formation = true
concept_threshold = 0.7

# Attention
enable_attention = true
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# ============================================================================
# ENVIRONMENT SETTINGS
# ============================================================================

# Environment type
environment_name = GridWorld
environment_width = 50
environment_height = 50

# Agent properties
agent_start_x = 25.0
agent_start_y = 25.0
agent_max_energy = 100.0
agent_health = 1.0
agent_age = 0.0

# Sensory settings
vision_width = 16
vision_height = 16
audio_enabled = false
internal_enabled = true

# ============================================================================
# REWARD AND LEARNING
# ============================================================================

# Reward system
reward_discount_factor = 0.99
reward_scale = 1.0

# Learning rate
plasticity_learning_rate = 0.01

# ============================================================================
# CHECKPOINT AND PERSISTENCE
# ============================================================================

# Checkpoint settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = Balanced
enable_checkpointing = true

# Replay and consolidation
enable_replay = true
replay_interval = 100
enable_consolidation = true
consolidation_threshold = 0.3

# ============================================================================
# LOGGING AND DEBUGGING
# ============================================================================

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log

# Performance monitoring
enable_profiling = false
performance_log_interval = 100

# ============================================================================
# VISUALIZATION SETTINGS
# ============================================================================

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_size = 1024

# ============================================================================
# PHASE 6 INTEGRATION SETTINGS
# ============================================================================

# Integration verification thresholds
integration_memory_threshold = 0.8
integration_neuromodulation_threshold = 0.8
integration_prediction_threshold = 0.7
integration_development_threshold = 0.8

# ============================================================================
# EXPERIMENTAL PARAMETERS
# ============================================================================

# For research and testing
enable_structural_plasticity = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Learning dynamics
learning_rate = 0.001
momentum = 0.9

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
