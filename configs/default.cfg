// Simple build configuration file for NLM testing

# Global configuration for NLM Phase 6 testing
neuron_count = 500
region_count = 1
connection_probability = 0.1
simulation_timestep = 0.001
random_seed = 42
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development system configuration
development_enabled = true
development_stage = 2
critical_period_duration = 100.0
maturation_rate = 0.001

# Neuromodulation configuration
dopamine_enabled = true
curiosity_enabled = true
novelty_enabled = true

# Memory system configuration
working_memory_enabled = true
working_memory_capacity = 100.0
episodic_memory_enabled = true
episodic_memory_decay = 0.001

# Prediction system configuration
prediction_enabled = true
prediction_horizon = 10
prediction_error_threshold = 0.1

# Cognition system configuration
planning_enabled = true
concept_formation_enabled = true
attention_enabled = true

# Checkpoint system configuration
checkpoint_enabled = true
checkpoint_path = "./nlm_checkpoint.bin"
checkpoint_frequency = 1000

# Replay system configuration
replay_enabled = true
replay_episodes = 5
replay_window = 100