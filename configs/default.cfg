# NLM Phase 6 Configuration File Example
# 
# This file demonstrates the configuration system for NLM Phase 6
# All values are in their native units (floats, ints, strings)

# Basic simulation parameters
neuron_count = 1000           # Total number of neurons in the brain
region_count = 1              # Number of brain regions
connection_probability = 0.1   # Probability of synaptic connections between neurons

# Simulation timing
simulation_timestep = 0.001   # Time step for integration (seconds)
max_steps = 10000             # Maximum simulation steps

# Plasticity parameters (STDP)
stdp_ltp_weight = 0.01         # Long-term potentiation weight
stdp_ltd_weight = 0.012        # Long-term depression weight
stdp_tau = 20.0                # STDP time constant (ms)

# Structural plasticity
Synaptogenesis_rate = 0.0001f # Rate of new synapse formation
pruning_rate = 0.00001f       # Rate of synapse elimination

# Memory system parameters
working_memory_capacity = 100  # Capacity of working memory
effective_memory_episodes = 1000 # Maximum episodic memories

# Neuromodulation parameters
dopamine_baseline = 0.1       # Baseline dopamine level
curiosity_baseline = 0.05     # Baseline curiosity level
novelty_sensitivity = 0.5     # Sensitivity to novel stimuli

# Development parameters
development_stage = "adult"   # Current developmental stage
plasticity_modulation = 0.2   # Plasticity reduction factor with age

# Checkpointing
checkpoint_dir = "./checkpoints" # Directory for checkpoint files
max_checkpoints = 10          # Maximum number of checkpoints to keep
checkpoint_compression = "balanced" # Compression level

# Performance optimizations
enable_simd = true            # Enable SIMD vectorization
enable_parallel = true        # Enable parallel processing
memory_pool_size = 1000000   # Size of memory pools (bytes)

# Replay parameters
replay_interval = 100         # Steps between memory replay
consolidation_interval = 1000 # Steps between consolidation
replay_sample_size = 5        # Number of episodes to replay

# Reward and reinforcement
reward_decay = 0.95           # Reward decay factor
 exploration_bonus = 0.5      # Bonus for novel exploration

# Attention parameters
attention_inhibition_strength = 0.5 # Strength of attentional inhibition
attention_excitation_strength = 1.5 # Strength of attentional excitation

# Logging and debugging
log_level = "info"           # Logging level (debug, info, warning, error)
stats_interval = 100          # Interval for statistics logging
performance_monitoring = true # Enable performance monitoring

# Environment simulation
world_width = 16              # Width of simulation world
world_height = 16             # Height of simulation world

# Agent parameters
agent_exploration_rate = 0.1  # Probability of random actions
agent_reward_threshold = 0.5   # Threshold for reward-based learning

# Prediction parameters
prediction_horizon = 5        # Number of steps for forward prediction
prediction_error_decay = 0.9  # Decay rate for prediction errors

# Social learning
enable_social_learning = false # Enable social learning capabilities
imitation_strength = 0.8       # Strength of imitation learning

# Continual learning
enable_continual_learning = true # Enable continual learning
plastic_threshold = 0.1        # Threshold for triggering plasticity

# Safety and limits
max_synaptic_weight = 10.0     # Maximum synaptic weight
min_synaptic_weight = -5.0     # Minimum synaptic weight
max_neuron_excitability = 100.0 # Maximum neuron excitability

# Serialization
enable_compression = true      # Enable compression for checkpoints
compression_level = "balanced"  # Compression level (fast, balanced, high)

# Experimental parameters
experimental_mode = "production" # Mode: debug, test, production
random_seed = 42                 # Random seed for reproducibility

# Performance targets
min_frames_per_second = 30      # Minimum performance target
max_memory_usage_mb = 512       # Maximum memory usage
