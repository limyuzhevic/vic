# NLM Configuration File
# This is the default configuration for Phase 2 neural computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
plasticity_learning_rate = 0.01

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Performance monitoring
performance_monitoring = true
profile_frequency = 1000

# Advanced plasticity options
hebbian_enabled = true
stdp_enabled = true
reward_modulated_plasticity_enabled = true
structural_plasticity_enabled = true

# Development stages
initial_plasticity_modifier = 1.0
critical_period_plasticity_modifier = 0.8
maturation_plasticity_modifier = 0.5
adult_plasticity_modifier = 0.2

# Neuromodulator settings
curiosity_enabled = true
novelty_detection_enabled = true
prediction_error_enabled = true

# Memory system parameters
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_strength = 0.5

# Cognitive parameters
concept_formation_enabled = true
neural_planner_enabled = true
attention_enabled = true

# Experimental settings
checkpoint_enabled = true
checkpoint_frequency = 1000
replay_enabled = true
consolidation_enabled = true
