# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Structural plasticity
structural_plasticity_synaptogenesis_rate = 0.0001
structural_plasticity_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
novelty_threshold = 0.5
curiosity_drive = 0.3

# Prediction settings
prediction_confidence_threshold = 0.7
temporal_sequence_memory = 20

# Memory systems
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_max_patterns = 500

# Development settings
development_critical_period_start = 10
development_critical_period_end = 100
development_plasticity_decay_rate = 0.95

# Reward and motivation
reward_prediction_error_threshold = 0.1
discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_colors_enabled = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval = 1000
replay_interval = 100
consolidation_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced features (Phase 6)
sequence_learning_enabled = true
pattern_recognition_enabled = true
social_learning_enabled = true
meta_learning_enabled = true
batch_processing_enabled = true
scripting_enabled = true
