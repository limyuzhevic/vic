# NLM Configuration File
# This is the default configuration for the Neural Learning Machine with configurable parameters
# Version: 1.0
# Generated by ConfigManager

# Simulation Parameters
# ====================

# Basic simulation parameters
simulation_timestep = 0.001        # Simulation timestep in seconds (1ms)
simulation_steps = 10000            # Number of simulation steps
max_simulation_steps = 100000       # Maximum simulation steps before timeout
connection_probability = 0.1        # Connection probability for random connectivity
neuron_count = 1000                 # Total number of neurons in the brain
region_count = 2                     # Number of brain regions
replay_interval = 100               # Memory replay interval (steps)
consolidation_interval = 1000        # Memory consolidation interval (steps)

# Neural Parameters
# =================-

# Neuron properties
membrane_potential_threshold = -55.0  # Membrane potential threshold for spike generation (mV)
membrane_capacitance = 1.0              # Membrane capacitance (nF)
resting_potential = -70.0              # Resting membrane potential (mV)
reset_potential = -65.0                # Reset potential after spike (mV)
excitability = 1.0                      # Neuron excitability factor
inhibitory_strength = 0.5              # Inhibitory synaptic strength
synaptic_gain = 1.0                     # Synaptic gain factor
neural_firing_rate_mean = 5.0          # Mean neural firing rate (Hz)
neural_firing_rate_std = 2.0           # Standard deviation of neural firing rate (Hz)

# Synaptic properties
synapse_initial_weight = 0.0           # Initial synaptic weight
synapse_weight_range_min = -1.0        # Minimum synaptic weight
synapse_weight_range_max = 1.0         # Maximum synaptic weight
propagation_delay = 1                  # Synaptic propagation delay (timesteps)
conductance_based = true               # Use conductance-based synapses

# Memory Parameters
# ============

# Working memory
working_memory_capacity = 100          # Working memory capacity (number of patterns)
working_memory_decay_rate = 0.95       # Working memory decay rate per timestep

# Episodic memory
episodic_memory_limit = 1000           # Episodic memory storage limit
episodic_memory_decay_rate = 0.99      # Episodic memory decay rate per timestep
episodic_memory_similarity_threshold = 0.7 # Similarity threshold for episodic retrieval
episodic_memory_max_age = 1000         # Maximum episode age (steps)

# Associative memory
associative_memory_capacity = 500       # Associative memory capacity
associative_memory_strength_decay = 0.98 # Strength decay rate

# Plasticity Parameters
# ===================

# Spike-Timing-Dependent Plasticity (STDP)
stdp_ltp_weight = 0.01                 # STDP Long-Term Potentiation weight
stdp_ltd_weight = 0.012                # STDP Long-Term Depression weight
stdp_time_constant = 20.0             # STDP time constant (ms)
stdp_decay_rate = 0.001               # STDP eligibility trace decay rate
stdp_max_trace = 1.0                   # Maximum STDP eligibility trace
stdp_window_width = 50.0              # STDP window width (ms)

# Hebbian plasticity
hebbian_learning_rate = 0.01           # Hebbian learning rate
hebbian_max_weight = 1.0               # Hebbian maximum weight
hebbian_min_weight = -1.0              # Hebbian minimum weight
hebbian_trace_decay = 0.9              # Hebbian trace decay rate

# Structural plasticity
synaptogenesis_rate = 0.001           # Rate of new synapse formation per step
pruning_rate = 0.0001                  # Rate of synapse removal per step
min_synaptic_strength = 0.05           # Minimum strength for synapse retention
max_new_synapses_per_step = 10         # Maximum new synapses per step
min_connection_probability = 0.01      # Minimum connection probability

# Development Parameters
# ===================

development_enabled = true            # Enable developmental processes
developmental_stage_duration = 100.0   # Duration of each developmental stage (steps)
plasticity_modifier_rate = 0.5         # Plasticity modifier rate during development
maturation_rate = 0.01                 # Rate of neural maturation
axon_guidance_strength = 0.8           # Strength of axon guidance during development
synaptogenesis_boost = 2.0             # Synaptogenesis boost during development
pruning_intensity = 0.3                # Pruning intensity during development

# Neuromodulation Parameters
# =========================

# Dopamine system
dopamine_baseline = 0.1                # Baseline dopamine level
dopamine_scale = 1.0                    # Dopamine modulation scale
reward_prediction_error_gain = 1.0      # Reward prediction error gain
innovation_signal_strength = 0.5        # Innovation signal strength

# Curiosity system
curiosity_threshold = 0.5               # Curiosity activation threshold
curiosity_decay_rate = 0.99             # Curiosity decay rate
curiosity_modulation_strength = 1.0     # Curiosity modulation strength
prediction_error_weight = 0.5           # Prediction error weight in curiosity

# Novelty detection
novelty_threshold = 0.5                 # Novelty detection threshold
novelty_sensitivity = 1.0               # Novelty sensitivity factor
novelty_decay = 0.95                    # Novelty decay rate

# Reward system
reward_discount_factor = 0.99           # Reward discount factor for temporal difference learning
reward_prediction_error_scaling = 0.1   # RPE scaling factor
exploration_bonus = 0.1                 # Exploration bonus

# Cognitive Parameters
# =================

# Attention
attention_inhibition_strength = 0.5   # Attention inhibition strength
attention_excitation_strength = 1.5     # Attention excitation strength
attention_gaussian_sigma = 2.0          # Attention Gaussian sigma
attention_threshold = 0.3              # Attention threshold

# Planning
planning_depth = 5                      # Planning horizon depth
planning_confidence_threshold = 0.7     # Planning confidence threshold
planning_risk_tolerance = 0.5           # Planning risk tolerance
planning_explore_weight = 0.3           # Planning exploration weight

# Concept formation
concept_stability_threshold = 0.8        # Concept stability threshold
concept_forgetting_rate = 0.05          # Concept forgetting rate
concept_integration_strength = 0.7       # Concept integration strength
concept_similarity_threshold = 0.6      # Concept similarity threshold

# Prediction system
prediction_error_threshold = 0.2         # Prediction error threshold
prediction_confidence_threshold = 0.7   # Prediction confidence threshold
prediction_horizon = 10                 # Prediction horizon (steps)
pattern_matching_threshold = 0.7        # Pattern matching similarity threshold

# General Parameters
# ============

# Random seed and reproducibility
random_seed = 42                         # Random seed for reproducible experiments
seed_string = ""                         # Optional seed string for reproducibility

# Logging and debugging
log_level = "INFO"                      # Logging level (DEBUG, INFO, WARNING, ERROR)
log_to_file = false                     # Log to file instead of stdout
log_filename = "nlm.log"                 # Log filename
log_rotation_size = 10485760            # Log file rotation size (bytes)
log_retention_days = 7                 # Log retention days

# Visualization
visualization_enabled = false           # Enable visualization
visualization_update_rate = 30.0        # Visualization update rate (Hz)
visualization_window_width = 1280       # Visualization window width
visualization_window_height = 720       # Visualization window height
visualization_color_scheme = "default" # Visualization color scheme

# Environment
environment_name = "GridWorld"           # Environment name
environment_width = 10                  # Environment width
environment_height = 10                 # Environment height

# Performance
checkpoint_interval = 1000              # Checkpoint interval (steps)
checkpoint_retention = 10               # Number of checkpoints to retain
performance_monitoring = true           # Enable performance monitoring
memory_limit_mb = 1024                  # Memory limit (MB)

# Safety and constraints
max_neurons_per_region = 500            # Maximum neurons per region
max_connections_per_neuron = 1000       # Maximum outgoing connections per neuron
min_connection_weight = -1.0            # Minimum connection weight
max_connection_weight = 1.0              # Maximum connection weight
neuron_reset_threshold = -100.0         # Neuron reset threshold (mV)
neuron_max_threshold = 50.0             # Neuron maximum threshold (mV)

# Agent Parameters (for AgentBrain)
# ========================

# AgentBrain-specific parameters
dopamine_level = 0.0                    # Initial dopamine level
novelty_level = 0.0                     # Initial novelty level
curiosity_level = 0.0                   # Initial curiosity level
prediction_error_level = 0.0            # Initial prediction error
expected_reward = 0.0                   # Expected reward
plasticity_modifier = 1.0               # Plasticity modifier factor
sensory_novelty_decay = 0.99            # Sensory novelty decay rate
reward_modulation_enabled = true        # Enable reward modulation
structural_plasticity_enabled = true    # Enable structural plasticity
development_enabled = true              # Enable development
 curiosity_enabled = true               # Enable curiosity

# Action space
action_space_size = 6                   # Number of possible actions
action_prob_temperature = 1.0            # Temperature for action probability

# Reward shaping
reward_scale = 1.0                       # Reward scaling factor
reward_shaping_enabled = true           # Enable reward shaping

# Sampling and exploration
exploration_rate = 0.1                  # Exploration rate
exploration_decay = 0.9995              # Exploration decay rate
epsilon_greedy_epsilon = 0.1            # Epsilon for epsilon-greedy policy
