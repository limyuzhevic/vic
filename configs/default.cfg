# NLM Configuration Template
# Copy and modify this file for custom configurations

# Basic Brain Configuration
neuron_count=500          # Total number of neurons in the brain
region_count=1            # Number of neural regions
connection_probability=0.1 # Probability of synaptic connections
random_seed=42            # Random seed for reproducible experiments

# Simulation Parameters
simulation_timestep=0.001   # Simulation timestep in milliseconds
max_steps=10000             # Maximum simulation steps per episode

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-65.0              # Reset membrane potential (mV)
v_thresh=-55.0             # Threshold potential (mV)

# STDP (Spike-Timing-Dependent Plasticity)
stdp_ltp_weight=0.01       # Long-Term Potentiation weight
stdp_ltd_weight=0.012      # Long-Term Depression weight
stdp_tau=20.0              # STDP time constant (ms)

# Hebbian Plasticity
hebbian_weight=0.005       # Hebbian learning rate

# Structural Plasticity (synaptogenesis and pruning)
synaptogenesis_rate=0.0001 # Rate of new synapse formation
pruning_rate=0.00001       # Rate of synapse elimination

# Memory Systems (capacity settings)
working_memory_capacity=50   # Number of working memory traces
episodic_memory_max_episodes=1000 # Maximum stored episodes
associative_memory_capacity=200 # Number of associative patterns

# Neuromodulation
 dopamine_level=0.5        # Baseline dopamine level
curiosity_rate=0.1         # Curiosity-driven exploration
novelty_threshold=0.3      # Threshold for novelty detection

# Development (optional)
enable_development=true    # Enable developmental stages
plasticity_decay_rate=0.05 # Rate of plasticity reduction with age

# Checkpoint System (optional)
checkpoint_dir=./checkpoints   # Directory for checkpoint files
checkpoint_interval=1000       # Steps between checkpoints
max_checkpoints=10             # Maximum checkpoints to keep

# Advanced Options (optional)
enable_replay=true         # Enable memory replay consolidation
replay_interval=100       # Steps between replay events
enable_predictive=false    # Enable predictive coding
prediction_accuracy=0.8    # Target prediction accuracy
enable_social_learning=false # Enable social learning capabilities

# Logging and Monitoring (optional)
log_level=INFO            # Log level (DEBUG, INFO, WARNING, ERROR)
log_file=nlm_simulation.log # File for detailed logging
metrics_interval=1000     # Interval for collecting metrics
verbose_output=false      # Enable detailed verbose output

# Environment Simulation (for Phase 3+)
env_width=20              # Environment width (for world interaction)
env_height=20             # Environment height (for world interaction)
sensory_channels=4        # Number of sensory modalities
motor_actions=6          # Number of motor action types

# Experimental Parameters (for Phase 4+)
exploration_rate=0.3       # Rate of exploratory behavior
exploitation_rate=0.7     # Rate of exploitative behavior
reward_scale=1.0          # Scale factor for rewards
exploration_bonus=0.1     # Bonus for novel exploration

# Performance and Optimization (optional)
enable_multithreading=false # Enable parallel processing
thread_count=4           # Number of threads for parallel processing
enable_simd=true         # Enable SIMD optimizations
use_memory_pool=true     # Enable memory pooling
