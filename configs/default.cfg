## Configuration File Troubleshooting

### 1. Common Issues

```bash
# Configuration file not found
./nlm --config configs/missing.cfg
# Solution: Create the configuration file

# Invalid parameter value
./nlm --config configs/bad.cfg
# Solution: Check parameter ranges and format

# Missing required parameter
./nlm --config configs/incomplete.cfg
# Solution: Add all required parameters
```

### 2. Configuration File Validation

```bash
# Validate configuration file
./validate_config.sh configs/bad.cfg

# Fix validation errors
nano configs/bad.cfg

# Validate again
./validate_config.sh configs/bad.cfg
```

### 3. Configuration File Examples

```bash
# View configuration file examples
cat configs/examples/standard.cfg

# Create from example
cp configs/examples/standard.cfg configs/custom.cfg

# Edit custom configuration
nano configs/custom.cfg
```

## Configuration File Summary

The configuration system provides:

1. **Flexible configuration** - Multiple configuration files for different use cases
2. **Command-line overrides** - Easy runtime configuration changes
3. **Parameter validation** - Ensures valid parameter values
4. **Documentation** - Comprehensive documentation and examples
5. **Versioning** - Configuration file versioning for tracking changes

The configuration system makes it easy to run different types of experiments and customize the demo for specific research purposes.
