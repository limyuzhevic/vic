# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500  # Reduced for faster testing in Phase 2

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development settings (legacy parameters)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 2 specific parameters
# Neuron parameters (for Phase 2)
leak_rate = 0.1
resting_potential = -65.0
spike_threshold = -50.0
refractory_period = 5.0

# Synaptic parameters (for Phase 2)
synapse_delay = 1
max_synapses_per_neuron = 100

# Advanced neural computation parameters
use_spike_times = true
detect_spike_timing = true
use_structural_plasticity = true
use_stdp_plasticity = true
use_hebbian_plasticity = true
