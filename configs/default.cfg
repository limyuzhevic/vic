# NLM Phase 6 Configuration File
# This is the default configuration for Phase 6 Final Integration
# Use command-line arguments or modify this file to customize experiments

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (must be positive)
simulation_timestep = 0.001

# Number of neurons in the brain (100-10000 recommended)
neuron_count = 1000

# Number of brain regions (1-10 recommended)
region_count = 1

# Connection probability for random connectivity (0.01-0.5 recommended)
connection_probability = 0.1

# Plasticity settings (STDP parameters)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (structural plasticity)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (dopamine baseline)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings (for Phase 6 world interaction)
environment_name = SimpleWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_phase6.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 specific settings
enable_checkpointing = true
enable_replay = true
enable_development = true
checkpoint_path = ./checkpoint.bin
warmup_steps = 100
curiosity_level = 0.5
novelty_threshold = 0.01
reward_scale = 1.0
exploration_rate = 0.1

# Performance settings
enable_simd = true
enable_parallel = true
enable_memory_pools = true
