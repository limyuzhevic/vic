// NLM Configuration File (Phase 6: Final Integration)
// JSON format for easy loading and modification
{
    "version": "0.6.0",
    "phase": "FINAL INTEGRATION",
    
    // Random seed for reproducible experiments
    "random_seed": 42,
    
    // Simulation timestep in seconds
    "simulation_timestep": 0.001,
    
    // Number of neurons in the brain
    "neuron_count": 1000,
    
    // Number of brain regions
    "region_count": 2,
    
    // Connection probability for random connectivity
    "connection_probability": 0.1,
    
    // Plasticity settings
    "stdp_ltp_weight": 0.01,
    "stdp_ltd_weight": 0.012,
    "stdp_tau": 20.0,
    
    // Development settings
    "synaptogenesis_rate": 0.001,
    "pruning_rate": 0.0001,
    
    // Neuromodulation settings
    "dopamine_scale": 1.0,
    "curiosity_enable": true,
    "novelty_enable": true,
    
    // Reward prediction error settings
    "prediction_error_sensitivity": 1.0,
    
    // Reward settings
    "reward_discount_factor": 0.99,
    
    // Environment settings
    "environment_name": "GridWorld",
    "environment_width": 10,
    "environment_height": 10,
    "vision_width": 8,
    "vision_height": 8,
    
    // Memory system settings
    "working_memory_capacity": 100,
    "episodic_memory_max_episodes": 1000,
    "associative_memory_pattern_limit": 10000,
    
    // Cognitive settings
    "planning_depth": 5,
    "attention_inhibition_strength": 0.5,
    "attention_excitation_strength": 1.5,
    
    // Logging settings
    "log_level": "INFO",
    "log_to_file": false,
    "log_filename": "nlm.log",
    
    // Simulation settings
    "max_simulation_steps": 10000,
    "simulation_time_limit": 0.0,
    
    // Visualization settings
    "visualization_enabled": false,
    "visualization_update_rate": 30.0,
    
    // Checkpoint settings
    "checkpoint_dir": "./checkpoints",
    "checkpoint_interval": 1000,
    "checkpoint_compress": true,
    
    // Integration settings (Phase 6 specific)
    "replay_interval": 100,
    "consolidation_interval": 1000,
    "development_update_interval": 1000,
    
    // System integration
    "integrate_memory_systems": true,
    "integrate_prediction_system": true,
    "integrate_cognition_systems": true,
    "integrate_neuromodulation": true,
    "integrate_development": true
}