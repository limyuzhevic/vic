# Default configuration for basic testing
# Suitable for quick validation and development

brain.neuron_count = 500
brain.region_count = 1
brain.connection_probability = 0.15
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1

# Neuron parameters
brain.neurons.v_thresh = -50.0      # Neuron threshold potential (mV)
brain.neurons.v_rest = -70.0        # Resting potential (mV)
brain.neurons.v_reset = -75.0       # Reset potential after spike (mV)
brain.neurons.tau_mem = 20.0        # Membrane time constant (ms)
brain.neurons.tau_ref = 2.0         # Refractory period (ms)

# STDP plasticity
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian plasticity
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation
neuromodulation.dopamine.scale = 1.0
neuromodulation.curiosity.enable = true
neuromodulation.novelty.enable = true

# Simulation
simulation.timestep = 0.001      # Simulation timestep (s)

# Logging
logging.level = "info"
logging.file = "nlm.log"
logging.max_file_size = 10485760  # 10MB