# NLM Configuration File
# This is the default configuration for NLM (Neural Learning Machine)
# Supports both key=value format and JSON format

# Basic Configuration
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Initial synaptic weight settings
initial_weight_mean = 0.5
initial_weight_std = 0.1

# Neuron biophysical parameters
v_thresh = -50.0  # Threshold potential (mV)
v_rest = -70.0   # Resting potential (mV)
v_reset = -75.0  # Reset potential after spike (mV)
tau_mem = 20.0   # Membrane time constant (ms)
tau_ref = 2.0    # Refractory period (ms)

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
hebbian_learning_rate = 0.001
structural_synaptogenesis_rate = 0.0001
structural_pruning_rate = 0.00001

# Development settings
# Note: Development parameters moved to plasticity section for Phase 2+
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# World and vision parameters
world_width = 20
world_height = 20
vision_width = 8
vision_height = 8

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Experimental parameters
experiment_name = default_experiment
experiment_reproducibility = 42
