# Phase 6 Configuration
# This configuration file provides advanced settings for the complete NLM Phase 6 integration
# Optimized for balanced performance and realistic neural dynamics

# Core Simulation Settings
random_seed = 42                                    # Random seed for reproducible experiments
simulation_timestep = 0.001                       # Simulation timestep in seconds
neuron_count = 1000                               # Number of neurons in the brain
region_count = 2                                   # Number of brain regions
connection_probability = 0.15                      # Probability of connection between neurons

# Neural Dynamics Configuration (Phase 2)
# Leaky Integrate-and-Fire neuron parameters
v_thresh = -50.0                                  # Neuron threshold potential (mV)
v_rest = -70.0                                    # Resting potential (mV) 
v_reset = -75.0                                   # Reset potential after spike (mV)
tau_mem = 20.0                                    # Membrane time constant (ms)
tau_ref = 2.0                                     # Refractory period (ms)

# Synaptic Transmission
v_init = -70.0                                    # Initial membrane potential (mV)
v_leak = -70.0                                    # Leak equilibrium potential (mV)
C_m = 1.0                                         # Membrane capacitance (nF)
g_L = 10.0                                        # Leak conductance (nS)

# Plasticity Mechanisms
plasticity_learning_rate = 0.01                    # General learning rate
stdp_ltp_weight = 0.02                            # STDP long-term potentiation weight
stdp_ltd_weight = 0.015                           # STDP long-term depression weight
stdp_time_constant = 20.0                         # STDP time constant (ms)

# Development System Parameters
development_synaptogenesis_rate = 0.001           # Rate of new synapse formation
development_pruning_rate = 0.0001                # Rate of synapse elimination
development_critical_period = 100.0               # Critical period duration (simulation steps)

# Neuromodulation
# Neuromodulation target neuron populations
target_excitatory = true                          # Enable neuromodulation of excitatory neurons
target_inhibitory = true                          # Enable neuromodulation of inhibitory neurons
target_modulatory = true                          # Enable neuromodulation of modulatory neurons

# Reward system configuration
reward_scale = 1.0                                # Reward magnitude scaling factor
reward_discount_factor = 0.99                      # Reward discount factor (temporal discounting)

# Environment Configuration
environment_name = GridWorld                      # Environment simulation type
environment_width = 10                            # World width (cells)
environment_height = 10                           # World height (cells)
environment_time_limit = 0.0                      # Time limit for environment (seconds)

# Logging Configuration
log_level = INFO                                   # Log verbosity level
log_to_file = false                                # Enable file logging
log_filename = nlm.log                             # Log file name
log_rotation_size = 10485760                       # Log file rotation size (10MB)
log_max_files = 5                                  # Maximum log files to keep

# Simulation Control
max_simulation_steps = 10000                      # Maximum number of simulation steps
simulation_time_limit = 0.0                        # Absolute time limit (seconds)
warm_up_steps = 100                                # Steps for network stabilization
record_interval = 10                               # Steps between data recording

# Memory Systems Configuration
# Working memory (short-term, active information)
working_memory_capacity = 100                      # Maximum number of active patterns
working_memory_decay_rate = 0.95                   # Decay rate for working memory

# Episodic memory (long-term, experience-based)
episodic_memory_capacity = 1000                    # Maximum number of stored episodes
episodic_memory_replay_rate = 0.1                 # Frequency of memory replay
episodic_memory_relevance_threshold = 0.5        # Threshold for memory relevance

# Associative memory (pattern relationships)
associative_memory_enabled = true                  # Enable associative memory system
associative_memory_pattern_count = 50              # Number of patterns in associative memory
associative_memory_similarity_threshold = 0.7     # Threshold for pattern similarity

# Prediction System Configuration
prediction_enabled = true                          # Enable predictive coding
prediction_horizon = 10                           # Number of steps ahead to predict
prediction_confidence_threshold = 0.5             # Minimum confidence for prediction
prediction_error_scale = 1.0                       # Scaling factor for prediction errors

# Cognitive Systems Configuration
# Neural planning
cognition_enabled = true                           # Enable cognitive functions
planning_enabled = true                            # Enable action planning
planning_horizon = 20                             # Planning depth (steps)
planning_cost_function = "energy"                  # Cost function for planning

# Concept formation
concept_formation_enabled = true                   # Enable concept learning
concept_min_samples = 10                           # Minimum samples for concept formation
concept_similarity_threshold = 0.8                 # Concept similarity threshold

# Attentional selection
attentional_selection_enabled = true               # Enable attentional mechanisms
attention_span = 50                               # Focus span (neurons)
attention_threshold = 0.3                         # Attention threshold

# Neuromodulation Configuration
# Dopamine system
dopamine_baseline = 0.1                           # Baseline dopamine level
dopamine_sensitivity = 1.0                        # Dopamine sensitivity
dopamine_time_constant = 100.0                     # Dopamine dynamics time constant

# Curiosity system
curiosity_enabled = true                           # Enable curiosity-driven exploration
curiosity_scale = 1.0                              # Curiosity modulation strength
curiosity_time_constant = 50.0                     # Curiosity dynamics time constant

# Novelty detection
novelty_enabled = true                             # Enable novelty detection
novelty_threshold = 0.5                            # Novelty detection threshold
novelty_time_constant = 20.0                       # Novelty dynamics time constant

# Prediction error signal
prediction_error_enabled = true                    # Enable prediction error computation
prediction_error_scale = 1.0                       # Prediction error scaling factor
prediction_error_time_constant = 10.0             # Prediction error dynamics

# Development System Configuration
development_enabled = true                          # Enable developmental processes
development_maturation_enabled = true              # Enable brain maturation
development_maturation_rate = 0.01                 # Rate of developmental maturation
development_plasticity_decay = 0.99              # Plasticity decay with development

# Performance Optimization
# Memory management
performance_monitoring_enabled = true             # Enable performance monitoring
memory_pools_enabled = true                        # Enable memory pools for efficiency
event_queue_enabled = true                         # Enable event-driven architecture
sparse_connectivity_enabled = true                 # Enable sparse connectivity
simd_vectorization_enabled = true                 # Enable SIMD optimizations
parallel_processing_enabled = true                # Enable parallel processing

# Checkpointing and Persistence
checkpoint_enabled = true                           # Enable checkpoint saving
checkpoint_interval = 1000                        # Checkpoint save interval (steps)
checkpoint_compression_enabled = false             # Enable checkpoint compression
checkpoint_encryption_enabled = false              # Enable checkpoint encryption
replay_enabled = true                              # Enable memory replay
replay_buffer_size = 100                           # Replay buffer capacity
replay_frequency = 0.1                             # Memory replay frequency

# Visualization Configuration
visualization_enabled = false                       # Enable real-time visualization
visualization_update_rate = 30.0                  # Visualization update frequency (Hz)
visualization_max_neurons = 1000                   # Maximum neurons to display
visualization_frame_skip = 2                       # Skip visualization frames

# Advanced Learning Parameters
# Hebbian learning
hebbian_learning_enabled = true                     # Enable Hebbian learning
hebbian_associator_strength = 0.1                   # Hebbian associator strength

# Reward-modulated learning
reward_modulated_enabled = true                     # Enable reward-modulated learning
reward_modulated_decay_rate = 0.95                 # Reward-modulated learning decay

# homeostatic plasticity
homeostatic_enabled = true                         # Enable homeostatic plasticity
homeostatic_target_rate = 0.1                      # Target firing rate for homeostasis
homeostatic_strength = 0.01                        # Homeostatic plasticity strength

# Experimental Parameters
# Behavioral testing
testing_mode = false                              # Enable testing mode
test_excitatory_ratio = 0.8                        # Ratio of excitatory to inhibitory neurons
test_connectivity_pattern = "random"              # Test connectivity pattern (random, clustered, modular)

# Stochasticity
noise_level = 0.01                                 # Simulation noise level
synapse_jiant_variance = 0.1                        # Synapse weight initialization variance
neuron_param_variance = 0.05                       # Neuron parameter initialization variance
