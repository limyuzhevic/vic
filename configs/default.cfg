# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation
# Supports both simple key=value format and JSON format

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 2 default)
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings (Phase 2)
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced NLM Phase 2 Configuration Options

# Replay and consolidation settings for episodic memory
replay_interval = 100
consolidation_interval = 1000
consolidation_threshold = 0.3

# Attention and cognition settings
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_decay_rate = 0.95
planning_depth = 5
concept_formation_threshold = 0.7

# Development system settings
developmental_stage = CriticalPeriod
maturation_rate = 0.01
plasticity_decay_rate = 0.95

# Neuromodulation settings
dopamine_plasticity_factor = 1.0
curiosity_exploration_rate = 0.5
novelty_threshold = 0.1
prediction_error_decay = 0.99

# Memory system settings
working_memory_capacity = 50
episodic_memory_max_episodes = 1000
associative_memory_decay = 0.9

# Spike system settings
spike_system_max_delay = 100
spike_system_reuse_threshold = 0.1

# Checkpoint and persistence settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = true
checkpoint_format = binary
