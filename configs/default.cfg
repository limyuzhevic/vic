# NLM Configuration File
# This is the default configuration for Phase 1 skeleton
# Format: Supports both legacy key=value and JSON formats

# Legacy format support (maintained for backward compatibility)
# JSON format is available in enhanced_default.cfg

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Additional configuration sections (enhanced)
# These can also be stored in JSON format in enhanced_default.cfg

# Development stage configuration
# development_stage = 1
development_stage = 1

# Memory system configuration
memory_capacity = 1000
memory_retention_rate = 0.99
working_memory_size = 100

# Neuromodulation weights
curiosity_weight = 0.5
reward_weight = 0.3
prediction_error_weight = 0.2

# Checkpoint configuration
checkpoint_interval = 1000
auto_save = false
checkpoint_directory = checkpoints

# Error handling configuration
error_recovery_enabled = true
error_recovery_attempts = 3
error_recovery_threshold = 0.95

# Performance optimization configuration
performance_optimization_enabled = false
optimization_strategy = basic
optimization_parameters = 0

# Validation and verification configuration
validation_enabled = true
verification_enabled = true

# Debug and testing configuration
debug_mode_enabled = false
testing_mode_enabled = false
error_injection_type = none
error_injection_rate = 0.0

# Plasticity mode configuration
plasticity_mode = mixed