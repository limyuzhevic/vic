# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.ltp_weight = 0.01
plasticity.stdp.ltd_weight = 0.012
plasticity.stdp.time_constant = 20.0
plasticity.hebbian.learning_rate = 0.01
plasticity.structural.synaptogenesis_rate = 0.001
plasticity.structural.pruning_rate = 0.0001

# Development settings
development.synaptogenesis_rate = 0.001
development.pruning_rate = 0.0001
development.critical_period_end = 100

# Neuromodulation settings
neuromod.dopamine.baseline = 0.1
neuromod.curiosity.enabled = true
neuromod.curiosity.weight = 0.5
neuromod.novelty.enabled = true
neuromod.novelty.weight = 0.5

# Reward settings
reward.discount_factor = 0.99
reward.alternating_reward = true

# Environment settings
environment.name = GridWorld
environment.width = 10
environment.height = 10
environment.max_energy = 100
environment.energy_decay_rate = 0.1

# Logging settings
log.level = INFO
log.to_file = false
log.filename = nlm.log
log.max_file_size = 10485760  # 10MB

# Simulation settings
max_simulation_steps = 10000
simulation.time_limit = 0.0
checkpoint.enabled = true
checkpoint.directory = ./checkpoints

# Visualization settings
visualization.enabled = false
visualization.update_rate = 30.0
visualization.max_objects = 1000

# Memory settings
memory.working.capacity = 1000
memory.episodic.capacity = 500
memory.associative.capacity = 1000

# Prediction settings
prediction.enabled = true
prediction.horizon = 10
prediction.accuracy_threshold = 0.8

# Cognitive settings
cognition.planner.enabled = true
cognition.attention.enabled = true
cognition.concept_formation.enabled = true
