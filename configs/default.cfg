# NLM Configuration File
# Default configuration for NLM Phase 6

# Simulation parameters
simulation_timestep = 0.001
max_steps = 10000

# Brain parameters
neuron_count = 1000
region_count = 1
connection_probability = 0.1
random_seed = 42

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory parameters
working_memory_capacity = 1000
working_memory_decay = 0.1
episodic_memory_max_episodes = 1000
episodic_memory_consolidation_threshold = 0.5
associative_memory_learning_rate = 0.1

# Prediction system
prediction_horizon = 100
prediction_accuracy = 0.8

# Cognition systems
planning_depth = 5
planning_confidence = 0.5
concept_stability = 0.7
attention_inhibition = 0.5
attention_excitation = 1.5
attention_threshold = 0.3

# Neuromodulation systems
dopamine_baseline = 0.1
dopamine_peak = 1.0
curiosity_rate = 0.2
curiosity_threshold = 0.3
novelty_sensitivity = 0.8
prediction_error_scaling = 0.5

# Development parameters
development_stage = Adult

# Checkpoint parameters
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = true