# NLM Configuration File
# Phase 6: Final Integration Configuration
# This enhanced configuration includes Phase 6 specific settings

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 6 precision)
simulation_timestep = 0.001

# Number of neurons in the brain (higher for Phase 6 experiments)
neuron_count = 2000

# Number of brain regions (multiple regions for Phase 6 integration)
region_count = 3

# Connection probability for random connectivity (optimized for Phase 6)
connection_probability = 0.12

# Plasticity settings (enhanced for Phase 6 learning)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.018
stdp_time_constant = 20.0

# Development settings (Phase 6 specific)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_critical_period_duration = 500.0
development_maturation_rate = 0.1

# Neuromodulation settings (Phase 6 enhanced)
dopamine_baseline = 0.1
dopamine_plasticity_factor = 0.5
dopamine_excitability_factor = 0.3
curiosity_baseline = 0.3
curiosity_exploration_factor = 0.7
novelty_threshold = 0.2
novelty_sensitivity = 0.5
prediction_error_threshold = 0.1

# Reward settings (Phase 6 with better temporal discounting)
reward_discount_factor = 0.999
reward_sensitivity = 0.8

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Working memory settings (Phase 6 neural implementation)
working_memory_capacity = 500
working_memory_decay_rate = 0.01
working_memory_rehearsal_interval = 10
working_memory_competition_strength = 0.8

# Episodic memory settings (Phase 6 neural implementation)
episodic_memory_max_episodes = 2000
episodic_memory_decay_rate = 0.001
episodic_memory_replay_enabled = true
episodic_memory_replay_interval = 100
episodic_memory_consolidation_interval = 1000

# Prediction system settings (Phase 6 forward models)
prediction_system_enabled = true
prediction_horizon = 5
prediction_update_rate = 0.3
prediction_forgetting_rate = 0.01

# Cognitive system settings (Phase 6 planning and attention)
neural_planner_enabled = true
neural_planner_depth = 5
neural_planner_confidence_threshold = 0.6
concept_formation_enabled = true
concept_formation_threshold = 0.7
attentional_selection_enabled = true
attentional_inhibition_strength = 0.5
attentional_excitation_strength = 1.5

# Development stage settings
 developmental_stage = "CriticalPeriod"
development_plasticity_modifier = 1.0
development_experience_decay = 0.99

# Sleep/rest cycle settings (Phase 6 consolidation)
sleep_cycle_enabled = true
sleep_duration = 500
sleep_consolidation_threshold = 0.3
sleep_replay_intensity = 0.8

# Persistence and checkpointing (Phase 6 enhanced)
checkpoint_enabled = true
checkpoint_interval = 5000
checkpoint_dir = ./nlm_checkpoints
checkpoint_compression = Balanced
checkpoint_format_version = 2

# Logging settings (Phase 6 enhanced)
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log
log_timestamp = true
log_detailed_plasticity = true
log_memory_stats = true
log_prediction_stats = true

# Visualization settings (Phase 6 enhanced)
visualization_enabled = true
visualization_update_rate = 30.0
visualization_neurons = true
visualization_synapses = true
visualization_memory_traces = true
visualization_plasticity = true
visualization_predictions = true

# Experiment settings
max_simulation_steps = 20000
simulation_time_limit = 0.0

# Advanced user features
experimental_mode = false
performance_profiling = false
debug_mode = false