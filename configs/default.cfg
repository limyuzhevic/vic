# NLM Default Configuration
# Phase 2: Real Neural Computation

# Random seed for reproducible results
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions (separate subnetworks)
region_count = 1

# Probability that a synapse is created between connected neurons (0.0 to 1.0)
connection_probability = 0.15

# STDP (Spike-Timing-Dependent Plasticity) parameters
stdp_ltp_weight = 0.02  # Long-Term Potentiation weight
stdp_ltd_weight = 0.015 # Long-Term Depression weight
stdp_tau = 20.0        # STDP decay time constant (ms)

# Structural plasticity parameters
synaptogenesis_rate = 0.0001  # Rate of new synapse formation
pruning_rate = 0.00001       # Rate of synapse elimination

# Working memory capacity (number of active traces)
working_memory_capacity = 50

# Episodic memory maximum episodes
episodic_memory_capacity = 1000

# Neuromodulation levels
dopamine_level = 1.0     # Reward modulation strength
curiosity_level = 0.5   # Exploration motivation
novelty_threshold = 0.5 # Detection threshold for novel events

# Development parameters
development_stage = 0    # 0=Initial, 1=CriticalPeriod, 2=Maturation, 3=Adult
plasticity_decay = 0.1   # Rate of plasticity decay with development

# I/O and sensory parameters
sensory_neuron_count = 50    # Number of input neurons
motor_neuron_count = 50     # Number of output neurons
max_sensory_input = 10.0    # Maximum input current (mV)

# Simulation and logging
simulation_steps = 1000
log_level = "INFO"
checkpoint_interval = 100
enable_checkpointing = true
checkpoint_path = "./nlm_checkpoint.bin"

# Experimental parameters
test_repetitions = 5
noise_level = 0.01
reward_scale = 1.0