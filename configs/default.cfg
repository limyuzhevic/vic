# NLM Configuration File
# Enhanced configuration with validation and metadata

# Configuration version
nlm_version = "2.0"

# Basic brain parameters
brain_region_count = 1
brain_neuron_count = 500  # Default for Phase 2 tests (reduced for performance)

# Neural dynamics
simulation_timestep = 0.001
simulation_duration = 10.0  # seconds
random_seed = 42

# Connectivity
connection_probability = 0.15
max_synapses_per_neuron = 50

# Neural parameters
neuron_resting_potential = -70.0
neuron_threshold_potential = -55.0
neuron_reset_potential = -70.0
neuron_time_constant = 20.0
neuron_membrane_capacitance = 1.0

# Plasticity
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
hebbian_learning_rate = 0.01
structural_plasticity_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation
dopamine_baseline = 0.1
dopamine_modulation_strength = 1.0
curiosity_baseline = 0.05
reward_prediction_error_scale = 0.1

# Memory systems
working_memory_capacity = 100
episodic_memory_duration = 1000
associative_memory_patterns = 50

# Development
developmental_stage = 1
development_plasticity_boost = 2.0
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Environment
environment_type = "SimpleWorld"
environment_width = 20
environment_height = 20
sensory_resolution = 8

# Simulation control
enable_plasticity = true
enable_structural_plasticity = true
enable_development = true
enable_replay = true
enable_checkpointing = true
replay_interval = 100
consolidation_interval = 1000

# Logging
log_level = "INFO"
log_to_file = false
log_filename = "nlm_simulation.log"
console_output = true
summary_interval = 100

# Performance
enable_optimizations = true
use_event_queue = true
enable_parallelization = false
simd_optimization = true
memory_pool_enabled = true

# Visualization
visualization_enabled = false
visualization_update_rate = 30.0
visualize_neurons = true
visualize_synapses = true
visualize_activity = true
visualize_weights = true
