# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (Phase 6 enhanced)
dopamine_baseline = 0.1
neurotransmitter_modulation = 1.0
novelty_threshold = 0.3
curiosity_rate = 0.05

# Reward settings
reward_discount_factor = 0.99
exploration_bonus = 0.1

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_phase6_integration.log
log_rotation = 10485760  # 10MB

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings (Phase 6)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output_path = ./visualization_data/

# Phase 6 integration specific settings
enable_checkpointing = true
checkpoint_path = ./checkpoint_phase6.bin
checkpoint_interval = 1000

enable_replay = true
replay_episodes = 100
replay_decay = 0.9

enable_development = true
development_critical_period = 1000
development_maturation_rate = 0.01

# Memory system parameters
working_memory_capacity = 50
episodic_memory_capacity = 1000
episodic_memory_decay = 0.99

# Prediction system parameters
prediction_horizon = 10
prediction_error_threshold = 0.1
prediction_confidence_threshold = 0.8

# Cognitive system parameters
concept_formation_threshold = 0.5
planning_depth = 3
attention_focus_window = 20
