# NLM Configuration File
# This is the default configuration for Phase 6 integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.005  # Reduced from 0.01 for more selective learning
stdp_ltp_weight = 0.005  # Reduced from 0.01
stdp_ltd_weight = 0.006  # Reduced from 0.012
stdp_time_constant = 10.0  # Reduced from 20.0 for more selective learning

# Development settings
development_synaptogenesis_rate = 0.0001  # Reduced from 0.001
development_pruning_rate = 0.00001  # Reduced from 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Activity regulation settings
activity_threshold = 50.0  # Max firing rate before scaling down input
max_input_scaling = 0.1  # Minimum input scaling factor
stdp_time_window = 10.0  # STDP time window in ms (for Hebbian)
hebbian_time_window = 0.05  # Hebbian time window in seconds (50ms)
structural_plasticity_rate = 0.00005  # Reduced from 0.00001
structural_pruning_rate = 0.00005  # Increased from 0.000001
min_synapse_weight = 0.1  # Higher minimum weight threshold

# Memory system settings
working_memory_capacity = 200
episodic_memory_max_episodes = 1000
associative_memory_pattern_threshold = 0.7

# Advanced visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_resolution = 1024x768
enable_activity_heatmaps = true
enable_synapse_activity = true

# Debugging and monitoring settings
debug_mode = false
enable_step_logging = true
enable_spike_logging = false
enable_memory_logging = true
performance_monitoring = true
checkpoint_interval = 1000
max_checkpoints = 10
