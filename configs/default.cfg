# NLM Configuration File
# This is the default configuration for Phase 6 integration
# All parameters are optimized for the integration experiment

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (scaled down for Phase 6)
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.0
reward_discount_factor = 0.99

# Reward settings
reward_learning_rate = 0.01
reward_exploration_bonus = 0.1

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_save_memory = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Memory settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000

# Prediction settings
prediction_update_rate = 0.1
prediction_confidence_threshold = 0.5

# Development settings
development_enabled = true
development_stage_duration = 300.0  # 5 minutes per stage

# Neuromodulation settings
curiosity_enabled = true
novelty_threshold = 0.1
