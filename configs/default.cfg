# NLM Configuration File
# Phase 6: FINAL INTEGRATION - Complete artificial brain with all systems integrated

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (for 1ms resolution: 0.001)
simulation_timestep = 0.001

# Number of neurons in the brain (balanced for performance)
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# ===== MEMORY SYSTEMS =====
memory_working_capacity = 100
memory_episodic_capacity = 100
memory_associative_capacity = 100
memory_replay_interval = 100

# ===== PLASTICITY SYSTEMS =====
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_tau_plus = 20.0
stdp_tau_minus = 20.0
plasticity_structural_enable = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
plastic_update_frequency = 1

# ===== DEVELOPMENT SYSTEM =====
development_enable = true
initial_plasticity_rate = 1.0
maturation_time_constant = 100.0
critical_period_duration = 1000
development_stage = "adult"

# ===== NEUROMODULATION SYSTEMS =====
neuromod_dopamine_baseline = 0.1
neuromod_dopamine_scale = 1.0
neuromod_curiosity_enable = true
neuromod_novelty_enable = true
neuromod_curiosity_threshold = 0.05
neuromod_novelty_threshold = 0.1
neuromod_neural_dopamine_sensitivity = 0.8

# ===== PREDICTION SYSTEM =====
prediction_enable = true
prediction_time_constant = 50.0
prediction_update_frequency = 5
prediction_confidence_threshold = 0.7
prediction_error_decay = 0.95

# ===== COGNITION SYSTEMS =====
cognition_planner_enable = true
cognition_planner_horizon = 10
cognition_concept_formation_threshold = 0.8
cognition_attention_strength = 0.5
cognition_attention_decay = 0.9

# ===== ENVIRONMENT SYSTEM =====
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_observation_range = 3
environment_max_energy = 100.0
environment_decay_rate = 0.01

# ===== LOGGING SYSTEM =====
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_file_rotation_kb = 1024
log_file_backup_count = 5
log_performance_stats = true
log_memory_stats = true
log_structured_logging = true

# ===== SIMULATION SETTINGS =====
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_frequency = 1000
checkpoint_path = "checkpoints/brain_checkpoint.bin"
enable_replay = true
replay_interval = 100

# ===== VISUALIZATION SYSTEM =====
visualization_enabled = true
visualization_backend = "OpenGL"
visualization_update_rate = 30.0
visualization_window_width = 1280
visualization_window_height = 720
visualization_show_neurons = true
visualization_show_synapses = true
visualization_show_memory = true
visualization_show_plasticity = true

# ===== PERFORMANCE OPTIMIZATIONS =====
performance_use_memory_pools = true
performance_pool_size_neurons = 2000
performance_pool_size_synapses = 50000
performance_event_queue_size = 10000
performance_enable_simd = true
performance_enable_omp = false
performance_lock_free_structures = true

# ===== ADVANCED FEATURES =====
advanced_reward_modulation = true
advanced_reward_scaling = 1.0
advanced_eligibility_trace_decay = 0.9
advanced_curiosity_bonus = 0.1
advanced_novelty_bonus = 0.05
algorithm_mixed_precision = false
algorithm_fp16_computation = false
