# NLM Configuration File
# Phase 6: Final Integration Configuration
# This is the enhanced default configuration for Phase 6 integration

# Basic simulation settings
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.1
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Performance and scaling
threads = 4
enable_vectorization = true
enable_parallel_processing = true

# Memory management
working_memory_capacity = 1000
episodic_memory_capacity = 10000
memory_pool_size = 4096

# Plasticity system
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
structural_plasticity_enabled = true

# Neuromodulation system
dopamine_baseline = 0.1
dopamine_scale = 1.0
curiosity_threshold = 0.3
novelty_decay_rate = 0.99
curiosity_enabled = true
novelty_enabled = true
prediction_error_enabled = true

# Development system
development_enabled = true
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_stage = "CriticalPeriod"
maturation_speed = 1.0

# Cognitive systems
concept_formation_enabled = true
neural_planner_enabled = true
attention_enabled = true
self_model_enabled = true
social_learning_enabled = true

# Memory systems
working_memory_enabled = true
episodic_memory_enabled = true
semantic_memory_enabled = true
procedural_memory_enabled = true
associative_memory_enabled = true

# Prediction system
prediction_enabled = true
confidence_tracking_enabled = true
prediction_error_threshold = 0.5

# Reward and motivation
reward_discount_factor = 0.99
reward_prediction_error_enabled = true
explore_exploit_balance = 0.5

# Environment settings
environment_name = "GridWorld"
environment_width = 20
environment_height = 20
vision_width = 16
vision_height = 16
audio_enabled = false
proprioception_enabled = true

# Logging and debugging
log_level = "INFO"
log_to_file = true
log_filename = "nlm.log"
log_rotation_size = 10485760  # 10MB
verbose_logging = false
debug_mode = false
profile_performance = true

# Checkpointing and persistence
checkpoint_enabled = true
checkpoint_path = "./checkpoints/nlm_checkpoint.bin"
checkpoint_interval = 1000
max_checkpoints = 10
enable_replay = true
replay_buffer_size = 5000

# Visualization
visualization_enabled = false
visualization_update_rate = 30.0
visualization_port = 8080
render_mode = "terminal"

# Advanced features
neurogenesis_enabled = false
custom_plasticity_enabled = true
memory_tracing_enabled = false
performance_profiling_enabled = true
experimental_features_enabled = true

# Safety and limits
max_energy = 100.0
energy_decay_rate = 0.01
health_threshold = 0.1
age_threshold = 1000.0
max_actions_per_step = 10

# Learning parameters
exploration_rate = 0.1
exploitation_rate = 0.9
learning_rate = 0.001
target_return = 1.0
value_function_update_frequency = 100
policy_update_frequency = 50

# Experimental parameters
experimental_condition = "default"
subject_id = "nlm001"
data_collection_enabled = true
anonymize_data = true

# System integration
enable_sensory_integration = true
enable_motor_control = true
enable_action_selection = true
enable_feedback_loop = true

# Output and logging
output_format = "text"
output_file = "simulation_output.txt"
metrics_collection_enabled = true
performance_monitoring_enabled = true

