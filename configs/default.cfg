# Default NLM Configuration File
# Copy this to configs/my_config.cfg and modify values as needed

# ==============================================================================
# NEURAL NETWORK CONFIGURATION
# ==============================================================================

# neuron_count: Total number of neurons in the network (default: 500)
# For larger networks: 1000-10000 neurons
# For very large networks: 10000+ neurons (requires optimization)
neuron_count = 1000

# region_count: Number of brain regions/organizations (default: 1)
# Multiple regions enable specialized processing:
# 1 = single homogeneous region
# 2-4 = moderate specialization
# 5-8 = high specialization
region_count = 4

# connection_probability: Probability of synaptic connection between neurons (default: 0.15)
# 0.05 = sparse connections (5% of possible synapses)
# 0.15 = moderate connections (15% of possible synapses)  
# 0.30 = dense connections (30% of possible synapses)
connection_probability = 0.2

# ==============================================================================
# SPATIAL CONFIGURATION
# ==============================================================================

# x_dimension: Width of 2D brain space (default: 1)
# Neurons positioned in 2D grid for spatial locality
x_dimension = 32

# y_dimension: Height of 2D brain space (default: 1)
# Neurons positioned in 2D grid for spatial locality
y_dimension = 32

# synapse_distance_range: Max distance for synaptic connections
# Neurons outside this range cannot connect directly
# Smaller = more local connectivity, Larger = more global
 synapse_distance_range = 20

# ==============================================================================
# PLASTICITY PARAMETERS
# ==============================================================================

# stdp_ltp_weight: STDP long-term potentiation weight (default: 0.02)
# Strength of synaptic strengthening when pre fires before post
stdp_ltp_weight = 0.015

# stdp_ltd_weight: STDP long-term depression weight (default: 0.015)
# Strength of synaptic weakening when post fires before pre
stdp_ltd_weight = 0.018

# stdp_tau: STDP time constant in ms (default: 20.0)
# Controls decay of STDP effect with time difference
stdp_tau = 20.0

# stdp_lr: Learning rate for STDP (default: 0.001)
stdp_lr = 0.001

# hebbian_learning_rate: Hebbian learning rate (default: 0.01)
hebbian_learning_rate = 0.008

# synaptogenesis_rate: Rate of new synapse formation (default: 0.0001)
# Probability of creating new connections per timestep per neuron
synaptogenesis_rate = 0.0002

# pruning_rate: Rate of synapse elimination (default: 0.00001)
# Probability of removing existing connections per timestep per neuron
pruning_rate = 0.00005

# ==============================================================================
# DEVELOPMENT PARAMETERS
# ==============================================================================

# enable_development: Enable age-dependent plasticity (default: true)
# False = static synaptic weights after initialization
enable_development = true

# developmental_plasticity_decay: Rate of plasticity decrease with age (default: 0.001)
# Younger neurons learn faster than older ones
developmental_plasticity_decay = 0.0008

# maturation_threshold: Age when neurons mature (default: 100)
# Neurons may have different thresholds based on type
maturation_threshold = 150

# ==============================================================================
# SIMULATION PARAMETERS
# ==============================================================================

# simulation_timestep: Simulation timestep in seconds (default: 0.001)
# Smaller timesteps = more accurate but slower simulation
simulation_timestep = 0.0005

# max_steps: Total simulation steps to run (default: 1000)
# Controls experiment duration
max_steps = 5000

# random_seed: Random number generator seed (default: 42)
# Set to specific value for reproducible experiments
random_seed = 12345

# ==============================================================================
# NEUROMODULATION PARAMETERS
# ==============================================================================

# enable_reward_modulation: Enable dopamine reward signals (default: true)
enable_reward_modulation = true

# reward_scale: Scaling factor for reward signals (default: 1.0)
reward_scale = 1.5

# curiosity_weight: Strength of curiosity-driven exploration (default: 0.5)
curiosity_weight = 0.7

# novelty_threshold: Detection threshold for novelty (default: 0.1)
# Higher values = more conservative novelty detection
novelty_threshold = 0.08

# ==============================================================================
# MEMORY PARAMETERS
# ==============================================================================

# enable_working_memory: Enable working memory traces (default: true)
enable_working_memory = true

# working_memory_capacity: Number of active traces (default: 50)
working_memory_capacity = 100

# enable_episodic_memory: Enable episodic memory storage (default: true)
enable_episodic_memory = true

# episodic_memory_capacity: Number of episodes to store (default: 100)
episodic_memory_capacity = 200

# replay_frequency: How often to replay memories (default: 1000 steps)
replay_frequency = 500

# ==============================================================================
# PERFORMANCE PARAMETERS
# ==============================================================================

# enable_checkpointing: Enable checkpoint save/load (default: true)
enable_checkpointing = true

# checkpoint_frequency: How often to save checkpoints (default: 1000 steps)
checkpoint_frequency = 1000

# checkpoint_path: File path for checkpoints (default: ./nlm_checkpoint.bin)
checkpoint_path = "./nlm_checkpoint.bin"

# enable_replay: Enable memory replay during rest (default: true)
enable_replay = true

# ==============================================================================
# LOGGING AND DEBUGGING
# ==============================================================================

# log_level: Logging verbosity (default: "INFO")
# Options: "ERROR", "WARN", "INFO", "DEBUG", "TRACE"
log_level = "INFO"

# verbose: Enable verbose output (default: false)
verbose = true

# enable_profiling: Enable performance profiling (default: false)
# Requires additional libraries and increases build time
enable_profiling = false

# ==============================================================================
# EXPERIMENT-SPECIFIC PARAMETERS
# ==============================================================================

# experiment_type: Type of experiment to run (default: "learning")
# Options: "learning", "plasticity", "cd", "social", "integration"
experiment_type = "integration"

# target_performance: Performance target for optimization (default: 0.8)
# Scale of 0.0 (poor) to 1.0 (excellent)
target_performance = 0.9

# ==============================================================================
# NEURAL DYNAMICS PARAMETERS
# ==============================================================================

# membrane_capacitance: Neuron membrane capacitance (default: 1.0)
membrane_capacitance = 1.2

# membrane_time_constant: Membrane time constant (default: 20.0)
membrane_time_constant = 18.0

# leak_conductance: Membrane leak conductance (default: 10.0)
leak_conductance = 12.0

# threshold_voltage: Spike threshold (default: -55.0)
threshold_voltage = -50.0

# reset_voltage: Post-spike reset voltage (default: -70.0)
reset_voltage = -65.0

# refractory_period: Absolute refractory period (default: 5)
# Number of timesteps neuron cannot fire after spike
refractory_period = 8

# adaptation_strength: Spike-frequency adaptation strength (default: 0.1)
adaptation_strength = 0.15

# ==============================================================================
# SENSORY AND MOTOR PARAMETERS
# ==============================================================================

# sensory_input_range: Range of sensory input values (default: 10.0)
sensory_input_range = 15.0

# motor_output_range: Range of motor output values (default: 10.0)
motor_output_range = 12.0

# ==============================================================================
# PREDICTION AND COGNITION PARAMETERS
# ==============================================================================

# prediction_horizon: Time horizon for predictions (default: 100)
prediction_horizon = 150

# prediction_error_threshold: Threshold for prediction error (default: 0.1)
prediction_error_threshold = 0.08

# concept_formation_threshold: Threshold for concept formation (default: 0.5)
concept_formation_threshold = 0.4

# planning_horizon: Lookahead for planning (default: 50)
planning_horizon = 75

# ==============================================================================
# ENVIRONMENT PARAMETERS
# ==============================================================================

# environment_size: Size of simulated environment (default: 10)
environment_size = 16

# reward_function: Type of reward function (default: "sparse")
# Options: "sparse", "dense", "shaped", "curiosity"
reward_function = "curiosity"

# novelty_bonus: Bonus for novel experiences (default: 2.0)
novelty_bonus = 2.5

# curiosity_bonus: Bonus for exploration (default: 1.0)
curiosity_bonus = 1.5

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================