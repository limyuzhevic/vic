# NLM Configuration File
# Enhanced configuration for Phase 6: Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
dopamine_learning_rate = 0.01
curiosity_baseline = 0.0
curiosity_strength = 0.5
novelty_baseline = 0.0
novelty_threshold = 0.3

# Reward settings
reward_discount_factor = 0.99
reward_baseline = 0.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Working Memory Settings
working_memory_capacity = 100
working_memory_decay_rate = 0.01
working_memory_reinforcement_strength = 2.0

# Prediction System Settings
prediction_enable = true
prediction_training_rate = 0.001
prediction_confidence_threshold = 0.5

# Attention System Settings
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_competition_threshold = 0.3

# Memory Integration Settings
memory_replay_interval = 100
memory_consolidation_interval = 1000
memory_replay_count = 3

# Development Settings
development_initial_age = 0.0
development_maturation_threshold = 1000.0
development_critical_period_duration = 300.0

# Cognitive Integration Settings
cognition_enable_planning = true
cognition_planning_depth = 5
cognition_enable_concept_formation = true
cognition_concept_threshold = 0.5

# Agent Configuration
agent_enable_reward_modulation = true
agent_enable_structural_plasticity = true
agent_enable_development = true
agent_enable_curiosity = true
agent_enable_novelty_detection = true

# Experiment Configuration
experiment_enable_logging = true
experiment_log_interval = 100
experiment_checkpoint_interval = 1000
