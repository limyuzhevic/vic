# NLM Configuration File
# This is the default configuration for Phase 6: Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Development settings
dev_component_synaptogenesis_rate = 0.0001
dev_component_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 Enhanced Configuration

# Memory systems
working_memory_capacity = 50
max_episodic_episodes = 1000
episodic_replay_interval = 100
consolidation_interval = 1000

# Prediction system
prediction_enabled = true
prediction_accuracy = 0.8

# Cognitive systems
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Neuromodulation enhancement
curiosity_level = 0.3
novelty_threshold = 0.05

# Development stage (Initial, CriticalPeriod, Maturation, Adult)
developmental_stage = Initial
developmental_plasticity_mod = 1.0

# Replay and consolidation
replay_every_n_steps = 100
consolidate_every_n_steps = 1000
consolidation_threshold = 0.3

# Checkpoint system
checkpoint_dir = ./checkpoints
checkpoint_max_files = 10
checkpoint_compression = true
