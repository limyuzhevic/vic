# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Advanced Neuromodulation Settings (expert users)
# Dopamine dynamics and receptor sensitivity
dopamine_sensitivity = 1.0
dopamine_receptor_density = 1.0
adaptive_dopamine_decay = true
dopamine_prediction_error_gain = 1.0

# Advanced Plasticity Settings
metaplasticity_enabled = false
homeostatic_plasticity_rate = 0.001
plasticity_history_window = 1000.0
learning_rate_modulation = true
local_network_stabilization = true

# Memory System Advanced Parameters
working_memory_decay_rate = 0.95
working_memory_capacity_boost = 1.0
episodic_memory_compression_rate = 0.1
associative_memory_strength_threshold = 0.5
procedural_memory_consolidation_rate = 0.01

# Prediction System Settings
prediction_horizon = 10.0
prediction_confidence_threshold = 0.7
prediction_error_learning_rate = 0.05
cortical_prediction_gain = 1.0

# Development System Advanced Controls
development_stage_duration_multiplier = 1.0
critical_period_length = 300.0
adult_plasticity_threshold = 0.3
structural_maturation_rate = 0.001

# Performance and Optimization
thread_pool_size = 4
simulation_chunk_size = 100
memory_pool_size_multiplier = 2.0
event_queue_optimization = true
use_vectorization = true
enable_simd = true

# Advanced Logging and Debugging
log_level_detail = "VERBOSE"  # DEBUG, INFO, WARNING, ERROR, CRITICAL, VERBOSE
log_to_memory_buffer = true
log_performance_metrics = true
enable_trace_logging = false
log_file_rotation_size = 10485760  # 10MB

# Experimental Feature Flags
experimental_neural_topology = false
experimental_learning_theories = false
experimental_biological_constraints = false
experimental_social_dynamics = false
experimental_transfer_learning = false
experimental_meta_cognition = false

# Advanced Environment Settings
environment_physics_enabled = false
environment_learning_rate = 0.1
environment_reward_shaping = true
environmental_stochasticity = 0.1

# Checkpoint and Persistence
checkpoint_interval = 1000
checkpoint_compression = true
checkpoint_encryption = false
auto_save_enabled = true
auto_save_interval = 100

# Visualization Advanced Settings
visualization_data_collection = true
visualization_sampling_rate = 30.0
visualization_history_depth = 1000
visualization_export_format = "BINARY"  # TEXT, BINARY, COMPRESSED
visualization_gpu_acceleration = true
