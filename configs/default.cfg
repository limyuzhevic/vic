# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
replay_interval = 100
consolidation_interval = 1000

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_scale = 1.0
curiosity_enable = true
novelty_enable = true
structural_plasticity_enable = true
hebbian_enable = true

# Reward settings
reward_discount_factor = 0.99
reward_temperature = 1.0
max_reward_value = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
terrain_type = "default"
resource_density = 0.3
hazard_density = 0.1

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_quality = "medium"
visualization_show_neurons = true
visualization_show_synapses = true
visualization_show_activity = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
time_step_for_reporting = 100
enable_multithreading = false

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_mb = 100
log_flush_level = "DEBUG"

# Advanced configuration options
enable_checkpointing = true
checkpoint_interval = 1000
enable_logging = true
log_format = "detailed"
