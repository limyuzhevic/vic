# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 2 enhanced settings
neuron_threshold = -55.0f
neuron_leak_conductance = 10.0f
refractory_period = 5

# Working memory settings
working_memory_capacity = 1000
working_memory_decay_rate = 0.95
working_memory_trace_threshold = 0.5f

# Episodic memory settings
max_episodes = 1000
episodic_memory_capacity = 5000

# Prediction system settings
prediction_horizon = 10
prediction_error_threshold = 0.1f

# Development stage settings
initial_plasticity_rate = 1.0f
critical_period_factor = 0.8f
adult_plasticity_rate = 0.2f

# Neuromodulation system settings
dopamine_plasticity_factor = 1.0f
curiosity_threshold = 0.5f
novelty_sensitivity = 0.1f

# Agent brain interface settings
enable_reward_modulation = true
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
enable_social_learning = false

# Performance settings
enable_simd_optimization = true
enable_memory_pools = true
simd_vectorization = true
sparse_connectivity = true
memory_pool_size = 10000

# Checkpoint system settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = balanced
checkpoint_retention = 10

# Advanced plasticity settings
stdp_eligibility_trace = 0.95f
hebbian_learning_rate = 0.01f
reward_modulated_plasticity = true
reward_decay_rate = 0.9f

# Learning system settings
learning_rate = 0.001f
learning_rate_decay = 0.995f
curiosity_update_interval = 10
reward_prediction_interval = 5

# Debug and monitoring settings
debug_mode = false
performance_monitoring = true
neuron_activity_monitoring = true
memory_usage_tracking = true
neural_trace_collection = true

# Environment configuration
environment_update_interval = 0.1f
energy_consumption_rate = 0.01f
hazard_sensitivity = 0.5f
resource_consumption_rate = 0.1f

# Sensory system settings
sensory_neuron_count = 50
vision_sensor_sensitivity = 1.0f
touch_sensor_sensitivity = 0.8f
audio_sensor_sensitivity = 0.6f
internal_sensor_sensitivity = 0.9f

# Motor system settings
motor_neuron_count = 20
action_selection_confidence = 0.7f
action_timeout = 1000.0f
motor_planning_depth = 5

# Attention system settings
attentional_inhibition_strength = 0.5f
attentional_excitation_strength = 1.5f
attentional_update_interval = 20
attentional_focus_threshold = 0.6f

# Concept formation settings
concept_update_interval = 100
concept_forgetting_rate = 0.95f
concept_similarity_threshold = 0.5f
concept_association_strength = 0.8f

# Visualization system settings
visualization_refresh_rate = 30.0f
visualization_window_size = 20.0f
visualization_data_retention = 5.0f
visualization_animation_speed = 1.0f

