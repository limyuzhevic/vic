# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0  # 0.0 = no limit, >0 = time limit in seconds

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Test configuration
basic_connectivity_injection_current = 50.0  # Current injected in basic connectivity test
plasticity_injection_current = 30.0         # Current injected in plasticity experiment
stdp_injection_current = 60.0               # Current injected in STDP experiment

# Plasticity thresholds
weight_change_threshold = 0.01  # Threshold for considering weight change significant
learning_threshold = 0.001      # Threshold for considering learning occurred

# Neuron dynamics parameters
membrane_capacitance = 1.0    # Neuron membrane capacitance (nF)
time_constant = 20.0         # Membrane time constant (ms)
max_membrane_potential = 50.0 # Maximum membrane potential
min_membrane_potential = -100.0 # Minimum membrane potential
adaptation_decay = 0.95       # Adaptation variable decay rate
adaptation_increment = 1.0    # Adaptation variable increment per spike

# Agent brain parameters
vision_scale_factor = 5.0     # Vision signal scaling
touch_scale_factor = 8.0      # Touch signal scaling
internal_scale_factor = 2.0   # Internal signal scaling
proprioception_scale_factor = 3.0 # Proprioception signal scaling

# Neuromodulation parameters
novelty_threshold = 0.01      # Threshold for novelty detection
curiosity_multiplier = 2.0    # Curiosity amplification factor
prediction_error_weight = 0.5 # Weight of prediction error in curiosity

# Development parameters
plasticity_modifier_high = 1.0   # High plasticity modifier (early development)
plasticity_modifier_mid = 0.8    # Medium plasticity modifier (critical period)
plasticity_modifier_low = 0.5    # Low plasticity modifier (maturation)
plasticity_modifier_adult = 0.2  # Adult plasticity modifier

# Structural plasticity
structural_plasticity_enabled = true
development_stage_1_end = 60.0    # End of initial developmental stage
development_stage_2_end = 300.0   # End of critical period
development_stage_3_end = 900.0   # End of maturation period

# Curiosity parameters
curiosity_exploration_threshold = 0.5  # Threshold for curiosity-based exploration
curiosity_exploration_chance = 0.3    # Maximum exploration probability

# Spike processing
max_spike_history = 100        # Maximum spikes to store per neuron
refractory_period_min = 2       # Minimum refractory period (ms)
refractory_period_max = 10      # Maximum refractory period (ms)

# Memory parameters
working_memory_capacity = 100   # Working memory capacity
episodic_memory_capacity = 1000 # Episodic memory capacity

# Prediction parameters
prediction_horizon = 10        # Prediction horizon in time steps
prediction_error_decay = 0.1    # Prediction error decay rate

# Cognitive parameters
attention_competition_strength = 1.0 # Strength of attention competition
planning_evaluation_depth = 3   # Depth of action planning evaluation

# Sensor processing
sensory_input_noise = 0.01     # Noise level in sensory input

# Output decoding
motor_activity_threshold = 0.5 # Threshold for motor command decoding

