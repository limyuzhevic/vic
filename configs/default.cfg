# NLM Configuration File
# This file demonstrates the improved configuration format with JSON-like values

# Basic configuration
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 1
connection_probability = 0.1

# STDP parameters (Phase 2: Real Neural Computation)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity parameters
# Note: This parameter was added in Phase 6 for integration
# to control how often new synapses form through synaptogenesis
# and how often existing synapses are removed through pruning.
# Higher values lead to more frequent structural changes.
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation parameters (Phase 6)
# Dopamine levels affect neural excitability and plasticity
# Curiosity drives exploration behavior
# Novelty detection affects learning rate
# Prediction error signals correct behavioral expectations
# These parameters control the strength and timing of neuromodulatory effects.
dopamine_initial_level = 0.5
curiosity_initial_level = 0.3
novelty_threshold = 0.7
prediction_error_initial = 0.0

# Memory system parameters (Phase 6 Integration)
# Working memory retains recent neural activity for short-term processing
# Episodic memory stores complete experiences for later recall
# Associative memory creates pattern associations
working_memory_capacity = 100
max_episodes = 1000
episodic_memory_window = 50

# Development system parameters (Phase 6)
# Developmental stages affect plasticity rates over time
# Neural excitability changes with development
# Structural plasticity is modulated by age
developmental_stage = "Initial"
plasticity_decay_rate = 0.9
neural_excitability_growth = 1.05

# Prediction system parameters (Phase 6)
# Prediction system anticipates sensory input
# Prediction error signals learning opportunities
# Confidence tracking improves decision making
prediction_accuracy_threshold = 0.8
prediction_update_rate = 0.1
confidence_decay_rate = 0.95

# Cognition system parameters (Phase 6)
# Neural planner evaluates action sequences
# Concept formation discovers patterns from experience
# Attentional selection focuses on relevant information
planning_depth = 5
concept_threshold = 0.7
attention_strength = 0.8

# Environment parameters
# World interface defines how the agent interacts with its environment
# Sensory processing converts environmental input to neural signals
# Motor system translates neural activity into actions
env_width = 100
env_height = 100
sensory_range = 10
action_resolution = 0.01

# Checkpoint and persistence
# Checkpoint system saves brain state for later resumption
# Persistence parameters control how often checkpoints are created
checkpoint_dir = "./checkpoints"
checkpoint_interval = 1000
max_checkpoints = 10
checkpoint_compression = "balanced"

# Performance and optimization (Phase 5)
# Performance optimizations for faster simulation
# Memory pools and event queues reduce overhead
# SIMD vectorization and parallel processing improve speed
enable_performance_optimizations = true
memory_pool_size = 10000
event_queue_capacity = 1000
enable_simd = true
parallel_processing = false

# Logging and debugging
# Logging configuration for debugging and monitoring
# Console logging, file logging, and performance metrics
log_level = "info"
log_file = "nlm.log"
enable_console_logging = true
enable_file_logging = true
log_rotation_mb = 100
log_format = "detailed"

# Reproduction and experiment (Phase 6)
# Reproduction system creates multiple instances for comparison
# Experiment framework runs systematic tests and measurements
reproduction_enabled = false
experiment_mode = "default"
experiment_id = "exp_001"

# Batch processing and automation
# Batch processing runs multiple simulations in parallel
# Automation scripts handle setup, execution, and analysis
batch_size = 10
parallel_batch = true

# Debug and development
# Development-specific configuration for debugging and testing
# Experimental parameters for novel feature testing
enable_debug_mode = false
experimental_features = false
validation_mode = false
simulation_speed_multiplier = 1.0

# Commented out or template configuration examples
# Uncomment and modify as needed

# Example 1: High learning rate configuration
# [learning_config]
# learning_rate = 0.1
