# NLM Configuration File
# Phase 6: Integrated Artificial Brain Configuration
# This configuration file supports real neural computation with:
# - Leaky Integrate-and-Fire (LIF) neurons
# - Event-driven spike propagation with synaptic delays
# - STDP and Hebbian plasticity
# - Structural plasticity (synaptogenesis/pruning)

# Core Brain Parameters
random_seed = 42
  # Seed for reproducible experiments and random initialization

simulation_timestep = 0.001
  # Simulation timestep in seconds (1ms for real-time dynamics)

neuron_count = 500
  # Number of neurons in the brain (smaller for faster demo)

region_count = 1
  # Number of brain regions (Phase 2 focused on single region)

connection_probability = 0.15
  # Probability for random connectivity initialization

# STDP (Spike-Timing-Dependent Plasticity) Parameters
stdp_ltp_weight = 0.02
  # Long-Term Potentiation weight (positive: strengthens synapse)

stdp_ltd_weight = 0.015
  # Long-Term Depression weight (negative: weakens synapse)

stdp_tau = 20.0
  # STDP time constant in milliseconds

# Structural Plasticity Parameters
synaptogenesis_rate = 0.0001
  # Rate of new synapse formation per existing synapse

pruning_rate = 0.00001
  # Rate of synapse elimination per weak synapse

# Memory System Parameters
replay_interval = 100
  # Replay important memories every 100 simulation steps

consolidation_interval = 1000
  # Consolidate and prune memories every 1000 steps

checkpoint_dir = ./checkpoints
  # Directory for brain state checkpoint files

# Neuromodulation Parameters
dopamine_level = 0.0
  # Baseline dopamine level (0.0-1.0)

curiosity_baseline = 0.1
  # Baseline curiosity drive (0.0-1.0)

# Development Parameters
developmental_stage = Initial
  # Development stage: Initial, CriticalPeriod, Maturation, Adult

# Reward and Learning Parameters
reward_discount_factor = 0.99
  # Temporal discount factor for reward prediction

prediction_error_decay = 0.5
  # Decay rate for prediction error signals

# Attention Parameters
attention_inhibition_strength = 0.5
  # Strength of inhibitory competition in attention

attention_excitation_strength = 1.5
  # Strength of excitatory bias in attention

# Concept Formation Parameters
concept_learning_rate = 0.01
  # Learning rate for concept formation

concept_similarity_threshold = 0.7
  # Similarity threshold for concept grouping

# Output and Logging Parameters
log_level = Info
  # Logging level: Debug, Info, Warning, Error, Critical

log_to_file = false
  # Enable file logging for persistent records

log_filename = nlm.log
  # Filename for log file when log_to_file is enabled

checkpoint_save_frequency = 1000
  # Save checkpoint every N steps

checkpoint_max_files = 10
  # Maximum number of checkpoint files to retain

checkpoint_compress = true
  # Compress checkpoint files to save space

# Simulation Control Parameters
max_simulation_steps = 50000
  # Maximum number of simulation steps

simulation_time_limit = 0.0
  # Time limit in seconds (0.0 = unlimited)

# Visualization Parameters
visualization_enabled = false
  # Enable real-time visualization (requires GUI)

visualization_update_rate = 30.0
  # Visualization update rate in Hz

visualization_window_width = 1200
  # Width of visualization window in pixels

visualization_window_height = 800
  # Height of visualization window in pixels

# Experimental Parameters
experiment_seed = 42
  # Seed for experimental reproducibility

enable_working_memory = true
  # Enable working memory system

enable_episodic_memory = true
  # Enable episodic memory system

enable_associative_memory = true
  # Enable associative memory system

enable_prediction_system = true
  # Enable prediction system

enable_planner = true
  # Enable neural planning system

enable_concept_formation = true
  # Enable concept formation system

enable_attention_system = true
  # Enable attention system

enable_neuromodulation = true
  # Enable neuromodulation systems

# Performance Parameters
enable_performance_monitoring = true
  # Enable system performance monitoring

performance_report_interval = 1000
  # Interval for performance reports

# System Limits
max_memory_traces = 10000
  # Maximum working memory traces

max_episodes = 5000
  # Maximum episodic memory episodes

# Neural Parameters
neuron_threshold_default = -55.0
  # Default neuron firing threshold (mV)

neuron_resting_potential_default = -70.0
  # Default neuron resting potential (mV)

neuron_reset_potential_default = -65.0
  # Default neuron reset potential after spike (mV)

neuron_refractory_period_default = 5
  # Default neuron refractory period (ms)

neuron_leak_conductance_default = 0.1
  # Default neuron leak conductance

neuron_membrane_capacitance_default = 1.0
  # Default neuron membrane capacitance (nF)

neuron_adaptation_strength_default = 0.5
  # Default spike-frequency adaptation strength
