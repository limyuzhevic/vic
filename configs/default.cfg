# NLM Configuration File
# This is the default configuration for Phase 6: FINAL INTEGRATION
# All systems are now integrated and functional

# Basic simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
min_weight_threshold = 0.05
activity_threshold = 0.001

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
dopamine_scale = 1.0
curiosity_scale = 1.0
novelty_scale = 1.0
prediction_error_scale = 1.0

# Reward settings
reward_discount_factor = 0.99
reward_scale = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Agent settings
agent_vision_width = 8
agent_vision_height = 8
agent_max_energy = 100.0
agent_start_x = 5.0
agent_start_y = 5.0

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_max_size = 10485760  # 10 MB

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval = 1000

# Visualization settings
visualization_enabled = true
visualization_update_rate = 30.0
visualization_width = 1280
visualization_height = 720
visualization_type = 3d
background_color = #000000
neuron_color = #00FF00
synapse_color = #FFFF00
spike_color = #FF0000

# Performance settings
max_threads = 4
event_queue_size = 65536
memory_pool_size = 1048576
enable_simd = true
enable_openmp = true

# Advanced plasticity settings
hebbian_enable = true
hebbian_learning_rate = 0.01
hebbian_max_weight = 1.0
stdp_enable = true
stdp_ltp = 0.02
stdp_ltd = 0.015
stdp_tau = 20.0
structural_enable = true
reward_modulated_enable = true

# Development parameters
development_initial_plasticity = 1.0
development_maturation_rate = 0.001
development_critical_period = 1000.0

# Memory settings
working_memory_capacity = 1000
episodic_memory_capacity = 10000
semantic_memory_capacity = 50000
procedural_memory_capacity = 10000
associative_memory_capacity = 100000

# Prediction system
prediction_window = 100
prediction_accuracy = 0.5

# Cognition settings
concept_learning_rate = 0.1
planning_horizon = 50
attention_focus_size = 10
