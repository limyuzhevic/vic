# NLM (熙然) - Neural Learning Machine - Default Configuration
# 
# This configuration file contains default parameters for Phase 6 integration
# of all NLM brain systems. Update values as needed for your simulation.

# ===== BRAIN CONFIGURATION =====
brain.neuron_count = 1000
brain.region_count = 1
brain.connection_probability = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# ===== SYNAPTIC PLASTICITY =====
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.structural.enable = true

# ===== STDP PARAMETERS =====
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# ===== STRUCTURAL PLASTICITY =====
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# ===== DEVELOPMENT =====
development.stage.initial = 0.0
development.stage.critical_period = 60.0
development.stage.maturation = 300.0
development.stage.adult = 900.0

# ===== NEUROMODULATION =====
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true

# ===== SIMULATION =====
simulation_timestep = 0.001
replay_interval = 100
consolidation_interval = 1000

# ===== ENVIRONMENT =====
environment.world_width = 20.0
environment.world_height = 20.0
environment.vision_width = 16
environment.vision_height = 16
environment.max_energy = 100.0
environment.energy_decay_rate = 0.01
environment.resource_energy_gain = 30.0

# ===== AGENT =====
agent.start_x = 10.0
agent.start_y = 10.0
agent.initial_energy = 1.0
agent.initial_health = 1.0

# ===== EXPERIMENT =====
experiment.random_seed = 42
experiment.max_steps = 10000
experiment.checkpoint_interval = 1000
