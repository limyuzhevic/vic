# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration
# Updated configuration for the complete brain simulation framework

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001f
development_pruning_rate = 0.00001f

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# STDP parameters (Phase 2 defaults)
stdp_learning_rate = 0.001
stdp_tau = 20.0

# Memory system parameters
working_memory_size = 100
episodic_memory_capacity = 1000
associative_memory_patterns = 50

# Development system parameters
development_stage_duration = 100
critical_period_end = 20

# Neuromodulation parameters
curiosity_threshold = 0.5
novelty_decay_rate = 0.95

# Prediction system parameters
prediction_horizon = 10
prediction_learning_rate = 0.1

# Planning system parameters
planning_horizon = 5
discount_factor = 0.9

# Action selection parameters
temperature = 1.0
exploration_rate = 0.1
