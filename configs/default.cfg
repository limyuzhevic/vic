# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Initial synaptic weight parameters
brain_initial_weight_mean = 0.5
brain_initial_weight_std = 0.1

# Neuron parameters
brain_v_thresh = -50.0    # Neuron threshold potential (mV)
brain_v_rest = -70.0     # Resting potential (mV)
brain_v_reset = -75.0    # Reset potential after spike (mV)
brain_tau_mem = 20.0     # Membrane time constant (ms)
brain_tau_ref = 2.0      # Refractory period (ms)

# Plasticity settings
plasticity_stdp_enable = true
plasticity_stdp_learning_rate = 0.001
plasticity_stdp_tau_plus = 20.0
plasticity_stdp_tau_minus = 20.0
plasticity_hebbian_enable = true
plasticity_structural_enable = true

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
neuromod_dopamine_scale = 1.0
neuromod_curiosity_enable = true
neuromod_novelty_enable = true

# Memory system settings
memory_working_capacity = 100
memory_episodic_max_episodes = 1000
memory_associative_strength = 0.5

# Prediction system settings
prediction_enabled = true
prediction_learning_rate = 0.01
prediction_horizon = 10

# Cognition system settings
cognition_planner_planning_depth = 5
cognition_concept_threshold = 0.5

# Reward and motivation
reward_discount_factor = 0.99
reward_prediction_error_enabled = true

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 8
vision_height = 8

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Developmental stages
development_stage_initial = 0.0  # Age when critical period ends
development_stage_critical_period = 60.0  # Age when maturation starts
development_stage_maturation = 300.0  # Age when adult stage starts

# Neuromodulation baselines
neuromod_dopamine_baseline = 0.0
