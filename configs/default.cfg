# NLM Configuration File
# Phase 6: Final Integration
# This is the default configuration for the integrated artificial brain.

# Random seed for reproducible experiments
# Use any 64-bit integer value for reproducibility
random_seed = 42

# Simulation timestep in seconds
# Time step for neural simulation. Smaller values increase accuracy but reduce performance.
simulation_timestep = 0.001

# Number of neurons in the brain
# Total neurons across all regions. More neurons increase capacity but reduce performance.
# Typical range: 100-10000 neurons
neuron_count = 1000

# Number of brain regions
# Number of neural regions. More regions enable parallel processing but increase overhead.
region_count = 2

# Connection probability for random connectivity
# Probability that a neuron will connect to another neuron. Higher values increase connectivity.
# Typical range: 0.01-0.2
connection_probability = 0.1

# Plasticity settings
# These control how neural connections change over time through learning
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
# Age-dependent plasticity and maturation parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
# These control motivation, attention, and learning signals
dopamine_baseline = 0.1

# Reward settings
# These control learning from environment interactions
reward_discount_factor = 0.99

# Environment settings
# Parameters for the simulated world
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
# Control verbosity of output
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
# Overall simulation parameters
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
# Parameters for visual output (if enabled)
visualization_enabled = false
visualization_update_rate = 30.0

# Checkpoint settings
# Parameters for saving and loading brain state
checkpoint_dir = ./checkpoints
checkpoint_save_interval = 10000
checkpoint_max_files = 10
checkpoint_compress = true

# Memory settings
# Parameters for memory systems
working_memory_capacity = 100
eepisodic_memory_max_episodes = 1000

# Neuromodulation parameters
dopamine_sensitivity = 1.0
curiosity_factor = 0.1
novelty_threshold = 0.5

# Development parameters
development_start_age = 0.0
development_end_age = 100.0