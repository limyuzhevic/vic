# NLM Configuration File
# This is the default configuration for Phase 1 skeleton with validation metadata
# Configuration values are validated according to the NLM validation framework

# ============================================================
# GENERAL CONFIGURATION
# ============================================================

# Random seed for reproducible experiments
# Type: int, Range: 0-2147483647, Description: Random seed for simulation reproducibility
random_seed = 42

# Simulation timestep in seconds
# Type: double, Range: 0.0-1.0, Description: Simulation timestep for neural dynamics
# The timestep must be small enough for numerical stability (typically 0.001s)
simulation_timestep = 0.001

# Number of brain regions
# Type: int, Range: 1-100, Description: Number of distinct neural regions
# Reasonable range for most simulations
region_count = 2

# ============================================================
# BRAIN CONFIGURATION
# ============================================================

# Number of neurons in the brain
# Type: int, Range: 100-100000, Description: Total neuron count for the brain
# Range validation: Minimum viable network size (100 neurons)
# Range validation: Maximum reasonable computational load (100k neurons)
neuron_count = 1000

# Synaptic density
# Type: double, Range: 0.0-1.0, Description: Synaptic connection density
# Range validation: 0.0 = no connections, 1.0 = fully connected
# Typical values: 0.1-0.3 for sparse networks, 0.5+ for dense networks
synapse_density = 0.1

# Connection probability for random connectivity
# Type: double, Range: 0.0-1.0, Description: Probability of connection between neurons
# This parameter is used in random connectivity algorithms
# Range validation: 0.0 = no connections, 1.0 = all possible connections
connection_probability = 0.1

# Initial synaptic weight mean
# Type: double, Range: -10.0-10.0, Description: Mean value for initial synaptic weights
# Range validation: Biologically plausible weight range
# Negative values represent inhibitory connections, positive values excitatory
initial_weight_mean = 0.0

# ============================================================
# BRAIN DYNAMICS PARAMETERS
# ============================================================

# Threshold voltage
# Type: double, Range: -100.0-50.0, Description: Membrane potential threshold for spike generation
# Range validation: Typical neuron threshold range (-55mV to -40mV)
# Values below -100mV are unrealistic for biological neurons
v_thresh = -55.0

# Resting voltage
# Type: double, Range: -100.0-50.0, Description: Resting membrane potential
# Range validation: Typical resting potential range (-80mV to -60mV)
v_rest = -70.0

# Reset voltage
# Type: double, Range: -100.0-0.0, Description: Voltage to which neuron resets after spike
# Range validation: Must be below threshold for spike reset
# Typical reset potential is close to resting potential
v_reset = -70.0

# Membrane time constant
# Type: double, Range: 0.0-1000.0, Description: Membrane time constant (tau_m)
# Range validation: Positive values only
# Typical range: 5-50ms for biological neurons (0.005-0.05s)
tau_mem = 0.02

# Refractory time constant
# Type: double, Range: 0.0-100.0, Description: Absolute refractory period duration
# Range validation: Positive values only
# Typical range: 1-5ms for biological neurons (0.001-0.005s)
tau_ref = 0.002

# ============================================================
# PLASTICITY CONFIGURATION
# ============================================================

# Spike-Timing-Dependent Plasticity (STDP) learning rate
# Type: double, Range: 0.001-0.1, Description: STDP learning rate magnitude
# Range validation: Small positive values for stability
# Typical STDP learning rates are on the order of 0.01
stdp.learning_rate = 0.01

# STDP tau_plus parameter
# Type: double, Range: 1.0-1000.0, Description: STDP tau_plus time constant
# Range validation: Positive values representing time constants
# Typical range: 10-100ms for biological STDP
stdp.tau_plus = 20.0

# STDP tau_minus parameter
# Type: double, Range: 1.0-1000.0, Description: STDP tau_minus time constant
# Range validation: Positive values representing time constants
# Typical range: 10-100ms for biological STDP
stdp.tau_minus = 20.0

# Hebbian learning rate
# Type: double, Range: 0.001-0.1, Description: Hebbian learning rate
# Range validation: Small positive values for stability
# Hebbian learning rates are typically smaller than STDP rates
hebbian.learning_rate = 0.01

# Structural plasticity rate
# Type: double, Range: 0.000001-0.01, Description: Rate of structural synapse changes
# Range validation: Very small positive values for stability
# Structural plasticity is much slower than synaptic plasticity
structural.plasticity_rate = 0.001

# ============================================================
# NEUROMODULATION CONFIGURATION
# ============================================================

# Dopamine scale factor
# Type: double, Range: 0.1-10.0, Description: Dopamine modulation strength
# Range validation: Reasonable scaling factors
# Values below 0.1 are negligible, values above 10.0 are excessive
dopamine.scale = 1.0

# Curiosity threshold
# Type: double, Range: 0.1-5.0, Description: Curiosity activation threshold
# Range validation: Reasonable threshold values
# Low threshold = high curiosity, high threshold = low curiosity
curiosity.threshold = 0.5

# Novelty threshold
# Type: double, Range: 0.1-5.0, Description: Novelty detection threshold
# Range validation: Reasonable threshold values
# Similar to curiosity threshold but for novelty detection
novelty.threshold = 0.5

# ============================================================
# ENVIRONMENT CONFIGURATION
# ============================================================

# Environment width (grid cells)
# Type: int, Range: 10-1000, Description: Environment width in grid cells
# Range validation: Minimum 10x10 grid, maximum 1000x1000 grid
width = 10

# Environment height (grid cells)
# Type: int, Range: 10-1000, Description: Environment height in grid cells
# Range validation: Minimum 10x10 grid, maximum 1000x1000 grid
height = 10

# Vision width (observation radius)
# Type: int, Range: 1-100, Description: Vision width in grid cells
# Range validation: Reasonable observation radius
# Too small = poor perception, too large = computational burden
visionWidth = 5

# Vision height (observation radius)
# Type: int, Range: 1-100, Description: Vision height in grid cells
# Range validation: Reasonable observation radius
# Should match aspect ratio with visionWidth for square vision
visionHeight = 5

# Environment name
# Type: string, Format: ^[a-zA-Z0-9_]+$, Description: Unique identifier for environment
# Format validation: Alphanumeric characters and underscores only
environment_name = GridWorld

# ============================================================
# LOGGING CONFIGURATION
# ============================================================

# Log level
# Type: string, Allowed values: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Allowed values validation: Must be one of the specified log levels
log_level = INFO

# Log to file flag
# Type: bool, Description: Enable/disable file logging
log_to_file = false

# Log filename
# Type: string, Format: ^[a-zA-Z0-9_\-\.]+\.[a-zA-Z0-9]+$, Description: Output log filename
# Format validation: Filename with extension for file output
log_filename = nlm.log

# ============================================================
# SIMULATION CONFIGURATION
# ============================================================

# Maximum simulation steps
# Type: int, Range: 1-1000000, Description: Maximum number of simulation steps
# Range validation: Reasonable simulation limits
max_simulation_steps = 10000

# Simulation time limit (seconds)
# Type: double, Range: 0.0-1e6, Description: Maximum simulation time
# Range validation: Allow infinite simulation (0.0) or finite limits
simulation_time_limit = 0.0

# ============================================================
# VISUALIZATION CONFIGURATION
# ============================================================

# Visualization enabled flag
# Type: bool, Description: Enable/disable visualization output
visualization_enabled = false

# Visualization update rate (Hz)
# Type: double, Range: 1.0-1000.0, Description: Visualization update frequency
# Range validation: Reasonable frame rates
# Values below 1.0 are too slow, above 1000.0 may cause performance issues
visualization_update_rate = 30.0

# ============================================================
# DEVELOPMENT CONFIGURATION (for research/experiment setup)
# ============================================================

# Synaptogenesis rate
# Type: double, Range: 0.000001-0.1, Description: Rate of new synapse formation
# Range validation: Very small positive values for developmental stability
development_synaptogenesis_rate = 0.001

# Pruning rate
# Type: double, Range: 0.000001-0.1, Description: Rate of synapse elimination
# Range validation: Very small positive values for developmental stability
development_pruning_rate = 0.0001

# Dopamine baseline
# Type: double, Range: 0.0-1.0, Description: Baseline dopamine level
# Range validation: 0.0-1.0 scale for baseline neuromodulation values
dopamine_baseline = 0.1

# Reward discount factor
# Type: double, Range: 0.0-1.0, Description: Reward discounting factor
# Range validation: Proper discount factor for temporal difference learning
reward_discount_factor = 0.99
