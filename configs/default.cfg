# NLM Configuration File
# Enhanced Configuration Template for NLM Phase 2+ Experiments
# Format: key = value (supports strings, booleans, numbers, and arrays)

# =============================================================================
# BASIC SIMULATION PARAMETERS
# =============================================================================

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (smaller = more precise but slower)
simulation_timestep = 0.001

# Number of neurons in the brain (affects simulation size and complexity)
neuron_count = 1000

# Number of brain regions (higher values enable more modular processing)
region_count = 2

# Connection probability for random connectivity (0.0 = sparse, 1.0 = dense)
connection_probability = 0.1

# =============================================================================
# NEURAL DYNAMICS PARAMETERS
# =============================================================================

# Neuron model parameters (Leaky Integrate-and-Fire model)
# These control the basic neuron behavior

# Membrane capacitance (nF) - how easily neuron charges/discharges
neuron_capacitance = 1.0

# Membrane time constant (ms) - determines membrane potential dynamics
time_constant = 20.0

# Resting membrane potential (mV) - baseline potential between spikes
resting_potential = -70.0

# Action potential threshold (mV) - voltage at which neuron fires
threshold = -55.0

# Reset potential (mV) - voltage after firing spike
reset_potential = -70.0

# Refractory period (ms) - absolute refractory time after firing
refractory_period = 5

# =============================================================================
# PLASTICITY PARAMETERS
# =============================================================================

# General learning rate
plasticity_learning_rate = 0.01

# Spike-Timing-Dependent Plasticity (STDP) parameters
# LTP (Long-Term Potentiation) weight change for pre-before-post spikes
stdp_ltp_weight = 0.01

# LTD (Long-Term Depression) weight change for post-before-pre spikes
stdp_ltd_weight = 0.012

# STDP time constant (ms) - how quickly STDP effects decay
stdp_time_constant = 20.0

# STDP eligibility window (ms) - time window for STDP pairing
stdp_eligibility_window = 50.0

# Hebbian plasticity strength
hebbian_weight = 0.005

# Structural plasticity rates
# Rate of new synapse formation (synaptogenesis)
synaptogenesis_rate = 0.001

# Rate of synapse elimination (pruning)
pruning_rate = 0.0001

# Development parameters
# Age-dependent plasticity rate multiplier
developmental_plasticity_multiplier = 1.0

# Critical period multiplier (enhanced plasticity during development)
critical_period_multiplier = 2.5

# =============================================================================
# NEUROMODULATION PARAMETERS
# =============================================================================

# Neuromodulator baseline levels (0.0 = inactive, 1.0 = maximum)
dopamine_baseline = 0.1
acetylcholine_baseline = 0.2
norepinephrine_baseline = 0.15
 serotonin_baseline = 0.1

# Neuromodulator dynamics parameters
dopamine_decay_rate = 0.1
dopamine_release_rate = 1.0

# Novelty detection sensitivity
novelty_threshold = 0.01
novelty_decay_rate = 0.05

# =============================================================================
# REWARD AND LEARNING PARAMETERS
# =============================================================================

# Reward prediction error parameters
reward_prediction_error_learning_rate = 0.01
reward_discount_factor = 0.99

# Curiosity-driven exploration parameters
curiosity_novelty_weight = 0.5
curiosity_prediction_error_weight = 0.5
curiosity_decay_rate = 0.05

# =============================================================================
# ENVIRONMENT PARAMETERS
# =============================================================================

# Default environment type
environment_name = GridWorld

# Grid world parameters (for GridWorld environment)
environment_width = 10
environment_height = 10

# Vision parameters (sensory processing)
vision_width = 8
vision_height = 8
vision_range = 1
vision_angle = 90.0

# =============================================================================
# MEMORY SYSTEM PARAMETERS
# =============================================================================

# Working memory capacity (number of active items)
working_memory_capacity = 10

# Working memory decay time constant (ms)
working_memory_decay = 100.0

# Episodic memory capacity (number of stored episodes)
episodic_memory_capacity = 1000

# Episodic memory consolidation threshold (item importance)
consolidation_threshold = 0.7

# Semantic memory learning rate
semantic_memory_learning_rate = 0.001

# =============================================================================
# COGNITION AND PLANNING PARAMETERS
# =============================================================================

# Neural planner parameters
planner_time_horizon = 10
planner_action_selection_temperature = 1.0

# Concept formation parameters
concept_learning_rate = 0.001
concept_threshold = 0.5

# Attention parameters
attention_decay_rate = 0.1
attention_focus_strength = 1.0

# =============================================================================
# LOGGING AND OUTPUT PARAMETERS
# =============================================================================

# Logging verbosity levels:
# OFF = 0, ERROR = 1, WARNING = 2, INFO = 3, DEBUG = 4
log_level = INFO

# Whether to write logs to file
log_to_file = false

# Log filename (relative to working directory)
log_filename = nlm.log

# =============================================================================
# SIMULATION CONTROL PARAMETERS
# =============================================================================

# Maximum number of simulation steps
max_simulation_steps = 10000

# Simulation time limit in seconds (0.0 = unlimited)
simulation_time_limit = 0.0

# =============================================================================
# VISUALIZATION PARAMETERS
# =============================================================================

# Enable/disable visualization
visualization_enabled = false

# Visualization update rate (Hz) - how often to update visualization
visualization_update_rate = 30.0

# Visualization output format
visualization_format = "png"

# Visualization scale (zoom factor)
visualization_scale = 1.0

# =============================================================================
# PERFORMANCE AND OPTIMIZATION
# =============================================================================

# Enable/disable performance optimizations
performance_optimizations = true

# Memory pool sizes (if enabled)
neuron_memory_pool_size = 1024
synapse_memory_pool_size = 2048

# Event queue sizes
spike_event_queue_size = 4096
plasticity_event_queue_size = 2048

# =============================================================================
# ADVANCED EXPERIMENTAL PARAMETERS
# =============================================================================

# Enable/disable specific experimental features
enable_structural_plasticity = true
enable_reward_modulation = true
enable_curiosity = true
enable_prediction = true
enable_development = true

# Experiment-specific parameters
experiment_id = "default"
experiment_seed = 12345

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
