# NLM Configuration File
# Enhanced Phase 2 Real Neural Computation Configuration
# This configuration provides optimal settings for neural network simulation

# ===== RANDOMNESS & REPRODUCIBILITY =====
# Random seed for reproducible experiments
random_seed = 42

# ===== SIMULATION CORE =====
# Simulation timestep in seconds (LIF neuron dynamics)
simulation_timestep = 0.001

# Number of neurons in the brain (must be divisible by region_count for balanced distribution)
neuron_count = 1000

# Number of brain regions (controls spatial organization)
region_count = 2

# Connection probability for random connectivity (0.0-1.0)
connection_probability = 0.1

# ===== PLASTICITY SYSTEM =====
# STDP learning parameters
stdp_ltp_weight = 0.01          # Long-Term Potentiation weight
stdp_ltd_weight = 0.012         # Long-Term Depression weight
stdp_tau = 20.0                 # STDP time constant (steps)

# Hebbian learning rate
hebbian_learning_rate = 0.01

# Overall plasticity intensity multiplier (0.0-1.0)
plasticity_intensity = 1.0

# ===== DEVELOPMENTAL SYSTEM =====
# Synaptogenesis (creation of new synapses) rate
synaptogenesis_rate = 0.0001

# Pruning (elimination of synapses) rate
pruning_rate = 0.00001

# Developmental stage (0=Initial, 1=CriticalPeriod, 2=Maturation, 3=Adult)
development_stage = 0

# ===== NEUROMODULATION =====
# Dopamine baseline level (reward prediction error)
dopamine_baseline = 0.0

# Neuromodulation intensity scaling factor
neuromodulation_intensity = 1.0

# ===== REWARD SYSTEM =====
# Discount factor for delayed rewards
reward_discount_factor = 0.99

# Reward shaping mode: sparse, dense, or shaping
reward_shaping = sparse

# ===== ENVIRONMENT & SENSORIMOTOR =====
# Environment type (currently GridWorld is the main implementation)
environment_name = GridWorld

# Environment dimensions
environment_width = 16
environment_height = 16
environment_depth = 16
environment_height_cells = 16

# ===== LOGGING & MONITORING =====
# Log level (Debug, Info, Warning, Error, Critical)
log_level = Info

# Enable logging to file
log_to_file = false

# Log filename
log_filename = nlm.log

# Log verbosity level (0-3, where 3 is most verbose)
log_verbosity = 1

# ===== SIMULATION MANAGEMENT =====
# Maximum number of simulation steps
max_simulation_steps = 10000

# Simulation time limit (seconds, 0.0 = unlimited)
simulation_time_limit = 0.0

# ===== CHECKPOINTING =====
# Enable checkpoint saving for state persistence
checkpoint_enabled = true

# Checkpoint directory
checkpoint_dir = ./checkpoints

# Checkpoint interval (steps between checkpoints)
checkpoint_interval = 1000

# Maximum number of checkpoints to retain
checkpoint_max_count = 10

# Checkpoint compression level (0=none, 1=light, 2=balanced, 3=max)
checkpoint_compression = 2

# ===== MEMORY SYSTEM =====
# Working memory capacity (number of active neurons to track)
working_memory_capacity = 100

# Maximum number of episodic memory entries to retain
max_episodes = 1000

# Episodic memory replay interval (steps)
episodic_replay_interval = 100

# ===== COGNITIVE SYSTEMS =====
# Neural planner planning depth
planner_planning_depth = 5

# Concept formation learning rate
concept_formation_learning_rate = 0.01

# Attentional selection inhibition strength
attention_inhibition_strength = 0.5

# Attentional selection excitation strength
attention_excitation_strength = 1.5

# ===== NOVELTY & CURIOUSITY =====
# Novelty detection sensitivity
novelty_sensitivity = 0.1

# Curiosity drive strength
curiosity_drive = 1.0

# Novelty threshold for triggering curiosity
novelty_threshold = 0.5

# ===== PERFORMANCE & OPTIMIZATION =====
# Network size preset (small, medium, large, xlarge)
# Note: This is a hint for preprocessing, actual neuron_count overrides
network_size_preset = medium

# Maximum memory usage (MB)
max_memory_usage = 1024

# Thread count for parallel processing (0 = auto-detect)
thread_count = 0

# ===== VISUALIZATION =====
# Enable visualization output
visualization_enabled = false

# Visualization update rate (Hz)
visualization_update_rate = 30.0

# Visualization output format (png, svg, ascii)
visualization_format = png

# ===== ADVANCED SETTINGS =====
# E/I (Excitory/Inhibitory) balance ratio (0.1-10.0, 1.0 = balanced)
# Higher values = more excitation relative to inhibition
e_ratio = 1.0

# Connection density for structured connectivity (0.01-0.5)
# Overrides random connection probability for structured patterns
connection_density = 0.15

# Learning rate for plasticity rules (0.001-0.1)
# Scales all plasticity operations
learning_rate = 0.01

# Spike delivery scaling factor
spike_delivery_scale = 10.0

# ===== DEBUGGING & DEVELOPMENT =====
# Enable debug mode with enhanced logging
debug_mode = false

# Debug specific neurons by ID (comma-separated list)
# Example: debug_neurons = "1,5,10,15"
debug_neurons = ""

# Enable simulation speed multiplier (for faster testing)
# 1.0 = real time, 2.0 = 2x speed, etc.
simulation_speed = 1.0

# ===== PHASE 3+ SPECIFIC =====
# Phase 3: World interaction loop enabled
phase3_enabled = true

# Phase 4: Neural prediction system enabled
phase4_enabled = true

# Phase 5: Performance optimizations enabled
phase5_enabled = true

# Phase 6: Full integration test enabled
phase6_enabled = true

# ===== METADATA =====
# Configuration file version
config_version = "2.0"

# Description of this configuration
config_description = "Enhanced NLM Phase 2 configuration with full integration support"

# Author of this configuration
config_author = "NLM Development Team"

# Date created
config_date = "2026-11-02"

# Tags for configuration categorization
config_tags = "production,research,simulation,neural-network"
