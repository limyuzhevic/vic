# NLM Configuration File
# This is the default configuration for Phase 2 neural computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
stdp_tau = 20.0
stdp_eligibility_decay_rate = 0.001

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Neuron parameters (configurable)
neuron_leak_conductance = 10.0
neuron_threshold = -55.0
neuron_resting_potential = -70.0
neuron_reset_potential = -75.0
neuron_refractory_period = 5
neuron_max_spike_history = 100
neuron_membrane_capacitance = 1.0
neuron_time_constant = 20.0
neuron_refractory_steps = 5

# Synapse parameters (configurable)
synapse_min_weight = -1.0
synapse_max_weight = 1.0
synapse_delay_min = 1
synapse_delay_max = 5
synapse_exc_probability = 0.8
synapse_stp_facilitation_tau = 100.0
synapse_stp_depression_tau = 200.0
synapse_stp_u_max = 1.0

# Short-term plasticity parameters
synapse_stp_facilitation_time_constant = 100.0
synapse_stp_depression_time_constant = 200.0
synapse_stp_utilization_max = 1.0

# Brain parameters
brain_initial_excitatory_ratio = 0.8
brain_connection_probability = 0.1
brain_initial_weight_mean = 0.5
brain_initial_weight_std = 0.1

# Motor parameters
motor_max_actions = 10
motor_action_timeout = 1000

# Sensory parameters
sensory_input_range = 100.0
sensory_noise_level = 0.01
