# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
replay_interval = 100
consolidation_interval = 1000
checkpoint_dir = ./checkpoints

# Neuromodulation settings
dopamine_baseline = 0.1

# Sensory mapping (from percept to neural current)
vision_scaling_factor = 5.0
touch_scaling_factor = 8.0
internal_scaling_factor = 2.0
proprioception_scaling_factor = 5.0

# Neuromodulation scaling
neuromodulation_curiosity_scaling = 2.0
neuromodulation_prediction_error_scaling = 0.5

# Exploration behavior
exploration_chance_multiplier = 0.3
exploration_curiosity_threshold = 0.5

# Plasticity parameters
plasticity_dopamine_effect = 0.5
plasticity_decay_factor = 0.9995

# Development timing
initial_plasticity_phase = 60.0
critical_period_phase = 300.0
maturation_phase = 900.0

# Sensory mapping
vision_input_size = 256
touch_input_size = 8
internal_input_size = 4
proprioception_input_size = 6

# Sensory dimensions (configurable per modality)
vision_width = 16
vision_height = 16
touch_sensor_count = 8
internal_sensor_count = 4
proprioception_sensor_count = 6
audio_sensor_count = 0  # 0 disables audio

# Sensory processing
enable_sensory_validation = true
enable_sensory_filtering = false

# Activity thresholds
motor_activity_threshold = 0.5
