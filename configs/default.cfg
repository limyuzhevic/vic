# NLM Configuration File
# This is the default configuration for Phase 6 and beyond

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Neuromodulation levels (Phase 6)
neuromod_curiosity = 0.5
neuromod_novelty = 0.3
neuromod_prediction_error = 0.2

# Memory settings (Phase 6)
working_memory_capacity = 50
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 100
episodic_memory_replay_rate = 0.05
associative_memory_strength = 0.8

# Prediction settings (Phase 6)
prediction_error_threshold = 0.1
prediction_confidence_threshold = 0.5
prediction_learning_rate = 0.05

# Development settings (Phase 6)
development_plasticity_rate = 0.005
development_critical_period_length = 100

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_weight = 0.7

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_reward_boundary = 0.0
environment_resource_value = 10.0

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_file_max_size = 10485760
log_file_backup_count = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
