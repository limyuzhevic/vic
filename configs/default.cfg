# NLM Configuration File
# Phase 6 Enhanced Configuration with comprehensive settings for neural simulation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (optimal for stability)
simulation_timestep = 0.001

# Core brain architecture parameters
neuron_count = 1000
region_count = 2
connection_probability = 0.1

# Phase 2: Real Neural Computation settings
lif_resting_potential = -70.0
lif_threshold_potential = -50.0
lif_decay_time = 10.0
lif_reset_potential = -65.0

# Phase 3: Development system settings
development_initial_plasticity = 1.0
development_critical_period_end = 300.0
development_maturation_end = 900.0
development_adult_plasticity = 0.2

# Phase 4: Memory system settings
working_memory_capacity = 100
working_memory_decay_rate = 0.995
episodic_memory_capacity = 50
episodic_memory_pruning_rate = 0.01

# Phase 5: Neuromodulation settings (fixed duplicate dopamine_baseline)
dopamine_baseline = 0.1
dopamine_max = 1.0
dopamine_min = -1.0
dopamine_sensitivity = 0.5

# Curiosity and novelty settings
curiosity_baseline = 0.1
curiosity_sensitivity = 0.3
novelty_decay_rate = 0.99

# Phase 6: Prediction and cognition settings
prediction_horizon = 10
prediction_confidence_threshold = 0.7
planning_horizon = 5
concept_formation_threshold = 0.5

# Reward prediction and learning
reward_discount_factor = 0.99
reward_learning_rate = 0.01
value_estimation_update_rate = 0.01

# Plasticity system settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
structural_plasticity_rate = 0.0001

# Development plasticity settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
structural_plasticity_enabled = true
development_enabled = true

# Environment and sensory settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 16
vision_height = 16
touch_sensors = 8
internal_signals = 4
proprioception_sensors = 6

# Agent settings
agent_max_energy = 100.0
agent_energy_decay_rate = 0.01
agent_health = 100.0
agent_age = 0.0

# Logging and monitoring
log_level = INFO
log_to_file = true
log_filename = nlm_simulation.log
log_to_console = true
console_log_level = INFO
file_log_level = DEBUG

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 3600.0  # 1 hour
checkpoint_interval = 1000
replay_enabled = true
replay_window = 100

# Advanced optimization settings
optimized_simulation = true
vectorization_enabled = true
parallel_processing = true
thread_pool_size = 4
memory_pool_size = 10240
use_efficient_structures = true

# Visualization and debugging
visualization_enabled = false
visualization_update_rate = 30.0
debug_mode = false
debug_log_level = INFO
performance_monitoring = true
memory_monitoring = true

# Safety and validation settings
input_validation_enabled = true
bounds_checking_enabled = true
overflow_protection = true
nan_detection = true
invalid_input_action = "ignore"
simulation_timeout = 0.0  # 0 means no timeout

# Advanced curiosity and exploration
curiosity_enabled = true
exploration_rate = 0.2
exploitation_rate = 0.8
epsilon_greedy = false
disagreement_tolerance = 0.3

# Memory consolidation
memory_consolidation_interval = 100
consolidation_strength = 0.5
replay_frequency = 0.1

# Phase 6 specific settings
phase6_integration_test = true
phase6_strict_validation = false
phase6_allow_incomplete_systems = false
phase6_fallback_behavior = "conservative"
