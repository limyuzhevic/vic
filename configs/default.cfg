# NLM Configuration File
# This is the default configuration for Phase 2 Real Neural Computation

# General Settings
random_seed = 42                    # Random seed for reproducible experiments (use Constants::DEFAULT_RANDOM_SEED)
simulation_timestep = 0.001         # Simulation timestep in seconds (use Constants::DEFAULT_SIMULATION_TIMESTEP)

# Brain Settings
neuron_count = 1000                 # Total number of neurons (use Constants::DEFAULT_NEURON_COUNT)
region_count = 2                     # Number of brain regions (use Constants::DEFAULT_REGION_COUNT)
connection_probability = 0.1         # Synapse connection probability (use Constants::DEFAULT_CONNECTION_PROBABILITY)

# Neural Dynamics
initial_weight_mean = 0.2            # Mean initial synaptic weight
initial_weight_std = 0.1             # Standard deviation of initial weights

# Plasticity Settings
stdp_ltp_weight = 0.01               # STDP LTP weight (use Constants::DEFAULT_STDP_LTP_WEIGHT)
stdp_ltd_weight = 0.012              # STDP LTD weight (use Constants::DEFAULT_STDP_LTD_WEIGHT)
stdp_time_constant = 20.0            # STDP time constant (use Constants::DEFAULT_STDP_TIME_CONSTANT)
hebbian_learning_rate = 0.01         # Hebbian learning rate (use Constants::DEFAULT_HEBBIAN_LEARNING_RATE)

# Structural Plasticity
structural_synaptogenesis_rate = 0.0001      # Synaptogenesis rate (use Constants::DEFAULT_SYNAPTOGENESIS_RATE)
structural_pruning_rate = 0.00001             # Pruning rate (use Constants::DEFAULT_PRUNING_RATE)

# Neuromodulation
dopamine_baseline = 0.0             # Dopamine baseline (see Neuromodulator.hpp)
curiosity_scale = 1.0               # Curiosity scale (see Neuromodulator.hpp)
novelty_baseline = 0.0               # Novelty detection baseline

# Development
developmental_stage = Initial       # Developmental stage (Initial|CriticalPeriod|Maturation|Adult|Aging)
development_synaptogenesis_rate = 0.001    # Development synaptogenesis rate
development_pruning_rate = 0.0001           # Development pruning rate

# Memory Systems
working_memory_capacity = 100        # Working memory capacity (use Constants::DEFAULT_WORKING_MEMORY_CAPACITY)
episodic_memory_max_episodes = 1000  # Max episodic episodes (use Constants::DEFAULT_MAX_EPISODIC_EPISODES)

# Checkpointing
checkpoint_directory = ./checkpoints # Directory for checkpoints
checkpoint_save_interval = 100       # Save interval (use Constants::DEFAULT_REPLAY_INTERVAL)
checkpoint_load_interval = 100       # Load interval (use Constants::DEFAULT_CONSOLIDATION_INTERVAL)

# Logging
log_level = INFO                     # Log level (Debug|Info|Warning|Error|Critical)
log_to_file = false                  # Log to file (default: false)
log_filename = nlm.log                # Log filename (default: nlm.log)

# Simulation
max_simulation_steps = 10000        # Maximum simulation steps
simulation_time_limit = 0.0          # Simulation time limit in seconds

# Visualization
visualization_enabled = false       # Enable visualization (default: false)
visualization_update_rate = 30.0     # Visualization update rate (Hz)

# Environment
environment_name = GridWorld        # Environment name
environment_width = 10               # Environment width
environment_height = 10              # Environment height
