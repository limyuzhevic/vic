// Default configuration file for NLM
// This file provides sensible defaults for Phase 2 neural computation

{
  "brain": {
    "neuron_count": 500,
    "region_count": 1,
    "connection_probability": 0.15,
    "initial_weight_mean": 0.5,
    "initial_weight_std": 0.1,
    "v_thresh": -50.0,
    "v_rest": -70.0,
    "v_reset": -75.0,
    "tau_mem": 20.0,
    "tau_ref": 2.0,
    "leak_conductance": 10.0,
    "refractory_period": 5
  },
  
  "plasticity": {
    "stdp": {
      "enable": true,
      "learning_rate": 0.001,
      "tau_plus": 20.0,
      "tau_minus": 20.0,
      "ltp_weight": 0.02,
      "ltd_weight": 0.015
    },
    
    "hebbian": {
      "enable": true,
      "learning_rate": 0.001
    },
    
    "structural": {
      "enable": true,
      "synaptogenesis_rate": 0.0001,
      "pruning_rate": 0.00001
    }
  },
  
  "neuromodulation": {
    "dopamine": {
      "scale": 1.0
    },
    
    "curiosity": {
      "enable": true,
      "exploration_rate": 0.1
    },
    
    "novelty": {
      "enable": true,
      "sensitivity": 0.5
    }
  },
  
  "development": {
    "enable_development": true,
    "enable_maturation": true,
    "development_rate": 0.01,
    "critical_period": 10.0,
    "maturation_stage": 0.5
  },
  
  "simulation": {
    "timestep": 0.001,
    "max_steps": 1000,
    "random_seed": 42,
    "enable_checkpointing": false,
    "checkpoint_interval": 100
  }
}
