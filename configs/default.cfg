# NLM Configuration File
# This is the default configuration for Phase 6 - Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# ---------- NEURON PARAMETERS ----------
# Neuron threshold potential (mV)
brain.v_thresh = -50.0
# Resting potential (mV) 
brain.v_rest = -70.0
# Reset potential after spike (mV)
brain.v_reset = -75.0
# Membrane time constant (ms)
brain.tau_mem = 20.0
# Refractory period (ms)
brain.tau_ref = 2.0

# ---------- SYNAPTIC PARAMETERS ----------
# Initial mean synaptic weight
brain.initial_weight_mean = 0.5
# Initial synaptic weight standard deviation
brain.initial_weight_std = 0.1
# Synaptic delay in ms
synaptic_delay = 5.0

# ---------- PLASTICITY PARAMETERS ----------
# STDP parameters
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.stdp.max_weight = 1.0
plasticity.stdp.min_weight = -1.0

# Hebbian learning parameters
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity parameters
plasticity.structural.enable = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# ---------- NEUROMODULATION PARAMETERS ----------
# Dopamine neuromodulation
neuromod.dopamine.baseline = 0.1
neuromod.dopamine.scale = 1.0
neuromod.dopamine.decay_rate = 0.1

# Curiosity neuromodulation
neuromod.curiosity.enable = true
neuromod.curiosity.scale = 1.0

# Novelty neuromodulation
neuromod.novelty.enable = true
neuromod.novelty.threshold = 0.5

# Prediction error neuromodulation
neuromod.prediction.error.scale = 0.5

# ---------- MEMORY SYSTEM PARAMETERS ----------
# Working memory capacity (neuron count)
memory.working.capacity = 100
# Working memory consolidation threshold
memory.working.consolidation_threshold = 0.7

# Episodic memory capacity (episodes)
memory.episodic.max_episodes = 1000
# Episodic memory replay interval (steps)
memory.episodic.replay_interval = 100

# Associative memory threshold
memory.associative.threshold = 0.5

# ---------- COGNITION SYSTEM PARAMETERS ----------
# Planning parameters
cognition.planner.planning_depth = 5
cognition.planner.exploration_rate = 0.1

# Concept formation parameters
cognition.concept.min_pattern_count = 3
cognition.concept.similarity_threshold = 0.8

# Attention parameters
cognition.attention.inhibition_strength = 0.5
cognition.attention.excitation_strength = 1.5
cognition.attention.focus_decay_rate = 0.95

# ---------- DEVELOPMENT PARAMETERS ----------
# Developmental stages
development.stage.initial.plasticity_rate = 1.0
development.stage.critical_period.plasticity_rate = 0.8
development.stage.maturation.plasticity_rate = 0.5
development.stage.adult.plasticity_rate = 0.2
development.stage.aging.plasticity_rate = 0.1

# ---------- AGENT PARAMETERS ----------
# Agent behavior parameters
agent.curiosity_threshold = 0.3
agent.noise_level = 0.1
agent.action_selection.temperature = 1.0

# ---------- WORLD PARAMETERS ----------
# Environment parameters
world.width = 20.0
world.height = 20.0
world.vision_width = 8
world.vision_height = 8
world.max_energy = 100.0
world.energy_decay_rate = 0.01
world.resource_energy_gain = 30.0
world.hazard_energy_loss = 15.0

# ---------- CHECKPOINTING ----------
# Checkpointing parameters
checkpoint.enabled = true
checkpoint.path = ./checkpoints
checkpoint.max_checkpoints = 10
checkpoint.compression_level = 1
checkpoint.save_interval = 1000

# ---------- SIMULATION CONTROL ----------
# Simulation parameters
max_steps = 10000
time_limit = 0.0
enable_replay = true
replay_interval = 100
enable_developmental = true
development_update_interval = 1000

# ---------- LOGGING ----------
# Logging parameters
log.level = INFO
log.to_file = true
log.filename = nlm.log
log.max_file_size_mb = 100
log.max_files = 5
log.flush_interval_ms = 1000

# ---------- EXPERIMENT CONTROL ----------
# Experiment parameters
experiment.id = phase6_integration
experiment.description = "Phase 6 integration experiment testing all brain systems"
experiment.auto_checkpoint = true
experiment.metrics_collection = true
experiment.visualization.enabled = false
experiment.visualization.update_rate = 30.0