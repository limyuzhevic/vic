# Default NLM Configuration
# This file contains the default configuration for NLM brain simulation

# Simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15
max_simulation_steps = 10000

# Neuron parameters
neuron_membrane_resistance = 10000.0
neuron_capacitance = 1.0
neuron_threshold = -55.0
neuron_reset_potential = -70.0

# Synapse parameters
initial_synapse_weight = 1.0
synapse_max_weight = 10.0
synapse_min_weight = 0.0

# Plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation parameters
dopamine_effect_strength = 0.5
curiosity_threshold = 0.1
novelty_sensitivity = 0.3

# Memory parameters
working_memory_capacity = 100
episodic_memory_capacity = 1000
concept_formation_threshold = 0.5

# Environment parameters
render_mode = false
environment_width = 100
environment_height = 100
observation_range = 10.0

# Logging parameters
log_level = "info"
log_file = "nlm.log"
console_output = true

# Experiment parameters
experiment_name = "default_experiment"
experiment_type = "plasticity_learning"
