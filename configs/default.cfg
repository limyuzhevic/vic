# NLM Configuration File
# This is the default configuration for Phase 6 - Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
Development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_decay = 0.9
curiosity_threshold = 0.1
novelty_decay = 0.98

# Reward settings
reward_discount_factor = 0.99
reward_learning_rate = 0.01

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Memory settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
replay_interval = 100
consolidation_interval = 1000

# Prediction settings
prediction_history_size = 50
prediction_confidence_threshold = 0.8

# Cognition settings
planning_depth = 5
concept_formation_decay = 0.9
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Development stages
development_stage_transition_rate = 0.01
development_critical_period_start = 60.0
development_critical_period_end = 300.0

# Checkpointing
checkpoint_dir = ./checkpoints
checkpoint_interval = 10000
max_checkpoints = 10
enable_checkpointing = true

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced user options
# Enable all Phase 6 systems
enable_memory_systems = true
enable_prediction_system = true
enable_cognition_systems = true
enable_neuromodulation = true
enable_development_integration = true
enable_replay_learning = true
