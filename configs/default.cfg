# NLM Configuration File
# Updated configuration for Phase 2: Real Neural Computation
# 
# This configuration includes settings for:
# - Real LIF neuron dynamics
# - Event-driven spike propagation with delays
# - STDP and Hebbian plasticity
# - Structural plasticity (synaptogenesis/pruning)
# - Advanced cognitive systems
# - Enhanced neuromodulation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 2 precision)
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 2 scalable)
neuron_count = 1000

# Number of brain regions (Phase 2 parallel processing)
region_count = 2

# Connection probability for random connectivity (Phase 2 optimized)
connection_probability = 0.1

# Plasticity settings (Phase 2 STDP)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (Phase 2 development)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings (Phase 2 enhanced)
dopamine_baseline = 0.0

# Advanced neuromodulation settings (Phase 2 enhancements)
serotonin_baseline = 0.05
noradrenaline_baseline = 0.05
acetylcholine_baseline = 0.03

# Cognitive development settings (Phase 2 learning)
concept_formation_threshold = 0.7
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Memory system settings (Phase 2 persistence)
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
replay_interval = 100
consolidation_interval = 1000

# Advanced checkpoint settings (Phase 2)
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = balanced
checkpoint_version = 1.0

# Logging settings (Phase 2 enhanced)
log_level = INFO
log_to_file = true
log_filename = nlm_phase2.log
log_detailed_plasticity = true
log_concept_updates = true

# Simulation settings (Phase 2)
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings (Phase 2)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_neuron_tracing = false
visualization_memory_tracking = true