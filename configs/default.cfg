# Default NLM configuration file
# Comments start with #

# Basic simulation parameters
neuron_count = 500
region_count = 1
connection_probability = 0.15
simulation_timestep = 0.001
random_seed = 42

# Plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Development parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
maturation_rate = 0.00005

# Memory parameters
working_memory_capacity = 100
episodic_memory_capacity = 50
associative_memory_size = 200

# Neuromodulation parameters
dopamine_sensitivity = 1.0
curiosity_threshold = 0.5
novelty_detection_sensitivity = 0.3

# Cognitive parameters
attention_span = 100
concept_formation_threshold = 0.7
planning_horizon = 10

# Sensory parameters
vision_range = 10.0
audio_range = 15.0
internal_signal_strength = 1.0

# Motor parameters
action_strength = 1.0
movement_range = 5

# Environmental parameters
world_width = 16
world_height = 16
reward_function_type = 1  # 1 = proximity-based, 2 = goal-based

# Experimental parameters
checkpoint_interval = 1000
replay_interval = 500
development_interval = 100

# Logging parameters
log_level = "info"
log_file = "nlm.log"
log_console = true

# Visualization parameters
enable_visualization = false
visualize_neurons = true
visualize_synapses = true
visualize_memories = true

# Performance parameters
max_steps_per_tick = 100
enable_parallel_processing = false
use_simd_optimizations = true

# Safety parameters
max_spikes_per_step = 1000
enable_error_checking = true
validation_frequency = 100