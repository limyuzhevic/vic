## Configuration Command Line Arguments

The demo accepts configuration via command line arguments that override the configuration file:

```bash
# Command line arguments (highest priority)
./nlm --episodes 10 --steps 300 --neurons 200 --save checkpoint.bin

# Configuration file (medium priority)
./nlm --config configs/benchmark.cfg

# Command line arguments override configuration file
```

### Command Line Configuration Options

| Option | Short Form | Description | Default |
|--------|------------|-------------|---------|
| --episodes | -e | Number of demo episodes | 3 |
| --steps | -s | Steps per episode | 500 |
| --neurons | -n | Number of neurons | 500 |
| --config | -c | Configuration file path | default.cfg |
| --debug | -d | Enable debug logging | false |
| --save | -S | Save checkpoint to file | not saved |

## Configuration Validation

The configuration system validates the following:

### 1. Parameter Ranges

```ini
# Valid ranges for parameters
neuron_count: [10, 10000]
region_count: [1, 10]
connection_probability: [0.0, 1.0]
random_seed: [0, 2^64-1]
simulation_timestep: [0.0001, 0.1]
stdp_ltp_weight: [0.0, 1.0]
stdp_ltd_weight: [0.0, 1.0]
stdp_tau: [1.0, 1000.0]
synaptogenesis_rate: [0.0, 0.01]
pruning_rate: [0.0, 0.001]
replay_interval: [10, 1000]
consolidation_interval: [100, 10000]
```

### 2. Consistency Checks

```ini
# Consistency checks between parameters
if (enable_development && development_stage == "Adult") {
    // Adult stage should have lower plasticity
    synaptogenesis_rate < 0.00001
    pruning_rate < 0.000001
}

if (enable_curiosity && enable_novelty) {
    // Both neuromodulation systems should work together
    dopamine_level_modulation > 0.0
    curiosity_sensitivity > 0.0
}
```

### 3. Parameter Dependencies

```ini
# Parameter dependencies
if (working_memory_capacity > 0) {
    enable_working_memory = true
}

if (episodic_memory_max_episodes > 0) {
    enable_episodic_memory = true
}

if (enable_reward_modulation) {
    // Dopamine system should be initialized
    enable_dopamine_system = true
}
```

## Configuration File Format

### 1. File Structure

```ini
# Comment lines start with #
# or ;

# Section headers in [brackets]
[simulation]
[plasticity]
[memory]
[development]
[neuromodulation]
[demo]
```

### 2. Data Types

```ini
# String values (quoted)
brain_name = "NLM Phase 6"
description = "Integrated artificial brain demo"

# Integer values
neuron_count = 500
region_count = 1
random_seed = 42

# Floating point values
simulation_timestep = 0.001
connection_probability = 0.15
stdp_ltp_weight = 0.01

# Boolean values (true/false, yes/no)
enable_development = true
enable_curiosity = yes
enable_checkpointing = false

# Array values (comma-separated)
vision_resolution = [16, 16]
 motor_neuron_groups = [forward, backward, turn_left, turn_right, interact, wait]
```

### 3. Configuration File Loading

The configuration is loaded in this order:

1. **Command line arguments** (highest priority)
2. **Configuration file** (medium priority)
3. **Default values** (lowest priority)

```ini
# Example: Configuration loading priority
# 1. Command line: ./nlm -e 10 -n 200
# 2. Config file: configs/benchmark.cfg
# 3. Defaults: configs/default.cfg
```

