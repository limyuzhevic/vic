# NLM Configuration File
# This is the default configuration for Phase 6 integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 Integration Settings
# Memory integration
enable_working_memory = true
enable_episodic_memory = true
enable_associative_memory = true

# Neuromodulation integration
enable_dopamine = true
enable_curiosity = true
enable_novelty = true
enable_prediction_error = true

# Development integration
enable_developmental_stages = true
initial_plasticity_rate = 1.0
critical_period_multiplier = 2.0

# Cognition integration
enable_planning = true
enable_concept_formation = true
enable_attention = true

# Advanced configuration options
# Neural network architecture
initial_neurons_per_region = 500
connection_probability = 0.1
connection_weight_mean = 0.5
connection_weight_std = 0.1

# Neuron parameters
neuron_threshold = -50.0
neuron_resting_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Plasticity rule parameters
stdp_ltp_strength = 0.02
stdp_ltd_strength = 0.015
stdp_time_constant = 20.0
hebbian_learning_rate = 0.001

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory parameters
working_memory_size = 100
episodic_memory_capacity = 1000
associative_memory_patterns = 50

# Neuromodulation parameters
dopamine_scale = 1.0
curiosity_sensitivity = 0.5
novelty_threshold = 0.1
prediction_error_decay = 0.99

# Development parameters
plasticity_decay_rate = 0.05
maturation_threshold = 100.0
ageing_start_time = 1000.0

# World configuration
world_width = 20.0
world_height = 20.0
max_energy = 100.0
energy_decay_rate = 0.01

# Simulation control
save_checkpoint_interval = 1000
replay_capacity = 100
enable_replay = true
replay_discount = 0.9

# Advanced features
enable_advanced_plasticity = true
enable_structural_adaptation = true
enable_reinforcement_learning = true
enable_transfer_learning = false

# Performance optimization
enable_simd_optimization = true
enable_parallel_processing = true
memory_pool_size = 4096
event_queue_size = 8192
