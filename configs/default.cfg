# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 6 precision)
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 scale)
neuron_count = 5000

# Number of brain regions (Phase 6 multi-region architecture)
region_count = 4

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings (Phase 6 enhanced)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings (Phase 6 developmental system)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings (Phase 6 integrated neuromodulators)
dopamine_baseline = 0.1
dopamine_decay_rate = 0.95

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 100000
simulation_time_limit = 0.0

# Memory system settings (Phase 6 integrated memory)
working_memory_capacity = 500
episodic_memory_max_episodes = 10000
associative_memory_capacity = 1000

# Prediction system settings (Phase 6 prediction)
prediction_horizon = 10
prediction_confidence_threshold = 0.7

# Cognitive system settings (Phase 6 cognition)
planning_depth = 5
attention_excitation_strength = 1.5
attention_inhibition_strength = 0.5

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Checkpoint system settings (Phase 6 persistence)
checkpoint_dir = ./checkpoints
checkpoint_interval = 10000
checkpoint_compression = Balanced
max_checkpoints = 5
