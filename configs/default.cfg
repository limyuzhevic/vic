# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Advanced Plasticity
# Plasticity rule selection: 0=Hebbian, 1=STDP, 2=BCM
plasticity_rule = 1

# Learning rate adaptation parameters
base_learning_rate = 0.01
hp_learning_rate = 0.001
learning_rate_decay = 0.9995
learning_rate_min = 0.0001

# Learning rate adaptation parameters (NEW)
learning_rate_adaptation_enabled = true
adaptation_algorithm = homeostatic
adaptation_rate = 0.01
stability_threshold = 0.1
max_learning_rate = 0.1
min_learning_rate = 0.0001

# Spike-timing windows (in milliseconds)
stdp_ltp_window = 50.0
stdp_ltd_window = 50.0
stdp_trace_decay = 20.0
eligibility_trace_decay = 100.0

# BCM rule threshold parameters
target_rate = 0.05
beta_factor = 0.02
learning_threshold = 0.01

# Eligibility trace parameters
trace_decay_rate = 0.9
trace_increment = 1.0
reset_trace_on_spike = true

# Short-term plasticity parameters
depression_rate = 0.01
facilitation_rate = 0.01
short_term_decay = 0.1
STP_max = 2.0
STP_min = 0.2

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
