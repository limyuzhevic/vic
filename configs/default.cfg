# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Structural plasticity settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
curiosity_baseline = 0.5
novelty_threshold = 0.3
prediction_error_rate = 0.05

# Memory settings
working_memory_capacity = 500
episodic_memory_capacity = 1000
consolidation_threshold = 0.3
replay_interval = 100
consolidation_interval = 1000

# Reward settings
reward_discount_factor = 0.99
reward_scale_factor = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 Integration settings
enable_checkpoints = true
checkpoint_directory = ./checkpoints
checkpoint_interval = 1000
enable_memory_replay = true
enable_development = true
enable_prediction = true

# Advanced neural parameters
neuron_excitability = 1.0
neuron_threshold = -55.0
neuron_leak_conductance = 0.1
refractory_period_ms = 2

# Attention settings
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_threshold = 0.3

# Cognitive settings
planning_depth = 5
concept_formulation_threshold = 0.7
concept_stability_threshold = 0.8
