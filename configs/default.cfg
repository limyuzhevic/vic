# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation
# Updated with proper parameter names and enhanced features

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500  # Reduced for faster testing

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# STDP parameters (Spike-Timing Dependent Plasticity)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian plasticity parameter
hebbian_learning_rate = 0.01

# Structural plasticity parameters
defense_synaptogenesis_rate = 0.0001
defense_pruning_rate = 0.00001

# Neuromodulation parameters
dopamine_level = 0.1
curiosity_level = 0.5
novelty_threshold = 0.05

# Reward parameters
reward_weight = 0.5
reward_decay_factor = 0.99

# Environment settings (for integration with other systems)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced simulation parameters
enable_structural_plasticity = true
enable_neuromodulation = true
enable_prediction_learning = true
enable_cognitive_functions = true

# Performance settings
num_threads = 2
checkpoint_interval = 1000
visualization_enabled = false
visualization_update_rate = 30.0

# Developmental parameters
development_stage = "Adult"
development_plasticity_factor = 0.2
replay_interval = 100
consolidation_interval = 1000
