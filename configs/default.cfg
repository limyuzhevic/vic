#config.toml

# NLM (熙然) - Neural Learning Machine Configuration
# Phase 6: Final Integration

# Basic simulation settings
[simulation]
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15

# Neural dynamics settings
[neural_dynamics]
# LIF neuron parameters
lif_resting_potential = -70.0
lif_threshold = -55.0
lif_reset_potential = -70.0
lif_leak_conductance = 10.0
lif_refractory_period = 9

# Plasticity settings
[plasticity]
# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian plasticity parameters
hebbian_learning_rate = 0.01

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory system settings
[memory]
working_memory_capacity = 1000
episodic_memory_capacity = 1000
associative_memory_capacity = 1000

# Neuromodulation settings
[neuromodulation]
# Reward prediction error
rpe_learning_rate = 0.01

# Curiosity parameters
curiosity_decay_rate = 0.001
curiosity_threshold = 0.5

# Novelty detection
novelty_threshold = 0.1

# Development settings
[development]
developmental_stage_duration = 1000
plasticity_decay_rate = 0.001
excitability_growth_rate = 0.01

# Environment settings
[environment]
width = 16
height = 16
vision_width = 16
vision_height = 16
max_energy = 100
energy_decay_rate = 0.01

# Agent behavior settings
[agent]
reward_modulation = true
structural_plasticity = true
development = true
curiosity = true

# Simulation control
[control]
max_steps = 10000
checkpoint_interval = 1000
replay_interval = 100
consolidation_interval = 1000
