# NLM Configuration File
# This is the default configuration for Phase 6: Integrated Artificial Brain

# Basic simulation parameters
simulation_timestep = 0.001
random_seed = 42
neuron_count = 5000
region_count = 4
connection_probability = 0.15

# Neural connectivity
intra_region_connection_probability = 0.2
inter_region_connection_probability = 0.05
average_delay = 2
synaptic_weight_range = 0.5

# Plasticity rules
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.012
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_stdp_tau = 20.0

# Structural plasticity
structural_plasticity_rate = 0.0002
pruning_rate = 0.00001

# Development system
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002
development_maturation_rate = 0.8
development_critical_period_end = 1000

# Neuromodulation
dopamine_baseline = 0.1
dopamine_learning_rate = 0.05
dopamine_plasticity_factor = 0.8
curiosity_baseline = 0.05
curiosity_learning_rate = 0.03
novelty_threshold = 0.7
prediction_error_baseline = 0.0

# Reward processing
reward_discount_factor = 0.95
reward_prediction_error_rate = 0.1

# Memory systems
working_memory_capacity = 500
working_memory_decay_rate = 0.02
working_memory_reinforcement_rate = 0.1
episodic_memory_max_episodes = 2000
episodic_memory_consolidation_interval = 500
episodic_memory_replay_interval = 100
associative_memory_strength = 0.8
associative_memory_forget_rate = 0.001

# Prediction system
prediction_window = 20
prediction_accuracy_threshold = 0.7
prediction_error_decay = 0.95
prediction_learning_rate = 0.03

# Cognitive systems
planning_depth = 8
planning_confidence_threshold = 0.6
concept_formation_threshold = 0.5
concept_formation_decay = 0.98
attention_inhibition_strength = 0.6
attention_excitation_strength = 1.8
attention_focus_decay = 0.9

# Attention and selection
selection_threshold = 0.4
competition_strength = 1.2

# Development stages
developmental_stage = "Adult"
development_plasticity_modulation = 0.2

# Environment and perception
environment_name = ComplexWorld
environment_width = 20
environment_height = 20
observation_noise = 0.1
sensory_input_range = 10.0

# Simulation settings
max_simulation_steps = 50000
simulation_time_limit = 1000.0
checkpoint_interval = 10000
enable_auto_checkpoint = true

# Logging and debugging
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log
log_memory_stats = true
log_prediction_stats = true
log_development_stats = true

# Advanced features
enable_experimental_neuromodulation = true
enable_structural_plasticity = true
enable_replay_learning = true
enable_consolidation = true
enable_predictive_coding = true
enable_social_learning = true
enable_self_modeling = true

# Performance settings
use_memory_pools = true
use_vectorization = true
use_async_processing = true
max_threads = 4

# Visualization
visualization_enabled = true
visualization_update_rate = 30.0
visualization_scale = 1.0
visualization_show_synapses = true
visualization_show_memory = true
visualization_show_predictions = true

# Experimental and debugging features
enable_debug_mode = false
enable_profiling = false
enable_detailed_logging = false
enable_performance_monitoring = true

# Legacy parameters (kept for backward compatibility)
plasticity_learning_rate = 0.02
reward_discount_factor = 0.95
