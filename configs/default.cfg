# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Reward-modulated STDP (R-STDP) settings
reward_modulated_learning_rate = 0.001
reward_modulation_strength = 1.0

# Triplet STDP settings
triplet_ltp_weight = 0.005
triplet_ltd_weight = 0.012
triplet_time_constant = 20.0
triplet_a1 = 0.002  # Pre-before-post potentiation (triplet)
triplet_a2 = 0.001  # Post-after-pre potentiation (triplet)
triplet_b1 = 0.01   # Pre-before-post depression (triplet)
triplet_b2 = 0.012  # Post-after-pre depression (triplet)

# Anti-Hebbian settings
antihebbian_learning_rate = 0.005
antihebbian_depression_factor = 1.0

# BCM rule settings
bc_learning_rate = 0.002
bc_threshold = 0.5
bc_threshold_minus = 0.1
bc_threshold_plus = 2.0

# Structural plasticity settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
neuromodulation_scale = 1.0

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error = 0.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# Development settings
development_enabled = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0