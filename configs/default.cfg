# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation
# Contains settings for a functioning spiking neural network

# ============================================================================
# CORE SIMULATION PARAMETERS
# ============================================================================

# Random seed for reproducible experiments and debugging
# Recommendation: Set to 42 for initial development, 0 for time-based randomness
random_seed = 42

# Simulation timestep in seconds
# Recommendation: Use 0.001ms for fine-grained control, larger for performance
# Critical: Must be small enough for stable LIF integration (typically <= 0.001s)
simulation_timestep = 0.001

# Number of neurons in the brain
# Recommendation: Start with 500 for testing, 1000-5000 for production
# Scaling: Each neuron requires ~1-2KB of memory
neuron_count = 500

# Number of brain regions
# Recommendation: Start with 1 for simple networks, 2-4 for complex topologies
region_count = 1

# ============================================================================
# NEURAL CONNECTIVITY
# ============================================================================

# Connection probability for random connectivity
# Recommendation: 0.1-0.3 for moderate connectivity, 0.01-0.05 for sparse networks
# Impact: Higher values increase computation time but enable more complex dynamics
connection_probability = 0.15

# ============================================================================
# PLASTICITY RULES
# ============================================================================

# Overall plasticity learning rate (global scaling factor)
# Range: 0.0-1.0, where 1.0 is maximum learning rate
plasticity_learning_rate = 0.01

# STDP (Spike-Timing-Dependent Plasticity) parameters
# Critical for learning and memory formation

# Long-Term Potentiation weight (positive, strengthens synapses)
# Recommendation: 0.01-0.05, affects learning speed and stability
stdp_ltp_weight = 0.02

# Long-Term Depression weight (negative, weakens synapses)
# Recommendation: 0.01-0.05, maintains synaptic balance
stdp_ltd_weight = 0.015

# STDP time constant in milliseconds
# Recommendation: 10-30ms, affects temporal window for spike pairing
stdp_time_constant = 20.0

# ============================================================================
# DEVELOPMENTAL PLASTICITY
# ============================================================================

# Synaptogenesis rate (formation of new connections)
# Recommendation: 0.0001-0.01, starts low and may increase during development
development_synaptogenesis_rate = 0.0001

# Pruning rate (elimination of weak connections)
# Recommendation: 0.00001-0.001, typically lower than synaptogenesis rate
development_pruning_rate = 0.00001

# ============================================================================
# NEUROMODULATION SYSTEMS
# ============================================================================

# Dopamine baseline level (affects reward prediction and learning)
# Range: 0.0-1.0, where higher values increase exploration
dopamine_baseline = 0.1

# ============================================================================
# REWARD AND LEARNING
# ============================================================================

# Reward discount factor (temporal discounting)
# Recommendation: 0.9-0.99, closer to 1.0 for longer-term planning
reward_discount_factor = 0.99

# ============================================================================
# ENVIRONMENT AND SIMULATION
# ============================================================================

# Environment name for simulation
# Available: GridWorld, ContinuousSpace, NetworkWorld, etc.
environment_name = GridWorld

# Environment dimensions (width, height)
# Recommendation: Start with 10x10 for testing, scale up for complex tasks
environment_width = 10
environment_height = 10

# ============================================================================
# LOGGING AND MONITORING
# ============================================================================

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
# Recommendation: INFO for production, DEBUG for development
log_level = INFO

# Enable logging to file
# Set to true for production, false for real-time monitoring
log_to_file = false

# Log filename (used when log_to_file = true)
log_filename = nlm_simulation.log

# ============================================================================
# SIMULATION CONTROL
# ============================================================================

# Maximum number of simulation steps
# Recommendation: 10000 for 10-second simulation at 0.001s timestep
max_simulation_steps = 10000

# Simulation time limit in seconds
# Set to 0.0 for unlimited runtime
simulation_time_limit = 0.0

# ============================================================================
# ADVANCED FEATURES
# ============================================================================

# Enable checkpoint system for simulation recovery
checkpoint_enabled = true
checkpoint_interval = 1000
checkpoint_dir = ./checkpoints

# Enable visualization (requires graphical display)
visualization_enabled = false
visualization_update_rate = 30.0  # Hz

# ============================================================================
# VALIDATION RULES
# ============================================================================

# These values should be validated during configuration loading
# ConfigLoader should check:
# - All required keys are present
# - Numeric values are within acceptable ranges
# - String values match allowed choices
# - No duplicate keys exist (this config now has unique keys)

