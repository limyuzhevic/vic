# ========== ADVANCED PLASTICITY SETTINGS ==========
# Long-term potentiation (LTP) weight scaling factor
stdp_ltp_weight = 0.01
# Long-term depression (LTD) weight scaling factor
stdp_ltd_weight = 0.012
# STDP time constant for spike timing differences (ms)
stdp_time_constant = 20.0
# STDP eligibility trace decay rate
stdp_eligibility_decay = 0.95
# Hebbian learning rate (for correlated activity)
hebbian_learning_rate = 0.001
# Structural plasticity strength factor
structural_plasticity_strength = 0.1

# ========== MEMORY SYSTEM SETTINGS ==========
# Working memory capacity as fraction of total neurons
working_memory_capacity_fraction = 0.1
# Episodic memory maximum number of episodes
episodic_memory_max_episodes = 1000
# Associative memory pattern threshold
associative_memory_pattern_threshold = 0.8
# Memory replay interval (steps)
memory_replay_interval = 100
# Memory consolidation interval (steps)
memory_consolidation_interval = 1000

# ========== PREDICTION SYSTEM SETTINGS ==========
# Prediction error threshold for learning
prediction_error_threshold = 0.5
# Prediction system update rate
prediction_update_rate = 0.1
# Sensory prediction accuracy threshold
prediction_accuracy_threshold = 0.9

# ========== NEUROMODULATION SETTINGS ==========
# Dopamine baseline level (modulates reward sensitivity)
dopamine_baseline = 0.1
# Dopamine learning rate for reward prediction error
dopamine_learning_rate = 0.05
# Curiosity exploration bonus weight
curiosity_bonus_weight = 0.2
# Novelty detection sensitivity
novelty_sensitivity = 0.3
# Prediction error sensitivity
prediction_error_sensitivity = 0.4

# ========== DEVELOPMENT SYSTEM SETTINGS ==========
# Critical period strength (earlier development)
critical_period_strength = 1.0
# Synaptogenesis rate during early development
early_development_synaptogenesis_rate = 0.005
# Pruning rate during early development
early_development_pruning_rate = 0.0005
# Maturation acceleration factor
maturation_acceleration = 1.2

# ========== ADVANCED LOGGING SETTINGS ==========
# Enable detailed performance metrics logging
enable_performance_logging = true
# Performance log update interval (steps)
performance_log_interval = 100
# Enable event-driven logging (per spike/synaptic event)
enable_event_logging = false
# Log file rotation size (MB)
log_rotation_size_mb = 100
# Log retention days
log_retention_days = 7

# ========== PERFORMANCE TUNING ==========
# Number of synaptic delivery threads
synaptic_delivery_threads = 4
# Enable optimized spike delivery
enable_optimized_spike_delivery = true
# Spike delivery batch size
spike_delivery_batch_size = 100
# Enable neural connectivity caching
cache_connectivity = true
# Connectivity cache refresh rate (steps)
connectivity_cache_refresh = 500

# ========== LEARNING AND CURIOCITY SETTINGS ==========
# Exploration vs exploitation balance (0=exploit, 1=explore)
exploration_balance = 0.3
# Curiosity threshold for novel stimuli
curiosity_threshold = 0.7
# Reward prediction error decay rate
reward_pe_decay_rate = 0.99
# Enable intrinsic motivation
enable_intrinsic_motivation = true

# ========== NOVELTY DETECTION SETTINGS ==========
# Novelty detection smoothing factor
novelty_smoothing_factor = 0.9
# Minimum novelty score for significant discovery
minimum_novelty_score = 0.5
# Novelty persistence threshold
novelty_persistence_threshold = 0.6

# ========== EPISODIC MEMORY SETTINGS ==========
# Episodic memory encoding strength
episodic_encoding_strength = 0.8
# Episodic memory replay strength
episodic_replay_strength = 0.7
# Episodic memory consolidation threshold
episodic_consolidation_threshold = 0.9
# Enable temporal compression in episodic memory
enable_temporal_compression = true

# ========== SIMULATION CONTROL ==========
# Enable structural plasticity (synaptogenesis/pruning)
enable_structural_plasticity = true
# Enable developmental plasticity
enable_developmental_plasticity = true
# Enable reward-based neuromodulation
enable_reward_modulation = true
# Enable curiosity-driven exploration
enable_curiosity = true
# Enable novelty detection
enable_novelty = true

# ========== ADVANCED BEHAVIORAL SETTINGS ==========
# Agent action selection strategy (random/greedy/epsilon_greedy/boltzmann)
action_selection_strategy = boltzmann
# Boltzmann temperature for action selection
boltzmann_temperature = 1.0
# Enable action planning
enable_action_planning = true
# Planning depth (number of steps ahead)
planning_depth = 5
# Enable concept formation
enable_concept_formation = true
# Concept formation threshold
concept_formation_threshold = 0.8

# ========== DEBUGGING AND TESTING ==========
# Enable debug logging mode
enable_debug_mode = false
# Test mode neuron count (0 = normal simulation)
test_mode_neuron_count = 0
# Enable stress testing mode
enable_stress_testing = false
# Stress test spike rate multiplier
stress_test_spike_multiplier = 2.0
