# NLM Configuration File
# This is the default configuration for Phase 6: Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
novelty_baseline = 0.05
curiosity_baseline = 0.05
prediction_error_baseline = 0.0

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Memory settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_threshold = 0.3

# Prediction system
prediction_error_threshold = 0.5
prediction_decay_rate = 0.1

# Cognitive systems
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_formation_threshold = 0.4
concept_category_count = 10
planner_planning_depth = 5
planner_exploration_rate = 0.2

# Development
development_initial_plasticity = 1.0
development_critical_period_plasticity = 0.8
development_maturation_plasticity = 0.5
development_adult_plasticity = 0.2

# Checkpointing
checkpoint_dir = ./checkpoints
checkpoint_save_interval = 10000
checkpoint_max_count = 10
checkpoint_compress = true

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 experiment specific settings
experiment_neuron_count = 500
experiment_max_steps = 2000
experiment_enable_development = true
experiment_enable_replay = true
experiment_enable_checkpointing = true
