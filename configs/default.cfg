# Configuration for NLM Phase 6 Integration Demo

## Overview

This document describes the configuration options available for the NLM Phase 6 Integration Demo. The configuration system allows users to customize the demo parameters without modifying the source code.

## Configuration Files

### 1. Default Configuration (configs/default.cfg)

The default configuration contains standard settings for the Phase 6 demo:

```ini
# Default configuration for Phase 6 integration demo

# Simulation parameters
neuron_count = 500
region_count = 1
connection_probability = 0.15
random_seed = 42
simulation_timestep = 0.001

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Demo parameters
replay_interval = 100
consolidation_interval = 1000

# Memory parameters
working_memory_capacity = 50  # neurons
episodic_memory_max_episodes = 1000

# Development parameters
enable_development = true
development_stage = Initial

# Neuromodulation parameters
enable_reward_modulation = true
enable_curiosity = true
enable_novelty = true
```

