# NLM Configuration File
# Enhanced configuration for Phase 2 Real Neural Computation
# Advanced users can modify these settings for custom experiments

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced configuration options
# Neural properties
v_thresh = -50.0          # Neuron threshold potential (mV)
v_rest = -70.0            # Resting potential (mV)
v_reset = -75.0           # Reset potential after spike (mV)
tau_mem = 20.0            # Membrane time constant (ms)
tau_ref = 2.0             # Refractory period (ms)

# Plasticity advanced settings
hebbian_learning_rate = 0.005
stdp_tau_plus = 20.0       # STDP time constant for potentiation (ms)
stdp_tau_minus = 20.0      # STDP time constant for depression (ms)
stdp_lambda = 1.0         # STDP weight normalization factor

# Structural plasticity
synaptogenesis_rate = 0.001
pruning_rate = 0.0001
max_synapses_per_neuron = 50

# Development parameters
developmental_stage_0_end = 60.0        # Initial stage duration
developmental_stage_1_end = 300.0       # Critical period duration  
developmental_stage_2_end = 900.0       # Maturation duration
plasticity_decay_factor = 0.95          # Plasticity decay over time

# Neuromodulation parameters
dopamine_scale = 1.0
curiosity_scale = 1.0
novelty_scale = 1.0
prediction_error_scale = 1.0

# Working memory parameters
working_memory_capacity = 100
working_memory_decay = 0.95

# Episodic memory parameters
max_episodes = 1000
episode_decay = 0.9
replay_frequency = 0.1

# Prediction system
prediction_accuracy_threshold = 0.7
prediction_confidence_threshold = 0.5

# Cognition parameters
planning_horizon = 5
attention_focus_size = 10
concept_learning_rate = 0.01

# Agent behavior parameters
exploration_rate = 0.1
curiosity_threshold = 0.3
novelty_threshold = 0.5
reward_scaling = 1.0

# Performance optimization
simd_enabled = true
event_driven_simulation = true
memory_pooling = true
thread_pool_size = 4

# Checkpoint and replay
checkpoint_format = "binary"
checkpoint_compression = "gzip"
replay_speed_factor = 1.0
replay_target_episodes = 10
