# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_scale = 1.0
curiosity_enable = true
novelty_enable = true

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Memory system settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_size = 10000

# Prediction system settings
prediction_error_threshold = 0.1
prediction_confidence_threshold = 0.7

# Curiosity settings
curiosity_decay_rate = 0.99
novelty_threshold = 0.2

# Development settings
development_critical_period_start = 60.0
development_critical_period_end = 300.0
critical_period_plasticity_multiplier = 0.8

# Feature flags
enable_advanced_plasticity = true
enable_structural_plasticity = true
enable_reward_modulation = true
enable_curiosity_driven = true
enable_developmental_model = true
enable_memory_replay = true

# Checkpoint settings
checkpoint_interval = 1000
checkpoint_compression = Balanced
checkpoint_max_files = 5

# Experiment settings
experiment_duration = 1000
experiment_save_interval = 100
experiment_log_level = INFO

# Neural parameters
neuron_threshold = -50.0
neuron_reset_potential = -75.0
neuron_resting_potential = -70.0
neuron_time_constant = 20.0
neuron_refractory_period = 2.0

# Synaptic parameters
synaptic_weight_range = [0.01, 0.5]
synaptic_delay_range = [1, 10]
synaptic_pruning_threshold = 0.001

# Visualization parameters
vision_width = 16
vision_height = 16
touch_sensor_count = 8
internal_signal_count = 4
proprioception_sensor_count = 6

# Agent parameters
agent_vision_width = 16
agent_vision_height = 16
agent_movement_speed = 1.0
agent_max_energy = 100.0
agent_energy_decay = 0.01
