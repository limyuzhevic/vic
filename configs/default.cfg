# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration
# 
# Provides balanced settings for demonstration and testing

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
# Use smaller timestep for accuracy, larger for speed
simulation_timestep = 0.001

# Number of neurons in the brain
# Phase 6 can handle more neurons due to optimizations
neuron_count = 1000

# Number of brain regions
# More regions allow for distributed processing
region_count = 2

# Connection probability for random connectivity
# Controls network sparsity vs density
connection_probability = 0.1

# Plasticity settings
# STDP (Spike-Timing Dependent Plasticity) parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings for Phase 6
# Synaptogenesis: creation of new synapses
development_synaptogenesis_rate = 0.001
# Pruning: elimination of weak synapses
development_pruning_rate = 0.0001

# Neuromodulation settings
# Dopamine baseline level for reward processing
dopamine_baseline = 0.1
# Serotonin baseline level for mood/learning
dopamine_modulation = 0.0  # Additional modulation factor

# Reward settings
# How much future rewards are discounted
reward_discount_factor = 0.99

# Environment settings
# Default world type
environment_name = GridWorld
# World dimensions for grid-based environments
environment_width = 10
environment_height = 10

# Logging settings
# Verbosity level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Whether to write logs to file
log_to_file = false
# Log file name
log_filename = nlm.log

# Simulation settings
# Maximum number of simulation steps
max_simulation_steps = 10000
# Time limit for simulation (0 = no limit)
simulation_time_limit = 0.0

# Phase 6 specific settings
# Enable working memory for short-term information
enable_working_memory = true
# Maximum number of working memory traces
working_memory_capacity = 100
# Enable episodic memory for experience storage
enable_episodic_memory = true
# Maximum number of episodes to store
max_episodes = 1000
# Enable prediction system for forward modeling
enable_prediction = true
# Enable neuromodulation systems
enable_neuromodulation = true
# Enable developmental processes
enable_development = true
# Enable curiosity-driven exploration
enable_curiosity = true
# Enable novelty detection
enable_novelty = true

# Visualization settings
# Enable graphical visualization
visualization_enabled = false
# Target frames per second for visualization
visualization_update_rate = 30.0
# Visualization window size
visualization_width = 1024
visualization_height = 768

# Checkpointing settings
# Enable checkpoint saving for recovery
enable_checkpointing = true
# Checkpoint file path
checkpoint_path = ./checkpoints/nlm_checkpoint.bin
# Maximum number of checkpoints to keep
max_checkpoints = 10
# Checkpoint interval (steps between saves)
checkpoint_interval = 1000

# Performance settings
# Use SIMD optimizations if available
enable_simd = true
# Use memory pools for allocation efficiency
enable_memory_pools = true
# Event-driven processing flag
enable_event_driven = true
