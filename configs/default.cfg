# NLM Phase 6 Configuration File
# Default configuration for NLM Phase 6 Integration Test
# This file contains the default settings for the Neural Learning Machine

# Random seed for reproducible simulations
random_seed = 42

# Simulation timestep in seconds (smaller = more precise but slower)
simulation_timestep = 0.001

# Number of neurons in the simulation (default: 500 for quick testing)
neuron_count = 500

# Number of neural regions (default: 1 for simple configuration)
region_count = 1

# Probability of connection between neurons (default: 0.15 for sparse connectivity)
connection_probability = 0.15

# STDP (Spike-Timing-Dependent Plasticity) parameters
# LTP weight: synaptic strengthening when pre-synaptic neuron fires before post-synaptic
stdp_ltp_weight = 0.02

# LTD weight: synaptic weakening when pre-synaptic neuron fires after post-synaptic
stdp_ltd_weight = 0.015

# STDP time window tau: how long the timing matters (in simulation steps)
stdp_tau = 20.0

# Structural plasticity parameters
# Synaptogenesis rate: probability of new synapse formation per step per neuron
synaptogenesis_rate = 0.0001

# Pruning rate: probability of synapse removal per step per neuron
pruning_rate = 0.00001

# Optional: Development parameters (if enabled)
# developmental_stage_duration = 1000.0
# plasticity_modifier = 1.0