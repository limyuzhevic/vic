# NLM Configuration File
# This is the default configuration for NLM Phase 2: Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (typically 1ms for LIF neurons)
simulation_timestep = 0.001

# Number of neurons in the brain (default: 1000, can be adjusted for performance)
neuron_count = 1000

# Number of brain regions (default: 2, enables distributed computation)
region_count = 2

# Connection probability for random connectivity (default: 0.15 for moderate connectivity)
connection_probability = 0.15

# Plasticity settings for synaptic learning
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
hebbian_learning_rate = 0.001

# Development settings for brain maturation over time
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings for reward and curiosity signals
dopamine_baseline = 0.1
dopamine_peak = 1.0
dopamine_decay_rate = 0.1
dopamine_release_rate = 1.0

curiosity_baseline = 0.01
curiosity_sensitivity = 1.0
novelty_threshold = 0.1

# Reward settings for reinforcement learning
reward_discount_factor = 0.99
reward_expection_window = 10.0

# Environment settings for embodied agents
environment_name = GridWorld
environment_width = 20
environment_height = 20
vision_width = 8
vision_height = 8
vision_channels = 3

# Logging settings for debugging and monitoring
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_timestamp = true

# Simulation settings for experiment control
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings for monitoring and debugging
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output = console
visualization_file = visualization_data.csv

# Performance optimization settings
enable_vectorization = true
enable_parallel_processing = false
parallel_threads = 0
memory_pool_size = 2097152  # 2MB for event queues
enable_sparse_connectivity = false

# Advanced neural parameters
neuron_resting_potential = -70.0
neuron_threshold = -55.0
neuron_reset_potential = -75.0
neuron_refractory_period = 5
neuron_leak_conductance = 10.0

# Synapse parameters
synapse_max_weight = 1.0
synapse_min_weight = -1.0
synapse_delay_steps = 1

# Memory system parameters
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_capacity = 500

# Developmental stage parameters
critical_period_start = 60.0
critical_period_end = 300.0
maturation_start = 300.0
maturation_end = 600.0

# Experiment control parameters
experiment_random_seed = 12345
trial_repeats = 5
performance_measurements = true
export_metrics = false
