// Configuration file for NLM project

name = "NLM (Neural Learning Machine)"
description = "An experimental artificial developmental brain"
version = "6.0.0"

[brain]
neuron_count = 500
region_count = 1
connection_probability = 0.15
random_seed = 42
simulation_timestep = 0.001

[plasticity]
stdp_enabled = true
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
hebbian_enabled = true
structural_enabled = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

[neuromodulation]
dopamine_enabled = true
curiosity_enabled = true
novelty_enabled = true
prediction_error_enabled = true

[memory]
working_memory_capacity = 50
episodic_memory_capacity = 1000
associative_memory_enabled = true

[cognition]
planner_enabled = true
concept_formation_enabled = true
attention_enabled = true

[development]
initial_plasticity = 1.0
critical_period_plasticity = 0.8
maturation_plasticity = 0.5
adult_plasticity = 0.2

[simulation]
max_steps = 10000
checkpoint_interval = 1000
replay_interval = 100
consolidation_interval = 10000
enable_checkpointing = true
enable_replay = true
enable_development = true

[output]
log_level = "info"
log_file = "nlm.log"
verbose_logging = false

[advanced]
enable_sensory_noise = false
enable_motor_noise = false
enable_structural_plasticity = true
enable_curiosity_driven_exploration = true
enable_novelty_detection = true
enable_prediction_error = true
