# NLM Configuration File
# Phase 6: Final Integration Configuration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings (Phase 6)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_maturation_rate = 0.005

# Neuromodulation settings (Phase 6)
dopamine_baseline = 0.0
dopamine_scale = 1.0
curiosity_threshold = 0.1
novelty_threshold = 0.05

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_enabled = true

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 2000
simulation_time_limit = 0.0

# Memory settings (Phase 6)
working_memory_capacity = 100
episodic_memory_capacity = 500
consolidation_interval = 1000
replay_interval = 100

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 specific options
enable_checkpointing = true
checkpoint_path = ./nlm_checkpoint.bin
enable_replay = true
enable_development = true
enable_curiosity = true
enable_novelty_detection = true
