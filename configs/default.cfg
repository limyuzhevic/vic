# Neuromodulation settings
dopamine_baseline = 0.0

# Reward settings
reward_discount_factor = 0.99
reward_decay_rate = 0.95

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_obstacle_density = 0.1

# Memory settings
working_memory_capacity = 100
episodic_memory_capacity = 50
associative_memory_capacity = 200

# Development settings
development_stage = 1
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_maturation_rate = 0.0005

# Neuromodulation detailed settings
curiosity_baseline = 0.0
curiosity_sensitivity = 0.1
novelty_threshold = 0.5
novelty_decay_rate = 0.95
prediction_error_scaling = 0.1

# Learning parameters
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
stdp_trace_decay = 0.9
hebbian_enabled = true
structural_plasticity_enabled = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval = 1000
restore_checkpoint = false
checkpoint_file = brain_checkpoint.nlm

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output_file = nlm_visualization.html

# Performance settings
simd_enabled = true
parallel_processing_enabled = false
sparse_connectivity_enabled = true
memory_pool_size = 1000
event_queue_size = 10000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_max_size = 10485760
log_rotation_count = 5

# Agent system settings
agent_sensory_resolution = 64
agent_motor_range = 10
agent_action_space = 4
agent_exploration_rate = 0.1
agent_exploitation_rate = 0.9

# Experiment settings
experiment_type = basic
experiment_seed = 42
experiment_max_steps = 1000
experiment_reward_threshold = 100

