# NLM Phase 2 Configuration File
# Basic Settings
random_seed = 42
# Random seed for reproducible simulations

simulation_timestep = 0.001
# Time step for simulation in seconds

neuron_count = 500
# Total number of neurons in the network

region_count = 1
# Number of neural regions

connection_probability = 0.15
# Probability of synaptic connections between neurons

# STDP Parameters
stdp_ltp_weight = 0.02
# STDP Long-Term Potentiation weight

stdp_ltd_weight = 0.015
# STDP Long-Term Depression weight

stdp_tau = 20.0
# STDP time constant in milliseconds

# Structural Plasticity Parameters
synaptogenesis_rate = 0.0001
# Rate of new synapse formation (per second)

pruning_rate = 0.00001
# Rate of synapse elimination (per second)

# Additional Configuration (commented out for reference)
# log_level = INFO
# log_file = "nlm.log"
# enable_learning = true
# enable_visualization = false
