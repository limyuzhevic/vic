# NLM Default Configuration File
# This file provides the default configuration for NLM Phase 6 integration experiment
#

# Basic simulation parameters
neuron_count = 1000
region_count = 1
connection_probability = 0.1
simulation_timestep = 0.001
random_seed = 42

# Synaptic plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Structural plasticity parameters (development)
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory system parameters
working_memory_capacity = 100
max_episodes = 1000
replay_interval = 100
consolidation_interval = 1000

# Neuromodulation parameters
dopamine_sensitivity = 1.0
curiosity_weight = 0.5
novelty_decay = 0.99
prediction_error_tau = 10.0

# Cognitive system parameters
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_similarity_threshold = 0.7

# Development parameters
initial_plasticity = 1.0
critical_period_plasticity = 0.8
maturation_plasticity = 0.5
adult_plasticity = 0.2

# Simulation parameters
max_steps = 10000
enable_replay = true
enable_development = true
enable_structural_plasticity = true
enable_prediction = true
enable_cognition = true

# Output and checkpoint parameters
checkpoint_path = ./checkpoints
checkpoint_compression = balanced
max_checkpoints = 100
checkpoint_interval = 100

# Logging parameters
log_level = info
log_file = nlm.log
verbose = false

# Agent parameters
agent_curiosity_enabled = true
agent_reward_modulation_enabled = true
agent_structural_plasticity_enabled = true
agent_development_enabled = true
agent_social_learning_enabled = false
