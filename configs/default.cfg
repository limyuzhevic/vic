# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# --- ADVANCED CONFIGURATION OPTIONS FOR ADVANCED USERS ---

# Memory System Capacity
# Size of working memory (number of neural patterns maintained)
working_memory_size = 1000
# Maximum number of episodic memories to store
max_episodic_episodes = 1000

# Development Parameters
# When critical period starts (in milliseconds)
critical_period_start = 100.0
# Rate at which the brain matures (0.0-1.0)
maturation_rate = 0.5
# Developmental stage transitions (comma-separated list)
developmental_stage_transitions = 100.0,500.0,1000.0
# Factor for aging-related degradation (0.0-1.0)
aging_factor = 0.1

# Neuromodulation Parameters
# Scale of dopamine signal influence on plasticity (0.0-10.0)
dopamine_scale = 1.0
# Sensitivity to novel stimuli (curiosity) (0.0-10.0)
curiosity_sensitivity = 1.0

# Prediction System Parameters
# Number of timesteps into the future to predict
prediction_horizon = 10
# Confidence threshold for accepting predictions (0.0-1.0)
prediction_confidence_threshold = 0.8

# Structural Plasticity Parameters
# Probability of new synapse formation (0.0-1.0)
synaptogenesis_probability = 0.001
# Threshold for synaptic pruning (0.0-1.0)
pruning_threshold = 0.1

# Attention System Parameters
# Strength of inhibitory connections (0.0-100.0)
inhibition_strength = 1.0
# Strength of excitatory connections (0.0-100.0)
excitation_strength = 1.0

# Concept Formation Parameters
# Similarity threshold for discovering new patterns (0.0-1.0)
pattern_discovery_threshold = 0.7

# Planning Parameters
# Maximum depth of planning search
planning_depth = 5
# Complexity of planning search (higher = more exhaustive)
planning_complexity = 50

# Learning Parameters
# Base learning rate (0.0-1.0)
learning_rate = 0.1
# Decay constant for memory (0.0-1.0)
decay_constant = 0.99
