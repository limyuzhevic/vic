# NLM Default Configuration File
# Phase 2: Real Neural Computation

# Simulation parameters
simulation_timestep = 0.001
max_steps = 10000

# Random seed for reproducible results
random_seed = 42

# Neural network architecture
neuron_count = 1000
region_count = 1
connection_probability = 0.15
initial_weight_mean = 0.5
initial_weight_std = 0.1

# Neuron parameters
v_thresh = -50.0
v_rest = -70.0
v_reset = -75.0
tau_mem = 20.0
tau_ref = 2.0

# Plasticity parameters
stdp_enable = true
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

dopamine_enable = true
dopamine_scale = 1.0

curiosity_enable = true
novelty_enable = true

# Hebbian plasticity
hebbian_enable = true
hebbian_rate = 0.001

# Structural plasticity
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development stages
development_enable = true
critical_period_factor = 2.0
maturation_rate = 0.001

# Memory systems
working_memory_capacity = 100
working_memory_decay = 0.1
episodic_memory_capacity = 1000

# Prediction system
prediction_horizon = 3
prediction_learning_rate = 0.01

# Neuromodulation levels
dopamine_neuromodulation = 1.0
novelty_neuromodulation = 0.5
curiosity_neuromodulation = 0.8

# Debug and logging
log_level = "INFO"
verbose = false
enable_benchmark = false

# World configuration (for Phase 3/4/6 demos)
world_width = 20
world_height = 20
vision_width = 8
vision_height = 8
max_energy = 100.0
energy_decay_rate = 0.1