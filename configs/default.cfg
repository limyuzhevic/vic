# NLM Configuration File
# This is the default configuration for Phase 6 integration
# All values use standardized constants from the Constants header

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (from SimulationConstants)
simulation_timestep = 0.001

# Number of neurons in the brain (can be overridden by performance mode)
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15f

# Plasticity settings
plasticity_learning_rate = 0.01f
stdp_ltp_weight = 0.02f
stdp_ltd_weight = 0.015f
stdp_time_constant = 20.0f

# Development settings
development_synaptogenesis_rate = 0.0001f
development_pruning_rate = 0.00001f

# Neuromodulation settings (fixed duplicate entry)
dopamine_baseline = 0.1f

# Reward settings
reward_discount_factor = 0.99f

# Environment settings
environment_name = GridWorld
environment_width = 16
environment_height = 16

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 2000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0f
