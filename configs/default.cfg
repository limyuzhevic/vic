# NLM Configuration File
# This is the default configuration for Phase 6: Integrated Artificial Brain
# Includes advanced features for neural learning and development

# ===== BASIC SIMULATION PARAMETERS =====
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# ===== ADVANCED NEURAL DYNAMICS =====
# Spike system parameters
spike_history_size = 10000  # Maximum spike history entries
spike_processing_threads = 1  # Number of processing threads (0 = auto-detect)

# ===== PLASTICITY SETTINGS =====
# Plasticity learning rate
plasticity_learning_rate = 0.01

# STDP (Spike-Timing-Dependent Plasticity) parameters
stdp_ltp_weight = 0.01     # Long-term potentiation weight
stdp_ltd_weight = 0.012    # Long-term depression weight
stdp_time_constant = 20.0  # STDP time constant (ms)
stdp_enable_triplet_rules = false  # Enable advanced triplet STDP
stdp_enable_reward_modulation = true  # Enable reward-modulated STDP

# Hebbian learning parameters
hebbian_learning_rate = 0.01
hebbian_enable_covariance_rule = true

# ===== DEVELOPMENT SYSTEM =====
# Structural plasticity parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_enable_activity_dependent = true

# Development stages
development_stage_initial = 0.0    # Initial developmental stage (0.0-1.0)
development_stage_critical_period = 0.3  # Critical period start (0.0-1.0)
development_stage_maturation = 0.6   # Maturation stage (0.0-1.0)
development_stage_adult = 1.0       # Adult stage (stable)

# ===== NEUROMODULATION SYSTEMS =====
# Dopamine system parameters
dopamine_baseline = 0.1

dopamine_learning_rate = 0.01

dopamine_plasticity_factor = 1.0

# Curiosity system parameters
curiosity_exploration_rate = 0.1
curiosity_reward_prediction_error_weight = 0.5

# Novelty detection parameters
novelty_sensitivity = 0.5
novelty_decay_rate = 0.01

# ===== REWARD AND LEARNING =====
# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_enable = true
reward_planning_horizon = 10

# ===== MEMORY SYSTEMS =====
# Working memory capacity
working_memory_capacity = 1000
working_memory_decay_rate = 0.01

# Episodic memory parameters
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_threshold = 0.3

# Associative memory parameters
associative_memory_learning_rate = 0.01
associative_memory_association_strength = 0.8

# ===== PREDICTION SYSTEM =====
# Forward model parameters
prediction_model_enable = true
prediction_error_learning_rate = 0.01
prediction_error_smoothing = 0.9

# ===== COGNITION SYSTEMS =====
# Planning parameters
planning_depth = 5
planning_horizon = 20
planning_exploration_rate = 0.1

# Concept formation
concept_formation_learning_rate = 0.01
concept_threshold = 0.5

# Attention system
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_update_rate = 0.01

# ===== ENVIRONMENT AND WORLD =====
# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_enable_physics = false
environment_noise_level = 0.01

# ===== LOGGING AND MONITORING =====
# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_file_rotation_size = 10485760  # 10MB
log_file_rotation_count = 5
log_enable_console_colors = true
log_enable_performance_metrics = true

# ===== SIMULATION SETTINGS =====
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval = 1000
checkpoint_dir = ./checkpoints
enable_debug_mode = false

# ===== VISUALIZATION =====
# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_output_format = "text"
visualization_output_file = nlm_viz.json
visualization_3d_enabled = false
visualization_auto_save = true

# ===== PERFORMANCE OPTIMIZATIONS =====
# Neural network optimizations
neural_network_enable_vectorization = true
neural_network_enable_async_processing = true
neural_network_thread_pool_size = 4

# Memory management
memory_pool_size = 1024
memory_enable_cache = true
cache_size_multiplier = 2.0
