# NLM Phase 6 Configuration Examples
# ================================
#
# This file contains example configurations for the NLM Phase 6 integration demo.
# Each configuration demonstrates different aspects of the integrated brain system.
#
# Usage:
#   Copy the desired configuration to "configs/my_config.cfg" and run:
#   ./nlm --config configs/my_config.cfg
#

# Basic Configuration
# -----------------
# This is a minimal configuration that works for most basic demonstrations.
[basic]
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15

stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

enable_checkpointing = false
enable_replay = false
enable_development = false

# Quick Test Configuration
# ---------------------
# This configuration is optimized for fast testing and validation.
[quick_test]
random_seed = 123
simulation_timestep = 0.002
neuron_count = 200
region_count = 2
connection_probability = 0.1

stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 15.0

synaptogenesis_rate = 0.00005
pruning_rate = 0.000005

enable_checkpointing = true
enable_replay = true
enable_development = false
checkpoint_path = "/tmp/nlm_quick_checkpoint.bin"

