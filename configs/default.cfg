# NLM Configuration File Examples
# ================================

# This directory contains example configuration files for the NLM (Neural Learning Machine) project.
# These files demonstrate the configuration system features including:
# - Type-safe configuration values
# - Source priority (Runtime > CommandLine > File > Default)
# - Configuration validation
# - Environment variable loading

# =============================================================================
# Basic Configuration (default.cfg)
# =============================================================================

# Basic simulation parameters
neuron_count = 1000
region_count = 1
connection_probability = 0.1
simulation_timestep = 0.001
random_seed = 42

# STDP plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory system parameters
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 100
episodic_memory_max_episodes = 1000

# Neuromodulation parameters
dopamine_sensitivity = 1.0
curiosity_threshold = 0.3
novelty_decay = 0.99

# Development parameters
developmental_duration = 1000
plasticity_decay_rate = 0.01

# Sensorimotor parameters
vision_width = 16
vision_height = 16
touch_sensitivity = 1.0
internal_signal_range = 1.0

# Agent configuration
agent_brain_motor_strategy = balanced
agent_brain_sensory_strategy = organized
agent_brain_allow_curiosity = true
agent_brain_allow_development = true
agent_brain_reward_modulation = true

# =============================================================================
# Advanced Configuration (advanced.cfg)
# =============================================================================

# This example shows more advanced configuration options including
# environment variables, runtime overrides, and complex data structures

# Basic simulation
neuron_count = 5000
region_count = 4
connection_probability = 0.15
simulation_timestep = 0.0005
random_seed = 12345

# Advanced STDP configuration
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.018
stdp_tau = 25.0
stdp_learning_rate = 0.001

# Structural plasticity with decay
synaptogenesis_rate = 0.00005
pruning_rate = 0.000005
structural_plasticity_enabled = true

# Memory system with custom settings
replay_interval = 50
consolidation_interval = 500
working_memory_capacity = 500
e episodic_memory_max_episodes = 5000
memory_trace_decay = 0.95

# Neuromodulation with adaptive parameters
dopamine_sensitivity = 1.2
curiosity_threshold = 0.5
novelty_decay = 0.98
prediction_error_decay = 0.9

# Development with stages
developmental_duration = 2000
plasticity_decay_rate = 0.005
allow_personality_formation = true
allow_stress_response = true

# Sensory configuration
vision_width = 32
vision_height = 32
vision_sensitivity = 0.8
touch_sensitivity = 1.5
internal_signal_range = 2.0
proprioception_noise = 0.01

# Motor configuration
motor_distribution = balanced
exploration_rate = 0.2
exploitation_rate = 0.8
action_selection_temperature = 1.0

