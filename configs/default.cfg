# Configuration file format support
# This file supports multiple formats:
# 1. INI-style (current format): key = value
# 2. JSON format: {"key": value}
# 3. YAML format (future): key: value
# Values can be:
# - Simple types: integers, floats, booleans, strings
# - Arrays: [1, 2, 3] or ["a", "b", "c"]
# - Nested structures (future): {"subkey": "value"}

# Configuration source tracking
# Each configuration value is annotated with its source:
# - Default: Built-in default values
# - File: Values loaded from this configuration file
# - CommandLine: Values set via command-line arguments
# - Runtime: Values set during runtime

# Configuration validation
# This file can be validated against:
# - Required keys (neuron_count, random_seed, simulation_timestep)
# - Valid ranges (neuron_count > 0, timestep > 0)
# - Format requirements (specific value types per key)

# Configuration inheritance
# This file can inherit from other configuration files:
# - Include: "base_config.cfg"
# - Extend: Add configuration sections
# - Override: Replace specific values

# Configuration templates
# This file can serve as a template for other configurations:
# - [config_name] section headers
# - # comments explaining each parameter
# - Example values for quick setup
# - Documentation links to configuration documentation

# Advanced configuration features (Phase 7)
# These features are planned for future versions:
# - Environment variables support
# - Dynamic configuration reloading
# - Configuration validation rules
