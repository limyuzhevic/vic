# NLM Configuration File
# Phase 1: Core Configuration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
# Dopamine baseline level (set dopamine_baseline = 0.1 in Phase 3+)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 Integration Settings (additional options for final integration)
# Memory system settings
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_capacity = 500

# Neuromodulation system settings
curiosity_sensitivity = 2.0
novelty_threshold = 0.1
prediction_error_weight = 0.5

# Development system settings
initial_plasticity = 1.0
adult_plasticity = 0.2
critical_period_end = 300.0

# Prediction system settings
prediction_horizon = 10
prediction_discount_factor = 0.9

# Cognitive system settings
attention_span = 100
planning_depth = 5
concept_formation_threshold = 0.5

# Checkpointing settings
checkpoint_interval = 1000
checkpoint_compression = true
checkpoint_format = "binary"

# Replay settings
replay_enabled = true
replay_interval = 100
replay_decay_factor = 0.9
