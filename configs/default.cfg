# NLM Configuration File
# Phase 6: Final Integration Configuration
# This is the default configuration for the complete integrated brain.

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (20kHz sampling rate)
simulation_timestep = 0.001

# Number of neurons in the brain (adjust for performance/experiment scale)
neuron_count = 1000

# Number of brain regions (independent computational modules)
region_count = 2

# Connection probability for random connectivity (sparsity control)
connection_probability = 0.1

# ============================================================================
# PLASTICITY SETTINGS
# ============================================================================

# STDP (Spike-Timing Dependent Plasticity) parameters
stdp_ltp_weight = 0.01         # Long-Term Potentiation weight
stdp_ltd_weight = 0.012        # Long-Term Depression weight  
stdp_time_constant = 20.0      # STDP time window (ms)

# Structural plasticity parameters
plasticity_learning_rate = 0.01 # General plasticity learning rate

# Developmental plasticity parameters
development_synaptogenesis_rate = 0.001    # New synapse formation rate
development_pruning_rate = 0.0001         # Synapse elimination rate

# ============================================================================
# NEUROMODULATION SETTINGS
# ============================================================================

# Dopamine system parameters (reward processing)
dopamine_baseline = 0.0       # Base dopamine level
dopamine_reward_gain = 0.1    # Reward sensitivity

# Curiosity system parameters (exploration drive)
curiosity_baseline = 0.05     # Base curiosity level
curiosity_sensing_gain = 0.02 # Novelty detection sensitivity

# Novelty system parameters (change detection)
novelty_threshold = 0.02      # Threshold for detecting novel events

# Prediction error parameters (learning signals)
prediction_error_decay = 0.95 # Prediction error decay factor

# ============================================================================
# MEMORY SYSTEM SETTINGS
# ============================================================================

# Working memory capacity (number of active traces)
working_memory_capacity = neuron_count / 10

# Episodic memory configuration
episodic_memory_max_episodes = 1000        # Maximum stored experiences
episodic_memory_consolidation_interval = 100 # Steps between consolidations

# Associative memory parameters
associative_memory_similarity_threshold = 0.7 # Similarity threshold for associations
associative_memory_max_associations = 5000     # Maximum number of associations

# ============================================================================
# ENVIRONMENT SETTINGS
# ============================================================================

# Environment configuration for world interaction
environment_name = GridWorld
environment_width = 20          # World dimensions (pixels/units)
environment_height = 20

# Sensory processing configuration
sensory_vision_width = 16        # Vision field resolution
sensory_vision_height = 16

# ============================================================================
# LOGGING SETTINGS
# ============================================================================

# Logging configuration
log_level = INFO               # Log level: DEBUG, INFO, WARNING, ERROR
log_to_file = false            # Whether to log to file
log_filename = nlm.log         # Log file name

# ============================================================================
# SIMULATION SETTINGS
# ============================================================================

# Simulation control parameters
max_simulation_steps = 10000   # Maximum simulation steps
simulation_time_limit = 0.0    # Time limit (0 = no limit)

# ============================================================================
# VISUALIZATION SETTINGS
# ============================================================================

# Visualization configuration
visualization_enabled = false  # Enable/disable visualization
visualization_update_rate = 30.0 # FPS for visualization

# ============================================================================
# BEHAVIORAL PARAMETERS
# ============================================================================

# Reward processing
reward_discount_factor = 0.99     # Temporal discounting for rewards
reward_smoothing = 0.1          # Reward smoothing factor

# Action selection
exploration_rate = 0.1           # Random exploration probability
exploitation_rate = 0.9          # Greedy exploitation probability

# ============================================================================
# DEVELOPMENTAL PARAMETERS
# ============================================================================

# Developmental stages
initial_plasticity = 1.0        # High plasticity at birth
critical_period_plasticity = 0.8 # Reduced plasticity during critical period
mature_plasticity = 0.2         # Stable plasticity in adulthood
aging_plasticity = 0.1          # Further plasticity decline in aging

# Reproductive success factor (evolutionary pressure)
reproductive_success_factor = 0.5 # How reward affects reproductive success
