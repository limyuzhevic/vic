# NLM Configuration File Format
# This file defines simulation parameters for the Neural Learning Machine
# Use "nlm --validate-config --config example.cfg" to validate configurations

# Core Network Parameters
neuron_count = 500                    # Total number of neurons (10-100000 recommended)
region_count = 1                      # Number of brain regions
connection_probability = 0.1           # Probability of synaptic connections (0.0-1.0)
random_seed = 42                      # Random seed for reproducible results

# Neuron Dynamics Parameters
neuron_model = "lif"                  # Neuron model: "lif", "alpha", "adaptive"
leak_conductance = 10.0               # Membrane leak conductance (nS)
threshold = -55.0                     # Firing threshold (mV)
resting_potential = -70.0             # Resting potential (mV)
reset_potential = -70.0               # Post-spike reset potential (mV)
refractory_period = 5                 # Refractory period (ms)
adaptation_rate = 0.1                 # Synaptic adaptation rate

# Synaptic Dynamics
plasticity_mode = "both"              # Plasticity: "stdp", "hebbian", "both", "none"
synaptic_delay = 1                    # Default synaptic delay (steps)
inhibition_level = 0.5                # Global inhibition level (0.0-1.0)
weight_bounds = "-1.0,1.0"            # Min and max synaptic weights

# Plasticity Parameters
# STDP (Spike-Timing-Dependent Plasticity)
stdp_ltp_weight = 0.02                 # Long-Term Potentiation weight
stdp_ltd_weight = 0.015                # Long-Term Depression weight
stdp_tau = 20.0                       # STDP time constant (ms)

# Hebbian Plasticity
hebbian_learning_rate = 0.01          # Hebbian learning rate
hebbian_window = 50.0                 # Hebbian time window (ms)

# Structural Plasticity
synaptogenesis_rate = 0.0001          # Rate of new synapse formation
pruning_rate = 0.00001                # Rate of synapse elimination
max_synapses_per_neuron = 100         # Maximum outgoing synapses per neuron

# Neuromodulation
 Dopamine_level = 0.1                 # Baseline dopamine level
 curiosity_rate = 0.05                # Curiosity-driven exploration rate
 novelty_sensitivity = 0.2            # Novelty detection sensitivity
reward_prediction_error = 0.01        # Reward prediction error factor

# Simulation Control
simulation_timestep = 0.001           # Time step duration (seconds)
max_steps = 1000                      # Maximum simulation steps
simulation_mode = "continuous"        # "continuous", "episodic", "batch"

# Memory System
working_memory_capacity = 100          # Number of working memory traces
e episodic_memory_capacity = 1000      # Number of episodic memory episodes
associative_memory_size = 500         # Associative memory capacity
replay_interval = 100                 # Memory replay interval (steps)
consolidation_interval = 1000         # Memory consolidation interval (steps)

# Attention and Cognition
attention_excitation = 1.5            # Attention excitation strength
attention_inhibition = 0.5           # Attention inhibition strength
planning_depth = 5                    # Neural planning depth (steps)
concept_learning_rate = 0.1           # Concept formation learning rate

# Development System
development_mode = "continuous"       # "continuous", "phasic", "paused"
development_rate = 1.0                # Developmental progression rate
critical_period = 100                 # Critical period duration (steps)
maturation_threshold = 0.8            # Maturation completion threshold
adult_plasticity = 0.2               # Adult-stage plasticity level

# Output and Visualization
output_frequency = 10                 # Output snapshot frequency (steps)
log_level = "info"                    # Logging level: "debug", "info", "warning", "error"
checkpoint_interval = 1000            # Checkpoint save interval (steps)
visualize_network = false             # Enable network visualization
export_results = true                 # Export results to files

# Advanced Features
enable_profiling = false              # Enable performance profiling
enable_monitoring = true              # Enable real-time monitoring
trace_memory_usage = false            # Trace memory allocation
record_spike_trains = false           # Record detailed spike trains
analyze_network_topology = true       # Analyze network properties
compute_statistics = true             # Compute statistical summaries

# Custom Presets (for quick configuration)
[preset "small"]
neuron_count = 100
region_count = 1
connection_probability = 0.05
simulation_timestep = 0.001

[preset "medium"]
neuron_count = 1000
region_count = 2
connection_probability = 0.1
simulation_timestep = 0.001

[preset "large"]
neuron_count = 10000
region_count = 5
connection_probability = 0.05
simulation_timestep = 0.002

[preset "high-plasticity"]
synaptogenesis_rate = 0.001
pruning_rate = 0.0001
plasticity_mode = "both"
stdp_ltp_weight = 0.05
stdp_ltd_weight = 0.04

[preset "stable-network"]
synaptogenesis_rate = 0.00001
pruning_rate = 0.00001
plasticity_mode = "stdp"
plasticity_rate = 0.1
inhibition_level = 0.8

# Experiment Presets
[experiment "basic-connectivity"]
simulation_mode = "continuous"
max_steps = 500
plasticity_mode = "none"
output_frequency = 50

[experiment "plasticity-learning"]
simulation_mode = "continuous"
max_steps = 5000
plasticity_mode = "both"
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
replay_interval = 50

[experiment "memory-formation"]
simulation_mode = "episodic"
max_steps = 3000
working_memory_capacity = 200
e episodic_memory_capacity = 2000
consolidation_interval = 100

[experiment "development-study"]
simulation_mode = "continuous"
max_steps = 10000
development_mode = "continuous"
critical_period = 200
maturation_threshold = 0.9

# Visualization Presets
[visual "network-graph"]
output_frequency = 100
visualize_network = true
export_results = true

[visual "activity-plots"]
output_frequency = 50
record_spike_trains = true
analyze_network_topology = true
compute_statistics = true

# Quality of Service (for production use)
[quality "fast"]
max_steps = 1000
simulation_timestep = 0.002
checkpoint_interval = 500
enable_profiling = false

[quality "balanced"]
max_steps = 5000
simulation_timestep = 0.001
checkpoint_interval = 1000
enable_profiling = true

[quality "accurate"]
max_steps = 20000
simulation_timestep = 0.0005
checkpoint_interval = 2000
enable_profiling = true
enable_monitoring = true
