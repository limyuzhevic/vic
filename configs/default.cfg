# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.0
curiosity_baseline = 0.0
novelty_threshold = 0.5
prediction_error_decay = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_scale = 1.0

# Environment settings
environment_name = SimpleWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Experiment settings
experiment_name = default
experiment_description = Default Phase 2 experiment
enable_checkpointing = true
checkpoint_interval = 1000
enable_replay = true
replay_interval = 100
enable_development = true
development_interval = 100

# Memory settings
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_capacity = 1000
procedural_memory_capacity = 100

# Prediction settings
prediction_window = 10
prediction_confidence_threshold = 0.5

# Cognition settings
planning_horizon = 5
attention_span = 20
concept_update_rate = 0.1
