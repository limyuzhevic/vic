# NLM Configuration File Template
# This file contains the default settings for NLM simulations

# Random seed for reproducible experiments
random_seed: 42

# Simulation timestep in seconds (smaller = faster but more detailed)
simulation_timestep: 0.001

# Number of neurons in the brain (more = more complex but slower)
neuron_count: 500

# Number of neural regions (more regions = more complex processing)
region_count: 1

# Probability of synaptic connections between neurons (0.0-1.0)
connection_probability: 0.15

# STDP (Spike-Timing Dependent Plasticity) parameters
stdp_ltp_weight: 0.02      # Long-Term Potentiation weight
stdp_ltd_weight: 0.015     # Long-Term Depression weight
stdp_tau: 20.0            # STDP time constant (ms)

# Structural plasticity parameters
synaptogenesis_rate: 0.0001    # Rate of new synapse formation
pruning_rate: 0.00001          # Rate of synapse elimination
plasticity_learning_rate: 0.01 # Learning rate for plasticity rules

# Max simulation steps (0 = unlimited)
max_simulation_steps: 1000

# Development system parameters
development_stage: "Initial"
development_plasticity_rate: 1.0

# Debug and logging flags
debug_mode: false
verbose_logging: true
log_level: "Info"

# Experimental parameters for Phase 6
enable_checkpointing: true
checkpoint_path: "./nlm_checkpoint.bin"
enable_replay: true
replay_episodes: 10

# Neuromodulation parameters
dopamine_scale: 1.0
curiosity_enabled: true
novelty_threshold: 0.1
prediction_error_weight: 0.5