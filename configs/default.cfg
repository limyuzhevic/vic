# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced configuration options
enable_structural_plasticity = true
enable_development = true
enable_reward_modulation = true
enable_curiosity = true
enable_prediction = true

# Neural parameters
neuron_threshold = -50.0
neuron_reset_potential = -75.0
neuron_resting_potential = -70.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Synapse parameters
initial_weight_mean = 0.5
initial_weight_std = 0.1
max_weight = 1.0
min_weight = 0.0

# Memory system parameters
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_threshold = 0.5

# Agent parameters
agent_max_energy = 100.0
agent_energy_decay_rate = 0.001
agent_sensor_range = 8.0
agent_action_duration = 1.0

# Developmental stages
initial_plasticity_rate = 1.0
critical_period_plasticity = 2.0
adult_plasticity_rate = 0.1
aging_plasticity_rate = 0.05
