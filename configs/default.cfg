# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Neuromodulation fine-tuning
dopamine_sensitivity = 1.0
curiosity_threshold = 0.5
novelty_sensitivity = 1.0
prediction_error_decay = 0.1

# Development system settings
development_critical_period_start = 1000
development_critical_period_end = 5000
development_plasticity_decay_rate = 0.01

# Performance optimization settings
enable_vectorization = true
enable_parallel_processing = false
enable_simd = true
performance_target_fps = 60

# Checkpoint system settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compress = true
checkpoint_max_files = 10

# Replay system settings
replay_interval = 100
replay_episodes = 3
replay_decay_factor = 0.9

# Advanced simulation controls
simulation_max_spikes_per_step = 100
simulation_max_neurons_per_region = 500
simulation_burst_threshold = 0.7
simulation_burst_decay_rate = 0.95

# Sensorimotor settings
sensory_input_range = 10.0
motor_output_scale = 1.0
action_selection_method = "attention"

# Learning and adaptation
adaptation_rate = 0.01
forgetting_rate = 0.001
consolidation_threshold = 0.8

# Debugging and analysis
debug_mode = false
debug_output_file = debug.log
profile_performance = false
enable_stats_collection = true
