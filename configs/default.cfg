# NLM Configuration File
# This is the default configuration for Phase 6: FINAL INTEGRATION

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = SimpleWorld
environment_width = 10
environment_height = 10
environment_vision_width = 8
environment_vision_height = 8

# Memory system settings
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 100
episodic_memory_max_episodes = 1000

# Development system settings
development_stage = "CriticalPeriod"
development_update_interval = 1000

# Checkpoint settings
checkpoint_enabled = true
checkpoint_directory = ./checkpoints
checkpoint_interval = 5000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced NLM Phase 6 settings
# Prediction system
prediction_enabled = true
prediction_confidence_threshold = 0.5

# Cognitive systems
cognitive_planning_enabled = true
cognitive_planning_depth = 5
concept_formation_enabled = true
attention_enabled = true
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Neuromodulation
novelty_enabled = true
curiosity_enabled = true
novelty_threshold = 0.05
curiosity_decay_rate = 0.01

# Structural plasticity
structural_plasticity_enabled = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
maturation_enabled = true

# Memory consolidation
memory_consolidation_enabled = true
consolidation_strength = 0.3
