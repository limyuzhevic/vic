# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation
# Enhanced with better validation and documentation

# Random seed for reproducible experiments
# Range: Any 64-bit integer
random_seed = 42

# Simulation timestep in seconds
# Range: 0.0001 to 1.0, typical values: 0.001, 0.01
simulation_timestep = 0.001

# Number of neurons in the brain
# Range: 100 to 10000
neuron_count = 1000

# Number of brain regions
# Range: 1 to 10
region_count = 2

# Connection probability for random connectivity
# Range: 0.0 to 1.0
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
curiosity_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_exploration_bonus = 0.5

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
world_wall_thickness = 0.1
world_obstacle_density = 0.1

# Logging settings
# Valid values: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
log_level = INFO
log_to_file = false
log_filename = nlm.log
max_log_file_size = 10485760  # 10MB in bytes
log_rotation_count = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_width = 1920
visualization_height = /interface_height = 1080

# Memory management settings
brain_memory_pool_size = 1048576  # 1MB in bytes
neuron_memory_pool_size = 102400  # 100KB in bytes
synapse_memory_pool_size = 51200  # 50KB in bytes

# Performance settings
enable_simd_optimization = true
enable_parallel_processing = false
thread_count = 1

# Developmental settings
min_development_age = 0
max_development_age = 100
development_plasticity_decay = 0.995

# Novelty detection settings
novelty_threshold = 0.5
novelty_history_length = 100
novelty_decay_rate = 0.95

# Curiosity settings
curiosity_exploration_rate = 0.1
curiosity_exploitation_rate = 0.9

# Safety settings
max_weight_value = 1.0
min_weight_value = -1.0
max_membrane_potential = 50.0
min_membrane_potential = -100.0
