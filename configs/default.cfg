# NLM Configuration File Example
# This file contains default configuration settings for NLM demos

# General Settings
[general]
random_seed = 42
simulation_timestep = 0.001
log_level = info

# Brain Configuration
[brain]
neuron_count = 500
region_count = 1
connection_probability = 0.15

# Plasticity Settings
[plasticity]
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# World Configuration
[world]
environment_width = 20
environment_height = 20
vision_width = 16
vision_height = 16

# Agent Settings
[agent]
enable_curiosity = true
enable_reward_modulation = true
enable_structural_plasticity = true
enable_development = true

# Memory Configuration
[memory]
working_memory_size = 1000
episodic_memory_capacity = 100

# Neuromodulation
[neuromodulation]
dopamine_sensitivity = 1.0
curiosity_threshold = 0.1
novelty_sensitivity = 1.0

# Performance
[performance]
max_steps = 1000
checkpoint_interval = 100
enable_profiling = false

# Experimental Parameters
[experiment]
exploration_rate = 0.1
exploitation_rate = 0.9
discount_factor = 0.95
alpha = 0.1  # learning rate