# NLM Configuration File
# This is the default configuration for Phase 6 FINAL INTEGRATION

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 scale)
neuron_count = 5000

# Number of brain regions (Phase 6 multi-region)
region_count = 4

# Connection probability for random connectivity (Phase 6 higher connectivity)
connection_probability = 0.15

# Plasticity settings (Phase 6 optimized)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.018
stdp_time_constant = 20.0

# Development settings (Phase 6 advanced)
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002

# Neuromodulation settings (Phase 6 enhanced)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_sensitivity = 0.1

# Environment settings (Phase 6 demo world)
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log

# Simulation settings
max_simulation_steps = 100000
simulation_time_limit = 1000.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
