# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration
#
# This configuration provides optimal settings for running the complete
# NLM neural simulation with all integrated systems working together.

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 6 requires finer timesteps)
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 standard size)
neuron_count = 1000

# Number of brain regions (Phase 6 uses 2 regions for hemispheric specialization)
region_count = 2

# Connection probability for random connectivity (balanced for phase 6)
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (age-dependent plasticity)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings (for reinforcement learning)
reward_discount_factor = 0.99

# Environment settings (standard test environment)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Memory system settings
working_memory_capacity = 100
episodic_memory_capacity = 1000
semantic_memory_capacity = 5000
procedural_memory_capacity = 2000
associative_memory_threshold = 0.5

# Neuromodulation settings
curiosity_baseline = 0.05
novelty_sensitivity = 0.3
prediction_error_sensitivity = 0.2
reward_prediction_error_enabled = true

# Development stages
development_stage_count = 5
initial_development_stage = 0
stage_progression_rate = 0.1

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Performance optimization settings
use_memory_pools = true
use_event_queues = true
simd_optimization = true
parallel_processing = false
checkpoint_enabled = true
replay_enabled = true

# Integration test settings
integration_test_mode = true
memory_integration_test = true
neuromodulation_integration_test = true
prediction_integration_test = true
development_integration_test = true
checkpoint_test = true
replay_test = true

# Output and export settings
output_results_json = false
output_results_csv = true
export_brain_state = true
import_brain_state = false
