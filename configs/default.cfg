# NLM Configuration File
# This is the default configuration for Phase 2 Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 2 Additional settings (for advanced users)
# Structural plasticity
structural_plasticity_enabled = true
structural_plasticity_threshold = 0.1
structural_plasticity_decay_rate = 0.001

# Development stages
critical_period_length = 100
critical_period_threshold = 0.8
development_plastic_threshold = 0.3

# Neuromodulation
novice_dopamine = 0.05
curiosity_boost = 0.1
novelty_sensitivity = 0.05

# Learning mechanisms
replay_enabled = true
replay_strength = 0.5
replay_interval = 10

# Memory systems
working_memory_capacity = 20
episodic_memory_capacity = 1000
associative_memory_threshold = 0.7

# Cognitive functions
planning_horizon = 5
concept_formation_threshold = 0.6
attention_gain = 1.5

# Age-dependent plasticity
age_plasticity_factor = 0.9
critical_age = 500
maturation_threshold = 0.7

# Sensory processing
sensory_noise = 0.01

