# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
neuropeptide_baseline = 0.0
dopamine_decay_rate = 0.95
dopamine_sensitivity = 1.0


# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced Plasticity Settings
plasticity_hebbian_learning_rate = 0.005
plasticity_stdp_ltp_threshold = 0.0
plasticity_stdp_ltd_threshold = -0.002
plasticity_structural_max_synapses = 10000
plasticity_structural_growth_probability = 0.0001
plasticity_structural_pruning_probability = 0.00001

# Advanced Development Settings
development_initial_stage = Initial
development_critical_period_duration = 100.0
development_maturation_rate = 0.01
development_aging_start_step = 50000
development_plasticity_decay_rate = 0.99

# Advanced Neuromodulation Settings
neuromod_curiosity_sensitivity = 0.5
neuromod_novelty_sensitivity = 0.5
neuromod_reward_prediction_error_decay = 0.9
neuromod_attentional_focus_decay = 0.98
neuromod_learning_modulation_strength = 1.2

# Memory System Settings
memory_working_memory_capacity = 100
memory_episodic_max_episodes = 1000
memory_episodic_decay_rate = 0.95
memory_associative_pattern_threshold = 0.7
memory_associative_forgetting_rate = 0.9

# Prediction System Settings
prediction_prediction_horizon = 10
prediction_prediction_error_threshold = 0.5
prediction_prediction_learning_rate = 0.1
prediction_confidence_threshold = 0.8

# Cognition System Settings
cognition_planner_action_horizon = 5
cognition_concept_learning_rate = 0.05
cognition_attention_selection_strength = 0.8
cognition_planning_time_budget = 0.1

# Performance and Optimization Settings
performance_enable_simd = true
performance_enable_memory_pool = true
performance_enable_event_queue = true
performance_thread_pool_size = 4
performance_max_queue_depth = 1000
performance_optimization_level = 3

# Advanced Simulation Settings
simulation_enable_checkpoints = true
checkpoint_interval_steps = 1000
checkpoint_max_saves = 5
simulation_steady_state_detection = true
steady_state_threshold = 0.01

# State Management Settings
state_enable_serialization = true
state_compression_enabled = true
state_max_memory_usage = 1073741824  # 1GB
state_save_format = "binary"

# Debug and Testing Settings
debug_enable_breakpoints = false
debug_log_synaptic_events = false
debug_log_neuron_events = false
test_performance_benchmarks = true
test_random_seed_validation = true

# Experimental Features
experimental_enable_replay = true
experimental_replay_decay_rate = 0.9
experimental_enable_meta_learning = false
experimental_meta_learning_rate = 0.01
