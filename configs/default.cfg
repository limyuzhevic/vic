# NLM Configuration File
# Enhanced default configuration with Phase 6 (Final Integration) support

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (derived from NLM::SIMULATION_TIMESTEP)
simulation_timestep = 0.001

# Number of neurons in the brain (derived from NLM::CONFIG_NEURON_COUNT)
neuron_count = 1000

# Number of brain regions (derived from NLM::CONFIG_REGION_COUNT)
region_count = 2

# Connection probability for random connectivity (derived from NLM::CONFIG_CONNECTION_PROBABILITY)
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
novelty_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_gain = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Memory system settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_pattern_dim = 10

# Development settings
development_initial_plasticity = 1.0
development_critical_plasticity = 0.8
development_mature_plasticity = 0.5
development_adult_plasticity = 0.2

# Curiosity and exploration settings
curiosity_exploration_threshold = 0.3
curiosity_exploration_factor = 0.5
novelty_detection_threshold = 0.5

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_color_enabled = true
log_file_append = false

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_save_interval = 1000
checkpoint_compression_level = 0.5

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_width = 800
visualization_height = 600

# Performance settings
thread_pool_size = 4
memory_pool_alignment = 64
memory_pool_chunk_size = 1024

# Experiment settings
experiment_step_count = 1000
experiment_weight_delta_threshold = 0.01
experiment_stdp_verification_trials = 50

# Advanced debugging settings
debug_neural_visualization = false
debug_memory_tracking = true
debug_plasticity_logging = false
debug_development_stages = false
