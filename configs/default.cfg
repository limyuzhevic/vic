# NLM Configuration File
# This is the default configuration for Phase 2 Neural Computation
# Uses JSON/YAML format for better configuration management

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings (STDP)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_max_weight = 1.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_modulation_strength = 0.5
dopamine_decay_rate = 0.9

# Reward settings
reward_discount_factor = 0.99
max_reward_value = 1.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_max_file_size = 10485760
log_file_rotation_count = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_checkpoints = false
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1920
visualization_window_height = 1080

# Performance monitoring
enable_profiling = false
performance_monitoring_interval = 1000
log_memory_usage = true
log_cpu_usage = true
