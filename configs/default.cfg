# NLM Configuration File
# Neural Learning Machine - Phase 6 Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation parameters
simulation_timestep = 0.001
max_steps = 10000
neuron_count = 1000
region_count = 1
connection_probability = 0.1

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
replay_interval = 100
consolidation_interval = 1000

# Memory system parameters
working_memory_capacity = 100
max_episodic_episodes = 1000
associative_memory_size = 500

# Neuromodulation parameters
dopamine_level = 0.5
curiosity_level = 0.5
novelty_threshold = 0.1
prediction_error_weight = 0.5

# Development parameters
developmental_stage = 1  # 0=Initial, 1=CriticalPeriod, 2=Maturation, 3=Adult
plasticity_modifier = 1.0

# Checkpoint system
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_max_files = 10
checkpoint_compression = balanced

# Sensory parameters
vision_input_size = 100
audio_input_size = 50
proprioception_input_size = 20

# Motor parameters
motor_group_count = 6
motor_action_strength = 1.0

# Planning and cognition
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_formation_threshold = 0.7

# Experiment parameters
experiment_duration = 2000
experiment_reward_decay = 0.9
experiment_exploration_rate = 0.1

# Visualization parameters
visualization_update_rate = 30
visualization_window_width = 1920
visualization_window_height = 1080

# Performance parameters
enable_vectorization = true
enable_parallel_processing = true
enable_memory_pools = true

# Safety parameters
max_neurons_per_region = 1000
max_synapses_per_neuron = 100
max_memory_usage_mb = 1024

# Logging parameters
log_level = info
log_file = nlm.log
log_file_size_mb = 100
log_rotation_count = 5

# Debug parameters
debug_mode = false
debug_neuron_id = -1
debug_synapse_id = -1
debug_step_log_interval = 1000