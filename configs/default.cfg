# NLM Configuration File
# Default configuration for Neural Limbic Machine brain system
# File format: simple key = value format with descriptive comments
# Version: 1.0

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

# Random seed for reproducible experiments
# Set to 0 for random seed based on system time
# Example: random_seed = 12345
random_seed = 42

# Simulation timestep in seconds
# Smaller values increase accuracy but decrease performance
simulation_timestep = 0.001

# Number of neurons in the brain
# Impacts memory usage and computational complexity
# Typical range: 100 - 10000
neuron_count = 1000

# Number of brain regions
# Each region can have different characteristics
region_count = 2

# Connection probability for random connectivity
# Probability that any two neurons form a connection
# Range: 0.0 - 1.0
connection_probability = 0.1

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# STDP (Spike-Timing Dependent Plasticity) parameters

# Long-Term Potentiation weight change factor
# Positive value strengthening synapses
# Typical range: 0.005 - 0.05
stdp_ltp_weight = 0.01

# Long-Term Depression weight change factor
# Negative value weakening synapses
# Typical range: 0.01 - 0.05
stdp_ltd_weight = 0.012

# STDP time constant for weight decay
# Controls how quickly synaptic weights decay without activity
# Typical range: 10.0 - 50.0
stdp_tau = 20.0

# Hebbian learning rate
# Rate at which co-activated neurons strengthen connections
# Typical range: 0.001 - 0.1
hebbian_learning_rate = 0.01

# Hebbian learning time constant
# Controls memory retention for Hebbian connections
# Typical range: 100.0 - 1000.0
hebbian_time_constant = 500.0

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Neuromodulator scaling factors for system-wide regulation

# Dopamine scale - affects reward prediction and motivation
# Higher values increase learning from rewards
# Typical range: 0.1 - 10.0
dopamine_scale = 0.5

# Serotonin scale - affects mood and behavioral flexibility
# Influences exploration vs exploitation balance
# Typical range: 0.1 - 10.0
serotonin_scale = 0.5

# Norepinephrine scale - affects arousal and attention
# Modulates learning speed and signal-to-noise ratio
# Typical range: 0.1 - 10.0
norepinephrine_scale = 0.5

# Acetylcholine scale - affects memory and attention
# Influences synaptic plasticity and memory consolidation
# Typical range: 0.1 - 10.0
acetylcholine_scale = 0.5

# ==============================================
# DEVELOPMENT PROCESSES
# ==============================================

# Synaptogenesis rate - initial connection formation
# Rate at which new synapses are created during early development
# Typical range: 0.0001 - 0.01
synaptogenesis_rate = 0.001

# Pruning rate - connection elimination
# Rate at which weak connections are removed
# Typical range: 0.00001 - 0.001
pruning_rate = 0.0001

# Development stage parameters

# Stage when synaptogenesis begins (0-100, where 100 is mature)
# Early stages have high plasticity
maturation_start_stage = 10

# Stage when synaptogenesis ends (0-100, where 100 is mature)
# Late stages have reduced plasticity
maturation_end_stage = 90

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# Reward-related learning parameters

# Curiosity weight - drives exploration of novel states
# Balances intrinsic vs extrinsic motivation
# Typical range: 0.0 - 1.0
curiosity_weight = 0.1

# Novelty threshold - what is considered novel
# Lower values trigger more exploration
# Typical range: 0.01 - 0.5
novelty_threshold = 0.1

# Reward discount factor - temporal discounting
# How much future rewards are valued vs immediate rewards
# Range: 0.0 - 1.0 (higher = more future-oriented)
reward_discount_factor = 0.99

# Prediction error weight - learning from surprise
# Influences how strongly prediction errors update weights
# Typical range: 0.5 - 2.0
prediction_error_weight = 1.0

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Simulation environment characteristics

# Environment name - determines physics and rules
# Valid values: GridWorld, Continuous2D, Maze, etc.
environment_name = GridWorld

# Environment width in simulation units
environment_width = 10.0

# Environment height in simulation units
environment_height = 10.0

# Vision range for sensory processing
# Maximum distance neurons can 'see'
# Typical range: 5.0 - 50.0
vision_range = 20.0

# Auditory range for sound-based sensing
# Maximum distance sounds can be detected
# Typical range: 5.0 - 50.0
auditory_range = 20.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Logging configuration for monitoring and debugging

# Log level - minimum severity to record
# Values: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
log_level = INFO

# Log to file - enable/disable file output
log_to_file = false

# Log filename for file-based logging
log_filename = nlm.log

# Maximum log file size before rotation (in MB)
log_max_size = 100

# Maximum number of log files to keep
log_max_files = 5

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Core simulation parameters

# Maximum number of simulation steps
# 0 for unlimited
max_simulation_steps = 10000

# Absolute time limit for simulation (in seconds)
# 0 for unlimited
simulation_time_limit = 0.0

# Checkpoint interval for saving progress
# Number of steps between automatic checkpoints
# 0 for no checkpoints
checkpoint_interval = 1000

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# Real-time visualization settings

# Enable/disable visualization system
visualization_enabled = false

# Frames per second for visualization updates
# Higher values = smoother animation
# Typical range: 10 - 60
visualization_fps = 30

# Visualization window width
visualization_width = 1920

# Visualization window height
visualization_height = 1080

# ==============================================
# PYTHON BINDINGS
# ==============================================

# External interface configuration

# Enable Python API bindings
python_bindings_enabled = true

# Port for Python API server
# Must be unique and available
python_port = 8888