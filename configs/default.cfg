# NLM Configuration File - Default

# Core simulation parameters
[core]
# Random seed for reproducible results
seed = 42

# Time management
timestep = 0.001
simulation_steps = 1000

# Neural network architecture
neuron_count = 500
region_count = 1

# Connection topology
connection_probability = 0.15
max_synapses_per_neuron = 20

# Brain regions
[region.default]
type = "default"
neuron_density = "medium"
plasticity_enabled = true

# Neuron dynamics
[neuron]
# LIF neuron parameters
v_rest = -65.0
v_thresh = -50.0
v_reset = -65.0
v_decay = 0.95

# Synaptic dynamics
[synapse]
# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian parameters
hebbian_rate = 0.01

# Structural plasticity
[synaptogenesis]
rate = 0.0001
max_connections_per_neuron = 25

[pruning]
rate = 0.00001
min_connections_per_neuron = 5

# Neuromodulation
[neuromodulation]
dopamine_enabled = true
curiosity_enabled = true
novelty_enabled = true
prediction_error_enabled = true

# Dopamine parameters
[neuromodulation.dopamine]
weight = 1.0
learning_rate = 0.01
adaptation_rate = 0.001

# Curiosity parameters
[neuromodulation.curiosity]
weight = 0.5
novelty_threshold = 0.3
history_size = 100

# Novelty detection
[neuromodulation.novelty]
sensitivity = 0.7

# Prediction error
[neuromodulation.prediction_error]
weight = 1.0

# Memory systems
[memory]
working_memory_enabled = true
working_memory_capacity = 100

episodic_memory_enabled = true
episodic_memory_capacity = 1000

semantic_memory_enabled = true
semantic_memory_capacity = 5000

procedural_memory_enabled = true
procedural_memory_capacity = 500

associative_memory_enabled = true
associative_memory_capacity = 2000

# Working memory parameters
[memory.working_memory]
std_decay_rate = 0.999
top_activation_threshold = 0.5
competitive_strength = 0.8

# Episodic memory parameters
[memory.episodic]
encoding_strength = 0.1
decay_rate = 0.99
replay_probability = 0.1

# Concept formation
[cognition]
concept_formation_enabled = true
concept_threshold = 0.8
max_concepts = 50

# Neural planning
[planning]
planning_enabled = true
horizon_length = 10
action_evaluation_weight = 1.0

# Sensory processing
[sensory]
vision_enabled = true
vision_width = 16
vision_height = 16
vision_channels = 3

audio_enabled = true
sample_rate = 22050
audio_window_size = 1024

internal_signals_enabled = true
proprioception_enabled = true

# Motor system
[motor]
action_enabled = true
max_actions = 20

# Agent behavior
[agent]
reward_modulation_enabled = true
structural_plasticity_enabled = true
development_enabled = true
curiosity_enabled = true

# Development
[development]
stage_transitions = true
critical_period = 100.0
maturation_rate = 0.01

# Simulation control
[simulation]
enable_checkpointing = false
checkpoint_interval = 100
enable_replay = false
replay_interval = 50
enable_development = true

# Environment
[environment]
world_width = 20.0
world_height = 20.0
max_energy = 100.0
energy_decay_rate = 0.01

# Performance optimization
[performance]
use_memory_pool = true
use_event_queue = true
use_simd = true
parallel_neuron_count = 0

# Logging
[logging]
level = "info"
file = "nlm.log"
console = true
timestamp = true
