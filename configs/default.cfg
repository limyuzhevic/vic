# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# PLASMTICITY SETTINGS (Phase 1 skeleton)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1  # Fixed: removed duplicate line

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# ==============================================
# ADVANCED CONFIGURATION OPTIONS
# ==============================================

# NEURON PARAMETERS
# Neuronal membrane threshold potential (in mV)
neuron_threshold = -55.0
# Resting membrane potential (in mV)
neuron_resting_potential = -65.0
# Membrane leak conductance (in mS/cm²)
neuron_leak_conductance = 0.1
# Refractory period duration (in seconds)
neuron_refractory_period = 0.002

# SYNAPSE PARAMETERS
# Minimum synaptic weight
synapse_weight_min = -1.0
# Maximum synaptic weight
synapse_weight_max = 1.0
# Synaptic transmission delay (in seconds)
synapse_delay = 0.001
# Synapse type distribution (excitatory/inhibitory)
synapse_excitatory_ratio = 0.8

# PLASTICITY PARAMETERS
# Short-term plasticity learning rates
stp_learning_rate_pre = 0.05
stp_learning_rate_post = 0.05
# Short-term plasticity time constants (in seconds)
stp_tau_pre = 100.0
stp_tau_post = 100.0
# Spike-timing-dependent plasticity (STDP) learning rates
stdp_ltp_rate = 0.01
stdp_ltd_rate = 0.012
stdp_time_constant = 20.0
# Long-term potentiation (LTP) threshold
stdp_ltp_threshold = 20.0
# Long-term depression (LTD) threshold
stdp_ltd_threshold = -20.0

# POPULATION DISTRIBUTION
# Neuron population type ratios
sensory_neuron_ratio = 0.3
internal_neuron_ratio = 0.5
motor_neuron_ratio = 0.2
# Number of neurons per population
total_neurons_per_population = 1000

# SIMULATION PARAMETERS
# Checkpoint intervals (in simulation steps)
checkpoint_interval = 1000
# Memory settings for simulation state
memory_buffer_size = 10000
# Maximum memory usage (in MB)
max_memory_usage = 2048
# Simulation precision
floating_point_precision = double

# DEVELOPMENT PARAMETERS
# Developmental stage rates
development_initialization_rate = 0.001
development_maturation_rate = 0.0005
# Synapse formation probability
synaptogenesis_rate = 0.001
# Synapse elimination probability
pruning_rate = 0.0001
# Critical period timing
critical_period_start = 10.0
critical_period_end = 100.0

# NEUROMODULATION PARAMETERS
# Neuromodulator baseline levels
dopamine_baseline = 0.1
curiosity_baseline = 0.05
novelty_baseline = 0.02
# Neuromodulator scaling factors
dopamine_gain = 1.0
curiosity_gain = 1.0
novelty_gain = 1.0
# Neuromodulator time constants
dopamine_time_constant = 10.0
curiosity_time_constant = 5.0
novelty_time_constant = 5.0

# ADVANCED SIMULATION CONTROLS
# Simulation mode (standard/efficient/compact)
simulation_mode = standard
# Enable/disable spike recording
record_spikes = true
# Spike recording buffer size
spike_recording_buffer = 1000000
# Enable/disable synaptic dynamics tracking
track_synaptic_dynamics = false
# Enable/disable neural connectivity mapping
map_connectivity = false
# Enable/disable developmental trajectory tracking
track_development = false

# ==============================================
# USAGE DOCUMENTATION
# ==============================================

# To use advanced configuration options:
# 1. Copy this default.cfg to your custom config file (e.g., my_config.cfg)
# 2. Modify values that need to be customized
# 3. Load your config file using: nlm --config my_config.cfg
# 4. Values can be overridden by command-line arguments
# 5. Comments (lines starting with #) are ignored by the parser
# 6. Sections are separated by blank lines for readability

# Required parameters:
# - neuron_count: Total number of neurons in the simulation
# - simulation_timestep: Time step size in seconds
# - random_seed: Random seed for reproducible results

# Advanced parameters:
# - neuron_*: Membrane properties and refractory periods
# - synapse_*: Synaptic transmission and connectivity patterns
# - stdp_*: Spike-timing-dependent plasticity settings
# - development_*: Neural development and maturation rates
# - neuromodulation_*: Neurotransmitter dynamics and signaling
# - simulation_*: Core simulation performance and recording options
