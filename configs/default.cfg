# NLM Configuration File
# This is the default configuration for Phase 2 Real Neural Computation
# All settings should be configurable via this file to avoid hard-coded values in code

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Neural dynamics parameters
membrane_time_constant = 20.0
membrane_resistance = 10.0
neural_threshold = -50.0
neural_reset_potential = -70.0
neural_resting_potential = -65.0

# Synaptic parameters
synaptic_delay_default = 1
synaptic_max_delay = 5
synaptic_efficacy_max = 2.0
synaptic_efficacy_min = 0.1

# Learning parameters
learning_eligibility_trace_decay = 0.95
learning_eligibility_trace_initial = 0.0

# Development system parameters
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_maturation_rate = 0.001
