# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Learning experiment parameters (for main demo)
learning_experiment_input_strength = 30.0
learning_experiment_pattern_diversity = 0.8
learning_experiment_learning_rate = 0.01
learning_experiment_stdp_strength = 0.02
learning_experiment_pattern_change_interval = 100

# Performance tuning
max_firing_neuron_ratio = 0.3  # Maximum ratio of neurons that can fire per step
refractory_period_base = 20    # Base refractory period in steps
leak_conductance = 0.1        # Neural membrane leak conductance
threshold_sensitivity = 0.9   # Sensitivity of firing threshold

# Memory system tuning
working_memory_capacity = 50    # Number of active working memory traces
episodic_memory_capacity = 100  # Maximum number of episodic memory episodes
episodic_memory_retention = 0.7 # Memory retention rate for episodic memory
associative_memory_patterns = 20  # Number of associative memory patterns

# Neuromodulation tuning
curiosity_baseline = 0.05
novelty_threshold = 0.3
prediction_error_gain = 0.1
reward_prediction_gain = 0.2

# Development system options
development_enabled = true
developmental_stage_duration = 1000
maturation_rate = 0.5

# Checkpoint system options
checkpoint_enabled = true
checkpoint_interval = 1000
checkpoint_compress = true
checkpoint_directory = "./checkpoints"
checkpoint_max_files = 10
checkpoint_format_version = 1

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
