# NLM Phase 6 Default Configuration
# This file contains default configuration settings for the NLM Phase 6 integration experiment.
# Configuration values can be overridden by command-line arguments.

# Simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15
max_steps = 2000

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory system parameters
working_memory_capacity = 100.0
episodic_memory_capacity = 50
associative_memory_capacity = 200.0

# Neuromodulation parameters
dopamine_baseline = 0.1
dopamine_modulation_strength = 0.5
curiosity_threshold = 0.3
novelty_threshold = 0.2

# Cognition parameters
planning_horizon = 10
concept_learning_rate = 0.05
attention_focus_strength = 0.8

# Development parameters
development_start_step = 100
development_end_step = 1000
plasticity_decay_rate = 0.001

# Environment parameters
world_width = 16
world_height = 16

# Checkpointing
checkpoint_enabled = true
checkpoint_path = "nlm_checkpoint.bin"

# Replay parameters
replay_enabled = true
replay_episode_count = 10
replay_strength = 0.8

# Visualization
visualization_enabled = false
visualization_fps = 30

# Logging
log_level = "INFO"
log_file = "nlm.log"
max_log_size = 10485760  # 10MB
