# Configuration validation and defaults for NLM

# Core simulation parameters
random_seed = 42
# Random seed for reproducible experiments (0 = random, >0 = reproducible)

simulation_timestep = 0.001
# Simulation timestep in seconds (typically 0.001 to 0.01)

# Neural network architecture
neuron_count = 500
# Total number of neurons in the brain

region_count = 1
# Number of neural regions (for modular organization)

connection_probability = 0.15
# Probability of connection between neurons (0.0-1.0)

# Neuron dynamics parameters
membrane_capacitance = 1.0
# Membrane capacitance in nF

time_constant = 20.0
# Membrane time constant in ms

threshold = 15.0
# Firing threshold in mV

# Plasticity parameters - STDP
stdp_ltp_weight = 0.02
# STDP Long-Term Potentiation weight factor

stdp_ltd_weight = 0.015
# STDP Long-Term Depression weight factor

stdp_tau = 20.0
# STDP time constant in ms

# Plasticity parameters - Structural
 Synaptogenesis_rate = 0.0001
# Rate of new synapse formation (per synapse per timestep)

pruning_rate = 0.00001
# Rate of synapse elimination (per synapse per timestep)

# Short-term plasticity parameters
st_depression_tau = 100.0
# Short-term depression time constant in ms

st_facilitation_tau = 200.0
# Short-term facilitation time constant in ms

# Neuromodulation parameters
reward_gain = 1.0
# Reward signal gain factor

curiosity_gain = 0.5
# Curiosity signal gain factor

novelty_threshold = 0.5
# Novelty detection threshold (0.0-1.0)

prediction_error_threshold = 0.1
# Prediction error threshold for learning

# Memory parameters
working_memory_capacity = 100
# Number of items in working memory

episodic_memory_capacity = 1000
# Number of episodes in episodic memory

# Cognitive parameters
planning_horizon = 10
# Planning horizon in steps

learning_rate = 0.1
# Learning rate for cognitive updates (0.0-1.0)

# Motor parameters
action_selection_temperature = 0.1
# Temperature for action selection (higher = more random)

# Development parameters
development_rate = 0.01
# Rate of developmental changes

# Experiment parameters
replay_interval = 100
# Replay interval in steps

consolidation_interval = 1000
# Memory consolidation interval in steps

# Logging and monitoring
log_level = "INFO"
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL

log_to_file = false
# Write logs to file in addition to console

log_file = "nlm.log"
# Log file name

# Visualization (if enabled)
enable_visualization = false
# Enable real-time visualization

visualization_refresh_rate = 30.0
# Visualization refresh rate in Hz

# Performance monitoring
enable_profiling = false
# Enable performance profiling

# Safety limits
max_neurons = 10000
# Maximum number of neurons (prevents memory issues)

max_synapses = 1000000
# Maximum number of synapses (prevents memory issues)

# Experimental modes
test_mode = false
# Enable test mode (reduced complexity, faster execution)

benchmark_mode = false
# Enable benchmark mode (measures performance)

# Seed management
seed_mode = "auto"
# Seed mode: "auto", "manual", "fixed"

# Advanced neuromodulation
enable_bayesian_learning = false
# Enable Bayesian learning algorithms

enable_meta_learning = false
# Enable meta-learning capabilities

# Experimental phases
phase_2_features = true
# Enable Phase 2 features (real neural computation)

phase_3_features = false
# Enable Phase 3 features (world interaction)

phase_4_features = false
# Enable Phase 4 features (advanced cognition)

# Default configuration for Phase 2
[default]
# Basic Phase 2 configuration with reasonable defaults
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
log_level = "INFO"

# Test configuration (for quick verification)
[test]
neuron_count = 100
region_count = 1
connection_probability = 0.2
log_level = "WARNING"
enable_profiling = true

# Benchmark configuration (for performance testing)
[benchmark]
neuron_count = 2000
region_count = 2
connection_probability = 0.1
replay_interval = 10
consolidation_interval = 100
log_level = "ERROR"
enable_profiling = true
