# =============================================================================
# Runtime Override Examples (command-line usage)
# =============================================================================

# These examples show how to override configuration values from command line:
#
# ./nlm --config=advanced.cfg \
#       --neuron_count=2000 \
#       --stdp_ltp_weight=0.03 \
#       --random_seed=999 \
#       --stdp_tau=30.0

# Command line override examples:
# --neuron_count=500
# --region_count=2
# --connection_probability=0.12
# --simulation_timestep=0.002
# --random_seed=123
# --stdp_ltp_weight=0.015
# --stdp_ltd_weight=0.014
