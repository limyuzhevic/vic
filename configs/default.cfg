# NLM Configuration File
# Enhanced configuration with Phase 6 features
# This is the default configuration for NLM Phase 6 Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (fixed duplicate)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = SimpleWorld
environment_width = 100
environment_height = 100

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 1000.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6 specific settings
working_memory_size = 50
episodic_memory_capacity = 1000
novelty_threshold = 0.5
curiosity_decay = 0.995
development_stage = "Maturation"

# Memory system settings
associative_memory_patterns = 100
prediction_horizon = 10
planning_horizon = 50

# Advanced plasticity
structural_plasticity_enabled = true
developmental_plasticity_enabled = true
meta_plasticity_enabled = false
