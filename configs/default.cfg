# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 10000

# Number of brain regions
region_count = 8

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001f

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = SimpleWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log

# Simulation settings
max_simulation_steps = 100000
simulation_time_limit = 0.0

# Integration settings (Phase 6 specific)
enable_memory_integration = true
enable_prediction_integration = true
enable_cognition_integration = true
enable_sleep_consolidation = true
enable_replay_mechanism = true
replay_interval = 100
consolidation_interval = 1000

# Memory settings
working_memory_capacity = 1000
episodic_memory_max_episodes = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
