# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
# Set to a fixed value for deterministic behavior across runs
random_seed = 42

# Simulation timestep in seconds
# Controls the time resolution of the neural simulation
# Smaller values increase accuracy but also computational cost
simulation_timestep = 0.001

# Number of neurons in the brain
# Total count of neurons across all regions
neuron_count = 1000

# Number of brain regions
# Increases parallelism and allows for region-specific processing
region_count = 2

# Connection probability for random connectivity
# Probability that any two neurons in different populations will connect
# Higher values create denser networks but may affect stability
connection_probability = 0.1

# Plasticity settings (STDP and structural plasticity)
# STDP learning rate for long-term potentiation (LTP)
# Determines how strongly pre-before-post spike pairs strengthen synapses
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings
# Baseline dopamine level
# Sets the resting level of reward signaling in the brain
# Higher baseline increases overall excitability and learning rate
dopamine_baseline = 0.1

# Reward settings
# Reward discount factor
# Controls how future rewards are valued compared to immediate rewards
# Values closer to 1.0 make the system more patient
reward_discount_factor = 0.99

# Memory consolidation settings
# Replay interval for episodic memory
# How often (in simulation steps) to replay important memories
# Regular replay helps consolidate learning and strengthen important pathways
replay_interval = 100
# Consolidation interval for memory management
# How often (in simulation steps) to consolidate memory and remove weak traces
# Regular consolidation prevents memory saturation
consolidation_interval = 1000

# Curiosity settings
# Curiosity threshold for exploration
# Level of prediction error required to trigger exploratory behavior
# Lower values make the system more curious and exploratory
curiosity_threshold = 0.5

# Novelty settings
# Novelty threshold for detection
# Level of sensory change required to register as novel
# Lower values make the system more sensitive to new stimuli
novelty_threshold = 0.3

# Environment settings
# Environment name for simulation
# Determines which environment dynamics to use
environment_name = GridWorld
# Environment width in simulation units
# Size of the rectangular environment workspace
environment_width = 10
# Environment height in simulation units
# Size of the rectangular environment workspace
environment_height = 10

# Checkpointing parameters
# Directory for saving brain state checkpoints
# Path where simulation checkpoints will be saved
checkpoint_dir = ./checkpoints
# Checkpoint compression level
# Balances storage space with I/O speed when saving checkpoints
# Values: None, Fast, Balanced, Best
checkpoint_compression = Balanced
# Number of checkpoints to keep
# Limits checkpoint storage to prevent disk space exhaustion
checkpoint_keep_count = 5

# Logging parameters
# Log level for output
# Controls verbosity of simulation logging
# Values: Trace, Debug, Info, Warning, Error, Critical
log_level = INFO
# Enable file logging
# If true, logs will be written to file in addition to console
log_to_file = false
# Log filename
# Path for log file when file logging is enabled
log_filename = nlm.log

# Simulation parameters
# Maximum number of simulation steps
# Limits total simulation time to prevent infinite runs
max_simulation_steps = 10000
# Simulation time limit in seconds
# Absolute time limit regardless of step count
# Set to 0.0 for unlimited time
simulation_time_limit = 0.0

# Visualization parameters
# Enable visualization
# If true, system will attempt to render neural activity
# Requires graphics libraries and additional processing time
visualization_enabled = false
# Visualization update rate (Hz)
# How frequently to refresh visualization display
# Higher values provide smoother animation but cost more resources
visualization_update_rate = 30.0
