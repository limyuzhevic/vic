# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration
# Updated with new configuration options and improved structure

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development settings
initial_stage_age = 60.0
critical_period_age = 300.0
maturation_stage_age = 900.0

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
expected_reward_decay = 0.95
reward_update_rate = 0.05

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
verbosity = 1

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced agent configuration (Phase 6)
agent_brain_enabled = true
reward_modulation_enabled = true
structural_plasticity_enabled = true
development_enabled = true
curiosity_enabled = true
novelty_enabled = true
validation_enabled = true

# Performance settings
total_sensory_samples = 0
total_motor_commands_generated = 0
enable_profiling = false
checkpoint_enabled = true
checkpoint_interval = 1000

# Experimental configuration
experiment_mode = integration
epoch_count = 10
train_steps_per_epoch = 1000
validation_enabled = true
export_results = true
result_format = json
