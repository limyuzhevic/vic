# NLM Configuration File
# Phase 6: Integrated Artificial Brain Configuration
# This configuration supports all Phase 6 features including integrated memory systems,
# prediction, cognition, neuromodulation, and developmental stages.

# ==================== CORE SIMULATION PARAMETERS ====================

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (recommended: 0.001ms for stable LIF dynamics)
simulation_timestep = 0.001

# Total number of neurons in the brain (recommended: 500-5000 for Phase 6)
neuron_count = 1000

# Number of brain regions (recommended: 1-4 for distributed processing)
region_count = 1

# Connection probability for random connectivity (0.05-0.3 for balance)
connection_probability = 0.15

# ==================== NEURAL DYNAMICS PARAMETERS ====================

# LIF neuron parameters
neuron_resting_potential = -70.0
neuron_threshold = -55.0
neuron_reset_potential = -65.0
neuron_leak_conductance = 0.1
neuron_refractory_period = 5.0
neuron_membrane_capacitance = 1.0

# Synaptic parameters
synapse_min_weight = -1.0
synapse_max_weight = 1.0
synapse_default_delay = 1
synapse_efficacy_min = 0.1
synapse_efficacy_max = 2.0

# ==================== PLASTICITY PARAMETERS ====================

# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_time_window = 100.0  # ms

# Hebbian learning parameters
hebbian_learning_rate = 0.01
hebbian_max_weight = 1.0
hebbian_min_weight = -1.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
synaptogenesis_min_distance = 5.0  # minimum distance between neurons
synaptogenesis_connection_strength = 0.2

pruning_rate = 0.00001
pruning_min_weight = 0.05
pruning_activity_threshold = 0.01
pruning_age_threshold = 1000

# Short-term plasticity parameters
stp_facilitation_tau = 100.0  # ms
stp_depression_tau = 200.0   # ms
stp_u_max = 1.0  # utilization factor

# ==================== MEMORY SYSTEM PARAMETERS ====================

# Working memory parameters
working_memory_capacity = 100
working_memory_decay_rate = 0.95
working_memory_competition_strength = 1.5
working_memory_inhibition_strength = 0.5

# Episodic memory parameters
episodic_memory_max_episodes = 1000
episodic_memory_decay_rate = 0.9
episodic_memory_replay_interval = 100
episodic_memory_replay_episodes = 3

# Associative memory parameters
associative_memory_capacity = 500
associative_memory_similarity_threshold = 0.7
associative_memory_forgetting_rate = 0.98

# ==================== PREDICTION SYSTEM PARAMETERS ====================

# Prediction system settings
prediction_system_enabled = true
prediction_forward_model = true
prediction_prediction_error = true
prediction_learning_rate = 0.01
prediction_horizon = 10

# ==================== COGNITIVE SYSTEM PARAMETERS ====================

# Neural planner parameters
planner_planning_depth = 5
planner_action_selection_threshold = 0.7
planner_exploratory_bias = 0.2

# Concept formation parameters
concept_formation_enabled = true
concept_threshold = 0.8
concept_min_samples = 10
concept_association_strength = 0.5

# Attentional selection parameters
attention_enabled = true
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_selection_window = 50

# ==================== NEUROMODULATION PARAMETERS ====================

# Dopamine system parameters
dopamine_baseline = 0.1
dopamine_learning_rate = 0.01
dopamine_plasticity_factor = 1.0
dopamine_modulation_strength = 0.5

# Curiosity parameters
curiosity_baseline = 0.2
curiosity_curiosity_gain = 0.1
curiosity_exploration_bonus = 0.5
curiosity_exploitation_cost = 0.1

# Novelty detection parameters
novelty_detection_enabled = true
novelty_threshold = 0.5
novelty_sensitivity = 0.3
novelty_decay_rate = 0.9

# Prediction error parameters
prediction_error_enabled = true
prediction_error_weight = 0.5
prediction_error_adaptation = 0.1

# ==================== DEVELOPMENT PARAMETERS ====================

# Developmental stages
developmental_stage = 2  # 0=Initial, 1=CriticalPeriod, 2=Maturation, 3=Adult
development_initial_plasticity = 1.0
development_critical_plasticity = 0.8
development_mature_plasticity = 0.5
development_adult_plasticity = 0.2

# Development timing
replay_interval = 100
consolidation_interval = 1000
development_interval = 1000

# ==================== CHECKPOINT SYSTEM PARAMETERS ====================

# Checkpoint system settings
checkpoint_enabled = true
checkpoint_directory = ./checkpoints
checkpoint_interval = 10000
checkpoint_max_checkpoints = 10
checkpoint_compression = 3  # 0=none, 1=fast, 2=balanced, 3=best
checkpoint_autosave = true

# ==================== LOGGING AND DEBUGGING PARAMETERS ====================

# Logging parameters
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_file_size_limit = 10485760  # 10MB
log_max_history = 100
log_performance_stats = true
log_memory_stats = true

# Debug parameters
debug_enabled = false
debug_neuron_ids = false
debug_synapse_connections = false
debug_plasticity_events = false
debug_memory_trace = false

# ==================== SIMULATION CONTROLS ====================

# Simulation controls
max_simulation_steps = 50000
simulation_time_limit = 0.0

# Visualization parameters
visualization_enabled = false
visualization_update_rate = 30.0
visualization_neurons_per_frame = 100
visualization_synapses_per_frame = 1000

# ==================== REWARD AND LEARNING PARAMETERS ====================

# Reward system parameters
reward_discount_factor = 0.99
reward_learning_rate = 0.01
reward_exploration_bonus = 0.1
reward_exploitation_penalty = 0.0

# Learning parameters
learning_enabled = true
learning_exploration_rate = 0.2
learning_exploitation_rate = 0.8
learning_epsilon_decay = 0.9995
learning_target_update_frequency = 100

# ==================== PERFORMANCE PARAMETERS ====================

# Performance optimization
performance_optimization_enabled = true
performance_thread_count = 4
performance_cache_size = 1024
performance_vectorization = true
performance_batch_size = 100

# ==================== EXPERIMENTAL PARAMETERS ====================

# Experimental controls
experimental_mode = false
experimental_seed_offset = 0
experimental_parameter_variation = false
experimental_parallel_runs = 1

# Target metrics for evaluation
target_firing_rate = 10.0  # Hz
target_memory_retention = 0.8
target_learning_speed = 0.5

# ==================== ADVANCED FEATURES ====================

# Enable experimental features (requires testing)
experimental_short_term_plasticity = false
experimental_eligibility_traces = true
experimental_hierarchical_plasticity = false
experimental_meta_plasticity = false

# Sensory and motor parameters
sensory_encoding_gain = 1.0
motor_output_amplitude = 1.0
