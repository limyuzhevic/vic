# NLM Configuration File
# Modern configuration for Phase 6 integrated brain
# Use hierarchical notation for better organization

# Random seed for reproducible experiments
random_seed = 42

# Simulation settings
simulation:
    timestep = 0.001
    max_steps = 10000
    time_limit = 0.0

# Brain architecture
brain:
    neuron_count = 1000
    region_count = 2
    connection_probability = 0.1
    initial_weight_mean = 0.5
    initial_weight_std = 0.1
    threshold = -50.0
    resting_potential = -70.0
    reset_potential = -75.0
    membrane_time_constant = 20.0
    refractory_period = 2.0

# Plasticity systems
plasticity:
    stdp:
        enable = true
        learning_rate = 0.001
        tau_plus = 20.0
        tau_minus = 20.0
        ltp_weight = 0.01
        ltd_weight = 0.012
    hebbian:
        enable = true
        learning_rate = 0.01
    structural:
        enable = true
        synaptogenesis_rate = 0.0001
        pruning_rate = 0.00001

# Neuromodulation
neuromodulation:
    dopamine:
        baseline = 0.1
        scale = 1.0
        decay_rate = 0.01
        peak_level = 2.0
        release_rate = 0.05
    curiosity:
        enable = true
        baseline = 0.0
        scale = 1.0
    novelty:
        enable = true
        baseline = 0.0
    prediction_error:
        enable = true
        sensitivity = 1.0

# Development
development:
    enable = true
    synaptogenesis_rate = 0.001
    pruning_rate = 0.0001
    maturation_rate = 0.0005

# Memory systems
memory:
    working:
        capacity = 100
        decay_rate = 0.01
        recurrent_strength = 0.1
    episodic:
        capacity = 1000
        replay_interval = 100
        consolidation_threshold = 0.8

# Prediction system
prediction:
    enable = true
    horizon = 10
    learning_rate = 0.01

# Cognitive systems
attention:
    enable = true
    competition_strength = 0.5
    top_down_strength = 0.3

# Environment settings
environment:
    name = GridWorld
    width = 10
    height = 10
    vision_width = 8
    vision_height = 8

# Logging
logging:
    level = INFO
    to_file = false
    filename = nlm.log
    file_rotation = true
    max_file_size = 10485760
    include_timestamps = true
    include_thread_ids = true

# Visualization
visualization:
    enabled = false
    update_rate = 30.0
    show_neurons = true
    show_synapses = true
    show_spikes = true

# Performance
performance:
    enable_sparse_connectivity = true
    enable_memory_pools = true
    enable_event_queues = true
    simd_enable = true
    parallel_enable = false
    max_threads = 4
