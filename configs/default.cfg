### Configuration Validator
```python
import nlm

def validate_config(config_file):
    """Validate a configuration file."""
    config = nlm.Config()
    
    if not config.loadFromFile(config_file):
        print(f"Error: Failed to load configuration from {config_file}")
        return False
    
    # Check required sections
    required_sections = ['brain', 'simulation']
    config_sections = config.getKeys()
    
    for section in required_sections:
        if section not in config_sections:
            print(f"Error: Missing required section '{section}'")
            return False
    
    # Check required keys
    if not config.has('brain.neuron_count'):
        print("Error: Missing 'brain.neuron_count' key")
        return False
    
    if not config.has('simulation.timestep'):
        print("Error: Missing 'simulation.timestep' key")
        return False
    
    # Validate values
    neuron_count = config.getOr<int64_t>('brain.neuron_count', 0)
    if neuron_count <= 0 or neuron_count > 10000:
        print(f"Error: Invalid neuron count {neuron_count}")
        return False
    
    timestep = config.getOr<double>('simulation.timestep', 0.0)
    if timestep <= 0.0 or timestep > 1.0:
        print(f"Error: Invalid timestep {timestep}")
        return False
    
    print("Configuration validation successful!")
    return True

# Usage
validate_config("config.ini")
```

### Configuration Converter
```python
import nlm
import json

def convert_config_file(input_file, output_file, format='json'):
    """Convert configuration file between different formats."""
    config = nlm.Config()
    
    if not config.loadFromFile(input_file):
        print(f"Error: Failed to load configuration from {input_file}")
        return False
    
    if format.lower() == 'json':
        # Convert to JSON
        config_data = {}
        
        # Convert nested structure to flat key-value pairs
        for key in config.getKeys():
            # Convert nested keys to dot notation
            config_data[key] = config.getOr<string>(key, "")
        
        with open(output_file, 'w') as f:
            json.dump(config_data, f, indent=2)
    
    elif format.lower() == 'yaml':
        try:
            import yaml
            # Convert to YAML
            config_data = {}
            
            for key in config.getKeys():
                config_data[key] = config.getOr<string>(key, "")
            
            with open(output_file, 'w') as f:
                yaml.dump(config_data, f, default_flow_style=False)
        
        except ImportError:
            print("Error: PyYAML not installed. Install with: pip install PyYAML")
            return False
    
    else:
        print(f"Error: Unsupported format '{format}'")
        return False
    
    print(f"Configuration converted and saved to {output_file}")
    return True

# Usage
convert_config_file("config.ini", "config.json", "json")
convert_config_file("config.ini", "config.yaml", "yaml")
```

## Configuration Management

### Configuration Templates
```bash
# Create configuration templates
mkdir -p config_templates

# Basic template
cat > config_templates/basic.ini << EOF
[brain]
neuron_count = 500

[simulation]
timestep = 0.001
EOF

# Advanced template
cat > config_templates/advanced.ini << EOF
[brain]
neuron_count = 2000
connection_probability = 0.03

[plasticity]
stdp.learning_rate = 0.005
hebbian.learning_rate = 0.02

[neuromod]
dopamine.scale = 2.0
curiosity.exploration_rate = 0.3

[world]
width = 50
height = 50

[simulation]
timestep = 0.0005
max_steps = 5000
EOF
```

### Configuration Repository
```bash
# Create configuration repository
mkdir -p config_repository

# Add different configurations
cp config_templates/basic.ini config_repository/basic_simulation.ini
cp config_templates/advanced.ini config_repository/research_simulation.ini

# Create configuration index
cat > config_repository/README.md << EOF
# Configuration Repository

This directory contains various NLM configurations for different use cases.

## Configurations

### Basic Configurations
- `basic_simulation.ini` - Basic configuration for beginners
- `quick_test.ini` - Fast test configuration

### Research Configurations
- `advanced_simulation.ini` - Advanced configuration for research
- `scaling_study.ini` - Configuration for scaling experiments
- `ablation_study.ini` - Configuration for system ablation studies

### Environment-Specific Configurations
- `stable_environment.ini` - Configuration for stable environments
- `dynamic_environment.ini` - Configuration for dynamic environments
- `resource_scarce.ini` - Configuration for resource-scarce environments

## Usage

To use a configuration file with NLM:

```bash
nlm --config path/to/config.ini
```

Or in Python:

```python
import nlm
config = nlm.Config()
config.loadFromFile("path/to/config.ini")
brain = nlm.createBrain(config)
```
EOF
```

## Configuration Best Practices

### 1. Keep Configurations Modular
- Group related settings in logical sections
- Use descriptive section names
- Avoid deeply nested structures

### 2. Document Configuration Values
- Add comments explaining each configuration parameter
- Specify valid ranges and units
- Document interaction between parameters

### 3. Use Environment Variables
```bash
# Set environment variables
export NLM_NEURON_COUNT=1000
export NLM_SIMULATION_TIMESTEP=0.001

# Use in configuration file
brain.neuron_count = $NLM_NEURON_COUNT
simulation.timestep = $NLM_SIMULATION_TIMESTEP
```

### 4. Version Control Configurations
```bash
# Add configuration files to git
. git add configs/*.ini
. git commit -m "Add configuration files for basic and advanced simulations"

# Create configuration versions
git tag v1.0.0-configs
```

### 5. Backup Configurations
```bash
# Create backup script
cat > backup_configs.sh << EOF
#!/bin/bash

BACKUP_DIR="config_backups"
DATE=$(date +%Y%m%d_%H%M%S)

mkdir -p "$BACKUP_DIR"

# Backup all configuration files
cp configs/*.ini "$BACKUP_DIR/config_backup_$DATE.ini"

# Keep only last 10 backups
ls -t "$BACKUP_DIR"/config_backup_*.ini | tail -n +11 | xargs rm -f

echo "Configuration backup completed: $BACKUP_DIR/config_backup_$DATE.ini"
EOF

# Make and run backup script
chmod +x backup_configs.sh
./backup_configs.sh
```

## Configuration Quick Reference

### Key Configuration Parameters

| Parameter | Type | Default | Range | Description |
|-----------|------|---------|-------|-------------|
| `brain.neuron_count` | int | 1000 | 10-10000 | Total number of neurons |
| `brain.synapse_density` | float | 0.1 | 0.01-0.2 | Synapse connectivity density |
| `simulation.timestep` | float | 0.001 | 0.0001-0.01 | Simulation timestep (s) |
| `simulation.max_steps` | int | 1000 | 100-10000 | Maximum simulation steps |
| `world.width` | int | 20 | 10-100 | World width (cells) |
| `world.height` | int | 20 | 10-100 | World height (cells) |

### Configuration Commands

```bash
# Create new configuration
cat > my_config.ini << EOF
[brain]
neuron_count = 500

[simulation]
timestep = 0.001
EOF

# Validate configuration
python3 -c "import nlm; config = nlm.Config(); print('Valid' if config.loadFromFile('my_config.ini') else 'Invalid')"

# View configuration summary
python3 -c "import nlm; config = nlm.Config(); config.loadFromFile('my_config.ini'); print(config.summary())"

# Export configuration to JSON
python3 -c "
import nlm, json
config = nlm.Config()
config.loadFromFile('my_config.ini')
with open('my_config.json', 'w') as f:
    json.dump(dict(config.getKeys()), f, indent=2)
print('Configuration exported to my_config.json')
"

# Import configuration from JSON
python3 -c "
import nlm, json
config = nlm.Config()

# Load JSON data
with open('my_config.json', 'r') as f:
    data = json.load(f)

# Set configuration values
for key, value in data.items():
    config.set(key, value)

print('Configuration imported successfully')
"
```

