# NLM Default Configuration File
# This is the default configuration file used by NLM (熙然)
# Copy this file as "configs/default.cfg" or use command line arguments

# ===================================
# Basic Neural Network Configuration
# ===================================

# Number of neurons in the simulation
# Range: 50-10000 (recommended: 500-5000)
neuron_count = 1000

# Number of neural regions
# Range: 1-10 (recommended: 1-3)
region_count = 1

# Connection probability between neurons
# Range: 0.05-0.30 (recommended: 0.1-0.2)
connection_probability = 0.1

# ===================================
# Simulation Timing
# ===================================

# Time step in seconds (smaller = more precise, larger = faster)
# Range: 0.0001-0.01 (recommended: 0.001 for millisecond precision)
simulation_timestep = 0.001

# ===================================
# Random Seed
# ===================================

# Seed for random number generator (enables reproducible results)
# Range: 0-2147483647 (recommended: 42, 123, 999, 2024)
random_seed = 42

# ===================================
# STDP (Spike-Timing-Dependent Plasticity)
# ===================================

# STDP parameters control learning based on spike timing

# LTP (Long-Term Potentiation): learning when pre-synaptic spike precedes post-synaptic spike
# Range: 0.001-0.05 (recommended: 0.015-0.03)
stdp_ltp_weight = 0.02

# LTD (Long-Term Depression): learning when pre-synaptic spike follows post-synaptic spike
# Range: 0.001-0.05 (recommended: 0.015-0.03)
stdp_ltd_weight = 0.015

# STDP time window in milliseconds
# Range: 5-50 (recommended: 10-30)
stdp_tau = 20.0

# ===================================
# Structural Plasticity
# ===================================

# Structural plasticity controls formation and elimination of synapses

# Synaptogenesis rate: probability of forming new synapses per timestep
# Range: 0.000001-0.001 (recommended: 0.00005-0.0002)
synaptogenesis_rate = 0.0001

# Pruning rate: probability of eliminating synapses per timestep
# Range: 0.000001-0.001 (recommended: 0.00001-0.00005)
pruning_rate = 0.00001

# ===================================
# Memory Systems
# ===================================

# Memory replay interval: steps between memory replay events
# Range: 10-500 (recommended: 50-200)
replay_interval = 100

# Memory consolidation interval: steps between memory consolidation events
# Range: 100-5000 (recommended: 500-2000)
consolidation_interval = 1000

# ===================================
# Development Parameters
# ===================================

# Development stage affects plasticity rates over time
# 0 = Initial (high plasticity)
# 1 = Critical Period (moderate plasticity)
# 2 = Maturation (lower plasticity)
# 3 = Adult (stable)
development_stage = 0

# ===================================
# Neuromodulation Levels
# ===================================

# Initial dopamine level (reward prediction error)
# Range: -1.0 to 1.0 (negative = punishment, positive = reward)
dopamine_level = 0.0

# Novelty detection threshold
# Range: 0.0-1.0 (higher = more sensitive to novelty)
novelty_threshold = 0.5

# Curiosity drive (exploration motivation)
# Range: 0.0-1.0 (higher = more exploration)
curiosity_level = 0.3

# ===================================
# Experimental Parameters
# ===================================

# For research and experimental configurations

# Prediction system update frequency (steps between prediction updates)
prediction_update_interval = 10

# Concept formation threshold
# Range: 0.0-1.0 (higher = faster concept formation)
concept_threshold = 0.7

# Attention system strength
# Range: 0.0-1.0 (higher = stronger competition)
attention_strength = 0.5

# ===================================
# Performance and Logging
# ===================================

# Log level for console output (0=Debug, 1=Info, 2=Warning, 3=Error, 4=Critical)
log_level = 1

# Enable/disable color output in console
use_colors = true

# Log file path (empty = console only)
log_file = ""

# Checkpoint save interval (0 = disabled)
checkpoint_interval = 1000

# Checkpoint directory
checkpoint_dir = "./checkpoints"

# ===================================
# Network Topology
# ===================================

# Neural population distribution
# Format: "Sensory:Internal:Motor" (ratios)
# Example: "1:2:1" = 25% Sensory, 50% Internal, 25% Motor
population_distribution = "1:2:1"

# Maximum synaptic weight
# Range: 1.0-10.0 (recommended: 2.0-5.0)
max_synaptic_weight = 2.0

# Minimum synaptic weight
# Range: -5.0-0.0 (recommended: -2.0-0.0)
min_synaptic_weight = -2.0

# ===================================
# Behavioral Parameters
# ===================================

# Reward magnitude scaling
# Range: 0.1-10.0 (recommended: 1.0)
reward_scale = 1.0

# Action selection threshold
# Range: 0.0-1.0 (higher = more deterministic selection)
action_threshold = 0.5

# ===================================
# Advanced Configuration
# ===================================

# Enable/disable specific systems
enable_prediction = true
enable_concept_formation = true
enable_structural_plasticity = true
enable_development = true
enable_sleep_replay = true

# Memory capacity limits
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_max_associations = 5000

# Integration intervals (steps between system updates)
memory_update_interval = 1
prediction_update_interval = 10
concept_update_interval = 100
attention_update_interval = 5
neuromodulation_update_interval = 1

# ===================================
# Research-Specific Parameters
# ===================================

# These parameters are primarily for scientific research and experimentation

# Pattern formation threshold
pattern_threshold = 0.8

# Memory replay selection strength
replay_selection_strength = 0.7

# Consolidation strength (how strongly memories are consolidated)
consolidation_strength = 0.3

# Forgetting rate (how quickly memories decay)
forgetting_rate = 0.01

# Social learning parameters
# Enable social learning from other agents
social_learning_enabled = false
# Social learning rate
social_learning_rate = 0.5

# Sensory processing parameters
# Vision resolution (width x height)
vision_width = 16
vision_height = 16

# Touch sensitivity range
touch_sensitivity_min = 0.0
touch_sensitivity_max = 1.0

# Internal signal ranges
internal_signal_min = -1.0
internal_signal_max = 1.0

# ===================================
# Configuration Comments
# ===================================

# This configuration file was generated by the NLM configuration system.
# For optimal performance, adjust parameters based on your specific use case.

# Research configurations typically use:
# - Lower neuron_count for rapid experimentation
# - Higher connection_probability for richer connectivity
# - Smaller timesteps for precise timing analysis
# - Enhanced plasticity for studying learning dynamics

# Production configurations typically use:
# - Higher neuron_count for more complex behaviors
# - Lower connection_probability for stability
# - Larger timesteps for better performance
# - Standard plasticity for consistent behavior

# Development configurations typically use:
# - Very low neuron_count for fast iteration
# - Higher plasticity rates for exploration
# - Frequent checkpointing for debugging
# - Enhanced logging for monitoring

# Configuration file format:
# key = value
# Keys with spaces should be quoted: "key with spaces" = value
# Values with spaces should be quoted: key = "value with spaces"
# Comments start with # or //
# Empty lines are ignored

# Example of how to modify this file:
# neuron_count = 2000
# connection_probability = 0.15
# stdp_ltp_weight = 0.025

# To use this configuration file:
# ./nlm --config configs/default.cfg
# Or specify a different path:
# ./nlm --config /path/to/your/config.cfg
