# NLM Configuration File
# Optimized for stable neural dynamics with balanced excitation/inhibition

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (reduced from 1000 to 500 for better control)
neuron_count = 500

# Number of brain regions (reduced from 2 to 1 for simpler initialization)
region_count = 1

# Connection probability for random connectivity (reduced from 0.1 to 0.05 for better stability)
connection_probability = 0.05

# Plasticity settings (reduced learning rates to prevent runaway excitation)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.005  # Reduced from 0.01
stdp_ltd_weight = 0.006  # Reduced from 0.012
stdp_time_constant = 20.0

# Development settings (reduced rates to prevent excessive structural changes)
development_synaptogenesis_rate = 0.0001  # Reduced from 0.001
development_pruning_rate = 0.00001       # Reduced from 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
