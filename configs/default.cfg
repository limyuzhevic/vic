# NLM Configuration File
# ====================
# Default configuration for NLM (Neural Learning Machine) Phase 6
# This file contains typical settings for the artificial developmental brain
#
# Format: key = value
# Comments start with #
# Values can be quoted if they contain spaces

# ===== General Simulation Parameters =====
# Number of neurons in the network
neuron_count = 1000

# Number of neural regions
region_count = 1

# Connection probability between neurons (0.0 to 1.0)
connection_probability = 0.1

# Simulation time step in seconds
simulation_timestep = 0.001

# Random seed for reproducible simulations
random_seed = 42

# ===== Plasticity Parameters =====
# STDP LTP (Long-Term Potentiation) weight factor
stdp_ltp_weight = 0.01

# STDP LTD (Long-Term Depression) weight factor
stdp_ltd_weight = 0.012

# STDP time constant in milliseconds
stdp_tau = 20.0

# Synaptogenesis rate (new synapses per step)
synaptogenesis_rate = 0.0001

# Pruning rate (synapse removal per step)
pruning_rate = 0.00001

# ===== Neuromodulation =====
# Enable/disable neuromodulation systems
enable_dopamine = true
enable_curiosity = true
enable_novelty = true
enable_prediction_error = true

# ===== Memory Systems =====
# Enable working memory
enable_working_memory = true
working_memory_capacity = 1000

# Enable episodic memory
enable_episodic_memory = true
episodic_memory_capacity = 500

# Enable associative memory
enable_associative_memory = true

# ===== Development =====
# Enable developmental plasticity
enable_development = true
development_rate = 0.001

# ===== Checkpointing =====
# Enable checkpoint saving
enable_checkpointing = true

# Checkpoint file path
checkpoint_path = "./checkpoint_test.bin"

# Checkpoint interval (steps)
checkpoint_interval = 10000

# ===== Replay and Consolidation =====
# Enable episodic memory replay
enable_replay = true
replay_interval = 100
consolidation_interval = 1000

# ===== Agent Configuration =====
# Enable reward modulation
enable_reward_modulation = true

# Enable structural plasticity
enable_structural_plasticity = true

# Enable curiosity-driven exploration
enable_curiosity_driven = true

# ===== Performance Settings =====
# Enable performance optimizations
enable_simd = true
enable_parallel_processing = true
enable_memory_pools = true

# ===== Environment =====
# Environment type (simple, complex)
environment_type = "simple"

# Environment size (for simple environments)
environment_width = 16
environment_height = 16

# ===== Experiment Settings =====
# Maximum simulation steps
max_steps = 10000

# Target firing rate (Hz)
target_firing_rate = 10.0

# Reward function parameters
reward_success = 1.0
reward_failure = -1.0
reward_step_penalty = 0.0

# ===== Logging and Monitoring =====
# Log level (debug, info, warning, error)
log_level = "info"

# Enable performance monitoring
enable_performance_monitoring = true

# ===== Advanced Options =====
# Experimental feature flags
experimental_features = false

# Validation mode (strict, lenient)
validation_mode = "lenient"

# Import/export settings
export_format = "json"
import_format = "json"