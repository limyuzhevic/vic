# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
# Learning rate for synaptic plasticity
plasticity_learning_rate = 0.01
# Long-term potentiation weight for STDP
stdp_ltp_weight = 0.01
# Long-term depression weight for STDP
stdp_ltd_weight = 0.012
# Time constant for STDP (in milliseconds)
stdp_time_constant = 20.0

# Development settings
# Rate of synaptogenesis (formation of new synapses)
development_synaptogenesis_rate = 0.001
# Rate of synaptic pruning (elimination of synapses)
development_pruning_rate = 0.0001

# Neuromodulation settings
# Baseline dopamine level (normalized to 0.0-1.0 range)
dopamine_baseline = 0.1

# Reward settings
# Discount factor for reward calculation
reward_discount_factor = 0.99

# Environment settings
# Name of the simulation environment (e.g., GridWorld)
environment_name = GridWorld
# Width of the environment (in grid cells)
environment_width = 10
# Height of the environment (in grid cells)
environment_height = 10

# Logging settings
# Logging level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
# Whether to write logs to a file
log_to_file = false
# Filename for log output
log_filename = nlm.log

# Simulation settings
# Maximum number of simulation steps
max_simulation_steps = 10000
# Maximum simulation time in seconds (0.0 = unlimited)
simulation_time_limit = 0.0

# Visualization settings
# Whether to enable visualization
visualization_enabled = false
# Frame rate for visualization updates (Hz)
visualization_update_rate = 30.0
