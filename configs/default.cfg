# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 6: Integration-specific settings
replay_interval = 100
consolidation_interval = 1000
enable_checkpointing = true
enable_replay = true
enable_development = true
checkpoint_path = ./checkpoint_test.bin
checkpoint_dir = ./checkpoints
max_checkpoints = 10
checkpoint_compression = balanced

# Memory system settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_capacity = 500

# Prediction system settings
prediction_horizon = 10
prediction_error_threshold = 0.1

# Development system settings
development_plasticity_initial = 1.0
development_plasticity_critical_period = 0.8
development_plasticity_maturation = 0.5
development_plasticity_adult = 0.2

# Neuromodulation settings
curiosity_threshold = 0.1
novelty_threshold = 0.2
prediction_error_weight = 0.5

# Cognition system settings
planner_planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_formation_threshold = 0.5

# Performance settings
enable_vectorization = true
enable_multithreading = false
performance_profiling = false
simulation_speed_limit = 0.0  # Unlimited

# Advanced features
enable_advanced_planning = true
enable_social_learning = false
enable_continuous_learning = true

# Debug and development settings
debug_neuron_tracking = false
debug_synapse_tracking = false
debug_memory_tracking = false
debug_plasticity_tracking = false
debug_performance_stats = false
enable_assertions = true
log_internal_state = false
