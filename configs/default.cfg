# Default NLM Configuration
# Phase 2: Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation settings
simulation_timestep = 0.001  # Seconds per simulation step
neuron_count = 500           # Number of neurons in the network
region_count = 1             # Number of neural regions
connection_probability = 0.15  # Probability of forming a synapse between neurons

# Plasticity settings
# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Hebbian plasticity
hebbian_learning_rate = 0.01
hebbian_time_constant = 100.0

# Structural plasticity
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation
enable_dopamine = true
enable_curiosity = true
enable_novelty = true
enable_prediction_error = true

# Memory system
enable_working_memory = true
enable_episodic_memory = true
enable_associative_memory = true

# Development
enable_development = true
development_stage = "initial"
development_rate = 0.01

# Replay
enable_replay = true
replay_interval = 100
consolidation_interval = 1000

# Checkpointing
enable_checkpointing = true
checkpoint_dir = "./checkpoints"
checkpoint_interval = 1000

# Logging
log_level = "info"
log_file = "nlm.log"
log_to_console = true

# Experiment settings
test_duration = 1000
enable_progress_logging = true
progress_interval = 100

# Performance
enable_multithreading = false
thread_count = 4