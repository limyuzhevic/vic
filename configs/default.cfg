# NLM Configuration Examples

This file contains comprehensive examples of NLM configuration files for different use cases and complexity levels.

## Overview

NLM uses configuration files to set up brain parameters, simulation settings, and learning rules. These examples cover:
- Basic configurations for beginners
- Advanced configurations for research
- Environment-specific configurations
- Custom configuration templates

## Example 1: Basic Configuration (For Beginners)

```ini
# Basic NLM Configuration - Example 1
# Simple configuration for basic brain simulation

# Brain Parameters
brain:
  neuron_count: 500                    # Total number of neurons
  synapse_density: 0.1                 # Synapse connectivity density
  connection_probability: 0.05        # Probability of connection between neurons
  initial_weight_mean: 0.5             # Mean initial synaptic weight
  initial_weight_std: 0.1              # Standard deviation of initial weights
  v_thresh: -50.0                     # Neuron threshold potential (mV)
  v_rest: -70.0                        # Resting potential (mV)
  v_reset: -75.0                       # Reset potential after spike (mV)

# Plasticity Rules
plasticity:
  stdp:
    enable: true                      # Enable STDP learning
    learning_rate: 0.001               # STDP learning rate
    tau_plus: 20.0                      # STDP time constant (ms)
    tau_minus: 20.0                     # STDP time constant (ms)
  hebbian:
    enable: true                      # Enable Hebbian learning
    learning_rate: 0.01                # Hebbian learning rate
  structural:
    enable: true                      # Enable structural plasticity
    synaptogenesis_rate: 0.0001         # Rate of new synapse formation
    pruning_rate: 0.00001              # Rate of synapse elimination

# Neuromodulation
neuromod:
  dopamine:
    scale: 1.0                        # Dopamine modulation scale
  curiosity:
    enable: true                      # Enable curiosity-driven exploration
  novelty:
    enable: true                      # Enable novelty detection

# Memory Systems
memory:
  working:
    capacity: 10000                  # Working memory capacity
    decay_rate: 0.01                  # Working memory decay rate
  episodic:
    capacity: 5000                   # Episodic memory capacity
    consolidation_interval: 100       # Consolidation interval (steps)
  associative:
    capacity: 2000                    # Associative memory capacity
    learning_rate: 0.005              # Associative learning rate

# Development
development:
  enable: true                       # Enable developmental processes
  initial_stage: "Initial"            # Starting developmental stage
  stage_durations:
    Initial: 60.0                     # Duration of Initial stage (s)
    CriticalPeriod: 300.0             # Duration of CriticalPeriod stage (s)
    Maturation: 900.0                 # Duration of Maturation stage (s)
    Adult: -1.0                       # Adult stage (no duration limit)
    Aging: 1800.0                     # Duration of Aging stage (s)

# World Parameters
world:
  width: 20                          # World width (cells)
  height: 20                         # World height (cells)
  vision_width: 8                    # Vision width (cells)
  vision_height: 8                   # Vision height (cells)
  max_energy: 100.0                  # Maximum energy per agent
  energy_decay_rate: 0.001           # Energy decay rate

# Simulation Parameters
simulation:
  timestep: 0.001                   # Simulation timestep (s)
  max_steps: 1000                    # Maximum simulation steps
  enable_checkpointing: true         # Enable checkpoint save/load
  checkpoint_interval: 100           # Checkpoint interval (steps)
  enable_replay: false               # Enable memory replay

# Agent Settings
agent:
  reward_modulation_enabled: true    # Enable reward-based learning
  structural_plasticity_enabled: true # Enable structural plasticity
  development_enabled: true          # Enable developmental processes
  curiosity_enabled: true            # Enable curiosity-driven exploration

# Logging Configuration
logging:
  level: "Info"                      # Log level (Debug, Info, Warning, Error)
  enable_console: true               # Enable console logging
  enable_file: false                 # Enable file logging
  log_file: "nlm_simulation.log"     # Log file name
```

