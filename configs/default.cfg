# NLM Configuration File
# This is the default configuration for Phase 6 integrated artificial brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.00001f

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Memory system settings
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
replay_interval = 100
consolidation_interval = 1000

# Sleep/rest cycle settings
rest_threshold = 10.0
consolidation_duration = 2.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced neuromodulation settings
curiosity_baseline = 0.05
novelty_baseline = 0.02
prediction_error_baseline = 0.01

# Memory consolidation settings
working_memory_decay_rate = 0.01
episodic_memory_importance_threshold = 0.5
consolidation_strength = 0.8

# Development settings (Phase 6 specific)
development_critical_period_end = 1000
development_maturation_rate = 0.01
development_pruning_strength = 0.1

# Prediction system settings
prediction_confidence_threshold = 0.7
prediction_learning_rate = 0.05
prediction_error_scaling = 1.0

# Attention system settings
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
attention_gating_strength = 0.8

# Concept formation settings
concept_formation_rate = 0.02
concept_threshold = 0.3
concept_similarity_threshold = 0.6

# Planning system settings
planning_depth = 5
planning_horizon = 10
planning_risk_tolerance = 0.5

# Checkpoint system settings
checkpoint_interval = 10000
checkpoint_compression = balanced
checkpoint_retention_count = 5
checkpoint_max_size = 10000

# Visualization system settings
visualization_fps = 60
visualization_show_neuron_activities = true
visualization_show_memory_contents = true
visualization_show_prediction_confidence = true
visualization_show_planning_tree = true
