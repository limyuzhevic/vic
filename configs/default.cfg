# NLM Configuration File
# Enhanced configuration with advanced options

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_maturation_rate = 0.0005

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_sensitivity = 1.0
curiosity_baseline = 0.05
novelty_threshold = 0.3
prediction_error_weight = 0.5

# Reward settings
reward_discount_factor = 0.99
reward_decay_rate = 0.01
reward_baseline = 0.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_episodic_memory_size = 100

# Memory systems
working_memory_size = 50
episodic_memory_capacity = 1000
associative_memory_pattern_count = 500

# Sensory processing
sensory_noise_level = 0.01
sensory_filter_strength = 0.8

# Motor control
motor_noise_level = 0.02
motor_response_time = 0.05

# Cognition
cognition_planning_horizon = 10
cognition_concept_threshold = 0.7
cognition_attention_strength = 0.9

# Development
development_initial_excitability = 0.5
development_maturation_rate = 0.1
development_plasticity_decay = 0.01

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_size_mb = 10
log_include_timestamps = true
log_include_thread_ids = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval_steps = 1000
save_checkpoint_on_exit = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_frame_rate = 30.0
visualization_window_width = 1024
visualization_window_height = 768

# Performance optimizations
memory_pool_size = 1000
event_queue_capacity = 5000
use_simd_optimization = true
use_parallel_processing = false