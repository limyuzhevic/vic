# Test mode: connectivity, plasticity, stdp, or all
# test_mode = all

# Test intensity: 0 = light, 1 = medium, 2 = heavy
# test_intensity = 1

# Test duration in steps
# test_duration = 0

# Logging level
# log_level = info
