# NLM Configuration File
# This is the enhanced configuration for Phase 6 - Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0

# Advanced plasticity settings for metaplasticity
enable_metaplasticity = true
enable_batch_operations = false

# Structural plasticity settings
deviational_threshold = 2.0
synaptogenesis_rate = 0.0001f
pruning_rate = 0.00001f

# Neuromodulation settings
dopamine_baseline = 0.0
novelty_sensitivity = 0.5f
curiosity_threshold = 0.3f
prediction_error_decay = 0.95f

# Development settings
enable_development = true
developmental_stage_transition_time = 60.0f
plasticity_modulation_factor = 1.0f

# Memory settings
working_memory_capacity = 100
working_memory_decay_rate = 0.95f
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_interval = 1000

# Reward and learning settings
reward_discount_factor = 0.99f
reward_prediction_error_learning_rate = 0.05f

# Checkpointing settings
enable_checkpointing = true
checkpoint_dir = ./checkpoints
checkpoint_save_interval = 10000
checkpoint_max_checkpoints = 5
checkpoint_compress = true

# Replay settings
enable_replay = true
replay_mode = consolidation  # consolidation, exploration, random
replay_probability = 0.1f

# Integration and connectivity settings
integration_timeout = 300.0f
connectivity_consistency_check = true
performance_monitoring_enabled = true

# Advanced debugging and analysis
debug_mode = false
performance_profile_enabled = false
profile_interval = 1000
memory_trace_enabled = false

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0f
visualization_data_file = brain_state.json

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
integration_test_mode = false

# Experimental parameters
experiment_name = phase6_integration
experiment_seed = 42
collect_metrics = true
save_metrics_file = experiment_metrics.json
