# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
    dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced performance settings for expert users
    # SIMD configuration
    enable_simd = true
    simd_precision = 128-bit
    
    # Parallel processing settings
    max_threads = 8
    thread_affinity = true
    work_queue_size = 1024
    
    # Memory optimization settings
    use_memory_pools = true
    memory_pool_size = 1048576
    enable_swapping = false
    
    # Neural precision settings
    neuron_precision = double
    synaptic_precision = float
    enable_neural_compression = false
    
    # Development mode settings
    enable_debug_mode = false
    enable_profiling = false
    profile_frequency = 1000
    
    # Advanced plasticity settings
    enable_structural_plasticity = true
    structural_plasticity_rate = 0.0001
    enable_hebbian_learning = true
    enable_stdp_learning = true
    stdp_learning_rate = 0.01
    
    # Advanced neuromodulation settings
    enable_dopamine_modulation = true
    dopamine_sensitivity = 1.0
    enable_curiosity_modulation = true
    curiosity_threshold = 0.1
    enable_novelty_detection = true
    novelty_sensitivity = 0.5
    
    # Advanced prediction settings
    enable_prediction_system = true
    prediction_window = 10
    prediction_confidence_threshold = 0.7
    enable_prediction_error = true
    prediction_error_gain = 0.5
    
    # Advanced memory settings
    enable_working_memory = true
    working_memory_capacity = 100
    enable_episodic_memory = true
    episodic_memory_capacity = 1000
    enable_associative_memory = true
    association_strength = 0.5
    
    # Advanced cognition settings
    enable_neural_planning = true
    planning_horizon = 5
    enable_concept_formation = true
    concept_learning_rate = 0.01
    enable_attention_system = true
    attention_focus_strength = 1.0
    
    # Advanced development settings
    enable_development_stages = true
    enable_critical_period = true
    critical_period_start = 1000
    critical_period_end = 5000
    enable_maturation_process = true
    maturation_rate = 0.01
    
    # Advanced visualization settings
    enable_detailed_visualization = false
    visualization_resolution = 1920x1080
    visualization_update_frequency = 30
    enable_network_visualization = false
    enable_spike_raster = false
    enable_weight_matrix = false
    
    # Advanced logging settings
    enable_timestamps = true
    log_precision = double
    enable_structured_logging = false
    log_file_rotation = true
    max_log_size = 10485760
