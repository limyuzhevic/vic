# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Agent Brain Configuration
# Sensory processing parameters
agent_vision_width = 16
agent_vision_height = 16
agent_touch_size = 8
agent_internal_size = 4
agent_proprioception_size = 6

# Current scaling factors
agent_vision_current_scale = 5.0
agent_touch_current_scale = 8.0
agent_internal_current_scale = 5.0
agent_proprioception_current_scale = 3.0

# Neuromodulation parameters
agent_novelty_decay_rate = 0.99
agent_curiosity_multiplier = 2.0
agent_prediction_error_weight = 0.5

# Exploration parameters
agent_curiosity_threshold = 0.3
agent_activity_threshold = 0.5
agent_exploration_chance = 0.3

# Reward modulation parameters
agent_expected_reward_alpha = 0.95
agent_expected_reward_beta = 0.05
agent_dopamine_clamp_min = -1.0
agent_dopamine_clamp_max = 1.0
agent_eligibility_threshold = 0.001
agent_eligibility_decay = 0.1
agent_plasticity_base = 0.5
agent_plasticity_min = 0.1
agent_plasticity_max = 2.0

# STDP parameters
agent_stdp_ltp_base = 0.01
agent_stdp_ltd_base = 0.012

# Development parameters
agent_development_stage_1_end = 60.0
agent_development_stage_2_end = 300.0
agent_development_stage_3_end = 900.0
agent_plasticity_initial = 1.0
agent_plasticity_critical = 0.8
agent_plasticity_mature = 0.5
agent_plasticity_adult = 0.2

# Structural plasticity
agent_synaptogenesis_base_rate = 0.0001
agent_pruning_base_rate = 0.00001
agent_pruning_factor = 2.0

# Neural dynamics
agent_current_injection_strong = 60.0
agent_current_injection_weak = 30.0

# Statistical thresholds
agent_weight_change_significance = 0.01
agent_mean_weight_difference_threshold = 0.001
