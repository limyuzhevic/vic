# NLM Configuration File
# This is the default configuration for Phase 1 skeleton
# Format: [SECTION] key = value  # Description

# ============================================================================
# CORE SIMULATION PARAMETERS
# ============================================================================

# Random seed for reproducible experiments
random_seed = 42  # Random seed for experiment reproducibility

# Simulation timestep in seconds
simulation_timestep = 0.001  # Time step size for neural simulation

# Number of neurons in the brain
neuron_count = 1000  # Total number of neurons in the brain network

# Number of brain regions
region_count = 2  # Number of independent neural regions

# Connection probability for random connectivity
connection_probability = 0.1  # Probability of forming connections between neurons

# =============================================================================
# PLASTICITY PARAMETERS
# =============================================================================

# Plasticity learning rate (general)
plasticity_learning_rate = 0.01  # General rate for synaptic plasticity changes

# STDP (Spike-Timing-Dependent Plasticity) parameters
stdp_ltp_weight = 0.01  # STDP long-term potentiation weight
stdp_ltd_weight = 0.012  # STDP long-term depression weight
stdp_tau = 20.0  # STDP time constant (tau) in milliseconds

# =============================================================================
# DEVELOPMENT PARAMETERS
# =============================================================================

# Development settings for brain maturation
synaptogenesis_rate = 0.001  # Rate of new synapse formation
pruning_rate = 0.0001  # Rate of synapse elimination

# =============================================================================
# NEUROMODULATION PARAMETERS
# =============================================================================

# Neuromodulation settings
dopamine_baseline = 0.1  # Baseline dopamine level for reward and motivation

# =============================================================================
# REWARD PARAMETERS
# =============================================================================

# Reward settings
reward_discount_factor = 0.99  # Discount factor for future rewards

# =============================================================================
# ENVIRONMENT PARAMETERS
# =============================================================================

# Environment settings for neural interaction
environment_name = GridWorld  # Name of the simulated environment
environment_width = 10  # Width of the environment grid
environment_height = 10  # Height of the environment grid

# =============================================================================
# LOGGING PARAMETERS
# =============================================================================

# Logging settings
log_level = INFO  # Logging verbosity level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_to_file = false  # Whether to log to file in addition to console
log_filename = nlm.log  # Filename for log file output

# =============================================================================
# SIMULATION PARAMETERS
# =============================================================================

# Simulation settings
max_simulation_steps = 10000  # Maximum number of simulation steps
simulation_time_limit = 0.0  # Simulation time limit in seconds (0 = unlimited)

# =============================================================================
# VISUALIZATION PARAMETERS
# =============================================================================

# Visualization settings
visualization_enabled = false  # Whether to enable visualization
visualization_update_rate = 30.0  # Visualization update rate in Hz
