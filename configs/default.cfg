# Default configuration for NLM CLI

# Core simulation parameters
neuron_count: 500
region_count: 1
connection_probability: 0.15
simulation_timestep: 0.001
random_seed: 42
max_steps: 1000

# Learning parameters
stdp_ltp_weight: 0.02
stdp_ltd_weight: 0.015
stdp_tau: 20.0

# Structural plasticity parameters
synaptogenesis_rate: 0.0001
pruning_rate: 0.00001

# Neuromodulation parameters
enable_dopamine: true
enable_curiosity: true
enable_novelty: true
enable_prediction_error: true

# Memory parameters
working_memory_size: 100
episodic_memory_capacity: 1000
associative_memory_threshold: 0.5

# Development parameters
enable_development: true
developmental_plasticity_factor: 1.0

# Experiment parameters
enable_checkpointing: true
checkpoint_path: /tmp/nlm_checkpoint.bin
enable_replay: true
replay_interval: 100

# Visualization parameters
enable_visualization: false
visualizations:
  neurons: false
  synapses: false
  memory: false
  all: false

# Logging parameters
log_level: INFO
log_file: nlm_cli.log
verbose: false

# CLI specific parameters
cli:
  verbose: false
  quiet: false
  output_format: text
  color_output: true
  config_file: configs/default.cfg
  enable_tab_completion: true
  enable_command_history: true