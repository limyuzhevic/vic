# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings (Phase 2: Real Neural Computation)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
plasticity_learning_rate = 0.01

# Structural plasticity settings
dopamine_baseline = 0.1
dopa_shift = 0.5  # Dopamine shift parameter for plasticity
dopa_weight = 1.0  # Dopamine weight multiplier for plasticity

# Development settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Reward settings
reward_discount_factor = 0.99
reward_window = 10.0  # Reward integration window

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_detailed = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_checkpoints = true
checkpoint_interval = 1000

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
enable_progress_logging = true
progress_log_interval = 100

# Neural dynamics settings
neuron_threshold = -50.0
neuron_rest_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Memory system settings
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_strength = 0.5

# Prediction system settings
prediction_horizon = 10
prediction_confidence_threshold = 0.7

# Neuromodulation settings
curiosity_scaling = 1.0
novelty_threshold = 0.5
prediction_error_decay = 0.1

# Development stages
development_start_time = 0.0
development_end_time = 100.0
development_stage_duration = 20.0
