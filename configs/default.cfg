# NLM Configuration File
# Phase 6: Final Integration Configuration
# 
# This is the enhanced default configuration for NLM Phase 6
# Contains comprehensive settings for neural simulation, plasticity, development, and more

# ============================================================================
# RANDOM SEED AND BASIC SIMULATION
# ============================================================================

# Random seed for reproducible experiments
# Default: 42 (fixed seed for consistent testing)
# Use any 64-bit unsigned integer
random_seed = 42

# Simulation timestep in seconds (DT)
# Controls the temporal resolution of the simulation
# Default: 0.001 (1 millisecond - typical for biological simulations)
simulation_timestep = 0.001

# Maximum simulation duration in seconds
# 0.0 = unlimited (will stop based on other criteria)
simulation_time_limit = 0.0

# ============================================================================
# NEURAL NETWORK PARAMETERS
# ============================================================================

# Number of neurons in the brain
# Default: 1000 (balanced load for most systems)
# Larger values enable more complex behavior but increase memory/computation
neuron_count = 500

# Number of brain regions (if using multi-region architecture)
# Default: 1 (single region for simplicity)
# Can be >1 for region-specific processing
region_count = 1

# Connection probability for random connectivity (0.0 to 1.0)
# Default: 0.15 (moderately sparse connectivity)
# Lower values = more sparse, higher values = denser connectivity
connection_probability = 0.15

# ============================================================================
# NEURON DYNAMICS PARAMETERS
# ============================================================================

# Neuron membrane capacitance (nF)
neuron_membrane_capacitance = 1.0

# Membrane time constant (tau) in milliseconds
neuron_membrane_time_constant = 20.0

# Resting membrane potential (mV)
neuron_resting_potential = -70.0

# Firing threshold (mV)
neuron_firing_threshold = -55.0

# Reset potential after spike (mV)
neuron_reset_potential = -70.0

# Refractory period in simulation steps
neuron_refractory_period = 5

# Leak conductance (nS)
neuron_leak_conductance = 10.0

# Spike frequency adaptation strength
neuron_adaptation_strength = 0.5

# ============================================================================
# PLASTICITY RULES
# ============================================================================

# General learning rate multiplier
plasticity_learning_rate = 0.01

# STDP (Spike-Timing-Dependent Plasticity) parameters

# Long-Term Potentiation (LTP) weight change
# Positive value: strengthens synapses when pre fires before post
stdp_ltp_weight = 0.02

# Long-Term Depression (LTD) weight change
# Negative value: weakens synapses when post fires before pre
stdp_ltd_weight = 0.015

# STDP time window (tau) in milliseconds
stdp_time_window = 20.0

# STDP eligibility trace decay rate
stdp_trace_decay = 0.9

# STDP minimum weight change for learning
stdp_minimum_change = 0.001

# ============================================================================
# DEVELOPMENT SYSTEM PARAMETERS
# ============================================================================

# Synaptogenesis rate (rate of new synapse formation)
# Default: 0.0001 per simulation step per neuron
# Represents neurodevelopmental wiring
# Default: 0.0001 (very low for adult brain)
# Can be higher during critical periods
development_synaptogenesis_rate = 0.0001

# Pruning rate (rate of synapse elimination)
# Default: 0.00001 per simulation step per neuron
# Represents synaptic refinement
# Default: 0.00001 (low pruning for stable adult brain)
# Higher values during developmental stages
development_pruning_rate = 0.00001

# Developmental stage (not used directly in config, but for initialization)
# 0: Initial, 1: CriticalPeriod, 2: Maturation, 3: Adult, 4: Aging
development_stage = 3

# ============================================================================
# NEUROMODULATION PARAMETERS
# ============================================================================

# Dopamine system parameters

# Baseline dopamine level (affects global excitability)
dopamine_baseline = 0.1

# Dopamine gain (how strongly dopamine affects plasticity)
dopamine_gain = 1.0

# Dopamine decay rate
dopamine_decay_rate = 0.95

# Curiosity neuromodulator parameters

# Baseline curiosity level (drives exploration)
curiosity_baseline = 0.1

# Curiosity gain (modulates learning rate)
curiosity_gain = 0.5

# Novelty detection threshold
novelty_threshold = 0.5

# ============================================================================
# REWARD AND LEARNING PARAMETERS
# ============================================================================

# Reward discount factor (gamma)
# Future rewards are discounted by this factor
reward_discount_factor = 0.99

# Reward prediction error learning rate
reward_prediction_error_rate = 0.1

# Maximum possible reward per step
reward_max_per_step = 1.0

# ============================================================================
# MEMORY SYSTEMS
# ============================================================================

# Working memory parameters

# Number of traces in working memory
working_memory_capacity = 100

# Trace decay rate (how long information is retained)
working_memory_trace_decay = 0.95

# Trace competition strength (which traces dominate)
working_memory_competition_strength = 1.0

# Episodic memory parameters

# Maximum number of episodes to store
episodic_memory_capacity = 1000

# Episode consolidation threshold (when to consolidate)
episodic_memory_consolidation_threshold = 5

# Episode replay rate (how often to replay)
episodic_memory_replay_rate = 0.01

# ============================================================================
# PREDICTION SYSTEM
# ============================================================================

# Prediction system parameters

# Prediction accuracy threshold
prediction_accuracy_threshold = 0.8

# Prediction update rate (how quickly predictions adapt)
prediction_update_rate = 0.05

# Prediction error threshold for learning
prediction_error_threshold = 0.1

# ============================================================================
# ENVIRONMENT INTERACTION
# ============================================================================

# Environment configuration

# World/environment name
environment_name = SimpleWorld

# Grid/world dimensions (for grid-based environments)
environment_width = 20
environment_height = 20

# Vision/sensory parameters

# Vision field of view (angle in degrees)
vision_field_of_view = 180.0

# Vision sensitivity (how much sensory input is detected)
vision_sensitivity = 1.0

# Audio/sensory parameters

# Audio range (maximum distance sound can be detected)
audio_range = 10.0

# Audio sensitivity
audio_sensitivity = 1.0

# ============================================================================
# LOGGING AND OUTPUT
# ============================================================================

# Logging levels:
# DEBUG: Detailed debug information
# INFO: Normal operational information
# WARNING: Potential issues that don't prevent operation
# ERROR: Errors that may affect operation
# CRITICAL: Critical failures
log_level = INFO

# Enable logging to file (in addition to console)
log_to_file = false

# Log file path
log_filename = nlm.log

# Log file max size (in MB) before rotation
log_max_file_size = 100

# Log rotation (number of backup files to keep)
log_rotation_count = 5

# ============================================================================
# VISUALIZATION AND MONITORING
# ============================================================================

# Visualization settings

# Enable real-time visualization (requires external display)
visualization_enabled = false

# Visualization update rate (frames per second)
visualization_update_rate = 30.0

# Visualization parameters

# Neuron size in visualization units
visualization_neuron_size = 2.0

# Synapse transparency in visualization
visualization_synapse_transparency = 0.7

# Color scheme options:
# default: Standard color scheme
# heatmap: Heat map based on activity
# continuum: Activity continuum colors
# rainbow: Rainbow color spectrum
visualization_color_scheme = default

# ============================================================================
# EXPERIMENTAL AND DEBUGGING
# ============================================================================

# Experimental mode flags

# Enable experimental features (may be unstable)
experimental_features = false

# Enable debug output (even if log_level > DEBUG)
debug_output = false

# Enable performance profiling
performance_profiling = false

# Performance profiling output format:
# console: Print to console
# file: Write to file
# both: Use both formats
performance_profiling_output = console

# ============================================================================
# CHECKPOINT AND PERSISTENCE
# ============================================================================

# Checkpoint settings

# Enable automatic checkpointing
checkpoint_enabled = false

# Checkpoint interval (simulation steps between saves)
checkpoint_interval = 10000

# Checkpoint file path (can include wildcards)
checkpoint_path = /tmp/nlm_checkpoint_%.p

# ============================================================================
# THREADING AND PARALLELIZATION
# ============================================================================

# Parallel processing settings

# Enable multithreading for parallel neuron processing
enable_multithreading = false

# Number of threads to use (0 = auto-detect)
thread_count = 0

# Thread pool size for parallel tasks
thread_pool_size = 0

# ============================================================================
# SIMULATION CONTROL
# ============================================================================

# General simulation control

# Number of simulation steps to run
# 0 = run until completion criteria met
max_simulation_steps = 10000

# Enable early stopping if learning plateau detected
early_stopping_enabled = true

# Learning plateau threshold (minimum improvement required)
early_stopping_threshold = 0.001

# Early stopping patience (consecutive steps without improvement)
early_stopping_patience = 1000

# ============================================================================
# ADVANCED NEURAL DYNAMICS
# ============================================================================

# Advanced neural properties

# Enable synaptic depression (short-term plasticity)
enable_synaptic_depression = true

# Enable synaptic facilitation (short-term plasticity)
enable_synaptic_facilitation = true

# Synaptic depression time constant
Synaptic_depression_time_constant = 100.0

# Synaptic facilitation time constant
Synaptic_facilitation_time_constant = 500.0

# Synaptic depression strength
Synaptic_depression_strength = 0.8

# Synaptic facilitation strength
Synaptic_facilitation_strength = 1.2

# ============================================================================
# MONITORING AND METRICS
# ============================================================================

# Monitoring and statistics

# Enable real-time metrics collection
enable_metrics = true

# Metrics collection interval (steps)
metrics_interval = 100

# Enable performance monitoring
enable_performance_monitoring = false

# Performance monitoring interval
performance_monitoring_interval = 1000

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
