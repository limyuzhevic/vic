# NLM Configuration File
# This configuration supports all NLM phases, from Phase 1 (skeleton) through Phase 6 (full integration)
# Configuration values can be overridden via command line or environment variables

# =============================================================================
# BASIC SIMULATION PARAMETERS
# =============================================================================

# Random seed for reproducible experiments (set to 0 for random seed)
random_seed = 42

# Simulation timestep in seconds (smaller = more accurate but slower)
simulation_timestep = 0.001

# Number of neurons in the brain (increase for larger networks)
neuron_count = 1000

# Number of brain regions (more regions = more spatial structure)
region_count = 2

# Connection probability for random connectivity (0.0 to 1.0)
connection_probability = 0.1

# =============================================================================
# NEURAL DYNAMICS PARAMETERS (Phase 2)
# =============================================================================

# Neuron model parameters (Leaky Integrate-and-Fire)
neuron_v_thresh = -50.0          # Membrane potential threshold (mV)
neuron_v_rest = -70.0           # Resting potential (mV)
neuron_v_reset = -75.0          # Reset potential after spike (mV)
neuron_tau_mem = 20.0           # Membrane time constant (ms)
neuron_tau_ref = 2.0            # Refractory period (ms)
neuron_reset_current = 0.0      # Current injected on reset (default)

# =============================================================================
# PLASTICITY PARAMETERS (Phase 2)
# =============================================================================

# General plasticity
plasticity_learning_rate = 0.01
plasticity_enable = true

# Spike-Timing-Dependent Plasticity (STDP)
stdp_ltp_weight = 0.01           # Long-term potentiation weight
stdp_ltd_weight = 0.012          # Long-term depression weight
stdp_time_constant = 20.0       # STDP time constant (ms)
stdp_tau_plus = 20.0            # LTP time constant (ms)
stdp_tau_minus = 20.0           # LTD time constant (ms)

# Hebbian learning
hebbian_learning_rate = 0.001
hebbian_window = 10.0           # Time window for Hebbian learning (ms)

# Structural plasticity
structural_plasticity_enable = true
synaptogenesis_rate = 0.001      # Rate of new synapse formation
pruning_rate = 0.0001           # Rate of synapse elimination
min_weight_to_prune = 0.01      # Minimum synaptic weight before pruning

# =============================================================================
# DEVELOPMENT PARAMETERS (Phase 3)
# =============================================================================

# Developmental stages and timing
development_enable = true
initial_plasticity_rate = 1.0   # High plasticity in early stages
critical_period_duration = 60.0  # Duration of critical period (simulation time)
maturation_duration = 300.0     # Duration of maturation phase (simulation time)

# Synaptogenesis during development
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# =============================================================================
# NEUROMODULATION PARAMETERS (Phase 3)
# =============================================================================

# Dopamine system
neuromod_dopamine_enable = true
dopamine_baseline = 0.1          # Baseline dopamine level
dopamine_sensitivity = 1.0       # Sensitivity to prediction errors

# Novelty detection
neuromod_novelty_enable = true
novelty_threshold = 0.05         # Threshold for novelty detection
novelty_decay = 0.99            # Decay rate of novelty signal

# Curiosity system
neuromod_curiosity_enable = true
curiosity_sensitivity = 2.0      # How strongly curiosity responds to novelty

# Prediction error
neuromod_prediction_error_enable = true
prediction_error_gain = 1.0      # Gain factor for prediction error signals

# =============================================================================
# MEMORY PARAMETERS (Phase 4)
# =============================================================================

# Working memory
memory_working_memory_enable = true
working_memory_capacity = 10.0   # Number of active traces
working_memory_decay_rate = 0.95 # Decay rate of working memory traces

# Episodic memory
memory_episodic_memory_enable = true
episodic_memory_capacity = 100.0 # Maximum number of episodes
episodic_memory_replay_interval = 10.0 # Replay interval (simulation time)

# =============================================================================
# PREDICTION PARAMETERS (Phase 4)
# =============================================================================

# Prediction system
prediction_enable = true
prediction_horizon = 5          # Number of steps to predict ahead
prediction_confidence_threshold = 0.5 # Minimum confidence for action selection

# =============================================================================
# COGNITION PARAMETERS (Phase 4)
# =============================================================================

# Attention
attention_enable = true
attention_excitation_strength = 1.0
attention_inhibition_strength = 1.5
attention_selection_threshold = 0.5

# Planning
planning_enable = true
planning_horizon = 3            # Planning horizon (number of steps)
planning_confidence_weight = 0.5 # Weight given to prediction confidence

# Concept formation
concept_formation_enable = true
concept_prototype_stability = 0.9
concept_new_concept_threshold = 0.7

# =============================================================================
# ENVIRONMENT PARAMETERS (Phase 3)
# =============================================================================

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_wrap_x = false
environment_wrap_y = false

# Sensory processing
vision_enabled = true
vision_resolution_width = 8
vision_resolution_height = 8
vision_angle_range = 90.0       # Field of view angle in degrees

# =============================================================================
# REWARD AND MOTIVATION PARAMETERS
# =============================================================================

# Reward system
reward_enable = true
reward_discount_factor = 0.99   # Discount factor for future rewards
reward_uncertainty_weight = 0.1 # Weight on reward prediction uncertainty

# Goal system
goal_enable = true
goal_reward_function = "default"  # Function for computing goal rewards

# =============================================================================
# SIMULATION CONTROLS
# =============================================================================

# Simulation limits
max_simulation_steps = 10000    # Maximum number of simulation steps
simulation_time_limit = 0.0     # Time limit (0.0 = no limit)
checkpoint_save_interval = 1000 # Save checkpoint every N steps
replay_interval = 100           # Replay episodes every N steps

# =============================================================================
# LOGGING AND DEBUGGING
# =============================================================================

# Logging settings
log_level = INFO                 # DEBUG, INFO, WARNING, ERROR
log_to_file = false              # Write logs to file
log_filename = nlm.log           # Log file name
log_append = true               # Append to log file rather than overwrite
log_timestamp_format = "local"   # "local" or "utc"

# Debug settings
debug_print_neuron_spikes = false
print_detailed_plasticity_events = false
print_memory_trace_events = false
print_prediction_events = false

# =============================================================================
# VISUALIZATION PARAMETERS
# =============================================================================

# Visualization settings
visualization_enabled = false    # Enable/disable visualization
visualization_update_rate = 30.0 # Updates per second
visualization_window_width = 1200
visualization_window_height = 800
visualization_neuron_scale = 1.0
visualization_synapse_opacity = 0.7

# =============================================================================
# INTEGRATION EXPERIMENT PARAMETERS (Phase 6)
# =============================================================================

# Phase 6 specific configuration
phase6_neuron_count = 500         # Smaller network for demo
phase6_max_steps = 2000          # Simulation steps per episode
phase6_enable_checkpointing = true
phase6_enable_replay = true
phase6_enable_development = true
phase6_checkpoint_path = "/tmp/nlm_checkpoint.bin"

# =============================================================================
# AGENT BRAIN PARAMETERS (Phase 3)
# =============================================================================

# Agent-brain interface parameters
agent_brain_enable_sensory_transduction = true
agent_brain_enable_motor_decoding = true
agent_brain_enable_reward_modulation = true
agent_brain_enable_structural_plasticity = true
agent_brain_enable_development = true
agent_brain_enable_curiosity = true

# =============================================================================
# PERFORMANCE OPTIMIZATION
# =============================================================================

# Performance tuning
enable_performance_profiling = false
enable_thread_pool = true
num_worker_threads = 4
memory_pool_size = 1024          # Objects per memory pool
enable_vectorization = true      # Use SIMD instructions where possible

# =============================================================================
# VALIDATION AND CONSTRAINTS
# =============================================================================

# Configuration constraints
constraint_min_neuron_count = 10
constraint_max_neuron_count = 10000
constraint_min_timestep = 0.0001
constraint_max_timestep = 0.1
constraint_min_connection_probability = 0.001
constraint_max_connection_probability = 0.5
