# NLM Configuration File
# NLM (Neural Learning Machine) - Phase 6 Configuration
# This file contains default configuration options for the NLM brain simulation

# General Settings
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 1
connection_probability = 0.1

# Neuron Parameters
neuron_threshold = -55.0
neuron_resting_potential = -70.0
neuron_reset_potential = -65.0
neuron_leak_conductance = 10.0
neuron_refractory_period = 5
neuron_adaptation_strength = 0.01

# Synapse Parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
hebbian_learning_rate = 0.005

# Structural Plasticity
start_plasticity_rate = 0.0001
start_pruning_rate = 0.00001
plasticity_decay_rate = 0.9

# Memory Systems
working_memory_capacity = 100
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_interval = 1000
associative_memory_capacity = 500

# Neuromodulation
initial_dopamine = 0.5
initial_curiosity = 0.5
initial_novelty = 0.5
novelty_threshold = 0.1

# Cognition Systems
planning_depth = 5
attention_excitation_strength = 1.5
attention_inhibition_strength = 0.5
attention_threshold = 0.3
concept_formation_threshold = 0.7

# Development
initial_developmental_stage = "Initial"
development_plasticity_modulation = 0.8

# Performance
checkpoint_interval = 1000
checkpoint_compression = "Balanced"
max_memory_usage = "512MB"

# Visualization
visualization_output = "text"
visualization_update_rate = 100
neuron_visualization_scale = 1.0
synapse_visualization_scale = 1.0

# Experiment Settings
experiment_type = "Phase6"
experiment_duration = 1000
experiment_checkpoint_interval = 100

# Debug and Logging
debug_mode = false
log_level = "INFO"
log_file = "nlm.log"
performance_profiling = false

# Network Topology
network_type = "FullyConnected"
neuron_distribution = "Standard"
population_ratio_sensory_internal_motor = "1:2:1"

# Input/Output
input_noise_level = 0.01
output_threshold = 0.5
action_selection_threshold = 0.6

# Safety Limits
max_simulation_steps = 1000000
max_cpu_usage = 90
max_memory_usage_percent = 80

# Metadata
config_version = "1.0"
project_phase = "Phase6"
config_created = "2026-09-23"
config_description = "NLM Phase 6 Final Integration Configuration"