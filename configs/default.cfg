# NLM Configuration File
# Default configuration for Phase 6: Final Integration of Artificial Developmental Brain
# 
# This file contains validated configuration parameters for the NLM (Neural Learning Machine)
# brain simulation. All values have been tested for stability and biological plausibility.
#
# Configuration validation rules:
# - All float values must be within specified ranges to prevent numerical instability
# - Integer values must be positive or non-negative
# - Connection probability must be in [0.0, 1.0]
# - Weight values must be within synaptic bounds

# Random seed for reproducible experiments
# Range: [0, 2^64-1]
# Default: 42 (for reproducible testing)
random_seed = 42

# Simulation timestep in seconds
# Range: (0.0, 0.1] for stability
# Default: 0.001 (1ms, suitable for biological timescales)
simulation_timestep = 0.001

# Number of neurons in the brain
# Range: [1, 1000000] (memory and performance considerations)
# Default: 1000 (balanced performance for testing)
neuron_count = 1000

# Number of brain regions
# Range: [1, 100] (practical limits for connectivity management)
# Default: 2 (small number of regions for testing)
region_count = 2

# Connection probability for random connectivity
# Range: [0.0, 1.0] (probability of connection between neuron pairs)
# Default: 0.1 (sparse connectivity for stability)
connection_probability = 0.1

# Plasticity settings
# All plasticity mechanisms are enabled by default for Phase 6 integration

# STDP (Spike-Timing-Dependent Plasticity) parameters
# learning_rate: Strength of weight changes
# Range: (0.0, 1.0]
# Default: 0.01 (moderate learning rate)
plasticity_stdp_learning_rate = 0.01

# LTP (Long-Term Potentiation) weight increment
# Range: (-1.0, 1.0]
# Default: 0.01 (small positive increment)
stdp_ltp_weight = 0.01

# LTD (Long-Term Depression) weight decrement
# Range: (-1.0, 1.0]
# Default: 0.012 (slightly larger negative increment)
stdp_ltd_weight = 0.012

# STDP time constant for spike timing
# Range: (0.0, 100.0] milliseconds
# Default: 20.0 (20ms time constant)
stdp_time_constant = 20.0

# Hebbian learning rate
# Range: (0.0, 1.0]
# Default: 0.01
plasticity_hebbian_learning_rate = 0.01

# Structural plasticity rates
# synaptogenesis_rate: Rate of new synapse formation
# Range: [0.0, 0.1]
# Default: 0.001 (slow synapse formation)
development_synaptogenesis_rate = 0.001

# pruning_rate: Rate of synapse elimination
# Range: [0.0, 0.1]
# Default: 0.0001 (very slow pruning for stability)
development_pruning_rate = 0.0001

# Neuromodulation settings
# All neuromodulation systems are enabled for Phase 6 integration

# Dopamine baseline level
# Range: [0.0, 1.0] (normalized level)
# Default: 0.1 (low baseline, modulated by rewards)
neuromod_dopamine_baseline = 0.1

# Neuromodulation scaling factors
# scale: Multiplicative factor for neuromodulator effects
# Range: (0.0, 10.0]
# Default: 1.0 (neutral scaling)
neuromod_dopamine_scale = 1.0

# Curiosity system settings
# enable: Whether curiosity-driven exploration is enabled
# Default: true
neuromod_curiosity_enable = true

# Novelty detection sensitivity
# enable: Whether novelty detection is enabled
# Default: true
neuromod_novelty_enable = true

# Reward settings
# discount_factor: How much future rewards are valued (0 = no future, 1 = equal value)
# Range: [0.0, 1.0]
# Default: 0.99 (high value on future rewards)
reward_discount_factor = 0.99

# Environment settings
# environment_name: Name of the simulated environment
# Options: "GridWorld", "Maze", "OpenField"
environment_name = GridWorld

# Environment dimensions (for GridWorld)
# width: Environment width in cells
# Range: [1, 100]
# Default: 10
environment_width = 10

# height: Environment height in cells
# Range: [1, 100]
# Default: 10
environment_height = 10

# Vision parameters (sensory processing)
# vision_width: Width of agent's visual field
# Range: [1, environment_width]
# Default: 8
vision_width = 8

# vision_height: Height of agent's visual field
# Range: [1, environment_height]
# Default: 8
vision_height = 8

# Logging settings
# log_level: Verbosity level of logging
# Options: "ERROR", "WARN", "INFO", "DEBUG"
log_level = INFO

# log_to_file: Whether to write logs to file
# Default: false (logs to console)
log_to_file = false

# log_filename: Name of log file if log_to_file is true
log_filename = nlm.log

# Simulation settings
# max_simulation_steps: Maximum number of simulation steps
# Range: [0, 1000000] (0 = unlimited)
# Default: 10000
max_simulation_steps = 10000

# simulation_time_limit: Maximum simulation time in seconds
# Range: [0.0, 1e6] (0 = unlimited)
# Default: 0.0 (unlimited)
simulation_time_limit = 0.0

# Visualization settings
# visualization_enabled: Whether to enable visualization output
# Default: false (for performance)
visualization_enabled = false

# visualization_update_rate: Frames per second for visualization
# Range: (0.0, 1000.0]
# Default: 30.0 (30 FPS)
visualization_update_rate = 30.0

# Advanced configuration options (Phase 5+ features)

# Memory pool settings
# neuron_memory_pool_size: Number of neurons to pre-allocate
# Range: [0, neuron_count]
# Default: 1000 (pre-allocate for performance)
neuron_memory_pool_size = 1000

# synapse_memory_pool_size: Number of synapses to pre-allocate
# Range: [0, neuron_count * region_count * connection_probability]
# Default: 5000 (pre-allocate for performance)
synapse_memory_pool_size = 5000

# Event queue settings
# spike_event_queue_size: Maximum number of pending spike events
# Range: [0, 10000]
# Default: 1000
spike_event_queue_size = 1000

# Checkpoint settings
# checkpoint_dir: Directory for checkpoint files
checkpoint_dir = ./checkpoints

# checkpoint_interval: Steps between checkpoints
# Range: [1, 10000]
# Default: 1000
checkpoint_interval = 1000

# max_checkpoints: Maximum number of checkpoints to keep
# Range: [1, 100]
# Default: 5
max_checkpoints = 5

# Debug and validation settings
# validate_on_start: Whether to validate configuration on startup
# Default: true
validate_on_start = true

# log_validation_errors: Whether to log configuration validation errors
# Default: true
log_validation_errors = true

# strict_validation: Whether to fail on configuration errors
# Default: false (warn instead of fail)
strict_validation = false

