# NLM Configuration File
# This is the improved configuration for Phase 2 Real Neural Computation
# 
# **Configuration Format**: Values are in format: "key = value"
# Keys are case-insensitive and support comments (starting with #)
# No trailing semicolons
#

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (control precision vs performance)
simulation_timestep = 0.001

# Number of neurons in the brain (scaling factor for complexity)
neuron_count = 500

# Number of brain regions for modular organization
region_count = 1

# Connection probability for random connectivity (0.0-1.0)
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (baseline neurotransmitter levels)
dopamine_baseline = 0.1

# Reward settings (for reinforcement learning)
reward_discount_factor = 0.99

# Environment settings (world simulation)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# **Advanced Settings** (uncomment to enable):
# curiosity_weight = 0.5
# prediction_error_threshold = 0.01
# neuromodulation_enabled = true
# structural_plasticity_enabled = true
