## Configuration File Format

### INI Format
- Section headers are in `[section]` format
- Key-value pairs are in `key = value` format
- Comments start with `#` or `;`
- Blank lines are ignored

### Example of Key Features

```ini
# Comments can be on the same line
brain.neuron_count = 500  # This is a comment

# Multiple values can be specified with commas
brain.initial_weight_mean = 0.5, 0.6, 0.7

# Boolean values
plasticity.stdp.enable = true

# Numbers (integer or float)
simulation.timestep = 0.001
world.width = 20

# Strings
brain.region_name = "cortex"

# Lists (in YAML format)
world.object_types:
  - "Resource"
  - "Hazard"
  - "Wall"
  - "Marker"
```

## Configuration Validation

### Required Sections
- `[brain]` - Brain configuration
- `[simulation]` - Simulation settings

### Optional Sections
- `[plasticity]` - Plasticity rules
- `[neuromod]` - Neuromodulation settings
- `[memory]` - Memory systems
- `[development]` - Development configuration
- `[world]` - World parameters
- `[agent]` - Agent settings
- `[logging]` - Logging configuration

### Common Configuration Mistakes

#### 1. Missing Required Sections
```ini
# WRONG - Missing brain section
[simulation]
timestep = 0.001

# CORRECT - Include all required sections
[brain]
neuron_count = 500

[simulation]
timestep = 0.001
```

#### 2. Invalid Data Types
```ini
# WRONG - String where number expected
brain.neuron_count = "five hundred"

# CORRECT - Proper data type
brain.neuron_count = 500
```

#### 3. Out of Range Values
```ini
# WRONG - Neuron count too high (potential memory issues)
brain.neuron_count = 1000000

# CORRECT - Reasonable value
brain.neuron_count = 1000
```

