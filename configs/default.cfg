# NLM (熙然) - Neural Learning Machine Configuration File
# Phase 6: Final Integration Configuration

# Brain configuration
brain.neuron_count = 1000
brain.region_count = 2
brain.connection_probability = 0.1

# Simulation configuration
simulation.timestep = 0.001
simulation.max_steps = 10000
simulation.random_seed = 42

# Neural dynamics configuration
neuron.LIF_threshold = -50.0
neuron.LIF_reset_potential = -65.0
neuron.LIF_leak_conductance = 0.1
neuron.refractory_period = 5
neuron.firing_threshold = 0.0

# Synaptic parameters
synapse.max_weight = 1.0
synapse.min_weight = -1.0
synapse.excitatory_weight = 0.5
synapse.inhibitory_weight = -0.5
synapse.delay_steps = 1

# Plasticity configuration
plasticity.stdp_enabled = true
plasticity.hebbian_enabled = true
plasticity.stdp_ltp_weight = 0.02
plasticity.stdp_ltd_weight = 0.015
plasticity.stdp_tau = 20.0
plasticity.synaptogenesis_rate = 0.0001
plasticity.pruning_rate = 0.00001

# Memory system configuration
memory.working_memory_capacity = 100
memory.episodic_memory_max_episodes = 1000
memory.associative_memory_enabled = true
memory.replay_interval = 100
memory.consolidation_interval = 1000

# Neuromodulation configuration
neuromodulation.dopamine_enabled = true
neuromodulation.curiosity_enabled = true
neuromodulation.novelty_enabled = true
neuromodulation.prediction_error_enabled = true

# Novelty detection configuration
novelty.sensory_change_threshold = 0.5
novelty.internal_change_threshold = 0.3

# Curiosity configuration
curiosity.base_curiosity = 0.1
curiosity.exploration_bonus = 0.5

# Development configuration
development.enabled = true
development.initial_stage = 0
development.critical_period_start = 100
development.critical_period_end = 500

# Visualization configuration
visualization.enabled = true
visualization.output_format = "png"
visualization.frame_rate = 30
visualization.window_size = "1280x720"

# Performance configuration
performance.checkpoint_interval = 1000
performance.memory_pool_size = 10000
performance.event_queue_size = 5000

# Debug configuration
debug.log_level = "info"
debug.enable_breakpoints = false
debug.profile_performance = false

# Experiment configuration
experiment.enabled = true
experiment.experiment_type = "integration_test"
experiment.record_traces = true
experiment.save_results = true

# Default regions for initial setup
region.Region_1.type = "sensory"
region.Region_1.neuron_count = 250
region.Region_1.population_ratio.sensory = 0.25
region.Region_1.population_ratio.internal = 0.5
region.Region_1.population_ratio.motor = 0.25

region.Region_2.type = "internal"
region.Region_2.neuron_count = 750
region.Region_2.population_ratio.sensory = 0.1
region.Region_2.population_ratio.internal = 0.7
region.Region_2.population_ratio.motor = 0.2

# Performance optimization flags
optimization.use_memory_pools = true
optimization.enable_vectorization = true
optimization.parallel_processing = false
optimization.simd_enabled = true

# Output configuration
output.directory = "output/"
output.prefix = "nlm_run_"
output.include_brain_state = true
output.include_memory_traces = true
output.include_performance_stats = true

# External interface configuration
external.sensory_enabled = true
external.motor_enabled = true
external.rest_enabled = false

# Safety configuration
safety.max_memory_usage = 2048  # MB
safety.max_cpu_usage = 100.0   # percent
safety.enable_safety_checks = true

# Logging configuration
logging.level = "info"
logging.file = "output/nlm.log"
logging.max_file_size = 100    # MB
logging.max_files = 10
logging.include_timestamps = true
logging.include_thread_id = true
