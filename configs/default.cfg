# NLM Neural Learning Machine Configuration
# Simple key=value format for backward compatibility
# This format is still supported and auto-detected

# Brain Configuration
brain.neuron_count = 1000
brain.region_count = 1
brain.connection_probability = 0.1
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0
brain.excitatory_fraction = 0.8
brain.inhibitory_fraction = 0.2

# Plasticity Configuration
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.stdp.ltp_weight = 0.02
plasticity.stdp.ltd_weight = 0.015
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.0005
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation Configuration
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true
neuromod.prediction_error.enable = true

# Memory Configuration
memory.working_memory.capacity = 100
memory.working_memory.decay_rate = 0.01
memory.episodic_memory.max_episodes = 1000
memory.episodic_memory.consolidation_rate = 0.05

# Prediction Configuration
prediction.prediction_system.temporal_window = 100
prediction.prediction_system.learning_rate = 0.01
prediction.action_consequence.learning_rate = 0.02

# Cognition Configuration
cognition.attention.competition_strength = 1.0
cognition.planner.planning_horizon = 5
cognition.concept_formation.stability_threshold = 0.7

# Development Configuration
development.development_system.critical_period_start = 1.0
development.development_system.maturation_rate = 0.1
development.synaptogenesis.initial_rate = 0.001
development.pruning.initial_rate = 0.0001

# Simulation Configuration
simulation.timestep = 0.001
simulation.max_steps = 10000
simulation.random_seed = 42
simulation.checkpoint_interval = 1000
simulation.enable_replay = true

# Environment Configuration
environment.simple_world.width = 20
environment.simple_world.height = 20
environment.simple_world.vision_width = 8
environment.simple_world.vision_height = 8
environment.simple_world.max_energy = 100.0
environment.simple_world.agent_start_x = 10.0
environment.simple_world.agent_start_y = 10.0

# Experiment Configuration
experiments.phase6_integration.max_steps = 10000
experiments.phase6_integration.neuron_count = 1000
experiments.phase6_integration.enable_checkpointing = true
experiments.phase6_integration.enable_replay = true

