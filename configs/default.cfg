# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01

# STDP parameters for Phase 2
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Development settings (keeping for backward compatibility)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Structural plasticity parameters (Phase 2 specific)
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_use_colors = true
log_to_console = true
log_to_file = false
log_filename = nlm.log
log_file_rotation = 1048576  # 1MB in bytes
log_flush_interval = 100

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
simulation_strict_mode = false
enable_early_termination = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Phase 2 specific configuration
phase = 2
enable_structural_plasticity = true
plasticity_enabled = true

# Advanced configuration options
enable_profiling = false
profile_output_file = nlm_profile.json
enable_detailed_logging = false
detailed_log_filename = nlm_detailed.log

# Advanced neuron parameters
neuron_threshold = -55.0
neuron_refractory_period = 5.0
neuron_leak_coefficient = 0.1
neuron_membrane_capacitance = 1.0
neuron_reset_potential = -70.0
neuron_spike_threshold = -40.0

# Advanced synapse parameters
synapse_delay = 1
synapse_weight_max = 1.0
synapse_weight_min = 0.0
synapse_delay_min = 0
synapse_delay_max = 10
enable_synapse_modulation = true

# Advanced plasticity parameters
plasticity_modulation_enabled = true
plasticity_stdp_enabled = true
plasticity_hebbian_enabled = true
plasticity_structural_enabled = true
plasticity_rate_decay = 0.001
plasticity_stdp_tau = 20.0

# Advanced environment parameters
environment_render_mode = 0  # 0: none, 1: text, 2: grid
environment_obs_noise = 0.0
environment_reward_scale = 1.0
environment_terminal_state = -100.0

# Performance and optimization
enable_neural_compression = false
compression_threshold = 0.01
enable_async_processing = true
worker_thread_count = 4
memory_pool_size = 1024

# Debugging and analysis
enable_debug_mode = false
debug_output_file = nlm_debug.log
enable_trace_logging = false
trace_filename = nlm_trace.log
enable_performance_monitoring = false
perf_output_file = nlm_perf.json

# Feature flags for advanced functionality
enable_advanced_plasticity = true
enable_structural_plasticity_advanced = true
enable_neuromodulation = true
enable_reward_learning = true
enable_hierarchical_plasticity = true
enable_adaptation = true
