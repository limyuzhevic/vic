# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Advanced configuration options
# These can be overridden on command line or via API

# Core brain parameters
brain.neuron_count = 1000
brain.region_count = 2
brain.connection_probability = 0.1
brain.synapse_weight_mean = 0.5
brain.synapse_weight_std = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# Memory system parameters
memory.working_capacity = 0.1
memory.episodic_max_episodes = 1000
memory.associative_decay_rate = 0.01

# Neuromodulation parameters
neuromod.dopamine.scale = 1.0
neuromod.curiosity.threshold = 0.3
neuromod.novelty.decay_rate = 0.99

# Prediction system parameters
prediction.error_weight = 0.5
prediction.confidence_threshold = 0.8

# Cognitive parameters
attention.inhibition_strength = 0.5
attention.excitation_strength = 1.5
planning.planning_depth = 5

# Development parameters
development.synaptogenesis_rate = 0.0001
development.pruning_rate = 0.00001
development.maturation_rate = 0.01

# Plasticity parameters
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Simulation parameters
replay_interval = 100
consolidation_interval = 1000
checkpoint_dir = ./checkpoints
checkpoint_interval = 10000
checkpoint_compression = Balanced
