# NLM Configuration File
# Enhanced configuration with validation and better structure
# This is the enhanced default configuration for Phase 1 skeleton

# ===== RANDOMNESS =====
# Random seed for reproducible experiments
# Range: any integer, default: 42
random_seed = 42

# ===== SIMULATION TIMING =====
# Simulation timestep in seconds (smaller = higher precision, larger = faster)
# Valid values: 0.001 (default, good balance), 0.0005, 0.002, etc.
# smaller timesteps = more accurate but slower
simulation_timestep = 0.001

# ===== BRAIN STRUCTURE =====
# Number of neurons in the brain (total population size)
# Range: 100 to 50000, default: 1000
# More neurons = more complexity, requires more memory and longer simulation
neuron_count = 1000

# Number of brain regions (cortical areas, functional modules)
# Range: 1 to 20, default: 2
# More regions = more complex connectivity patterns
region_count = 2

# ===== CONNECTIVITY =====
# Connection probability for random connectivity between neurons
# Range: 0.0 to 1.строй, default: 0.1
# Higher = denser network, lower = sparser, more structured
connection_probability = 0.1

# ===== PLASTICITY =====
# Global plasticity learning rate (baseline for all plasticity rules)
# Range: 0.0 to 0.1, default: 0.01
# Controls how quickly weights change in response to activity
plasticity_learning_rate = 0.01

# ===== STDP (Spike-Timing-Dependent Plasticity) =====
# STDP learning rate when pre-synaptic spike precedes post-synaptic spike (potentiation)
# Range: 0.001 to 0.1, default: 0.01
# Positive values strengthen synapses
stdp_ltp_weight = 0.01

# STDP learning rate when pre-synaptic spike follows post-synaptic spike (depression)
# Range: 0.001 to 0.1, default: 0.012
# Positive values weaken synapses
stdp_ltd_weight = 0.012

# STDP time constant for decay of spike history
# Range: 1.0 to 100.0, default: 20.0
# Longer = history lasts longer, shorter = quicker adaptation
stdp_time_constant = 20.0

# ===== DEVELOPMENT =====
# Synaptogenesis rate (creation of new connections during development)
# Range: 0.0001 to 0.1, default: 0.001
# Higher = faster wiring development
# development_synaptogenesis_rate = 0.001

# Pruning rate (elimination of unused connections during development)
# Range: 0.00001 to 0.01, default: 0.0001
# Higher = faster optimization of connections
# development_pruning_rate = 0.0001

# ===== NEUROMODULATION =====
# Dopamine baseline level (affects learning, motivation, and excitability)
# This is the second dopamine_baseline parameter (first one on line 31 is the actual default)
# Range: 0.0 to 1.0, default: 0.1
# Dopamine bias toward exploration vs exploitation
dopamine_level = 0.1

# ===== REWARD =====
# Reward discount factor (how much future rewards matter)
# Range: 0.9 to 1.0, default: 0.99
# Higher = more patient (considers long-term rewards)
# reward_discount_factor = 0.99

# ===== ENVIRONMENT =====
# Environment simulation name (e.g., GridWorld, SimpleWorld, etc.)
environment_name = GridWorld

# Environment dimensions
# Range: positive integers, default: 10
environment_width = 10
environment_height = 10

# ===== LOGGING =====
# Log level: DEBUG, INFO, WARN, ERROR, CRITICAL
# Values: DEBUG, INFO, WARN, ERROR, CRITICAL, default: INFO
log_level = INFO

# Whether to write logs to file in addition to console
log_to_file = false

# Log filename (if log_to_file is true)
log_filename = nlm.log

# ===== SIMULATION =====
# Maximum number of simulation steps before automatic stop
# Range: 100 to 1000000, default: 10000
max_simulation_steps = 10000

# Simulation time limit in seconds (0 = unlimited)
# Range: 0.0 to very large, default: 0.0 (no limit)
simulation_time_limit = 0.0

# ===== VISUALIZATION =====
# Whether to enable visualization (requires GUI support)
# Range: true, false, default: false
visualization_enabled = false

# Visualization update rate in Hz (frames per second)
# Range: 1.0 to 120.0, default: 30.0
visualization_update_rate = 30.0

# ===== PERFORMANCE =====
# Whether to enable performance optimizations
# Range: true, false, default: true
performance_optimizations_enabled = true

# Memory pool size for objects (reduces allocation overhead)
# Range: 100 to 50000, default: 1000
memory_pool_size = 1000

# ===== CHECKPOINTING =====
# Whether to enable checkpoint saving
# Range: true, false, default: true
checkpoint_enabled = true

# Checkpoint file path
checkpoint_path = checkpoints/nlm_checkpoint

# ===== VALIDATION =====
# Whether to validate configuration parameters on load
validation_enabled = true

# Whether to throw exceptions on invalid configuration
validation_strict = false

# ===== METADATA =====
# Configuration version (for backward compatibility)
version = 2.0

# Description of this configuration
 description = Enhanced default configuration with improved validation and additional parameters

# Generated timestamp
# generated_date = $(date +%Y-%m-%dT%H:%M:%S)

