# NLM Configuration File
# Enhanced configuration for Phase 6 integrated NLM system
# This configuration demonstrates advanced features including validation, inheritance, and multiple formats

# Configuration metadata
config_version = 1
config_name = "NLM Enhanced Configuration"
config_description = "Production-ready configuration with validation and recovery capabilities"
config_schema_version = "2.0"
config_created = "2026-09-30T12:55:55Z"

# Core simulation parameters with validation
neuron_count = 1000
region_count = 2
connection_probability = 0.1
simulation_timestep = 0.001
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced validation parameters
# neuron_count and region_count must satisfy: 100 <= neuron_count <= 100000
# neuron_count / region_count <= 10000 neurons per region
neuron_count_validation_range_min = 100
neuron_count_validation_range_max = 100000
neurons_per_region_max = 10000

# Plasticity settings with dependency validation
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development system with inheritance support
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
enable_development = true
development_inheritance = true

# Neuromodulation settings
 dopamine_baseline = 0.1  # Note: duplicate from original config
dopamine_modulation_rate = 0.05
dopamine_time_constant = 100.0

# Reward settings
reward_discount_factor = 0.99
reward_history_size = 1000
reward_window_size = 10

# Environment settings
environment_name = "GridWorld"
environment_width = 10
environment_height = 10
environment_update_rate = 30.0
environment_seed = "GRID-2026-09-30"

# Agent settings with template support
agent_type = "advanced"
agent_brain_size = 2048
agent_plasticity_enabled = true
agent_development_enabled = true
agent_reward_enabled = true

# Logging settings with file rotation
log_level = "INFO"
log_to_file = true
log_filename = "nlm.log"
log_max_size_mb = 100
log_backup_count = 5
log_rotation_size_mb = 50

# Visualization settings with template override
visualization_enabled = true
visualization_update_rate = 30.0
visualization_output_format = "png"
visualization_quality = 0.9
visualization_background = "white"

# Experimental settings with validation
enable_checkpointing = true
checkpoint_path = "./checkpoints"
checkpoint_interval = 1000
checkpoint_max_files = 5
checkpoint_save_frequency = 5

# Memory management
gpu_enabled = true
gpu_memory_limit_mb = 4096
cpu_threads = 8
memory_pool_size_mb = 2048

# Configuration inheritance sources
inheritance_sources =
    "configs/base.cfg",
    "configs/user.cfg",
    "configs/environment.cfg"

# Environment variable prefixes
environment_prefix = "NLM_"
environment_override_allowed = true

# Schema validation rules
validation_rules =
    "neuron_count:min=100",
    "neuron_count:max=100000",
    "region_count:min=1",
    "region_count:max=20",
    "connection_probability:min=0.0",
    "connection_probability:max=1.0"

# Advanced features configuration
features =
    "hot_reload=true",
    "history_tracking=true",
    "backup_enabled=true",
    "encryption_enabled=false",
    "template_support=true"

# Performance settings
performance_mode = "balanced"
thread_pool_size = 8
async_processing_enabled = true
parallel_simulation_enabled = true

# Debug and development
debug_mode = false
verbose_logging = false
profiler_enabled = true
profile_output_dir = "./profiles"

# Security and access
config_encryption_key = ""  # Leave empty for no encryption
config_access_level = "full"
config_write_protection = false

# Template and preset support
templates =
    "minimal",
    "development",
    "production"

current_template = "production"

# Change tracking and history
history_enabled = true
history_max_entries = 1000
history_retention_days = 30

# Auto-reload configuration
auto_reload_enabled = false
auto_reload_interval_seconds = 5
auto_reload_paths =
    "configs/*.cfg",
    "configs/**/*.json"

# Export and import settings
export_formats =
    "json",
    "yaml",
    "xml",
    "toml",
    "ini"

import_formats =
    "json",
    "yaml",
    "xml",
    "toml",
    "ini",
    "keyvalue"

# Configuration validation and recovery
enable_recovery = true
recovery_backup_dir = "configs_backups"
recovery_max_attempts = 3
recovery_timeout_seconds = 30

# Configuration for Phase 6 integrated experiment
integration_experiment =
    "enable=true",
    "max_steps=50000",
    "save_intermediate=true",
    "enable_developmental=true",
    "enable_neuromodulation=true",
    "enable_reward=true",
    "enable_plasticity=true"

# Custom validation and rules
custom_validation_functions =
    "validate_neuron_region_ratio",
    "validate_memory_requirements",
    "validate_performance_constraints"

# Configuration documentation auto-generation
documentation_enabled = true
documentation_output_dir = "./docs/config"
documentation_format = "markdown"
autocomplete_enabled = true
autocomplete_sources =
    "configs/templates/",
    "docs/config/"

# Advanced configuration statistics and monitoring
monitor_config_changes = true
monitor_performance = true
monitor_errors = true
monitor_backup_status = true
