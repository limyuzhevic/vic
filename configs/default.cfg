# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Configuration options for Phase 6 Final Integration (power users)

# Performance Settings
simulation_time_limit = 0.0  # 0 = unlimited
checkpoint_interval = 100.0  # Save checkpoint every N seconds
enable_performance_logging = false

# Plasticity Settings
synaptic_pruning_threshold = 0.01
structural_plasticity_rate = 0.00001
hebbian_learning_rate = 0.001
stdp_learning_rate = 0.002

# Neuromodulation Settings
dopamine_sensitivity = 1.0
curiosity_threshold = 0.5
novelty_decay_rate = 0.01
reward_prediction_error_gain = 0.1

# Memory Settings
working_memory_capacity = 50
episodic_memory_capacity = 100
semantic_memory_capacity = 200
procedural_memory_capacity = 20
memory_consolidation_threshold = 0.8

# Prediction Settings
prediction_horizon = 10
prediction_confidence_threshold = 0.7
prediction_learning_rate = 0.005

# Cognition Settings
attention_span = 20.0
planning_horizon = 5
concept_formation_threshold = 0.6

# Development Settings
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005
development_maturation_rate = 0.1
critical_period_end = 100.0

# Visualization Settings (overrides previous settings)
visualization_enabled = true
visualization_update_rate = 60.0
visualization_data_retention = 1000
visualization_enable_debug = false

# Environment Settings
environment_reset_on_done = false
environment_persistence = false
max_objects_per_room = 100
object_value_range = [0.1, 10.0]
