# NLM Configuration File
# Phase 6: FINAL INTEGRATION Configuration
# This configuration enables all integrated systems for complete brain functionality

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 6: event-driven with fine timesteps)
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6: suitable for integration testing)
neuron_count = 500

# Number of brain regions (Phase 6: multiple regions for inter-region connectivity)
region_count = 3

# Connection probability for random connectivity (Phase 6: higher density for integration)
connection_probability = 0.15

# Plasticity settings (Phase 6: enhanced for memory consolidation)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
hebbian_learning_rate = 0.01
structural_plasticity_rate = 0.0001

# Development settings (Phase 6: age-dependent plasticity)
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005
development_plasticity_boost = 2.0

# Neuromodulation settings (Phase 6: integrated with learning)
dopamine_baseline = 0.1
dopamine_learning_rate = 0.05
dopamine_time_constant = 100.0
curiosity_rate = 0.3
novelty_threshold = 0.1
prediction_error_discount = 0.95

# Reward settings (Phase 6: integrated with episodic memory)
reward_discount_factor = 0.99
reward_baseline = 0.0

# Memory system settings (Phase 6: all systems enabled)
working_memory_capacity = 100  # Number of items
e pisodic_memory_max_episodes = 1000
associative_memory_pattern_count = 500

# Cognitive system settings (Phase 6: planning and concept formation)
neural_planner_depth = 5
concept_formation_threshold = 0.5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Prediction system settings (Phase 6: predictive coding)
prediction_accuracy_threshold = 0.8
prediction_error_threshold = 0.1
prediction_update_rate = 0.1

# Environment settings (Phase 6: complex environment for learning)
environment_name = ComplexWorld
environment_width = 20
environment_height = 20
max_steps_per_episode = 100

# Logging settings (Phase 6: comprehensive logging for debugging)
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log
log_file_max_size = 100MB
log_rotation_count = 5

# Simulation settings (Phase 6: integration focus)
max_simulation_steps = 100000
simulation_time_limit = 0.0
checkpoint_interval = 1000
replay_interval = 100
consolidation_interval = 1000

# Visualization settings (Phase 6: optional visualization)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1920
visualization_window_height = 1080

# Performance settings (Phase 6: optimized for large simulations)
use_simd = true
use_parallel_processing = true
use_memory_pools = true
max_concurrent_threads = 4

# Experimental settings (Phase 6: integration experiments)
integration_experiment_enabled = true
integration_test_steps = 5000
integration_benchmark_mode = false
integration_detailed_logging = true

# Security settings (Phase 6: production-ready)
config_validation = true
log_sensitive_data = false
checkpoint_encryption = true
