# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Prediction system configuration
prediction_enable = true
prediction_window = 10.0
prediction_noise = 0.1

# Concept formation configuration
concept_enable = true
concept_threshold = 0.75
concept_stability_threshold = 0.7

# Neural planning configuration
planning_enable = true
planning_depth = 5
planning_confidence = 0.5

# Memory system configuration
working_memory_capacity = 100
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 1000
episodic_replay_interval = 100

# Attention system configuration
attention_enable = true
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Development configuration
development_enable = true
development_age = 0.0

# Novelty detection configuration
novelty_enable = true
novelty_threshold = 0.5

# Statistical parameters
statistics_window = 1000
statistics_update_rate = 10
