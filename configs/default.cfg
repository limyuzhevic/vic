# NLM Configuration File
# This is the default configuration for Phase 1 skeleton
# Format: JSON, YAML, or simple key=value pairs (backward compatible)

# ============================================================================
# Core Simulation Parameters
# ============================================================================

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (minimum: 0.0001)
simulation_timestep = 0.001

# Number of neurons in the brain (recommended: 100-10000)
neuron_count = 1000

# Number of brain regions (minimum: 1)
region_count = 2

# Connection probability for random connectivity (0.0 - 1.0)
connection_probability = 0.1

# ============================================================================
# Plasticity Settings
# ============================================================================

# General plasticity learning rate (0.0 - 1.0)
plasticity_learning_rate = 0.01

# STDP (Spike-Timing Dependent Plasticity) parameters
stdp_ltp_weight = 0.01        # Long-Term Potentiation weight (positive)
stdp_ltd_weight = 0.012       # Long-Term Depression weight (negative)
stdp_time_constant = 20.0     # Time constant for STDP (milliseconds)

# ============================================================================
# Development Settings (Structural Plasticity)
# ============================================================================

# Rate of new synapse formation per step (0.0 - 0.01)
development_synaptogenesis_rate = 0.001

# Rate of synapse elimination per step (0.0 - 0.001)
development_pruning_rate = 0.0001

# ============================================================================
# Neuromodulation Settings
# ============================================================================

# Baseline dopamine level (0.0 - 1.0)
# dopamine_baseline = 0.1  # Default value (original duplicate entry removed)

# ============================================================================
# Reward and Learning Settings
# ============================================================================

# Discount factor for temporal difference learning (0.0 - 1.0)
reward_discount_factor = 0.99

# ============================================================================
# Environment Settings
# ============================================================================

# Environment type (e.g., GridWorld, ContinuousSpace)
environment_name = GridWorld

# Environment dimensions
environment_width = 10
environment_height = 10

# ============================================================================
# Logging and Debug Settings
# ============================================================================

# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO

# Whether to log to file instead of stdout
log_to_file = false

# Log file name
log_filename = nlm.log

# ============================================================================
# Simulation Limits and Constraints
# ============================================================================

# Maximum number of simulation steps
max_simulation_steps = 10000

# Maximum simulation time in seconds (0.0 = unlimited)
simulation_time_limit = 0.0

# ============================================================================
# Visualization Settings
# ============================================================================

# Whether to enable visualization
visualization_enabled = false

# Visualization update rate (frames per second)
visualization_update_rate = 30.0
