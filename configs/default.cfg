# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Neuromodulation settings
dopamine_baseline = 0.1
# Neuromodulation sensitivity settings
dopamine_sensitivity = 0.5
curiosity_strength = 0.3
novelty_sensitivity = 0.2
reward_prediction_error_scale = 1.0

# Memory system settings
working_memory_capacity = 100
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 1000
associative_memory_capacity = 500

# Prediction system settings
prediction_horizon = 5
prediction_confidence_threshold = 0.7

# Cognition system settings
planning_depth = 5
attention_excitation_strength = 1.5
attention_inhibition_strength = 0.5
concept_formation_threshold = 0.8

# Development system settings
development_critical_period_start = 10
development_critical_period_end = 100
development_plasticity_decay_rate = 0.01

# Structural plasticity settings
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
synaptic_growth_limit = 10

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_decay = 0.1

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 8
vision_height = 8
vision_range = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
simulation_timestep = 0.001

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_mb = 10

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1024
visualization_window_height = 768

# Performance settings
performance_monitoring = true
performance_sampling_rate = 1000
checkpoint_enabled = true
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
checkpoint_compression = Balanced

# Agent system settings
agent_update_rate = 10
agent_sensory_range = 8
agent_motor_force = 1.0
agent_brain_size = 1000

# World system settings
world_physics_enabled = true
world_physics_steps_per_frame = 60
world_grid_enabled = false
