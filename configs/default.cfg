# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds - should be small (< 0.1s) for numerical stability
# Must be positive and reasonable for convergence
simulation_timestep = 0.001

# Number of neurons in the brain - reasonable size for simulation
# Must be positive and not excessively large
neuron_count = 1000

# Number of brain regions - at least 1 region needed
# Must be positive integer
region_count = 2

# Connection probability for random connectivity - typical sparse connectivity
# Must be between 0 and 1
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings - small positive rates for gradual development
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings - dopamine baseline affects neural excitability
dopamine_baseline = 0.1

# Reward settings - discount factor for temporal credit assignment
# Must be between 0 and 1
reward_discount_factor = 0.99

# Environment settings - GridWorld environment dimensions
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
