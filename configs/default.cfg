# NLM Configuration File
# Phase 2: Real Neural Computation
# This is the default configuration for NLM neural simulation framework
# Configuration values are grouped by functional system

# ==============================================================================
# CORE SIMULATION SETTINGS
# =============================================================================
# Random seed for reproducible experiments (0 = time-based random)
random_seed = 42

# Simulation timestep in seconds (control integration accuracy vs performance)
simulation_timestep = 0.001

# Number of neurons in the brain (affects memory and processing capacity)
neuron_count = 1000

# Number of brain regions (affects parallelization and modular organization)
region_count = 2

# Connection probability for random connectivity (0.0-1.0)
# Higher values create denser connectivity but increase computational load
connection_probability = 0.1

# ==============================================================================
# NEURAL DYNAMICS SETTINGS
# =============================================================================
# Plasticity learning rate (affects speed of synaptic changes)
plasticity_learning_rate = 0.01

# ==============================================================================
# SPATIOTEMPORAL DYNAMICS SETTINGS
# =============================================================================
# Spike-Timing-Dependent Plasticity (STDP) parameters
stdp_ltp_weight = 0.01     # Long-Term Potentiation weight (pre<->post correlation)
stdp_ltd_weight = 0.012    # Long-Term Depression weight (anti-correlation)
stdp_time_constant = 20.0  # Time window for STDP (ms)

# ==============================================================================
# DEVELOPMENTAL PLASTICITY SETTINGS
# =============================================================================
# Structural plasticity controls for brain development
development_synaptogenesis_rate = 0.001   # Rate of new synapse formation
development_pruning_rate = 0.0001         # Rate of synapse elimination

# ==============================================================================
# NEUROMODULATION SETTINGS
# =============================================================================
# Baseline neuromodulator levels (affects overall brain excitability)
# dopamine_baseline influences reward sensitivity and exploration drive
dopamine_baseline = 0.1

# ==============================================================================
# LEARNING AND MEMORY SETTINGS
# =============================================================================
# Reward processing and learning
reward_discount_factor = 0.99  # How much future rewards are valued (0.0-1.0)

# ==============================================================================
# ENVIRONMENT INTERACTION SETTINGS
# =============================================================================
# Cognitive architecture and environment interface
environment_name = GridWorld          # Type of simulated environment
environment_width = 10               # Environment dimensions
environment_height = 10              # Environment dimensions

# ==============================================================================
# LOGGING AND OUTPUT SETTINGS
# =============================================================================
# Monitoring and debugging configuration
log_level = INFO                      # Verbosity level: DEBUG, INFO, WARN, ERROR, CRITICAL
log_to_file = false                   # Write logs to file (true/false)
log_filename = nlm.log                # Log file name (if log_to_file is true)

# ==============================================================================
# SIMULATION CONTROL SETTINGS
# =============================================================================
# Runtime limits and performance control
max_simulation_steps = 10000         # Maximum steps before automatic termination
simulation_time_limit = 0.0          # Time limit in seconds (0.0 = unlimited)

# ==============================================================================
# VISUALIZATION SETTINGS
# =============================================================================
# GUI and monitoring configuration
visualization_enabled = false         # Enable/disable visualization system
visualization_update_rate = 30.0      # Frames per second for visualization

# ==============================================================================
# END OF CONFIGURATION
# ===============================================================================
