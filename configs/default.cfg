# NLM Configuration File
# Phase 6 Final Integration Configuration

# Random seed for reproducible experiments
[random]
random_seed = 42
random_generator_type = "mt19937"

# Simulation settings
[simulation]
simulation_timestep = 0.001
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_early_stop = false

# Brain architecture
[architecture]
neuron_count = 1000
region_count = 1
connection_probability = 0.15
inhibitory_neuron_ratio = 0.2
excitation_inhibition_balance = 1.0

# Plasticity rules
[plasticity]
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_soft_bounds_enabled = true
hebbian_enabled = true
reward_modulated_enabled = true

# Structural plasticity
[structural_plasticity]
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
max_synapses_per_neuron = 100
min_synapse_weight = 0.01
max_synapse_weight = 1.0

# Development system
[development]
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
developmental_stage = "adult"
plasticity_decay_rate = 0.001
neural_excitability_increase = 0.05

# Neuromodulation
[neuromodulation]
# Dopamine - reward prediction error
dopamine_baseline = 0.1
dopamine_relevance_threshold = 0.5
dopamine_plasticity_factor = 0.5

# Acetylcholine - attention modulation
acetylcholine_baseline = 0.05
acetylcholine_focus_strength = 0.8
acetylcholine_plasticity_modulation = 0.3

# Serotonin - mood and behavioral flexibility
serotonin_baseline = 0.0
serotonin_exploratory_drive = 0.7
serotonin_plasticity_modulation = 0.2

# Norepinephrine - arousal and vigilance
noradrenaline_baseline = 0.05
noradrenaline_focus_boost = 0.6
noradrenaline_plasticity_modulation = 0.4

# Memory systems
[memory]
working_memory_capacity = 100
working_memory_decay_rate = 0.9
working_memory_trace_decay = 0.05

episodic_memory_capacity = 1000
episodic_memory_compression = true
episodic_memory_replay_frequency = 0.1

associative_memory_pattern_count = 100
associative_memory_threshold = 0.7

# Prediction system
[prediction]
prediction_window_size = 10
prediction_error_threshold = 0.5
prediction_confidence_decay = 0.95
prediction_weight_decay = 0.99

# Cognition
[cognition]
concept_formation_threshold = 0.6
concept_decay_rate = 0.95
neural_planning_depth = 3
attentional_selection_strength = 0.8
attention_decay_rate = 0.9

# Environment
[environment]
environment_name = "GridWorld"
environment_width = 10
environment_height = 10
reward_scale = 1.0
novelty_threshold = 0.5
curiosity_gain = 0.1

# Logging
[logging]
log_level = "INFO"
log_to_file = false
log_filename = "nlm.log"
log_rotation_size_mb = 10
log_keep_days = 30

# Performance
[performance]
enable_simd = true
enable_parallel_processing = true
memory_pool_size = "large"
event_queue_capacity = 10000
checkpoint_compression = true
checkpoint_verify = true

# Visualization
[visualization]
enabled = false
update_rate = 30.0
render_mode = "terminal"
data_export_format = "json"
export_interval = 100

# Experiment settings
[experiment]
experiment_name = "default"
enable_checkpointing = true
checkpoint_path = "./checkpoint.bin"
enable_replay = true
replay_interval = 100
enable_development = true

# Advanced debugging
[debug]
enable_debug_mode = false
debug_level = "standard"
profiling_enabled = false
memory_leak_detection = true
performance_profiling = true
step_recording_enabled = false
record_every_n_steps = 1000