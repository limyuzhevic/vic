# Default NLM configuration file
# This provides default values for the Neural Learning Machine simulation

# Random seed for reproducible results
random_seed = 42

# Simulation timestep in seconds (default: 1ms)
simulation_timestep = 0.001

# Number of neurons in the simulation
neuron_count = 500

# Number of brain regions
region_count = 1

# Probability of connections between neurons
connection_probability = 0.15

# STDP parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Neuromodulation parameters
dopamine_max = 1.0
dopamine_min = -1.0
novelty_decay = 0.99
curiosity_threshold = 0.3
high_curiosity_threshold = 0.5

# Sensory processing parameters
vision_scale = 5.0
touch_scale = 8.0
internal_scale = 5.0
proprioception_scale = 3.0
vision_size = 16
prop_size = 6

# Motor control parameters
motor_actions = 6
sense_actions = 4
motor_activity_threshold = 0.5

# Memory parameters
working_memory_size = 100
episodic_memory_size = 1000
episodic_decay = 0.95
semantic_decay = 0.9

# Development parameters
initial_plasticity = 1.0
critical_plasticity = 0.8
maturation_plasticity = 0.5
adult_plasticity = 0.2
