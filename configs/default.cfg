# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01  # Learning rate for Hebbian plasticity (0.0-1.0)
stdp_ltp_weight = 0.01  # Spike-Timing-Dependent Plasticity Long-Term Potentiation weight (0.0-1.0)
stdp_ltd_weight = 0.012  # Spike-Timing-Dependent Plasticity Long-Term Depression weight (0.0-1.0)
stdp_time_constant = 20.0  # Time constant for STDP in simulation steps (higher = slower learning)

# Development settings (structural plasticity)
development_synaptogenesis_rate = 0.001  # Rate of new synapse formation per neuron per step (0.0-1.0)
development_pruning_rate = 0.0001  # Rate of synapse elimination per synapse per step (0.0-1.0)

# Neuromodulation settings
dopamine_baseline = 0.1  # Baseline dopamine level for reward modulation (0.0-1.0)
# Note: Dopamine modulates neural excitability and plasticity based on reward prediction

# Reward settings
reward_discount_factor = 0.99  # How much future rewards are discounted (0.0-1.0)
# Higher values = more long-term thinking, lower values = more short-term focus

# Environment settings
environment_name = GridWorld  # Name of the environment simulation (e.g., GridWorld, Maze)
environment_width = 10  # Width of the environment in cells (must be >= visionWidth)
environment_height = 10  # Height of the environment in cells (must be >= visionHeight)

# Logging settings
log_level = INFO  # Logging level: DEBUG, INFO, WARNING, ERROR
log_to_file = false  # Whether to write logs to file (true) or console (false)
log_filename = nlm.log  # Log file name when log_to_file is true

# Simulation settings
max_simulation_steps = 10000  # Maximum number of simulation steps per episode
simulation_time_limit = 0.0  # Time limit in seconds (0.0 = unlimited)

# Visualization settings
visualization_enabled = false  # Enable visualization (requires OpenGL/VTK)
visualization_update_rate = 30.0  # Frames per second for visualization
