# NLM Configuration File
# This is the default configuration for Phase 6 integrated brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.001
pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
curiosity_novelty_weight = 0.5
curiosity_prediction_error_weight = 0.5
novelty_threshold = 0.3

# Development settings
initial_plasticity = 1.0
critical_period_duration = 100.0
maturation_rate = 0.5

# Memory system settings
working_memory_capacity = 50
episodic_memory_max_episodes = 1000
associative_memory_size = 100

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Checkpoint settings
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
enable_checkpointing = true

# Replay settings
replay_interval = 100
enable_replay = true

# Performance settings
optimization_level = "aggressive"
parallel_processing = true
vectorization = true
memory_pooling = true
