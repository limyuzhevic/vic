# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration
# Updated with complete memory, prediction, cognition, and neuromodulation systems

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (Phase 6 enhanced)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings (Phase 6 complete)
dopamine_baseline = 0.1
dopamine_release_rate = 1.0
dopamine_decay_rate = 0.1

# Acetylcholine for attention and memory consolidation
acetylcholine_baseline = 0.05
acetylcholine_release_rate = 0.8
acetylcholine_decay_rate = 0.1

# Norepinephrine for arousal and vigilance
norepinephrine_baseline = 0.03
norepinephrine_release_rate = 0.6
norepinephrine_decay_rate = 0.1

# Serotonin for mood and social behavior
serotonin_baseline = 0.02

# Reward settings (Phase 6 enhanced)
reward_discount_factor = 0.99
reward_prediction_error_scale = 0.1

# Environment settings (Phase 6 enhanced)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings (Phase 6 enhanced)
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_components = core,agent,brain,memory,cognition,neuromodulation

# Simulation settings (Phase 6 enhanced)
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# Memory systems configuration (Phase 6 integrated)
working_memory_capacity = 100
working_memory_decay_rate = 0.05
episodic_memory_max_episodes = 1000
episodic_memory_replay_enabled = true
associative_memory_enabled = true

# Prediction system configuration (Phase 6 integrated)
prediction_system_enabled = true
prediction_horizon = 10
prediction_error_threshold = 0.1

# Cognition systems configuration (Phase 6 integrated)
neural_planner_enabled = true
concept_formation_enabled = true
self_model_enabled = true
social_learning_enabled = true
planner_action_quality_window = 100

# Development configuration (Phase 6 stages)
development_stage_initial = 60.0
development_stage_critical = 300.0
development_stage_maturation = 900.0
development_stage_adult = 900.0
development_stage_aging = 2700.0

# Neuromodulation effects (Phase 6 enhanced)
dopamine_plasticity_factor = 0.5
dopamine_excitability_factor = 0.5

acetylcholine_attention_weight = 0.3
acetylcholine_memory_consolidation_weight = 0.7

norepinephrine_arousal_weight = 0.4
norepinephrine_vigilance_weight = 0.6

serotonin_mood_weight = 0.2
serotonin_impulsivity_weight = 0.3
serotonin_social_weight = 0.5

# Performance configuration (Phase 6 optimized)
performance_memory_pools_enabled = true
performance_event_queues_enabled = true
performance_sparse_connectivity_enabled = true
performance_parallel_processing_enabled = true
performance_simd_vectorization_enabled = true
checkpoint_compression_level = balanced
checkpoint_save_interval = 100
checkpoint_max_history = 10

# Visualization settings (Phase 6 enhanced)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_memory_traces = true
visualization_episodic_episodes = true
visualization_prediction_errors = true
visualization_cognition_biases = true
visualization_neuromodulation_levels = true

# Phase 6 experimental parameters
experimental_curiosity_strength = 0.8
experimental_novelty_sensitivity = 0.5
experimental_prediction_confidence = 0.9
experimental_planner_ambition = 0.7
experimental_self_model_confidence = 0.8
experimental_social_imitation_threshold = 0.7

# Safety and limits (Phase 6 hardened)
max_memory_usage_mb = 512
max_checkpoint_size_mb = 100
max_active_traces = 1000
max_replay_queue_size = 50
