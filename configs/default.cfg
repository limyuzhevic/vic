# NLM Configuration File
# Phase 2: Real Neural Computation Configuration
# Comprehensive neural simulation parameters organized by category

### CORE SIMULATION SETTINGS
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (base for all dynamics)
simulation_timestep = 0.001

# Number of neurons in the brain (efficient for modern hardware)
neuron_count = 2000

# Number of brain regions (modular architecture)
region_count = 4

# Connection probability for random connectivity (creates sparse but rich connectivity)
connection_probability = 0.15

### NEURAL DYNAMICS PARAMETERS
# Neuron electrical properties
neuron_threshold = -55.0          # Firing threshold (mV)
neuron_resting_potential = -70.0  # Resting potential (mV)
neuron_reset_potential = -70.0    # Reset after spike (mV)
neuron_leak_conductance = 10.0    # Membrane leak conductance (nS)
neuron_membrane_capacitance = 1.0 # Membrane capacitance (nF)
neuron_time_constant = 20.0       # Membrane time constant (ms)
neuron_refractory_period = 5      # Refractory period (simulation steps)
neuron_max_adaptation = 2.0       # Max spike-frequency adaptation

# Synaptic properties
synapse_delay = 2                 # Average synaptic delay (steps)
synapse_max_weight = 1.0          # Maximum synaptic weight
synapse_min_weight = -1.0         # Minimum synaptic weight
synapse_efficacy_decay = 0.95     # Short-term plasticity decay factor

### PLASTICITY MECHANISMS
# STDP (Spike-Timing-Dependent Plasticity)
stdp_ltp_weight = 0.02            # Long-Term Potentiation weight
stdp_ltd_weight = 0.015           # Long-Term Depression weight
stdp_time_constant = 20.0         # STDP time window (ms)
stdp_learning_rate = 0.01         # Overall STDP learning rate

# Hebbian plasticity
hebbian_learning_rate = 0.005     # Hebbian learning rate
hebbian_trace_decay = 0.95       # Hebbian eligibility trace decay

# Structural plasticity
structural_plasticity_rate = 0.0002  # Synaptogenesis rate
structural_pruning_rate = 0.00005    # Pruning rate
structural_plasticity_min_weight = 0.1  # Min weight for structural changes

### NEUROMODULATION SYSTEMS
# Dopamine modulation
dopamine_baseline = 0.1           # Baseline dopamine level
dopamine_sensitivity = 0.8        # Dopamine receptor sensitivity
dopamine_learning_rate = 0.001    # Dopamine-modulated plasticity rate

# Curiosity and exploration
curiosity_baseline = 0.5          # Baseline curiosity level
curiosity_sensitivity = 1.0       # Curiosity system gain
curiosity_decay_rate = 0.98       # Curiosity decay rate

# Novelty detection
novelty_threshold = 0.3            # Novelty detection threshold
novelty_sensitivity = 1.5          # Novelty system gain
novelty_history_length = 100       # Number of past states to remember

# Prediction error
prediction_error_decay = 0.95     # Prediction error trace decay
prediction_error_scale = 0.5      # Prediction error signal scale

### COGNITIVE SYSTEMS
# Working memory parameters
working_memory_capacity = 50       # Number of items in working memory
working_memory_decay = 0.9        # Working memory decay rate
working_memory_consolidation_rate = 0.01 # Memory consolidation rate

# Episodic memory
episodic_memory_capacity = 1000    # Total episodic memory slots
eepisodic_memory_replay_rate = 0.1 # Replay frequency during rest

# Attentional selection
attention_focus_strength = 0.8    # Strength of attentional focus
attention_switch_cost = 5         # Cost of switching attention
attention_decay_rate = 0.95       # Attention decay rate

# Planning horizon
planning_horizon = 20             # Number of steps to plan ahead
planning_discount_factor = 0.95   # Future reward discount
planning_exploration_bonus = 0.1 # Exploration bonus in planning

### DEVELOPMENT AND MATURATION
# Developmental stages
initial_plasticity_rate = 0.02   # Initial high plasticity rate
critical_period_end_step = 1000   # End of critical period
adult_plasticity_rate = 0.001    # Adult low plasticity rate
aging_plasticity_rate = 0.0005   # Aging plasticity rate

# Synapse formation and elimination
initial_synapse_count = 10000     # Starting synapse count
target_synapse_count = 50000      # Target mature synapse count
development_time_constant = 1000 # Development time scale

# Neural excitability
initial_excitability = 1.0        # Initial neural excitability
adult_excitability = 1.0          # Adult excitability level
excitability_decay_rate = 0.999   # Slow excitability decay with age

### ENVIRONMENT AND BEHAVIOR
# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20
vision_range = 5                  # Sensory range in cells
vision_angle = 90.0               # Visual field angle (degrees)

# Action space
max_actions_per_step = 3          # Maximum actions per simulation step
action_cost = 0.1                 # Energy cost of actions
movement_efficiency = 0.8         # How efficiently actions translate to movement

# Reward system
reward_discount_factor = 0.95     # Temporal reward discounting
reward_scaling = 1.0               # Reward value scaling
exploration_reward = 0.1          # Reward for exploration
exploitation_reward = 1.0         # Reward for exploitation

### MEMORY AND CONSOLIDATION
# Memory consolidation
consolidation_threshold = 0.7     # Confidence threshold for consolidation
consolidation_rate = 0.05         # Rate of memory consolidation
replay_frequency = 0.1            # Replay during rest phases

# Memory competition
memory_competition_strength = 0.6 # Strength of memory competition
memory_decay_rate = 0.995         # Natural memory decay rate

### LOGGING AND OUTPUT
# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_simulation.log
log_file_size_mb = 100
log_rotation_count = 5

# Progress logging
progress_log_interval = 100       # Steps between progress updates
statistics_log_interval = 1000    # Steps between detailed stats
performance_log_interval = 5000   # Steps between performance metrics

# Visualization settings
visualization_enabled = true
visualization_update_rate = 30.0   # Visualization update frequency (Hz)
visualization_resolution = 0.5    # Visualization downsampling factor
screen_width = 1920
screen_height = 1080

### SIMULATION CONTROL
# Simulation limits
max_simulation_steps = 50000      # Maximum simulation steps
simulation_time_limit = 3600.0    # Maximum simulation time (seconds)

# Performance settings
enable_multi_threading = false     # Parallel processing (experimental)
enable_vectorization = true        # SIMD vectorization
memory_pool_size = 100MB           # Memory pool for allocations

# Checkpointing
checkpoint_interval = 1000        # Steps between checkpoints
checkpoint_file = "nlm_checkpoint.bin"
enable_autosave = true             # Automatic checkpointing
