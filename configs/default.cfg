# NLM Configuration File - Phase 6 Integration
# Default configuration for Phase 6 final integration testing

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 optimized)
neuron_count = 500

# Number of brain regions (Phase 6 uses fewer regions for better integration)
region_count = 1

# Connection probability for random connectivity (Phase 6 tighter integration)
connection_probability = 0.15

# STDP plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_maturation_rate = 0.0005

# Neuromodulation parameters
dopamine_baseline = 0.1
novelty_threshold = 0.5
curiosity_strength = 0.8

# Reward settings
reward_discount_factor = 0.95
reward_prediction_error_enabled = true

# Memory system parameters
working_memory_capacity = 100
episodic_memory_capacity = 1000
associative_memory_enabled = true
procedural_memory_enabled = true

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Experiment settings
max_simulation_steps = 2000
enable_checkpointing = true
enable_replay = true
enable_development = true

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_timestamps = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
enable_performance_monitoring = true

# Phase 6 Integration specific settings
enable_prediction_system = true
enable_cognition_systems = true
enable_neuromodulation = true
integration_test_mode = false
