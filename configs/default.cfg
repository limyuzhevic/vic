# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds - determines neural dynamics resolution
simulation_timestep = 0.001

# Number of neurons in the brain - increase for more complex behavior
neuron_count = 500

# Number of brain regions - 1 for simple brain, more for distributed processing
region_count = 1

# Connection probability for random connectivity between neurons (0.0-1.0)
connection_probability = 0.15

# --- Plasticity Settings ---

# Plasticity learning rate for Hebbian and general plasticity rules
plasticity_learning_rate = 0.01

# --- STDP Parameters (Spike-Timing-Dependent Plasticity) ---

# STDP learning rate for long-term potentiation (LTP)
stdp_ltp_weight = 0.02

# STDP learning rate for long-term depression (LTD)
stdp_ltd_weight = 0.015

# STDP time constant in milliseconds
stdp_time_constant = 20.0

# --- Development Settings ---

# Rate of synaptogenesis (formation of new synapses) during development
development_synaptogenesis_rate = 0.0001

# Rate of pruning (elimination of synapses) during development
development_pruning_rate = 0.00001

# --- Neuromodulation Settings ---

# Baseline dopamine level affecting motivation and exploration
dopamine_baseline = 0.1

# --- Reward Settings ---

# Discount factor for future rewards in reinforcement learning
reward_discount_factor = 0.99

# --- Environment Settings ---

# Name of the environment (GridWorld, ContinuousSpace, etc.)
environment_name = GridWorld

# Width of the simulation environment (in arbitrary units)
environment_width = 10

# Height of the simulation environment (in arbitrary units)
environment_height = 10

# --- Logging Settings ---

# Minimum log level: DEBUG (0), INFO (1), WARNING (2), ERROR (3), CRITICAL (4)
log_level = 1

# Enable/disable logging to file
log_to_file = false

# Name of the log file
log_filename = nlm.log

# --- Simulation Settings ---

# Maximum number of simulation steps per run
max_simulation_steps = 10000

# Maximum simulation time in seconds (0.0 = unlimited)
simulation_time_limit = 0.0

# --- Visualization Settings ---

# Enable/disable real-time visualization
visualization_enabled = false

# Visualization update rate in Hz
visualization_update_rate = 30.0
