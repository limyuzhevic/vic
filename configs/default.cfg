# NLM Configuration File
# This is the default configuration for NLM (Neural Learning Machine)
# Enhanced configuration system with JSON/YAML support and validation

# ============================================================================
# CORE SIMULATION PARAMETERS
# ============================================================================

# Random seed for reproducible experiments
# Ensures consistent neural development across runs
# units: integer
# default: 42
random_seed = 42

# Simulation timestep in seconds
# Determines the granularity of neural simulation
# units: float (seconds)
# default: 0.001
# validation: ^[0-9]+(\.[0-9]+)?$
simulation_timestep = 0.001

# Number of neurons in the brain
# Initial population size for the neural network
# units: integer (neuron count)
# default: 1000
# validation: ^[0-9]+
neuron_count = 1000

# Number of brain regions
# Number of distinct processing regions in the brain
# units: integer (region count)
# default: 2
# validation: ^[0-9]+
region_count = 2

# Connection probability for random connectivity
# Probability that any two neurons will form a synaptic connection
# units: float (0.0 to 1.0 or 1.0+)
# default: 0.1
# validation: ^(0\.[0-9]+|[1]\.[0-9]+|[1])$
connection_probability = 0.1

# ============================================================================
# PLASTICITY AND LEARNING PARAMETERS
# ============================================================================

# Plasticity learning rate
# Controls the overall rate of synaptic weight changes
# units: float (learning rate)
# default: 0.01
# validation: ^[0-9]+(\.[0-9]+)?$
plasticity_learning_rate = 0.01

# STDP LTP weight
# Spike-Timing-Dependent Plasticity Long-Term Potentiation weight
# units: float (synaptic weight)
# default: 0.01
# validation: ^[0-9]+(\.[0-9]+)?$
stdp_ltp_weight = 0.01

# STDP LTD weight
# Spike-Timing-Dependent Plasticity Long-Term Depression weight
# units: float (synaptic weight)
# default: 0.012
# validation: ^[0-9]+(\.[0-9]+)?$
stdp_ltd_weight = 0.012

# STDP time constant
# Time constant for STDP learning curves (in milliseconds)
# units: float (milliseconds)
# default: 20.0
# validation: ^[0-9]+(\.[0-9]+)?$
stdp_time_constant = 20.0

# ============================================================================
# DEVELOPMENT PARAMETERS
# ============================================================================

# Development synaptogenesis rate
# Rate at which new synapses are formed during development
# units: float (synaptogenesis rate)
# default: 0.001
# validation: ^[0-9]+(\.[0-9]+)?$
development_synaptogenesis_rate = 0.001

# Development pruning rate
# Rate at which synapses are eliminated during development
# units: float (pruning rate)
# default: 0.0001
# validation: ^[0-9]+(\.[0-9]+)?$
development_pruning_rate = 0.0001

# ============================================================================
# NEUROMODULATION PARAMETERS
# ============================================================================

# Baseline dopamine level
# Default dopamine concentration in the brain
# units: float (dopamine concentration)
# default: 0.0
# validation: ^(-?[0-9]+(\.[0-9]+)?)$
dopamine_baseline = 0.0

# ============================================================================
# REWARD AND LEARNING PARAMETERS
# ============================================================================

# Reward discount factor
# Controls how much future rewards are valued
# units: float (discount factor, 0.0-1.0)
# default: 0.99
# validation: ^[0-9]+(\.[0-9]+)?$
reward_discount_factor = 0.99

# ============================================================================
# ENVIRONMENT PARAMETERS
# ============================================================================

# Environment type name
# Type of simulated environment (GridWorld, etc.)
# units: string (environment name)
# default: GridWorld
# validation: ^([A-Za-z0-9_]+$
environment_name = GridWorld

# Environment width
# Width of the simulated environment in units
# units: integer (environment width)
# default: 10
# validation: ^[0-9]+
environment_width = 10

# Environment height
# Height of the simulated environment in units
# units: integer (environment height)
# default: 10
# validation: ^[0-9]+
environment_height = 10

# ============================================================================
# LOGGING PARAMETERS
# ============================================================================

# Log level
# Verbosity level for logging (DEBUG, INFO, WARN, ERROR)
# units: string (log level)
# default: INFO
# validation: ^(DEBUG|INFO|WARN|ERROR)$
log_level = INFO

# Log to file
# Whether to write log messages to a file
# units: boolean
# default: false
log_to_file = false

# Log filename
# Name of the log file (when log_to_file is true)
# units: string (filename)
# default: nlm.log
# validation: ^([a-zA-Z0-9_\-\.]+)\.log$
log_filename = nlm.log

# ============================================================================
# SIMULATION PARAMETERS
# ============================================================================

# Maximum simulation steps
# Maximum number of simulation steps to run
# units: integer (step count)
# default: 10000
# validation: ^[0-9]+
max_simulation_steps = 10000

# Simulation time limit
# Maximum simulation time in seconds (0.0 = unlimited)
# units: float (seconds)
# default: 0.0
# validation: ^[0-9]+(\.[0-9]+)?$
simulation_time_limit = 0.0

# ============================================================================
# VISUALIZATION PARAMETERS
# ============================================================================

# Visualization enabled
# Whether to enable visualization features
# units: boolean
# default: false
visualization_enabled = false

# Visualization update rate
# Frame rate for visualization updates (in Hz)
# units: float (hertz)
# default: 30.0
# validation: ^[0-9]+(\.[0-9]+)?$
visualization_update_rate = 30.0
