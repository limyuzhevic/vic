# NLM Configuration File
# This is the default configuration for Phase 6 (Final Integration)

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (smaller = more accurate but slower)
simulation_timestep = 0.001

# Number of neurons in the brain (more neurons = more complexity)
neuron_count = 1000

# Number of brain regions (more regions = better modularization)
region_count = 2

# Connection probability for random connectivity (0.0-1.0)
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings (lower rates for mature brain)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced performance settings
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
enable_prediction = true

# Memory system configuration
working_memory_capacity = 100
episodic_memory_capacity = 1000
semantic_memory_capacity = 5000
associative_memory_capacity = 2000

# Neuromodulation parameters
curiosity_threshold = 0.5
curiosity_gain = 0.1
novelty_threshold = 0.3

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
