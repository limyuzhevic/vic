# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
stdp_ltp_weight = 0.02f
stdp_ltd_weight = 0.015f
stdp_tau = 20.0f
plasticity_learning_rate = 0.001f

# Hebbian learning settings
hebbian_learning_rate = 0.0001f

# Structural plasticity settings
synaptogenesis_rate = 0.0001f
pruning_rate = 0.00001f

# Development settings
initial_plasticity = 1.0f
development_synaptogenesis_rate = 0.0001f
development_pruning_rate = 0.00001f
plasticity_decay_factor = 0.999f

# Neuromodulation settings
dopamine_baseline = 0.0f
dopamine_scale = 1.0f
dopamine_decay_rate = 0.95f

# Curiosity settings
curiosity_decay_rate = 0.98f
exploration_bonus = 0.5f

# Novelty detection settings
novelty_threshold = 0.1f
novelty_decay = 0.9f

# Reward settings
reward_discount_factor = 0.99f
reward_prediction_error_enabled = true

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_phase6.log
log_to_console = true

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Development stages
enable_development = true
initial_development_stage = 0.1f
maturation_rate = 0.001f

# Advanced features
enable_memory_integration = true
enable_prediction_integration = true
enable_neuromodulation_integration = true

# Performance optimization
vectorization_enabled = true
parallel_processing_enabled = false
sparse_connectivity_enabled = true

# Checkpointing
checkpoint_enabled = true
checkpoint_interval = 1000
checkpoint_path = ./nlm_checkpoint_phase6.bin

# Replay
replay_enabled = true
replay_decay = 0.95f
replay_trace_length = 100

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_debug_mode = false
