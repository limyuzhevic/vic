# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.0
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# CLI Configuration Options
# CLI help and information
cli_help_enabled = true
cli_examples_enabled = true
cli_version_enabled = true
cli_features_enabled = true

# CLI configuration options
cli_config_file_enabled = true
cli_set_enabled = true
cli_group_enabled = true
cli_inherit_enabled = true
cli_validate_enabled = true

# CLI simulation control options
cli_steps_enabled = true
cli_duration_enabled = true
cli_pause_enabled = true
cli_resume_enabled = true
cli_step_enabled = true
cli_time_enabled = true
cli_reset_enabled = true
cli_save_enabled = true
cli_load_enabled = true

# CLI debug and monitoring options
cli_debug_enabled = true
cli_trace_enabled = true
cli_profile_enabled = true
cli_stats_enabled = true
cli_monitor_enabled = true
cli_benchmark_enabled = true

# CLI memory and system control options
cli_working_memory_enabled = true
cli_episodic_enabled = true
cli_associative_enabled = true
cli_replay_enabled = true
cli_consolidation_enabled = true

# CLI development and neuromodulation options
cli_stage_enabled = true
cli_dopamine_enabled = true
cli_curiosity_enabled = true
cli_novelty_enabled = true
cli_plasticity_enabled = true

# CLI performance and optimization options
cli_event_driven_enabled = true
cli_latency_enabled = true
cli_performance_enabled = true
cli_checkpoint_enabled = true

# CLI advanced experimentation options
cli_experiment_enabled = true
cli_experiment_config_enabled = true
cli_ablation_enabled = true
cli_parameter_enabled = true

# CLI output and reporting options
cli_output_enabled = true
cli_output_file_enabled = true
cli_quiet_enabled = true
cli_verbose_enabled = true
cli_log_enabled = true

# CLI integration and testing options
cli_integration_test_enabled = true
cli_stress_test_enabled = true
cli_validate_memory_enabled = true
cli_validate_plasticity_enabled = true

# Default CLI settings
cli_default_steps = 1000
cli_default_duration = 0.0
cli_default_debug_level = "info"
cli_default_output_format = "text"
cli_default_log_level = "info"
cli_default_performance_mode = "balanced"
cli_default_event_driven = false
cli_default_monitor_interval = 1.0
cli_default_checkpoint_interval = 10.0

# CLI command history and completion
cli_command_history_enabled = true
cli_command_history_size = 1000
cli_command_history_file = ".nlm_history"
cli_command_completion_enabled = true
cli_tab_completion_enabled = true

# CLI interactive mode
cli_interactive_mode_enabled = true
cli_prompt = ">>> "
cli_prompt_history = true
cli_prompt_suggestions = true

# CLI error handling and reporting
cli_error_handling_level = "graceful"
cli_error_exit_code = 1
cli_error_continue_on_warning = true
cli_error_log_stack_trace = true

# CLI performance tuning
cli_max_command_time = 30.0
cli_max_memory_usage = 1024.0
cli_max_cpu_usage = 100.0
cli_thread_pool_size = 4

# CLI security and permissions
cli_allow_config_write = true
cli_allow_file_read = true
cli_allow_file_write = true
cli_allow_experiments = true
cli_allow_network_access = false
