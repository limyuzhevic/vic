# NLM Configuration File
# This is the default configuration for Phase 2 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings (combined dopaminergic modulation)
# Dopamine system configuration
dopamine_scale = 1.0
dopamine_decay = 0.95
dopamine_baseline = 0.1

# Novelty detection
novelty_threshold = 0.3
novelty_decay = 0.9

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced neural configuration
# Neural dynamics parameters
neuron_tau = 20.0  # Membrane time constant (ms)
neuron_v_thresh = -50.0  # Threshold potential (mV)
neuron_v_reset = -70.0  # Reset potential (mV)
neuron_v_rest = -70.0  # Resting potential (mV)

# Synaptic configuration
synapse_delay_mean = 5.0
synapse_delay_std = 2.0
synapse_weight_mean = 0.5
synapse_weight_std = 0.1

# Memory configuration
working_memory_capacity = 100
episodic_memory_capacity = 1000

# Cognitive parameters
attention_focus_strength = 0.7
planning_horizon = 10
