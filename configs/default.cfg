# NLM Configuration File
# This is the default configuration for Phase 6: Integrated Artificial Brain
# 
# Configuration keys are described in the NLM documentation and API reference

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds - finer timesteps give more accurate neural dynamics
simulation_timestep = 0.001

# Number of neurons in the brain - affects computational capacity
neuron_count = 1000

# Number of brain regions for modular processing
region_count = 2

# Connection probability for random connectivity between neurons (0.0 to 1.0)
connection_probability = 0.1

# Plasticity learning rate controls overall learning speed
plasticity_learning_rate = 0.01

# STDP parameters for spike-timing dependent plasticity
# Long-Term Potentiation weight change
stdp_ltp_weight = 0.01
# Long-Term Depression weight change
stdp_ltd_weight = 0.012
# Time constant for STDP eligibility traces
stdp_time_constant = 20.0

# Development parameters for activity-dependent plasticity
# Rate of synapse formation during development
development_synaptogenesis_rate = 0.001
# Rate of synapse elimination during development
development_pruning_rate = 0.0001

# Neuromodulation parameters for regulatory signals
# Baseline dopamine level
dopamine_baseline = 0.1
# Scale factor for curiosity-driven modulation
dopamine_curiosity_scale = 2.0

# Reward learning parameters
# Discount factor for future rewards (0.0 to 1.0)
reward_discount_factor = 0.99

# Environment settings for simulated world
# Type of environment
environment_name = GridWorld
# Environment dimensions
environment_width = 10
environment_height = 10

# Logging configuration
# Log severity level (Debug, Info, Warning, Error, Critical)
log_level = INFO
# Enable logging to file in addition to console
log_to_file = false
# Filename for log output
log_filename = nlm.log

# Simulation limits
# Maximum number of simulation steps
max_simulation_steps = 10000
# Absolute time limit in seconds (0.0 = no limit)
simulation_time_limit = 0.0

# Visualization settings
# Enable real-time visualization
visualization_enabled = false
# Frame rate for visualization updates
visualization_update_rate = 30.0
