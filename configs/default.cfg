# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_decay_rate = 0.95
curiosity_baseline = 0.05
curiosity_decay_rate = 0.95
curiosity_exploration_rate = 0.1
novelty_threshold = 0.1
prediction_error_decay = 0.9
reward_modulation_strength = 0.5

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_weight = 0.1
max_reward_value = 10.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
max_steps_per_episode = 1000

# Memory system settings
working_memory_capacity = 1000
working_memory_decay_rate = 0.9
episodic_memory_capacity = 5000
consolidation_interval = 1000

# Development system settings
development_stage_duration = 10000
development_plasticity_boost = 2.0

# Neural computation settings
spike_neuron_threshold = 20.0
spike_refractory_period = 5
spike_delay_max = 10
connection_probability = 0.1
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_debug_enabled = false
log_history_size = 1000

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
checkpoint_interval_steps = 10000
checkpoint_save_interval = 1

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1280
visualization_window_height = 720

# Performance settings
max_spikes_per_step = 1000
simd_enabled = true
parallel_threads = 4
