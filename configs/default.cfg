# Default configuration for NLM Phase 2
# This file contains default values for neural simulation parameters

# Brain configuration
brain {
    # Total number of neurons in the simulation
    neuron_count = 500
    
    # Number of neural regions
    region_count = 1
    
    # Synaptic connectivity probability (0.0 to 1.0)
    connection_probability = 0.15
    
    # Initial synaptic weight mean and standard deviation
    initial_weight_mean = 0.5
    initial_weight_std = 0.1
    
    # Neuron dynamics parameters
    v_thresh = -50.0
    v_rest = -70.0
    v_reset = -75.0
    tau_mem = 20.0
    tau_ref = 2.0
}

# Plasticity configuration
plasticity {
    # STDP (Spike-Timing Dependent Plasticity)
    stdp {
        enable = true
        ltp_weight = 0.02    # Long-Term Potentiation weight
        ltd_weight = 0.015   # Long-Term Depression weight
        tau = 20.0          # STDP time constant (ms)
    }
    
    # Hebbian plasticity
    hebbian {
        enable = true
        learning_rate = 0.01
        max_weight = 1.0
        min_weight = -1.0
    }
    
    # Structural plasticity (synaptogenesis and pruning)
    structural {
        enable = true
        synaptogenesis_rate = 0.0001
        pruning_rate = 0.00001
        max_connections_per_neuron = 20
    }
}

# Neuromodulation configuration
neuromodulation {
    # Dopamine system
    dopamine {
        scale = 1.0
        baseline = 0.1
        peak = 2.0
    }
    
    # Curiosity system (exploration drive)
    curiosity {
        enable = true
        baseline = 0.1
        learning_rate = 0.05
        exploration_threshold = 0.5
    }
    
    # Novelty detection (predictive coding)
    novelty {
        enable = true
        sensitivity = 0.5
        decay_rate = 0.01
    }
    
    # Reward prediction error (RL)
    reward {
        scale = 1.0
        decay = 0.95
        eligibility_window = 100.0
    }
}

# Prediction system configuration
prediction {
    # Prediction error signaling
    error_system {
        learning_rate = 0.1
        prediction_horizon = 50
        confidence_threshold = 0.8
    }
    
    # Forward model parameters
    forward_model {
        learning_rate = 0.05
        weight_decay = 0.001
        prediction_window = 10
    }
}

# Development configuration
development {
    # Plasticity rate modulation by age/development stage
    stage_modulation {
        initial_period = 100
        critical_period = 500
        maturation_period = 1000
    }
    
    # Structural changes during development
    structural_changes {
        synaptogenesis_peak = 200
        pruning_efficiency = 0.8
        myelination_rate = 0.01
    }
}

# Simulation configuration
simulation {
    # Time control
    timestep = 0.001
    max_steps = 10000
    warmup_steps = 100
    
    # Input/output configuration
    sensory_channels = 3
    motor_actions = 5
    observation_width = 8
    observation_height = 8
    
    # Environment configuration
    environment {
        width = 20
        height = 20
        agent_start_x = 10.0
        agent_start_y = 10.0
        energy_decay_rate = 0.001
        food_concentration = 0.5
        hazard_probability = 0.1
    }
}

# Memory system configuration
memory {
    # Working memory (short-term)
    working_memory {
        capacity = 20
        decay_rate = 0.01
        interference_strength = 0.1
    }
    
    # Episodic memory (long-term)
    episodic {
        capacity = 1000
        consolidation_rate = 0.05
        replay_frequency = 0.1
        replay_duration = 50
    }
    
    # Associative memory
    associative {
        learning_rate = 0.01
        recall_threshold = 0.5
        interference_factor = 0.2
    }
}

# Cognition system configuration
cognition {
    # Concept formation
    concept_formation {
        learning_rate = 0.1
        concept_threshold = 0.7
        concept_decay = 0.001
    }
    
    # Planning and decision making
    planning {
        planning_horizon = 20
        action_selection_temperature = 1.0
        exploration_exploitation_ratio = 0.2
    }
    
    # Attention and working memory
    attention {
        focus_strength = 0.8
        distraction_factor = 0.2
        attentional_blink_rate = 0.1
    }
}

# Logging configuration
logging {
    level = "INFO"
    file = "nlm.log"
    max_file_size = 10485760  # 10MB
    backup_count = 5
    enable_colors = true
    enable_console = true
}

# Performance configuration
performance {
    # Optimization settings
    use_memory_pools = true
    use_event_queues = true
    use_simd = true
    use_parallel = true
    
    # Profiling
    enable_profiling = false
    profile_interval = 1000
    profile_output = "profile.json"
    
    # Checkpointing
    checkpoint {
        enable = true
        interval = 1000
        filename = "checkpoint.bin"
        compress = true
    }
}
