# NLM Configuration File
# This is the default configuration for Phase 2: Real Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation settings
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15
max_simulation_steps = 10000
simulation_time_limit = 0.0

# STDP and Plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
stdp_time_constant = 20.0
plasticity_learning_rate = 0.01

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Curiosity and novelty parameters
curiosity_baseline = 0.05
novelty_sensitivity = 0.5

# Prediction system parameters
prediction_horizon = 10
prediction_error_decay = 0.9
confidence_threshold = 0.5

# Working memory parameters
working_memory_size = 100
working_memory_decay = 0.99

# Episodic memory parameters
episodic_memory_capacity = 50
episodic_replay_rate = 0.2

# Attention parameters
attention_focus_strength = 0.8
attention_decay_rate = 0.95

# Planning parameters
planning_horizon = 20
planning_cost_penalty = 0.1

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
