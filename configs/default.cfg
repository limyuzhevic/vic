# NLM Configuration File
# This is the default configuration for Phase 2 (Real Neural Computation)
# Updated with proper values and improved organization

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (reduced from 1000 to 500 for Phase 2 testing)
neuron_count = 500

# Number of brain regions (reduced from 2 to 1 for simplicity)
region_count = 1

# Connection probability for random connectivity (standard for NLM)
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.001
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings (reduced rates for faster convergence)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (fixed duplicate dopamine_baseline)
neuromod_dopamine_scale = 1.0
neuromod_curiosity_enable = true
neuromod_novelty_enable = true

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_scale = 0.1

# Environment settings
environment_name = SimpleWorld
environment_width = 20
environment_height = 20

# Logging settings (more appropriate for production)
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_colors = true

# Simulation settings
max_simulation_steps = 5000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Additional useful settings for Phase 2
# Brain initialization parameters
brain_initialization_method = "standard"
brain_connectivity_pattern = "random"

# Neuron model parameters
neuron_v_thresh = -50.0
neuron_v_rest = -70.0
neuron_v_reset = -75.0
neuron_tau_mem = 20.0
neuron_tau_ref = 2.0
neuron_admit_current = 50.0

# Synapse parameters
synapse_initial_weight_mean = 0.5
synapse_initial_weight_std = 0.1
synapse_excitatory_strength = 1.0
synapse_inhibitory_strength = -1.0

# Memory system parameters
memory_working_capacity = 100
memory_episodic_max_episodes = 1000
memory_associative_similarity_threshold = 0.7

# Development stage parameters
development_critical_period_duration = 1000.0
development_maturation_threshold = 0.8
