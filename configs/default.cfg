# NLM Configuration File
# Phase 6: Integrated Artificial Brain Configuration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 5000

# Number of brain regions
region_count = 3

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
plasticity_hebbian_enabled = true
plasticity_structural_enabled = true
plasticity_eligibility_trace_decay = 0.95

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_maturation_rate = 0.001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_scale = 1.0
dopamine_plasticity_factor = 1.0

curiosity_enabled = true
curiosity_decay = 0.99
curiosity_threshold = 0.3

curiosity_level = 0.0

novelty_enabled = true
novelty_threshold = 0.5

prediction_error_weight = 0.5

# Reward settings
reward_discount_factor = 0.99
reward_range = 1.0

# Memory System Configuration
working_memory_capacity = 500
episodic_memory_max_episodes = 1000
associative_memory_pattern_threshold = 10
replay_interval = 100
consolidation_interval = 1000
consolidation_threshold = 0.3

# Prediction System Configuration
prediction_horizon = 10
prediction_error_decay = 0.9

# Cognition System Configuration
planning_depth = 5
attentional_excitation_strength = 1.5
attentional_inhibition_strength = 0.5
concept_formation_threshold = 0.7

# Development System Configuration
initial_plasticity = 1.0
critical_period_plasticity = 0.8
maturation_plasticity = 0.5
adult_plasticity = 0.2

# Neuromodulation System Configuration
dopamine_baseline = 0.1
dopamine_scale = 1.0
dopamine_plasticity_factor = 1.0
curiosity_enabled = true
curiosity_decay = 0.99
curiosity_threshold = 0.3
novelty_enabled = true
novelty_threshold = 0.5

# Environment Configuration
vision_width = 16
vision_height = 16
environment_name = SimpleWorld
agent_start_x = 10
agent_start_y = 10

# Checkpointing Configuration
checkpoint_dir = ./checkpoints
checkpoint_interval = 10000
max_checkpoints = 10
checkpoint_compression = true

# Performance Configuration
enable_memory_pool = true
enable_spike_queue = true
enable_soa_layout = true
enable_sparse_connectivity = true
enable_multithreading = true
enable_simd = true

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_fps = 60.0