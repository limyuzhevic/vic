# NLM Configuration File
# This is the default configuration for Phase 6: Real Neural Computation
# NLM (熙然, meaning "serene flow") is an experimental computational brain project

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 2: Real neural computation)
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6: Large-scale neural populations)
neuron_count = 1000

# Number of brain regions (Phase 6: Multiple interconnected regions)
region_count = 2

# Connection probability for random connectivity (Phase 2: 37k synapses for 500 neurons)
connection_probability = 0.15

# Plasticity settings (Phase 2: Real STDP and Hebbian plasticity)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Structural plasticity settings (Phase 2: Synaptogenesis and pruning)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (Phase 6: Integrated neuromodulation systems)
dopamine_baseline = 0.1
dopamine_norepinephrine_ratio = 1.0
dopamine_plasticity_factor = 1.0
norepinephrine_focus = 1.0
serotonin_overall = 0.5
serotonin_mood = 1.0
serotonin_sleep = 0.1
acetylcholine_attention = 1.0
acetylcholine_memory = 0.8

# Reward settings (Phase 6: Reward prediction error and dopamine)
reward_discount_factor = 0.99
reward_prediction_error_decay = 0.1

# Memory systems (Phase 6: Working, episodic, and associative memory)
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_capacity = 500

# Prediction system (Phase 6: Neural prediction capabilities)
prediction_horizon = 10
prediction_update_rate = 0.5

# Development system (Phase 6: Developmental stages)
development_stage = "critical_period"
development_plasticity_rate = 0.8

# Attention system (Phase 6: Competitive attentional selection)
attentional_inhibition_strength = 0.5
attentional_excitation_strength = 1.5
attentional_salience_decay = 0.1

# Environment settings (Phase 3: World interaction)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings (Phase 5: Advanced logging system)
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_rotation_size = 10485760
log_retention_days = 7

# Simulation settings (Phase 6: Advanced simulation control)
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_checkpoints = true
checkpoint_interval = 1000
checkpoint_dir = ./checkpoints

# Visualization settings (Phase 6: Visualization capabilities)
visualization_enabled = false
visualization_update_rate = 30.0
visualization_backend = "opengl"

# Performance settings (Phase 5: Performance optimizations)
enable_simd = true
enable_parallel_processing = false
max_threads = 4
memory_pool_size = 1048576

