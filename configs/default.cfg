# NLM Configuration File
# This is the default configuration for Phase 1 skeleton
# Improved version with enhanced options and fixed duplicate entries

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
# Dopamine baseline level (0.0 = no baseline, higher = more baseline activity)
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_scale_factor = 1.0
reward_exploration_bonus = 0.5

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 16
vision_height = 16

# Agent settings
agent_start_x = 5.0
agent_start_y = 5.0
agent_max_energy = 100.0
agent_energy_decay_rate = 0.001

# Learning settings
learning_rate = 0.01
eligibility_trace_decay = 0.9
plasticity_modifier_high = 1.5
plasticity_modifier_low = 0.2

# Novelty and curiosity
detect_novelty_threshold = 0.05
curiosity_decay_rate = 0.95
novelty_decay_rate = 0.99

# Memory settings
working_memory_capacity = 100
working_memory_decay = 0.9
episodic_memory_capacity = 1000

# Performance settings
enable_multithreading = true
thread_count = 0  # auto-detect
enable_simd = true
enable_sparse_connectivity = true

# Checkpointing settings
checkpoint_enabled = true
checkpoint_interval = 1000
checkpoint_dir = ./checkpoints
checkpoint_max_files = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_to_console = true
console_log_level = INFO

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_width = 800
visualization_height = 600

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Advanced neural dynamics settings
# Reduce excessive firing rates
neuron_refractory_period = 0.002  # ms
neuron_reset_potential = -75.0  # mV
neuron_threshold = -50.0  # mV
neuron_resting_potential = -70.0  # mV
neuron_leak_conductance = 0.3

# Plasticity improvements
stdp_potentiation_threshold = 20.0  # ms
stdp_depression_threshold = 20.0   # ms
stdp_potentiation_strength = 0.01
stdp_depression_strength = 0.012

# Development stages
initial_plasticity_factor = 1.0
critical_period_plasticity = 0.8
maturation_plasticity = 0.5
adult_plasticity = 0.2
