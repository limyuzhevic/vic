# NLM Configuration File
# This is the default configuration for Phase 2 Advanced Neural Computation

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Advanced plasticity settings
advanced_plasticity_enabled = true
reward_modulated_stdp_enabled = true
homosynaptic_enabled = true
heterosynaptic_enabled = true
synaptic_tagging_enabled = true
metaplasticity_enabled = true
short_term_plasticity_enabled = true
neuromodulatory_integration_enabled = true

# Neuromodulation settings
 neuromodulator_dopamine_baseline = 0.1
 neuromodulator_dopamine_modulation_strength = 0.5
 neuromodulator_dopamine_decay_rate = 0.01
 neuromodulator_acetylcholine_baseline = 0.05
 neuromodulator_norepinephrine_baseline = 0.05
 neuromodulator_serotonin_baseline = 0.05

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_enabled = true

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Advanced neuron settings
advanced_neuron_types_enabled = true
bursty_neuron_enabled = true
adaptive_neuron_enabled = true
adaptive_if_neuron_enabled = true
hodgkin_huxley_neuron_enabled = true
resonant_neuron_enabled = true

# Neuron type distribution
internal_neuron_ratio = 0.5
excitatory_neuron_ratio = 0.3
inhibitory_neuron_ratio = 0.2

# Bursting neuron parameters
bursty_neuron_frequency = 10.0  # Hz
bursty_neuron_duration = 20.0   # ms
bursty_neuron_interburst_interval = 100.0  # ms

# Adaptive neuron parameters
adaptive_neuron_strength = 1.0
adaptive_neuron_time_constant = 100.0  # ms
adaptive_neuron_threshold = 0.5
adaptive_neuron_subthreshold = 0.1

# Integrate-and-fire with adaptation parameters
adaptive_if_adaptation_strength = 1.0
adaptive_if_adaptation_conductance = 0.1
adaptive_if_adaptation_tau = 100.0  # ms
adaptive_if_reference_potential = -60.0  # mV

# Hodgkin-Huxley model parameters
hh_max_sodium_conductance = 120.0  # mS/cm²
hh_max_potassium_conductance = 36.0  # mS/cm²
hh_leak_conductance = 0.3  # mS/cm²
hh_resting_potential = -70.0  # mV
hh_sodium_reversal = 50.0  # mV
hh_potassium_reversal = -77.0  # mV
hh_alpha_na_tau = 1.0
hh_beta_na_tau = 1.0
hh_alpha_k_tau = 1.0
hh_vhalf_na = -40.0
hh_vhalf_k = -60.0
hh_slope_na = 10.0
hh_slope_k = 10.0

# Resonant neuron parameters
resonant_neuron_frequency = 10.0  # Hz
resonant_neuron_q_factor = 0.5  # Quality factor (0-1)
resonant_neuron_membrane_tau = 20.0  # ms
resonant_neuron_coupling_strength = 0.5
resonant_neuron_external_input_phase = 0.0

# Synaptic tagging and capture parameters
synaptic_tag_persistence = 100.0  # ms
synaptic_capture_threshold = 0.5
synaptic_tag_decay_rate = 0.01
synaptic_capture_range = 2.0

# Metaplasticity parameters
synaptic_metaplasticity_threshold = 0.1
synaptic_metaplasticity_history_size = 100
synaptic_metaplastic_learning_rate = 0.001
synaptic_metaplastic_homeostasis_target = 0.0

# Short-term plasticity parameters
stp_depression_u = 0.5
stp_depression_tau = 100.0  # ms
stp_facilitation_u = 0.5
stp_facilitation_tau = 10.0  # ms
stp_use_dependent_modulation = true
stp_max_modulation = 1.0

# Neuromodulatory integration parameters
neuromodulator_integration_time_constant = 10.0
neuromodulator_baseline_plasticity = 0.5
neuromodulator_homeostatic_set_point = 0.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced configuration options for power users
# Neural network configuration
neuron_type = Advanced  # Options: Internal, Sensory, Motor, Associative, Advanced
connection_optimization = true
sparse_connectivity = false  # Enable sparse matrix operations
use_reduced_precision = false

# Plasticity configuration
plasticity_mode = Advanced  # Options: Standard, RewardModulated, Neuromodulated, Advanced
stdp_implementation = Full  # Options: Full, Simplified
hebbian_implementation = Full
plasticity_history_size = 100

# Memory configuration
memory_type = WorkingMemory  # Options: WorkingMemory, EpisodicMemory, AssociativeMemory
working_memory_size = 1000
episodic_memory_capacity = 1000
echo_state_enabled = false

# Performance settings
parallel_processing_enabled = false
thread_count = 4
memory_pool_enabled = true
event_queue_enabled = true
sparse_connectivity_enabled = false

