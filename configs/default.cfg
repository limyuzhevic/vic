# NLM Configuration File
# This is the default configuration for Phase 6 final integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# ---------- BRAIN PARAMETERS ----------
# Neuron parameters
brain_v_thresh = -50.0           # Threshold potential (mV)
brain_v_rest = -70.0            # Resting potential (mV)
brain_v_reset = -75.0           # Reset potential (mV)
brain_tau_mem = 20.0            # Membrane time constant (ms)
brain_tau_ref = 2.0             # Refractory period (ms)

# Network topology
brain_neuron_density = 0.05     # Connection density
brain_initial_weight_mean = 0.5 # Mean initial weight
brain_initial_weight_std = 0.1  # Weight standard deviation

# Sensory/motor neuron counts
brain_sensory_neuron_count = 20
brain_motor_neuron_count = 20

# ---------- PLASTICITY PARAMETERS ----------
# STDP parameters
plasticity_stdp_enable = true
plasticity_stdp_ltp_weight = 0.02
plasticity_stdp_ltd_weight = 0.015
plasticity_stdp_tau_plus = 20.0
plasticity_stdp_tau_minus = 20.0
plasticity_stdp_learning_rate = 0.001

# Hebbian learning
plasticity_hebbian_enable = true
plasticity_hebbian_learning_rate = 0.01
plasticity_hebbian_window_size = 100.0

# Structural plasticity
plasticity_structural_enable = true
plasticity_synaptogenesis_rate = 0.0001
plasticity_pruning_rate = 0.00001
plasticity_max_synapses_per_neuron = 50

# ---------- DEVELOPMENT PARAMETERS ----------
# Development settings
development_enable = true
development_critical_period_start = 100.0
development_critical_period_end = 1000.0
development_maturation_rate = 0.001
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005
development_plasticity_modulation = 0.8
development_neural_excitability_increase = 0.3

# ---------- NEUROMODULATION PARAMETERS ----------
# Dopamine system
neuromod_dopamine_baseline = 0.1
neuromod_dopamine_learning_rate = 0.01
neuromod_dopamine_influence_strength = 1.0

# Curiosity system
neuromod_curiosity_enable = true
neuromod_curiosity_baseline = 0.01
neuromod_curiosity_learning_rate = 0.005
neuromod_curiosity_exploration_bonus = 0.5

# Novelty detection
neuromod_novelty_enable = true
neuromod_novelty_sensitivity = 0.5
neuromod_novelty_decay_rate = 0.95

# Prediction error
neuromod_prediction_error_enable = true
neuromod_prediction_error_learning_rate = 0.02
neuromod_prediction_error_baseline = 0.0

# ---------- MEMORY SYSTEMS ----------
# Working memory
memory_working_memory_enable = true
memory_working_memory_capacity = 100
memory_working_memory_trace_decay_rate = 0.95
memory_working_memory_activation_threshold = 0.1

# Episodic memory
memory_episodic_memory_enable = true
memory_episodic_memory_storage_capacity = 1000
memory_episodic_memory_replay_interval = 100
memory_episodic_memory_consolidation_threshold = 0.8

# Semantic memory
memory_semantic_memory_enable = true
memory_semantic_memory_embedding_dim = 64
memory_semantic_memory_learning_rate = 0.001
memory_semantic_memory_similarity_threshold = 0.7

# Procedural memory
memory_procedural_memory_enable = true
memory_procedural_memory_skill_slot_count = 50
memory_procedural_memory_learning_rate = 0.01
memory_procedural_memory_retention_decay = 0.99

# Associative memory
memory_associative_memory_enable = true
memory_associative_memory_pattern_capacity = 200
memory_associative_memory_learning_rate = 0.005
memory_associative_memory_recall_threshold = 0.6

# ---------- PREDICTION SYSTEM ----------
# Neural prediction
prediction_neural_prediction_enable = true
prediction_neural_prediction_prediction_window = 50
prediction_neural_prediction_prediction_accuracy_threshold = 0.8
prediction_neural_prediction_prediction_error_decay = 0.9

# Temporal difference
prediction_temporal_difference_enable = true
prediction_temporal_difference_discount_factor = 0.99
prediction_temporal_difference_learning_rate = 0.01
prediction_temporal_difference_eligibility_trace_decay = 0.9

# Forward model
prediction_forward_model_enable = true
prediction_forward_model_motor_prediction_horizon = 10
prediction_forward_model_prediction_error_weight = 0.5

# ---------- COGNITION SYSTEMS ----------
# Neural planning
cognition_neural_planner_enable = true
cognition_neural_planner_planning_horizon = 20
cognition_neural_planner_action_evaluation_window = 100
cognition_neural_planner_exploration_bonus = 0.1

# Concept formation
cognition_concept_formation_enable = true
cognition_concept_formation_concept_learning_rate = 0.01
cognition_concept_formation_concept_similarity_threshold = 0.7
cognition_concept_formation_concept_memory_capacity = 200

# Attention
cognition_attention_enable = true
cognition_attention_focus_strength = 0.8
cognition_attention_competition_strength = 1.0
cognition_attention_attention_span = 50

# ---------- ENVIRONMENT ----------
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Vision parameters
environment_vision_width = 8
environment_vision_height = 8
environment_vision_field_of_view = 90.0
environment_vision_detection_range = 5.0

# Agent properties
environment_agent_max_energy = 100.0
environment_agent_energy_decay_rate = 0.01
environment_agent_starting_position_x = 10.0
environment_agent_starting_position_y = 10.0

# Objects
environment_resource_value = 1.0
environment_hazard_damage = 10.0

# ---------- SIMULATION SETTINGS ----------
simulation_max_steps = 10000
simulation_time_limit = 0.0
simulation_checkpoint_interval = 1000
simulation_enable_replay = true
simulation_replay_consolidation = true

# Performance
simulation_enable_parallel_processing = true
simulation_simd_optimization = true
simulation_event_driven_simulation = true

# ---------- LOGGING ----------
logging_level = INFO
logging_to_file = false
logging_filename = nlm.log
logging_max_file_size = 10485760  # 10MB
logging_flush_interval = 1.0

# ---------- VISUALIZATION ----------
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1920
visualization_window_height = 1080

# Display options
visualization_show_neurons = true
visualization_show_synapses = true
visualization_show_brain_regions = true
visualization_show_memory_traces = true
visualization_show_predictions = true
visualization_show_neuromodulation = true
visualization_show_development = true
