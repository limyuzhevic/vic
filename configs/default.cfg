# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_peak = 1.0
dopamine_decay_rate = 0.1
dopamine_release_rate = 1.0

# Curiosity settings
curiosity_baseline = 0.2
curiosity_max = 1.0
curiosity_decay = 0.05
curiosity_increase_rate = 0.02

# Novelty settings
novelty_sensitivity = 0.3
novelty_threshold = 0.5
novelty_decay = 0.1

# Prediction settings
prediction_horizon = 5
prediction_uncertainty = 0.3
prediction_learning_rate = 0.01

# Working memory settings
working_memory_capacity = 100
working_memory_decay_rate = 0.01

# Episodic memory settings
episodic_memory_max_episodes = 1000
episodic_memory_replay_interval = 100
episodic_memory_consolidation_interval = 1000

# Attentional selection settings
attentional_inhibition_strength = 0.5
attentional_excitation_strength = 1.5
attentional_competition_threshold = 0.8

# Concept formation settings
concept_formation_threshold = 0.75
concept_stability_threshold = 0.7
concept_stability_window = 5

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Checkpointing settings
checkpoint_enabled = true
checkpoint_path = ./checkpoints
checkpoint_max_checkpoints = 10
checkpoint_compression = balanced

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
