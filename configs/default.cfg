# NLM Configuration File
# Default configuration for Neural Learning Machine
# 
# This file contains settings for the NLM brain simulation
# Edit values to change brain behavior, performance, and experiment characteristics

# Basic Brain Configuration
neuron_count = 500                    # Number of neurons in the network (positive integer)
region_count = 1                      # Number of neural regions (1-10)
connection_probability = 0.15          # Probability of synaptic connections (0.0-1.0)

# Random Seed
random_seed = 42                      # Random seed for reproducible simulations (non-negative integer)
simulation_timestep = 0.001            # Simulation timestep in seconds (0.001-0.1)

# Plasticity and Learning
stdp_ltp_weight = 0.02                 # STDP Long-Term Potentiation weight
stdp_ltd_weight = 0.015                # STDP Long-Term Depression weight
stdp_tau = 20.0                        # STDP time constant (steps)

# Structural Plasticity
synaptogenesis_rate = 0.0001           # Rate of new synapse formation (very small positive)
pruning_rate = 0.00001                 # Rate of synapse elimination (very small positive)

# Development
enable_development = false             # Enable developmental plasticity
developmental_plasticity_rate = 0.001 # Rate of plasticity changes over time
development_stage_duration = 1000.0    # Duration of each developmental stage (steps)

# Neuromodulation
enable_reward_modulation = true        # Enable reward-based learning
dopamine_strength = 0.5                # Dopamine influence strength (0.0-1.0)
curiosity_strength = 0.3               # Curiosity-driven exploration strength (0.0-1.0)
novelty_threshold = 0.7                # Novelty detection threshold (0.0-1.0)

# Memory Systems
enable_working_memory = true           # Enable working memory system
working_memory_capacity = 100.0         # Working memory capacity (traces)
working_memory_decay_rate = 0.01        # Working memory trace decay rate

enable_episodic_memory = true          # Enable episodic memory system
episodic_memory_capacity = 1000         # Maximum number of episodes
replay_frequency = 100.0                # Replay frequency (steps)

# Cognitive Systems
enable_planning = true                 # Enable neural planning
planning_depth = 3                     # Planning horizon depth
attention_span = 50.0                  # Attention span (steps)

# Logging and Output
log_level = INFO                       # Log level: DEBUG, INFO, WARN, ERROR
log_file = nlm_simulation.log           # Log file path
verbose_logging = true                  # Enable verbose logging

# Performance
enable_performance_monitoring = true   # Enable performance monitoring
memory_limit_mb = 512.0                # Memory limit in MB
thread_count = 4                       # Number of threads for parallel processing

# Checkpointing and Persistence
enable_checkpoint = false              # Enable checkpoint save/load
checkpoint_path = /tmp/nlm_checkpoint.bin # Checkpoint file path
checkpoint_interval = 1000.0            # Checkpoint save interval (steps)

# Experiment Settings
experiment_type = default              # Experiment type: default, research, performance
experiment_steps = 1000.0               # Number of simulation steps for experiment
reward_function = standard              # Reward function: standard, custom, none

# Debugging and Analysis
debug_mode = false                      # Enable debug mode
debug_neuron_id = -1                  # Specific neuron for debugging (-1 = all)
enable_trace_logging = false            # Enable detailed trace logging

# Visualization (if available)
enable_visualization = false            # Enable visualization output
visualisation_output = visualization.png # Output file for visualization

# Advanced Settings
enable_vectorization = true             # Enable SIMD vectorization
enable_optimizations = true            # Enable compiler optimizations
enable_profiling = false                # Enable performance profiling