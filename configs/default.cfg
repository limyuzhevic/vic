# NLM Configuration File
# This is the default configuration for Phase 1 skeleton

# Random seed for reproducible experiments
random_seed = 42  # Seed for random number generator

# Simulation timestep in seconds
simulation_timestep = 0.001  # Time step duration for simulation

# Number of neurons in the brain
neuron_count = 1000  # Total number of neurons in the simulation

# Number of brain regions
region_count = 2  # Number of neural regions (areas) in the brain

# Connection probability for random connectivity
connection_probability = 0.1  # Probability of synapse formation between neurons

# Plasticity settings
plasticity_learning_rate = 0.01  # Overall learning rate for plasticity mechanisms
stdp_ltp_weight = 0.01  # STDP LTP weight factor for synaptic strengthening
stdp_ltd_weight = 0.012  # STDP LTD weight factor for synaptic weakening
stdp_time_constant = 20.0  # STDP time constant (ms) for spike timing window

# Development settings
development_synaptogenesis_rate = 0.001  # Rate of new synapse formation during development
development_pruning_rate = 0.0001  # Rate of synapse elimination during development

# Neuromodulation settings
dopamine_baseline = 0.1  # Default baseline dopamine level for reward modulation (range: 0.0-1.0)

# Reward settings
reward_discount_factor = 0.99  # Discount factor for future rewards in reinforcement learning

# Environment settings
environment_name = GridWorld  # Name of the simulated environment
environment_width = 10  # Width of the simulation environment in meters
environment_height = 10  # Height of the simulation environment in meters

# Logging settings
log_level = INFO  # Minimum log level to display (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_to_file = false  # Whether to log messages to file in addition to console
log_filename = nlm.log  # Filename for log file output

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
