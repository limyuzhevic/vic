# NLM Configuration Files
# Various configuration templates for different experiment types

# ==============================================
# DEFAULT CONFIGURATION
# ==============================================
# For basic NLM Phase 6 testing and integration verification

# Core simulation parameters
neuron_count = 500
max_steps = 2000
region_count = 1
connection_probability = 0.1

# Plasticity rules
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory systems
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 50
max_episodes = 1000

# Development
enable_development = true
development_rate = 1.0

# Checkpointing
enable_checkpointing = true
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000
max_checkpoints = 10
compress_checkpoints = true

# Neuromodulation
enable_curiosity = true
enable_novelty = true
enable_dopamine = true

# Logging
log_level = INFO
enable_colors = true
log_to_file = true
log_file = ./nlm.log

