# NLM Configuration File
# This is the default configuration for Phase 6: Final Integration

# === CORE BRAIN CONFIGURATION ===
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (Phase 6 scale)
brain.neuron_count = 2000

# Number of brain regions (integrated with memory systems)
brain.region_count = 4

# Connection probability for random connectivity (Phase 6 optimized)
brain.connection_probability = 0.08

# === PLASTICITY SYSTEMS ===
# STDP (Spike-Timing Dependent Plasticity) parameters
brain.stdp_ltp_weight = 0.015
brain.stdp_ltd_weight = 0.012
brain.stdp_time_constant = 25.0

# Hebbian plasticity parameters
brain.hebbian_learning_rate = 0.02

# Structural plasticity parameters
brain.synaptogenesis_rate = 0.0002
brain.pruning_rate = 0.00015

# === DEVELOPMENTAL SYSTEM ===
# Developmental stage affecting plasticity
brain.development.initial_plasticity = 1.0
brain.development.critical_period_end = 500
brain.development.maturation_rate = 0.001

# === MEMORY SYSTEMS CONFIGURATION ===
# Working memory - short-term active information
memory.working_memory_capacity = 200
memory.working_memory_decay_rate = 0.95

# Episodic memory - experience storage and replay
memory.episodic_max_episodes = 5000
memory.episodic_replay_frequency = 0.1
memory.episodic_compression_enabled = true

# Associative memory - pattern associations
memory.associative_learning_rate = 0.01
memory.associative_threshold = 0.7

# === NEUROMODULATION SYSTEMS ===
# Dopamine - reward and reinforcement signaling
neuromod.dopamine.scale = 1.0
neuromod.dopamine.baseline = 0.05
neuromod.dopamine.learning_rate = 0.01

# Curiosity - exploration motivation
neuromod.curiosity.enable = true
neuromod.curiosity.scale = 1.0
neuromod.curiosity.min_level = 0.01
neuromod.curiosity.max_level = 1.0

# Novelty detection
neuromod.novelty.enable = true
neuromod.novelty.sensitivity = 0.8

# Prediction error signals
neuromod.prediction.error_scale = 1.0
neuromod.prediction.error_decay = 0.99

# === PREDICTION SYSTEM ===
prediction_system.enabled = true
prediction_system.horizon_steps = 20
prediction_system.prediction_accuracy = 0.8

# === COGNITION SYSTEMS ===
# Neural planning
planning.enabled = true
planning.planning_horizon = 30
planning.exploration_weight = 0.3

# Concept formation
concept_formation.enabled = true
concept_formation.concept_threshold = 0.6
concept_formation.association_strength = 0.5

# Attentional selection
attention.enabled = true
attention.attention_span = 50
attention.selection_strength = 0.8

# === ENVIRONMENT AND WORLD ===
# Simple world configuration
environment.name = "Phase6World"
environment.width = 20
environment.height = 20
environment.cell_size = 1.0

# Vision parameters
environment.vision.width = 8
environment.vision.height = 8
environment.vision.channels = 3

# === REWARD AND MOTIVATION ===
reward.discount_factor = 0.95
reward.sparsity = 0.1
reward.learning_rate = 0.01

# === SIMULATION CONTROL ===
# Maximum simulation steps
simulation.max_steps = 50000
simulation.time_limit = 0.0  # Unlimited for continuous learning

# === LOGGING AND MONITORING ===
# Logging configuration
log.level = "INFO"
log.to_file = false
log.filename = "nlm_simulation.log"
log.console_output = true
log.timestamp = true

# Performance monitoring
simulation.enable_metrics = true
simulation.metrics_interval = 100

# === VISUALIZATION AND DEBUGGING ===
# Visualization settings
visualization.enabled = false
visualization.update_rate = 30.0
visualization.output_format = "OFF"

# === CHECKPOINTING AND PERSISTENCE ===
checkpointing.enabled = true
checkpointing.save_interval = 1000
checkpointing.load_checkpoint = ""
checkpointing.auto_save = true

# === ADVANCED RESEARCH FEATURES ===
# Enable research-mode features for experimentation
research_mode.enable = false
research_mode.debug_mode = false
research_mode.performance_profiling = true
research_mode.memory_profiling = true

# === PHASE 6 INTEGRATION VERIFICATION ===
# Flags to verify all Phase 6 systems are connected
phase6_verification.memories_connected = true
phase6_verification.neuromodulators_connected = true
phase6_verification.prediction_connected = true
phase6_verification.cognition_connected = true
phase6_verification.development_connected = true
phase6_verification.replay_system_enabled = true
