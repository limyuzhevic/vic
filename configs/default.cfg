# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001f
development_maturation_rate = 0.00005f

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.95
reward_learning_rate = 0.01

# Environment settings
environment_name = SimpleWorld
environment_width = 16
environment_height = 16

# Logging settings
log_level = INFO
log_to_file = true
log_filename = nlm_phase6.log
log_max_size = 10485760
log_rotation_count = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_replay = true
replay_strength = 0.5
enable_development = true
development_decay_rate = 0.95

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1024
visualization_window_height = 768

# Performance settings
enable_event_driven = true
neuron_pool_size = 5000
synapse_pool_size = 20000
enable_threading = false
max_threads = 4

# Phase 6 specific settings
enable_memory_systems = true
enable_neuromodulation = true
enable_prediction = true
enable_cognition = true
enable_checkpoints = true
enable_replay_system = true
enable_development_stages = true
enable_structural_plasticity = true
enable_sensory_integration = true
enable_motor_output = true
enable_reward_processing = true

# Memory system settings
memory_working_memory_capacity = 100
memory_episodic_memory_capacity = 1000
memory_semantic_memory_capacity = 5000
memory_procedural_memory_capacity = 5000
memory_associative_memory_strength = 0.8

# Neuromodulation settings
dopamine_learning_rate = 0.01
curiosity_decay_rate = 0.95
novelty_threshold = 0.5

# Prediction system settings
prediction_time_horizon = 10
prediction_error_weight = 0.1
prediction_confidence_threshold = 0.7

# Cognition system settings
planning_horizon = 5
attention_focus_time = 0.1
concept_formation_threshold = 0.8

# Development system settings
development_plasticity_decay = 0.9
maturation_stage_duration = 100
structural_plasticity_rate = 0.001
