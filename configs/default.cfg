# NLM Configuration File
# This is the advanced default configuration for Phase 6 (Final Integration)

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
stdp_tau_plus = 20.0
stdp_tau_minus = 20.0
stdp_decay_rate = 0.99

# Development settings
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
development_critical_period_strength = 2.0
development_maturation_rate = 0.05

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_scale = 1.0
dopamine_decay_rate = 0.95

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_enabled = true

# Novelty and curiosity settings
curiosity_enabled = true
novelty_detection_enabled = true
exploration_rate = 0.3

# Memory system settings
working_memory_capacity = 100
episodic_memory_capacity = 1000
semantic_memory_enabled = true
procedural_memory_enabled = true
associative_memory_enabled = true

# Prediction system settings
prediction_enabled = true
prediction_window_size = 10
prediction_error_threshold = 0.1

# Cognition system settings
planning_enabled = true
concept_formation_enabled = true
attention_enabled = true
self_model_enabled = true

# Developmental stages
stage_critical_period_start = 100
stage_critical_period_end = 500
stage_maturation_start = 500
stage_maturation_end = 1000

# Environment settings
environment_name = SimpleWorld
environment_width = 20
environment_height = 20
vision_width = 8
vision_height = 8
vision_channels = 3

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_to_console = true
console_log_level = INFO
max_log_file_size = 10485760  # 10MB

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
timeout_behavior = "halt"
checkpoint_save_interval = 100
checkpoint_load_timeout = 30.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1920
visualization_window_height = 1080
visualization_backend = "auto"

# Performance settings
enable_parallel_processing = true
max_concurrent_threads = 4
memory_pool_enabled = true
event_queue_size = 10000

# Advanced features
enable_advanced_planning = true
enable_social_learning = false
enable_spatial_representation = true
enable_continuous_learning = true

# Security and safety
disallow_external_actions = false
safe_shutdown_timeout = 10.0
max_energy_threshold = 1000.0
health_degradation_rate = 0.001
