# NLM Configuration File
# This is the default configuration for Phase 6 Final Integration
# Generated with improved configuration system

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Brain configuration
brain.neuron_count = 1000
brain.synapse_density = 0.1
brain.connection_probability = 0.05
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# Plasticity settings
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation settings
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true

# Development settings
development.synaptogenesis_rate = 0.001
development.pruning_rate = 0.0001
development.maturation_rate = 0.05

# Reward settings
reward.discount_factor = 0.99

# Environment settings
environment.name = GridWorld
environment.width = 20
environment.height = 20
environment.vision_width = 8
environment.vision_height = 8

# Logging settings
log.level = INFO
log.to_file = false
log.filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
replay_interval = 100
consolidation_interval = 1000

# Visualization settings
visualization.enabled = false
visualization.update_rate = 30.0

# Agent settings
agent.reward_scale = 1.0
agent.curiosity_weight = 0.5
agent.novelty_weight = 0.5

# Memory settings
memory.episode_capacity = 1000
memory.consolidation_threshold = 0.8

# Development stages
brain.developmental_stage.initial_plasticity = 1.0
brain.developmental_stage.critical_period_plasticity = 2.0
brain.developmental_stage.adult_plasticity = 0.1
