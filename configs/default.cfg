# Default NLM Configuration
# This file provides sensible defaults for NLM simulation

# Brain configuration
neuron_count = 1000
region_count = 1
connection_probability = 0.1f
simulation_timestep = 0.001
random_seed = 42

# Plasticity mechanisms
stdp_ltp_weight = 0.01f
stdp_ltd_weight = 0.012f
stdp_tau = 20.0f

# Structural plasticity
synaptogenesis_rate = 0.0001f
pruning_rate = 0.00001f

# Development system
development_enabled = true
development_stage = CriticalPeriod

# Neuromodulation
novelty_enabled = true
curiosity_enabled = true
reward_modulation_enabled = true

# Memory systems
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
associative_memory_capacity = 500

# Simulation parameters
max_steps = 1000
replay_interval = 100
consolidation_interval = 1000

# Checkpointing
checkpoint_dir = ./checkpoints
checkpoint_compression = Balanced
checkpoint_frequency = 100

# Logging
log_level = Info
log_file = nlm.log
console_output = true
file_output = false

# World simulation
world_width = 20
world_height = 20
agent_vision_width = 8
agent_vision_height = 8
