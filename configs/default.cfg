# NLM Configuration File
# Enhanced default configuration for Phase 6 integrated brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0

# Advanced Configuration Options
# Synaptic weight limits
synaptic_weight_max = 1.0
synaptic_weight_min = 0.0

# Neural connectivity patterns
neural_connectivity_pattern = "random"

# Reward prediction error settings
reward_prediction_error_gamma = 0.95
reward_prediction_error_lambda = 0.9

# Neuromodulation strength
neuromodulation_strength = 1.0

# Learning algorithm parameters
learning_algorithm = "stdp"
learning_rate = 0.01
learning_momentum = 0.9

# Development parameters
development_stage_transition_age = 1000.0
development_plasticity_decay_rate = 0.99

# Memory systems parameters
working_memory_capacity = 100.0
episodic_memory_max_episodes = 1000
episodic_memory_memory_strength = 0.5

# Prediction system parameters
prediction_window_size = 10
prediction_confidence_threshold = 0.7

# Cognitive system parameters
concept_formation_threshold = 0.8
self_model_confidence_decay = 0.95
social_learning_weight = 0.5

# Simulation optimization parameters
max_pending_spikes = 10000
event_queue_size = 1000
memory_pool_size = 10000

# Checkpoint and persistence
checkpoint_format_version = 1
checkpoint_compression = true
checkpoint_save_interval = 1000

# Advanced neuromodulation parameters
dopamine_sensitivity = 1.0
curiosity_decay_rate = 0.98
novelty_threshold = 0.1

# Environment interaction parameters
touch_sensitivity = 1.0
vision_range = 5.0
vision_resolution = 16
motor_action_smoothness = 0.9

# Experimental parameters
experiment_seed = 42
experiment_max_trials = 100
experiment_reward_function = "exponential"