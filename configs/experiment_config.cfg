# NLM Experiment Configuration
# This is an experiment configuration for NLM

# Core configuration
neuron_count = 1000
region_count = 2
connection_probability = 0.15
simulation_timestep = 0.001

# Plasticity configuration
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Memory configuration
working_memory_capacity = 100
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 1000

# Environment configuration
environment_name = GridWorld
environment_width = 10
environment_height = 10
reward_discount_factor = 0.99

# Performance configuration
max_simulation_steps = 10000
checkpoint_enabled = true
checkpoint_interval = 1000

# Experiment configuration
experiment_name = "NeuralNetworkExperiment"
experiment_type = "basic"
experiment_description = "Basic neural network experiment"

# Data collection
collect_neural_activity = true
collect_spike_count = true
collect_memory_content = true
collect_plasticity_weights = true

# Logging
log_level = INFO
log_to_file = true
log_filename = experiment.log