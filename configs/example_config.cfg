# Simple Neural Network Configuration
# Example configuration for NLM Phase 6

# Basic simulation parameters
neuron_count = 1000
region_count = 2
simulation_timestep = 0.001
connection_probability = 0.1
random_seed = 42

# Plasticity rules (STDP and Hebbian)
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
plasticity_learning_rate = 0.01

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_enabled = true

# Neuromodulation systems
dopamine_baseline = 0.1
curiosity_enabled = true
novelty_detection_enabled = true
reward_discount_factor = 0.99

# Memory systems
working_memory_capacity = 100
episodic_memory_max_episodes = 500
memory_replay_enabled = true

# Prediction system
prediction_horizon = 10
prediction_error_weight = 0.5

# Cognitive mechanisms
planner_planning_depth = 5
concept_formation_enabled = true
attention_inhibition_strength = 0.5

# Environment parameters
environment_width = 20
environment_height = 20
vision_width = 16
vision_height = 16
action_interval = 0.1

# Performance settings
checkpoint_interval = 10000
enable_visualization = false
max_simulation_steps = 10000

# Debug and logging
log_level = INFO
log_to_file = false
log_filename = nlm.log