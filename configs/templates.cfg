# MINIMAL CONFIGURATION
# ===========================================

[minimal]
# Minimal configuration for testing and validation
random_seed = 1
simulation_timestep = 0.001
neuron_count = 10
region_count = 1
connection_probability = 0.5
plasticity_learning_rate = 0.0
stdp_ltp_weight = 0.0
stdp_ltd_weight = 0.0
stdp_time_constant = 1.0
development_synaptogenesis_rate = 0.0
development_pruning_rate = 0.0
dopamine_baseline = 0.0
environment_name = EmptyWorld
environment_width = 1
environment_height = 1
log_level = ERROR
log_to_file = false
max_simulation_steps = 100

