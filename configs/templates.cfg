# NLM Configuration Templates

# This file contains configuration templates for different NLM (熙然) use cases

# ===========================================
# DEFAULT CONFIGURATION
# ===========================================

[default]
# Basic neural simulation configuration
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.1
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
dopamine_baseline = 0.1
reward_discount_factor = 0.99
environment_name = GridWorld
environment_width = 10
environment_height = 10
log_level = INFO
log_to_file = false
log_filename = nlm.log
max_simulation_steps = 10000
simulation_time_limit = 0.0
visualization_enabled = false
visualization_update_rate = 30.0

# ===========================================
# RESEARCH CONFIGURATION
# ===========================================

[research]
# Configuration optimized for research and experimentation
random_seed = 123
simulation_timestep = 0.0005
neuron_count = 5000
region_count = 5
connection_probability = 0.15
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.01
stdp_time_constant = 25.0
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005
dopamine_baseline = 0.05
curiosity_enabled = true
novelty_enabled = true
prediction_enabled = true
environment_name = ComplexWorld
environment_width = 20
environment_height = 20
log_level = DEBUG
log_to_file = true
log_filename = nlm_research.log
max_simulation_steps = 50000
simulation_time_limit = 0.0
visualization_enabled = true
visualization_update_rate = 60.0
enable_structural_plasticity = true
enable_development = true
enable_reward_modulation = true
enable_curiosity = true

# ===========================================
# PRODUCTION CONFIGURATION
# ===========================================

[production]
# Configuration optimized for production use and real-time simulation
random_seed = 42
simulation_timestep = 0.01
neuron_count = 2000
region_count = 3
connection_probability = 0.08
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.025
stdp_ltd_weight = 0.015
stdp_time_constant = 30.0
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001
dopamine_baseline = 0.0
curiosity_enabled = false
novelty_enabled = false
prediction_enabled = false
environment_name = GridWorld
environment_width = 15
environment_height = 15
log_level = WARNING
log_to_file = true
log_filename = nlm_production.log
max_simulation_steps = 100000
simulation_time_limit = 3600.0  # 1 hour timeout
visualization_enabled = false
visualization_update_rate = 10.0
enable_structural_plasticity = true
enable_development = false
enable_reward_modulation = true
enable_curiosity = false
checkpoint_interval = 1000
checkpoint_file = brain_checkpoint.bin

# ===========================================
# DEBUG CONFIGURATION
# ===========================================

[debug]
# Configuration optimized for debugging and development
random_seed = 999
simulation_timestep = 0.1
neuron_count = 100
region_count = 1
connection_probability = 0.2
plasticity_learning_rate = 0.1
stdp_ltp_weight = 0.05
stdp_ltd_weight = 0.06
stdp_time_constant = 10.0
development_synaptogenesis_rate = 0.01
development_pruning_rate = 0.001
dopamine_baseline = 0.0
curiosity_enabled = true
novelty_enabled = true
prediction_enabled = true
environment_name = SimpleWorld
environment_width = 5
environment_height = 5
log_level = TRACE
log_to_file = false
log_filename = nlm_debug.log
max_simulation_steps = 1000
simulation_time_limit = 0.0
visualization_enabled = true
visualization_update_rate = 30.0
enable_structural_plasticity = true
enable_development = true
enable_reward_modulation = true
enable_curiosity = true
enable_memory_tracking = true
enable_performance_profiling = true
print_step_details = true
log_all_spikes = true

