// Validation configuration file format
// This file contains validation rules and configuration options
// Can be in JSON, YAML, or key=value format

# Validation configuration options
[validation_options]
enable_cross_parameter_validation = true
enable_conditional_validation = true
enable_range_validation = true
enable_dependency_validation = true
enable_conflict_detection = true
max_memory_usage = 100.0
max_validation_time = 10
report_all_warnings = false
validate_on_load = true
validate_on_set = true
validate_on_change = true

# Default validation rules
[validation_rules]

# Neuron count validation
[validation_rules.NEURON_COUNT_001]
id = "NEURON_COUNT_001"
name = "Neuron Count Validation"
description = "Validates that neuron count is within reasonable limits"
level = "Warning"
priority = 100
validator_type = "range"
condition = "neuron_count > 1000000"
message = "Neuron count exceeds maximum limit of 1,000,000"
action = "Error"

# Memory constraint validation
[validation_rules.MEMORY_002]
id = "MEMORY_002"
name = "Memory Constraint Validation"
description = "Validates memory constraints and available resources"
level = "Warning"
priority = 90
validator_type = "cross_parameter"
condition = "estimated_memory > 100.0"
message = "Estimated memory usage exceeds 100 MB limit"
action = "Error"

# Plasticity parameter validation
[validation_rules.PLASTICITY_003]
id = "PLASTICITY_003"
name = "Plasticity Parameter Validation"
description = "Validates plasticity parameters and their combinations"
level = "Warning"
priority = 80
validator_type = "conditional"
condition = "enable_plasticity == true"
message = "Plasticity is enabled but no plasticity rules are configured"
action = "Error"

# Configuration conflict detection
[validation_rules.CONFLICT_004]
id = "CONFLICT_004"
name = "Configuration Conflict Detection"
description = "Detects incompatible configuration combinations"
level = "Error"
priority = 70
validator_type = "cross_parameter"
condition = "fast_mode == true AND high_precision == true"
message = "'Fast mode' and 'High precision' are incompatible configurations"
action = "Error"

# Dynamic range validation
[validation_rules.RANGE_005]
id = "RANGE_005"
name = "Dynamic Range Validation"
description = "Validates dynamic ranges based on other parameters"
level = "Warning"
priority = 60
validator_type = "range"
condition = "connection_probability > 0.5 AND neuron_count > 100000"
message = "High connection probability with large neuron count may cause excessive connections"
action = "Warning"

# Parameter consistency validation
[validation_rules.CONSISTENCY_006]
id = "CONSISTENCY_006"
name = "Parameter Consistency Validation"
description = "Validates consistency between related parameters"
level = "Warning"
priority = 50
validator_type = "cross_parameter"
condition = "enable_plasticity == true AND connection_probability == 0.0"
message = "Plasticity enabled but no connectivity configured"
action = "Warning"

# Resource constraint validation
[validation_rules.RESOURCE_007]
id = "RESOURCE_007"
name = "Resource Constraint Validation"
description = "Validates resource usage constraints"
level = "Error"
priority = 40
validator_type = "cross_parameter"
condition = "total_resource > 1000000"
message = "Total estimated resource usage exceeds system limits"
action = "Error"

# Integration validation
[validation_rules.INTEGRATION_008]
id = "INTEGRATION_008"
name = "Integration Validation"
description = "Validates integration with other systems"
level = "Warning"
priority = 30
validator_type = "cross_parameter"
condition = "all_systems_enabled AND !has_integration_config"
message = "Multiple systems enabled but integration configuration is minimal"
action = "Warning"

# Performance validation
[validation_rules.PERFORMANCE_009]
id = "PERFORMANCE_009"
name = "Performance Validation"
description = "Validates performance-related parameters"
level = "Warning"
priority = 20
validator_type = "range"
condition = "simulation_timestep < 0.0001"
message = "Very small timestep may cause performance issues"
action = "Warning"

# Command-line validation options
[command_line_options]
--validate-only             Enable validation-only mode (don't load config)
--validate-file FILE         Specify validation rules file
--skip-validation           Skip validation (use defaults)
--validation-level LEVEL    Set validation level (Info, Warning, Error, Critical)
--validation-report FILE     Save validation report to file
--validation-stats           Print validation statistics

# Runtime validation controls
[runtime_controls]
--enable-validation          Enable runtime validation
--disable-validation         Disable runtime validation
--validation-timeout SECONDS Set validation timeout
--memory-limit MB           Set memory limit for validation

# Validation result export formats
[export_formats]
json = "Export validation results as JSON"
yaml = "Export validation results as YAML"
text = "Export validation results as plain text"
csv = "Export validation results as CSV"
