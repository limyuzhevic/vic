# AgentBrain Configuration File
# ============================
# Configuration for enhanced AgentBrain with custom parameters
# This file provides fine-grained control over agent behavior

# Motor neuron distribution (how many neurons in each action group)
motorForwardCount = 100
motorBackwardCount = 100
motorTurnLeftCount = 50
motorTurnRightCount = 50
motorInteractCount = 50
motorWaitCount = 100

# Sensory neuron distribution
sensoryVisionCount = 200
sensoryTouchCount = 80
sensoryInternalCount = 40
sensoryProprioceptionCount = 60

# Curiosity and exploration behavior
curiosityThreshold = 0.3
explorationThreshold = 0.5
maxExplorationChance = 0.3
noveltyDecayFactor = 0.99
plasticityModifierBase = 1.0

# Development stages (in simulation seconds)
developmentStage1Duration = 60.0    # Initial phase - high plasticity
developmentStage2Duration = 240.0   # Critical period - moderate plasticity
developmentStage3Duration = 600.0   # Maturation phase - decreasing plasticity

# Reward modulation parameters
rewardPredictionDecay = 0.95
rewardMinChange = 0.001
dopamineMinClamp = -1.0
dopamineMaxClamp = 1.0

# Error handling behavior
logErrors = true
continueOnError = false
validateInputRanges = true

# Performance optimization
enablePerformanceOptimizations = true
maxSensoryNeurons = 256
maxMotorNeurons = 64

# Custom action configurations (for advanced users)
# Define custom motor actions (uncomment and modify as needed)
# motorAction_moveForward = "forward_speed"
# motorAction_turnLeft = "left_speed"
# motorAction_interact = "interact"

# Custom sensory processing
# sensoryAction_vision = "vision_processing"
