# NLM Agent Brain Configuration

This file contains configuration options for the enhanced Agent Brain.

## Agent Brain Configuration Options

### Learning Configuration
- `agent_learning_enabled` (bool): Enable/disable agent learning capability. Default: true
- `agent_learning_rate` (float): Learning rate for agent adaptation. Range: [0.0, 1.0]. Default: 0.01
- `agent_exploration_rate` (float): Rate of exploration vs exploitation. Range: [0.0, 1.0]. Default: 0.1

### Performance Monitoring
- `agent_performance_monitoring` (bool): Enable performance monitoring. Default: false
- `agent_performance_threshold` (float): Performance threshold for alerts. Range: [0.0, 1.0]. Default: 0.5
- `agent_max_memory_size` (size_t): Maximum memory allocation for agent state. Default: 1000000

### Curiosity and Adaptation
- `agent_curiosity_threshold` (float): Threshold for curiosity-based exploration. Range: [0.0, 1.0]. Default: 0.5
- `agent_adaptation_speed` (float): Speed of adaptation to new stimuli. Range: [0.0, 1.0]. Default: 0.01

### Development and Plasticity
- `agent_enable_development` (bool): Enable developmental stages. Default: true
- `agent_enable_structural_plasticity` (bool): Enable structural changes. Default: true
- `agent_enable_reward_modulation` (bool): Enable reward-based learning. Default: true
- `agent_enable_curiosity` (bool): Enable curiosity-driven exploration. Default: true

## Example Configuration

```ini
[agent_brain]
agent_learning_enabled = true
agent_learning_rate = 0.05
agent_exploration_rate = 0.15
agent_performance_monitoring = true
agent_performance_threshold = 0.6
agent_curiosity_threshold = 0.3
agent_adaptation_speed = 0.02
agent_max_memory_size = 2000000
agent_enable_development = true
agent_enable_structural_plasticity = true
agent_enable_reward_modulation = true
agent_enable_curiosity = true
```