# NLM Configuration Preset - Balanced
# Balanced settings for general research and development

random_seed = 789
simulation_timestep = 0.001
neuron_count = 1000
region_count = 1
connection_probability = 0.1
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Moderate developmental plasticity
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Standard neuromodulation
 dopamine_baseline = 0.0
reward_discount_factor = 0.99

# Standard environment
environment_name = GridWorld
environment_width = 15
environment_height = 15

# Reasonable simulation settings
max_simulation_steps = 30000
simulation_time_limit = 0.0

# Standard logging
log_level = INFO
log_to_file = true
log_filename = nlm_balanced.log

# Optional visualization for balanced analysis
visualization_enabled = false
visualization_update_rate = 30.0