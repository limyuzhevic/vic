# NLM Configuration File
# Attention preset - Attention and focus simulation with competitive dynamics

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1200

# Number of brain regions
region_count = 3

# Connection probability for random connectivity
connection_probability = 0.11

# Plasticity settings
plasticity_learning_rate = 0.015
plasticity_stdp_enable = true
plasticity_hebbian_enable = true

# Attention settings
attention_focus_strength = 0.7
attention_spread_strength = 0.3
attention_boost_factor = 1.5
attention_decay_rate = 0.05

# Neuromodulation settings
neuromodulation_attention_enable = true

# Maximum simulation steps
max_simulation_steps = 6000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_attention.log

# Enable attention simulation
attention_simulation_enabled = true
