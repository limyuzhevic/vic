# NLM Configuration Template
# Low Power/Lightweight Configuration
# Optimized for minimal resource usage

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (larger = less precise but faster)
simulation_timestep = 0.002

# Number of neurons in the brain (minimal)
neuron_count = 300

# Number of brain regions
region_count = 1

# Connection probability for random connectivity (lower = fewer connections)
connection_probability = 0.05

# Plasticity settings (lower rates for stability)
plasticity_learning_rate = 0.001
stdp_ltp_weight = 0.005
stdp_ltd_weight = 0.006
stdp_time_constant = 15.0

# Development settings (minimal development)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
 dopamine_baseline = 0.0
dopamine_baseline = 0.0  # No baseline for stability

# Reward settings (simplified)
reward_discount_factor = 0.99

# Environment settings (smaller for faster simulation)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings
log_level = WARNING
log_to_file = false
log_filename = lightweight_nlm.log

# Simulation settings (fewer steps)
max_simulation_steps = 500
simulation_time_limit = 0.0

# Visualization settings (disabled for performance)
visualization_enabled = false
visualization_update_rate = 30.0

# Minimal feature set (disable expensive features)
enable_structural_plasticity = false
enable_curiosity = false
enable_prediction = false