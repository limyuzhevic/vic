# Configuration for large-scale simulations
# Good for performance testing and studying emergent behaviors

brain.neuron_count = 5000
brain.region_count = 4
brain.connection_probability = 0.05
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1

# Neuron parameters
brain.neurons.v_thresh = -50.0
brain.neurons.v_rest = -70.0
brain.neurons.v_reset = -75.0
brain.neurons.tau_mem = 20.0
brain.neurons.tau_ref = 5.0           # Longer refractory period

# STDP plasticity
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian plasticity
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.0005    # Slower Hebbian learning

# Structural plasticity
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.00005
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation
neuromodulation.dopamine.scale = 1.5              # Stronger neuromodulation
neuromodulation.curiosity.enable = true
neuromodulation.novelty.enable = true

# Simulation
simulation.timestep = 0.001

# Logging
logging.level = "info"
logging.file = "nlm_large.log"
logging.max_file_size = 52428800  # 50MB