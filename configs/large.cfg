# NLM Configuration - Large Network
# Optimized for comprehensive experiments and research

# Basic Brain Configuration
neuron_count=5000          # Large-scale neural network
region_count=4             # Multiple regions for cortical-like structure
connection_probability=0.05 # Lower density for large networks
random_seed=12345          # Different seed from other configs

# Simulation Parameters
simulation_timestep=0.001   # Simulation timestep in milliseconds
max_steps=50000            # Many steps for long experiments

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-60.0              # Different reset for larger networks
v_thresh=-50.0             # Higher threshold for large networks

# STDP (Spike-Timing-Dependent Plasticity)
stdp_ltp_weight=0.008      # Lower weight for large networks
stdp_ltd_weight=0.009      # Lower weight for large networks
stdp_tau=25.0              # Longer time constant

# Memory Systems (larger for research)
working_memory_capacity=500   # Substantial working memory
episodic_memory_max_episodes=5000 # Extensive episodic storage
associative_memory_capacity=1000 # Rich associative memory

# Neuromodulation (enhanced)
dopamine_level=0.7        # Higher baseline dopamine
curiosity_rate=0.2         # Stronger curiosity drive
novelty_threshold=0.25    # Lower threshold for novelty

# Development (extended)
enable_development=true    # Full developmental timeline
plasticity_decay_rate=0.02 # Slower decay for longer development

# Checkpoint System (comprehensive)
checkpoint_dir=./checkpoints   # Directory for checkpoints
checkpoint_interval=5000    # Frequent checkpoints for large simulations
max_checkpoints=50          # Many checkpoints

# Logging (detailed for research)
log_level=INFO            # Detailed logging
log_file=nlm_large_simulation.log # Separate log file
verbose_output=true       # Full output for analysis

# Environment (large)
env_width=50               # Large environment
env_height=50             # Large environment

# Experimental Parameters (research-focused)
exploration_rate=0.4       # Moderate exploration
exploitation_rate=0.6     # Higher exploitation
reward_scale=1.0          # Standard scaling
exploration_bonus=0.2     # Higher exploration bonus

# Performance (optimized for scale)
enable_multithreading=true # Enable parallel processing
thread_count=8           # Multiple threads
enable_simd=true         # SIMD optimizations
use_memory_pool=true     # Memory pooling for efficiency
