# NLM Configuration File
# Enhanced configuration for Phase 6: Final Integration
# 
# This configuration includes advanced settings for all integrated brain systems:
# - Memory systems (working, episodic, associative)
# - Neuromodulation (dopamine, curiosity, novelty, prediction error)
# - Prediction and cognition systems
# - Development and plasticity mechanisms
# - Replay and consolidation
# - Checkpoint persistence

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (Phase 6 fine-grained simulation)
simulation_timestep = 0.001

# Network architecture parameters
neuron_count = 2000
region_count = 3
connection_probability = 0.15

# Neuron and synapse parameters
v_thresh = -50.0  # Neuron threshold potential (mV)
v_rest = -70.0   # Resting potential (mV)
v_reset = -75.0  # Reset potential after spike (mV)
tau_mem = 20.0   # Membrane time constant (ms)
tau_ref = 2.0    # Refractory period (ms)

# Plasticity system parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
plasticity_learning_rate = 0.005
plasticity_stdp_enabled = true
plasticity_hebbian_enabled = true
plasticity_structural_enabled = true

# Structural plasticity (synaptogenesis and pruning)
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
structural_plasticity_enabled = true

# Neuromodulation system parameters
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true
neuromod.prediction_error.enable = true

# Memory system parameters
working_memory_capacity_ratio = 0.1  # Percentage of neurons for working memory
episodic_memory_max_episodes = 1000
associative_memory_pattern_threshold = 0.5

# Development system
enable_development = true
developmental_stage_initial_plasticity = 1.0
developmental_stage_critical_plasticity = 0.8
developmental_stage_maturation_plasticity = 0.5
developmental_stage_adult_plasticity = 0.2

# Replay and consolidation
replay_interval = 100     # Replay every 100 steps
consolidation_interval = 1000  # Consolidate every 1000 steps
consolidation_threshold = 0.3   # Consolidate episodes with activation above threshold

# Checkpoint persistence
checkpoint_dir = ./checkpoints
checkpoint_interval = 1000        # Save checkpoint every 1000 steps
checkpoint_max_files = 10
checkpoint_compression = balanced
enable_checkpointing = true

# Advanced command options (for NLM CLI)
# Enable/disable subsystems
enable_memory_systems = true
enable_prediction_system = true
enable_cognition_systems = true
enable_neuromodulation = true
enable_development_system = true

# Performance optimizations
enable_vectorization = true
enable_parallel_processing = true
enable_memory_pools = true
enable_event_queues = true

simd_vectorization_level = high
memory_pool_size_mb = 1024
event_queue_size = 10000

# Visualization and logging
visualization_enabled = false
visualization_update_rate = 30.0
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_rotation_kb = 1024
enable_performance_metrics = true

# World and environment configuration
environment_name = SimpleGridWorld
environment_width = 20
environment_height = 20
vision_width = 8
vision_height = 8
audio_enabled = false

# Agent configuration
agent_max_energy = 100.0
agent_energy_decay_rate = 0.01
agent_health_regeneration_rate = 0.001
agent_curiosity_threshold = 0.3
agent_novelty_decay_rate = 0.99

# Reward and punishment settings
reward_prediction_enabled = true
reward_discount_factor = 0.99
punishment_enabled = true
punishment_threshold = -10.0
punishment_decay_rate = 0.95

# Experimental parameters
max_simulation_steps = 50000
simulation_time_limit = 0.0
randomize_connectivity = true
randomize_weights = true

# Advanced debugging and testing options
debug_mode = false
enable_step_profiling = false
enable_memory_profiling = false
enable_profiling = false

# Export and import options
enable_export_binary = true
enable_export_python = true
enable_export_visualization = false
export_format = binary

# Batch processing options
batch_size = 100
batch_processing_enabled = false