# NLM Configuration - Learning Experiments
# Optimized for machine learning and cognitive development research

# Basic Brain Configuration
neuron_count=1000          # Large enough for interesting learning patterns
region_count=3             # Multiple regions for different functions
connection_probability=0.08 # Moderate density for learning complexity
random_seed=2024           # Fixed seed for reproducible experiments

# Simulation Parameters
simulation_timestep=0.001   # Fine timestep for accurate learning
max_steps=20000            # Long simulations for learning to occur

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-65.0              # Reset membrane potential (mV)
v_thresh=-55.0             # Threshold potential (mV)

# STDP (learning-focused)
stdp_ltp_weight=0.012      # Balanced STDP weights
stdp_ltd_weight=0.014      # Balanced STDP weights
stdp_tau=20.0              # Standard time constant

# Memory Systems (extensive for learning)
working_memory_capacity=100   # Substantial working memory for learning
episodic_memory_max_episodes=2000 # Rich episodic storage
associative_memory_capacity=500 # Strong associative learning

# Neuromodulation (learning-enhanced)
dopamine_level=0.6        # Moderate baseline dopamine
curiosity_rate=0.3         # Strong curiosity drive for exploration
novelty_threshold=0.2      # Responsive to novelty

# Development (learning-optimized)
enable_development=true    # Full developmental timeline
plasticity_decay_rate=0.03 # Controlled decay for learning

# Checkpoint System (for long experiments)
checkpoint_dir=./learning_checkpoints   # Separate directory
checkpoint_interval=2000    # Periodic checkpoints
max_checkpoints=10          # Limited checkpoints

# Logging (balanced for research)
log_level=INFO            # Detailed but not excessive
log_file=nlm_learning_simulation.log # Research log
verbose_output=true       # Full output for analysis

# Environment (complex for learning)
env_width=30               # Complex environment
env_height=30             # Complex environment

# Experimental Parameters (learning-optimized)
exploration_rate=0.4       # Substantial exploration
exploitation_rate=0.6     # Increasing exploitation with learning
reward_scale=1.0          # Standard scaling
exploration_bonus=0.3     # High exploration bonus

# Learning-specific settings
learning_rate=0.01         # Neural learning rate
curiosity_threshold=0.3   # Threshold for curiosity-driven exploration
memory_consolidation=true # Enable memory consolidation
replay_frequency=0.1      # Frequency of memory replay

# Performance (learning-optimized)
enable_multithreading=true # Parallel processing for speed
thread_count=4           # Balanced threading
enable_simd=true         # SIMD optimizations
use_memory_pool=true     # Memory pooling for efficiency

# Research notes:
# This configuration is designed for studying:
# - Continual learning and adaptation
# - Memory consolidation and replay
# - Curiosity-driven exploration
# - Developmental learning trajectories
# - Generalization and transfer learning
