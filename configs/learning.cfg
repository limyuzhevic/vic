# Configuration optimized for learning and plasticity experiments
# Emphasizes synaptic modification and memory formation

brain.neuron_count = 1000
brain.region_count = 2
brain.connection_probability = 0.2    # Higher connectivity for learning
brain.initial_weight_mean = 0.3
brain.initial_weight_std = 0.2

# Neuron parameters
brain.neurons.v_thresh = -55.0        # More excitable neurons
brain.neurons.v_rest = -70.0
brain.neurons.v_reset = -80.0         # Lower reset potential
brain.neurons.tau_mem = 15.0          # Faster membrane dynamics
brain.neurons.tau_ref = 3.0

# STDP plasticity
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.002      # Stronger STDP
plasticity.stdp.tau_plus = 30.0            # Longer LTP window
plasticity.stdp.tau_minus = 30.0           # Longer LTD window

# Hebbian plasticity
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.0002    # Higher synaptogenesis
plasticity.structural.pruning_rate = 0.00005

# Neuromodulation
neuromodulation.dopamine.scale = 2.0              # Strong reward modulation
neuromodulation.curiosity.enable = true
neuromodulation.novelty.enable = true

# Simulation
simulation.timestep = 0.001

# Logging
logging.level = "debug"          # More detailed logging for learning analysis
logging.file = "nlm_learning.log"
logging.max_file_size = 10485760