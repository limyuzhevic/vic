# NLM Configuration File - Learning-Focused
# Configuration optimized for studying learning dynamics

# Core simulation parameters
neuron_count = 600
max_steps = 3000
region_count = 1
connection_probability = 0.12

# Plasticity rules
stdp_ltp_weight = 0.012
stdp_ltd_weight = 0.011
synaptogenesis_rate = 0.0001
pruning_rate = 0.000015

# Memory systems
replay_interval = 100
consolidation_interval = 1000
max_episodes = 1500

# No development - focus on learning
enable_development = false

# Checkpointing disabled for speed
enable_checkpointing = false

# Neuromodulation
enable_curiosity = true
enable_novelty = true

# Logging
log_level = DEBUG
log_to_file = false

# Quick testing
log_to_console = true