// Simple learning configuration file
// For use in Phase 2 neural computation demonstrations

brain.neuron_count = 500
brain.region_count = 1
brain.connection_probability = 0.15
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0
brain.leak_conductance = 10.0
brain.refractory_period = 5

plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.stdp.ltp_weight = 0.02
plasticity.stdp.ltd_weight = 0.015

plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

plasticity.structural.enable = true
plasticity.synaptogenesis_rate = 0.0001
plasticity.pruning_rate = 0.00001

neuromodulation.dopamine.scale = 1.0
neuromodulation.curiosity.enable = true
neuromodulation.curiosity.exploration_rate = 0.1
neuromodulation.novelty.enable = true
neuromodulation.novelty.sensitivity = 0.5

development.enable_development = true
development.enable_maturation = true
development.development_rate = 0.01
development.critical_period = 10.0
development.maturation_stage = 0.5

simulation.timestep = 0.001
simulation.max_steps = 1000
simulation.random_seed = 42
simulation.enable_checkpointing = false
simulation.checkpoint_interval = 100
