# NLM Advanced Configuration
# This is an advanced configuration for NLM

# Core configuration
neuron_count = 5000
region_count = 3
connection_probability = 0.2
simulation_timestep = 0.0005
random_seed = 12345

# Plasticity configuration
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development configuration
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation configuration
dopamine_baseline = 0.1
curiosity_rate = 0.2

# Memory configuration
working_memory_capacity = 500
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 5000
episodic_memory_consolidation_rate = 0.1
episodic_memory_replay_rate = 0.2

# Environment configuration
environment_name = ComplexWorld
environment_width = 20
environment_height = 20
reward_discount_factor = 0.95
exploration_bonus = 0.1

# Logging configuration
log_level = DEBUG
log_to_file = true
log_filename = nlm_advanced.log
log_max_size = 104857600
log_rotation = 5

# Performance configuration
max_simulation_steps = 100000
simulation_time_limit = 100.0
visualization_enabled = true
visualization_update_rate = 60.0
checkpoint_enabled = true
checkpoint_interval = 5000
checkpoint_filename = advanced_checkpoint.bin