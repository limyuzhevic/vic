# Advanced NLM Configuration
# This configuration demonstrates all available advanced features
# Save this as advanced_config.cfg and load with: nlm --config advanced_config.cfg

# === BASIC CONFIGURATION ===
random_seed = 42
simulation_timestep = 0.001
neuron_count = 2000
region_count = 3
connection_probability = 0.12

# === NEURAL DYNAMICS ===
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0
brain.leak_conductance = 0.05

# === PLASTICITY CONFIGURATION ===
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.002
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.stdp.prediction_error_weight = 0.3
plasticity.stdp.dopamine_scaling = 1.2

plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.01

plasticity.structural.enable = true
plasticity.synaptogenesis_rate = 0.0002
plasticity.pruning_rate = 0.00005
plasticity.min_weight = 0.01
plasticity.max_weight = 2.0

# === NEUROMODULATION ===
neuromod.dopamine.scale = 1.5
neuromod.dopamine.baseline = 0.1
neuromod.dopamine.learning_rate = 0.01

neuromod.curiosity.enable = true
neuromod.curiosity.weight_novelty = 0.6
neuromod.curiosity.weight_prediction_error = 0.4
neuromod.curiosity.decay_rate = 0.05
neuromod.curiosity.exploration_bonus = 0.5

neuromod.novelty.enable = true
neuromod.novelty.window_size = 100
neuromod.novelty.sensitivity = 0.8

neuromod.prediction_error.enable = true
neuromod.prediction_error.learning_rate = 0.05
neuromod.prediction_error.confidence_threshold = 0.7

# === DEVELOPMENT ===
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development.maturation_rate = 0.05
development.plastic_window_end = 100.0

# === MEMORY SYSTEMS ===
working_memory.capacity = 500
working_memory.decay_rate = 0.01
working_memory.stability_threshold = 0.8

episodic_memory.max_episodes = 5000
episodic_memory.consolidation_interval = 100
episodic_memory.recency_weight = 0.5

# === COGNITION ===
cognition.attention.inhibition_strength = 0.5
cognition.attention.excitation_strength = 1.5
cognition.attention.focus_decay = 0.1

cognition.planner.planning_depth = 8
cognition.planner.action_selection_temperature = 1.0
cognition.planner.uncertainty_weight = 0.3

cognition.concept_formation.learning_rate = 0.02
cognition.concept_formation.similarity_threshold = 0.7

# === PREDICTION SYSTEM ===
prediction.window_size = 50
prediction.prediction_accuracy_threshold = 0.8
prediction.confidence_decay = 0.02
prediction.reward_prediction_error_weight = 0.6

# === SIMULATION CONTROL ===
max_simulation_steps = 50000
simulation_time_limit = 0.0

# === CHECKPOINTING ===
checkpoint.enabled = true
checkpoint.interval = 1000
checkpoint.compress = true
checkpoint_dir = "checkpoints"
checkpoint.keep_latest = 20

# === EXPLORATION BEHAVIOR ===
exploration.enabled = true
exploration.strategy = "epsilon_greedy"
exploration.epsilon_start = 0.5
exploration.epsilon_end = 0.05
exploration.epsilon_decay = 0.001
exploration.intrinsic_reward_weight = 0.3
exploration.extrinsic_reward_weight = 0.7

# === MONITORING ===
monitoring.enabled = true
monitoring.stats_interval = 100
monitoring.visualization.enabled = false
monitoring.visualization.port = 8080
monitoring.metrics.sample_rate = 0.1
monitoring.alerts.enabled = true
monitoring.alerts.spike_threshold = 5000
monitoring.alerts.memory_threshold = 0.9

# === ADVANCED FEATURES ===
meta_learning.enabled = true
meta_learning.meta_learning_rate = 0.001
meta_learning.adaptation_window = 1000

neuroevolution.enabled = true
neuroevolution.mutation_rate = 0.1
neuroevolution.population_size = 10
neuroevolution.selection_pressure = 0.8

social_learning.enabled = true
social_learning.influence_radius = 5.0
social_learning.knowledge_sharing_rate = 0.3

# === VISUALIZATION ===
visualization.enabled = true
visualization.update_rate = 30.0
visualization.output_format = "png"
visualization.output_dir = "visualization"
visualization.brain_view.enabled = true
visualization.spikes_view.enabled = true
visualization.memory_view.enabled = true
visualization.plasticity_view.enabled = true

# === LOGGING ===
log_level = INFO
log_to_file = true
log_filename = "nlm_advanced.log"
log_max_size_mb = 100
log_backup_count = 5

# === PERFORMANCE ===
performance.use_simd = true
performance.use_thread_pool = true
performance.thread_count = 4
performance.memory_pool.enabled = true
performance.event_queue.enabled = true
performance.checkpoint_io.enabled = true

# === END OF CONFIGURATION ===
