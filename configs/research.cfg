# NLM Research Configuration
# Optimized for scientific research and experimentation

# Random seed for reproducible research (document for replication)
random_seed = 42

# Simulation timestep in seconds (standard for research)
simulation_timestep = 0.001

# Number of neurons in the brain (standard research size)
neuron_count = 1000

# Number of brain regions (multiple regions for connectivity studies)
region_count = 4

# Connection probability for random connectivity (controlled for research)
connection_probability = 0.08

# Plasticity settings (standard research values)
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
plasticity_learning_rate = 0.01

# Structural plasticity settings (research grade)
synaptogenesis_rate = 0.001
pruning_rate = 0.0001

# Neuromodulation settings (comprehensive for research)
dopamine_baseline = 0.0
dopa_shift = 0.5
dopa_weight = 1.0

# Reward settings (standard for research)
reward_discount_factor = 0.99
reward_window = 10.0

# Environment settings (standard research environment)
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings (scientific logging)
log_level = INFO
log_to_file = true
log_filename = nlm_research.log
log_detailed = false

# Simulation settings (long for research studies)
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_checkpoints = true
checkpoint_interval = 5000

# Visualization settings (research visualization)
visualization_enabled = true
visualization_update_rate = 10.0
enable_progress_logging = true
progress_log_interval = 1000

# Neural dynamics settings (standard research values)
neuron_threshold = -50.0
neuron_rest_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Memory system settings (research grade)
working_memory_capacity = 200
episodic_memory_capacity = 2000
associative_memory_strength = 0.5

# Prediction system settings (research quality)
prediction_horizon = 50
prediction_confidence_threshold = 0.7

# Neuromodulation settings (research comprehensive)
curiosity_scaling = 1.0
novelty_threshold = 0.5
prediction_error_decay = 0.1

# Development stages (realistic for longitudinal research)
development_start_time = 0.0
development_end_time = 200.0
development_stage_duration = 40.0

# Research flags (all enabled for comprehensive studies)
enable_stdp = true
enable_hebbian = true
enable_structural = true
enable_curiosity = true
enable_novelty = true
enable_prediction = true
enable_planning = true
enable_concept_formation = true
enable_attention = true
enable_development = true

# Research metadata
research_version = "1.0.0"
research_notes = "Standard research configuration for NLM Phase 6 integration studies"
experimental_protocol = "Standard neural development and learning"
replication_code = "https://github.com/neural-learning-machine/nlm"
subject_id = "research-standard"
study_name = "NLM_Standard_Integration_Study"