# NLM Configuration Template - Research Mode
# Research configuration with high variability for exploration
# 
# Basic performance settings
random_seed = 12345
simulation_timestep = 0.001

# Memory settings (larger capacity for research)
memory.workingMemoryCapacity = 200.0
memory.episodicConsolidationRate = 0.2
memory.associativeStrengthDecay = 0.9
memory.episodicDecayRate = 0.95

# Neuromodulation settings (high exploration)
neuromodulation.dopamineBaseline = 0.5
neuromodulation.dopamineNoise = 0.3
neuromodulation.noveltyThreshold = 0.8
neuromodulation.curiosityLevel = 1.0
neuromodulation.explorationRate = 0.5

# Cognitive settings (deep planning for research)
cognitive.planningDepth = 5
cognitive.conceptFormationThreshold = 0.7
cognitive.attentionDecayRate = 0.95
cognitive.workingMemoryDecayRate = 0.9
cognitive.activationThreshold = 0.05

# Prediction settings (high learning rate)
prediction.confidenceThreshold = 0.9
prediction.learningRate = 0.1
prediction.decayRate = 0.99
prediction.noise = 0.2

# Development settings (high plasticity for research)
development.plasticityRate = 0.8
development.stage = 0.8
development.explorationPhaseDuration = 200.0
development.learningPhaseDuration = 5000.0
development.enablePhaseTransitions = true

# Integration settings (strong coupling)
integration.corticalCorticalCoupling = 0.9
integration.corticalSubcorticalCoupling = 0.8
integration.feedbackStrength = 0.9
integration.predictionErrorGain = 1.2
integration.learningRate = 0.1

# Debug settings (verbose for research)
debug.enabled = true
debug.level = "debug"

# Performance settings (exploratory mode)
performance.optimizationLevel = 0
performance.maxMemoryUsage = 1024
performance.maxSimulationSteps = 50000
