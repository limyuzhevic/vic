# Research Configuration Profile
# Optimized for research and experimentation
# Higher precision, detailed logging, conservative settings

# Random seed for reproducible experiments
random_seed = 12345

# Simulation timestep in seconds (higher precision for research)
simulation_timestep = 0.0001

# Number of neurons (moderate size for quick experimentation)
neuron_count = 500

# Number of brain regions (small for focused study)
region_count = 3

# Connection probability (higher for exploration)
connection_probability = 0.15

# Plasticity settings (conservative for stable learning)
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.008
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (slower development for controlled experiments)
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005

# Neuromodulation settings (balanced)
dopamine_baseline = 0.1

# Reward settings (exploration-friendly)
reward_discount_factor = 0.95

# Environment settings
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings (detailed for research)
log_level = DEBUG
log_to_file = true
log_filename = research_nlm.log

# Simulation settings (shorter runs)
max_simulation_steps = 5000
simulation_time_limit = 0.0

# Visualization (enabled for detailed analysis)
visualization_enabled = true
visualization_update_rate = 30.0