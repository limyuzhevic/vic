# NLM Configuration File - Research Experiment Template
# Configuration optimized for scientific experiments and research

# =============================================================================
# RESEARCH-FOCUSED SIMULATION PARAMETERS
# =============================================================================

# Reproducible experimental setup
random_seed = 12345               # For reproducibility
experiment_id = "nlm_research_2024"
experiment_seed = 67890

simulation_timestep = 0.001      # High precision for scientific results
neuron_count = 2000              # Medium size for detailed analysis
region_count = 3                  # Balanced modular complexity
connection_probability = 0.15     # Moderate connectivity for analysis

# =============================================================================
# SCIENTIFIC NEURAL PARAMETERS
# =============================================================================

# Biologically realistic neuron parameters
resting_potential = -65.0        # Typical mammalian neuron
threshold = -50.0                # Realistic spike threshold
reset_potential = -65.0          # Realistic reset potential
refractory_period = 3            # Realistic refractory period (ms)

# =============================================================================
# COMPREHENSIVE PLASTICITY FOR RESEARCH
# =============================================================================

# Detailed plasticity for scientific investigation
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0         # Realistic STDP time constants

# Enable all plasticity mechanisms for complete research control
enable_structural_plasticity = true
enable_reward_modulation = true
enable_curiosity = true
enable_prediction = true
enable_development = true

# =============================================================================
# FULL NEUROMODULATION FOR RESEARCH
# =============================================================================

# Complete neuromodulation system
dopamine_baseline = 0.2
acetylcholine_baseline = 0.3
norepinephrine_baseline = 0.25
serotonin_baseline = 0.2

dopamine_decay_rate = 0.1
dopamine_release_rate = 1.0

novelty_threshold = 0.01
novelty_decay_rate = 0.05

# =============================================================================
# COMPREHENSIVE ENVIRONMENT
# =============================================================================

# Rich environment for scientific exploration
environment_name = GridWorld
environment_width = 20
environment_height = 20

# High-resolution sensory processing
vision_width = 16
vision_height = 16
vision_range = 2
vision_angle = 180.0

# =============================================================================
# DETAILED MEMORY SYSTEMS
# =============================================================================

# Comprehensive memory systems for research
working_memory_capacity = 50
working_memory_decay = 50.0

episodic_memory_capacity = 5000
consolidation_threshold = 0.8

semantic_memory_learning_rate = 0.002

# =============================================================================
# ADVANCED COGNITION FOR RESEARCH
# =============================================================================

# Full cognitive systems
planner_time_horizon = 20
planner_action_selection_temperature = 0.5

concept_learning_rate = 0.001
concept_threshold = 0.3

attention_decay_rate = 0.2
attention_focus_strength = 2.0

# =============================================================================
# SCIENTIFIC LOGGING
# =============================================================================

# Detailed logging for research analysis
log_level = DEBUG                # Maximum detail
log_to_file = true
log_filename = nlm_research_$(experiment_id).log

# =============================================================================
# LONG-DURATION SCIENTIFIC SIMULATIONS
# =============================================================================

max_simulation_steps = 100000   # Long simulations for statistical analysis
simulation_time_limit = 0.0

# =============================================================================
# MEMORY AND PERFORMANCE SETTINGS
# =============================================================================

# Accurate memory tracking for research
performance_optimizations = true
neuron_memory_pool_size = 2048
synapse_memory_pool_size = 4096

# =============================================================================
# RESEARCH CAPABILITIES
# =============================================================================

