# Research configuration
# For detailed scientific experiments with full feature set

neuron_count = 1000
region_count = 8
connection_probability = 0.15
random_seed = 999999
simulation_timestep = 0.0001

# Enable all systems for comprehensive research
stdp_ltp_weight = 0.005
stdp_ltd_weight = 0.004
synaptogenesis_rate = 0.00001
pruning_rate = 0.000001
enable_development = true
developmental_plasticity_rate = 0.001
development_stage_duration = 5000.0

enable_reward_modulation = true
dopamine_strength = 0.8
curiosity_strength = 0.7
novelty_threshold = 0.6

enable_working_memory = true
working_memory_capacity = 500.0
working_memory_decay_rate = 0.005

enable_episodic_memory = true
episodic_memory_capacity = 5000
replay_frequency = 500.0

enable_planning = true
planning_depth = 5
attention_span = 100.0

log_level = DEBUG
verbose_logging = true
enable_performance_monitoring = true
enable_checkpoint = true
checkpoint_path = /tmp/nlm_research_checkpoint.bin
checkpoint_interval = 5000.0

experiment_type = research
experiment_steps = 50000.0
