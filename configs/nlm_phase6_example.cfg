#pragma once

/**
 * Example configuration file for NLM Phase 6 experiments
 * 
 * This file contains example configuration settings for NLM Phase 6 integration.
 * Users can customize these settings for their specific use case.
 * 
 * Format: key = value
 * Lines starting with # are comments
 */

# NLM Phase 6 Configuration Example
# ================================

# Basic brain configuration
neuronCount = 500
maxSteps = 2000
regionCount = 1
connectionProbability = 0.1

# Enable/disable systems
system.enableWorkingMemory = true
system.enableEpisodicMemory = true
system.enableAssociativeMemory = true
system.enablePrediction = true
system.enableNeuromodulation = true
system.enableDevelopment = true
system.enableCuriosity = true
system.enableNovelty = true
system.enablePlanning = true
system.enableConceptFormation = true
system.enableAttention = true

# Performance settings
performance.checkpointingEnabled = true
performance.checkpointInterval = 100
performance.maxCheckpoints = 5
performance.enableReplay = true
performance.replayInterval = 100
performance.enableConsolidation = true
performance.consolidationInterval = 1000

# Plasticity parameters
plasticity.stdp.ltpWeight = 0.01
plasticity.stdp.ltdWeight = 0.012
plasticity.stdp.tau = 20.0
plasticity.hebbian.enabled = true
plasticity.structural.synaptogenesisRate = 0.0001
plasticity.structural.pruningRate = 0.00001

# Development parameters
development.enabled = true
development.initialAge = 0.0
development.plasticityModifier = 1.0
development.stageTransitions.enabled = true

# Neuromodulation parameters
neuromodulation.dopamine.enabled = true
neuromodulation.dopamine.level = 0.5
neuromodulation.curiosity.enabled = true
neuromodulation.curiosity.threshold = 0.3
neuromodulation.novelty.enabled = true
neuromodulation.novelty.sensitivity = 0.5

# Memory parameters
memory.working.capacity = 1000
memory.episodic.maxEpisodes = 1000
memory.associative.maxAssociations = 10000

# Prediction parameters
prediction.horizon = 10
prediction.errorThreshold = 0.5
prediction.confidenceThreshold = 0.7

# Concept formation parameters
concept.formation.threshold = 0.7
concept.stabilityWindow = 100
concept.formationRate = 0.1

# Attention parameters
attention.inhibitionStrength = 0.5
attention.excitationStrength = 1.5
attention.selectionThreshold = 0.3

# Planning parameters
planning.depth = 5
planning.confidenceThreshold = 0.5
planning.planningWindow = 20

# Logging and debugging
logging.level = info
logging.file = "nlm.log"
logging.console = true
logging.detailed = false

# Simulation parameters
simulation.timestep = 0.001
simulation.maxSteps = 2000
simulation.enableProfiler = false
simulation.progressReporting = true

# Environment parameters
environment.width = 20.0
environment.height = 20.0
environment.simulationTime = 0.0

# Agent parameters
agent.energy.initial = 1.0
agent.energy.max = 1.0
agent.energy.decayRate = 0.01
agent.health.initial = 1.0
agent.health.max = 1.0
agent.age = 0.0

# Episode and trial parameters
episode.maxSteps = 2000
episode.enableCheckpoints = true
episode.enableReplay = true
episode.consolidation.enabled = true
episode.consolidation.threshold = 0.3

trial.maxEpisodes = 10
trial.enableProgress = true
trial.showDetailedResults = true

# Output and reporting
output.filename = "nlm_results.txt"
output.format = "text"
output.includeSystemStatus = true
output.includePerformanceMetrics = true
output.includeMemoryStats = true
output.includeNeuromodulationStats = true

# Experimental parameters
experimental.randomSeed = 42
experimental.enableRandomization = true
experimental.reproducibility.enabled = true
experimental.reproducibility.seed = 42

# Visualization parameters
visualization.enabled = false
visualization.outputFormat = "text"
visualization.updateInterval = 100
visualization.maxHistory = 1000

# Advanced features
advanced.featureSelection.enabled = false
advanced.featureSelection.method = "auto"
advanced.monitoring.enabled = false
advanced.monitoring.interval = 1000
advanced.validation.enabled = true
advanced.validation.threshold = 0.95

# System integration
integration.enableWorkingMemory = true
integration.enableEpisodicMemory = true
integration.enablePrediction = true
integration.enableNeuromodulation = true
integration.enableDevelopment = true
integration.enableConceptFormation = true
integration.enablePlanning = true
integration.enableAttention = true
integration.enableReplay = true
integration.enableConsolidation = true

# Performance optimization
optimization.enableSIMD = true
optimization.enableMultithreading = false
optimization.maxThreads = 1
optimization.enableMemoryPools = true
optimization.memoryPoolSize = 1024

# Debug and testing
debug.mode = "normal"
debug.validateEveryStep = false
debug.logDetailedInternalState = false
debug.simulationTimeScale = 1.0
