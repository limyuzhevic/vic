# NLM Benchmark Configuration
# This is a benchmark configuration for NLM

# Core configuration
neuron_count = 1000
region_count = 2
connection_probability = 0.15
simulation_timestep = 0.001

# Performance configuration
max_simulation_steps = 50000
checkpoint_enabled = true
checkpoint_interval = 10000

# Profiling configuration
profiling_enabled = true
profiling_output = benchmark_profile.json
tracing_enabled = true
tracing_output = benchmark_trace.json

# Logging configuration
log_level = WARNING
log_to_file = true
log_filename = benchmark.log
log_max_size = 10485760
log_rotation = 3

# Benchmark configuration
benchmark_name = "NeuralNetworkBenchmark"
benchmark_description = "Benchmark for neural network simulation"
benchmark_iterations = 5

# Data collection
collect_neural_activity = true
collect_spike_count = true
collect_memory_content = true
collect_plasticity_weights = true

# Performance monitoring
monitor_cpu = true
monitor_memory = true
monitor_network = true