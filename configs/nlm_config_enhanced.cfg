# NLM Configuration File
# Updated configuration for Phase 6: Integrated Artificial Brain

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
plasticity_learning_rate = 0.01

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_critical_period_start = 1000
development_critical_period_end = 5000

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_sensitivity = 0.5
dopamine_plasticity_modulation = 1.0
curiosity_threshold = 0.5
curiosity_decay = 0.95
novelty_threshold = 0.8

# Reward settings
reward_discount_factor = 0.99
reward_sensitivity = 0.5
reward_plasticity_modulation = 1.0

# Neuron dynamics parameters
neuron_leak_conductance = 10.0
neuron_threshold_high = -45.0
neuron_threshold_low = -65.0
neuron_resting_potential = -70.0
neuron_reset_potential = -70.0
neuron_refractory_period_mean = 5
neuron_refractory_period_std = 2
neuron_adaptation_max = 1.0
neuron_adaptation_decay = 0.95

# Synapse dynamics parameters
synapse_weight_min = -1.0
synapse_weight_max = 1.0
synapse_delay_min = 1
synapse_delay_max = 5
synapse_efficacy_min = 0.0
synapse_efficacy_max = 2.0
synapse_utilization_max = 1.0
synapse_time_constant_facilitation = 100.0
synapse_time_constant_depression = 200.0

# Synaptic current scaling
synaptic_current_scale = 10.0
synaptic_current_min = -100.0
synaptic_current_max = 100.0

# Working memory parameters
working_memory_capacity = 100
working_memory_decay = 0.99
working_memory_boost_strength = 0.5

# Episodic memory parameters
episodic_memory_max_episodes = 1000
episodic_memory_consolidation_threshold = 0.3
episodic_memory_replay_interval = 100
episodic_memory_replay_episodes = 3

# Associative memory parameters
associative_memory_decay = 0.95
associative_memory_pattern_threshold = 0.7

# Prediction system parameters
prediction_horizon = 10
prediction_error_threshold = 0.5
prediction_learning_rate = 0.1

# Cognitive system parameters
planning_depth = 5
planning_horizon = 20
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
concept_threshold = 0.7

# Development system parameters
development_plasticity_modulation = 1.0
development_plasticity_critical_period = 0.8
development_plasticity_maturation = 0.5
development_plasticity_adult = 0.2

# Motor action selection parameters
action_selection_temperature = 0.1
action_exploration_rate = 0.1
action_consolidation_threshold = 0.8

# Reward modulation parameters
reward_modulation_sensitivity = 0.5
reward_modulation_time_constant = 100.0

# Checkpoint system parameters
checkpoint_dir = ./checkpoints
checkpoint_max_files = 10
checkpoint_compression = balanced
checkpoint_version = 1

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_file_size_limit = 10485760  # 10MB
log_rotation_count = 5

# Simulation settings
max_simulation_steps = 10000
simulation_time_limit = 0.0
enable_checkpointing = true
enable_replay = true
enable_development = true

# Visualization settings
visualization_enabled = false
visualization_update_rate = 30.0
visualization_window_width = 1024
visualization_window_height = 768

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_observation_range = 5
environment_action_space_size = 4

# Performance settings
max_threads = 4
simulation_batch_size = 100
history_buffer_size = 1000

# Research parameters
research_mode = exploratory
exploration_exploitation_ratio = 0.5
learning_rate_decay = 0.999
