# NLM Quick Start Configuration
# Use this configuration for testing and getting started with NLM

# ===================================
# QUICK START CONFIGURATION
# ===================================

# Minimal configuration for fast testing
neuron_count = 50
region_count = 1
connection_probability = 0.20

simulation_timestep = 0.001
random_seed = 42

# High plasticity for exploration
stdp_ltp_weight = 0.03
stdp_ltd_weight = 0.025
stdp_tau = 15.0

synaptogenesis_rate = 0.002
pruning_rate = 0.0001

# Fast memory replay for quick learning
replay_interval = 20
consolidation_interval = 100

# ===================================
# EXPERIMENTAL PARAMETERS
# ===================================

# Enhanced novelty detection for exploration
novelty_threshold = 0.8

# High curiosity for exploration
curiosity_level = 0.8

# Fast concept formation
concept_threshold = 0.9

# ===================================
# LOGGING CONFIGURATION
# ===================================

# Enable debug logging for development
log_level = 0
use_colors = true
log_file = ""

# ===================================
# BEHAVIORAL PARAMETERS
# ===================================

# Strong reward signals for learning
reward_scale = 2.0

# Deterministic action selection for predictable behavior
action_threshold = 0.7

# ===================================
# ADVANCED FEATURES
# ===================================

# Enable all advanced features
enable_prediction = true
enable_concept_formation = true
enable_structural_plasticity = true
enable_development = true
enable_sleep_replay = true

# ===================================
# END OF QUICK START CONFIGURATION
# ===================================

# This configuration is optimized for:
# - Rapid testing and development
# - High exploration and learning
# - Detailed debugging and analysis
# - Scientific experimentation

# To use: ./nlm --config configs/quick_start.cfg

# Modify parameters for different use cases:
# - For production: Increase neuron_count, decrease plasticity
# - For research: Keep small neuron_count, increase exploration
# - For performance: Decrease timestep, increase connection_probability
