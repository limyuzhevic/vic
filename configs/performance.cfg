# NLM Configuration File
# Performance-optimized configuration for NLM (Neural Learning Machine)
# This configuration is optimized for maximum performance and throughput
# while maintaining high learning capability.

# ===== BRAIN CONFIGURATION =====
neuron_count = 10000
connection_probability = 0.01
initial_weight_mean = 0.5
initial_weight_std = 0.1

# ===== PLASTICITY CONFIGURATION (Performance Optimized) =====
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.005
plasticity.hebbian.enable = false  # Disabled for speed
plasticity.structural.enable = false  # Disabled for speed

# ===== NEUROMODULATION (Light Weight) =====
neuromod.dopamine.scale = 0.5
neuromod.curiosity.enable = false  # Disabled for speed
neuromod.novelty.enable = false  # Disabled for speed

# ===== MEMORY (Optimized for Performance) =====
memory.working_capacity = 500
memory.episodic.max_episodes = 100
memory.associative.pheromone_decay = 0.05

# ===== DEVELOPMENT (Fixed for Consistency) =====
development.stage = 4
development.initial_plasticity = 1.0
development.critical_period_start = 100
development.critical_period_end = 500

# ===== WORLD (Larger for Complex Behavior) =====
world.width = 100
world.height = 100

# ===== SIMULATION (Optimized for Speed) =====
simulation.timestep = 0.0005
simulation.max_steps = 50000
simulation.replay_interval = 1000
simulation.consolidation_interval = 10000

# ===== PERFORMANCE FEATURES =====
# These configuration options enable advanced performance features
performance.enable_parallel = true
performance.enable_vectorization = true
performance.use_memory_pools = true
performance.optimization_level = "aggressive"

# ===== CHECKPOINT SYSTEM =====
checkpoint.enabled = true
checkpoint.interval = 5000
checkpoint.directory = "./perf_checkpoints"
checkpoint.compression = "high"

# ===== CONFIGURATION NOTES =====
# 
# This configuration prioritizes performance while maintaining learning capability.
#
# Key Design Decisions:
# 1. Larger brain size (10,000 neurons) for computational throughput
# 2. Lower connection probability (0.01) for efficient computation
# 3. Light neuromodulation to reduce overhead
# 4. Reduced plasticity to focus on performance
# 5. Optimized memory usage with smaller episodic memory
#
# Performance Trade-offs:
# - Reduced memory overhead for faster processing
# - Lower neuromodulation complexity for speed
# - Smaller episodic memory for faster consolidation
# - Light plasticity for stable performance
#
# Use this configuration when:
# - Running long-term simulations
# - Processing large datasets
# - Requiring maximum throughput
# - Working with complex environments
#
# Usage Example:
# nlm --config=configs/performance.cfg --test=all --profile
#
# Configuration file: configs/performance.cfg
# Format: flat keys for maximum readability
# Purpose: High-performance production environment
# Generated: 2026-11-19

# ===== END OF PERFORMANCE CONFIGURATION =====
