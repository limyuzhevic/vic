# Performance-focused configuration
# Optimized for speed and efficiency

brain.neuron_count = 2000
brain.region_count = 3
brain.connection_probability = 0.1
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1

# Neuron parameters
brain.neurons.v_thresh = -50.0
brain.neurons.v_rest = -70.0
brain.neurons.v_reset = -75.0
brain.neurons.tau_mem = 20.0
brain.neurons.tau_ref = 2.0

# STDP plasticity
plasticity.stdp.enable = true            # STDP is computationally efficient
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian plasticity
plasticity.hebbian.enable = false           # Disabled for performance
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = false           # Disabled for performance
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation
neuromodulation.dopamine.scale = 1.0
neuromodulation.curiosity.enable = false           # Disabled for performance
neuromodulation.novelty.enable = false           # Disabled for performance

# Simulation
simulation.timestep = 0.001

# Logging
logging.level = "info"           # Minimal logging for performance
logging.file = "nlm_performance.log"
logging.max_file_size = 10485760