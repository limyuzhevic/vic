# NLM Performance Configuration
# Optimized for speed and benchmarking

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds (faster for benchmarks)
simulation_timestep = 0.0005

# Number of neurons in the brain (smaller for faster performance)
neuron_count = 100

# Number of brain regions (single region for less overhead)
region_count = 1

# Connection probability for random connectivity (sparser for performance)
connection_probability = 0.05

# Plasticity settings (faster for benchmarks)
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 10.0
plasticity_learning_rate = 0.005

# Structural plasticity settings (disabled for performance)
synaptogenesis_rate = 0.0
synapsing_rate = 0.0
pruning_rate = 0.0

# Neuromodulation settings (simplified for performance)
dopamine_baseline = 0.0
dopa_shift = 0.2
dopa_weight = 0.5

# Reward settings
reward_discount_factor = 0.95
reward_window = 5.0

# Environment settings
environment_name = GridWorld
environment_width = 5
environment_height = 5

# Logging settings (minimal for performance)
log_level = WARN
log_to_file = false
log_filename = nlm.log
log_detailed = false

# Simulation settings (shorter for benchmarks)
max_simulation_steps = 1000
simulation_time_limit = 0.0
enable_checkpoints = false
checkpoint_interval = 1000

# Visualization settings (disabled for performance)
visualization_enabled = false
visualization_update_rate = 30.0
enable_progress_logging = false
progress_log_interval = 100

# Neural dynamics settings (standard values)
neuron_threshold = -50.0
neuron_rest_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Memory system settings (smaller for performance)
working_memory_capacity = 50
episodic_memory_capacity = 200
associative_memory_strength = 0.3

# Prediction system settings (simplified for performance)
prediction_horizon = 5
prediction_confidence_threshold = 0.5

# Neuromodulation settings (simplified for performance)
curiosity_scaling = 0.5
novelty_threshold = 0.3
prediction_error_decay = 0.05

# Development stages (shorter for benchmarks)
development_start_time = 0.0
development_end_time = 10.0
development_stage_duration = 5.0