# NLM Configuration Template - High Performance Mode
# High-performance configuration with optimized settings
# 
# Basic performance settings
random_seed = 42
simulation_timestep = 0.0001

# Memory settings (very high capacity)
memory.workingMemoryCapacity = 500.0
memory.episodicConsolidationRate = 0.3
memory.associativeStrengthDecay = 0.99
memory.episodicDecayRate = 0.999

# Neuromodulation settings (low noise, stable)
neuromodulation.dopamineBaseline = 0.7
neuromodulation.dopamineNoise = 0.05
neuromodulation.noveltyThreshold = 0.6
neuromodulation.curiosityLevel = 0.5
neuromodulation.explorationRate = 0.1

# Cognitive settings (shallow planning for performance)
cognitive.planningDepth = 1
cognitive.conceptFormationThreshold = 0.5
cognitive.attentionDecayRate = 0.999
cognitive.workingMemoryDecayRate = 0.999
cognitive.activationThreshold = 0.01

# Prediction settings (stable learning)
prediction.confidenceThreshold = 0.95
prediction.learningRate = 0.02
prediction.decayRate = 0.9999
prediction.noise = 0.01

# Development settings (low plasticity)
development.plasticityRate = 0.2
development.stage = 1.0
development.explorationPhaseDuration = 50.0
development.learningPhaseDuration = 500.0
development.enablePhaseTransitions = false

# Integration settings (very high coupling)
integration.corticalCorticalCoupling = 0.99
integration.corticalSubcorticalCoupling = 0.98
integration.feedbackStrength = 0.95
integration.predictionErrorGain = 1.0
integration.learningRate = 0.01

# Debug settings (disabled for performance)
debug.enabled = false
debug.level = "warning"

# Performance settings (maximum optimization)
performance.optimizationLevel = 3
performance.maxMemoryUsage = 2048
performance.maxSimulationSteps = 100000
performance.realtimeConstraint = true
performance.maxLatency = 10.0
