# NLM Performance Profiler Configuration
# Configuration for Phase 8: Performance Profiling System

# Basic profiling configuration
performance.profiling_enabled = false
performance.profiling_output_file = performance_profile.json
performance.profiling_sample_interval_ms = 100
performance.profiling_report_interval_s = 60

# Performance thresholds
performance.memory_threshold_mb = 1024.0
performance.cpu_threshold_percent = 80.0
performance.operation_threshold_ns = 1000000
performance.spike_rate_threshold_per_s = 100.0

# Profiling targets
performance.profile_brain = true
performance.profile_motor = true
performance.profile_sensor = true
performance.profile_neuromodulation = true
performance.profile_plasticity = true

# Output configuration
performance.output_text_report = true
performance.output_csv_report = true
performance.output_json_report = true
performance.console_output = true
performance.real_time_monitoring = true

# Multi-threading configuration
performance.thread_local_profiling = true
performance.global_aggregation = true
performance.max_threads = 0

# Analysis and detection
performance.detect_bottlenecks = true
performance.detect_regressions = true
performance.comparative_profiling = false
performance.baseline_file = 

# Alerting configuration
performance.alert_on_threshold = true
performance.alert_level = WARNING
performance.alert_callback = 

# Advanced features
performance.enable_memory_tracking = true
performance.enable_cpu_tracking = true
performance.enable_io_tracking = false
performance.enable_network_tracking = false
performance.compressed_output = false
performance.max_history_entries = 10000

# Integration with NLM systems
performance.brain.neuron_count_threshold = 10000
performance.brain.spike_rate_threshold = 1000.0
performance.brain.synaptic_efficiency_threshold = 0.8
performance.motor.action_rate_threshold = 100.0
performance.motor.precision_threshold = 0.95
performance.sensor.throughput_threshold = 1000.0
performance.sensor.latency_threshold = 0.1
performance.neuromodulation.stability_threshold = 0.95
performance.plasticity.adaptation_threshold = 0.9
