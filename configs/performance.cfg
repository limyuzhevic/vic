# NLM Configuration File - Performance Optimized Template
# Configuration optimized for maximum simulation performance

# =============================================================================
# PERFORMANCE-FOCUSED SIMULATION PARAMETERS
# =============================================================================

# Optimized for fast execution with larger networks
random_seed = 42
simulation_timestep = 0.002        # Larger timestep = faster simulation
neuron_count = 5000                # Larger network (performance must handle)
region_count = 4                    # Multiple regions for parallel processing
connection_probability = 0.05      # Sparse connectivity for performance

# =============================================================================
# PERFORMANCE-OPTIMIZED NEURAL PARAMETERS
# =============================================================================

# Optimized neuron parameters for speed
resting_potential = -70.0
threshold = -50.0                  # Higher threshold = fewer spikes
reset_potential = -70.0
refractory_period = 2              # Shorter refractory for higher throughput

# =============================================================================
# PERFORMANCE-OPTIMIZED PLASTICITY
# =============================================================================

# Simplified plasticity for performance
plasticity_learning_rate = 0.005    # Lower learning rate for stability
stdp_ltp_weight = 0.005
stdp_ltd_weight = 0.006
stdp_time_constant = 10.0          # Faster dynamics

# Disable expensive plasticity features
enable_structural_plasticity = false
enable_reward_modulation = false

# =============================================================================
# MINIMAL NEUROMODULATION
# =============================================================================

# Basic neuromodulation
dopamine_baseline = 0.05
novelty_threshold = 0.1          # Higher threshold = less novelty detection
novelty_decay_rate = 0.1           # Fast decay = less overhead

# Disable resource-intensive neuromodulators
enable_curiosity = false
enable_prediction = false

# =============================================================================n
# MINIMAL ENVIRONMENT FOR PERFORMANCE
# =============================================================================

environment_name = GridWorld
environment_width = 8             # Smaller environment
environment_height = 8
vision_width = 6                   # Lower resolution vision
vision_height = 6

# =============================================================================
# LIGHTWEIGHT LOGGING
# =============================================================================

log_level = WARNING                # Minimal logging overhead
log_to_file = false

# =============================================================================
# LONG-RUN SIMULATION
# =============================================================================

max_simulation_steps = 50000      # Many steps for long simulations
simulation_time_limit = 0.0

# =============================================================================
# PERFORMANCE-SPECIFIC MEMORY MANAGEMENT
# =============================================================================

# Enable memory pools for performance
performance_optimizations = true
neuron_memory_pool_size = 4096
synapse_memory_pool_size = 8192

# =============================================================================
# PERFORMANCE NOTES
# =============================================================================

# This configuration is optimized for:
# - Maximum simulation speed
# - Large network simulations
# - Performance testing and benchmarking
# - Research requiring high throughput
# - Production deployment where speed is critical

# Trade-offs:
# - Reduced biological realism
# - Disabled advanced features
# - Simplified neuromodulation
# - Basic environment modeling
