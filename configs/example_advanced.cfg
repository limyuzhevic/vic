# NLM Example Configuration File 2: Advanced Learning
# Configuration for reward-modulated STDP and comprehensive plasticity

simulation_timestep = 0.001
neuron_count = 1000
region_count = 3
random_seed = 12345
connection_probability = 0.08

# Advanced STDP settings with reward modulation
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.012
stdp_time_constant = 25.0

# Reward-modulated STDP parameters
reward_stdp_enabled = true
reward_stdp_ltp_weight = 0.02
reward_stdp_ltd_weight = 0.018
reward_stdp_time_constant = 30.0
reward_stdp_lambda = 0.5

# Triplet STDP parameters
triplet_stdp_enabled = true
triplet_stdp_a1 = 0.005  # First spike contribution
triplet_stdp_a2 = 0.005  # Second spike contribution
triplet_stdp_tau = 20.0  # Time constant

# Hebbian plasticity settings
hebbian_learning_rate = 0.01
hebbian_window_size = 100.0  # ms

# Structural plasticity settings
synaptogenesis_rate = 0.001
pruning_rate = 0.0001
structural_plasticity_enabled = true

# Homeostatic plasticity settings
homeostatic_enabled = true
homeostatic_target_weight = 0.5
homeostatic_regulation_rate = 0.01

# Neuromodulation settings
dopamine_baseline = 0.1
curiosity_enabled = true
novelty_enabled = true
prediction_error_enabled = true
reward_discount_factor = 0.95

# Development settings
enable_development = true
development_stage = CriticalPeriod
development_synaptogenesis_boost = 2.0
development_pruning_reduction = 0.5

# Environment settings
environment_name = Continuous2D
environment_width = 50
environment_height = 50
vision_width = 32
vision_height = 32

# Learning settings
max_simulation_steps = 50000
simulation_time_limit = 100.0  # seconds

# Learning episode settings
episode_length = 1000
episode_reward_threshold = 10.0

# Performance settings
enable_checkpointing = true
checkpoint_interval = 5000
checkpoint_file = "checkpoints/nlm_checkpoint"
enable_replay = true
replay_memory_size = 1000
replay_beta = 0.1

# Visualization
visualization_enabled = true
visualization_update_rate = 30.0
visualization_frame_rate = 10

# Logging settings
log_level = INFO
log_to_file = true
log_filename = "logs/nlm_advanced.log"
log_metrics = true
log_episodes = true

# Agent settings
agent_start_x = 25.0
agent_start_y = 25.0
agent_max_energy = 200.0
agent_energy_decay = 0.005
agent_health_regeneration = 0.1

# Reward shaping
reward_function = "normalized"
reward_ex exploration_bonus = 5.0
reward_novelty_bonus = 2.0
reward_consistency = 0.8

# Exploration settings
epsilon_greedy = 0.1
temperature = 1.0
exploration_decay = 0.995

# Monitoring and evaluation
eval_frequency = 100
performance_threshold = 0.8
