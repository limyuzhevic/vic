# NLM Configuration - Fast Simulation
# Optimized for speed and performance testing

# Basic Brain Configuration
neuron_count=200          # Medium size for balanced speed/performance
region_count=2             # Few regions for less connectivity
connection_probability=0.1 # Moderate density
random_seed=999            # Fixed seed

# Simulation Parameters
simulation_timestep=0.01    # Larger timestep for faster simulation
max_steps=2000             # Fewer steps due to larger timestep

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-65.0              # Reset membrane potential (mV)
v_thresh=-55.0             # Threshold potential (mV)

# STDP (optimized for speed)
stdp_ltp_weight=0.02       # Higher weight for fast simulation
stdp_ltd_weight=0.025      # Higher weight for fast simulation
stdp_tau=10.0              # Very short time constant

# Memory Systems (limited for speed)
working_memory_capacity=20   # Smaller capacity
episodic_memory_max_episodes=200 # Fewer episodes

# Development (simplified)
enable_development=false   # Disable for speed
plasticity_decay_rate=0.0 # No decay for stability

# Checkpoint System (disabled for speed)
checkpoint_dir=./checkpoints   # Directory for checkpoints (but not used)
checkpoint_interval=10000    # Infrequent checkpoints
max_checkpoints=5           # Few checkpoints

# Logging (minimal for speed)
log_level=ERROR           # Only errors
log_file=nlm_fast_simulation.log # Log file (but rarely written)
verbose_output=false      # No verbose output

# Environment (simple)
env_width=5                # Very small environment
env_height=5              # Very small environment

# Experimental Parameters (speed-focused)
exploration_rate=0.0       # No exploration (pure exploitation)
exploitation_rate=1.0     # Maximum exploitation
reward_scale=1.0          # Standard scaling
exploration_bonus=0.0     # No exploration bonus

# Performance (optimized for speed)
enable_multithreading=false # Single-threaded for simplicity
thread_count=1           # One thread
enable_simd=true         # SIMD optimizations
use_memory_pool=true     # Memory pooling for efficiency

# Note: This configuration is for rapid testing and benchmarking
# Results may differ from slower, more detailed configurations
