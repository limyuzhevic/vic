# NLM Configuration File
# Default configuration for NLM (Neural Learning Machine)
# This configuration uses the new flat key system for better readability and
# also supports legacy keys with dot notation for full compatibility.

# ===== BRAIN CONFIGURATION =====
neuron_count = 1000
connection_probability = 0.05
initial_weight_mean = 0.5
initial_weight_std = 0.1

# ===== PLASTICITY CONFIGURATION =====
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.hebbian.enable = true
plasticity.structural.enable = true
synaptogenesis_rate = 0.0001
pruning_rate = 0.000001

# ===== NEUROMODULATION CONFIGURATION =====
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true

# ===== MEMORY CONFIGURATION =====
memory.working_capacity = 100
memory.episodic.max_episodes = 1000
memory.associative.pheromone_decay = 0.1

# ===== DEVELOPMENT CONFIGURATION =====
development.stage = 4
development.initial_plasticity = 1.0
development.critical_period_start = 100
development.critical_period_end = 500

# ===== WORLD CONFIGURATION =====
world.width = 20
world.height = 20
world.vision_width = 8
world.vision_height = 8
world.max_energy = 100.0

# ===== SIMULATION CONFIGURATION =====
simulation.timestep = 0.001
simulation.max_steps = 10000
simulation.replay_interval = 100
simulation.consolidation_interval = 1000

# ===== LEGACY KEYS (FOR BACKWARD COMPATIBILITY) =====
# These keys maintain compatibility with older configurations
brain.neuron_count = 1000
brain.synapse_density = 0.1
brain.connection_probability = 0.05
brain.v_thresh = -50.0
brain.v_rest = -70.0
brain.v_reset = -75.0
brain.tau_mem = 20.0
brain.tau_ref = 2.0

# ===== CONFIGURATION NOTES =====
# 
# This configuration demonstrates the new flat key system while maintaining
# full backward compatibility with legacy configurations.
#
# Key Benefits of Flat Keys:
# 1. Easier to read and understand
# 2. Less error-prone than long nested keys
# 3. Better autocompletion support in editors
# 4. Consistent with modern configuration systems
#
# Legacy Keys Still Supported:
# - brain.neuron_count (legacy) vs neuron_count (flat)
# - brain.synapse_density (legacy) vs synapse_density (flat)
# - brain.connection_probability (legacy) vs connection_probability (flat)
#
# Configuration Categories:
# - BRAIN: Neural system parameters
# - PLASTICITY: Learning and adaptation rules
# - NEUROMODULATION: Motivational and arousal systems
# - MEMORY: Storage and retrieval systems
# - DEVELOPMENT: Maturation and plasticity changes
# - WORLD: Environmental interaction parameters
# - SIMULATION: Computational settings
#
# Usage Examples:
# nlm --config=configs/development.cfg
# nlm --config=configs/performance.cfg
# nlm --config=configs/debug.cfg

# ===== END OF DEVELOPMENT CONFIGURATION =====
