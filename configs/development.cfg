# Development Configuration Profile
# Optimized for development and debugging
# Maximum logging, slow simulation, safe defaults

# Random seed for debugging
random_seed = 1

# Simulation timestep in seconds (slow for debugging)
simulation_timestep = 0.1

# Number of neurons (small for fast iteration)
neuron_count = 100

# Number of brain regions (small for focused debugging)
region_count = 1

# Connection probability (lower for predictable behavior)
connection_probability = 0.05

# Plasticity settings (small for controlled experiments)
plasticity_learning_rate = 0.001
stdp_ltp_weight = 0.005
stdp_ltd_weight = 0.006
stdp_time_constant = 30.0

# Development settings (very slow for observation)
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings (muted)
dopamine_baseline = 0.0

# Reward settings (sensitive)
reward_discount_factor = 0.99

# Environment settings (small)
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings (maximum detail)
log_level = DEBUG
log_to_file = true
log_filename = development_nlm.log

# Simulation settings (short for quick testing)
max_simulation_steps = 1000
simulation_time_limit = 0.0

# Visualization (enabled for detailed observation)
visualization_enabled = true
visualization_update_rate = 10.0