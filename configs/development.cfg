# NLM Configuration Files
# Quality configuration templates for different use cases

# ============================================
# Development Configuration
# ============================================

# Development environment with frequent testing and debugging
# Lower neuron count for faster iteration

random_seed = 12345
simulation_timestep = 0.001
neuron_count = 200
region_count = 1
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.03
stdp_ltd_weight = 0.025
stdp_time_constant = 20.0

# Development settings
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002

# Neuromodulation settings
dopamine_baseline = 0.15

# Reward settings
reward_discount_factor = 0.95

# Environment settings
environment_name = GridWorld
environment_width = 15
environment_height = 15

# Logging settings
log_level = DEBUG
log_to_file = true
log_filename = nlm_development.log

# Simulation settings
max_simulation_steps = 5000
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = true
visualization_update_rate = 10.0
