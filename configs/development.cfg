# NLM Configuration File - Development-Focused
# Configuration optimized for studying developmental trajectories

# Core simulation parameters
neuron_count = 800
max_steps = 5000
region_count = 2
connection_probability = 0.1

# Plasticity rules with developmental emphasis
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.01
stdp_tau = 25.0
synaptogenesis_rate = 0.0003
pruning_rate = 0.00001

# Memory systems
replay_interval = 150
consolidation_interval = 1500
max_episodes = 2000

# Enhanced development
enable_development = true
development_rate = 2.0

# Checkpointing
enable_checkpointing = true
checkpoint_dir = ./checkpoints_dev
checkpoint_interval = 1000

# Strong neuromodulation for developmental exploration
enable_curiosity = true
enable_novelty = true

# Logging
log_level = INFO
log_to_file = true
log_file = ./nlm_development.log