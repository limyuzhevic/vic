# NLM Configuration Template
# Development/Training Configuration
# Optimized for learning and development

# Random seed for reproducible experiments
random_seed = 123

# Simulation timestep in seconds (smaller = more precise)
simulation_timestep = 0.0005

# Number of neurons in the brain
neuron_count = 1500

# Number of brain regions
region_count = 3

# Connection probability for random connectivity
connection_probability = 0.08

# Plasticity settings (higher rates for faster learning)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.018
stdp_time_constant = 25.0

# Development settings (aggressive development for learning)
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0003

# Neuromodulation settings
 dopamine_baseline = 0.0
dopamine_baseline = 0.5  # Higher baseline for more motivation

# Reward settings
reward_discount_factor = 0.98  # Standard discount factor

# Environment settings
environment_name = GridWorld
environment_width = 30
environment_height = 30

# Logging settings
log_level = DEBUG
log_to_file = true
log_filename = development_nlm.log

# Simulation settings (more steps for longer learning)
max_simulation_steps = 5000
simulation_time_limit = 0.0

# Visualization settings (enabled for development monitoring)
visualization_enabled = true
visualization_update_rate = 15.0

# Development stage tracking
enable_developmental_stages = true
critical_period_start = 1000
critical_period_end = 3000