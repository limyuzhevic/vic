# NLM Development Configuration
# Optimized for debugging, development, and experimentation

# Random seed for reproducible experiments
random_seed = 12345

# Simulation timestep in seconds (finer resolution for debugging)
simulation_timestep = 0.0001

# Number of neurons in the brain (reasonable size for development)
neuron_count = 200

# Number of brain regions (multiple regions for exploration)
region_count = 2

# Connection probability for random connectivity (balanced)
connection_probability = 0.1

# Plasticity settings (standard for development)
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
plasticity_learning_rate = 0.01

# Structural plasticity settings (enabled for development exploration)
synaptogenesis_rate = 0.001
pruning_rate = 0.0001

# Neuromodulation settings (full for development)
dopamine_baseline = 0.1
dopa_shift = 0.5
dopa_weight = 1.0

# Reward settings (standard)
reward_discount_factor = 0.99
reward_window = 10.0

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging settings (verbose for development)
log_level = DEBUG
log_to_file = true
log_filename = nlm_dev.log
log_detailed = true

# Simulation settings (longer for thorough testing)
max_simulation_steps = 5000
simulation_time_limit = 0.0
enable_checkpoints = true
checkpoint_interval = 1000

# Visualization settings (enabled for development)
visualization_enabled = true
visualization_update_rate = 30.0
enable_progress_logging = true
progress_log_interval = 100

# Neural dynamics settings (sensitive for exploration)
neuron_threshold = -55.0
neuron_rest_potential = -70.0
neuron_reset_potential = -75.0
membrane_time_constant = 20.0
refractory_period = 2.0

# Memory system settings (larger for exploration)
working_memory_capacity = 100
episodic_memory_capacity = 500
associative_memory_strength = 0.5

# Prediction system settings (full for development)
prediction_horizon = 20
prediction_confidence_threshold = 0.7

# Neuromodulation settings (full for development)
curiosity_scaling = 1.0
novelty_threshold = 0.5
prediction_error_decay = 0.1

# Development stages (realistic for development)
development_start_time = 0.0
development_end_time = 100.0
development_stage_duration = 20.0

# Experiment settings (development optimized)
enable_stdp = true
enable_hebbian = true
enable_structural = true
enable_curiosity = true
enable_novelty = true
enable_prediction = true
enable_planning = true
enable_concept_formation = true
enable_attention = true
enable_development = true

# Debugging settings
enable_debug_logging = true
debug_break_on_error = true
debug_log_all_spikes = true
debug_log_all_weights = false