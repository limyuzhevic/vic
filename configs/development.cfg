# NLM Configuration Template - Development Mode
# Fast development configuration with moderate settings
# 
# Basic performance settings
random_seed = 42
simulation_timestep = 0.001

# Memory settings (moderate)
memory.workingMemoryCapacity = 100.0
memory.episodicConsolidationRate = 0.1
memory.associativeStrengthDecay = 0.95
memory.episodicDecayRate = 0.99

# Neuromodulation settings (baseline)
neuromodulation.dopamineBaseline = 0.5
neuromodulation.dopamineNoise = 0.1
neuromodulation.noveltyThreshold = 0.7
neuromodulation.curiosityLevel = 0.8
neuromodulation.explorationRate = 0.3

# Cognitive settings (moderate planning depth)
cognitive.planningDepth = 2
cognitive.conceptFormationThreshold = 0.6
cognitive.attentionDecayRate = 0.98
cognitive.workingMemoryDecayRate = 0.95
cognitive.activationThreshold = 0.1

# Prediction settings (moderate learning)
prediction.confidenceThreshold = 0.8
prediction.learningRate = 0.05
prediction.decayRate = 0.99
prediction.noise = 0.05

# Development settings (moderate plasticity)
development.plasticityRate = 0.5
development.stage = 0.5
development.explorationPhaseDuration = 100.0
development.learningPhaseDuration = 1000.0
development.enablePhaseTransitions = true

# Integration settings (moderate coupling)
integration.corticalCorticalCoupling = 0.7
integration.corticalSubcorticalCoupling = 0.6
integration.feedbackStrength = 0.7
integration.predictionErrorGain = 1.0
integration.learningRate = 0.05

# Debug settings (enabled for development)
debug.enabled = true
debug.level = "info"

# Performance settings (moderate optimization)
performance.optimizationLevel = 1
performance.maxMemoryUsage = 512
performance.maxSimulationSteps = 10000
