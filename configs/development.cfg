# NLM Configuration File
# Development preset - Developmental stages with synaptogenesis and pruning

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 800

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.12

# Plasticity settings
plasticity_learning_rate = 0.01
plasticity_stdp_enable = true
plasticity_hebbian_enable = true
plasticity_structural_enable = true

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_critical_period = 100

# Maximum simulation steps
max_simulation_steps = 10000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_development.log

# Enable development simulation
development_simulation_enabled = true
