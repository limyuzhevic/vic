# NLM Advanced Configuration File
# This is the advanced configuration for Phase 6: Final Integration
# Enhanced with comprehensive features and improvements

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
reward_plasticity_strength = 0.01
homeostatic_plasticity_rate = 0.001

# Development settings
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
development_initial_plasticity = 1.0
development_critical_period_end = 0.3
development_maturation_rate = 0.01

# Neuromodulation settings
dopamine_baseline = 0.1
dopamine_learning_rate = 0.05
dopamine_time_constant = 100.0
curiosity_strength = 0.5
curiosity_decay_rate = 0.95
novelty_threshold = 0.7
novelty_sensitivity = 1.0
prediction_error_alpha = 0.1

# Reward settings
reward_discount_factor = 0.99
reward_prediction_error_enabled = true
reward_plasticity_enabled = true

# Environment settings
environment_name = GridWorld
environment_width = 10
environment_height = 10
environment_reset_on_episode_end = true

# Memory settings
working_memory_capacity = 1000
episodic_memory_capacity = 10000
associative_memory_size = 5000
replay_interval = 100
consolidation_interval = 1000
novelty_threshold = 0.5

# Advanced neural dynamics settings
enable_hnn = true
enable_hodgkin_huxley = true
enable_fitzhugh_nagumo = true
custom_neuron_parameters = false
neural_dynamics_mode = "integrated"

# Enhanced plasticity settings
stdp_implementation = "full"
hebbian_implementation = "extended"
reward_modulated_plasticity = true
homeostatic_plasticity = true
metaplasticitry_enabled = true

# Advanced memory systems
working_memory_implementation = "competitive"
episodic_memory_implementation = "replay"
associative_memory_implementation = "binding"
memory_optimization_enabled = true

# Cognitive enhancement settings
attention_enabled = true
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5
planning_enabled = true
planning_depth = 5
concept_formation_enabled = true
concept_min_samples = 100
concept_similarity_threshold = 0.7

