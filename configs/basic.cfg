# NLM Configuration File
# Basic preset - Simple neuron dynamics

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 500

# Number of brain regions
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings
plasticity_learning_rate = 0.01
plasticity_stdp_enable = true
plasticity_hebbian_enable = true
plasticity_structural_enable = false

# Maximum simulation steps
max_simulation_steps = 1000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_basic.log

# Enable basic simulation
basic_simulation_enabled = true
