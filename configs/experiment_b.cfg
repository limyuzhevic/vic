# NLM Configuration File - Experiment B
# Large-scale performance experiment

# Core simulation parameters
neuron_count = 2000
max_steps = 10000
region_count = 2
connection_probability = 0.06

# Plasticity rules
stdp_ltp_weight = 0.009
stdp_ltd_weight = 0.013
synaptogenesis_rate = 0.00005
pruning_rate = 0.000002

# Memory systems
replay_interval = 200
consolidation_interval = 2000
max_episodes = 5000

# Development
enable_development = true
development_rate = 1.5

# Checkpointing with compression
enable_checkpointing = true
checkpoint_dir = ./checkpoints_b
checkpoint_interval = 2000
max_checkpoints = 20
compress_checkpoints = true

# Neuromodulation
enable_curiosity = true
enable_novelty = true

# Logging
log_level = WARNING
log_to_file = true
log_file = ./nlm_experiment_b.log