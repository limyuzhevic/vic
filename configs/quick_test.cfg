# Configuration for NLM Phase 6 Integration Demo - Quick Test

## Overview

This configuration is optimized for quick testing and development. It uses smaller parameters for rapid iteration and debugging.

## Configuration Summary

- **neuron_count**: 100 (smaller for speed)
- **region_count**: 1 (single region for simplicity)
- **connection_probability**: 0.1 (fewer connections)
- **replay_interval**: 20 (very frequent replay)
- **consolidation_interval**: 200 (frequent consolidation)
- **Memory capacity**: Smaller for fast testing

## Configuration

```ini
# Quick test configuration for Phase 6 integration demo
# Optimized for rapid testing and development

[simulation]
neuron_count = 100
region_count = 1
connection_probability = 0.1
random_seed = 999
simulation_timestep = 0.001

[plasticity]
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.000001

[memory]
working_memory_capacity = 10
episodic_memory_max_episodes = 100
consolidation_strength = 0.2

[development]
enable_development = true
development_stage = Initial
initial_plasticity = 1.0
critical_period_start = 50
critical_period_end = 150
maturation_start = 300

[neuromodulation]
enable_reward_modulation = true
enable_curiosity = true
enable_novelty = true
dopamine_sensitivity = 0.6
curiosity_sensitivity = 0.5
novelty_sensitivity = 0.4

[demo]
replay_interval = 20
consolidation_interval = 200
enable_checkpointing = false
```
