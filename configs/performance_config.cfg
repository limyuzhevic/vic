# NLM Performance Configuration
# This is a performance configuration for NLM

# Core configuration
neuron_count = 2000
region_count = 3
connection_probability = 0.2
simulation_timestep = 0.0005

# Performance configuration
max_simulation_steps = 100000
simulation_time_limit = 50.0
visualization_enabled = true
visualization_update_rate = 60.0

# Multi-threading
enable_multithreading = true
num_threads = 8
thread_pool_size = 4

# Memory management
enable_memory_optimization = true
memory_pool_size = 104857600
enable_memory_profiling = true

# Cache management
enable_cache_optimization = true
cache_size = 1048576
cache_line_size = 64

# I/O optimization
enable_io_optimization = true
buffer_size = 4096

# Logging configuration
log_level = INFO
log_to_file = true
log_filename = performance.log
log_max_size = 104857600
log_rotation = 5

# Performance monitoring
monitor_cpu = true
monitor_memory = true
monitor_network = true
monitor_disk = true

# Performance analysis
analyze_cpu_usage = true
analyze_memory_usage = true
analyze_network_usage = true
analyze_disk_usage = true

# Performance optimization
enable_optimization = true
optimization_level = 3
optimization_threshold = 0.1