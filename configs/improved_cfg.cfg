# NLM Configuration File
# Example configuration for NLM Phase 2 Real Neural Computation
# Supports: JSON, YAML, and simple key=value formats

# =============================================================================
# Core Brain Configuration
# =============================================================================

# Random seed for reproducible results
random_seed = 42

# Simulation timestep in seconds (default: 0.001)
simulation_timestep = 0.001

# Number of neurons in the brain (default: 500)
neuron_count = 500

# Number of neural regions (default: 1)
region_count = 1

# Connection probability for random connectivity (default: 0.15)
connection_probability = 0.15

# =============================================================================
# Plasticity Configuration
# =============================================================================

# STDP (Spike-Timing-Dependent Plasticity) parameters
stdp_ltp_weight = 0.02        # Long-term potentiation weight
stdp_ltd_weight = 0.015       # Long-term depression weight
stdp_tau = 20.0               # STDP time constant (ms)

# Structural plasticity parameters
synaptogenesis_rate = 0.0001  # Rate of new synapse formation
pruning_rate = 0.00001        # Rate of synapse elimination

# =============================================================================
# Development Configuration
# =============================================================================

# Developmental stages affect plasticity rates
development_plasticity_multiplier = 1.0

# =============================================================================
# Neuromodulation Configuration
# =============================================================================

# Neuromodulators affect neural excitability and plasticity
dopamine_effect = 1.0
 norepinephrine_effect = 1.0
 serotonin_effect = 1.0
curiosity_baseline = 0.1
novelty_sensitivity = 0.5

# =============================================================================
# Command-line Arguments Override
# =============================================================================
# Values set via command line take precedence over file values

# Example usage:
# nlm --config my_config.cfg --plasticity-current 40.0 --plasticity-steps 500
# nlm --generate-config  # Creates this example file
# nlm --help            # Shows all available options

# =============================================================================
# Testing Parameters (for Phase 2 experiments)
# =============================================================================

# These values are typically set via command line for reproducible experiments
test_connectivity_current = 50.0
 test_plasticity_current = 30.0
test_stdp_current = 60.0

test_plasticity_steps = 1000
test_stdp_trials = 50
