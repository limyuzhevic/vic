# NLM Configuration File - Experiment A
# Small-scale developmental experiment

# Core simulation parameters
neuron_count = 200
max_steps = 1000
region_count = 1
connection_probability = 0.08

# Plasticity rules
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.01
synaptogenesis_rate = 0.0002
pruning_rate = 0.00005

# Memory systems
replay_interval = 50
consolidation_interval = 500
max_episodes = 500

# Development
enable_development = true
development_rate = 0.8

# Checkpointing
enable_checkpointing = true
checkpoint_dir = ./checkpoints_a
checkpoint_interval = 500

# Neuromodulation
enable_curiosity = true
enable_novelty = true

# Logging
log_level = INFO
log_to_file = true
log_file = ./nlm_experiment_a.log