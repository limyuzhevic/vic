# Simple test configuration file for NLM
# This can be used for testing the new CLI and test framework

# Basic neural parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 100
region_count = 1
connection_probability = 0.15f

# Plasticity parameters
stdp_ltp_weight = 0.02f
stdp_ltd_weight = 0.015f
stdp_tau = 20.0f
synaptogenesis_rate = 0.0001f
pruning_rate = 0.00001f

# Neuron parameters
leak_conductance = 0.5f
threshold = -55.0f
resting_potential = -70.0f
reset_potential = -65.0f
refractory_period = 5
max_membrane_potential = 50.0f
min_membrane_potential = -100.0f

# Logging configuration
log_level = info
verbose_logging = false
quiet_mode = false

# Performance settings
max_memory_mb = 1024
timeout_seconds = 300.0
