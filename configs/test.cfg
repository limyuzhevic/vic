# NLM Test Configuration
# Configuration file for neural network experiments and benchmarks

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Default number of neurons for basic tests
neuron_count = 500

# Number of brain regions for connectivity tests
region_count = 1

# Connection probability for random connectivity
connection_probability = 0.15

# Plasticity settings for learning experiments
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0

# Development settings for structural plasticity
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Neuromodulation settings
 dopamine_baseline = 0.0
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings for integrated experiments
environment_name = SimpleWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_test.log

# Benchmark settings
benchmark_max_steps = 1000
benchmark_neuron_counts = 100,500,1000,2000

# Experiment settings
experiment_max_steps = 2000
experiment_plasticity_steps = 1000
experiment_stdp_trials = 50

# Advanced options
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
enable_prediction = true

# Debug settings
debug_neurons = 0,10,50,100
enable_detailed_logging = false