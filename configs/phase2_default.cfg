# NLM Phase 2 Configuration File
# This file contains the default configuration parameters for NLM Phase 2
# 
# These values can be overridden by command line arguments or environment variables

[random_seed]
# Random seed for reproducible simulations. Set to current time if 0 or not set.
random_seed = 42

[simulation]
# Simulation timestep in seconds (e.g., 0.001 = 1ms)
simulation_timestep = 0.001

[network]
# Total number of neurons in the network
neuron_count = 500
# Number of neural regions
region_count = 1
# Probability of connection between neurons (0.0 to 1.0)
connection_probability = 0.15

[stdp]
# Spike-Timing Dependent Plasticity parameters
stdp_ltp_weight = 0.02      # Long-term potentiation weight
stdp_ltd_weight = 0.015     # Long-term depression weight
stdp_tau = 20.0             # STDP time constant (ms)

[structural_plasticity]
# Structural plasticity parameters
synaptogenesis_rate = 0.0001    # Rate of new synapse formation per timestep
pruning_rate = 0.00001          # Rate of synapse elimination per timestep

[neuron]
# Neuron model parameters
neuron_threshold = -55.0        # Membrane potential threshold for firing (mV)
neuron_reset_potential = -70.0  # Membrane potential after spike (mV)
neuron_resting_potential = -70.0  # Resting membrane potential (mV)
neuron_time_constant = 20.0     # Membrane time constant (ms)
neuron_refractory_period = 2.0   # Refractory period after spike (ms)

[plasticity]
# General plasticity parameters
hebbian_learning_rate = 0.001    # Hebbian learning rate
enable_stdp = true              # Enable STDP learning
enable_hebbian = true           # Enable Hebbian learning
enable_reward_modulated = false  # Enable reward-modulated plasticity

[test]
# Test-specific parameters
basic_connectivity_steps = 50    # Steps for connectivity test
plasticity_experiment_steps = 1000  # Steps for plasticity experiment
stdp_verification_trials = 50    # Trials for STDP verification
