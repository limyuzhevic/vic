# NLM Phase 6 Integration Configuration
# 
# This configuration file contains recommended parameters for Phase 6 integration testing.
# It provides a balance between simulation completeness and computational efficiency.

# ==============================================================================
# BASIC CONFIGURATION
# ==============================================================================

# Number of neurons in the simulation
# Range: 100 - 10000
# Higher values provide more realistic brain dynamics but require more computation
brain.neuron_count = 500

# Number of brain regions (distinct neural populations)
# Range: 1 - 10
# More regions enable more complex functionality and integration
brain.region_count = 4

# Connection probability between neurons
# Range: 0.01 - 0.20
# Higher values create more densely connected networks
brain.connection_probability = 0.08f

# ==============================================================================
# NEURON PARAMETERS
# ==============================================================================

# Neuron threshold potential (in mV)
# Below this potential, neuron does not spike
brain.v_thresh = -50.0f

# Resting potential (in mV)
# The potential the neuron returns to between spikes
brain.v_rest = -70.0f

# Reset potential (in mV)
# The potential immediately after a spike
brain.v_reset = -75.0f

# Membrane time constant (in ms)
# How quickly the neuron integrates inputs
brain.tau_mem = 20.0f

# Refractory period (in ms)
# Period after a spike during which the neuron cannot spike again
brain.tau_ref = 2.0f

# ==============================================================================
# SYNAPTIC PARAMETERS
# ==============================================================================

# Initial synaptic weight mean
# Starting value for new synaptic connections
brain.initial_weight_mean = 0.5f

# Initial synaptic weight standard deviation
# Variability in initial synaptic strengths
brain.initial_weight_std = 0.1f

# ==============================================================================
# PLASTICITY PARAMETERS
# ==============================================================================

# STDP (Spike-Timing-Dependent Plasticity) configuration

# STDP Long-Term Potentiation (LTP) weight
# Weight change when pre-synaptic spike occurs before post-synaptic spike
plasticity.stdp.ltp_weight = 0.02f

# STDP Long-Term Depression (LTD) weight  
# Weight change when post-synaptic spike occurs before pre-synaptic spike
plasticity.stdp.ltd_weight = 0.015f

# STDP time constant (in ms)
# How long the STDP effect lasts
plasticity.stdp.tau = 20.0f

# Hebbian learning configuration

# Hebbian learning rate
# Weight update based on correlated activity
plasticity.hebbian.learning_rate = 0.001f

# Structural plasticity configuration

# Synaptogenesis rate
# Probability of forming new synaptic connections per timestep
plasticity.structural.synaptogenesis_rate = 0.0001f

# Pruning rate
# Probability of eliminating existing synaptic connections per timestep
plasticity.structural.pruning_rate = 0.00001f

# ==============================================================================
# NEUROMODULATION PARAMETERS
# ==============================================================================

# Dopamine modulation scale
# Strength of reward-based modulation
neuromod.dopamine.scale = 1.0f

# Curiosity configuration

# Curiosity enable flag
# Whether curiosity-driven exploration is enabled
neuromod.curiosity.enable = true

# Curiosity rate (0.0 - 1.0)
# How quickly curiosity drives exploration
neuromod.curiosity.rate = 0.05f

# Novelty detection configuration

# Novelty enable flag
# Whether novelty detection is enabled
neuromod.novelty.enable = true

# Novelty threshold (0.0 - 1.0)
# How different a stimulus must be to be considered novel
neuromod.novelty.threshold = 0.15f

# ==============================================================================
# DEVELOPMENT PARAMETERS
# ==============================================================================

# Development enable flag
# Whether developmental processes are enabled
development.enable = true

# Critical period (in steps)
# Period during which development is especially rapid
#development.critical_period_steps = 1000

# Maturation rate (0.0 - 1.0)
# How quickly the brain matures
development.maturation_rate = 0.01f

# ==============================================================================
# MEMORY PARAMETERS
# ==============================================================================

# Working memory capacity (number of active traces)
memory.working_memory.capacity = 100

# Working memory trace duration (in steps)
memory.working_memory.trace_duration = 1000

# Episodic memory maximum episodes
memory.episodic_memory.max_episodes = 1000

# Episodic memory episode duration (in steps)
memory.episodic_memory.episode_duration = 100

# ==============================================================================
# SIMULATION PARAMETERS
# ==============================================================================

# Simulation timestep (in seconds)
# Integration timestep for the simulation
simulation_timestep = 0.001

# Random seed
# Seed for random number generation
# Use 0 for time-based seed, or specific value for reproducibility
random_seed = 42

# ==============================================================================
# PHASE 6 SPECIFIC SETTINGS
# ==============================================================================

# Phase 6 integration settings

# Enable development during Phase 6
phase6.development.enable = true

# Enable curiosity-driven exploration during Phase 6
phase6.curiosity.enable = true

# Enable novelty detection during Phase 6
phase6.novelty.enable = true

# Enable prediction system during Phase 6
phase6.prediction.enable = true

# Enable cognitive systems during Phase 6
phase6.cognition.enable = true

# Enable replay during Phase 6
phase6.replay.enable = true

# ==============================================================================
# LOGGING AND OUTPUT
# ==============================================================================

# Logging level
# DEBUG, INFO, WARNING, ERROR, CRITICAL
logging.level = "INFO"

# Log file path
logging.file = "nlm_phase6.log"

# Console output enable flag
logging.console.enable = true

# Performance profiling enable flag
performance.profiling.enable = false

# ==============================================================================
# CHECKPOINTING SETTINGS
# ==============================================================================

# Checkpoint enable flag
checkpointing.enable = true

# Checkpoint path
checkpointing.path = "/tmp/nlm_phase6.ckpt"

# Checkpoint compression level
# 0 = none, 1 = fast, 2 = balanced, 3 = best
checkpointing.compression_level = 2

# Checkpoint interval (in steps)
checkpointing.interval_steps = 1000

# Maximum number of checkpoints to keep
checkpointing.max_checkpoints = 5

# ==============================================================================
# ENVIRONMENT SETTINGS
# ==============================================================================

# Environment dimensions (for world simulations)
environment.width = 20
environment.height = 20

# Vision parameters for agent perception
environment.vision_width = 8
environment.vision_height = 8

# ==============================================================================
# MONITORING AND METRICS
# ==============================================================================

# Performance monitoring enable flag
metrics.monitoring.enable = true

# Metrics collection interval (in steps)
metrics.collection_interval = 100

# Enable detailed metrics logging
metrics.detailed_logging = false

# ==============================================================================
# PHASE 6 INTEGRATION TARGETS
# ==============================================================================

# Integration test targets

# Verify memory system integration
test.memory.integration = true

# Verify neuromodulation integration
test.neuromodulation.integration = true

# Verify prediction system integration
test.prediction.integration = true

# Verify development system integration
test.development.integration = true

# Verify checkpointing functionality
test.checkpointing.integration = true

# Verify replay functionality
test.replay.integration = true

# ==============================================================================
# END OF CONFIGURATION FILE
# ==============================================================================

# This configuration file provides a solid foundation for Phase 6 integration testing.
# Adjust parameters as needed for specific use cases or research questions.