# Benchmark Configuration Profile
# Optimized for performance testing
# Minimal configuration, maximum speed

# Random seed for reproducible benchmarks
random_seed = 42

# Simulation timestep in seconds (fixed for benchmarking)
simulation_timestep = 0.001

# Number of neurons (medium for balanced benchmarking)
neuron_count = 1000

# Number of brain regions (moderate)
region_count = 2

# Connection probability (standard)
connection_probability = 0.1

# Plasticity settings (minimal for performance focus)
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (minimal)
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation settings (disabled for pure performance)
dopamine_baseline = 0.0

# Reward settings (simple)
reward_discount_factor = 0.99

# Environment settings (minimal)
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings (none for performance)
log_level = WARNING
log_to_file = false
log_filename = benchmark_nlm.log

# Simulation settings (fixed for benchmarking)
max_simulation_steps = 10000
simulation_time_limit = 0.0

# Visualization (disabled for performance)
visualization_enabled = false
visualization_update_rate = 30.0