# NLM Enhanced Benchmark Configuration
# Configuration file for the enhanced benchmarking system
# This file provides configuration options for benchmark scenarios, monitoring,
# and statistical analysis.

# Benchmark type (0=Performance, 1=Memory, 2=Accuracy, 3=Scalability, 4=Integration, 5=Regression, 6=Comparison, 7=Custom)
benchmark_type = 0

# Performance targets
target_steps_per_second = 10000.0
target_memory_mb = 512.0
target_efficiency = 0.8

# Warmup and measurement parameters
warmup_steps = 100
measurement_steps = 1000
steady_state_steps = 500

# Multi-threading configuration
num_threads = 0  # 0 = auto-detect
enable_parallel = true

# Monitoring configuration
monitor_memory = true
monitor_cpu = true
monitor_events = true
monitor_fragmentation = true

# Export configuration
export_results = false
export_path = results
export_format = csv  # csv, json, or both

# Statistical analysis
compute_statistics = true
compute_regression = true

# Time measurement
wall_clock_time = true
cpu_time_only = false

# Validation
validate_config = true

# Additional benchmark parameters
target_accuracy = 0.95
max_memory_mb = 1024
enable_memory_tracking = true
enable_leak_detection = true
