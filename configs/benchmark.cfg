# NLM Configuration Template
# Benchmark Configuration
# Designed for performance testing and optimization

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain (standard for benchmarking)
neuron_count = 1000

# Number of brain regions
region_count = 3

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings (baseline)
plasticity_learning_rate = 0.001
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Development settings (minimal for focused benchmarking)
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005

# Neuromodulation settings
 dopamine_baseline = 0.0
dopamine_baseline = 0.1

# Reward settings
reward_discount_factor = 0.99

# Environment settings (standard for benchmarking)
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Logging settings
log_level = WARNING
log_to_file = false
log_filename = benchmark_nlm.log

# Simulation settings (standard for benchmarking)
max_simulation_steps = 1000
simulation_time_limit = 0.0

# Visualization settings (disabled for performance)
visualization_enabled = false
visualization_update_rate = 30.0

# Benchmark-specific settings
benchmark_mode = true
warmup_steps = 100  # Steps to ignore for warmup
record_timing_detailed = true
profile_memory_usage = true
enable_all_subsystems = true