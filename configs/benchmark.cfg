# Configuration for NLM Phase 6 Integration Demo - Benchmark

## Overview

This configuration is optimized for benchmarking and performance testing. It uses larger parameters to stress-test the integrated brain systems.

## Configuration Summary

- **neuron_count**: 1000 (higher for performance testing)
- **region_count**: 2 (multiple regions for parallel processing)
- **connection_probability**: 0.2 (more connections)
- **replay_interval**: 50 (frequent replay)
- **consolidation_interval**: 500 (regular consolidation)
- **Memory capacity**: Larger for extended testing

## Configuration

```ini
# Benchmark configuration for Phase 6 integration demo
# Optimized for performance testing and stress testing

[simulation]
neuron_count = 1000
region_count = 2
connection_probability = 0.2
random_seed = 12345
simulation_timestep = 0.001

[plasticity]
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.024
stdp_tau = 15.0
synaptogenesis_rate = 0.00015
pruning_rate = 0.000015

[memory]
working_memory_capacity = 100
episodic_memory_max_episodes = 5000
consolidation_strength = 0.3

[development]
enable_development = true
development_stage = Initial
initial_plasticity = 1.0
critical_period_start = 100
critical_period_end = 300
maturation_start = 500

[neuromodulation]
enable_reward_modulation = true
enable_curiosity = true
enable_novelty = true
dopamine_sensitivity = 0.8
curiosity_sensitivity = 0.6
novelty_sensitivity = 0.7

[demo]
replay_interval = 50
consolidation_interval = 500
enable_checkpointing = true
checkpoint_path = "./benchmark_checkpoints/"
```
