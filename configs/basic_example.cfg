# NLM Configuration File
# Basic configuration for a small neural network simulation

# Core simulation parameters
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1

# Connectivity parameters
connection_probability = 0.15
connection_strength = 0.2

# Plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
hebbian_learning_rate = 0.01

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001
max_synapses = 10000

# Memory parameters
working_memory_capacity = 50
episodic_memory_max_episodes = 500
associative_memory_capacity = 2500

# Neuromodulation parameters
dopamine_baseline = 0.1
curiosity_strength = 1.0
novelty_threshold = 0.5
prediction_error_decay = 0.1

# Development parameters
developmental_stage_duration = 1000
plasticity_decay = 0.01

# Performance tuning
max_steps = 10000
checkpoint_interval = 1000
memory_limit_mb = 1024
max_memory_mb = 2048
thread_count = 1

# Advanced debugging
enable_debug_logging = false
enable_spike_tracing = false
enable_visualization = false
trace_spikes = false
show_synaptic_graphics = false

# File options
config_file = configs/default.cfg
output_file = nlm_results.txt
checkpoint_dir = ./checkpoints

# Logging options
log_level = INFO
log_file = nlm.log
verbose = false

# Experiment options
experiment_mode = auto
test_number = 0
enable_profiling = false
profile_interval = 100
fast_mode = false
