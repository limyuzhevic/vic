{
  "version": "2.0",
  "format": "json",
  "description": "NLM Configuration - Enhanced for Phase 2+",
  
  "defaults": {
    "neuron_count": 1000,
    "region_count": 2,
    "connection_probability": 0.1,
    "simulation_timestep": 0.001,
    "plasticity_learning_rate": 0.01,
    "stdp_ltp_weight": 0.01,
    "stdp_ltd_weight": 0.012,
    "stdp_time_constant": 20.0,
    "development_synaptogenesis_rate": 0.001,
    "development_pruning_rate": 0.0001,
    "dopamine_baseline": 0.1,
    "reward_discount_factor": 0.99,
    "max_simulation_steps": 10000,
    "visualization_update_rate": 30.0,
    "random_seed": 42
  },
  
  "phases": {
    "phase1": {
      "neuron_count": 100,
      "region_count": 1,
      "connection_probability": 0.05,
      "plasticity_learning_rate": 0.005,
      "description": "Phase 1 skeleton and core integration"
    },
    "phase2": {
      "neuron_count": 500,
      "region_count": 1,
      "connection_probability": 0.15,
      "plasticity_learning_rate": 0.01,
      "stdp_ltp_weight": 0.02,
      "stdp_ltd_weight": 0.015,
      "stdp_time_constant": 20.0,
      "synaptogenesis_rate": 0.0001,
      "pruning_rate": 0.00001,
      "description": "Real neural computation with LIF neurons"
    },
    "phase3": {
      "neuron_count": 800,
      "region_count": 2,
      "connection_probability": 0.1,
      "plasticity_learning_rate": 0.01,
      "description": "World interaction and learning"
    },
    "phase4": {
      "neuron_count": 1000,
      "region_count": 3,
      "connection_probability": 0.08,
      "plasticity_learning_rate": 0.01,
      "description": "Complex cognitive mechanisms"
    },
    "phase5": {
      "neuron_count": 1200,
      "region_count": 4,
      "connection_probability": 0.07,
      "plasticity_learning_rate": 0.01,
      "description": "Advanced memory and performance optimizations"
    },
    "phase6": {
      "neuron_count": 500,
      "region_count": 2,
      "connection_probability": 0.15,
      "plasticity_learning_rate": 0.01,
      "description": "Final integration with all systems"
    }
  },
  
  "validation_rules": {
    "neuron_count": {"min": 10, "max": 10000},
    "region_count": {"min": 1, "max": 10},
    "connection_probability": {"min": 0.01, "max": 1.0},
    "simulation_timestep": {"min": 0.0001, "max": 1.0},
    "plasticity_learning_rate": {"min": 0.0001, "max": 1.0},
    "stdp_ltp_weight": {"min": 0.0, "max": 1.0},
    "stdp_ltd_weight": {"min": 0.0, "max": 1.0},
    "stdp_time_constant": {"min": 1.0, "max": 100.0}
  },
  
  "command_line_arguments": [
    {
      "flags": ["--phase", "-p"],
      "description": "Phase to run (1, 2, 3, 4, 5, 6)",
      "type": "string"
    },
    {
      "flags": ["--neurons", "-n"],
      "description": "Number of neurons",
      "type": "int"
    },
    {
      "flags": ["--regions", "-r"],
      "description": "Number of brain regions",
      "type": "int"
    },
    {
      "flags": ["--steps", "-s"],
      "description": "Number of simulation steps",
      "type": "int"
    },
    {
      "flags": ["--timestep", "-t"],
      "description": "Simulation timestep in seconds",
      "type": "float"
    },
    {
      "flags": ["--checkpoint"],
      "description": "Enable checkpointing",
      "type": "bool"
    },
    {
      "flags": ["--checkpoint-path"],
      "description": "Checkpoint file path",
      "type": "string"
    },
    {
      "flags": ["--verbose", "-v"],
      "description": "Enable verbose logging",
      "type": "bool"
    },
    {
      "flags": ["--help", "-h"],
      "description": "Show help information",
      "type": "bool"
    },
    {
      "flags": ["--list-phases"],
      "description": "List available phases and their configurations",
      "type": "bool"
    }
  ],
  
  "advanced_options": {
    "description": "Advanced configuration options for experienced users",
    "options": [
      "plasticity_learning_rate",
      "stdp_ltp_weight",
      "stdp_ltd_weight",
      "stdp_time_constant",
      "synaptogenesis_rate",
      "pruning_rate",
      "dopamine_baseline",
      "reward_discount_factor"
    ]
  }
}
