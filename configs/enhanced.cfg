# NLM Configuration File
# Phase 2: Enhanced Real Neural Computation
# Generated: 2026-10-18

[metadata]
version = "2.0"
phase = "2"
title = "Enhanced NLM Phase 2 Configuration"
author = "NLM Development Team"
description = "Enhanced configuration for NLM Phase 2 with comprehensive parameters"

# Core Simulation Parameters
[simulation.timing]
simulation_timestep = 0.001  # Simulation timestep in seconds
max_simulation_steps = 10000  # Maximum number of simulation steps
simulation_time_limit = 0.0  # Maximum simulation time in seconds (0 = unlimited)

# Brain Topology and Connectivity
[simulation.topology]
neuron_count = 500  # Number of neurons in the brain
region_count = 1  # Number of brain regions
connection_probability = 0.15  # Probability of connection between neurons

# LIF Neuron Model Parameters
[neuron.model]
resting_potential = -0.6  # Resting membrane potential
reset_potential = -0.6  # Membrane potential after spike
threshold = 0.2  # Spike threshold potential

# Neuron Dynamics Parameters
[neuron.dynamics]
membrane_time_constant = 0.01  # Membrane time constant in seconds
refractory_period = 0.002  # Refractory period in seconds

# Plasticity Parameters
[plasticity.stdp]
stdp_ltp_weight = 0.02  # LTP weight change for STDP
stdp_ltd_weight = 0.015  # LTD weight change for STDP
stdp_time_constant = 20.0  # STDP time constant in ms

[plasticity.hebbian]
hebbian_learning_rate = 0.01  # Hebbian learning rate

[plasticity.structural]
synaptogenesis_rate = 0.0001  # Rate of new synapse formation
pruning_rate = 0.00001  # Rate of synapse elimination

# Neuromodulation Parameters
[neuromodulation.dopamine]
dopamine_baseline = 0.0  # Baseline dopamine level
dopamine_sensitivity = 0.5  # Dopamine sensitivity factor

[neuromodulation.reward]
reward_discount_factor = 0.99  # Reward discount factor for temporal difference
reward_scale = 1.0  # Reward scaling factor

# Memory System Parameters
[memory.working]
working_memory_capacity = 1000  # Working memory capacity
working_memory_decay_rate = 0.01  # Working memory decay rate

[memory.episodic]
episodic_memory_capacity = 10000  # Episodic memory capacity
episodic_memory_consolidation_rate = 0.001  # Episodic memory consolidation rate

# Cognitive System Parameters
[cognition.planner]
planning_horizon = 10  # Planning horizon in steps
planning_resolution = 0.1  # Planning resolution

[cognition.concept_formation]
concept_formation_rate = 0.001  # Rate of new concept formation
concept_generalization = 0.8  # Concept generalization factor

# Environment and Interaction Parameters
[environment.world]
environment_name = "GridWorld"  # Name of the environment
environment_width = 20  # Environment width
environment_height = 20  # Environment height

[environment.sensory]
sensory_noise_level = 0.1  # Sensory input noise level
sensory_receptive_field = 5  # Sensory receptive field size

[environment.motor]
motor_output_range = 1.0  # Motor output range
motor_noise_level = 0.05  # Motor output noise level

# Logging and Output Parameters
[logging.level]
log_level = "INFO"  # Log level (DEBUG, INFO, WARNING, ERROR)
log_to_file = false  # Whether to log to file
log_filename = "nlm.log"  # Log file name
log_file_rotation = true  # Enable log file rotation
log_rotation_size = 10485760  # Log file rotation size in bytes (10MB)

[logging.monitoring]
enable_metrics = false  # Enable metrics collection
metrics_file = "metrics.json"  # Metrics output file
metrics_interval = 100  # Metrics collection interval in steps

# Visualization Parameters
[visualization]
visualization_enabled = false  # Enable visualization
visualization_update_rate = 30.0  # Visualization update rate in Hz
visualization_output_format = "png"  # Visualization output format (png, ascii, none)

# Development System Parameters
[development.synaptogenesis]
development_synaptogenesis_rate = 0.0001  # Development synaptogenesis rate

[development.pruning]
development_pruning_rate = 0.00001  # Development pruning rate

[development.maturation]
development_maturation_rate = 0.001  # Development maturation rate

# Experimental and Research Parameters
[experimental.debug]
debug_mode = false  # Enable debug mode
verbose_logging = false  # Enable verbose logging

[experimental.performance]
performance_profile = "release"  # Performance profile (none, release, debug, profile)
parallel_processing = false  # Enable parallel processing

# Experiment Configuration
[experiments]
current_experiment = "full"  # Current experiment mode (full, connectivity, plasticity, stdp, custom)
custom_experiment_steps = 1000  # Custom steps for experiments

# Performance Monitoring
[performance]
enable_performance_monitoring = true  # Enable performance monitoring
performance_monitor_interval = 1000  # Performance monitoring interval in steps
