# NLM Configuration - Small Network
# Optimized for fast testing and development

# Basic Brain Configuration
neuron_count=100          # Small network for quick testing
region_count=1            # Single region for simplicity
connection_probability=0.2 # Higher density for small networks
random_seed=42            # Fixed seed for reproducibility

# Simulation Parameters
simulation_timestep=0.001   # Simulation timestep in milliseconds
max_steps=5000             # Fewer steps for faster testing

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-65.0              # Reset membrane potential (mV)
v_thresh=-55.0             # Threshold potential (mV)

# STDP (Spike-Timing-Dependent Plasticity)
stdp_ltp_weight=0.015      # Higher weight for small networks
stdp_ltd_weight=0.018      # Higher weight for small networks
stdp_tau=15.0              # Shorter time constant

# Memory Systems (smaller for quick testing)
working_memory_capacity=10   # Reduced working memory capacity
episodic_memory_max_episodes=100 # Fewer episodes stored

# Development
enable_development=true    # Enable developmental stages
plasticity_decay_rate=0.03 # Faster decay for developmental timeline

# Logging
log_level=WARNING         # Reduced logging for speed
verbose_output=false      # Minimal output

# Environment (small)
env_width=10               # Smaller environment
env_height=10             # Smaller environment

# Experimental Parameters (adjusted for scale)
exploration_rate=0.5       # Higher exploration in small networks
exploitation_rate=0.5     # Balanced exploration/exploitation
reward_scale=1.0          # Standard reward scaling
