# Neural Network Configuration - YAML Format
# Generated by NLM advanced configuration tools

name: Example Neural Network
description: A simple example neural network configuration

parameters:
  neuron_count: 1000
  region_count: 10
  connection_probability: 0.15
  simulation_timestep: 0.001

plasticity:
  stdp:
    ltp_weight: 0.02
    ltd_weight: 0.015
    tau: 20.0
  hebbian:
    learning_rate: 0.01

neuromodulation:
  reward:
    baseline_dopamine: 0.1
    prediction_gain: 2.0
  curiosity:
    exploration_rate: 0.05
    novelty_threshold: 0.8

memory:
  working_memory:
    capacity: 100
    decay_rate: 0.9
  episodic_memory:
    max_episodes: 1000
    compression: true

environment:
  type: simulated
  dimensions:
    width: 100
    height: 100
    depth: 10
  obstacles: false
  rewards:
    step_penalty: -0.01
    goal_reward: 100.0

experiment:
  type: learning_experiment
  duration: 1000
  evaluation_metric: learning_rate
  metrics:
    - spike_count
    - weight_change
    - firing_rate
