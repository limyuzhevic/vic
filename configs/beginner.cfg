# NLM Configuration File - Beginner/Quick Start Template
# Simple configuration for learning and testing NLM functionality

# =============================================================================
# SIMPLIFIED SIMULATION PARAMETERS
# =============================================================================

# Small, fast simulation for quick testing
random_seed = 42
simulation_timestep = 0.001
neuron_count = 100    # Small for fast execution
region_count = 1      # Single region for simplicity
connection_probability = 0.2  # Moderate connectivity

# =============================================================================
# BASIC NEURAL PARAMETERS
# =============================================================================

# Standard neuron parameters
resting_potential = -70.0
threshold = -55.0
reset_potential = -70.0
refractory_period = 5

# =============================================================================
# BASIC PLASTICITY
# =============================================================================

# Simple plasticity setup
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012

# =============================================================================
# BASIC NEUROMODULATION
# =============================================================================

# Simple neuromodulation
dopamine_baseline = 0.1
novelty_threshold = 0.05

# =============================================================================
# SIMPLE ENVIRONMENT
# =============================================================================

environment_name = GridWorld
environment_width = 10
environment_height = 10
vision_width = 8
vision_height = 8

# =============================================================================
# MINIMAL LOGGING
# =============================================================================

log_level = INFO
log_to_file = false

# =============================================================================
# SHORT SIMULATION
# =============================================================================

max_simulation_steps = 1000

# This configuration is ideal for:
# - Learning NLM basics
# - Quick testing and debugging
# - Getting started with the framework
# - Performance profiling
