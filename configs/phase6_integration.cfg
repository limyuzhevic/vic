# NLM Phase 6 Integration Configuration
# Enhanced configuration for Phase 6 integrated brain experiments

# Basic experiment settings
experiment_type = Phase6Integration
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
max_steps = 2000

# Memory systems configuration
working_memory_capacity = 50  # Number of working memory traces
episodic_memory_max_episodes = 100
associative_memory_strength = 0.8

# Prediction system configuration
prediction_horizon = 10
prediction_confidence_threshold = 0.7
prediction_error_threshold = 0.1

# Neuromodulation configuration
dopamine_baseline = 0.5
dopamine_sensitivity = 0.8
dopamine_plasticity_scaling = 1.2
curiosity_baseline = 0.3
curiosity_increment = 0.1
novelty_threshold = 0.5

# Development configuration
developmental_stage_transition_rate = 0.05
plasticity_modifier_strength = 0.3
structural_plasticity_enabled = true

# Reward and learning configuration
reward_discount_factor = 0.95
reward_learning_rate = 0.01
exploration_bonus = 0.1

# Experimental parameters
checkpoint_interval = 1000
checkpoint_path = ./checkpoints/phase6_checkpoint
replay_enabled = true
replay_interval = 100
replay_strength = 0.7

# Logging and output
log_level = INFO
log_to_file = true
log_filename = phase6_experiment.log
performance_tracking = true
verbose_output = false

# Brain connectivity
sensory_neuron_ratio = 0.25
internal_neuron_ratio = 0.5
motor_neuron_ratio = 0.25
internal_connection_probability = 0.15
motor_connection_probability = 0.1

# Plasticity rules
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
hebbian_learning_rate = 0.005
structural_synaptogenesis_rate = 0.0001
structural_pruning_rate = 0.00001

# Environment simulation
environment_width = 16
environment_height = 16
vision_range = 8
vision_angle = 90.0  # degrees
energy_max = 100.0
energy_decay_rate = 0.01
resource_value = 10.0
hazard_damage = 5.0
