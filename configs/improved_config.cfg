# NLM Improved Configuration File
# Example configuration demonstrating Phase 7 improvements

# Random seed for reproducible experiments
random_seed = 12345

# Simulation timestep in seconds (improved precision)
simulation_timestep = 0.0001

# Number of neurons in the brain (increased for better resolution)
neuron_count = 2000

# Number of brain regions (multiple regions for complex processing)
region_count = 4

# Connection probability for random connectivity (more conservative)
connection_probability = 0.05

# Plasticity settings (tuned for balanced learning)
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.015
stdp_ltd_weight = 0.018
stdp_time_constant = 25.0

# Development settings (realistic biological rates)
development_synaptogenesis_rate = 0.0005
development_pruning_rate = 0.00005

# Neuromodulation settings (more realistic baseline)
dopamine_baseline = 0.2

# Reward settings (with exploration bonus)
reward_discount_factor = 0.95

# Environment settings (larger workspace)
environment_name = GridWorld
environment_width = 30
environment_height = 30

# Vision settings (higher resolution)
vision_width = 32
vision_height = 32

# Touch settings (more sensitive)
touch_sensitivity = 0.8

# Logging settings (enhanced)
log_level = INFO
log_to_file = true
log_filename = nlm_improved.log
log_rotation = 10485760  # 10MB

# Simulation settings (longer runs)
max_simulation_steps = 50000
simulation_time_limit = 3600.0  # 1 hour

# Visualization settings (improved)
visualization_enabled = true
visualization_update_rate = 60.0
visualization_output = "nlm_improved.vtk"

# Phase 7 improvements
enable_interactive_cli = true
enable_improved_config = true
enable_enhanced_logging = true
enable_gpu_acceleration = false  # Set to true if CUDA available
enable_multithreading = true

# Performance optimizations
use_simd = true
enable_memory_pool = true
enable_event_queue = true
max_threads = 8

# Checkpoint settings (frequent saves)
checkpoint_enabled = true
checkpoint_interval = 1000
checkpoint_path = "./checkpoints/improved/"
checkpoint_compression = "zlib"
checkpoint_version = 2

# Memory management
working_memory_capacity = 200
episodic_memory_max_episodes = 5000
associative_memory_patterns = 1000

# Development stages
development_stage_initial = 600.0
development_stage_critical = 1800.0
development_stage_maturation = 5400.0
development_stage_adult = 18000.0

# Neuromodulation parameters
dopamine_sensitivity = 0.8
curiosity_baseline = 0.1
novelty_threshold = 0.05
prediction_error_weight = 0.5

# Exploration parameters
exploration_rate = 0.15
exploitation_weight = 0.85
intrinsic_motivation = 0.3

# Social learning
social_learning_enabled = true
social_observation_decay = 0.95

# Logging formats
log_format = "[%timestamp%] [%level%] %message%",
log_colors = true,
log_performance_stats = true,

# Backup and recovery
auto_backup = true
backup_interval = 3600  # 1 hour
backup_path = "./backups/"

# Experimental parameters
experiment_name = "nlm_phase7_improved"
experiment_description = "Phase 7 NLM with enhanced configuration and interactive CLI"
experiment_version = "2.0.0"
experiment_date = "2026-11-05"

# Safety limits
max_neurons = 10000
max_synapses = 50000
max_steps = 100000

# Random number generation
rng_algorithm = "splitmix64"
rng_seed_stream = 42

# Output formats
output_format = "json"
output_dir = "./outputs/"
enable_profiling = true
profile_output = "profile.json"

# Network settings (for distributed computing)
network_enabled = false
network_host = "localhost"
network_port = 8080
network_protocol = "tcp"

# Security (if network enabled)
auth_required = false
api_key = ""
allowed_ips = ""

# Monitoring and metrics
enable_metrics = true
metrics_output = "metrics.json"
metrics_interval = 60.0
performance_monitoring = true
system_monitoring = true

# Quality of service
qos_enabled = false
qos_level = "normal"
qos_budget = 1000.0  # milliseconds

# Advanced features
enable_deepcopy = true
enable_compression = true
enable_validation = true
validation_checks = 10

# Debugging
enable_debug = true
debug_level = "detailed"
debug_output = "debug.log"
stack_trace_on_error = true
safe_mode = false

# Experimental features (Phase 8)
experimental_feature_1 = false
experimental_feature_2 = false
experimental_feature_3 = false

# End of improved configuration file