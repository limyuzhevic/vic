# NLM Configuration File
# Advanced Configuration Template
# This template provides a comprehensive set of configuration options

# ===== BASIC SETTINGS =====
# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# ===== PLASTICITY SETTINGS =====
# STDP learning rate
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Hebbian learning rate
hebbian_learning_rate = 0.01

# Structural plasticity parameters
synaptogenesis_rate = 0.001
pruning_rate = 0.0001

# ===== DEVELOPMENT SETTINGS =====
# Developmental stage
developmental_stage = "adult"

# Synaptogenesis rate during critical period
synaptic_growth_rate = 0.01

# Pruning rate during aging
pruning_rate = 0.001

# ===== NEUROMODULATION SETTINGS =====
# Dopamine baseline
dopamine_baseline = 0.0

# Curiosity baseline
curiosity_baseline = 0.1

# Novelty detection threshold
novelty_threshold = 0.05

# ===== REWARD SETTINGS =====
# Reward discount factor for future rewards
reward_discount_factor = 0.99

# Reward scaling factor
reward_scale = 1.0

# ===== ENVIRONMENT SETTINGS =====
# Environment type
environment_name = "GridWorld"

# Environment dimensions
environment_width = 10
environment_height = 10

# Environment parameters
environment_obstacle_density = 0.1
environment_reward_available = true

# ===== LOGGING SETTINGS =====
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = "INFO"

# Whether to log to file
log_to_file = false

# Log filename
log_filename = "nlm.log"

# Log file rotation (0 = no rotation)
log_rotation_size = 0

# ===== SIMULATION SETTINGS =====
# Maximum number of simulation steps
max_simulation_steps = 10000

# Simulation time limit in seconds
simulation_time_limit = 0.0

# ===== VISUALIZATION SETTINGS =====
# Whether to enable visualization
visualization_enabled = false

# Visualization update rate (Hz)
visualization_update_rate = 30.0

# Visualization output format
visualization_format = "png"

# ===== PERFORMANCE SETTINGS =====
# Enable performance optimizations
performance_enabled = true

# SIMD instruction set (AVX2, SSE, scalar)
simd_instruction_set = "AVX2"

# Number of threads for parallel processing
thread_count = 1

# ===== CHECKPOINT SETTINGS =====
# Enable checkpointing
checkpoint_enabled = true

# Checkpoint file path
checkpoint_path = "./checkpoints"

# Checkpoint frequency (in steps)
checkpoint_frequency = 1000

# ===== EXPERIMENT SETTINGS =====
# Default experiment type
experiment_type = "integration"

# Experiment duration (in seconds)
experiment_duration = 300

# Experiment output directory
experiment_output_dir = "./experiments"

# ===== ADVANCED OPTIONS =====
# Enable experimental features
experimental_features = false

# Enable debugging mode
debug_mode = false

# Enable profiling
profiling_enabled = false

# Profiling output file
profiling_output = "profile_data.json"

# ===== METRICS SETTINGS =====
# Enable metrics collection
metrics_enabled = true

# Metrics output format
metrics_format = "json"

# Metrics collection interval (in seconds)
metrics_interval = 60

# ===== VALIDATION RULES =====
# Minimum neuron count
min_neuron_count = 1

# Maximum neuron count
max_neuron_count = 1000000

# Minimum region count
min_region_count = 1

# Maximum region count
max_region_count = 1000

# Valid timestep range
min_timestep = 0.0001
max_timestep = 1.0

# Valid connection probability range
min_connection_probability = 0.0
max_connection_probability = 1.0

# ===== SCHEDULED TASKS =====
# Task definitions (format: task_name=interval=action)
# Example: daily_cleanup=86400=remove_old_logs
