# NLM Advanced Configuration
# Phase 2: Real Neural Computation
# Advanced configuration for high-performance brain simulation

# Environment and Mode
# =================
environment = "production"
mode = "real-time"

# Performance and Optimization
# ============================
performance = {
    # Simulation parameters
    timestep = 0.001
    max_steps = 10000
    
    # Memory management
    memory_pool_size = "256MB"
    enable_memory_compression = true
    enable_memory_pools = true
    
    # Parallel processing
    enable_parallel_processing = true
    num_threads = 4
    enable_vectorization = true
    
    # File I/O
    enable_checkpointing = true
    checkpoint_interval = 100
    checkpoint_path = "checkpoints/"
    enable_export_import = true
    export_path = "exports/"
}

# Neural Architecture
# ==================
architecture = {
    # Network topology
    type = "feedforward"
    layers = [
        {size = 1000, activation = "relu"},
        {size = 500, activation = "sigmoid"},
        {size = 200, activation = "relu"}
    ]
    
    # Connection probabilities
    connection_probability = 0.15
    long_range_connections = true
    rewiring_rate = 0.001
    
    # Initialization
    weight_init = "xavier"
    bias_init = "zeros"
    neuron_type = "lif"
    
    # Structural properties
    enable_structural_plasticity = true
    synaptogenesis_rate = 0.0001
    pruning_rate = 0.00001
    max_synapses_per_neuron = 100
}

# Learning and Plasticity
# =======================
learning = {
    # STDP parameters
    stdp = {
        enable = true
        ltp_weight = 0.02
        ltd_weight = 0.015
        tau_plus = 20.0
        tau_minus = 20.0
        trace_decay = 0.1
        learning_rate = 0.001
    }
    
    # Hebbian learning
    hebbian = {
        enable = true
        learning_rate = 0.01
        threshold = 0.5
        decay_rate = 0.01
        cooperation_window = 10
    }
    
    # Neuromodulation
    neuromodulation = {
        dopamine = {
            enable = true
            scale = 1.0
            baseline = 0.1
            peak = 1.0
            decay_rate = 0.1
            release_rate = 1.0
        }
        
        curiosity = {
            enable = true
            weight_novelty = 0.5
            weight_prediction_error = 0.5
            decay_rate = 0.05
            exploration_threshold = 0.3
        }
        
        novelty = {
            enable = true
            threshold = 0.3
            decay_rate = 0.1
            sensitivity = 1.0
        }
        
        prediction_error = {
            enable = true
            sensitivity = 1.0
            decay_rate = 0.1
            error_threshold = 0.5
        }
    }
    
    # Developmental processes
    development = {
        enable = true
        stages = [
            {name = "initial", duration = 60, plasticity_factor = 1.0},
            {name = "critical_period", duration = 300, plasticity_factor = 0.8},
            {name = "maturation", duration = 600, plasticity_factor = 0.5},
            {name = "adult", duration = -1, plasticity_factor = 0.2},
            {name = "aging", duration = -1, plasticity_factor = 0.1}
        ]
        critical_period_window = 100
        sensitive_period = 200
    }
}

# Memory Systems
# ==============
memory = {
    # Working memory
    working_memory = {
        type = "broadcast"
        capacity = 1000
        decay_rate = 0.01
        enable_forgetting = true
        consolidation_interval = 100
        replay_rate = 0.1
    }
    
    # Episodic memory
    episodic_memory = {
        type = "hippocampal"
        capacity = 10000
        encoding_strength = 0.8
        replay_frequency = 0.05
        integration_rate = 0.01
        pattern_completion = true
    }
    
    # Semantic memory
    semantic_memory = {
        type = "distributed"
        embedding_dim = 100
        similarity_threshold = 0.7
        learning_rate = 0.001
        enable_annealing = true
    }
    
    # Procedural memory
    procedural_memory = {
        type = "actor-critic"
        policy_learning_rate = 0.001
        value_function_learning_rate = 0.01
        exploration_rate = 0.1
        entropy_regularization = true
    }
    
    # Associative memory
    associative_memory = {
        type = "hopfield"
        storage_capacity = 0.138
        attractor_strength = 0.5
        pattern_similarity_threshold = 0.8
        recall_threshold = 0.9
    }
}

# Prediction and Cognition
# ========================
prediction = {
    # Forward model
    forward_model = {
        enable = true
        prediction_horizon = 10
        prediction_error_threshold = 0.1
        learning_rate = 0.01
        uncertainty_weight = 0.5
    }
    
    # Value function
    value_function = {
        enable = true
        backup_type = "mc"
        discount_factor = 0.99
        learning_rate = 0.001
        target_network_update_interval = 100
    }
    
    # Neural planner
    neural_planner = {
        enable = true
        action_space_size = 10
        planning_horizon = 20
        deliberation_time = 5
        value_prediction = true
        policy_gradient = true
    }
    
    # Concept formation
    concept_formation = {
        enable = true
        clustering_algorithm = "kmeans"
        num_clusters = 50
        cluster_update_interval = 100
        concept_similarity_threshold = 0.7
        concept_purity_threshold = 0.9
    }
    
    # Attentional selection
    attentional_selection = {
        enable = true
        selection_method = "softmax"
        temperature = 0.1
        attention_window_size = 100
        top_k_selection = 10
    }
}

# Environment Interaction
# ======================
environment = {
    # World model
    world_model = {
        type = "grid"
        width = 20
        height = 20
        resolution = 0.1
        time_step = 0.1
        enable_physics = true
        enable_rendering = false
    }
    
    # Agent properties
    agent = {
        sensors = [
            {type = "vision", width = 8, height = 8, range = 10.0},
            {type = "audio", radius = 5.0, frequency_range = [100, 10000]},
            {type = "touch", range = 2.0},
            {type = "internal", states = ["energy", "hunger", "thirst"]}
        ]
        actuators = [
            {type = "movement", range = 1.0, speed = 0.5},
            {type = "interaction", range = 2.0, strength = 0.5},
            {type = "communication", range = 10.0, bandwidth = 1.0}
        ]
        reward_system = {
            reward_sources = ["food", "water", "safety", "novelty", "achievement"]
            reward_weights = {food = 1.0, water = 0.8, safety = 0.9, novelty = 0.5, achievement = 1.2}
            punishment_sources = ["hazard", "predator", "pain"]
        }
    }
    
    # Task environment
    task_environment = {
        enable_tasks = true
        task_types = ["foraging", "navigation", "problem_solving", "social"]
        task_complexity = "medium"
        enable_constraints = true
        max_steps_per_task = 1000
        success_threshold = 0.8
    }
}

# Visualization and Monitoring
# ============================
visualization = {
    # Terminal visualization
    terminal = {
        enable = true
        update_interval = 100
        show_neurons = true
        show_synapses = true
        show_memory = true
        show_metrics = true
        color_scheme = "default"
        enable_animations = true
    }
    
    # External visualization
    external = {
        enable = false
        backend = "matplotlib"
        update_rate = 10.0
        enable_3d = true
        enable_interactivity = true
        output_file = "visualization.mp4"
    }
    
    # Monitoring
    monitoring = {
        enable = true
        metrics = [
            "spike_rate", "firing_rate", "memory_usage", "learning_rate",
            "energy_consumption", "task_performance", "reward_history"
        ]
        sampling_interval = 100
        alert_thresholds = {
            high_spike_rate = 100.0
            memory_usage = 0.9
            learning_rate = 1.0
            energy_consumption = 1000.0
        }
        enable_notifications = true
    }
}

# Advanced Features
# =================-
advanced = {
    # Experimental features
    experimental = {
        enable = false
        features = [
            "reinforcement_learning",
            "hierarchical_cognition", 
            "social_learning",
            "meta_learning",
            "transfer_learning"
        ]
        enable_all = false
    }
    
    # Research features
    research = {
        enable = false
        enable_ablation_studies = true
        enable_parameter_search = true
        enable_reproducibility_checks = true
        enable_data_logging = true
        log_data_format = "json"
        enable_research_mode = true
    }
    
    # Performance optimization
    optimization = {
        enable_autotuning = true
        optimize_for = "speed"  # "speed", "accuracy", or "balance"
        enable_profile_guided_optimization = true
        profile_interval = 1000
        enable_cache_optimization = true
        enable_memory_optimization = true
    }
}

# Security and Privacy
# ====================
security = {
    enable = true
    authentication = {
        enable = true
        method = "token"
        token_expiry = 3600
        enable_sso = true
    }
    
    encryption = {
        enable = true
        algorithm = "aes-256-gcm"
        key_derivation = "pbkdf2"
        key_file = "encryption.key"
    }
    
    auditing = {
        enable = true
        log_file = "security.log"
        enable_anomaly_detection = true
        alert_threshold = 0.9
    }
}

# Configuration Metadata
# ========================
metadata = {
    version = "2.0.0"
    phase = "phase2"
    description = "Advanced NLM configuration for high-performance brain simulation"
    author = "NLM Development Team"
    created = "2025-01-05"
    modified = "2025-01-05"
    tags = ["advanced", "production", "research"]
    compatibility = {
        minimum_version = "2.0.0"
        recommended_version = "2.0.0"
    }
}