#!/bin/bash

# NLM Phase 6 Configuration Examples
# These examples show the improved reward and learning dynamics

# config_high_reward.cfg - For fast learning in controlled environments
[general]
random_seed = 42
simulation_timestep = 0.001
neuron_count = 500
region_count = 1

# High resource rewards for quick learning (40% of original values)
[rewards]
resource_reward_multiplier = 0.4
hazard_penalty_multiplier = 0.4
movement_cost = -0.01
exploration_reward = 0.005
resting_reward = 0.015

# Learning parameters (improved to avoid saturation)
[learning]
planner_learning_rate = 0.05  # Reduced from typical 0.1
preference_update_rate = 0.05  # Reduced from 0.1
plasticity_learning_rate = 0.02  # Reduced from 0.05
eligibility_decay = 0.15  # Slower decay for better stability

# Neuromodulation settings
[neuromodulation]
dopamine_gain = 0.8  # Reduced gain
plasticity_range = 1.7  # Narrower range

# Exploration settings
[exploration]
max_curiosity_exploration = 0.2  # Cap at 20%
familiarity_damping = 0.5  # Damped by familiarity

# Development settings
[development]
plasticity_modifier = 1.0  # High initial plasticity
