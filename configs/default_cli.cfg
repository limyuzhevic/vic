// NLM CLI Configuration File
// Enhanced command-line interface for NLM with multiple modes and features

// General CLI settings
cli_help_enabled = true
cli_version_output = true
cli_progress_indicators = true
cli_checkpoint_format = json

// Logging configuration
cli_log_level = INFO
cli_log_to_file = false
cli_log_filename = nlm_cli.log
cli_log_rotation = 10485760  // 10MB
cli_log_colors = true

// Default mode
cli_default_mode = demo

// Demo mode configuration
demo_mode_brain_size = 1000
demo_mode_steps = 1000
demo_mode_seed = 42

// Integration mode configuration
integration_mode_brain_size = 5000
integration_mode_steps = 5000
integration_mode_connection_probability = 0.15
integration_mode_plasticity_enabled = true

// Profiling mode configuration
profiling_mode_duration = 30.0  // seconds
profiling_mode_samples = 1000
profiling_mode_detailed = true

// Experiment mode configuration
experiment_mode_default_duration = 10000  // steps
experiment_mode_default_repetitions = 5
experiment_mode_auto_save = true

// Config mode configuration
config_mode_save_on_exit = true
config_mode_export_format = json

// Brain configuration (shared with all modes)
brain_neuron_count = 1000
brain_region_count = 2
brain_simulation_timestep = 0.001
brain_random_seed = 42

// Plasticity configuration
brain_stdp_ltp_weight = 0.02
brain_stdp_ltd_weight = 0.015
brain_stdp_tau = 20.0
brain_hebbian_learning_rate = 0.01
brain_structural_plasticity_rate = 0.0001

// Visualization configuration
cli_text_viz_enabled = true
cli_text_viz_update_rate = 10.0
cli_text_viz_detailed = false

// Checkpoint configuration
checkpoint_enabled = true
checkpoint_interval = 100
checkpoint_dir = ./checkpoints
checkpoint_compress = true

// Performance configuration
performance_profiling_enabled = true
performance_memory_tracking = true
performance_thread_count = 1