# Advanced NLM Configuration Example
# This file demonstrates advanced NLM configuration options
# Created: 2026-09-17

# Basic configuration
neuron_count = 2000
region_count = 3
connection_probability = 0.15
simulation_timestep = 0.001
random_seed = 12345

# Phase 2: Real Neural Computation
# LIF neuron parameters
v_thresh = -50.0
v_rest = -70.0
v_reset = -75.0
tau_mem = 20.0
tau_ref = 2.0

# Phase 3: World Integration
enable_sensory = true
enable_motor = true
vision_range = 8
vision_angle = 90.0
movement_speed = 1.0

# Phase 4: Cognition
planning_depth = 5
attention_inhibition = 0.5
attention_excitation = 1.5

# Phase 5: Performance
enable_memory_pools = true
event_queue_size = 10000
use_simd = true
enable_parallel = true

# Phase 6: Advanced Integration
enable_developmental_stages = true
critical_period_end = 100
development_plasticity_factor = 1.0

# Neuromodulation
enable_dopamine = true
dopamine_scale = 1.0
enable_curiosity = true
curiosity_threshold = 0.3
curiosity_decay = 0.95
enable_novelty = true
novelty_window = 100
novelty_threshold = 0.7

# Memory Systems
working_memory_capacity = 100
episodic_memory_max_episodes = 5000
associative_memory_patterns = 1000
procedural_memory_capacity = 50

# Prediction System
prediction_horizon = 10
prediction_error_weight = 0.5

# Structural Plasticity
synaptogenesis_rate = 0.0002
pruning_rate = 0.00002
max_synapses_per_neuron = 50

# Checkpointing
checkpoint_dir = "./checkpoints"
checkpoint_interval = 1000
checkpoint_compression = "balanced"
max_checkpoints = 50

# Replay and Consolidation
replay_enabled = true
replay_interval = 500
consolidation_threshold = 0.3
consolidation_interval = 2000

# Advanced Learning Rules
enable_stdp = true
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
stdp_trace_decay = 0.9

enable_hebbian = true
hebbian_learning_rate = 0.001

# Experimental Settings
experimental_mode = false
record_traces = true
enable_debug_output = false
verbose_logging = false

# Output and Visualization
enable_visualization = false
visualization_host = "localhost"
visualization_port = 8080
log_file = "nlm_simulation.log"
stats_output_interval = 100
