# Example advanced configuration file showing best practices
# This file demonstrates the new advanced configuration options

# Configuration version
config_version = "2.0"

# Basic brain configuration
[basic]
brain.neuron_count = 2000
brain.region_count = 4
brain.connection_probability = 0.15
brain.v_thresh = -50.0
brain.v_rest = -65.0
brain.v_reset = -75.0
brain.tau_mem = 15.0
brain.tau_ref = 3.0

# Advanced plasticity configuration
[plasticity]
stdp.enable = true
stdp.learning_rate = 0.005
stdp.tau_plus = 25.0
stdp.tau_minus = 20.0
stdp.enable_eligibility_trace = true

hebbian.enable = true
hebbian.threshold = 5.0
hebbian.anti_causality = false

structural.enable = true
structural.synaptogenesis_rate = 0.0005
structural.pruning_rate = 0.00005
structural.target_density = 0.12

# Neuromodulation configuration
[neuromodulation]
dopamine.scale = 1.2
curiosity.enable = true
curiosity.base_rate = 0.01
curiosity.exploration_strength = 0.8
novelty.enable = true
novelty.decay_rate = 0.95
prediction.enable = true
prediction.horizon = 10

# Development configuration
[development]
enable = true
initial_plasticity = 1.0
critical_period_end = 300.0
adult_plasticity = 0.2
maturation_rate = 0.01

# Agent configuration
[agent]
enable_reward_modulation = true
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
learning_rate = 0.1
task_type = "adaptive_learning"
difficulty = "intermediate"

# Performance settings
[performance]
max_steps_per_episode = 1000
checkpoint_interval = 100
timestep = 0.001
enable_simd = true
enable_multithreading = true

# Visualization options
[visualization]
enable_plots = true
plot_interval = 50
plot_firing_rate = true
plot_curiosity = true
plot_novelty = true
plot_development_stage = true

# Export options
[export]
include_neurogenesis_data = true
include_synaptic_history = true
include_plasticity_rules = true
include_developmental_milestones = true
format = "json"

# Validation rules
[validation]
min_neurons = 100
max_neurons = 10000
min_regions = 1
max_regions = 10
min_connection_probability = 0.01
max_connection_probability = 0.5

# Logging configuration
[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "nlm_simulation.log"
max_file_size = 100mb
backup_count = 5
enable_console = true
enable_file = true

# Advanced features
[advanced_features]
text_as_sense = true
concept_formation = true
self_model = true
social_learning = true
predictive_planning = true
working_memory_capacity = 50
episodic_memory_capacity = 100

# Performance benchmarks
[benchmarks]
recording_interval = 10
track_cpu_usage = true
track_memory_usage = true
track_network_activity = true
baseline_firing_rate = 5.0

# Safety settings
[safety]
enable_safety_checks = true
max_energy_decay = 0.1
min_health_threshold = 0.1
enable_emergency_stop = true
checkpoint_frequency = 500