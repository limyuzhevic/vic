# NLM Configuration Template - Exploration Application
# Exploration-focused configuration with high curiosity
# 
# Basic performance settings
random_seed = 12345
simulation_timestep = 0.001

# Memory settings (large capacity for exploration)
memory.workingMemoryCapacity = 300.0
memory.episodicConsolidationRate = 0.25
memory.associativeStrengthDecay = 0.95
memory.episodicDecayRate = 0.98

# Neuromodulation settings (high curiosity and exploration)
neuromodulation.dopamineBaseline = 0.5
neuromodulation.dopamineNoise = 0.2
neuromodulation.noveltyThreshold = 0.9
neuromodulation.curiosityLevel = 1.0
neuromodulation.explorationRate = 0.7

# Cognitive settings (deep planning for exploration)
cognitive.planningDepth = 4
cognitive.conceptFormationThreshold = 0.8
cognitive.attentionDecayRate = 0.97
cognitive.workingMemoryDecayRate = 0.98
cognitive.activationThreshold = 0.03

# Prediction settings (learning-focused)
prediction.confidenceThreshold = 0.85
prediction.learningRate = 0.15
prediction.decayRate = 0.98
prediction.noise = 0.3

# Development settings (high plasticity)
development.plasticityRate = 0.9
development.stage = 0.7
development.explorationPhaseDuration = 300.0
development.learningPhaseDuration = 10000.0
development.enablePhaseTransitions = true

# Integration settings (balanced coupling)
integration.corticalCorticalCoupling = 0.8
integration.corticalSubcorticalCoupling = 0.7
integration.feedbackStrength = 0.8
integration.predictionErrorGain = 1.1
integration.learningRate = 0.1

# Debug settings (enabled for exploration)
debug.enabled = true
debug.level = "debug"

# Performance settings (exploratory focus)
performance.optimizationLevel = 1
performance.maxMemoryUsage = 1024
performance.maxSimulationSteps = 50000
