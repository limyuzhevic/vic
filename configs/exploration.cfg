# NLM Configuration Preset - Exploration
# High exploration settings for maximum learning and diversity

random_seed = 123
simulation_timestep = 0.0005
neuron_count = 2000
region_count = 1
connection_probability = 0.05
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 30.0

# High developmental plasticity
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002

# Enhanced neuromodulation
dopamine_baseline = 0.2
reward_discount_factor = 0.95

# Environment for exploration
environment_name = GridWorld
environment_width = 20
environment_height = 20

# Simulation settings for thorough exploration
max_simulation_steps = 50000
simulation_time_limit = 0.0

# Logging for detailed tracking
log_level = INFO
log_to_file = true
log_filename = nlm_exploration.log

# Visualization for exploration analysis
visualization_enabled = true
visualization_update_rate = 10.0