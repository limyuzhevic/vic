# Production Configuration Profile
# Optimized for production environments
# High performance, minimal logging, aggressive settings

# Random seed for deterministic behavior
random_seed = 42

# Simulation timestep in seconds (balanced performance)
simulation_timestep = 0.001

# Number of neurons (larger for production performance)
neuron_count = 5000

# Number of brain regions (larger for complex tasks)
region_count = 5

# Connection probability (higher for efficiency)
connection_probability = 0.2

# Plasticity settings (faster for production)
plasticity_learning_rate = 0.02
stdp_ltp_weight = 0.025
stdp_ltd_weight = 0.03
stdp_time_constant = 20.0

# Development settings (faster development)
development_synaptogenesis_rate = 0.002
development_pruning_rate = 0.0002

# Neuromodulation settings (optimized)
dopamine_baseline = 0.5

# Reward settings (efficient)
reward_discount_factor = 0.9

# Environment settings
environment_name = GridWorld
environment_width = 50
environment_height = 50

# Logging settings (minimal for production)
log_level = INFO
log_to_file = true
log_filename = production_nlm.log

# Simulation settings (longer runs)
max_simulation_steps = 50000
simulation_time_limit = 100.0

# Visualization (disabled for performance)
visualization_enabled = false
visualization_update_rate = 30.0