# NLM Configuration Preset - Production
# High performance, stable settings for consistent operation

random_seed = 456
simulation_timestep = 0.001
neuron_count = 500
region_count = 2
connection_probability = 0.15
plasticity_learning_rate = 0.005
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

# Low developmental plasticity for stability
development_synaptogenesis_rate = 0.0001
development_pruning_rate = 0.00001

# Stable neuromodulation
dopamine_baseline = 0.0
reward_discount_factor = 0.99

# Environment for stable operation
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Conservative simulation settings
max_simulation_steps = 20000
simulation_time_limit = 0.0

# Standard logging
log_level = WARNING
log_to_file = true
log_filename = nlm_production.log

# Optional visualization for production monitoring
visualization_enabled = false
visualization_update_rate = 30.0