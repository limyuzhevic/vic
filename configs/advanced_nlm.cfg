# NLM Advanced Configuration
# This file provides enhanced configuration options for advanced users and automated experiments

# Neural Network Configuration
[neural_network]
# Network topology and neuron characteristics
neuron_count = 1000  # Number of neurons per region (default: 1000)
region_count = 1      # Number of brain regions (default: 1)
connection_probability = 0.15  # Probability of connection between neurons (0.0-1.0)
max_synapses_per_neuron = 25   # Maximum incoming synapses per neuron (homeostatic cap)

# Neuron Dynamics Configuration
[neuron_dynamics]
# Leaky Integrate-and-Fire parameters
membrane_decay = 0.004      # Membrane potential decay factor
tau_m = 20.0               # Membrane time constant (ms)
threshold = -55.0          # Spike threshold (mV)
reset_potential = -70.0    # Reset potential after spike (mV)
resting_potential = -70.0  # Resting potential (mV)
leak_conductance = 0.0001  # Leak conductance

# Plasticity Configuration
[plasticity]
# STDP and Hebbian learning parameters
stdp_ltp_weight = 0.02     # STDP LTP weight
stdp_ltd_weight = 0.015    # STDP LTD weight
stdp_tau = 20.0            # STDP time constant (ms)
hebbian_threshold = 0.5   # Hebbian learning threshold
learning_rate = 0.01       # General learning rate

# Structural Plasticity
enable_synaptogenesis = true    # Enable creation of new synapses
enable_pruning = true          # Enable synapse elimination
synaptogenesis_rate = 0.0001   # Rate of synapse creation
pruning_rate = 0.00001         # Rate of synapse elimination

# Memory System Configuration
[memory]
# Working memory parameters
working_memory_capacity = 200     # Number of traces in working memory
working_memory_decay = 0.1       # Decay rate for traces
truncation_threshold = 0.1       # Minimum trace activation to retain

# Episodic memory parameters
max_episodes = 1000              # Maximum stored episodes
episode_decay_rate = 0.01        # Rate at which episodes lose relevance
consolidation_interval = 1000    # Steps between consolidation events
replay_frequency = 100          # Replay every N steps

# Neuromodulation Configuration
[neuromodulation]
# Dopamine system parameters
dopamine_baseline = 0.1          # Baseline dopamine level
reward_prediction_error_factor = 1.0  # RPE scaling factor
learning_modulation_strength = 0.5    # How much neuromodulators affect plasticity

# Curiosity system
exploration_drive = 0.2         # Tendency to explore novel stimuli
novelty_threshold = 0.5          # Threshold for novelty detection

# Prediction System Configuration
[prediction]
# Predictive coding parameters
prediction_threshold = 0.3       # Confidence threshold for predictions
prediction_decay = 0.05          # Prediction decay rate
error_accumulation_rate = 0.1    # How quickly prediction errors accumulate

# Development Configuration
[development]
# Developmental stages and parameters
initial_plasticity = 1.0        # High plasticity in initial stage
critical_period_start = 100      # Steps when critical period begins
critical_period_strength = 0.8   # Plasticity reduction during critical period
maturation_plasticity = 0.5     # Reduced plasticity during maturation
adult_plasticity = 0.2          # Low plasticity in adult stage

# Cognitive Configuration
[cognition]
# Attention and planning parameters
attentional_focus_strength = 1.5      # Strength of attentional focus
attention_inhibition_strength = 0.5   # Inhibition strength in attention
planning_depth = 5                    # How far ahead to plan
concept_formulation_threshold = 0.6    # Threshold for concept formation

# Simulation Configuration
[simulation]
# Core simulation parameters
time_step = 0.001          # Simulation time step (ms)
max_steps = 10000          # Maximum simulation steps
random_seed = 42           # Random seed for reproducibility
enable_checkpointing = true # Enable checkpoint saving
checkpoint_interval = 1000 # Steps between checkpoints
checkpoint_dir = ./checkpoints # Checkpoint directory

# Output Configuration
[output]
# Logging and result configuration
log_level = INFO           # Log level: DEBUG, INFO, WARNING, ERROR
log_file = nlm_simulation.log  # Log file path
results_format = json      # Output format: json, csv, binary
enable_visualization = false # Enable real-time visualization
visualization_port = 8080   # Port for visualization server

# Advanced Options
[advanced]
# Performance and optimization options
enable_simd = true         # Use SIMD instructions if available
enable_multithreading = false # Enable parallel processing
thread_count = 4           # Number of threads for multithreading
memory_pool_size = 67108864  # Memory pool size (64MB)

# Experiment Configuration
[experiment]
# Experiment parameters
experiment_type = "integration"  # Type: integration, learning, adaptation
experimental_objective = "verify" # Objective: verify, optimize, explore
reward_function = "simple"        # Reward function: simple, sparse, dense
action_space = "continuous"       # Action space: discrete, continuous
observation_space = "vector"       # Observation space type

# Debug and Analysis
[debug]
# Debugging options
enable_debug_output = false      # Enable debug prints
trace_level = 0                  # 0-3: no trace to full trace
profile_performance = false       # Enable performance profiling
enable_memory_profiling = false   # Track memory usage
enable_step_profiling = false     # Profile each step
