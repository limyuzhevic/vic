# NLM Advanced Configuration File
# Phase 6 Advanced Neural Learning Machine Configuration
# This file provides extensive configuration options for advanced users
# Customize these settings to optimize NLM behavior for specific use cases

# =============================================================================
# CORE SIMULATION SETTINGS
# =============================================================================

# Basic simulation parameters
simulation_timestep = 0.001           # Time step in seconds (recommended: 0.0005-0.005)
max_steps_per_episode = 10000        # Maximum steps before episode ends
enable_time_limited_episodes = false # True to use time limit instead of step limit
simulation_time_limit = 0.0          # Time limit in seconds (0 = unlimited)

# Network architecture
neuron_count = 1000                  # Total number of neurons (recommended: 500-5000)
region_count = 2                      # Number of brain regions (recommended: 1-5)
connection_probability = 0.1          # Probability of connection between neurons (0.0-1.0)

# Population distribution (per region if region_count > 1)
sensory_neuron_ratio = 0.25           # Fraction of sensory neurons (0.0-1.0)
internal_neuron_ratio = 0.5           # Fraction of internal neurons (0.0-1.0)
motor_neuron_ratio = 0.25             # Fraction of motor neurons (0.0-1.0)

# =============================================================================
# PLASTICITY AND LEARNING
# =============================================================================

# STDP (Spike-Timing-Dependent Plasticity) parameters
stdp_ltp_weight = 0.01                # Long-term potentiation weight (0.0-1.0)
stdp_ltd_weight = 0.012               # Long-term depression weight (0.0-1.0)
stdp_time_constant = 20.0             # STDP time constant in ms (1.0-100.0)
stdp_max_weight_change = 0.1          # Maximum weight change per spike (0.0-1.0)

# Hebbian learning parameters
hebbian_learning_rate = 0.01          # Hebbian learning rate (0.0-1.0)
hebbian_weight_increment = 0.05       # Weight increment per co-activation (0.0-1.0)

# Structural plasticity
enable_synaptogenesis = true         # Enable creation of new synapses
synaptogenesis_rate = 0.001           # Rate of new synapse creation (0.0-0.1)
max_synapses_per_neuron = 50          # Maximum synapses incoming per neuron
enable_pruning = true                 # Enable synapse removal
pruning_rate = 0.00001                # Rate of synapse removal (0.0-0.001)

# Homeostatic plasticity
enable_homeostatic_scaling = true    # Enable synaptic scaling
homeostatic_target_elevation = 3.0    # Target neuron elevation (1.0-10.0)
homeostatic_scaling_interval = 100    # Steps between scaling events (10-1000)

# =============================================================================
# NEUROMODULATION SYSTEMS
# =============================================================================

# Dopamine system (reward prediction error)
dopamine_baseline = 0.1               # Baseline dopamine level (0.0-1.0)
dopamine_sensitivity = 1.0            # Dopamine sensitivity to reward (0.0-2.0)
dopamine_decay_rate = 0.9             # Dopamine decay per step (0.0-1.0)

# Curiosity system (exploration motivation)
enable_curiosity = true               # Enable curiosity-driven exploration
curiosity_sensitivity = 1.0           # Curiosity response to novelty (0.0-2.0)
curiosity_decay = 0.95                # Curiosity decay per step (0.0-1.0)
curiosity_threshold = 0.05            # Novelty threshold to trigger curiosity (0.0-1.0)

# Novelty detection
novelty_detection_sensitivity = 1.0   # Sensitivity to new stimuli (0.0-2.0)
novelty_decay = 0.98                  # Novelty decay per step (0.0-1.0)
novelty_accumulation_threshold = 0.3  # Accumulated novelty to trigger response (0.0-1.0)

# =============================================================================
# MEMORY SYSTEMS
# =============================================================================

# Working memory (short-term)
working_memory_capacity = 100          # Number of active memory traces
working_memory_decay_rate = 0.01      # Decay rate per step (0.0-0.1)
working_memory_boost_strength = 1.0   # Strength of maintenance boosts (0.0-2.0)

# Episodic memory (long-term)
enable_episodic_memory = true         # Enable episodic memory storage
max_episodes_stored = 1000            # Maximum number of episodes to store
episode_decay_rate = 0.05             # Decay rate per step (0.0-0.1)
replay_interval = 100                 # Steps between memory replay events (1-1000)
replay_strength = 0.5                  # Strength of replay influence (0.0-1.0)

# Associative memory
enable_associative_memory = true      # Enable pattern association
association_learning_rate = 0.01      # Rate of forming associations (0.0-0.1)
max_associations_per_neuron = 10      # Maximum associations per neuron

# =============================================================================
# COGNITIVE SYSTEMS
# =============================================================================

# Neural planner
enable_planning = true               # Enable action planning
planning_depth = 3                    # Look-ahead depth (1-5)
planning_confidence_threshold = 0.7   # Minimum confidence for plan execution
planner_action_quality_decay = 0.95   # Decay rate of action quality (0.0-1.0)

# Concept formation
enable_concept_formation = true       # Enable concept discovery
concept_update_rate = 0.01            # Rate of concept updates per step (0.0-0.1)
concept_similarity_threshold = 0.8    # Similarity threshold for concept matching
max_concepts_per_brain = 100          # Maximum number of concepts

# Attentional selection
enable_attention = true               # Enable attentional focus
attentional_smoothing = 0.9           # Smooth attention over time (0.0-1.0)
attentional_strength = 1.5             # Strength of attentional modulation (0.0-3.0)

# =============================================================================
# DEVELOPMENT SYSTEM
# =============================================================================

# Enable development
enable_development = true             # Enable developmental stages
development_speed = 1.0               # Speed of development progression (0.1-2.0)

# Developmental stages (cumulative, in seconds)
initial_period_duration = 60.0        # Initial period (0.1-300.0)
critical_period_duration = 300.0       # Critical period (1.0-600.0)
maturation_period_duration = 900.0    # Maturation period (1.0-1800.0)

# Plasticity changes with development
development_plasticity_modulation = true # Plasticity changes with age
initial_plasticity_factor = 1.0      # Plasticity in initial period (0.0-2.0)
critical_plasticity_factor = 0.8      # Plasticity in critical period (0.0-2.0)
maturation_plasticity_factor = 0.5    # Plasticity in maturation period (0.0-2.0)
adult_plasticity_factor = 0.2         # Plasticity in adult period (0.0-2.0)

# =============================================================================
# AGENT BEHAVIOR
# =============================================================================

# Motor action selection
enable_winner_take_all = true        # Enable winner-take-all competition
wta_inhibition_strength = 0.8         # Strength of lateral inhibition (0.0-2.0)

enable_reflexes = true                # Enable innate reflexes
reflex_bonus_strength = 10.0          # Bonus for resource reflexes (0.0-20.0)
reflex_penalty_strength = -15.0       # Penalty for hazard reflexes (-20.0-0.0)

enable_curiosity_exploration = true   # Enable curiosity-driven exploration
exploration_probability = 0.1          # Base probability of random actions (0.0-0.5)

# =============================================================================
# SELF-MODEL AND SOCIAL LEARNING
# =============================================================================

# Self-model (body awareness)
enable_self_model = true              # Enable self-model development
self_model_learning_rate = 0.01        # Rate of self-model learning (0.0-0.1)
self_model_confidence_threshold = 0.8 # Confidence threshold for action prediction

# Social learning
enable_social_learning = false        # Enable learning from other agents
social_observation_window = 50         # Number of recent observations to remember
social_imitation_threshold = 0.8      # Similarity threshold for imitation (0.0-1.0)

# =============================================================================
# PERFORMANCE AND OPTIMIZATION
# =============================================================================

# Performance settings
enable_checkpointing = true           # Save brain state periodically
checkpoint_interval = 1000            # Save every N steps (1-10000)
checkpoint_path = ./checkpoints        # Directory for checkpoints
max_checkpoints = 100                  # Maximum checkpoints to keep

enable_profiling = false              # Enable performance profiling
profile_interval = 10000              # Profile every N steps (0 to disable)

# Memory management
enable_memory_optimization = true     # Optimize memory usage
gc_interval = 5000                    # Garbage collection interval (0 to disable)
memory_pool_size = 1024                # Size of memory pools (KB)

# Computational efficiency
enable_neural_compression = true      # Enable neural activity compression
compression_threshold = 0.01          # Activity threshold for compression (0.0-0.1)

# =============================================================================
# DEBUGGING AND MONITORING
# =============================================================================

# Logging levels (DEBUG, INFO, WARNING, ERROR, FATAL)
log_level = INFO
log_to_file = true
log_filename = nlm.log
log_file_rotation_size = 10485760      # Rotate at 10MB (0 to disable)
log_detailed_trace = false            # Enable detailed per-step logging

# Monitoring metrics
enable_metrics_collection = true      # Collect performance metrics
metrics_export_interval = 1000         # Export metrics every N steps (0 to disable)
metrics_file = nlm_metrics.json        # File for metrics export

# =============================================================================
# ENVIRONMENT INTERACTION
# =============================================================================

# World simulation settings
enable_dynamic_objects = true          # Objects can move and change
dynamic_object_update_rate = 0.1       # Update rate for dynamic objects (0.0-1.0)

enable_resource_decay = true          # Resources decay over time
resource_decay_rate = 0.001            # Resource decay per step (0.0-0.01)

enable_hazard_mortality = true        # Hazards can kill the agent
hazard_damage = -10.0                  # Damage per hazard contact (-100.0-0.0)

# =============================================================================
# TEXT PROCESSING (Phase 6 Feature)
# =============================================================================

# Text-to-neuron encoding
enable_text_encoding = true           # Enable text as sensory input
text_encoding_resolution = 16         # Text encoding resolution (4-20)
text_neuron_group_size = 15            # Number of neurons dedicated to text processing (1-32)
text_hash_seed = 42                    # Seed for text hashing (any positive number)

# =============================================================================
# EXPERIMENTAL FEATURES
# =============================================================================

# Experimental plasticity rules
enable_experimental_stdp = false      # Enable experimental STDP variants
experimental_stdp_rule = "standard"   # STDP variant: standard, asymmetric, etc.

# Advanced memory features
enable_persistent_memory = false      # Save memory across simulation restarts
memory_compression = true             # Compress memory storage

# Agent personality traits (0.0-1.0, positive = resource-seeking, negative = hazard-seeking)
agent_personality_resource_seeking = 0.5
agent_personality_curiosity = 0.5
agent_personality_caution = 0.5

# =============================================================================
# ADVANCED FEATURE FLAGS
# =============================================================================

# Phase 5 features (mature)
winner_take_all_enabled = true
opponent_disqualification_enabled = true
lateral_inhibition_enabled = true
reflex_gating_enabled = true
neuron_iinhibition_enabled = true

# Phase 6 features (experimental/advanced)
text_as_sense_enabled = true
planner_in_the_loop_enabled = true
concept_bias_enabled = true
self_model_enabled = true
social_learning_enabled = false
imitation_enabled = true
communication_enabled = false
development_enabled = true
replay_enabled = true
consolidation_enabled = true
memory_checkpointing_enabled = true
learning_preference_enabled = true
developmental_stages_enabled = true
neuromodulation_enabled = true
novelt_detection_enabled = true
curiosity_enabled = true
prediction_system_enabled = true
multimodal_integration_enabled = true
sensory_encoding_advanced_enabled = true

# =============================================================================
# COMPLEX FEATURE CONFIGURATIONS
# =============================================================================

# Complex nested configurations for advanced users

# Complex brain connectivity
enable_top_down_connections = true     # Connections from higher to lower regions
enable_bottom_up_connections = true   # Connections from lower to higher regions
enable_lateral_connections = false    # Connections within same region
connectivity_reinforcement_enabled = true  # Reinforce useful connections
connectivity_pruning_enabled = true   # Remove unused connections

# Advanced neuromodulation
 neuromodulation_coupling_enabled = true  # Coupling between different neuromodulators
hormone_interaction_enabled = true   # Interactions between neuromodulators
stress_response_enabled = true        # Stress response system
energy_management_enabled = true      # Energy conservation and allocation

# Advanced cognitive features
cognitive_control_enabled = true       # Goal-directed behavior
mental_rotation_enabled = false       # Ability to mentally rotate states
abstract_reasoning_enabled = false    # High-level abstract reasoning
causal_inferrence_enabled = false     # Causal reasoning about events

# Advanced social cognition
social_cognition_enabled = false      # Understanding others' mental states
theory_of_mind_enabled = false        # Attribution of mental states to others
empathy_enabled = false               # Emotional sharing with others
 cooperation_enabled = false          # Tendency to cooperate with others
 competition_enabled = true           # Tendency to compete with others

# Advanced developmental features
phase_shifting_enabled = true         # Transitions between developmental phases
environmental_influence_enabled = true # Environment affects development
epigenetic_effects_enabled = true     # Gene-environment interactions

# =============================================================================
# LEGACY COMPATIBILITY
# =============================================================================

# Settings for backward compatibility with older versions
enable_legacy_mode = false            # Enable legacy behavior (caution: may break things)
legacy_planning_enabled = false       # Use older planning algorithm
legacy_memory_system = false          # Use older memory implementation
legacy_agent_behavior = false         # Use simpler agent behavior
