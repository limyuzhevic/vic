# Debug configuration with verbose logging and validation
# Ideal for development and troubleshooting

brain.neuron_count = 100       # Small network for quick debugging
brain.region_count = 1
brain.connection_probability = 0.3
brain.initial_weight_mean = 0.5
brain.initial_weight_std = 0.1

# Neuron parameters
brain.neurons.v_thresh = -50.0
brain.neurons.v_rest = -70.0
brain.neurons.v_reset = -75.0
brain.neurons.tau_mem = 20.0
brain.neurons.tau_ref = 2.0

# STDP plasticity
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian plasticity
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.001

# Structural plasticity
plasticity.structural.enable = false           # Disable structural plasticity for cleaner debugging
plasticity.structural.synaptogenesis_rate = 0.0001
plasticity.structural.pruning_rate = 0.00001

# Neuromodulation
neuromodulation.dopamine.scale = 1.0
neuromodulation.curiosity.enable = false
neuromodulation.novelty.enable = false

# Simulation
simulation.timestep = 0.001

# Logging
logging.level = "debug"          # Maximum verbosity
logging.file = "nlm_debug.log"
logging.max_file_size = 5242880   # 5MB