# NLM Configuration - Debug
# Optimized for debugging and development

# Basic Brain Configuration
neuron_count=50            # Very small network for easy debugging
region_count=1             # Single region for simplicity
connection_probability=0.3 # High density for observable effects
random_seed=777            # Different seed for isolated debugging

# Simulation Parameters
simulation_timestep=0.001   # Fine timestep for detailed debugging
max_steps=1000             # Short simulation for quick debug cycles

# Neural Dynamics
v_rest=-70.0               # Resting membrane potential (mV)
v_reset=-65.0              # Reset membrane potential (mV)
v_thresh=-55.0             # Threshold potential (mV)

# STDP (sensitive for debugging)
stdp_ltp_weight=0.05       # Very high weight for observable effects
stdp_ltd_weight=0.06       # Very high weight for observable effects
stdp_tau=5.0               # Very short time constant

# Memory Systems (limited for debugging)
working_memory_capacity=5    # Tiny capacity for easy observation
episodic_memory_max_episodes=50 # Limited episodes

# Development (full enabled for debugging)
enable_development=true    # Enable for development observation
plasticity_decay_rate=0.1 # High decay for clear developmental stages

# Checkpoint System (frequent for debugging)
checkpoint_dir=./debug_checkpoints   # Separate directory
checkpoint_interval=100    # Very frequent checkpoints
max_checkpoints=20          # Many checkpoints for state review

# Logging (extensive for debugging)
log_level=DEBUG           # Full debug logging
log_file=nlm_debug.log    # Dedicated debug log
verbose_output=true       # Maximum verbosity

# Environment (small for easy observation)
env_width=8                # Small environment
env_height=8              # Small environment

# Experimental Parameters (debug-friendly)
exploration_rate=0.5       # Balanced exploration for observation
exploitation_rate=0.5     # Balanced exploration/exploitation
reward_scale=1.0          # Standard scaling
exploration_bonus=0.5     # High exploration bonus for observation

# Performance (debug-friendly)
enable_multithreading=false # Single-threaded for easier debugging
thread_count=1           # One thread for deterministic behavior
enable_simd=false         # No SIMD (easier to debug)
use_memory_pool=true     # Memory pooling for easier memory tracking

# Debug-specific settings
print_neuron_states=true   # Print individual neuron states
print_synapse_weights=true # Print synapse weight changes
print_memory_contents=true # Print memory system contents

# Note: This configuration is for debugging and development
# It provides maximum observability of internal states
