# NLM Configuration Template - Debug Mode
# Debug configuration with extensive logging and slow operation
# 
# Basic performance settings
random_seed = 42
simulation_timestep = 0.01

# Memory settings (small capacity for faster debugging)
memory.workingMemoryCapacity = 50.0
memory.episodicConsolidationRate = 0.05
memory.associativeStrengthDecay = 0.9
memory.episodicDecayRate = 0.95

# Neuromodulation settings (high noise for debugging)
neuromodulation.dopamineBaseline = 0.5
neuromodulation.dopamineNoise = 0.5
neuromodulation.noveltyThreshold = 0.7
neuromodulation.curiosityLevel = 0.3
neuromodulation.explorationRate = 0.2

# Cognitive settings (slow operation)
cognitive.planningDepth = 1
cognitive.conceptFormationThreshold = 0.4
cognitive.attentionDecayRate = 0.9
cognitive.workingMemoryDecayRate = 0.95
cognitive.activationThreshold = 0.01

# Prediction settings (slow learning for debugging)
prediction.confidenceThreshold = 0.7
prediction.learningRate = 0.01
prediction.decayRate = 0.95
prediction.noise = 0.5

# Development settings (low plasticity)
development.plasticityRate = 0.2
development.stage = 0.3
development.explorationPhaseDuration = 10.0
development.learningPhaseDuration = 100.0
development.enablePhaseTransitions = true

# Integration settings (low coupling)
integration.corticalCorticalCoupling = 0.5
integration.corticalSubcorticalCoupling = 0.4
integration.feedbackStrength = 0.6
integration.predictionErrorGain = 0.8
integration.learningRate = 0.005

# Debug settings (verbose)
debug.enabled = true
debug.level = "verbose"
log.level = "debug"
log.toFile = true
log.filePath = "nlm_debug.log"

# Performance settings (slow for debugging)
performance.optimizationLevel = 0
performance.maxMemoryUsage = 256
performance.maxSimulationSteps = 1000
