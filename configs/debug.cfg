# NLM Configuration File
# Debug configuration for NLM (Neural Learning Machine)
# This configuration is optimized for debugging and troubleshooting
# with maximum visibility into system behavior.

# ===== BRAIN CONFIGURATION =====
debug_neuron_count = 200
connection_probability = 0.05

# ===== DEBUG SYSTEM (Maximum Visibility) =====
debug.level = "debug"
log.all_systems = true
enable.break_on_error = true
enable.detailed_timing = true
enable.memory_tracking = true

# ===== MEMORY CONFIGURATION (Detailed Tracking) =====
memory.working_capacity = 50
memory.episodic.max_episodes = 100
memory.associative.pheromone_decay = 0.1

# ===== PLASTICITY CONFIGURATION =====
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.hebbian.enable = true
plasticity.structural.enable = true

# ===== NEUROMODULATION =====
neuromod.dopamine.scale = 1.0
neuromod.curiosity.enable = true
neuromod.novelty.enable = true

# ===== DEVELOPMENT =====
development.stage = 4
development.initial_plasticity = 1.0
development.critical_period_start = 100
development.critical_period_end = 500

# ===== WORLD (Smaller for Easier Debugging) =====
world.width = 10
world.height = 10
world.vision_width = 4
world.vision_height = 4
world.max_energy = 10.0

# ===== SIMULATION =====
simulation.timestep = 0.001
simulation.max_steps = 1000
simulation.replay_interval = 10
simulation.consolidation_interval = 100

# ===== DEBUG OUTPUTS =====
debug.output_file = "debug_output.txt"
debug.include_stack_traces = true
debug.include_memory_dumps = true

# ===== CONFIGURATION NOTES =====
# 
# This configuration is designed for maximum debugging visibility.
#
# Key Debugging Features:
# 1. Debug mode enabled with detailed logging
# 2. Memory tracking for heap analysis
# 3. Detailed timing information for performance analysis
# 4. Break on error for interactive debugging
# 5. Memory dumps for crash analysis
#
# Debug Configuration Characteristics:
# - Smaller brain size for faster iteration
# - Enhanced logging for detailed visibility
# - Error breakpoints for interactive debugging
# - Memory tracking for resource analysis
# - Detailed timing for performance profiling
#
# Use this configuration when:
# - Investigating bugs or issues
# - Analyzing performance problems
# - Understanding system behavior
# - Debugging memory leaks
# - Interactive development and testing
#
# Usage Example:
# nlm --config=configs/debug.cfg --verbose --test=1
#
# Configuration file: configs/debug.cfg
# Format: flat keys for configuration clarity
# Purpose: Debugging and troubleshooting environment
# Generated: 2026-11-19

# ===== END OF DEBUG CONFIGURATION =====
