// Enhanced configuration template for NLM experiments
// This file provides a clean, validated configuration template
// that addresses all identified issues and provides best practices

// Core configuration
random_seed = 42
simulation_timestep = 0.001

// Brain configuration
neuron_count = 1000
region_count = 2
connection_probability = 0.1

// Plasticity configuration
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0

// Development configuration
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001
enable_development = true

// Neuromodulation configuration
dopamine_baseline = 0.1
enable_reward_modulation = true
enable_curiosity = true

// Reward configuration
reward_discount_factor = 0.99

// Environment configuration
environment_name = GridWorld
environment_width = 10
environment_height = 10

// Logging configuration
log_level = INFO
log_to_file = false
log_filename = nlm.log

// Simulation configuration
max_simulation_steps = 10000
simulation_time_limit = 0.0

// Visualization configuration
visualization_enabled = false
visualization_update_rate = 30.0

// Memory management configuration
memory_pool_size = 10000
enable_memory_tracking = true

// Performance monitoring configuration
enable_performance_monitoring = true
performance_sample_size = 100

// Advanced configuration (optional)
# Enable advanced neuromodulation
enable_advanced_neuromodulation = false

# Learning configuration
learning_rate_decay = 0.995
eligibility_trace_decay = 0.9

# Experiment configuration
checkpoint_enabled = true
checkpoint_interval = 1000
auto_save_interval = 100