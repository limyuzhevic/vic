# NLM Configuration File
# Phase 6: Final Integration - Advanced Neural Learning Machine Configuration
# This configuration file contains validated parameters for optimal NLM performance

# Random seed for reproducible experiments (0-2^64-1, default: 42)
random_seed = 42

# Simulation timestep in seconds (recommended: 0.001-0.01, default: 0.001)
simulation_timestep = 0.001

# Number of neurons in the brain (recommended: 100-10000, default: 1000)
neuron_count = 1000

# Number of brain regions (recommended: 1-10, default: 2)
region_count = 2

# Connection probability for random connectivity (0.0-1.0, default: 0.1)
connection_probability = 0.1

# STDP LTP weight (0.0-1.0, default: 0.01)
stdp_ltp_weight = 0.01

# STDP LTD weight (0.0-1.0, default: 0.012)
stdp_ltd_weight = 0.012

# General plasticity learning rate (0.0-1.0, default: 0.01)
plasticity_learning_rate = 0.01

# Synaptogenesis rate (0.0-0.1, default: 0.001)
synaptogenesis_rate = 0.001

# Pruning rate (0.0-0.01, default: 0.0001)
pruning_rate = 0.0001

# Dopamine baseline level (0.0-1.0, default: 0.1)
dopamine_baseline = 0.1

# Replay interval in steps (recommended: 10-1000, default: 100)
replay_interval = 100

# Memory consolidation interval in steps (recommended: 100-10000, default: 1000)
consolidation_interval = 1000

# Checkpoint directory path (default: ./checkpoints)
checkpoint_dir = ./checkpoints

# Log level (DEBUG, INFO, WARNING, ERROR, FATAL, default: INFO)
log_level = INFO

# Maximum energy for agent (recommended: 100.0-1000.0)
max_simulation_steps = 10000

# Environment dimensions
environment_width = 20
environment_height = 20
environment_name = GridWorld

# Optional: Simulation time limit (0 = unlimited)
simulation_time_limit = 0

# Optional: Visualization enabled (false by default)
visualization_enabled = false

# Optional: Visualization update rate (frames per second)
visualization_update_rate = 30.0

# Optional: Resource value (can be modified per environment)
# value can be any positive number, typically: resource=1.0, hazard=-10.0
