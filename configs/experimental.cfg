# NLM Configuration Template
# Experimental Configuration
# For testing specific hypotheses or edge cases

# Random seed for reproducible experiments
random_seed = 999

# Simulation timestep in seconds
 simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 100

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.3  # High connectivity for dense network

# Plasticity settings (unusual values for experimentation)
plasticity_learning_rate = 0.1  # Very high learning rate
stdp_ltp_weight = 0.05
stdp_ltd_weight = 0.06
stdp_time_constant = 10.0  # Fast STDP

# Development settings (experimental values)
development_synaptogenesis_rate = 0.01  # Very high synaptogenesis
development_pruning_rate = 0.002  # High pruning rate

# Neuromodulation settings (extreme values for testing)
 dopamine_baseline = 0.0
dopamine_baseline = 5.0  # Very high dopamine

# Reward settings (experimental)
reward_discount_factor = 0.9  # Fast discounting

# Environment settings (small for controlled experiments)
environment_name = GridWorld
environment_width = 5
environment_height = 5

# Logging settings
log_level = INFO
log_to_file = true
log_filename = experimental_nlm.log

# Simulation settings (controlled length)
max_simulation_steps = 200
simulation_time_limit = 0.0

# Visualization settings
visualization_enabled = true
visualization_update_rate = 5.0  # Slower updates for data collection

# Experimental features (enabled for testing)
enable_structural_plasticity = true
enable_curiosity = true
enable_prediction = true
enable_developmental_stages = true

# Custom experimental parameters
experimental_mode = true
record_all_activity = true
collect_detailed_stats = true
freeze_plasticity_after = 100  # Stop plasticity after 100 steps