# NLM Configuration File
# Centralized configuration for all NLM components

# Random seed for reproducible experiments
random_seed = 42

# Simulation parameters
simulation_timestep = 0.001
neuron_count = 500
region_count = 1
connection_probability = 0.15

# STDP (Spike-Timing Dependent Plasticity) parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Memory system parameters
replay_interval = 100
consolidation_interval = 1000
working_memory_capacity = 50
max_episodes = 1000

# Neuromodulation parameters
dopamine_baseline = 0.5
curiosity_baseline = 0.3
novelty_threshold = 0.2
prediction_error_baseline = 0.1

# Plasticity window parameters
hebbian_coincidence_window = 10.0
stdp_max_history = 10000

# Memory consolidation
consolidation_threshold = 0.3

# Development stages
development_initial_period = 100
development_critical_period = 500
development_maturation_period = 1000

# I/O and logging
log_level = Info
log_to_file = false
log_file_path = "nlm.log"
checkpoint_dir = "./checkpoints"
checkpoint_interval = 1000
max_checkpoints = 5

# Advanced user features
enable_debug_mode = false
enable_profiling = false
enable_memory_tracking = false
simulation_speed = 1.0

# Neural population distribution
sensory_neuron_ratio = 0.25
internal_neuron_ratio = 0.5
motor_neuron_ratio = 0.25

# Synapse parameters
mean_excitory_weight = 0.2
mean_inhibitory_weight = -0.1
weight_variance = 0.1
