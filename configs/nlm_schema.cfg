# NLM Configuration Schema
# This file defines the expected configuration parameters with their types, defaults, and validation rules

# === Core Simulation Parameters ===
# Random seed for reproducible experiments
[simulation]
random_seed = 42  # int: Required, range [1, 2^63-1]
simulation_timestep = 0.001  # double: Required, range (0, 1.0]
neuron_count = 1000  # int: Required, range [1, 10^6]
region_count = 2  # int: Required, range [1, 100]
connection_probability = 0.1  # double: Optional, range [0.0, 1.0]
max_simulation_steps = 10000  # int: Optional, range [1, 10^6]
simulation_time_limit = 0.0  # double: Optional, range [0.0, 1000.0]

# === Neural Network Parameters ===
[network]
# Neuron parameters
neuron_resting_potential = -70.0  # double: Optional, range [-100.0, 50.0]
neuron_threshold = -55.0  # double: Optional, range [-100.0, 0.0]
neuron_reset_potential = -70.0  # double: Optional, range [-100.0, 0.0]
neuron_leak_conductance = 10.0  # double: Optional, range [0.0, 1000.0]
neuron_refractory_period = 9  # int: Optional, range [1, 100]
neuron_initial_firing_rate = 0.0  # double: Optional, range [0.0, 1000.0]

# Synapse parameters
synapse_weight_min = -1.0  # double: Optional, range [-10.0, 10.0]
synapse_weight_max = 1.0  # double: Optional, range [-10.0, 10.0]
synapse_delay_min = 1  # int: Optional, range [1, 10]
synapse_delay_max = 5  # int: Optional, range [1, 10]

# === Plasticity Parameters ===
[plasticity]
plasticity_learning_rate = 0.01  # double: Optional, range [0.0, 1.0]
stdp_ltp_weight = 0.01  # double: Optional, range [0.0, 0.5]
stdp_ltd_weight = 0.012  # double: Optional, range [0.0, 0.5]
stdp_time_constant = 20.0  # double: Optional, range [1.0, 100.0]
structural_synaptogenesis_rate = 0.001  # double: Optional, range [0.0, 0.1]
structural_pruning_rate = 0.0001  # double: Optional, range [0.0, 0.1]

# === Neuromodulation Parameters ===
[neuromodulation]
dopamine_baseline = 0.1  # double: Optional, range [-1.0, 1.0]
curiosity_baseline = 0.0  # double: Optional, range [-1.0, 1.0]
novelty_baseline = 0.0  # double: Optional, range [-1.0, 1.0]
dopamine_decay_rate = 0.9  # double: Optional, range [0.1, 1.0]
curiosity_decay_rate = 0.95  # double: Optional, range [0.1, 1.0]

# === Memory Systems ===
[memory]
working_memory_capacity = 100  # int: Optional, range [10, 1000]
working_memory_decay_rate = 0.9  # double: Optional, range [0.1, 1.0]
episodic_memory_capacity = 50  # int: Optional, range [10, 100]
episodic_memory_decay_rate = 0.95  # double: Optional, range [0.1, 1.0]

# === Environment Parameters ===
[environment]
environment_name = "GridWorld"  # string: Optional, choices=["GridWorld", "Maze", "MultiRoom"]
environment_width = 10  # int: Optional, range [5, 50]
environment_height = 10  # int: Optional, range [5, 50]
environment_reward_boundary = 10.0  # double: Optional, range [1.0, 50.0]

# === Logging and Output ===
[logging]
log_level = "INFO"  # string: Optional, choices=["DEBUG", "INFO", "WARN", "ERROR", "FATAL"]
log_to_file = false  # bool: Optional
log_filename = "nlm.log"  # string: Optional
log_max_size_mb = 10.0  # double: Optional, range [1.0, 100.0]

# === Visualization ===
[visualization]
visualization_enabled = false  # bool: Optional
visualization_update_rate = 30.0  # double: Optional, range [1.0, 60.0]
visualization_save_frames = false  # bool: Optional

# === Performance ===
[performance]
use_simd = true  # bool: Optional
use_parallel = false  # bool: Optional
thread_count = 0  # int: Optional, range [0, 64]
checkpoint_interval = 1000  # int: Optional, range [100, 10000]

# === Development ===
[development]
development_stage = "Adult"  # string: Optional, choices=["Initial", "CriticalPeriod", "Maturation", "Adult", "Aging"]
critical_period_start_step = 100  # int: Optional, range [0, 1000]
critical_period_duration = 500  # int: Optional, range [0, 1000]