# NLM Configuration File
# Plasticity preset - Learning and adaptation with STDP and Hebbian plasticity

# Random seed for reproducible experiments
random_seed = 42

# Simulation timestep in seconds
simulation_timestep = 0.001

# Number of neurons in the brain
neuron_count = 1000

# Number of brain regions
region_count = 2

# Connection probability for random connectivity
connection_probability = 0.1

# Plasticity settings
plasticity_learning_rate = 0.02
plasticity_stdp_enable = true
plasticity_stdp_ltp_weight = 0.02
plasticity_stdp_ltd_weight = 0.015
plasticity_stdp_tau = 20.0
plasticity_hebbian_enable = true
plasticity_structural_enable = true

# Structural plasticity parameters
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Maximum simulation steps
max_simulation_steps = 5000

# Logging settings
log_level = INFO
log_to_file = false
log_filename = nlm_plasticity.log

# Enable plasticity simulation
plasticity_simulation_enabled = true
