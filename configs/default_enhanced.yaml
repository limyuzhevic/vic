# NLM Enhanced Configuration
# Supports neural network simulation parameters

nlm:
  description: "Neural Learning Machine Configuration"
  version: "2.0"
  environment: "development"
  
  brain:
    neuron_count: 500
    region_count: 1
    connection_probability: 0.15
    inhibitory_ratio: 0.2
    max_connections_per_neuron: 50
    initial_excitability: 0.5
    initial_inhibitory_strength: 0.5
  
  plasticity:
    stdp_ltp_weight: 0.02
    stdp_ltd_weight: 0.015
    stdp_time_constant: 20.0
    hebbian_learning_rate: 0.01
    structural_plasticity: true
    synaptogenesis_rate: 0.0001
    pruning_rate: 0.00001
    critical_period_duration: 100.0
    plasticity_decay_factor: 0.95
    excitability_change_rate: 0.001
  
  development:
    plasticity_decay_factor: 0.95
    excitability_change_rate: 0.001
    critical_period_duration: 100.0
    structural_plasticity_enabled: true
    age_based_decay: true
    developmental_windows:
      - phase1: 0.0-100.0
      - phase2: 100.0-500.0
      - phase3: 500.0-1000.0
  
  neuromodulation:
    dopamine_baseline: 0.1
    dopamine_effect_strength: 1.0
    curiosity_threshold: 0.5
    novelty_sensitivity: 0.8
    reward_discount_factor: 0.99
    prediction_error_decay: 0.1
  
  memory:
    working_memory_capacity: 10
    episodic_memory_size: 100
    consolidation_rate: 0.5
    replay_frequency: 0.1
    episodic_decay_rate: 0.8
    working_memory_decay_rate: 0.5
  
  cognition:
    planning_horizon: 5
    concept_formation_threshold: 0.7
    attention_span: 10.0
    prediction_horizon: 3
    action_selection_temperature: 1.0
    exploratory_bias: 0.3
  
  environment:
    simulation_timestep: 0.001
    max_simulation_steps: 10000
    environment_width: 10
    environment_height: 10
    enable_vision: true
    enable_audio: true
    enable_internal_signals: true
    sensory_noise_level: 0.01
    reward_function_type: "sparse"
  
  logging:
    log_level: "INFO"
    log_to_file: false
    log_filename: "nlm.log"
    enable_colors: true
    log_format: "json"
    log_rotation_size: 10485760
    log_retention_days: 30
  
  experiments:
    default_preset: "standard"
    enable_stdp_experiment: true
    enable_plasticity_experiment: true
    enable_connectivity_experiment: true
    enable_development_experiment: true
    custom_experiment_config: {}
    experiment_preset_directory: "presets/"
  
  performance:
    parallel_processing_enabled: true
    simd_optimization: true
    memory_pool_enabled: true
    checkpoint_interval: 1000
    checkpoint_compression: true
    cache_size: 1000
    thread_count: 4
  
  validation:
    strict_mode: false
    allow_unknown_keys: true
    validate_ranges: true
    validate_types: true
    custom_validators: []
  
  output:
    save_results: true
    output_format: "json"
    output_directory: "results/"
    include_timestamps: true
    compress_output: false
