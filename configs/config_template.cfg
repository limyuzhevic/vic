# NLM Configuration Template
# This template demonstrates the structure for Phase 6 Final Integration

# === BASIC CONFIGURATION ===
random_seed = 42
simulation_timestep = 0.001
neuron_count = 1000
region_count = 2
connection_probability = 0.15

# === PLASTICITY PARAMETERS ===
plasticity_learning_rate = 0.01
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_time_constant = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# === NEUROMODULATION ===
dopamine_baseline = 0.1
dopamine_sensitivity = 1.0
curiosity_drive = 0.5
novelty_threshold = 0.1

# === REWARD SYSTEM ===
reward_discount_factor = 0.99
exploration_bonus = 0.1

# === ENVIRONMENT ===
environment_name = GridWorld
environment_width = 10
environment_height = 10

# === LOGGING ===
log_level = INFO
log_to_file = false
log_filename = nlm.log
log_use_colors = true

# === VISUALIZATION ===
visualization_enabled = false
visualization_update_rate = 30.0

# === PERFORMANCE ===
enable_multithreading = true
enable_SIMD = true
enable_sparse_connectivity = true
enable_event_driven = true
thread_count = 0

# === CHECKPOINTING ===
checkpoint_path = ./checkpoints/
checkpoint_interval = 1000

# === REPLAY ===
replay_enabled = true
replay_compression = gzip
replay_max_episodes = 100

# === RESEARCH MODE ===
research_mode = false
observation_level = detailed
data_export = false
