# NLM Configuration Template File
# Copy this file to configs/custom.cfg and modify as needed

# Simulation parameters
simulation_timestep = 0.001
max_simulation_steps = 10000

# Network parameters
neuron_count = 1000
region_count = 2
connection_probability = 0.1

# Plasticity parameters
stdp_ltp_weight = 0.01
stdp_ltd_weight = 0.012
stdp_time_constant = 20.0
plasticity_learning_rate = 0.01

# Development parameters
development_synaptogenesis_rate = 0.001
development_pruning_rate = 0.0001

# Neuromodulation parameters
dopamine_baseline = 0.1
reward_discount_factor = 0.99

# Memory parameters
working_memory_capacity = 100
episodic_memory_max_episodes = 1000
working_memory_decay_rate = 0.01

# Cognition parameters
planning_depth = 5
attention_inhibition_strength = 0.5
attention_excitation_strength = 1.5

# Environment parameters
environment_name = GridWorld
environment_width = 10
environment_height = 10

# Logging parameters
log_level = INFO
log_to_file = false
log_filename = nlm.log

# Performance parameters
checkpoint_dir = ./checkpoints
checkpoint_interval = 10000
checkpoint_memory = 5
enable_checkpoint_compression = true

# Testing parameters
enable_test_mode = false
test_neuron_count = 500
test_repetition_count = 1

# Advanced parameters
random_seed = 42
neuron_threshold = 0.0
neuron_leak_conductance = 10.0
neuron_refractory_period = 0.002

# Test experiment parameters
test_current_neuron_count = 10
test_current_strength = 50.0
test_plasticity_steps = 1000
test_stdp_trials = 50
test_most_active_neurons = 10
test_weight_change_threshold = 0.01

