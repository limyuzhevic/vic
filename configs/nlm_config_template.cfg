# NLM Configuration Template File
# Copy this file and customize for your NLM configuration
# Save as nlm_config.cfg or similar

# ==============================================================================
# Core Simulation Parameters
# ==============================================================================

# Random seed for reproducible experiments
# Type: integer
# Range: any integer
# Default: 42
random_seed = 42

# Simulation timestep in seconds
# Type: double
# Range: 0.0 - 1.0 (recommended 0.001 for neuron dynamics)
# Default: 0.001
simulation_timestep = 0.001

# Number of neurons in the brain
# Type: integer64
# Range: 1 - 1000000
# Default: 500
neuron_count = 500

# Number of brain regions
# Type: integer64
# Range: 1 - 100
# Default: 1
region_count = 1

# Connection probability for random connectivity
# Type: double
# Range: 0.0 - 1.0
# Default: 0.15
connection_probability = 0.15

# ==============================================================================
# Plasticity Parameters
# ==============================================================================

# STDP LTP weight
# Type: double
# Range: 0.0 - 1.0
# Default: 0.02
stdp_ltp_weight = 0.02

# STDP LTD weight
# Type: double
# Range: 0.0 - 1.0
# Default: 0.015
stdp_ltd_weight = 0.015

# STDP time constant in ms
# Type: double
# Range: 0.0 - 1000.0
# Default: 20.0
stdp_tau = 20.0

# Synaptogenesis rate
# Type: double
# Range: 0.0 - 1.0
# Default: 0.0001
synaptogenesis_rate = 0.0001

# Pruning rate
# Type: double
# Range: 0.0 - 1.0
# Default: 0.00001
pruning_rate = 0.00001

# ==============================================================================
# Logging Configuration
# ==============================================================================

# Log level (debug, info, warning, error, critical)
# Type: string
# Allowed values: debug, info, warning, error, critical
# Default: info
log_level = info

# Log output file path
# Type: string
# Range: valid file path
# Default: (empty - console only)
log_file = 

# Verbose output
# Type: boolean
# Default: false
verbose = false

# Quiet mode (suppress non-error output)
# Type: boolean
# Default: false
quiet = false

# Debug level (0-3)
# Type: integer
# Range: 0-3
# Default: 0
debug_level = 0

# ==============================================================================
# Output Configuration
# ==============================================================================

# Output format (text, json)
# Type: string
# Allowed values: text, json
# Default: text
output_format = text

# ==============================================================================
# Simulation Control
# ==============================================================================

# Maximum number of simulation steps
# Type: integer64
# Range: 1 - 1000000
# Default: 10000
max_simulation_steps = 10000

# Simulation time limit in seconds (0 = unlimited)
# Type: double
# Range: 0.0 - 1000000.0
# Default: 0.0
simulation_time_limit = 0.0

# ==============================================================================
# Environment Configuration
# ==============================================================================

# Environment name
# Type: string
# Default: GridWorld
environment_name = GridWorld

# Environment width
# Type: integer64
# Range: 1 - 1000
# Default: 10
environment_width = 10

# Environment height
# Type: integer64
# Range: 1 - 1000
# Default: 10
environment_height = 10

# ==============================================================================
# Neuromodulation Configuration
# ==============================================================================

# Dopamine baseline
# Type: double
# Range: -1.0 - 1.0
# Default: 0.0
dopamine_baseline = 0.0

# Reward discount factor
# Type: double
# Range: 0.0 - 1.0
# Default: 0.99
reward_discount_factor = 0.99

# ==============================================================================
# Memory Configuration
# ==============================================================================

# Enable working memory
# Type: boolean
# Default: true
working_memory_enabled = true

# Working memory capacity
# Type: integer64
# Range: 1 - 100000
# Default: 1000
working_memory_capacity = 1000

# Enable episodic memory
# Type: boolean
# Default: true
episodic_memory_enabled = true

# Episodic memory capacity (number of episodes)
# Type: integer64
# Range: 1 - 10000
# Default: 100
episodic_memory_capacity = 100

# ==============================================================================
# Development Configuration
# ==============================================================================

# Enable developmental stages
# Type: boolean
# Default: true
development_enabled = true

# Development stage duration
# Type: double
# Range: 0.0 - 1000.0
# Default: 1.0
development_stage_duration = 1.0

# ==============================================================================
# Checkpoint Configuration
# ==============================================================================

# Enable checkpoint saving
# Type: boolean
# Default: true
checkpoint_enabled = true

# Checkpoint file path
# Type: string
# Default: checkpoints/nlm_checkpoint.bin
checkpoint_path = checkpoints/nlm_checkpoint.bin

# Checkpoint interval (in simulation steps)
# Type: integer64
# Range: 1 - 100000
# Default: 1000
checkpoint_interval = 1000

# ==============================================================================
# Visualization Configuration
# ==============================================================================

# Enable visualization
# Type: boolean
# Default: false
visualization_enabled = false

# Visualization update rate (Hz)
# Type: double
# Range: 1.0 - 1000.0
# Default: 30.0
visualization_update_rate = 30.0

# Visualization file output
# Type: string
# Default: (empty - console only)
visualization_output_file = 

# ==============================================================================
# Notes
# ==============================================================================
# - Values marked as "(default)" will be used if the key is missing
# - Missing values will use hardcoded defaults (see ConfigManager.cpp)
# - Command line arguments override config file values
# - Command line arguments have highest priority
# - Run with --help for more command line options
# - Run with --verbose for detailed logging output
