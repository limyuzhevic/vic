// Batch configuration file
// This file specifies the batch processing configuration
// It includes multiple configuration files to process and processing options

# Batch Processing Configuration
# This file defines the configurations to process in batch mode

[batch_config]
name = "NLM Batch Processing Example"
profile = "standard"
parallel_execution = true
batch_size = 2
num_threads = 4
aggregate_results = true
statistics_only = false
error_handling = true
checkpoint_enabled = false
resource_monitoring = true

# Configuration files to process
[config_files]
config1 = "simple_batch_config.json"
config2 = "medium_batch_config.json"
config3 = "complex_batch_config.json"

# Parameter variations for testing
[parameter_variations]
neuron_count = [100, 200, 300, 400, 500]
plasticity_learning_rate = [0.01, 0.02, 0.03]
stdp_weight = [0.01, 0.02, 0.03, 0.04]

# Output configuration
[output]
format = "csv"
output_file = "batch_results.csv"
verbose = true
detailed_metrics = true

# Logging configuration
[logging]
log_level = "INFO"
log_file = "batch_processing.log"
progress_interval = 5