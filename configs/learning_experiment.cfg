# NLM Learning Experiment Configuration
# Configuration for memory-based learning experiments

# Basic experiment settings
experiment_type = LearningExperiment
random_seed = 123
name = "NLM_Sensory_Learning_Experiment"
description = "Experiments with sensory input and episodic memory formation"

simulation_timestep = 0.001
neuron_count = 800
region_count = 2
max_steps = 5000
learning_episodes = 100
memory_retention_steps = 1000

# Memory systems configuration
working_memory_capacity = 75
working_memory_decay_rate = 0.01
episodic_memory_max_episodes = 200
episodic_memory_compression_rate = 0.05
associative_memory_strength = 0.7
pattern_association_threshold = 0.8

# Sensory processing configuration
sensory_input_strength = 0.6
pattern_complexity = 3
repetition_effect_factor = 1.2
stimulus_variety = 0.8

# Prediction and expectation configuration
prediction_horizon = 5
prediction_confidence_threshold = 0.6
prediction_error_threshold = 0.15
prediction_learning_rate = 0.02
expectation_consolidation_rate = 0.3

# Neuromodulation configuration
dopamine_baseline = 0.3
dopamine_sensitivity = 0.7
dopamine_plasticity_scaling = 1.1
curiosity_baseline = 0.4
curiosity_increment = 0.08
novelty_threshold = 0.4
novelty_sensitivity = 0.9

# Reward and learning configuration
reward_discount_factor = 0.9
reward_learning_rate = 0.015
exploration_bonus = 0.15
reward_prediction_error_learning = 0.05
valenced_learning = true

# Development configuration
developmental_stage_transition_rate = 0.03
plasticity_modifier_strength = 0.25
structural_plasticity_enabled = false  # Focus on synaptic plasticity

# Experimental parameters
checkpoint_interval = 2000
checkpoint_path = ./checkpoints/learning_experiment
replay_enabled = true
replay_interval = 200
replay_strength = 0.6
replay_consolidation = true

# Learning metrics
learning_success_threshold = 0.5
memory_retention_target = 0.8
pattern_completion_threshold = 0.7

# Logging and output
log_level = INFO
log_to_file = true
log_filename = learning_experiment.log
performance_tracking = true
verbose_output = true
metrics_collection_interval = 50

# Brain connectivity
sensory_neuron_ratio = 0.3
internal_neuron_ratio = 0.4
motor_neuron_ratio = 0.3
internal_connection_probability = 0.12
motor_connection_probability = 0.08

# Plasticity rules
stdp_ltp_weight = 0.008
stdp_ltd_weight = 0.01
stdp_time_constant = 15.0
hebbian_learning_rate = 0.006
structural_synaptogenesis_rate = 0.0005
structural_pruning_rate = 0.00005

# Environment simulation
environment_width = 20
environment_height = 20
vision_range = 12
vision_angle = 120.0
energy_max = 150.0
energy_decay_rate = 0.008
resource_value = 15.0
hazard_damage = 8.0
