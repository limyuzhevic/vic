# NLM Phase 2 Experiment Configuration Files
# These configuration files demonstrate the enhanced configuration system

# ==============================================================================
# Basic Connectivity Test Configuration
# ==============================================================================
[test1_basic_connectivity]
# Description: Tests basic neural connectivity
# Experiment: Basic Connectivity
# Expected result: Spikes should propagate through the network

# Core parameters
neuron_count = 500
region_count = 1
connection_probability = 0.15
simulation_timestep = 0.001
random_seed = 42

# Plasticity parameters (even if disabled, they should be present)
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Test-specific parameters
injected_current = 50.0
injected_neurons = 10
step_count = 50

# Configuration metadata
source = "default"
validation_mode = false
optimization_level = "aggressive"

# ==============================================================================
# Plasticity Learning Experiment Configuration
# ==============================================================================
[test2_plasticity_learning]
# Description: Tests synaptic plasticity through repeated experience
# Experiment: Plasticity Learning
# Expected result: Measurable weight changes through learning

# Core parameters
neuron_count = 500
region_count = 1
connection_probability = 0.15
simulation_timestep = 0.001
random_seed = 42

# Enhanced plasticity parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# Learning parameters
input_pattern_size = 20
input_current = 30.0
step_count = 1000
progress_log_interval = 100

# Configuration metadata
source = "experiment"
validation_mode = true
optimization_level = "balanced"
enable_plasticity = true
enable_structural_plasticity = true

# ==============================================================================
# STDP Verification Experiment Configuration
# ==============================================================================
[test3_stdp_verification]
# Description: Tests spike-timing-dependent plasticity specifically
# Experiment: STDP Verification
# Expected result: Pre-before-post timing should produce potentiation

# Core parameters
neuron_count = 500
region_count = 1
connection_probability = 0.15
simulation_timestep = 0.001
random_seed = 42

# STDP-specific parameters
stdp_ltp_weight = 0.02
stdp_ltd_weight = 0.015
stdp_tau = 20.0
synaptogenesis_rate = 0.0001
pruning_rate = 0.00001

# STDP test parameters
pre_post_trials = 50
pre_post_current = 60.0
neurons_to_test = 5

# Configuration metadata
source = "experiment"
validation_mode = true
optimization_level = "conservative"
enable_stdp_only = true

