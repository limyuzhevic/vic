# ==============================================================================
# Plugin Configuration
# ==============================================================================
[plugin_config]
# Description: Configuration for plugin system
# Experiment: Plugin Architecture
# Expected result: Plugin loading and execution support

# Core parameters
neuron_count = 300
region_count = 2
connection_probability = 0.12
simulation_timestep = 0.001
random_seed = 777

# Plugin system settings
enable_plugins = true
plugin_path = "plugins"
plugin_extensions = [".nlmplug", ".so", ".dll"]
max_plugins = 10
plugin_timeout = 30.0

# Configuration metadata
source = "plugin"
validation_mode = true
optimization_level = "standard"

# ==============================================================================
# Advanced Configuration
# ==============================================================================
[advanced_config]
# Description: Advanced configuration with all features enabled
# Experiment: Advanced Testing
# Expected result: Full feature demonstration

# Core parameters
neuron_count = 1500
region_count = 3
connection_probability = 0.18
simulation_timestep = 0.0002
random_seed = 888

# Advanced features
parallel_enabled = true
cpu_cores = 16
memory_limit_mb = 4096
enable_monitoring = true
enable_profiling = true
enable_logging = true
log_level = "debug"
capture_logs = true
enable_visualization = true
visualization_output = "html"

# Advanced plasticity
enable_plasticity = true
enable_structural_plasticity = true
enable_development = true
enable_curiosity = true
enable_prediction = true

# Configuration metadata
source = "advanced"
validation_mode = true
optimization_level = "advanced"
plugin_support = true
performance_mode = "maximum"