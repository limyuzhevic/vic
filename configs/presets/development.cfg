# NLM Development Preset Configuration
# Purpose: Optimized for development, testing, and debugging
# Version: 1.0
# Date: $(date)

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

random_seed = 0  # Use system time for variability
simulation_timestep = 0.001
neuron_count = 100
region_count = 1
connection_probability = 0.15

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# STDP (high learning rate for quick feedback)
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.02
plasticity.stdp.tau_plus = 25.0
plasticity.stdp.tau_minus = 25.0
plasticity.stdp.max_weight = 2.0
plasticity.stdp.min_weight = 0.1

# Hebbian (enabled for comprehensive learning)
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.05
plasticity.hebbian.time_constant = 500.0
plasticity.hebbian.similarity_threshold = 0.7

# Structural Plasticity (enabled for development)
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.005
plasticity.structural.pruning_rate = 0.0001

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Neuromodulator scaling (high)
neuromod.dopamine.scale = 2.0
neuromod.serotonin.scale = 1.5
neuromod.norepinephrine.scale = 1.5
neuromod.acetylcholine.scale = 1.5

# Exploration (high)
neuromod.curiosity.enable = true
neuromod.curiosity.weight = 0.3
neuromod.novelty.enable = true
neuromod.novelty.threshold = 0.08

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# RL (high exploration)
rl.curiosity_weight = 0.25
rl.novelty_threshold = 0.08
rl.reward_discount_factor = 0.95
rl.prediction_error_weight = 1.5
rl.exploration_rate = 0.25

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Small environment for rapid iteration
environment.name = GridWorld
environment.width = 10.0
environment.height = 10.0
environment.vision_range = 15.0
environment.auditory_range = 15.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Maximum logging for debugging
log.level = DEBUG
log.to_file = true
log.filename = development_simulation.log
log.max_size = 50
log.max_files = 3

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Short simulation runs for quick iteration
simulation.max_steps = 1000
simulation.checkpoint_interval = 0

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# Optional visualization for development
visualization.enabled = false
visualization.fps = 30
visualization.width = 1024
visualization.height = 768
