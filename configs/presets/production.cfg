# NLM Production Preset Configuration
# Purpose: Optimized for stable, long-running production simulations
# Version: 1.0
# Date: $(date)

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

random_seed = 42
simulation_timestep = 0.01
neuron_count = 5000
region_count = 10
connection_probability = 0.05

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# STDP (optimized for stability)
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.005
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0
plasticity.stdp.max_weight = 1.0
plasticity.stdp.min_weight = 0.0

# Hebbian (disabled for stability)
plasticity.hebbian.enable = false

# Structural Plasticity (minimal for stability)
plasticity.structural.enable = false

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Neuromodulator scaling (moderate)
neuromod.dopamine.scale = 0.5
neuromod.serotonin.scale = 0.5
neuromod.norepinephrine.scale = 0.5
neuromod.acetylcholine.scale = 0.5

# Exploration (reduced)
neuromod.curiosity.enable = true
neuromod.curiosity.weight = 0.05
neuromod.novelty.enable = true
neuromod.novelty.threshold = 0.2

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# RL (stability-focused)
rl.curiosity_weight = 0.05
rl.novelty_threshold = 0.2
rl.reward_discount_factor = 0.999
rl.prediction_error_weight = 1.0
rl.exploration_rate = 0.05

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Standard production environment
environment.name = GridWorld
environment.width = 20.0
environment.height = 20.0
environment.vision_range = 20.0
environment.auditory_range = 20.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Performance-optimized logging
log.level = WARN
log.to_file = true
log.filename = production_simulation.log
log.max_size = 500
log.max_files = 10

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Long simulation runs
# simulation.max_steps = 50000
# simulation.checkpoint_interval = 5000

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# Optional visualization
visualization.enabled = false
visualization.fps = 30
visualization.width = 1920
visualization.height = 1080
