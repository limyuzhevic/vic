# NLM Research Preset Configuration
# Purpose: Optimized for scientific experiments and parameter studies with comprehensive exploration and analysis capabilities
# Version: 1.0
# Date: $(date)

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

# Research-grade random seed for reproducibility
random_seed = 12345

# High precision simulation timestep for scientific accuracy
simulation_timestep = 0.001

# Medium-sized network for detailed experimental analysis
neuron_count = 1000

# Multiple regions for complex spatial analysis
region_count = 5

# Slightly higher connectivity for exploration studies
connection_probability = 0.15

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# Comprehensive STDP parameters for synaptic plasticity studies
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.tau_plus = 30.0
plasticity.stdp.tau_minus = 30.0
plasticity.stdp.max_weight = 1.5
plasticity.stdp.min_weight = 0.2

# Full Hebbian learning mechanism for co-activation studies
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.015
plasticity.hebbian.time_constant = 800.0
plasticity.hebbian.similarity_threshold = 0.6

# Structural plasticity for network development studies
plasticity.structural.enable = true
plasticity.structural.synaptogenesis_rate = 0.002
plasticity.structural.pruning_rate = 0.0002

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Enhanced neuromodulation for complex behavioral modeling
neuromod.dopamine.scale = 1.0
neuromod.serotonin.scale = 0.8
neuromod.norepinephrine.scale = 0.8
neuromod.acetylcholine.scale = 0.8

# Comprehensive exploration capabilities for scientific study
neuromod.curiosity.enable = true
neuromod.curiosity.weight = 0.2
neuromod.novelty.enable = true
neuromod.novelty.threshold = 0.12

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# Detailed reward-based learning parameters
rl.curiosity_weight = 0.15
rl.novelty_threshold = 0.12
rl.reward_discount_factor = 0.97
rl.prediction_error_weight = 1.2
rl.exploration_rate = 0.15

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Extended environment for comprehensive spatial studies
environment.name = GridWorld
environment.width = 15.0
environment.height = 15.0
environment.vision_range = 25.0
environment.auditory_range = 25.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Comprehensive logging for scientific data collection and analysis
log.level = INFO
log.to_file = true
log.filename = research_simulation.log
log.max_size = 200
log.max_files = 10

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Extended simulation length for thorough experimental analysis
simulation.max_steps = 50000
simulation.checkpoint_interval = 5000

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# Optional visualization for research analysis
visualization.enabled = false
visualization.fps = 30
visualization.width = 1920
visualization.height = 1080

# ==============================================
# PYTHON BINDINGS
# ==============================================

# Enable Python API for research data analysis
python_bindings_enabled = true
python_port = 8888
