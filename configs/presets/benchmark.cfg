# NLM Benchmark Preset Configuration
# Purpose: Optimized for performance benchmarking and scalability testing
# Version: 1.0
# Date: $(date)

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

random_seed = 123456
simulation_timestep = 0.01
neuron_count = 1000
region_count = 2
connection_probability = 0.05

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# STDP (minimal for performance)
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.001
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian (disabled for performance)
plasticity.hebbian.enable = false

# Structural Plasticity (disabled for performance)
plasticity.structural.enable = false

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Neuromodulator scaling (minimal)
neuromod.dopamine.scale = 0.1
neuromod.serotonin.scale = 0.1
neuromod.norepinephrine.scale = 0.1
neuromod.acetylcholine.scale = 0.1

# Exploration (minimal)
neuromod.curiosity.enable = false
neuromod.novelty.enable = false

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# RL (minimal)
rl.curiosity_weight = 0.0
rl.novelty_threshold = 1.0  # Effectively disabled
rl.reward_discount_factor = 1.0  # No discounting
rl.prediction_error_weight = 1.0
rl.exploration_rate = 0.0

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Standard environment
environment.name = GridWorld
environment.width = 10.0
environment.height = 10.0
environment.vision_range = 10.0
environment.auditory_range = 10.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Minimal logging for performance
log.level = ERROR
log.to_file = false

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Fixed simulation length for benchmarking
simulation.max_steps = 1000
simulation.checkpoint_interval = 0

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# No visualization for pure performance testing
visualization.enabled = false
