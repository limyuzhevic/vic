# NLM Documentation Preset Configuration
# Purpose: Optimized for documentation and examples with clear, comprehensive parameters
# Version: 1.0
# Date: $(date)

# ==============================================
# CORE SIMULATION PARAMETERS
# ==============================================

# Example random seed for documentation
random_seed = 42

# Example simulation timestep
# This shows the smallest possible timestep for high precision demonstrations
simulation_timestep = 0.001

# Example neuron count for documentation
neuron_count = 100

# Example region count demonstrating simple multi-region setup
region_count = 2

# Example connection probability for sparse connectivity
connection_probability = 0.1

# ==============================================
# PLASTICITY LEARNING MECHANISMS
# ==============================================

# STDP (Spike-Timing Dependent Plasticity) - Enable for basic documentation
plasticity.stdp.enable = true
plasticity.stdp.learning_rate = 0.01
plasticity.stdp.tau_plus = 20.0
plasticity.stdp.tau_minus = 20.0

# Hebbian Learning - Enable to show alternative learning mechanism
plasticity.hebbian.enable = true
plasticity.hebbian.learning_rate = 0.01
plasticity.hebbian.time_constant = 500.0

# ==============================================
# NEUROMODULATION SYSTEM
# ==============================================

# Neuromodulator scaling factors for documentation
neuromod.dopamine.scale = 0.5
neuromod.serotonin.scale = 0.5
neuromod.norepinephrine.scale = 0.5
neuromod.acetylcholine.scale = 0.5

# ==============================================
# REINFORCEMENT LEARNING
# ==============================================

# Basic reinforcement learning parameters
rl.curiosity_weight = 0.1
rl.novelty_threshold = 0.1
rl.reward_discount_factor = 0.99
rl.prediction_error_weight = 1.0

# ==============================================
# ENVIRONMENT PARAMETERS
# ==============================================

# Standard environment for documentation examples
environment.name = GridWorld
environment.width = 10.0
environment.height = 10.0
environment.vision_range = 20.0
environment.auditory_range = 20.0

# ==============================================
# LOGGING SYSTEM
# ==============================================

# Standard logging for documentation examples
log.level = INFO
log.to_file = false
log.filename = nlm_documentation.log
log.max_size = 100
log.max_files = 5

# ==============================================
# SIMULATION CONTROL
# ==============================================

# Standard simulation length for documentation examples
simulation.max_steps = 1000
simulation.checkpoint_interval = 100

# ==============================================
# VISUALIZATION SYSTEM
# ==============================================

# Visualization for documentation examples
visualization.enabled = false
visualization.fps = 30
visualization.width = 1280
visualization.height = 720

# ==============================================
# PYTHON BINDINGS
# ==============================================

# Enable Python API for documentation
python_bindings_enabled = true
python_port = 8888
