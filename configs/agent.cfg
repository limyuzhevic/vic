# AgentBrain Configuration File
# This file contains configuration parameters for the AgentBrain system
# Parameters can be customized to tune agent behavior

[MOTOR]
# Motor scaling factors (controls the strength of motor neuron outputs)
motor_forward_scale = 1.0
motor_backward_scale = 1.0
motor_left_scale = 1.0
motor_right_scale = 1.0
motor_interact_scale = 1.0

[SENSOR]
# Sensory scaling factors (controls the strength of sensory neuron inputs)
sensory_vision_scale = 5.0
sensory_touch_scale = 8.0
sensory_internal_scale = 5.0
sensory_proprioception_scale = 3.0

[NEUROMODULATION]
# Neuromodulation parameters (dopamine sensitivity, reward prediction)
dopamine_sensitivity = 1.0
reward_prediction_error_sensitivity = 1.0
dopamine_clamp_min = -1.0
dopamine_clamp_max = 1.0

[DEVELOPMENT]
# Development parameters (plasticity modifiers, stage durations)
plasticity_modifier_initial = 1.0
plasticity_modifier_critical = 0.8
plasticity_modifier_maturation = 0.5
plasticity_modifier_adult = 0.2
development_stage_initial = 60.0
development_stage_critical = 300.0
development_stage_maturation = 900.0
development_stage_adult = 1000000.0
synaptogenesis_rate_base = 0.0001
pruning_rate_base = 0.00001

[CURIOSITY]
# Curiosity/Exploration parameters (thresholds and exploration chances)
curiosity_threshold = 0.3
exploration_chance_max = 0.3
curiosity_sensitivity = 2.0
prediction_error_weight = 0.5

[NOVELTY]
# Novelty detection parameters (decay rate, sensitivity)
novelty_decay_rate = 0.99
novelty_sensitivity = 1.0

[BEHAVIOR]
# Behavioral parameters (action selection thresholds, random exploration)
action_selection_threshold = 0.5
random_exploration_threshold = 0.5
random_action_count = 8
motor_noise_level = 0.0

[FLAGS]
# Configuration flags (enable/disable features)
reward_modulation_enabled = true
structural_plasticity_enabled = true
development_enabled = true
curiosity_enabled = true

# Command line usage:
# ./agent --config configs/agent.cfg
# ./agent --config configs/agent.cfg motor_forward_scale=1.5 sensory_vision_scale=7.0
# ./agent motor_forward_scale=1.5 sensory_vision_scale=7.0

# Notes:
# All values are type-checked during loading
# Default values are used if parameters are not specified
# Parameters can be overridden via command line arguments
# Boolean values: true/false, 1/0, yes/no
# Float values support decimal notation
# Comments start with # or ;