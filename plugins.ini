# Plugin Registry Configuration
# This file contains the list of available plugins and their configurations

[plugins]
# List of all available plugins
plugin_names = [
    "lif-neuron",
    "adaptive-exponential", 
    "stdp-rule",
    "hebbian-rule",
    "dopamine-modulator",
    "serotonin-modulator",
    "working-memory",
    "episodic-memory"
]

# Plugin metadata
[plugins.lif-neuron]
name = "LIF Neuron Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "neuron"
enabled = true
auto_load = true

default_config.threshold = -55.0
default_config.resting_potential = -70.0
default_config.membrane_time_constant = 20.0
default_config.refractory_period = 5.0
default_config.leak_conductance = 10.0

[plugins.adaptive-exponential]
name = "Adaptive Exponential Neuron Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "neuron"
enabled = true
auto_load = false

default_config.threshold = -50.0
default_config.resting_potential = -65.0
default_config.membrane_time_constant = 10.0
default_config.refractory_period = 2.0
default_config.leak_conductance = 8.0
default_config.adaptation_variable = 0.0

[plugins.stdp-rule]
name = "STDP Plasticity Rule Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "plasticity"
enabled = true
auto_load = true

default_config.ltp_weight = 0.01
default_config.ltd_weight = 0.012
default_config.time_constant = 20.0
default_config.min_weight = -1.0
default_config.max_weight = 1.0

[plugins.hebbian-rule]
name = "Hebbian Plasticity Rule Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "plasticity"
enabled = true
auto_load = true

default_config.learning_rate = 0.01
default_config.max_weight = 1.0
default_config.min_weight = -1.0
default_config.covariance_threshold = 0.0

[plugins.dopamine-modulator]
name = "Dopamine Neuromodulator Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "neuromodulation"
enabled = true
auto_load = true

default_config.baseline_level = 0.0
default_config.reward_sensitivity = 1.0
default_config.prediction_error_sensitivity = 1.0

[plugins.serotonin-modulator]
name = "Serotonin Neuromodulator Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "neuromodulation"
enabled = true
auto_load = true

default_config.baseline_level = 0.0
default_config.mood_influence = 1.0
default_config.impulsivity_suppression = 0.8

[plugins.working-memory]
name = "Working Memory Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "memory"
enabled = true
auto_load = true

default_config.max_capacity = 100
default_config.activation_decay = 0.95
default_config.update_frequency = 10.0

[plugins.episodic-memory]
name = "Episodic Memory Plugin"
version = "1.0.0"
author = "NLM Team"
license = "MIT"
category = "memory"
enabled = true
auto_load = false

default_config.max_capacity = 1000
default_config.decay_rate = 0.01
default_config.consolidation_threshold = 3.0

# Plugin dependencies
[plugins.dependencies]
lif-neuron = []
adaptive-exponential = ["lif-neuron"]
stdp-rule = ["lif-neuron"]
hebbian-rule = []
dopamine-modulator = []
serotonin-modulator = []
working-memory = []
episodic-memory = ["working-memory"]
