# NLM Brain Configuration Template
# =============================
#
# This file configures the NLM (Neural Learning Machine) brain simulation.
# Copy this file as "brain_config.ini" to your project directory and modify
# the values to suit your needs.
#
# Configuration values can be:
#   - Integers: e.g., neuron_count = 1000
#   - Floats: e.g., connection_probability = 0.1
#   - Booleans: e.g., enable_reward_modulation = true
#   - Strings: e.g., checkpoint_dir = "./checkpoints"
#   - Arrays: e.g., sensory_dimensions = [84, 84, 3]
#

# Core Simulation Parameters
# ---------------------------
neuron_count = 1000                    # Total number of neurons in the brain
region_count = 4                      # Number of brain regions
connection_probability = 0.1           # Probability of synaptic connections
simulation_timestep = 0.001            # Simulation time step in seconds
random_seed = 42                      # Random number generator seed
enable_developmental_stages = true    # Enable developmental stages

# Network Architecture
# --------------------
# Region-specific settings (example for 4 regions)
# neuron_count_region_1 = 250
# neuron_count_region_2 = 250
# neuron_count_region_3 = 250
# neuron_count_region_4 = 250

# Population distribution per region
# sensory_neurons = 10% of region neurons
# internal_excitatory = 80% of internal neurons
# internal_inhibitory = 20% of internal neurons
# motor_neurons = 10% of region neurons

# Learning and Plasticity
# ---------------------
stdp_ltp_weight = 0.01                # STDP LTP weight
stdp_ltd_weight = 0.012               # STDP LTD weight
stdp_tau = 20.0                       # STDP time constant

# Synaptic Plasticity
# ------------------
synaptogenesis_rate = 0.0001          # Rate of new synapse formation
pruning_rate = 0.00001                # Rate of synapse elimination

# Neuromodulation
# ----------------
enable_dopamine = true               # Reward-based modulation
enable_curiosity = true               # Exploration motivation
enable_novelty = true                  # Novelty detection
enable_prediction_error = true         # Prediction error signals

# Memory Systems
# -------------
enable_working_memory = true          # Working memory system
working_memory_capacity = 100          # Working memory capacity

enable_episodic_memory = true        # Episodic memory system
max_episodes = 1000                    # Maximum number of episodes

enable_associative_memory = true      # Associative memory system

# Cognitive Systems
# -----------------
enable_planner = true                 # Action planning
planning_depth = 5                    # Planning horizon

enable_concept_formation = true       # Concept discovery
attention_inhibition_strength = 0.5   # Attention inhibition
attention_excitation_strength = 1.5   # Attention excitation

# Developmental Stages
# --------------------
development_stage = "Initial"          # Current developmental stage
replay_interval = 100                 # Memory replay interval
consolidation_interval = 1000          # Memory consolidation interval

# Checkpointing
# ------------
checkpoint_dir = "./checkpoints"       # Directory for checkpoints
checkpoint_interval = 10000            # Steps between checkpoints
max_checkpoints = 5                    # Maximum checkpoints to keep
enable_compression = true             # Enable checkpoint compression

# Simulation Control
# ------------------
enable_sensory_input = true           # Enable sensory input processing
enable_motor_output = true            # Enable motor output
enable_brain_monitor = true           # Enable brain status monitoring

# Experiment Settings
# ------------------
experiment_name = "default"            # Current experiment name
enable_logging = true                  # Enable simulation logging
log_level = "info"                     # Log level (debug, info, warning, error)

# Visualization (if enabled)
# ------------------
# enable_visualization = false
# visualization_window_width = 1280
# visualization_window_height = 720
# visualization_refresh_rate = 60

# Performance Settings
# -------------------
# enable_performance_monitoring = true
# performance_profiling = false
# enable_simd = true                    # Use SIMD optimizations
# enable_multithreading = true          # Use multithreading

# Environment Settings
# ------------------
# environment_type = "simple"            # Environment type
# world_width = 100.0                  # World width
# world_height = 100.0                 # World height
# max_energy = 100.0                    # Maximum agent energy
# energy_decay_rate = 0.001             # Energy decay per step

# Logging and Monitoring
# --------------------
# log_file = "nlm_simulation.log"
# stats_interval = 100                  # Statistics output interval
# metrics_output = "console"            # Metrics output format (console, file, json)

# Advanced Settings
# ---------------
# learning_rate = 0.01                 # Overall learning rate
# exploration_rate = 0.1               # Exploration vs. exploitation
# discount_factor = 0.95                # Reward discount factor
# temperature = 1.0                     # Softmax temperature for action selection

# Debug and Testing
# -----------------
# debug_mode = false                    # Enable debug mode
# test_mode = false                     # Run in test mode
# validate_config = true                # Validate configuration on startup

# Phase-specific settings
# --------------------- (adjust based on your current phase)
# PHASE 2 settings (basic neural dynamics)
#   - Real LIF neuron model
#   - Basic spike propagation
#   - Simple STDP learning

# PHASE 3 settings (world interaction)
#   - Sensory input processing
#   - Motor output generation
#   - Reward prediction error

# PHASE 4 settings (cognitive functions)
#   - Neural prediction system
#   - Working memory
#   - Episodic-like memory
#   - Predictive planning

# PHASE 5 settings (performance optimizations)
#   - Memory pools and event queues
#   - SIMD vectorization
#   - Parallel processing

# PHASE 6 settings (final integration)
#   - All systems integrated
#   - Complete brain loop
#   - Memory and prediction systems
#   - Neuromodulation integration