# Advanced Configuration Example for NLM
# This file demonstrates advanced configuration options for power users

# Core Configuration
core_settings {
    random_seed = 12345
    simulation_timestep = 0.0001
    neuron_count = 10000
    region_count = 3
    connection_probability = 0.2
    connectivity_pattern = "small_world"
}

# Advanced Plasticity Configuration
plasticity {
    hebbian.enable = true
    hebbian.learning_rate = 0.02
    stdp.enable = true
    stdp.ltp_weight = 0.025
    stdp.ltd_weight = 0.015
    stdp.tau = 30.0
    stdp_tau_p = 20.0
    stdp_tau_m = 20.0
    structural.enable = true
    structural.synaptogenesis_rate = 0.0005
    structural.pruning_rate = 0.00005
    neuromodulation.enable = true
}

# Neuromodulation Settings
neuromodulation {
    dopamine.base_level = 0.1
    dopamine.scale = 1.5
    curiosity.enable = true
    curiosity.adaptation_rate = 0.001
    novelty.enable = true
    novelty.threshold = 0.05
    reward.enable = true
    reward.discount_factor = 0.95
    prediction.error_tolerance = 0.1
}

# Memory System Configuration
memory {
    working_memory.capacity = 1000
    working_memory.similarity_threshold = 0.8
    episodic_memory.enable = true
    episodic_memory.capacity = 5000
    episodic_memory.similarity_threshold = 0.7
    semantic_memory.enable = true
    procedural_memory.enable = true
    associative_memory.association_strength = 0.9
}

# Cognitive System Configuration
cognition {
    concept_formation.threshold = 0.6
    concept_formation.adaptive_threshold = true
    attention.enable = true
    attention.competition_strength = 0.8
    planning.enable = true
    planning.lookahead_depth = 5
    planner.uncertainty_weight = 0.3
    self_model.enable = true
    self_model.update_rate = 0.1
}

# Development Configuration
development {
    developmental_stages.enable = true
    developmental_stages.num_stages = 6
    developmental_stages.duration_multiplier = 2.0
    plasticity_rates.base = 0.01
    plasticity_rates.critical_period = 0.05
    plasticity_rates.adult = 0.001
    maturation.rate = 0.02
    synaptogenesis.rate = 0.001
    pruning.rate = 0.0001
}

# Environment Configuration
environment {
    world.width = 50
    world.height = 50
    world.obstacle_density = 0.1
    perception.sensory_range = 10.0
    perception.noise_level = 0.05
    perception.resolution = "high"
}

# Advanced Output Configuration
output {
    logging.level = "DEBUG"
    logging.file = "nlm_advanced.log"
    logging.format = "json"
    logging.async = true
    visualization.enable = true
    visualization.update_rate = 60.0
    visualization.output_file = "nlm_simulation.png"
    visualization.formats = ["png", "pdf", "svg"]
    benchmark.enable = true
    benchmark.output_format = "json"
    benchmark.metrics = ["performance", "memory", "neurons", "synapses"]
}

# Advanced Performance Configuration
performance {
    threading.enable = true
    threading.max_threads = 8
    optimization.level = "aggressive"
    memory_pool.enable = true
    memory_pool.chunk_size = 4096
    event_queue.enable = true
    event_queue.max_size = 100000
    caching.enable = true
    caching.eviction_policy = "lru"
}

# Advanced Error Handling
error_handling {
    handling.level = "comprehensive"
    reporting.enable = true
    reporting.format = "structured"
    recovery.enable = true
    recovery.max_attempts = 3
    validation.enable = true
    validation.strict_mode = true
}

# Plugin Configuration
plugins {
    discovery.enable = true
    discovery.path = "plugins/"
    auto_load = true
    plugin_config.enable = true
}

# Experimental Configuration
experimental {
    ablation.enable = true
    ablation.mode = "targeted"
    perturbation.enable = true
    perturbation.strength = 0.5
    ablation.enable = true
    ablation.mode = "targeted"
    perturbation.enable = true
    perturbation.strength = 0.5
}