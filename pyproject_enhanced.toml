[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynlm_enhanced"
version = "0.6.0"
description = "Enhanced Python bindings for NLM (Neural Learning Machine) - Phase 6 integration with advanced features"
readme = "ENHANCED_README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NLM Authors", email = "research@nlm-project.org"}
]
keywords = ["neural", "simulation", "spiking", "brain", "learning", "enhanced", "advanced"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
    "scikit-build-core>=0.5.0",
    "pybind11>=2.11.0",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]
research = [
    "jupyter>=1.0",
    "matplotlib>=3.0",
    "pandas>=1.0",
    "scipy>=1.0",
]
examples = [
    "notebook>=6.0",
    "ipywidgets>=7.0",
]

[project.urls]
Homepage = "https://github.com/nlm-project/nlm"
Documentation = "https://nlm.readthedocs.io"
Repository = "https://github.com/nlm-project/nlm.git"
Issues = "https://github.com/nlm-project/nlm/issues"

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DPYTHON_EXECUTABLE={python}",
    "-DNLM_ENABLE_ENHANCED_BINDINGS=ON",
]

[tool.scikit-build.cmake.define]
NLM_SOURCE_DIR = "src"
NLM_ENABLE_ENHANCED_BINDINGS = true
NLM_ENABLE_PYTHON_BINDINGS = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/experiments/*",
]

[tool.coverage.report]
exclude_lines = [
    pragma: no cover",
    def __repr__",
    if self.debug",
    raise AssertionError",
    raise NotImplementedError",
    if 0",  # Prevent branches that are never executed
    if False",  # Prevent branches that are never executed
    # Don't complain about exception handling pieces that don't need to be tested
    except .+?:",  # Don't complain about exception handling pieces that don't need to be tested
    # Don't complain about Python 2 specific code paths that don't need to be tested either
    def __getattr__",
    # Type annotations
    .*: typing\.cast",
    .*: typing\.cast",
    .*: typing\.cast",
]

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = '''
.*/tests/.*
.*/examples/.*
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
]
per-file-ignores = {}

[tool.pylint]
master = " pylint"
load-plugins = "pylint.extensions"
reports = "false"
max-line-length = 88
ignore = [
    "C0103",  # invalid-name
    "C0111",  # missing-docstring
    "C0301",  # line-too-long
    "R0913",  # too-many-arguments
    "R0902",  # too-many-instance-attributes
    "R0912",  # too-many-branches
    "R0915",  # too-many-statements
]

[tool.ruff.per-file-ignores]
"src/experiments/py/nlm_enhanced.cpp" = [
    "E501",  # line too long
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
]

[tool.ruff.isort]
known-first-party = ["nlm"]
known-third-party = ["pybind11", "numpy"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
