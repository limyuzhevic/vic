# Micro Benchmark Configuration
# For small-scale benchmarking (1K neurons)

benchmark_type = 0
target_steps_per_second = 20000.0
target_memory_mb = 100.0
warmup_steps = 50
measurement_steps = 500
num_threads = 1
monitor_memory = true
monitor_cpu = true
monitor_events = true
monitor_fragmentation = false
export_results = true
export_path = results/micro
export_format = both
compute_statistics = true
compute_regression = false
