# NLM Example Configuration - Simple Brain

# This configuration creates a minimal brain for basic testing

[brain]
neuron_count = 100
region_count = 2
connection_probability = 0.05

[plasticity.stdp]
enable = true
learning_rate = 0.001
tau_plus = 20.0
tau_minus = 20.0

[plasticity.hebbian]
enable = true
learning_rate = 0.0005

[development]
initial_plasticity = 1.0
critical_period_duration = 1000.0
maturation_rate = 0.01

[environment]
name = GridWorld
width = 10
height = 10
vision_width = 8
vision_height = 8

[logging]
level = INFO
to_file = false
filename = nlm.log

[max_simulation_steps]
steps = 1000
