# NLM Advanced Configuration Example
# This file demonstrates the various configuration options available for NLM
# It includes examples of different configuration formats and advanced settings

# ========================================
# Basic Configuration
# ========================================
[GENERAL]
# Core simulation parameters
neuron_count = 1000                    # Total number of neurons in the brain
region_count = 1                      # Number of brain regions
connection_probability = 0.1           # Probability of forming synapses between neurons
random_seed = 42                      # Random seed for reproducible simulations
simulation_timestep = 0.001           # Time step for simulation (seconds)

# Plasticity parameters
stdp_ltp_weight = 0.01f               # STDP Long-Term Potentiation weight
stdp_ltd_weight = 0.012f              # STDP Long-Term Depression weight
stdp_tau = 20.0f                       # STDP time constant (ms)
synaptogenesis_rate = 0.0001f         # Rate of new synapse formation
pruning_rate = 0.00001f               # Rate of synapse elimination

# ========================================
# Advanced Configuration
# ========================================
[ADVANCED]
# Advanced simulation parameters
enable_checkpointing = true            # Enable checkpoint saving
checkpoint_dir = ./checkpoints         # Directory for checkpoints
checkpoint_interval = 1000             # Steps between checkpoints
checkpoint_compression = balanced      # Compression level (none, fast, balanced, maximum)

# Development parameters
enable_development = true              # Enable developmental stages
development_interval = 1000            # Steps between development updates
developmental_stage_duration = 300      # Duration of each developmental stage (ms)

# Neuromodulation parameters
enable_dopamine = true                # Enable dopamine system
dopamine_sensitivity = 1.0f            # Sensitivity to reward prediction error
enable_curiosity = true               # Enable curiosity system
curiosity_threshold = 0.3f             # Threshold for curiosity-driven exploration
enable_novelty = true                  # Enable novelty detection
novelty_decay = 0.95f                  # Novelty decay rate

# Memory parameters
working_memory_capacity = 500          # Capacity of working memory
episodic_memory_max_episodes = 1000    # Maximum number of episodes to store
associative_memory_pattern_threshold = 10  # Threshold for pattern formation

# Cognitive parameters
planning_depth = 5                    # Planning depth for neural planner
attention_inhibition_strength = 0.5f  # Strength of attentional inhibition
attention_excitation_strength = 1.5f   # Strength of attentional excitation
concept_formation_threshold = 0.7f     # Threshold for concept formation

# ========================================
# Environment Configuration
# ========================================
[ENVIRONMENT]
# Simple world configuration
world_width = 20.0f                    # Width of the world
world_height = 20.0f                   # Height of the world
vision_width = 16                      # Vision sensor width
vision_height = 16                     # Vision sensor height
max_energy = 100.0f                    # Maximum agent energy
energy_decay_rate = 0.01f              # Rate of energy decay
resource_energy_gain = 30.0f           # Energy gain from resources
hazard_damage = 0.2f                    # Damage from hazards

# ========================================
# Agent Configuration
# ========================================
[AGENT]
# Agent-specific parameters
agent_start_x = 10.0f                  # Initial agent X position
agent_start_y = 10.0f                  # Initial agent Y position
agent_start_energy = 80.0f             # Initial agent energy
agent_start_health = 100.0f            # Initial agent health
agent_max_speed = 3.0f                 # Maximum movement speed
agent_turn_speed = 2.0f                # Turning speed
agent_sensing_range = 8.0f             # Sensing range for environment
agent_interaction_range = 1.0f         # Interaction range for objects

# ========================================
# Performance Configuration
# ========================================
[PERFORMANCE]
# Performance tuning parameters
enable_profiling = true                # Enable performance profiling
profiler_output = profile_report.json # Profile output file
memory_pool_size = 1048576            # Memory pool size (bytes)
event_queue_size = 10000               # Event queue size
enable_vectorization = true            # Enable SIMD vectorization
enable_parallel_processing = true      # Enable parallel processing

# ========================================
# Experimental Configuration
# ========================================
[EXPERIMENT]
# Experimental parameters
experiment_type = phase6_integration     # Type of experiment
experiment_duration = 3600              # Experiment duration (steps)
recording_interval = 100                # Steps between recordings
enable_data_logging = true             # Enable data logging
data_output_format = csv               # Data output format (csv, json, binary)

