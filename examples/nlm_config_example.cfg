# ========================================
# Command Line Configuration
# ========================================
# This section shows how to configure NLM using command line arguments

# Basic command line usage:
# nlm --neuron_count=2000 --region_count=2 --connection_probability=0.2 --random_seed=12345
# nlm --stdp_ltp_weight=0.02 --stdp_ltd_weight=0.018 --enable_development --enable_curiosity
# nlm --checkpoint_dir=./my_checkpoints --checkpoint_interval=500

# Environment variables (alternative to command line):
# export NLM_NEURON_COUNT=1500
# export NLM_REGION_COUNT=3
# export NLM_RANDOM_SEED=999

# Configuration file merging example:
# nlm --config_file=base_config.cfg --config_file=experiment_config.cfg
# Later config file options override earlier ones

